<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TST Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#07090a;color:#c8d4c8;font-family:'DM Sans',sans-serif;min-height:100vh;}

/* LOGIN */
.login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#07090a;}
.login-box{background:#0e1314;border:1px solid #1a2020;border-radius:16px;padding:48px 40px;width:360px;text-align:center;}
.login-logo{font-family:Rajdhani,sans-serif;font-size:13px;font-weight:700;letter-spacing:4px;color:#4a6a4a;text-transform:uppercase;margin-bottom:24px;}
.login-title{font-family:Rajdhani,sans-serif;font-size:32px;font-weight:700;color:#fff;margin-bottom:4px;}
.login-sub{font-size:13px;color:#3a5a3a;margin-bottom:28px;}
.login-input{width:100%;background:#07090a;border:1px solid #1a2020;border-radius:8px;padding:12px 16px;color:#e8f0e8;font-size:14px;outline:none;margin-bottom:12px;font-family:'DM Sans',sans-serif;}
.login-input:focus{border-color:#2a4a2a;}
.login-btn{width:100%;background:#22c55e;color:#000;border:none;border-radius:8px;padding:13px;font-family:Rajdhani,sans-serif;font-weight:700;font-size:15px;cursor:pointer;letter-spacing:1px;}
.login-btn:hover{background:#16a34a;}
.login-err{font-size:12px;color:#ef4444;margin-top:10px;display:none;}

/* APP */
.app{display:none;min-height:100vh;}
.app-nav{background:#0e1314;border-bottom:1px solid #1a2020;padding:0 28px;display:flex;align-items:center;gap:0;height:52px;}
.app-nav-logo{font-family:Rajdhani,sans-serif;font-size:16px;font-weight:700;letter-spacing:3px;color:#fff;margin-right:32px;}
.app-nav-logo span{color:#22c55e;}
.nav-tab{background:none;border:none;border-bottom:2px solid transparent;padding:0 16px;height:52px;color:#4a6a4a;font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s;}
.nav-tab:hover{color:#c8d4c8;}
.nav-tab.active{color:#22c55e;border-bottom-color:#22c55e;}
.nav-right{margin-left:auto;font-size:12px;color:#2a4a2a;}

.app-body{padding:28px;max-width:1200px;margin:0 auto;}

/* METRIC CARDS */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;}
.metric-card{background:#0e1314;border:1px solid #1a2020;border-radius:10px;padding:20px;}
.metric-val{font-family:Rajdhani,sans-serif;font-size:32px;font-weight:700;color:#22c55e;}
.metric-val.gold{color:#d4af37;}
.metric-val.red{color:#ef4444;}
.metric-val.blue{color:#60a5fa;}
.metric-label{font-size:11px;color:#3a5a3a;text-transform:uppercase;letter-spacing:2px;margin-top:4px;}

/* SECTION HEADERS */
.section-head{font-size:11px;font-weight:700;letter-spacing:3px;color:#2a4a2a;text-transform:uppercase;margin-bottom:14px;margin-top:28px;}

/* PANEL */
.panel{background:#0e1314;border:1px solid #1a2020;border-radius:10px;padding:20px;margin-bottom:16px;}

/* NOTIF POST */
.notif-input{width:100%;background:#07090a;border:1px solid #1a2020;border-radius:8px;padding:10px 14px;color:#e8f0e8;font-size:13px;outline:none;margin-bottom:10px;font-family:'DM Sans',sans-serif;}
.notif-input:focus{border-color:#2a4a2a;}
.btn-post{background:#22c55e;color:#000;border:none;border-radius:8px;padding:9px 20px;font-family:Rajdhani,sans-serif;font-weight:700;font-size:13px;cursor:pointer;letter-spacing:0.5px;}
.btn-post:hover{background:#16a34a;}
.post-status{font-size:12px;color:#3a5a3a;margin-left:12px;}

/* UPLOAD */
.upload-row{display:flex;gap:10px;margin-bottom:10px;}
.upload-select{flex:1;background:#07090a;border:1px solid #1a2020;border-radius:8px;padding:9px 14px;color:#e8f0e8;font-size:13px;outline:none;font-family:'DM Sans',sans-serif;}
.upload-num{width:64px;background:#07090a;border:1px solid #1a2020;border-radius:8px;padding:9px;color:#e8f0e8;font-size:13px;outline:none;text-align:center;}
.dropzone{border:1.5px dashed #1a2020;border-radius:8px;padding:24px;text-align:center;cursor:pointer;color:#3a5a3a;font-size:13px;transition:border-color 0.2s;}
.dropzone:hover,.dropzone.drag{border-color:#22c55e;color:#4ab44a;}
.upload-status{font-size:12px;color:#3a5a3a;margin-top:8px;}

/* TABLE */
.tbl-wrap{background:#0e1314;border:1px solid #1a2020;border-radius:10px;overflow:hidden;}
table{width:100%;border-collapse:collapse;}
th{background:#080b0b;font-size:10px;font-weight:700;letter-spacing:2px;color:#2a5a2a;text-transform:uppercase;padding:10px 14px;text-align:left;border-bottom:1px solid #1a2020;}
td{padding:10px 14px;border-bottom:1px solid #080b0b;font-size:12px;color:#8aad8a;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(34,197,94,0.02);}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;}
.badge-10k{background:rgba(212,175,55,0.12);color:#d4af37;}
.badge-base{background:rgba(34,197,94,0.08);color:#4ab44a;}

/* 10K CARDS */
.tenk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
.tenk-card{background:#0e1314;border:1px solid rgba(212,175,55,0.15);border-radius:10px;padding:16px;}
.tenk-email{font-size:13px;font-weight:600;color:#e8f0e8;margin-bottom:10px;word-break:break-all;}
.tenk-stats{display:flex;gap:8px;margin-bottom:8px;}
.tenk-stat{background:#07090a;border-radius:6px;padding:8px;text-align:center;flex:1;}
.tenk-stat-val{font-family:Rajdhani,sans-serif;font-size:20px;font-weight:700;}
.tenk-stat-label{font-size:9px;color:#2a4a2a;text-transform:uppercase;letter-spacing:1px;}
.tenk-weak{font-size:11px;color:#3a5a3a;}

/* NOTIF HISTORY */
.notif-hist-item{padding:10px 0;border-bottom:1px solid #0d1212;font-size:12px;color:#4a6a4a;}
.notif-hist-item:last-child{border-bottom:none;}
.notif-hist-title{color:#8aad8a;margin-bottom:2px;}

/* SEARCH */
.search-bar{background:#07090a;border:1px solid #1a2020;border-radius:8px;padding:8px 14px;color:#e8f0e8;font-size:13px;outline:none;width:240px;font-family:'DM Sans',sans-serif;margin-bottom:14px;}
.search-bar:focus{border-color:#2a4a2a;}

/* LOADING */
.loading{text-align:center;padding:48px;color:#2a4a2a;font-size:13px;}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="login-logo">Top Stock Trading</div>
    <div class="login-title">Admin Panel</div>
    <div class="login-sub">h@topstocktrading.com only</div>
    <input class="login-input" type="email" id="loginEmail" placeholder="Email" value="h@topstocktrading.com">
    <input class="login-input" type="password" id="loginPass" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">Access Admin</button>
    <div class="login-err" id="loginErr">Incorrect credentials or not an admin account.</div>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">
  <nav class="app-nav">
    <div class="app-nav-logo">TST <span>ADMIN</span></div>
    <button class="nav-tab active" onclick="showTab('overview',this)">Overview</button>
    <button class="nav-tab" onclick="showTab('students',this)">Students</button>
    <button class="nav-tab" onclick="showTab('tenk',this)">10K Members</button>
    <button class="nav-tab" onclick="showTab('messages',this)">Messages</button>
    <button class="nav-tab" onclick="showTab('notify',this)">Notifications</button>
    <button class="nav-tab" onclick="showTab('upload',this)">Upload Images</button>
    <div class="nav-right" style="display:flex;align-items:center;gap:14px;">
      <span id="adminEmail" style="font-size:12px;color:#2a4a2a;"></span>
      <button onclick="doLogout()" style="background:none;border:1px solid #1a2020;color:#3a5a3a;font-size:12px;padding:5px 12px;border-radius:6px;cursor:pointer;font-family:DM Sans,sans-serif;">Log Out</button>
    </div>
  
    <button onclick="openIpPanel()" style="background:#1a3a1a;border:1px solid #2a4a2a;color:#4ab44a;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:bold;">&#128272; IP Management</button>
</nav>
  <div class="app-body" id="appBody">
    <div class="loading">Loading...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://jjecwvcxbocogvwsjwmr.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpqZWN3dmN4Ym9jb2d2d3Nqd21yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0MzMxMjcsImV4cCI6MjA5NDAwOTEyN30.Eb2DuAqv1D9d4IoWpyXLSGZGUS4QLS116xEYUgDyYNY';
const ADMIN_EMAIL = 'h@topstocktrading.com';

let sb, currentTab = 'overview';
let _uploadNums = {};
let allStudents = [], allMessages = [], allNotifs = [], allProgress = [], allQuizAnswers = [];

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass  = document.getElementById('loginPass').value;
  const err   = document.getElementById('loginErr');
  err.style.display = 'none';

  if (email !== ADMIN_EMAIL) { err.style.display = 'block'; return; }

  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error || !data.user) { err.style.display = 'block'; return; }

  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('adminEmail').textContent = email;
  await loadAll();
  showTab('overview', document.querySelector('.nav-tab.active'));
}

async function loadAll() {
  const [usersR, quizR, msgR, tiersR, notifR, progressR, quizAnswersR] = await Promise.all([
    sb.from('users').select('*').order('created_at', {ascending:false}),
    sb.from('quiz_results').select('*'),
    sb.from('messages').select('*').order('created_at', {ascending:false}),
    sb.from('user_tiers').select('*'),
    sb.from('notifications').select('*').order('created_at', {ascending:false}).limit(30),
    sb.from('user_progress').select('*').eq('completed', true),
    sb.from('user_quiz_answers').select('*'),
  ]);

  const users       = usersR.data       || [];
  const quizzes     = quizR.data        || [];
  const msgs        = msgR.data         || [];
  const tiers       = tiersR.data       || [];
  allNotifs         = notifR.data       || [];
  allMessages       = msgs;
  allProgress       = progressR.data    || [];
  allQuizAnswers    = quizAnswersR.data || [];

  allStudents = users.map(u => {
    const uq = quizzes.filter(q => q.user_id === u.id);
    const um = msgs.filter(m => m.user_id === u.id);
    const td = tiers.find(t => t.user_id === u.id);
    const tier = (td && td.tier) || u.tier || 'base';
    const avg = uq.length ? Math.round(uq.reduce((s,q)=>s+q.score,0)/uq.length) : null;
    const retakes = uq.reduce((s,q)=>s+(q.attempts>1?q.attempts-1:0),0);
    const worst = uq.length ? [...uq].sort((a,b)=>a.score-b.score)[0] : null;
    const unread = um.filter(m=>!m.read && m.sender==='member').length;
    const up = allProgress.filter(p => p.user_id === u.id);
    const lessonsCompleted = up.length;
    return {id:u.id, email:u.email||'Unknown', tier, quizzes:uq, messages:um, progress:up, avg, retakes, worst, unread, joined:u.created_at, lessonsCompleted};
  });
}

function showTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  const body = document.getElementById('appBody');

  if (tab === 'overview')   renderOverview(body);
  if (tab === 'students')   renderStudents(body);
  if (tab === 'tenk')       renderTenk(body);
  if (tab === 'messages')   renderMessages(body);
  if (tab === 'notify')     renderNotify(body);
  if (tab === 'upload')     renderUpload(body);
}

// ── OVERVIEW ────────────────────────────────────────────────────────────
function renderOverview(body) {
  const total    = allStudents.length;
  const tenk     = allStudents.filter(s=>s.tier==='10k').length;
  const struggle = allStudents.filter(s=>s.avg!==null&&s.avg<70).length;
  const unread   = allStudents.reduce((n,s)=>n+s.unread,0);

  let h = '<div class="metrics">';
  h += metric('Course Members', total, '');
  h += metric('10K Members', tenk, 'gold');
  h += metric('Struggling (<70%)', struggle, 'red');
  h += metric('Unread Messages', unread, 'blue');
  h += '</div>';

  h += '<div class="section-head">Recent Notifications</div>';
  h += '<div class="panel">';
  if (!allNotifs.length) {
    h += '<div style="font-size:13px;color:#2a4a2a;">No notifications posted yet.</div>';
  } else {
    h += allNotifs.slice(0,5).map(n =>
      '<div class="notif-hist-item"><div class="notif-hist-title">' + n.title + '</div>' +
      fmtDate(n.created_at) + '</div>'
    ).join('');
  }
  h += '</div>';

  h += '<div class="section-head">Recent Student Activity</div>';
  h += '<div class="tbl-wrap"><table><thead><tr>';
  ['Email','Tier','Sections','Avg Score','Last Active'].forEach(c => h += '<th>'+c+'</th>');
  h += '</tr></thead><tbody>';
  allStudents.slice(0,10).forEach(s => {
    h += '<tr>';
    h += '<td style="color:#c8d4c8;">'+s.email+'</td>';
    h += '<td>'+tierBadge(s.tier)+'</td>';
    h += '<td>'+s.quizzes.length+'</td>';
    h += '<td>'+scoreSpan(s.avg)+'</td>';
    h += '<td>'+fmtDate(s.joined)+'</td>';
    h += '</tr>';
  });
  h += '</tbody></table></div>';

  body.innerHTML = h;
}

// ── STUDENTS ────────────────────────────────────────────────────────────
function renderStudents(body) {
  let h = '<input class="search-bar" id="stuSearch" placeholder="Search by email..." oninput="filterStudents(this.value)">';
  h += '<div id="stuTable">' + buildStudentTable(allStudents) + '</div>';
  body.innerHTML = h;
}

function buildStudentTable(students) {
  if (!students.length) return '<div style="color:#2a4a2a;font-size:13px;padding:20px;">No students found.</div>';
  let h = '<div class="tbl-wrap"><table><thead><tr>';
  ['Email','Tier','Lessons Done','Quizzes','Avg Score','Retakes','Unread Msgs'].forEach(c => h += '<th>'+c+'</th>');
  h += '</tr></thead><tbody>';
  students.forEach(s => {
    h += '<tr style="cursor:pointer;" onclick="viewStudentDetail(\''+s.id+'\')">';
    h += '<td style="color:#c8d4c8;">'+s.email+'</td>';
    h += '<td>'+tierBadge(s.tier)+'</td>';
    h += '<td>'+s.quizzes.length+'</td>';
    h += '<td>'+scoreSpan(s.avg)+'</td>';
    h += '<td>'+(s.retakes>0?'<span style="color:#fbbf24;font-weight:700;">'+s.retakes+'</span>':'<span style="color:#2a4a2a;">0</span>')+'</td>';
    h += '<td>'+(s.worst?'<span style="color:'+(s.worst.score<70?'#ef4444':'#fbbf24')+';">'+s.worst.section+' ('+s.worst.score+'%)</span>':'—')+'</td>';
    h += '<td>'+(s.unread>0?'<span style="color:#ef4444;font-weight:700;">'+s.unread+' unread</span>':'<span style="color:#2a4a2a;">—</span>')+'</td>';
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  return h;
}

function viewStudentDetail(userId) {
  const s = allStudents.find(x => x.id === userId);
  if (!s) return;
  const prog = allProgress.filter(p => p.user_id === userId);
  const qa = allQuizAnswers.filter(a => a.user_id === userId);
  const body = document.getElementById('appBody');
  const completedCount = prog.filter(p => p.completed).length;
  const totalTime = prog.reduce((t,p) => t+(p.time_spent_seconds||0), 0);
  const avgTime = prog.length ? Math.round(totalTime/prog.length) : 0;
  const wrongAnswers = qa.filter(a => !a.is_correct);
  const correctPct = qa.length ? Math.round((qa.filter(a=>a.is_correct).length/qa.length)*100) : null;
  const wrongByQ = {};
  wrongAnswers.forEach(a => {
    const key = a.section_id+'::'+a.question_text;
    if (!wrongByQ[key]) wrongByQ[key] = {section:a.section_id,question:a.question_text,correct:a.correct_answer,misses:0};
    wrongByQ[key].misses++;
  });
  const topWrong = Object.values(wrongByQ).sort((a,b)=>b.misses-a.misses).slice(0,10);
  const lessonTimes = prog.filter(p=>p.time_spent_seconds>0).sort((a,b)=>b.time_spent_seconds-a.time_spent_seconds).slice(0,10);
  let h = '<button onclick="showTab(\'students\')" style="background:none;border:1px solid #1a2020;border-radius:6px;padding:6px 14px;color:#c8d4c8;cursor:pointer;font-size:12px;margin-bottom:20px;">← Back to Students</button>';
  h += '<div style="font-family:Rajdhani,sans-serif;font-size:24px;font-weight:700;color:#fff;margin-bottom:4px;">'+s.email+'</div>';
  h += '<div style="font-size:12px;color:#3a5a3a;margin-bottom:24px;">'+tierBadge(s.tier)+' &nbsp; Joined: '+fmtDate(s.joined)+'</div>';
  h += '<div class="admin-stats-row" style="grid-template-columns:repeat(4,1fr);margin-bottom:24px;">';
  h += '<div class="admin-stat"><div class="admin-stat-label">Lessons Done</div><div class="admin-stat-num">'+completedCount+'</div></div>';
  h += '<div class="admin-stat"><div class="admin-stat-label">Quiz Accuracy</div><div class="admin-stat-num" style="color:'+(correctPct===null?'#2a4a2a':correctPct>=75?'#22c55e':correctPct>=60?'#fbbf24':'#ef4444')+';">'+(correctPct!==null?correctPct+'%':'—')+'</div></div>';
  h += '<div class="admin-stat"><div class="admin-stat-label">Avg Time/Lesson</div><div class="admin-stat-num">'+Math.floor(avgTime/60)+'m '+(avgTime%60)+'s</div></div>';
  h += '<div class="admin-stat"><div class="admin-stat-label">Quiz Retakes</div><div class="admin-stat-num">'+s.retakes+'</div></div>';
  h += '</div>';
  h += '<div class="section-head">Most Missed Questions</div>';
  if (!topWrong.length) { h += '<div style="color:#2a4a2a;font-size:13px;padding:12px 0;">No wrong answers recorded yet.</div>'; }
  else {
    h += '<div class="tbl-wrap"><table><thead><tr><th>Section</th><th>Question</th><th>Correct Answer</th><th>Times Missed</th></tr></thead><tbody>';
    topWrong.forEach(w => {
      h += '<tr><td style="color:#fbbf24;font-size:11px;">'+w.section+'</td><td style="color:#c8d4c8;font-size:12px;max-width:300px;">'+w.question+'</td><td style="color:#22c55e;font-size:12px;">'+w.correct+'</td><td style="text-align:center;color:#ef4444;font-weight:700;">'+w.misses+'x</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '<div class="section-head" style="margin-top:28px;">Most Time Spent (Top Lessons)</div>';
  if (!lessonTimes.length) { h += '<div style="color:#2a4a2a;font-size:13px;padding:12px 0;">No time data yet.</div>'; }
  else {
    h += '<div class="tbl-wrap"><table><thead><tr><th>Lesson</th><th>Time Spent</th><th>Visits</th></tr></thead><tbody>';
    lessonTimes.forEach(p => {
      const mins=Math.floor(p.time_spent_seconds/60),secs=p.time_spent_seconds%60;
      h += '<tr><td style="color:#c8d4c8;font-family:monospace;font-size:12px;">'+p.lesson_id+'</td><td style="color:#60a5fa;">'+mins+'m '+secs+'s</td><td style="color:#3a5a3a;">'+p.visit_count+'x</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '<div class="section-head" style="margin-top:28px;">Full Quiz Answer History</div>';
  if (!qa.length) { h += '<div style="color:#2a4a2a;font-size:13px;padding:12px 0;">No quiz answers recorded yet.</div>'; }
  else {
    h += '<div class="tbl-wrap"><table><thead><tr><th>Section</th><th>Question</th><th>Their Answer</th><th>Correct Answer</th><th>Result</th></tr></thead><tbody>';
    qa.slice().reverse().forEach(a => {
      h += '<tr><td style="color:#fbbf24;font-size:11px;">'+a.section_id+'</td><td style="color:#c8d4c8;font-size:12px;max-width:240px;">'+a.question_text+'</td><td style="color:'+(a.is_correct?'#c8d4c8':'#ef4444')+';font-size:12px;">'+a.selected_answer+'</td><td style="color:#22c55e;font-size:12px;">'+a.correct_answer+'</td><td style="text-align:center;">'+(a.is_correct?'<span style="color:#22c55e;font-weight:700;">✓</span>':'<span style="color:#ef4444;font-weight:700;">✗</span>')+'</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  body.innerHTML = h;
}

function renderCourseData(body) {
  const totalStudents = allStudents.length;
  const lessonCounts = {};
  allProgress.forEach(p => { if (p.completed) lessonCounts[p.lesson_id]=(lessonCounts[p.lesson_id]||0)+1; });
  const lessonRates = Object.entries(lessonCounts).map(([id,count])=>({id,count,pct:totalStudents?Math.round(count/totalStudents*100):0})).sort((a,b)=>a.pct-b.pct);
  const hardestLessons = lessonRates.slice(0,10);
  const globalWrong = {};
  allQuizAnswers.filter(a=>!a.is_correct).forEach(a => {
    const key=a.section_id+'::'+a.question_text;
    if(!globalWrong[key]) globalWrong[key]={section:a.section_id,question:a.question_text,correct:a.correct_answer,misses:0,total:0};
    globalWrong[key].misses++;
  });
  allQuizAnswers.forEach(a => { const key=a.section_id+'::'+a.question_text; if(globalWrong[key]) globalWrong[key].total++; });
  const topMissed = Object.values(globalWrong).map(w=>({...w,missRate:w.total?Math.round(w.misses/w.total*100):0})).sort((a,b)=>b.missRate-a.missRate).slice(0,15);
  const sectionScores = {};
  allStudents.forEach(s => { s.quizzes.forEach(q => { if(!sectionScores[q.section]) sectionScores[q.section]=[]; sectionScores[q.section].push(q.score); }); });
  const sectionAvgs = Object.entries(sectionScores).map(([sec,scores])=>({sec,avg:Math.round(scores.reduce((a,b)=>a+b,0)/scores.length),count:scores.length})).sort((a,b)=>a.avg-b.avg);
  const totalAnswers = allQuizAnswers.length;
  const globalAcc = totalAnswers ? Math.round(allQuizAnswers.filter(a=>a.is_correct).length/totalAnswers*100) : null;
  const avgCompletion = totalStudents && allProgress.length ? Math.round(Object.values(lessonCounts).reduce((a,b)=>a+b,0)/totalStudents) : 0;
  let h = '<div style="font-family:Rajdhani,sans-serif;font-size:24px;font-weight:700;color:#fff;margin-bottom:4px;">Course Analytics</div>';
  h += '<div style="font-size:12px;color:#3a5a3a;margin-bottom:28px;">Master dataset — '+totalStudents+' students</div>';
  h += '<div class="admin-stats-row" style="grid-template-columns:repeat(4,1fr);margin-bottom:28px;">';
  h += '<div class="admin-stat"><div class="admin-stat-label">Total Students</div><div class="admin-stat-num">'+totalStudents+'</div></div>';
  h += '<div class="admin-stat"><div class="admin-stat-label">Global Quiz Accuracy</div><div class="admin-stat-num" style="color:'+(globalAcc>=75?'#22c55e':globalAcc>=60?'#fbbf24':'#ef4444')+'">'+(globalAcc!==null?globalAcc+'%':'—')+'</div></div>';
  h += '<div class="admin-stat"><div class="admin-stat-label">Avg Lessons Done</div><div class="admin-stat-num">'+avgCompletion+'</div></div>';
  h += '<div class="admin-stat"><div class="admin-stat-label">Total Quiz Answers</div><div class="admin-stat-num">'+totalAnswers+'</div></div>';
  h += '</div>';
  h += '<div class="section-head">Most Missed Questions — All Students</div>';
  if (!topMissed.length) { h += '<div style="color:#2a4a2a;font-size:13px;padding:12px 0;">No data yet.</div>'; }
  else {
    h += '<div class="tbl-wrap"><table><thead><tr><th>Section</th><th>Question</th><th>Correct Answer</th><th>Miss Rate</th><th>Attempts</th></tr></thead><tbody>';
    topMissed.forEach(w => {
      const color=w.missRate>=60?'#ef4444':w.missRate>=40?'#fbbf24':'#22c55e';
      h += '<tr><td style="color:#fbbf24;font-size:11px;">'+w.section+'</td><td style="color:#c8d4c8;font-size:12px;max-width:280px;">'+w.question+'</td><td style="color:#22c55e;font-size:12px;">'+w.correct+'</td><td style="color:'+color+';font-weight:700;">'+w.missRate+'%</td><td style="color:#3a5a3a;text-align:center;">'+w.total+'</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '<div class="section-head" style="margin-top:28px;">Section Quiz Performance — Lowest to Highest</div>';
  if (!sectionAvgs.length) { h += '<div style="color:#2a4a2a;font-size:13px;padding:12px 0;">No quiz data yet.</div>'; }
  else {
    h += '<div class="tbl-wrap"><table><thead><tr><th>Section</th><th>Avg Score</th><th>Attempts</th><th>Grade</th></tr></thead><tbody>';
    sectionAvgs.forEach(s => {
      const color=s.avg>=75?'#22c55e':s.avg>=60?'#fbbf24':'#ef4444';
      const grade=s.avg>=90?'A':s.avg>=80?'B':s.avg>=70?'C':s.avg>=60?'D':'F';
      h += '<tr><td style="color:#c8d4c8;font-family:monospace;font-size:12px;">'+s.sec+'</td><td style="color:'+color+';font-weight:700;">'+s.avg+'%</td><td style="color:#3a5a3a;">'+s.count+'</td><td style="color:'+color+';font-weight:700;font-size:16px;">'+grade+'</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '<div class="section-head" style="margin-top:28px;">Hardest Lessons — Lowest Completion</div>';
  if (!hardestLessons.length) { h += '<div style="color:#2a4a2a;font-size:13px;padding:12px 0;">No completion data yet.</div>'; }
  else {
    h += '<div class="tbl-wrap"><table><thead><tr><th>Lesson ID</th><th>Completions</th><th>% of Students</th></tr></thead><tbody>';
    hardestLessons.forEach(l => {
      const color=l.pct>=70?'#22c55e':l.pct>=40?'#fbbf24':'#ef4444';
      h += '<tr><td style="color:#c8d4c8;font-family:monospace;font-size:12px;">'+l.id+'</td><td style="color:#3a5a3a;">'+l.count+' / '+totalStudents+'</td><td style="color:'+color+';font-weight:700;">'+l.pct+'%</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  body.innerHTML = h;
}

// ── MESSAGES ────────────────────────────────────────────────────────────
function renderMessages(body, filterUserId) {
  const memberMsgs = allMessages.filter(m=>m.sender==='member');
  const byUser = {};
  memberMsgs.forEach(m => { if(!byUser[m.user_id]) byUser[m.user_id]=[]; byUser[m.user_id].push(m); });

  let h = '<div class="section-head">Student Messages</div>';

  const userIds = filterUserId ? [filterUserId] : Object.keys(byUser);

  if (!userIds.length) {
    h += '<div style="color:#2a4a2a;font-size:13px;">No messages yet.</div>';
    body.innerHTML = h;
    return;
  }

  userIds.forEach(uid => {
    const student = allStudents.find(s=>s.id===uid);
    const email = student ? student.email : uid.substring(0,8)+'...';
    const msgs = byUser[uid] || [];
    const allThread = allMessages.filter(m=>m.user_id===uid).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));

    h += '<div class="panel" style="margin-bottom:14px;">';
    h += '<div style="font-size:13px;font-weight:700;color:#c8d4c8;margin-bottom:12px;">'+email+'</div>';
    h += '<div id="thread-'+uid+'" style="max-height:220px;overflow-y:auto;margin-bottom:12px;display:flex;flex-direction:column;">';
    const threadId = 'thread-'+uid;
    allThread.forEach(m => {
      const isMe = m.sender === 'tst';
      h += '<div style="display:flex;justify-content:'+(isMe?'flex-end':'flex-start')+';margin-bottom:8px;">';
      h += '<div style="background:'+(isMe?'#163016':'#0e1314')+';border:1px solid '+(isMe?'#1a4a1a':'#1a2020')+';border-radius:8px;padding:8px 12px;max-width:80%;font-size:12px;color:'+(isMe?'#4ab44a':'#8aad8a')+';line-height:1.5;">';
      h += m.content;
      h += '<div style="font-size:10px;color:#2a4a2a;margin-top:4px;">'+fmtDate(m.created_at)+'</div>';
      h += '</div></div>';
    });
    h += '</div>';
    h += '<div style="display:flex;gap:8px;">';
    h += '<input id="reply-'+uid+'" placeholder="Reply..." style="flex:1;background:#07090a;border:1px solid #1a2020;border-radius:8px;padding:8px 12px;color:#e8f0e8;font-size:12px;outline:none;font-family:DM Sans,sans-serif;">';
    h += '<button onclick="sendReply(\''+uid+'\')" style="background:#22c55e;color:#000;border:none;border-radius:8px;padding:8px 16px;font-family:Rajdhani,sans-serif;font-weight:700;font-size:12px;cursor:pointer;">Send</button>';
    h += '</div>';
    h += '</div>';
  });

  body.innerHTML = h;
}

function viewStudentMsgs(uid) {
  document.querySelectorAll('.nav-tab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.nav-tab')[3].classList.add('active');
  currentTab = 'messages';
  renderMessages(document.getElementById('appBody'), uid);
}

async function sendReply(userId) {
  const input = document.getElementById('reply-'+userId);
  const content = input ? input.value.trim() : '';
  if (!content) return;
  try {
    await sb.from('messages').insert({user_id:userId, sender:'tst', content});
    await sb.from('messages').update({read:true}).eq('user_id',userId).eq('sender','member');
    input.value = '';
    await loadAll();
    renderMessages(document.getElementById('appBody'));
  } catch(e) { alert('Error: '+e.message); }
}

function renderNotify(body) {
  let h = '<div class="section-head">Post Notification</div>';
  h += '<div class="panel">';
  h += '<input class="notif-input" id="notifTitle" placeholder="e.g. New live trade added — NVDA breakout breakdown">';
  h += '<div style="display:flex;align-items:center;">';
  h += '<button class="btn-post" onclick="postNotif()">Post to All Students</button>';
  h += '<span class="post-status" id="postStatus"></span>';
  h += '</div>';
  h += '</div>';

  h += '<div class="section-head">Notification History</div>';
  h += '<div class="panel">';
  if (!allNotifs.length) {
    h += '<div style="font-size:13px;color:#2a4a2a;">No notifications yet.</div>';
  } else {
    h += allNotifs.map(n =>
      '<div class="notif-hist-item"><div class="notif-hist-title">'+n.title+'</div>'+fmtDate(n.created_at)+'</div>'
    ).join('');
  }
  h += '</div>';
  body.innerHTML = h;
}

async function postNotif() {
  const title = (document.getElementById('notifTitle')||{}).value||'';
  const status = document.getElementById('postStatus');
  if (!title.trim()) { if(status) status.textContent='Enter a title first.'; return; }
  try {
    await sb.from('notifications').insert({title:title.trim(), created_at:new Date().toISOString()});
    if(status){ status.style.color='#22c55e'; status.textContent='✓ Posted'; }
    document.getElementById('notifTitle').value='';
    await loadAll();
    setTimeout(()=>{ if(status) status.textContent=''; },3000);
  } catch(e) {
    if(status){ status.style.color='#ef4444'; status.textContent='Error: '+e.message; }
  }
}

async function admLessonChange(val) {
  var el = document.getElementById('upNum');
  var statusEl = document.getElementById('upStatus');
  if (!el) return;
  if (_uploadNums[val]) { el.value = _uploadNums[val]; return; }
  try {
    if (statusEl) { statusEl.style.color='#4ab44a'; statusEl.textContent='Checking existing images...'; }
    // List files in storage bucket with this lesson prefix
    var { data, error } = await sb.storage.from('lesson-charts').list('', { search: val + '-' });
    var nextNum = 1;
    if (!error && data && data.length > 0) {
      // Filter to only image files for this exact lesson (not captions .txt)
      var imgs = data.filter(function(f) {
        return f.name.startsWith(val + '-') && !f.name.endsWith('.txt');
      });
      nextNum = imgs.length + 1;
    }
    _uploadNums[val] = nextNum;
    el.value = nextNum;
    if (statusEl) {
      statusEl.textContent = nextNum > 1
        ? (nextNum - 1) + ' image(s) already uploaded — next will be #' + nextNum
        : 'No images yet — starting from #1';
    }
  } catch(e) {
    el.value = _uploadNums[val] || 1;
    if (statusEl) statusEl.textContent = '';
  }
}
function renderUpload(body) {
  let h = '<div class="section-head">Upload Lesson Image</div>';
  h += '<div class="panel">';
  h += '<div style="font-size:12px;color:#3a5a3a;margin-bottom:14px;">Images are named automatically: <code style="color:#4ab44a;">lessonID-N.jpg</code>. Pick the lesson, set the image number, then drop.</div>';
  h += '<div class="upload-row">';
  h += '<select class="upload-select" id="upLesson" onchange="admLessonChange(this.value)">';
  h += LESSON_IDS.map(l=>'<option value="'+l.id+'">'+l.name+'</option>').join('');
  h += '</select>';
  h += '<input class="upload-num" type="number" id="upNum" value="1" min="1" max="99">';
  h += '</div>';
  h += '<div class="dropzone" id="dropzone" onclick="document.getElementById(\'upFile\').click()">Drop image here or click to browse</div>';
  h += '<input type="file" id="upFile" accept="image/*" style="display:none;" onchange="uploadImg(this)">';
  h += '<div class="upload-status" id="upStatus"></div>';
  h += '</div>';

  h += '<div class="section-head">Upload Caption (optional)</div>';
  h += '<div class="panel">';
  h += '<div style="font-size:12px;color:#3a5a3a;margin-bottom:10px;">Add a text caption that appears below the image in the lesson. Saves as <code style="color:#4ab44a;">lessonID-N.txt</code></div>';
  h += '<textarea id="upCaption" placeholder="e.g. This is a textbook bull flag on the 5-minute chart. Notice the tight consolidation on declining volume before the breakout..." style="width:100%;background:#07090a;border:1px solid #1a2020;border-radius:8px;padding:10px 14px;color:#e8f0e8;font-size:13px;outline:none;resize:vertical;min-height:80px;font-family:DM Sans,sans-serif;margin-bottom:10px;"></textarea>';
  h += '<button class="btn-post" onclick="uploadCaption()">Save Caption</button>';
  h += '<span class="post-status" id="captionStatus"></span>';
  h += '</div>';

  body.innerHTML = h;

  const dz = document.getElementById('dropzone');
  dz.addEventListener('dragover', e=>{ e.preventDefault(); dz.classList.add('drag'); });
  dz.addEventListener('dragleave', ()=>dz.classList.remove('drag'));
  dz.addEventListener('drop', e=>{ e.preventDefault(); dz.classList.remove('drag'); const f=e.dataTransfer.files[0]; if(f) doUpload(f); });
}

function uploadImg(input) { if(input.files[0]) doUpload(input.files[0]); }

async function doUpload(file) {
  const lessonId = document.getElementById('upLesson').value;
  const num      = document.getElementById('upNum').value || '1';
  const status   = document.getElementById('upStatus');
  const ext      = file.name.split('.').pop().toLowerCase();
  const filename = lessonId + '-' + num + '.' + ext;
  status.style.color='#fbbf24'; status.textContent='Uploading '+filename+'...';
  try {
    const {error} = await sb.storage.from('lesson-charts').upload(filename, file, {upsert:true});
    if(error) throw error;
    status.style.color='#22c55e'; status.textContent='✓ Uploaded: '+filename;
    // Reset file input so same file can be uploaded again
    var fi = document.getElementById('upFile'); if(fi) fi.value='';
    // Auto-increment — store in _uploadNums so it survives re-renders
    var numEl = document.getElementById('upNum');
    var lessonEl = document.getElementById('upLesson');
    if (numEl && lessonEl) {
      var nextNum = parseInt(numEl.value) + 1;
      _uploadNums[lessonEl.value] = nextNum;
      numEl.value = nextNum;
      status.textContent += ' — next will be #' + nextNum;
    }
  } catch(e) { status.style.color='#ef4444'; status.textContent='Error: '+e.message; }
}

async function uploadCaption() {
  const lessonId = document.getElementById('upLesson').value;
  const num      = document.getElementById('upNum').value || '1';
  const text     = (document.getElementById('upCaption')||{}).value||'';
  const status   = document.getElementById('captionStatus');
  if (!text.trim()) { status.textContent='Enter a caption first.'; return; }
  const filename = lessonId+'-'+num+'.txt';
  status.style.color='#fbbf24'; status.textContent='Saving...';
  try {
    const blob = new Blob([text], {type:'text/plain'});
    const {error} = await sb.storage.from('lesson-charts').upload(filename, blob, {upsert:true, contentType:'text/plain'});
    if(error) throw error;
    status.style.color='#22c55e'; status.textContent='✓ Saved: '+filename;
  } catch(e) { status.style.color='#ef4444'; status.textContent='Error: '+e.message; }
}

function metric(label, val, cls) {
  return '<div class="metric-card"><div class="metric-val '+cls+'">'+val+'</div><div class="metric-label">'+label+'</div></div>';
}
function tenkStat(val, label, color) {
  return '<div class="tenk-stat"><div class="tenk-stat-val" style="color:'+color+';">'+val+'</div><div class="tenk-stat-label">'+label+'</div></div>';
}
function tierBadge(tier) {
  return tier==='10k'
    ? '<span class="badge badge-10k">⭐ 10K</span>'
    : '<span class="badge badge-base">Base</span>';
}
function scoreSpan(avg) {
  if(avg===null) return '<span style="color:#2a4a2a;">—</span>';
  const c = avg>=85?'#22c55e':avg>=70?'#fbbf24':'#ef4444';
  return '<span style="font-weight:700;color:'+c+';">'+avg+'%</span>';
}
function fmtDate(d) {
  if(!d) return '—';
  return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}

<!-- IP Management Panel -->
<div id="ip-panel" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:9999;display:none;align-items:center;justify-content:center;">

    <div style="font-size:11px;color:#5a7a5a;margin-bottom:20px;">Look up a member and reset their registered devices.</div>
    <div style="margin-bottom:12px;">
      <input id="ip-search-email" type="email" placeholder="Member email address..." 
        style="width:100%;padding:10px 12px;background:#0d1a0d;border:1px solid #2a4a2a;border-radius:6px;color:#e8f0e8;font-size:13px;box-sizing:border-box;">
    </div>
    <button onclick="ipLookup()" style="background:#4ab44a;color:#0d1a0d;font-weight:bold;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-size:13px;width:100%;margin-bottom:16px;">Look Up Member</button>
    <div id="ip-result" style="display:none;background:#0d1a0d;border:1px solid #1a3a1a;border-radius:8px;padding:16px;margin-bottom:16px;">
      <div style="font-size:11px;color:#5a7a5a;margin-bottom:8px;">REGISTERED DEVICES</div>
      <div id="ip-list" style="margin-bottom:12px;"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button onclick="ipClearOne()" id="ip-clear-one-btn" style="background:#d44444;color:#fff;border:none;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:12px;">Clear Device 1</button>
        <button onclick="ipClearAll()" style="background:#9a2020;color:#fff;border:none;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:12px;">Clear All Devices</button>
        <button onclick="ipUnblock()" id="ip-unblock-btn" style="display:none;background:#e8a020;color:#fff;border:none;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:12px;">Unblock Account</button>
      </div>
      <div id="ip-action-msg" style="margin-top:10px;font-size:11px;color:#4ab44a;display:none;"></div>
    </div>
    <button onclick="document.getElementById('ip-panel').style.display='none'" 
      style="background:transparent;border:1px solid #2a4a2a;color:#5a7a5a;padding:8px 20px;border-radius:6px;cursor:pointer;font-size:12px;width:100%;">Close</button>
  </div>
</div>

<script>
var _ipCurrentUserId = null;
var _ipCurrentIps = [];

function openIpPanel() {
  var p = document.getElementById('ip-panel');
  p.style.display = 'flex';
  document.getElementById('ip-result').style.display = 'none';
  document.getElementById('ip-search-email').value = '';
  document.getElementById('ip-action-msg').style.display = 'none';
}

async function ipLookup() {
  var email = document.getElementById('ip-search-email').value.trim();
  if (!email) return;
  var sb = window.getSupabaseClient ? window.getSupabaseClient() : null;
  if (!sb) { alert('Supabase not loaded'); return; }
  var { data, error } = await sb.from('users').select('id, full_name, allowed_ips, ip_blocked').eq('email', email).single();
  if (error || !data) { alert('Member not found: ' + email); return; }
  _ipCurrentUserId = data.id;
  _ipCurrentIps = data.allowed_ips || [];
  var listEl = document.getElementById('ip-list');
  var blocked = data.ip_blocked === true;
  listEl.innerHTML = '';
  if (_ipCurrentIps.length === 0) {
    listEl.innerHTML = '<div style="color:#5a7a5a;font-size:12px;">No devices registered yet.</div>';
  } else {
    _ipCurrentIps.forEach(function(ip, i) {
      listEl.innerHTML += '<div style="color:#e8f0e8;font-size:12px;padding:4px 0;border-bottom:1px solid #1a3a1a;">Device ' + (i+1) + ': <span style="color:#4ab44a;">' + ip + '</span></div>';
    });
  }
  if (blocked) {
    listEl.innerHTML += '<div style="color:#d44444;font-size:11px;margin-top:8px;">&#9888; Account is manually blocked</div>';
    document.getElementById('ip-unblock-btn').style.display = 'inline-block';
  } else {
    document.getElementById('ip-unblock-btn').style.display = 'none';
  }
  document.getElementById('ip-clear-one-btn').style.display = _ipCurrentIps.length > 0 ? 'inline-block' : 'none';
  document.getElementById('ip-result').style.display = 'block';
  document.getElementById('ip-action-msg').style.display = 'none';
}

async function ipClearOne() {
  if (!_ipCurrentUserId || _ipCurrentIps.length === 0) return;
  var newIps = _ipCurrentIps.slice(1);
  var sb = window.getSupabaseClient();
  await sb.from('users').update({ allowed_ips: newIps }).eq('id', _ipCurrentUserId);
  showIpMsg('Device 1 removed. Member can now log in from a new device.');
  await ipLookup();
}

async function ipClearAll() {
  if (!_ipCurrentUserId) return;
  var sb = window.getSupabaseClient();
  await sb.from('users').update({ allowed_ips: [], ip_blocked: false }).eq('id', _ipCurrentUserId);
  showIpMsg('All devices cleared. Member can log in fresh from any 2 devices.');
  await ipLookup();
}

async function ipUnblock() {
  if (!_ipCurrentUserId) return;
  var sb = window.getSupabaseClient();
  await sb.from('users').update({ ip_blocked: false }).eq('id', _ipCurrentUserId);
  showIpMsg('Account unblocked.');
  await ipLookup();
}

function showIpMsg(msg) {
  var el = document.getElementById('ip-action-msg');
  el.textContent = msg;
  el.style.display = 'block';
}
</script>
