<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TST Flashcards — 100 Trading Terms</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0f0a;color:#c8d4c8;font-family:'DM Sans',sans-serif;min-height:100vh;padding:24px;}
.header{max-width:520px;margin:0 auto 24px;text-align:center;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;color:#fff;margin-bottom:4px;}
.logo span{color:#00d27a;}
h1{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:1px;color:#fff;margin-bottom:4px;}
.sub{font-size:13px;color:#5a7a5a;margin-bottom:16px;}
.progress-wrap{max-width:520px;margin:0 auto 8px;}
.progress-bar{height:4px;background:#1e2820;border-radius:2px;margin-bottom:6px;}
.progress-fill{height:4px;background:#00d27a;border-radius:2px;transition:width 0.3s;}
.progress-text{display:flex;justify-content:space-between;font-size:11px;color:#3a5a3a;}
.cat-filters{max-width:520px;margin:0 auto 20px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
.cat-btn{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:4px 12px;border-radius:20px;border:1px solid #1e2820;background:#0d1a0d;color:#5a7a5a;cursor:pointer;}
.cat-btn.active{background:rgba(0,210,122,0.1);color:#00d27a;border-color:rgba(0,210,122,0.3);}
.card-area{max-width:520px;margin:0 auto 20px;perspective:1000px;height:280px;cursor:pointer;}
.card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 0.45s;border-radius:16px;}
.card.flipped{transform:rotateY(180deg);}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:32px;text-align:center;}
.front{background:#0d1a0d;border:1px solid #1e3020;}
.back{background:#111a12;border:1px solid #1e3020;transform:rotateY(180deg);}
.card-num{position:absolute;top:14px;right:16px;font-size:10px;color:#2d4a2d;font-weight:700;}
.cat-badge{display:inline-block;font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:3px 10px;border-radius:10px;background:rgba(0,210,122,0.08);border:1px solid rgba(0,210,122,0.15);color:#4ab44a;margin-bottom:14px;}
.card-term{font-size:22px;font-weight:700;color:#e8f0e8;line-height:1.2;}
.back-term{font-size:14px;font-weight:700;color:#4ab44a;margin-bottom:10px;}
.card-def{font-size:13px;color:#8aad8a;line-height:1.7;}
.tap-hint{position:absolute;bottom:14px;right:16px;font-size:10px;color:#1e3020;}
.nav-btns{max-width:520px;margin:0 auto;display:flex;justify-content:center;gap:12px;}
.nav-btn{background:#0d1a0d;border:1px solid #1e2820;color:#c8d4c8;font-size:13px;font-weight:600;padding:12px 28px;border-radius:10px;cursor:pointer;}
.nav-btn:hover{border-color:#4ab44a;color:#4ab44a;}
.nav-btn.primary{background:#00d27a;color:#0a0c10;border-color:#00d27a;}
.nav-btn.primary:hover{background:#00e888;}
.tst-link{display:block;text-align:center;margin-top:20px;font-size:11px;color:#3a5a3a;}
.tst-link a{color:#4ab44a;text-decoration:none;}
</style>
</head>
<body>

<div class="header">
  <div class="logo">TOP <span>STOCK</span> TRADING</div>
  <h1>TST Flashcards</h1>
  <div class="sub">100 essential trading terms · Tap card to flip</div>
</div>

<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="fill" style="width:1%;"></div></div>
  <div class="progress-text"><span id="cardNum">Card 1 of 100</span><span id="catLabel" style="color:#4ab44a;"></span></div>
</div>

<div class="cat-filters">
  <div class="cat-btn active" onclick="filterCat('all',this)">All</div>
  <div class="cat-btn" onclick="filterCat('Terminology',this)">Terminology</div>
  <div class="cat-btn" onclick="filterCat('Chart Patterns',this)">Chart Patterns</div>
  <div class="cat-btn" onclick="filterCat('Candlesticks',this)">Candlesticks</div>
  <div class="cat-btn" onclick="filterCat('Risk Management',this)">Risk</div>
  <div class="cat-btn" onclick="filterCat('Market Structure',this)">Structure</div>
  <div class="cat-btn" onclick="filterCat('Psychology',this)">Psychology</div>
  <div class="cat-btn" onclick="filterCat('Options',this)">Options</div>
</div>

<div class="card-area" onclick="flip()">
  <div class="card" id="card">
    <div class="face front">
      <div class="card-num" id="cardNumBadge">#001</div>
      <div class="cat-badge" id="frontCat"></div>
      <div class="card-term" id="frontTerm"></div>
      <div class="tap-hint">tap to flip →</div>
    </div>
    <div class="face back">
      <div class="card-num" id="backNum">#001</div>
      <div class="cat-badge" id="backCat"></div>
      <div class="back-term" id="backTerm"></div>
      <div class="card-def" id="backDef"></div>
    </div>
  </div>
</div>

<div class="nav-btns">
  <div class="nav-btn" onclick="prev()">← Prev</div>
  <div class="nav-btn primary" onclick="next()">Next →</div>
</div>

<div class="tst-link">Full course at <a href="https://topstocktrading.com/members.html">topstocktrading.com</a></div>

<script>
const CARDS = [
  // TERMINOLOGY (25)
  {cat:'Terminology',term:'Float',def:'The number of shares available for public trading. Low float stocks have fewer shares available and tend to move faster and more violently on news.'},
  {cat:'Terminology',term:'Market Cap',def:'Total market value of a company. Calculated as share price × total shares outstanding. Small cap: under $2B. Mid cap: $2B–$10B. Large cap: over $10B.'},
  {cat:'Terminology',term:'Volume',def:'The number of shares traded during a given period. Higher volume on a move adds credibility. Low volume moves are often unsustainable.'},
  {cat:'Terminology',term:'Relative Volume (RVOL)',def:'Current volume compared to average volume for the same time of day. RVOL of 2.0 means twice the normal volume — signals increased interest.'},
  {cat:'Terminology',term:'Bid Price',def:'The highest price a buyer is willing to pay for a stock right now. When you sell at market, you typically get the bid.'},
  {cat:'Terminology',term:'Ask Price',def:'The lowest price a seller is willing to accept right now. When you buy at market, you typically pay the ask.'},
  {cat:'Terminology',term:'Spread',def:'The difference between the bid and ask price. Wide spreads cost more to trade. Thin stocks with low volume tend to have wide spreads.'},
  {cat:'Terminology',term:'Short Interest',def:'The percentage of a stock\'s float that has been sold short. High short interest (over 20%) creates potential for short squeezes.'},
  {cat:'Terminology',term:'Short Squeeze',def:'When a heavily shorted stock rises sharply, forcing short sellers to buy shares to cover their positions — which drives the price even higher.'},
  {cat:'Terminology',term:'VWAP',def:'Volume Weighted Average Price. The average price weighted by volume throughout the day. Used as a key intraday support and resistance level.'},
  {cat:'Terminology',term:'Level 2',def:'A real-time display of all buy and sell orders at different price levels. Shows the "depth" of the market and where significant orders are stacked.'},
  {cat:'Terminology',term:'Market Order',def:'An order to buy or sell immediately at the best available price. Fast execution but no price guarantee. Risky in thin stocks with wide spreads.'},
  {cat:'Terminology',term:'Limit Order',def:'An order to buy or sell at a specific price or better. Gives price control but no execution guarantee. Preferred by most active traders.'},
  {cat:'Terminology',term:'Stop Loss',def:'A predetermined price at which you exit a losing trade. Automatically limits your loss. Must be set before entering every trade.'},
  {cat:'Terminology',term:'Stop Market Order',def:'Triggers a market order when your stop price is hit. Fast but may fill at a worse price than expected during fast moves.'},
  {cat:'Terminology',term:'Catalyst',def:'The news event or development driving a stock\'s move. Earnings beats, FDA approvals, contract wins, or product launches. No catalyst = no edge.'},
  {cat:'Terminology',term:'Pre-Market',def:'Trading that occurs before the regular 9:30am ET open, typically from 4am. Lower volume, wider spreads, and more volatile price action.'},
  {cat:'Terminology',term:'After-Hours',def:'Trading after the 4pm ET close. Same characteristics as pre-market — lower volume, less liquidity, more volatility.'},
  {cat:'Terminology',term:'Gap Up / Gap Down',def:'When a stock opens significantly above or below the prior day\'s close. Created by news or earnings. Gap direction often signals the day\'s bias.'},
  {cat:'Terminology',term:'Earnings Per Share (EPS)',def:'Company\'s profit divided by total shares. A beat means actual EPS exceeded estimates. Often the catalyst for earnings day moves.'},
  {cat:'Terminology',term:'P/E Ratio',def:'Price-to-earnings ratio. Stock price divided by annual EPS. Used to assess valuation. High P/E can mean growth expectations or overvaluation.'},
  {cat:'Terminology',term:'Margin',def:'Borrowing money from your broker to buy more shares than your cash allows. Amplifies both gains and losses. Not recommended for beginners.'},
  {cat:'Terminology',term:'Pattern Day Trader (PDT)',def:'A FINRA rule requiring $25,000 minimum account balance if you make 4+ day trades in 5 business days in a margin account.'},
  {cat:'Terminology',term:'Circuit Breaker / Halt',def:'A temporary stop in trading when a stock moves too fast. Level 1 halt: stock down 5%+ in 5 min. Stocks can resume up or down from the halt.'},
  {cat:'Terminology',term:'Wash Sale Rule',def:'IRS rule that disallows a tax loss if you buy the same or substantially identical security within 30 days before or after selling it at a loss.'},

  // CHART PATTERNS (20)
  {cat:'Chart Patterns',term:'Bull Flag',def:'A continuation pattern. Strong upward move (flagpole), then a tight downward drift on low volume (flag). Entry on breakout above the flag. Signals more upside.'},
  {cat:'Chart Patterns',term:'Bear Flag',def:'A continuation pattern. Strong downward move (flagpole), then a tight upward drift on low volume (flag). Entry on breakdown below the flag. Signals more downside.'},
  {cat:'Chart Patterns',term:'Pennant',def:'Similar to a flag but the consolidation forms converging trendlines (a small symmetrical triangle) after a strong move. Breakout direction matches the flagpole.'},
  {cat:'Chart Patterns',term:'Head & Shoulders',def:'Reversal pattern. Left shoulder, higher head, lower right shoulder — all along a neckline. Break below neckline signals bearish reversal. Most reliable reversal pattern.'},
  {cat:'Chart Patterns',term:'Inverse Head & Shoulders',def:'Bullish reversal pattern. Three lows with the middle (head) being the lowest. Break above neckline signals bullish reversal.'},
  {cat:'Chart Patterns',term:'Double Top',def:'Two peaks at approximately the same price level. Signals resistance. Break below the valley between the peaks confirms a bearish reversal.'},
  {cat:'Chart Patterns',term:'Double Bottom',def:'Two lows at approximately the same price level. Signals support. Break above the peak between the lows confirms a bullish reversal.'},
  {cat:'Chart Patterns',term:'Ascending Triangle',def:'Flat top resistance with a series of higher lows. Buyers are becoming more aggressive. Breakout above the flat top is the trade. Bullish bias.'},
  {cat:'Chart Patterns',term:'Descending Triangle',def:'Flat bottom support with a series of lower highs. Sellers are becoming more aggressive. Breakdown below flat bottom is the trade. Bearish bias.'},
  {cat:'Chart Patterns',term:'Symmetrical Triangle',def:'Converging trendlines with equal slope up and down. Compression before a breakout. Direction not predetermined — wait for the break.'},
  {cat:'Chart Patterns',term:'Cup & Handle',def:'Rounded bottom (cup) followed by a small downward drift (handle). Bullish continuation. Entry on breakout above handle resistance.'},
  {cat:'Chart Patterns',term:'Opening Range Breakout (ORB)',def:'The high and low established in the first 5–15 minutes of trading. A break above the ORB high is a long signal. Break below the ORB low is a short signal.'},
  {cat:'Chart Patterns',term:'Consolidation',def:'A period where price moves sideways in a tight range after a directional move. Represents balance between buyers and sellers before the next move.'},
  {cat:'Chart Patterns',term:'Breakout',def:'When price moves above a resistance level (or below support) on above-average volume. The entry signal in most continuation and breakout patterns.'},
  {cat:'Chart Patterns',term:'Fake Breakout',def:'Price breaks a key level, triggers entries, then immediately reverses. Common at well-known levels. Use buffer entries and honor your stop.'},
  {cat:'Chart Patterns',term:'V-Shape Recovery',def:'A sharp selloff immediately followed by an equally sharp recovery. Risky to buy — can look like recovery but continue lower. Confirm with volume.'},
  {cat:'Chart Patterns',term:'Higher High Higher Low (HHHL)',def:'The definition of an uptrend. Each swing high is higher than the last. Each swing low is higher than the last. Trade with the trend.'},
  {cat:'Chart Patterns',term:'Lower High Lower Low (LHLL)',def:'The definition of a downtrend. Each swing high is lower than the last. Each swing low is lower than the last. Short with the trend.'},
  {cat:'Chart Patterns',term:'Support Level',def:'A price area where buying has historically emerged and stopped declines. The more times price bounces from a level, the stronger the support.'},
  {cat:'Chart Patterns',term:'Resistance Level',def:'A price area where selling has historically emerged and stopped rallies. A broken resistance level often becomes support (role reversal).'},

  // CANDLESTICKS (15)
  {cat:'Candlesticks',term:'Bullish Engulfing',def:'A large green candle that completely covers the prior red candle\'s body. Strong reversal signal at support. More significant on higher timeframes.'},
  {cat:'Candlesticks',term:'Bearish Engulfing',def:'A large red candle that completely covers the prior green candle\'s body. Strong reversal signal at resistance. Watch for high volume to confirm.'},
  {cat:'Candlesticks',term:'Hammer',def:'Small body at the top of the candle, long lower wick (at least 2x the body). Appears after a downtrend at support. Buyers rejected the lows aggressively.'},
  {cat:'Candlesticks',term:'Shooting Star',def:'Small body at the bottom, long upper wick. Appears after an uptrend at resistance. Sellers rejected the highs aggressively. Bearish reversal signal.'},
  {cat:'Candlesticks',term:'Doji',def:'Open and close are nearly equal. Represents indecision. Long wicks on both sides mean both sides fought and neither won. Often precedes a reversal.'},
  {cat:'Candlesticks',term:'Marubozu',def:'A candle with no wicks — opens at one extreme and closes at the other. Represents maximum conviction in one direction. Strong momentum signal.'},
  {cat:'Candlesticks',term:'Spinning Top',def:'Small body with roughly equal wicks on both sides. Indecision — neither bulls nor bears took control. Often appears during consolidation.'},
  {cat:'Candlesticks',term:'Morning Star',def:'3-candle bullish reversal pattern: large red candle, small indecision candle (gap down), large green candle. Strong reversal at support on daily chart.'},
  {cat:'Candlesticks',term:'Evening Star',def:'3-candle bearish reversal pattern: large green candle, small indecision candle (gap up), large red candle. Strong reversal at resistance on daily chart.'},
  {cat:'Candlesticks',term:'Three White Soldiers',def:'Three consecutive large green candles with small wicks. Each opens within the prior candle\'s body and closes at a new high. Strong bullish momentum signal.'},
  {cat:'Candlesticks',term:'Three Black Crows',def:'Three consecutive large red candles. Each opens within the prior candle\'s body and closes at a new low. Strong bearish momentum signal.'},
  {cat:'Candlesticks',term:'Harami (Inside Bar)',def:'A small candle contained entirely within the prior candle\'s body. Represents compression and indecision. Often precedes a directional move.'},
  {cat:'Candlesticks',term:'Kill Candle',def:'A large red candle that reverses a significant portion of the prior move, often on high volume. Signals that sellers have taken control of the momentum.'},
  {cat:'Candlesticks',term:'Wick Rejection',def:'When a candle\'s wick tests a level but the body closes away from it. Signals that the level held. Long wicks at support = buyers stepping in aggressively.'},
  {cat:'Candlesticks',term:'Green to Red Reversal',def:'A stock that opens above the prior day\'s close (green) but reverses and closes below it (red). Bearish signal, especially on high volume. Signals distribution.'},

  // RISK MANAGEMENT (15)
  {cat:'Risk Management',term:'The 1% Rule',def:'Never risk more than 1% of your total account on a single trade. On a $10,000 account that is $100 max risk. Survives losing streaks without account damage.'},
  {cat:'Risk Management',term:'Position Sizing',def:'Calculating the exact number of shares to buy based on your dollar risk and stop distance. Formula: Shares = Dollar Risk ÷ (Entry − Stop).'},
  {cat:'Risk Management',term:'Risk-to-Reward (R:R)',def:'The ratio of potential profit to potential loss on a trade. 3:1 means risking $100 to make $300. Never trade below 2:1. Higher is better.'},
  {cat:'Risk Management',term:'Daily Loss Limit',def:'The maximum amount you allow yourself to lose in a single trading session. When hit, you stop trading for the day. Non-negotiable rule.'},
  {cat:'Risk Management',term:'Trailing Stop',def:'A stop that moves with price as a trade goes in your favor. Locks in profits while allowing the trade room to run. Set at a percentage or dollar amount.'},
  {cat:'Risk Management',term:'Scaling In',def:'Entering a position in multiple smaller pieces rather than all at once. Reduces risk if the first entry is wrong. Add to winners, not losers.'},
  {cat:'Risk Management',term:'Scaling Out',def:'Taking partial profits as a trade moves in your favor. Reduces risk by locking in gains while leaving some shares to capture the full move.'},
  {cat:'Risk Management',term:'Breakeven Stop',def:'Moving your stop loss to your entry price once a trade is profitable. Eliminates the possibility of a winner becoming a loser. Do this after first target.'},
  {cat:'Risk Management',term:'Max Drawdown',def:'The largest peak-to-trough decline in account value over a period. A key measure of risk. Professionals typically limit max drawdown to 10–20% of account.'},
  {cat:'Risk Management',term:'Kelly Criterion',def:'A mathematical formula for optimal position sizing based on win rate and R:R. Used by professionals. Practical version: never bet more than half the Kelly amount.'},
  {cat:'Risk Management',term:'Correlation Risk',def:'When multiple positions move together because they are in the same sector or react to the same catalyst. Being long 5 tech stocks is like having one big tech position.'},
  {cat:'Risk Management',term:'Overtrading',def:'Taking more trades than your edge supports — often from boredom or the need to "be in the market." Destroys accounts slowly through commissions and bad trades.'},
  {cat:'Risk Management',term:'Revenge Trading',def:'Taking impulsive trades after a loss to "make it back." Leads to larger losses. The antidote is a hard daily loss limit and stepping away when hit.'},
  {cat:'Risk Management',term:'Paper Trading',def:'Simulated trading with fake money in real market conditions. Use to practice setups and learn your platform before risking real capital.'},
  {cat:'Risk Management',term:'Win Rate',def:'The percentage of trades that are profitable. 50-60% is good. 40% with a 3:1 R:R is still profitable. Win rate alone means nothing without R:R context.'},

  // MARKET STRUCTURE (10)
  {cat:'Market Structure',term:'Trendline',def:'A diagonal line connecting at least two price points (highs in downtrends, lows in uptrends). Used to visualize trend direction and identify breakout points.'},
  {cat:'Market Structure',term:'Moving Average (MA)',def:'The average price over a set number of periods. Smooths out noise. Common: 20MA (short-term), 50MA (medium), 200MA (long-term trend).'},
  {cat:'Market Structure',term:'EMA vs SMA',def:'Exponential MA gives more weight to recent prices and reacts faster. Simple MA treats all prices equally and reacts slower. Day traders prefer EMAs.'},
  {cat:'Market Structure',term:'Golden Cross',def:'When the 50-day MA crosses above the 200-day MA. Considered a long-term bullish signal. Often seen as institutional buying confirmation.'},
  {cat:'Market Structure',term:'Death Cross',def:'When the 50-day MA crosses below the 200-day MA. Considered a long-term bearish signal. Often precedes continued weakness.'},
  {cat:'Market Structure',term:'Sector Rotation',def:'Money moving from one market sector to another as economic conditions change. When tech sells off and energy rallies — that\'s rotation.'},
  {cat:'Market Structure',term:'Market Breadth',def:'Measures how many stocks are participating in a move. Strong breadth (most stocks rising) = healthy bull market. Narrow breadth = weakening rally.'},
  {cat:'Market Structure',term:'Liquidity',def:'How easily you can buy or sell a security without affecting its price. High liquidity = tight spreads, fast fills. Low liquidity = wide spreads, slippage.'},
  {cat:'Market Structure',term:'Institutional Buying',def:'Large purchases by funds, banks, or hedge funds. Identified by above-average volume on up days. Stock can\'t sustain a move without institutional participation.'},
  {cat:'Market Structure',term:'Power Hour',def:'The last hour of trading (3–4pm ET) which often sees increased volume and decisive moves as institutions and traders close or adjust positions.'},

  // PSYCHOLOGY (10)
  {cat:'Psychology',term:'FOMO',def:'Fear Of Missing Out. The urge to chase a move that has already happened. Leads to buying at highs and poor risk/reward. The best setups have clear entries — if you missed it, wait.'},
  {cat:'Psychology',term:'Loss Aversion',def:'The psychological tendency to feel losses more intensely than equivalent gains. Causes traders to hold losers too long and cut winners too early.'},
  {cat:'Psychology',term:'Confirmation Bias',def:'Seeking information that confirms what you already believe about a trade while ignoring contradicting evidence. Leads to ignoring warning signs.'},
  {cat:'Psychology',term:'Recency Bias',def:'Overweighting recent events when making decisions. After a win streak, traders feel invincible. After a loss streak, they become paralyzed. Both are dangerous.'},
  {cat:'Psychology',term:'Anchoring',def:'Fixating on a specific price (like your entry) and making decisions relative to it. "I\'ll sell when I get back to breakeven" is anchoring. The market doesn\'t know your entry.'},
  {cat:'Psychology',term:'Sunk Cost Fallacy',def:'Holding a losing trade because of money already lost ("I can\'t sell, I\'d take a loss"). The money is already gone. Your only question is: what\'s the best decision right now?'},
  {cat:'Psychology',term:'Overconfidence',def:'Overestimating your ability or edge after a winning streak. Leads to oversizing, taking lower-quality setups, and giving back gains quickly.'},
  {cat:'Psychology',term:'Process vs Outcome',def:'Judging a trade on the quality of your decision-making process, not the result. A well-executed trade that loses is still good trading. A lucky win on a bad process is not.'},
  {cat:'Psychology',term:'Trading Journal',def:'A record of every trade including setup, entry, exit, P&L, and reflection. The only way to identify patterns in your behavior and improve systematically over time.'},
  {cat:'Psychology',term:'State Management',def:'Being aware of and controlling your emotional state before and during trading. Tired, angry, stressed, or excited traders make worse decisions. Stop when not at your best.'},

  // OPTIONS (5)
  {cat:'Options',term:'Call Option',def:'The right (not obligation) to buy 100 shares of a stock at the strike price before expiration. Profits when the stock rises. Bought when you are bullish.'},
  {cat:'Options',term:'Put Option',def:'The right (not obligation) to sell 100 shares at the strike price before expiration. Profits when the stock falls. Bought when you are bearish.'},
  {cat:'Options',term:'Strike Price',def:'The predetermined price at which the option can be exercised. An option is "in the money" when the stock is past the strike price in the profitable direction.'},
  {cat:'Options',term:'Expiration Date',def:'The date on which the option contract expires. Options lose value as expiration approaches (time decay). Weekly options expire every Friday.'},
  {cat:'Options',term:'Implied Volatility (IV)',def:'The market\'s expectation of future price movement embedded in the option\'s price. High IV = expensive options. IV often spikes into earnings then crushes after.'}
];

let filtered = [...CARDS];
let current = 0;
let flipped = false;

function render() {
  const c = filtered[current];
  document.getElementById('frontCat').textContent = c.cat;
  document.getElementById('frontTerm').textContent = c.term;
  document.getElementById('backCat').textContent = c.cat;
  document.getElementById('backTerm').textContent = c.term;
  document.getElementById('backDef').textContent = c.def;
  const num = String(CARDS.indexOf(c) + 1).padStart(3,'0');
  document.getElementById('cardNumBadge').textContent = '#' + num;
  document.getElementById('backNum').textContent = '#' + num;
  document.getElementById('cardNum').textContent = 'Card ' + (current+1) + ' of ' + filtered.length;
  document.getElementById('catLabel').textContent = c.cat;
  document.getElementById('fill').style.width = ((current+1)/filtered.length*100) + '%';
  if (flipped) { document.getElementById('card').classList.remove('flipped'); flipped = false; }
}

function flip() { flipped = !flipped; document.getElementById('card').classList.toggle('flipped', flipped); }
function next() { current = (current+1) % filtered.length; flipped = false; document.getElementById('card').classList.remove('flipped'); render(); }
function prev() { current = (current-1+filtered.length) % filtered.length; flipped = false; document.getElementById('card').classList.remove('flipped'); render(); }

function filterCat(cat, btn) {
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filtered = cat === 'all' ? [...CARDS] : CARDS.filter(c => c.cat === cat);
  current = 0;
  render();
}

// Keyboard navigation
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight') next();
  if (e.key === 'ArrowLeft') prev();
  if (e.key === ' ') { e.preventDefault(); flip(); }
});

render();
</script>
</body>
</html>
