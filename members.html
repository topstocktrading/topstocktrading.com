are betting against the existing momentum which requires evidence that the momentum has genuinely shifted. Wait for the full pattern to develop and the confirmation candle before committing. The trader who enters on the first hint of a reversal is often wrong. The trader who waits for confirmation may miss the first 10% of the move but gets the remaining 90% with evidence behind them.</p></div>`},
'n8-4':{title:'How to Hold Runners',content:`<p>The biggest missed opportunity in trading is not the trades you do not take - it is the winning trades you exit too early. Learning to hold a runner - a trade that is working significantly in your favor - is one of the most valuable and most difficult skills to develop. Most traders have a systematic bias toward early exits because small wins feel safe and giving back open profits feels like losing.</p><h3>The Psychology of Holding</h3><p>When a trade is up 5% and moving in your favor, every instinct tells you to lock it in. The market could reverse at any moment. You already have a profit. Take it. This instinct is understandable but it is also why most traders consistently underperform their potential. A trader who consistently exits winners at 5% when the setup has 20% potential is leaving 75% of their edge on the table.</p><h3>The Mechanical Approach</h3><p>The solution to the psychological problem is a mechanical exit system. Decide before you enter how you will exit a winner. Options: a trailing stop that follows price up by a fixed amount, a time-based rule where you hold until a specific level is reached, or a structure-based rule where you hold until price breaks below a key moving average or support level. The specific method matters less than the consistency of following it.</p><h3>Scaling Out vs Full Exit</h3><p>One of the most practical approaches to holding runners is scaling out. Sell half your position at your first target. Move your stop to break-even on the remainder. Now you have locked in a guaranteed profit on half the position and you are riding the rest with zero risk. This removes the psychological pressure of holding a full position through normal volatility while still capturing the larger move if it continues.</p><h3>What Justifies a Full Hold</h3><p>The cases where holding your full position the longest makes sense: the trend is extremely strong with no signs of exhaustion, volume is expanding on each leg up, the broader market is supporting the move, and there are no significant resistance levels nearby. When all of these align, aggressive holding is justified. When any of them are absent, scaling out is the smarter approach.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Your biggest winning trades will feel uncomfortable to hold. When a stock is up 15% and you are sitting on a significant open profit, the fear of giving it back becomes intense. That discomfort is normal. The traders who learn to manage that discomfort through mechanical rules rather than emotional exits are the ones who turn good trading into exceptional trading.</p></div>`},
'lt-intro':{title:'Live Trades',content:`<p>This section contains real recorded trades - entries, exits, management decisions, and outcomes in real time. These are not simulated examples or idealized charts after the fact. These are actual trades with actual decision points.</p><h3>How to Use This Section</h3><p>Watch each video actively - not passively. Before the entry is shown, pause and ask yourself what you would do. Where would you enter? Where would you stop out? What is your target? Then watch how the trade is managed and compare your thinking to what you see executed. The gaps between your thinking and the execution are your learning opportunities.</p><h3>What Each Video Covers</h3><p>Pre-trade analysis - what the setup looked like before the entry. The entry - exactly where and why. Position management - how the trade was managed as it developed. The exit - when and why the position was closed. The review - what went well, what could have been better, and what the chart showed in hindsight.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Watching real trades being executed in real time teaches things that no written lesson can. The pacing, the uncertainty, the decision-making under pressure - these elements only come through in live execution. This section is one of the most valuable parts of the entire course.</p></div>`},
'o-0dte':{title:'The 3:40 0DTE Rule',content:`<p>0DTE options - options expiring the same day - are the most volatile and highest-leverage instrument available to retail traders. In the final 20 minutes of the trading day, specifically between 3:40 PM and 4:00 PM, these options can move 100-500% in minutes. The 3:40 rule is a specific approach to capitalizing on this daily window.</p><h3>Why 3:40 PM</h3><p>At 3:40 PM there are exactly 20 minutes until market close. 0DTE options that are near the money have almost zero time value remaining - they are pure intrinsic value plus a tiny premium for the remaining time. This means a relatively small move in the underlying stock creates a massive percentage move in the option. A $2 move in SPY with 20 minutes to close can turn a $0.05 option into a $1.50 option - a 30x move - if it moves in the right direction.</p><h3>The Setup</h3><p>Look for a clear directional bias in SPY or QQQ at 3:40 PM. The best setups have: a clear trend established in the final hour, a specific catalyst or level that has been driving the move, and no major resistance or support nearby that would cap the move. Buy a 0DTE call if the trend is up, a 0DTE put if the trend is down. Strike price should be at the money or one strike out of the money.</p><h3>The Risk</h3><p>The same leverage that produces 100% gains produces 100% losses. A 0DTE option can go from $0.50 to $0.00 in minutes if the move does not materialize. Never risk more than you are willing to lose entirely on a 0DTE trade. These are not hedges and they are not investments - they are directional bets on a very short time horizon. Size accordingly - small position, defined loss, uncapped upside.</p><h3>Position Sizing for 0DTE</h3><p>Because the downside is total loss of premium, treat each 0DTE trade as a lottery ticket - but a calculated one. Risk no more than 1-2% of your account on any single 0DTE trade. If you buy $200 worth of 0DTE options, be prepared to lose all $200. The wins, when they come, will significantly outpace the losses if your directional read is correct more than 40% of the time.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The 3:40 0DTE window is one of the most asymmetric risk/reward setups available in any market. The key is patience - wait for the clear setup, not just any setup. Taking this trade every day regardless of conditions will erode your account. Taking it only when the directional bias is clear and the technical picture supports it gives you a consistent edge in this window.</p></div>`},
'st-intro':{title:'What Is Swing Trading',content:`<p>Swing trading is the practice of holding positions for multiple days to weeks, capturing medium-term price moves that are too large to be day traded but too short-term for long-term investors. Swing traders work primarily off the daily chart, using it to identify trends, patterns, and entry points, then dropping to lower timeframes for precise execution.</p><h3>How Swing Trading Differs From Day Trading</h3><p>Day traders open and close positions within the same session. Swing traders hold through the close and sometimes through multiple sessions, weeks, or even months. This means swing traders carry overnight risk - the risk that news or events between sessions move the stock against them before they can exit. In exchange for that risk, swing traders can capture moves that day traders miss because they exit by close each day.</p><h3>The Swing Trading Edge</h3><p>Swing traders have time working differently than day traders. Instead of needing to be right in the next five minutes, a swing trader can be right over the next five days. This allows for wider stops that do not get triggered by intraday noise, larger position sizes relative to account because overnight gaps are the primary risk rather than intraday volatility, and less time in front of the screen - 30-60 minutes of analysis per day is often sufficient.</p><h3>Who Swing Trading Is For</h3><p>Swing trading suits people who cannot watch the market all day, who are patient enough to hold through multi-day consolidations without panicking, and who prefer fewer but higher-conviction trades over the rapid-fire decision-making of day trading. It is not easier than day trading - it requires a different set of skills and a different psychological profile.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The biggest adjustment traders make when moving from day trading to swing trading is learning to tolerate open risk overnight. A stock that closes up 3% on your swing entry may open down 2% the next day due to unrelated market conditions. That is not a failure of your thesis - it is the cost of operating on a multi-day timeframe. Size your positions so that a 5-10% adverse overnight move is uncomfortable but not catastrophic.</p></div>`},
'st-scan':{title:'How to Scan for Swing Trades',content:`<p>Scanning for swing trades is different from scanning for day trades. You are not looking for the most volatile stocks moving right now - you are looking for stocks setting up technically on the daily chart that are likely to make significant moves over the next several days to weeks. The process is methodical, not reactive.</p><h3>The Daily Scan Criteria</h3><p>Start with a universe of stocks that have average daily volume above 500,000 shares - you need liquidity to enter and exit without significant slippage. Filter for stocks that are trading above their 50-day and 200-day moving averages - you want to swing trade in the direction of the trend. Then look for stocks that have pulled back to or are approaching a key support level, a key moving average, or are forming a recognizable pattern like a flag, pennant, or cup and handle on the daily chart.</p><h3>The Pattern Screen</h3><p>After your initial filter, manually scan through the resulting charts looking for specific patterns. You are looking for: tight consolidations after strong moves, pullbacks to key moving averages on declining volume, breakout setups approaching prior resistance levels, and stocks where the risk/reward on an entry is at least 3:1 using the daily ATR for stop placement.</p><h3>The Catalyst Check</h3><p>Before entering any swing trade, check if there are any upcoming catalysts that could make or break the trade regardless of the technical setup. Earnings dates, FDA announcements, or major sector events can override the best technical setup. Decide in advance whether you will hold through the catalyst or exit before it.</p><h3>Building Your Swing Watchlist</h3><p>Run your scan every evening after market close. Your swing watchlist should contain 5-10 stocks that are in various stages of setting up. Some may be setting up for entry tomorrow. Others may need another week of consolidation. Knowing the setup and the trigger in advance means you execute from a plan, not from a reaction.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The best swing trade setups are almost always stocks you have been watching for several days before they trigger. The trade you noticed two weeks ago that just broke out with volume today is a much higher quality entry than the one you found on a scanner and bought immediately. Patience in the scanning process directly improves the quality of your entries.</p></div>`},
'st-size':{title:'Swing Trade Position Sizing',content:`<p>Swing trade position sizing uses the same formula as day trading but accounts for the different risk profile of multi-day holds. The primary difference is that overnight gaps are a real risk and your stop must be placed with enough room to survive normal daily volatility without being triggered by noise.</p><h3>The ATR-Based Stop</h3><p>For swing trades, place your stop at 1x to 1.5x the daily ATR below your entry on a long position. A stock with a $2.00 daily ATR might have a stop $2.00 to $3.00 below your entry. This gives the trade room to breathe through normal daily moves without stopping you out of a valid setup. Stops tighter than 1x ATR on swing trades will produce excessive false stop-outs on legitimate setups.</p><h3>The Overnight Gap Risk</h3><p>Your stop loss does not protect you from overnight gaps. If a stock closes at $50.00 and you have a stop at $48.00, a $45.00 gap down open will execute near $45.00, not $48.00. This is called gap risk. Account for it by sizing swing positions smaller than day trade positions, avoiding stocks with high earnings risk or pending binary events, and never holding a swing position through a major catalyst unless it is intentional.</p><h3>Target Setting</h3><p>Swing trade targets should be set at the next major resistance level on the daily chart. The minimum target should provide a 3:1 reward-to-risk ratio based on your stop placement. If your stop is $2.00 away, your minimum target should be $6.00 away. Many swing trades offer 5:1 or better when properly set up - that is where the real returns come from.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Swing trading allows for fewer but larger-reward trades. A day trader might take 10 trades in a week for an average of 1:1 reward. A swing trader might take 3 trades in a week and average 4:1 reward. The math favors the swing trader significantly if the setups are high quality. Size correctly and let the trades develop.</p></div>`},
'st-manage':{title:'Managing Overnight Risk',content:`<p>Overnight risk is the defining risk management challenge for swing traders. Unlike day traders who close all positions before the market closes, swing traders carry positions through the overnight session when they cannot react to news or events. Managing this risk intelligently is what separates sustainable swing trading from reckless holding.</p><h3>Position Sizing Is Your Primary Protection</h3><p>The most important tool for managing overnight risk is correct position sizing. If an adverse overnight gap of 10% on a full position would cause you severe financial or psychological distress, you are too large. Size your swing positions so that a worst-case overnight move is uncomfortable but survivable. Never hold a swing position so large that a single overnight gap could do lasting damage to your account.</p><h3>The Pre-Close Checklist</h3><p>Before the market closes each day, review every open swing position. Is the thesis still intact? Has anything changed fundamentally or technically? Are there any upcoming catalysts - earnings, FDA announcements, economic reports - that could create a large gap? If the answer to any of these questions creates doubt, consider reducing your position size or exiting before close. It is always acceptable to take a smaller position overnight and add back the next day if conditions support it.</p><h3>Stop Losses on Swing Trades</h3><p>Stop losses on swing trades should be placed as closing price stops rather than intraday stops where possible. A stock that dips below your stop intraday but closes well above it has not violated your thesis - it has just experienced normal intraday volatility. Using closing price stops prevents being stopped out of valid setups by intraday noise while still protecting against genuine breakdowns.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The traders who are most uncomfortable holding swing positions overnight are usually those who are too large. When you are correctly sized, an adverse overnight move is noted, evaluated, and managed calmly. When you are oversized, the same move produces panic and poor decisions. Size is the solution to overnight anxiety.</p></div>`},
'lt-fund':{title:'Fundamental Analysis Basics',content:`<p>Fundamental analysis is the evaluation of a company's financial health, competitive position, and growth prospects to determine whether its stock is fairly valued, undervalued, or overvalued. While technical analysis tells you when to buy, fundamental analysis tells you what to buy. For long-term investing, both are necessary.</p><h3>The Core Metrics</h3><p><strong>Revenue growth</strong> - is the company growing its top line consistently? Consistent revenue growth is the foundation of long-term stock appreciation. Declining or stagnant revenue is a warning sign regardless of profitability.</p><p><strong>Earnings growth and margins</strong> - is the company converting revenue into profit efficiently? Expanding profit margins over time indicate operational leverage - the business is becoming more efficient as it scales.</p><p><strong>Debt levels</strong> - how much debt does the company carry relative to its equity and earnings? High debt in a rising interest rate environment can be existential for companies with thin margins.</p><p><strong>Free cash flow</strong> - after capital expenditures, how much cash is the business actually generating? Free cash flow is one of the most important measures of true business health. Companies that are profitable on paper but consuming cash are often in trouble.</p><p><strong>Competitive moat</strong> - what prevents competitors from taking this company's market share? Network effects, brand loyalty, switching costs, patents, and scale advantages are all forms of competitive moat.</p><h3>Where to Find the Data</h3><p>SEC filings on sec.gov contain every public company's financial statements. Finviz.com, Yahoo Finance, and Macrotrends.net provide screened and organized financial data. Earnings call transcripts are available on Seeking Alpha and directly from company investor relations pages.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The best long-term investments combine strong fundamentals with a good technical entry. A great company at a terrible price is a bad investment. A terrible company at a great price is a value trap. You want strong growth, healthy finances, a competitive moat, and a technical setup that puts the entry at a historically significant level of support.</p></div>`},
'lt-when':{title:'When to Buy & When to Sell',content:`<p>The most common mistake in long-term investing is excellent stock selection combined with poor timing. Buying the right stock at the wrong price - extended after a large run - significantly reduces your returns and increases the time it takes to become profitable. Technical analysis solves this problem.</p><h3>When to Buy</h3><p>The best long-term entry points occur during one of three conditions. First, a pullback to a key moving average in a strong uptrend - specifically the 50-day or 200-day moving average. These levels attract institutional buyers who use them as reference points for adding to positions. Second, a breakout from a long base of consolidation on the weekly chart with expanding volume - this signals a new leg of growth beginning. Third, a broad market correction that pulls down even strong stocks temporarily - these corrections create entry points in quality companies at prices that would otherwise be unavailable.</p><h3>When to Sell</h3><p>Long-term investors should sell when: the fundamental thesis has changed - the company is no longer growing, margins are deteriorating, or competition is taking market share. The valuation has become extreme - the stock has run far ahead of its fundamental value with no near-term catalyst to justify the premium. A better opportunity exists - selling a mediocre position to fund a higher-conviction position is a legitimate and often overlooked strategy. Or your initial thesis has been proven wrong - holding because you do not want to admit a mistake is one of the costliest behaviors in investing.</p><h3>The Partial Sell</h3><p>Long-term investors do not have to make all-or-nothing decisions. Selling a portion of a position that has significantly appreciated locks in gains while maintaining exposure if the trend continues. This is particularly useful when a stock has run far above its historical valuation range but the fundamental story remains intact.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The best time to buy a great company is when most people do not want it - during a sector rotation out of its industry, a temporary earnings miss, or a broad market correction. The discomfort of buying when sentiment is negative is exactly what creates the return premium for long-term investors.</p></div>`},
'lt-port':{title:'Building a Portfolio',content:`<p>A portfolio is not just a collection of stocks - it is a structured set of positions designed to achieve a specific return objective while managing risk across multiple dimensions. Building a portfolio intentionally is a fundamentally different activity from picking stocks one at a time.</p><h3>Diversification</h3><p>Diversification reduces the impact of any single position going wrong. A portfolio of 15-20 stocks across 5-7 different sectors is reasonably diversified. No single position should represent more than 10-15% of your total portfolio. No single sector should represent more than 25-30%. These are guidelines, not laws - concentrated portfolios can outperform diversified ones if the concentration is in genuinely high-conviction positions.</p><h3>Position Sizing in a Portfolio</h3><p>Not all positions deserve equal allocation. Your highest-conviction positions - the ones with the strongest fundamentals, the best entry point, and the clearest thesis - should be your largest positions. Lower-conviction positions are smaller. A common approach is a core-satellite structure: 60-70% in 5-8 high-conviction core positions and 30-40% in smaller satellite positions that are being evaluated.</p><h3>Rebalancing</h3><p>Portfolios drift over time as winning positions grow and losing positions shrink. Periodic rebalancing - trimming winners back to target allocation and adding to underperformers with intact theses - keeps the portfolio aligned with your original risk parameters. Rebalancing too frequently sacrifices trend-following returns. Rebalancing too infrequently creates unintended concentration in positions that have run.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The most important portfolio management decision is not which stocks to own - it is how much of each to own. A correct stock selection with incorrect sizing can underperform a mediocre stock selection with excellent sizing. Spend as much time thinking about allocation as you do about selection.</p></div>`},
'a6-gdbf':{title:'Gap Down Bear Flags',content:`<p>A gap down bear flag is one of the most reliable and tradeable short setups available. It combines the power of an overnight gap down - which immediately establishes bearish sentiment - with a flag pattern that forms during the consolidation after the gap, providing a clear entry trigger and defined risk.</p><h3>The Setup</h3><p>A stock gaps down significantly at the open - often 3-10% or more - on negative news, earnings miss, or broader market weakness. After the initial gap down, price consolidates in a tight, slightly upward-drifting channel for 20-60 minutes. This is the flag. Volume declines during the consolidation as buyers attempt a recovery but lack conviction. Then price breaks below the lower boundary of the flag on expanding volume - the breakdown entry.</p><h3>Why the Upward Drift Is Bearish</h3><p>The slight upward drift during the consolidation after a gap down looks like a recovery but it is not. It is a dead cat bounce - a reflexive move by short-term buyers trying to fade the gap. Volume tells the truth. If volume is declining as price drifts up, there is no real buying conviction. The sellers are resting, not retreating. When they step back in, the next leg down begins.</p><h3>Entry, Stop, and Target</h3><p>Enter on the break below the lower boundary of the flag. Stop goes above the high of the flag - if price reclaims the flag high, the setup is invalid and the gap may be filling. Target is the length of the gap added to the breakdown point - the classic measured move. In practice, many gap down bear flags target the next major support level below the gap.</p><h3>The Volume Confirmation</h3><p>The breakdown candle must show expanding volume. A break below the flag on low volume is a false breakdown candidate - it may reverse quickly. Wait for the volume to confirm the sellers are participating before entering.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Gap down bear flags work best when the broader market is also weak or neutral. If SPY is strong on the day, individual stocks are fighting the tide and even good short setups underperform. The highest probability gap down bear flag setups occur when both the stock and the market are aligned to the downside.</p></div>`},
'a6-blue':{title:'Blue Sky Setup',content:`<p>The Blue Sky Setup is one of the most powerful and cleanest setups in trading - and also one of the most psychologically difficult to take. It occurs when a stock breaks out to an all-time high or multi-year high with no overhead resistance. The sky is literally blue - there are no sellers from prior highs waiting to unload their positions above the current price.</p><h3>Why Blue Sky Is Special</h3><p>In most breakouts, the stock is fighting against traders who bought at prior highs and are waiting to sell at break-even. These trapped longs create natural resistance that slows or stops most breakouts. In a blue sky breakout, there are no trapped longs above the current price - every holder is sitting on a profit and has no urgency to sell. This removes the primary obstacle to continued upside and allows price to move freely based on new demand alone.</p><h3>The Setup Requirements</h3><p>A legitimate blue sky setup requires: price breaking out to a new all-time high or multi-year high with strong volume, a period of consolidation below the breakout level that showed declining volume, a catalyst or fundamental reason that justifies the new valuation, and ideally a broader market that is supportive or neutral. The breakout candle should close near its high - a weak close on a new high is often a failed breakout.</p><h3>The Entry</h3><p>Enter on the first strong close above the prior all-time high or resistance level. The stop goes below the breakout level - if price falls back into the prior range, the breakout has failed. The target on a blue sky setup is measured differently than other setups because there is no resistance above. Use the height of the base below the breakout as the measured move target, or trail your stop as the stock continues to make new highs.</p><h3>The Psychology</h3><p>Blue sky setups feel dangerous to buy because the stock is at its highest price ever. Every instinct says it is expensive and due for a pullback. This instinct is the reason blue sky setups continue to work - the discomfort keeps most traders from participating, which means the stock continues to move higher with less resistance than logic would suggest.</p><div class="callout"><div class="callout-label">TST Edge</div><p>All-time highs are not resistance - they are confirmation. A stock that breaks to a new all-time high on strong volume and strong fundamentals is telling you that every prior seller has been satisfied and new buyers are willing to pay the highest price in the stock's history. That is bullish, not bearish. Buying blue sky setups is buying strength. Fading them is fighting momentum.</p></div>`},
'a6-er2':{title:'ER Day 2',content:`<p>ER Day 2 refers to the trading day after a significant earnings move. When a stock makes a large gap up or gap down on earnings, the day after the report often provides one of the cleanest and most reliable setups of the entire earnings cycle - and it is systematically overlooked because most traders are focused on the earnings reaction day itself.</p><h3>Why Day 2 Is Powerful</h3><p>On earnings day, the move is driven by surprise and reaction. Positions are built and unwound in a frenzy. By the close of earnings day, the dust has partially settled and a clearer technical picture has emerged. On Day 2, you know the direction of the earnings reaction, you have a full day of price action to read the consolidation, and you have the emotional buyers and sellers from the initial reaction now making more rational decisions. The setup that forms overnight and into Day 2 is often cleaner and more reliable than anything available on earnings day itself.</p><h3>The Bull Scenario - ER Day 2 Long</h3><p>A stock gaps up on earnings and closes strongly on Day 1. On Day 2, price consolidates in a tight range, holding well above the gap level, on declining volume. A break above the Day 1 high on Day 2 with expanding volume is a high-probability continuation long. The tight consolidation confirmed that sellers were absorbed and the gap is holding. The Day 2 breakout above the Day 1 high is the entry.</p><h3>The Bear Scenario - ER Day 2 Short</h3><p>A stock gaps down on earnings and closes weakly on Day 1. On Day 2, price attempts a recovery but fails to reclaim the prior close or a key level. Volume on the recovery attempt is light. A break below the Day 1 low on expanding volume is a continuation short. The failed recovery confirmed that buyers have no conviction and the stock is likely to continue lower.</p><div class="callout"><div class="callout-label">TST Edge</div><p>ER Day 2 gives you the benefit of knowing the outcome of the catalyst before placing your trade. You are not guessing which way earnings will move - that game is already over. You are simply reading the technical setup that has formed in the aftermath and trading the continuation or reversal that the price action is telling you to expect. This is one of the purest forms of technical trading available.</p></div>`},
'a6-mflush':{title:'The Morning Flush',content:`<p>The morning flush is a pattern that occurs in the first 30-60 minutes of trading where a stock or the broader market sells off sharply, often on heavy volume, before finding a low and recovering. Understanding when a flush is a genuine panic low versus when it is the beginning of a sustained downtrend is one of the most valuable skills for intraday traders.</p><h3>What Creates a Morning Flush</h3><p>Morning flushes are caused by several dynamics working simultaneously. Stop losses from overnight holders trigger as price opens below key levels. Short sellers who anticipated weakness add pressure. Retail traders who see red on their screens panic sell. Market makers widen spreads and pull bids, amplifying the downward move. All of this selling concentrates in a short period, creating a flush that often overshoots the genuine equilibrium price.</p><h3>Identifying the Genuine Flush Low</h3><p>The genuine flush low has specific characteristics. Volume is at its highest point of the day - maximum fear, maximum selling pressure. The selling happens in a tight time window - often 5-15 minutes of intense pressure. Price action at the low shows long lower wicks on small time-frame candles - sellers are getting exhausted. And then volume dries up. That drying up of volume at the low is the signal that the flush is over.</p><h3>Trading the Flush Recovery</h3><p>After identifying a flush low, wait for stabilization. Do not catch the falling knife. Wait for price to base for at least 2-3 candles at the low, then enter on a reclaim of a key level above the base. The stop goes below the flush low. The target is a return to the pre-flush level or a key resistance above.</p><h3>When Not to Buy the Flush</h3><p>Not every morning flush recovers. Flushes on genuine bad news - earnings misses, guidance cuts, sector catastrophes - often continue lower after a brief pause. The recovery trade works best on flushes driven by technical stops and panic selling rather than fundamental deterioration. Check the news before buying any morning flush.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The morning flush recovery is one of the most consistent intraday patterns available. The reason it works is mechanical - stop losses and panic selling concentrate selling pressure in a short window, overshoot the genuine equilibrium, and then snap back when the selling exhausts itself. You are not predicting the future. You are recognizing a mechanical process that happens every single trading day.</p></div>`},
'a6-gtr':{title:'Green to Red & Vice Versa',content:`<p>The Green to Red and Red to Green reversal is one of the most important intraday signals available to day traders. When a stock that has been positive on the day turns negative - going Green to Red - or when a stock that has been negative turns positive - going Red to Green - it often signals a significant shift in momentum and frequently leads to an acceleration in the new direction.</p><h3>Green to Red - The Bearish Signal</h3><p>A stock opens higher and trades above its prior close for part of the morning - it is green on the day. Buyers who bought at the open or pre-market are sitting on profits. Then something changes. Selling pressure builds, price drops below the prior close, and the stock turns red on the day. Now those same buyers are sitting on losses. Their stop losses trigger. New short sellers pile in. The move from green to red accelerates. This is a powerful bearish signal, particularly when it happens with high volume and at a technically significant level.</p><h3>Red to Green - The Bullish Signal</h3><p>A stock opens lower and trades below its prior close - it is red on the day. Sellers who shorted at the open are sitting on profits. Short sellers from the previous days have conviction. Then buyers step in with conviction, price climbs back above the prior close, and the stock turns green. Now the shorts are losing money. Their stops trigger, forcing them to buy back their positions. This buying adds fuel to the move. The stock accelerates to the upside. This is a powerful bullish signal, particularly when it happens after a morning flush and reclaim of a key level.</p><h3>How to Trade It</h3><p>The entry is on the cross of the prior close - the exact moment the stock transitions from one side to the other. The stop goes back beyond the prior close - if it crosses back, the signal has failed. The target is the opening price or the next significant level in the direction of the new move. These setups work best with volume confirmation on the cross.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The Green to Red and Red to Green signals work because they trigger mechanical buying and selling from trapped traders on the wrong side of the move. You are not predicting sentiment - you are recognizing a mechanical process where position holders are forced to act. That forced action creates the momentum that makes the setup work.</p></div>`},
'lt-0':{title:'Live Trades - How to Use This Section',content:`<p>This section contains real recorded trades from real market sessions. Every trade shown here was taken with real capital under real market conditions. Nothing has been cherry-picked or edited to remove the uncomfortable moments - the uncertainty, the near-stops, the decisions that had to be made without knowing the outcome.</p><h3>Watch Actively</h3><p>The most common and least effective way to watch trading videos is passively - just watching what happens. The most effective way is actively pausing before each decision point and asking yourself what you would do, then comparing your answer to what is actually executed. The gap between what you would do and what a more experienced trader does is where your learning lives.</p><h3>What Each Trade Will Cover</h3><p>Pre-trade setup analysis, the specific entry trigger, position sizing rationale, how the trade was managed in real time, the exit and why, and a brief post-trade review covering what went well and what could have been done better. The post-trade review is as valuable as the trade itself - even profitable trades have things that could be improved.</p><div class="callout"><div class="callout-label">TST Edge</div><p>You will learn more from watching 10 trades executed in real time than from reading 100 lessons. The lessons give you the vocabulary. The live trades show you the language in use. Both are necessary. Neither is sufficient alone.</p></div>`},
'b6-f':{title:'Fakeouts & False Breaks',content:`<p>A fakeout is when price appears to break through a key level — a support, resistance, trendline, or pattern boundary — but immediately reverses back in the opposite direction. Fakeouts are among the most frustrating experiences for beginners and among the most profitable setups for experienced traders. The difference between the two is knowing what to look for before the trade, not after.</p><h3>Why Fakeouts Happen</h3><p>Fakeouts are not random. They happen for a mechanical reason. Every significant price level has stop losses clustered just beyond it. Buyers who are long have stops below support. Sellers who are short have stops above resistance. Market makers and institutional players know where these clusters are. A brief push beyond the level triggers those stops, collects the liquidity, and then price reverses when the genuine buying or selling pressure is not there to sustain the move. You have been stop-hunted. Understanding this makes fakeouts less frustrating — they are not accidents, they are mechanics.</p><h3>How to Spot a Fakeout Before It Happens</h3><p><strong>Volume is the primary tell.</strong> A real breakout has volume expanding as price clears the level. A fakeout breaks the level on thin volume — there are not enough participants behind the move to sustain it. If you see price break a key level and the volume bar is smaller than the recent average, treat it as a potential fakeout until proven otherwise.</p><p><strong>The candle close matters more than the wick.</strong> A candle that wicks below support but closes back above it has not broken support — it has tested it and been rejected. Many beginners see a wick below support and panic. The experienced trader sees a rejection and looks for a long entry.</p><p><strong>The speed of the reversal.</strong> Real breakdowns tend to accelerate after the level breaks. Fakeouts reverse quickly — often within one to three candles of the false break. If price breaks a level and immediately snaps back with urgency, you are likely watching a fakeout in real time.</p><h3>The Most Common Fakeout Setups</h3><p><strong>False breakout above resistance</strong> — price pushes above resistance briefly, fails to attract buying volume, and reverses back below. All the traders who bought the breakout are now trapped longs. Their stop losses add selling pressure as price falls, accelerating the move back down. The short entry is on the reversal back below the resistance level.</p><p><strong>False breakdown below support</strong> — price pushes below a key support level, flushes out the stops, then immediately reverses back above. This is the stop hunt. The long entry is on the reclaim of the support level with the stop below the flush low. This is one of the cleanest long setups available when it occurs at a genuinely significant support level.</p><p><strong>Failed pattern breakout</strong> — a flag, pennant, or triangle appears to break out but immediately reverses back into the pattern. The reversal back into the pattern is the tell. Real breakouts do not immediately re-enter the pattern they just broke out of. A failed breakout that reverses and then breaks the opposite boundary is often a higher-velocity move than the original setup would have been.</p><h3>Trading the Fakeout as a Setup</h3><p>The failed breakout short is one of the most reliable setups in trading. A stock breaks above resistance on low volume, attracts buying from breakout traders, then reverses sharply below the resistance level. The entry is on the break back below resistance. The stop is above the fakeout high. Every trapped buyer becomes a forced seller as their stops trigger, adding fuel to the move. The cleaner the original level and the more obvious the breakout appeared, the more traders are trapped and the more powerful the reversal tends to be.</p><h3>Fakeouts vs Stop Loss Hunts</h3><p>A fakeout is the general term for any false break that reverses. A stop loss hunt — covered in the TST Advanced Concepts section — is the institutional version. Stop loss hunts are more deliberate, tend to occur at extremely well-known levels, and are characterized by the speed and precision of the reversal. Both create the same trading opportunity — the key difference is the size and intentionality of the move beyond the level. See the Stop Loss Hunts tab in TST Advanced Concepts for the more advanced version of this concept.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The failed breakout is not a consolation prize for missing the real breakout. It is often a better trade than the real breakout would have been. You have a defined entry, a clear stop above the fakeout high, and a built-in pool of trapped buyers whose stop losses will fuel the move in your direction. Learn to recognize fakeouts and you will stop seeing them as the enemy and start seeing them as opportunity.</p></div>`},
'b-preah':{title:'Pre-Market vs After Hours Trading',content:`<p>Not all trading hours are created equal. The regular session from 9:30 AM to 4:00 PM is where the majority of volume and price discovery happens. But the pre-market session (4:00 AM to 9:30 AM) and after hours session (4:00 PM to 8:00 PM) exist and are increasingly active - especially around news and earnings events. Understanding how these sessions behave differently from regular hours is critical before you attempt to trade them.</p><h3>Pre-Market Session</h3><p>Pre-market trading runs from 4:00 AM to 9:30 AM Eastern. Volume is significantly lower than the regular session - sometimes 90% lower on a quiet day. This means spreads are wider, price action is more erratic, and a single large order can move a stock significantly. The advantage of pre-market is that you can react to overnight news, earnings releases, and international market moves before the regular session opens. The disadvantage is that the price you see at 8:00 AM is often not where the stock opens at 9:30 AM after all participants weigh in.</p><h3>After Hours Session</h3><p>After hours trading runs from 4:00 PM to 8:00 PM Eastern. The most activity happens in the first 30-60 minutes after the close, particularly on earnings announcement days. The same rules apply as pre-market - wider spreads, lower volume, more volatile moves on less participation. A stock that moves 10% after hours on earnings will often gap to a different level when the regular session opens and full volume arrives.</p><h3>Key Differences From Regular Session</h3><p>Limit orders only - most brokerages do not allow market orders in extended hours. Lower liquidity means your order may not fill at all or may fill at a significantly different price than you intended. Not all stocks are tradeable in extended hours - some have very limited or zero pre-market and after hours activity. Stop losses often do not trigger in extended hours.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Pre-market and after hours prices are useful for reading sentiment and identifying potential gap levels for the next session. They are far less reliable for actual trading execution. Use extended hours to gather information, not to take significant positions unless you have a specific and well-understood reason to do so.</p></div>`},
'b-wash':{title:'The Wash Sale Rule',content:`<p>The wash sale rule is an IRS regulation that prevents traders from claiming a tax loss on a security if they buy the same or substantially identical security within 30 days before or after the sale. It is one of the most commonly violated tax rules in active trading - not through intentional evasion but through simple unawareness that it exists.</p><h3>How It Works</h3><p>You buy 100 shares of NVDA at $900. It drops to $850 and you sell at a loss of $5,000. You immediately buy NVDA back at $850 because you still like the setup. The IRS disallows your $5,000 loss. The disallowed loss is instead added to the cost basis of the new shares you purchased, deferring the loss to when you eventually sell those shares. If you never sell within the same tax year, you cannot claim the loss that year.</p><h3>The 30-Day Window</h3><p>The window is 30 days before and 30 days after the sale. If you sold NVDA on December 15 at a loss and bought it back on January 5, that is still a wash sale even though it crosses tax years. Active traders who trade the same names repeatedly almost always trigger wash sales without realizing it.</p><h3>What Counts as Substantially Identical</h3><p>Selling NVDA stock and buying NVDA calls within 30 days is a wash sale. Selling SPY and buying QQQ is not - they are different securities even though they are correlated. Selling NVDA and buying AMD is not a wash sale. The rule applies to the exact same security and options on that security.</p><h3>How to Manage It</h3><p>If you want to maintain market exposure after selling at a loss, wait 31 days before buying back the same security. Or buy a correlated but different security in the interim - selling NVDA and buying AMD gives you continued semiconductor exposure without triggering the rule. Track every loss sale and the subsequent 30-day window.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Wash sales are most dangerous in December. Traders who are harvesting losses for tax purposes at year end frequently buy back their positions in January and unknowingly trigger wash sales. Consult a tax professional who understands active trading before making year-end tax decisions.</p></div>`},
'b-screeners':{title:'Stock Screeners for Beginners',content:`<p>A stock screener is a tool that filters thousands of stocks down to a handful that meet criteria you define. Without a screener you would need to manually look through thousands of charts every day. With a screener you can surface the 3-5 stocks that actually deserve your attention in minutes. Learning to use a screener is one of the first practical skills you need to develop as a trader.</p><h3>What a Screener Does</h3><p>You set filters - minimum volume, price range, percentage move, relative volume - and the screener returns every stock that meets all of your criteria simultaneously. Instead of looking for a needle in a haystack you are telling the screener exactly what the needle looks like and letting it search for you.</p><h3>How to Use Webull Scanner</h3><p>In Webull open the Markets tab and select Screener. You will see a list of filters on the left side. The most useful filters for beginners are: Price (set a range you can afford to trade), Volume (minimum shares traded today), Change Percentage (stocks moving more than a certain percent), and Market Cap (large cap vs small cap). Set your filters, hit Apply, and Webull returns a list of stocks meeting your criteria sorted by whichever column you choose.</p><h3>The Most Important Filters</h3><p>Relative Volume - stocks trading at 2x or more of their average volume are doing something unusual. This is your primary filter for finding stocks worth watching. Price Change - filtering for stocks moving more than 3-5% pre-market gives you your catalyst candidates for the day. Average Volume - setting a minimum of 500,000 shares average daily volume ensures the stocks you find are liquid enough to trade without significant slippage.</p><h3>Free Scanner Options</h3><p>Webull has a built-in scanner. Finviz.com has a powerful free web-based screener. Both are sufficient for beginners. As you develop more specific criteria you may consider a paid scanner like Trade Ideas, but start with the free options and learn what you are looking for before spending money on tools.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Your scanner is only as good as your filters. The goal is not to find everything - it is to find the 2-3 stocks that deserve your full attention today. Start with simple filters, learn which ones surface the types of moves you want to trade, and refine from there. A beginner with 3 clear filters will outperform one with 20 confusing ones.</p></div>`},
'n-gapgo':{title:'Gap and Go Strategy',content:`<p>The Gap and Go is one of the most consistent and cleanest intraday setups available. A stock gaps up significantly at the open on a strong catalyst, holds the gap level in the first few minutes, and then continues higher with momentum. You are not fading the gap - you are trading the continuation of the move that the pre-market already started.</p><h3>The Setup Requirements</h3><p>The stock must have a clear catalyst - news, earnings beat, FDA approval, analyst upgrade. Not all gaps are equal. A stock that gaps up 5% on no news is suspicious and likely to fill. A stock that gaps up 8% on a strong earnings beat with raised guidance has a reason to continue. The catalyst quality is the first filter. Second, the stock must hold above the gap level in the first 5-10 minutes of trading. If it immediately starts filling the gap after the open, the setup is failing. Third, volume must be significantly above average - at least 2-3x normal volume in the first 15 minutes.</p><h3>Entry, Stop, Target</h3><p>Entry is after the stock demonstrates it is holding - typically on the first pullback or consolidation above the opening price or above the pre-market high. Not on the very first candle. Stop goes below the low of the opening 5-minute candle or below the pre-market support level, whichever is more significant. Target is the next major resistance level or a measured move based on the size of the overnight gap.</p><h3>Gap and Go vs Gap and Fade</h3><p>Not every gap continues. A gap that forms on weak volume pre-market, on questionable news, or in a stock with no prior trend, will often reverse and fill the gap. The gap and go setup specifically filters for gaps with genuine institutional buying behind them. The volume is your truth detector - if volume is not showing up to support the move in the first 15 minutes, the gap is likely to fade.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The best Gap and Go setups are obvious before the market opens. If you are not excited about a gap during your pre-market routine, do not force the trade at the open. The setups that feel uncertain in pre-market are the ones that fade. The ones that feel inevitable because the catalyst is so strong - those are your Gap and Go candidates.</p></div>`},
'n-vwapst':{title:'VWAP Strategies',content:`<p>VWAP - Volume Weighted Average Price - is more than just an indicator. It is the single most important intraday reference level used by institutional traders. Understanding how to actually trade VWAP rather than just display it on your chart is what separates traders who use it effectively from those who just have it there because someone told them to.</p><h3>VWAP as Directional Bias</h3><p>The simplest and most powerful use of VWAP is as a directional filter. Price above VWAP means buyers are in control on an average basis for the day. Price below VWAP means sellers are in control. Use this as your first bias check every morning. If SPY is trading above VWAP, favor long setups on individual stocks. If SPY is below VWAP, be more cautious on longs and look for short setups.</p><h3>The VWAP Reclaim Entry</h3><p>One of the cleanest intraday setups. A stock sells off below VWAP in the morning, then buyers step in and push it back above. The reclaim of VWAP on expanding volume is a long entry. Stop goes below the VWAP level or below the low of the reclaim candle. Target is the pre-market high or the next resistance level above. This works because institutional algorithms are programmed to buy when price is below VWAP - when price reclaims it, you are going with the institutional flow.</p><h3>The VWAP Rejection Short</h3><p>The mirror image. A stock is below VWAP and rallies up to test it from below. If it fails to reclaim VWAP and gets rejected, that rejection is a short entry. Institutions selling at VWAP are defending the level. Stop above VWAP. Target the low of the day or the next support below.</p><h3>VWAP as a Target</h3><p>If you are long from a morning dip and VWAP is above you, VWAP becomes your first target. Many intraday moves from oversold levels target a return to VWAP before finding sellers again. Scale out at VWAP and let the remainder run if the stock shows strength there.</p><div class="callout"><div class="callout-label">TST Edge</div><p>VWAP resets every day at the open. The first hour of trading establishes where VWAP sits relative to price for the rest of the session. A stock that opens above VWAP and holds it all morning is showing institutional strength. A stock that cannot reclaim VWAP after the open has institutional sellers overhead. That distinction should shape your entire approach to that stock for the day.</p></div>`},
'n-fgd':{title:'First Green Day Setup',content:`<p>The First Green Day is one of the most reliable momentum setups available - particularly in small and mid cap stocks. After a stock has experienced several consecutive red days of selling pressure, the first day it closes green signals a potential shift in sentiment and often the beginning of a multi-day recovery move.</p><h3>Why It Works</h3><p>After multiple red days, short sellers have accumulated positions expecting continued weakness. Trapped longs who bought earlier are in pain and have been waiting to sell into any strength. When the stock finally goes green, several things happen simultaneously: shorts begin covering to lock in profits or cut losses, trapped longs who wanted to sell breathe a sigh of relief and hold instead, and new buyers see the reversal and step in. This combination of short covering plus new buying plus reduced selling pressure creates the fuel for a significant move.</p><h3>The Setup Requirements</h3><p>Three or more consecutive red days on declining volume - the selling is exhausting itself. The first green day should open flat or slightly lower, then build momentum throughout the session. Volume should increase on the first green day compared to the recent red days - new participants are entering. The stock should have a catalyst or at minimum a clear reason why the selling was overdone. Best when the broader market is also supportive.</p><h3>Entry and Management</h3><p>Enter on a confirmed intraday breakout above the prior day high or above a key resistance level as the stock makes its first green day move. Stop below the open of the first green day or below a key intraday support level. Target the prior swing high or a measured move based on the depth of the prior selloff. Many first green days continue for 2-4 additional days as the recovery builds momentum.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The First Green Day is a setup most traders miss because they are still bearish from watching the stock go down for several days. The sentiment trap is the edge. When everyone is still negative and the stock turns green with volume, you are early on a move that will become obvious to everyone else by day two or three.</p></div>`},
'sc-fade':{title:'The Afternoon Fade',content:`<p>Almost every small cap stock that runs 50-100% or more in the morning will fade in the afternoon. This is not a coincidence - it is a predictable mechanical outcome of how small cap momentum trading works. Understanding the afternoon fade is as important as understanding the morning run.</p><h3>Why Small Caps Always Fade</h3><p>Morning runners attract retail momentum traders who buy at increasingly higher prices throughout the first two hours of trading. By 11:00-11:30 AM the easy money is made. The original catalyst buyers from pre-market and the open are now sitting on significant profits. They start selling into any further strength. New buyers who were watching from the sidelines are now chasing at elevated prices with all the risk and none of the reward the early buyers had. As soon as the buying slows the selling takes over and the stock begins its descent.</p><h3>Identifying the Fade Setup</h3><p>The stock has run significantly in the morning - minimum 30%, ideally 50% or more. Volume is declining on the morning run compared to the opening spike. The stock is making smaller and smaller new highs - the classic exhaustion pattern. A key level breaks to the downside after 11:00 AM - the prior support becomes resistance on any bounce. This is your short entry.</p><h3>Trading the Afternoon Fade</h3><p>Entry is on the break of a key intraday support level after the morning momentum has clearly stalled. Stop above the most recent bounce high. Target the VWAP level, the prior day close, or the opening price of the day - wherever the next major support sits below. The fade often continues for hours - this is not a scalp, it is a position that can be held through the full afternoon session.</p><h3>The Danger of Fighting the Fade</h3><p>Buying a morning runner in the afternoon hoping it has another leg up is one of the most reliable ways to lose money in small cap trading. By the afternoon the stock has already done its primary move. Every bounce is a lower high. Every dip is a lower low. Trade with the fade, not against it.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The afternoon fade short is emotionally difficult because you are shorting a stock that made an incredible move. It feels like you missed the real opportunity and are now trying to squeeze something out of the rubble. In reality the fade is often just as profitable as the morning run - it just requires patience and the willingness to be short something that was up 100% earlier in the day.</p></div>`},
'sc-dil':{title:'Dilution Risk',content:`<p>Dilution is the single greatest risk specific to small cap trading that does not exist in large cap trading. A stock can be making a perfect technical setup and then halt and resume down 40% because the company announced they are selling new shares. Understanding dilution and how to identify dilution risk before it destroys your position is essential for any small cap trader.</p><h3>What Dilution Is</h3><p>When a company needs to raise money they can sell new shares to investors. This is called a secondary offering or share offering. The new shares increase the total share count - diluting the ownership percentage of everyone who already owns shares. If a company has 10 million shares outstanding and sells 5 million new shares, existing shareholders now own a smaller percentage of the company and the stock typically drops significantly because the supply of shares just increased by 50%.</p><h3>Why Small Caps Are Especially Vulnerable</h3><p>Small cap companies are often running on limited cash. They need to raise money to survive and the easiest way is to sell shares. A stock that is running 50-100% on momentum is actually the perfect time for the company to sell shares - they get maximum value for the shares they issue. This is why small cap runners frequently halt and resume sharply lower even when the technical setup looked perfect.</p><h3>How to Identify Dilution Risk</h3><p>Check the company's SEC filings for shelf registrations - these are pre-approved ability to sell shares at any time. If a company has a shelf registration in place they can issue shares immediately without additional approval. Check the company's cash position - a company that is burning cash and has low cash reserves is a high dilution risk. Check the history - companies that have diluted in the past almost always dilute again.</p><h3>The At-The-Market Offering</h3><p>The most common and most feared dilution mechanism for small cap traders is the ATM offering - at-the-market. The company has a standing agreement with an investment bank to sell shares continuously into the open market at the current price. You will never see an announcement. The bank just quietly sells shares all day. When a stock cannot make new highs despite repeated attempts, an ATM offering is often the reason - there is a constant seller at every price level.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Before taking any significant small cap position, spend 2 minutes checking the company's SEC filings on sec.gov for shelf registrations and recent S-3 filings. If there is a shelf in place and the company has low cash, treat the position as higher risk and size down accordingly. The technical setup does not matter if the company decides to sell shares into your position.</p></div>`},
'sc-para':{title:'The Parabolic Move',content:`<p>A parabolic move is when a stock goes nearly vertical - making new highs every few minutes with multiple trading halts along the way. These are the most exciting and most dangerous situations in small cap trading. The gains available in a parabolic move are enormous. The losses available if you are on the wrong side or wrong timing are equally enormous.</p><h3>What Creates a Parabolic Move</h3><p>A perfect storm of conditions. Extremely low float - often under 2 million shares. A major unexpected catalyst. High short interest from traders who shorted it earlier. Retail momentum buyers piling in through social media. Each of these factors amplifies the others. Shorts covering creates buying. Buying creates new highs. New highs attract more buyers. More buyers force more short covering. The loop continues until it breaks.</p><h3>How to Trade a Parabolic Move</h3><p>There are only two ways to trade a parabolic correctly - you are either in it early from the pre-market or opening range, or you are waiting for the fade after it exhausts. There is no correct way to chase a parabolic move in progress. Entering a stock that is already up 200% because it is going up is one of the highest-risk actions in trading. You are buying from the people who bought at 50% gains and are now selling to you.</p><h3>Halts in a Parabolic</h3><p>A stock going parabolic will halt repeatedly as it triggers the LULD circuit breakers. Each halt is a 5-minute pause. When trading resumes the stock either continues higher - if there are still more buyers than sellers - or reverses violently as everyone tries to sell at once. You cannot place orders during a halt. If you are long and the stock halts, you wait. If it resumes lower you may gap through your stop with no ability to exit at your intended price.</p><h3>The Blow-Off Top</h3><p>Every parabolic move ends the same way. A climax candle - a massive green candle, often with a long upper wick, on the highest volume of the entire move. This is the blow-off top. The final buyers are in. The sellers are overwhelming the buyers. The stock reverses violently and begins its fade. The blow-off top is identifiable in hindsight. In real time it looks exactly like every other candle in the move until it does not.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The most money made in parabolic moves is made by the people who were in before the move became parabolic. The most money lost is lost by the people who chased in during the vertical phase. If you missed the early entry, wait for the fade. There will always be another parabolic. There may not be another chance to recover from chasing one at the top.</p></div>`},
'o-credits':{title:'Credit Spreads',content:`<p>A credit spread is when you sell one option and buy another option of the same type at a different strike - and you collect premium rather than paying it. You are on the selling side of the trade. Time decay works in your favor. The maximum profit is the premium you collect upfront. The maximum loss is capped by the option you buy as protection.</p><h3>The Bull Put Spread</h3><p>You sell a put at a higher strike and buy a put at a lower strike. You collect the difference in premium. If the stock stays above your short put strike at expiration you keep the entire premium. This is a bullish trade - you are betting the stock does not fall below your short strike. Best used when you are moderately bullish or neutral on a stock and implied volatility is elevated making the premium you collect higher.</p><h3>The Bear Call Spread</h3><p>You sell a call at a lower strike and buy a call at a higher strike. You collect premium. If the stock stays below your short call strike at expiration you keep the entire premium. This is a bearish trade - you are betting the stock does not rise above your short strike. Best used when you are moderately bearish or neutral and IV is elevated.</p><h3>Why Credit Spreads Are Often Better Than Buying Options</h3><p>When you buy options, time decay is your enemy every single day. When you sell credit spreads, time decay is your friend - every day that passes without the stock moving against you adds to your profit. In markets where stocks are choppy or moving sideways, buyers of options consistently lose money while sellers consistently profit. Credit spreads let you capture that premium with defined and limited risk.</p><h3>The Math</h3><p>If you sell a bull put spread with a $5 wide spread and collect $1.50 in premium, your max profit is $150 per contract. Your max loss is $350 per contract. Your breakeven is your short put strike minus the premium collected. You do not need the stock to move in your direction - you just need it not to move too far against you.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Credit spreads are the professional options trader's bread and butter precisely because they do not require perfect directional calls. You can be wrong about direction by a small amount and still profit. The premium you collect provides a buffer. This is why most institutional options traders sell more premium than they buy.</p></div>`},
'o-expmt':{title:'Expected Move Calculation',content:`<p>Before any options trade - especially around earnings - you need to know what move the market is implying for the stock. The expected move is the market's consensus on how much a stock will move by expiration, based on the options pricing. It is one of the most useful pieces of information available before an earnings trade and almost no retail traders calculate it.</p><h3>How to Calculate the Expected Move</h3><p>Find the at-the-money straddle for the expiration you are trading - the price of the at-the-money call plus the price of the at-the-money put. This sum is approximately equal to the expected move in dollar terms. If the ATM straddle costs $5.00, the market is implying the stock will move approximately $5 in either direction by expiration.</p><h3>What the Expected Move Tells You</h3><p>If a stock is at $100 and the expected move is $8, the market is pricing in a move to either $108 or $92 by expiration. If you think the actual move will be larger than $8 you should buy options. If you think the actual move will be smaller than $8 you should sell options. The expected move is the break-even point for options buyers. If the stock moves less than the expected move, options buyers lose. If it moves more, they win.</p><h3>Expected Move Around Earnings</h3><p>Earnings events inflate the expected move dramatically because implied volatility spikes before the announcement. A stock that normally has a $2 weekly expected move might show a $10 expected move into earnings. After earnings are announced the IV crushes back to normal and the expected move collapses. This is why buying expensive options before earnings is so often unprofitable - you need a massive move to overcome the premium you paid.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Calculate the expected move before every options trade. If you are buying a call because you think the stock goes up, check whether the stock needs to move more than the expected move for your option to be profitable. If it does, the market has already priced that move in and you need to be right about direction AND magnitude - a much harder task.</p></div>`},
'o-roll':{title:'Rolling Options Positions',content:`<p>Rolling an options position means closing your current contract and opening a new one at a different expiration or strike price. It is one of the most important risk management tools in options trading and one that most beginners do not know exists until they watch a position go to zero when they could have rolled and recovered.</p><h3>Why You Roll</h3><p>You bought a call with 2 weeks to expiration. The stock is moving in your direction but slower than expected. With 5 days to expiration theta is crushing your position even as the stock gradually moves higher. Instead of watching the remaining time value evaporate you roll - sell your current contract and buy the same strike or a slightly different strike with an additional 2-4 weeks of time. You reset the clock on your trade.</p><h3>Rolling a Losing Position</h3><p>If a position is going against you, rolling out in time reduces your delta exposure to the near-term move while giving the trade more time to recover. Sell your current losing contract and buy a later expiration at the same or better strike. Your cost basis increases but you have more time for the thesis to play out. This is not always the right move - sometimes cutting the loss and moving on is better. But when your fundamental thesis is intact and only the timing was wrong, rolling preserves the trade.</p><h3>The Roll-Down</h3><p>If you sold a covered call and the stock has risen above your short strike, you can roll up and out - buy back your current short call and sell a higher strike call with a later expiration. This extends your upside participation while collecting additional premium. Most covered call strategies use this technique to manage positions when the stock is called away.</p><h3>When Not to Roll</h3><p>Do not roll a position just to avoid taking a loss. Rolling a losing position only makes sense if the thesis is still valid and time was the primary problem. Rolling because you cannot accept being wrong just increases your total capital at risk and often leads to a larger ultimate loss.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Before your option expires worthless, always ask one question: is my thesis still intact? If yes and only the timing was wrong, rolling is worth considering. If the thesis has changed - the stock broke a key level, the catalyst failed to materialize, the market condition changed - take the loss. Rolling a bad trade is just a more expensive way to be wrong.</p></div>`},
'st-wklyopts':{title:'Weekly Options for Swing Traders',content:`<p>Weekly options - options expiring within the current week - are one of the most efficient tools for expressing a swing trade thesis with significantly less capital at risk than buying shares. Instead of committing $5,000 to buy 100 shares of a $50 stock for a 5-day swing, you can buy a call option with a week or two of expiration for a fraction of that cost and still capture a meaningful portion of the move.</p><h3>Why Weekly Options for Swings</h3><p>Capital efficiency is the primary advantage. A swing trade that targets 5% in a stock can produce 50-150% on a near-the-money weekly option if the move happens within the timeframe. Your maximum loss is limited to what you paid for the option - you cannot lose more than your premium even if the stock gaps against you overnight. For swing traders who carry positions through news events, defined risk is a significant structural advantage over stock ownership.</p><h3>The Right Expiration</h3><p>For a swing trade targeting a 3-7 day move, buy options with 2-3 weeks of expiration - not the current week. Options expiring in the current week have aggressive theta decay that eats into your position even if the stock moves in your direction. Two to three weeks gives your thesis time to play out without fighting extreme time decay every day.</p><h3>Strike Selection</h3><p>For swing trades use slightly in-the-money or at-the-money strikes. Out-of-the-money weekly options require a large move just to become profitable and have a low probability of success. In-the-money options have more intrinsic value, less time decay exposure relative to their total cost, and move more like the stock. Pay the extra premium for a strike that gives you real odds of success.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The biggest mistake swing traders make with weekly options is buying the cheapest option - the one furthest out of the money expiring this Friday. It is cheap for a reason. The probability of it becoming profitable is very low. Pay for a real strike at a real expiration and let the trade work. Cheap options are almost always expensive in the end.</p></div>`},
'n-opening':{title:'The Opening Drive',content:`<p>The first 15-30 minutes of the trading session is called the opening drive. This is when institutional players establish their positions for the day and the true character of the session reveals itself. Reading the opening drive correctly sets up your entire trading approach for the rest of the morning.</p><h3>What the Opening Drive Tells You</h3><p>A strong, directional opening drive with high volume tells you it is likely a trend day. Institutions are aggressively buying or selling and the trend established in the first 30 minutes often continues for hours. A choppy, indecisive opening drive with mixed volume tells you it is likely a range day. Neither bulls nor bears have conviction and the stock will probably oscillate between two levels all day.</p><h3>Reading the Opening Drive</h3><p>Watch SPY in the first 15 minutes. Is it making consistent higher highs and higher lows with each candle? That is a bullish opening drive - trend day to the upside likely. Is it making consistent lower highs and lower lows? Bearish opening drive - trend day to the downside. Is it alternating between green and red candles with no clear direction? Range day - look for mean reversion trades at extremes rather than breakout trades.</p><h3>The Opening Drive Breakout</h3><p>When the opening drive establishes a clear direction, the first pullback after the initial move is a high-probability entry in the direction of the drive. The opening drive high becomes support on a bullish day. The opening drive low becomes resistance on a bearish day. These levels often hold for the entire morning session.</p><h3>Trend Day vs Range Day Trading</h3><p>On a trend day buy pullbacks and do not short into strength. Take breakouts in the direction of the trend. Hold positions longer than normal because the trend has momentum behind it. On a range day fade moves to the extremes, take quick profits, and do not try to hold through the entire range swing.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The most costly mistake in trading is treating a range day like a trend day or vice versa. Buying breakouts on a range day produces losses. Fading moves on a trend day produces losses. Spend the first 15 minutes identifying what type of day it is and let that reading shape everything that follows.</p></div>`},
'a6-bt':{title:'Bull Trap and Bear Trap',content:`<p>Bull traps and bear traps are among the most reliable and most profitable patterns available once you know how to identify them. They represent the moment when the majority of traders get positioned on the wrong side of a move and are subsequently forced to exit, creating the very momentum that drives the reversal.</p><h3>The Bull Trap</h3><p>A bull trap occurs when price breaks above a key resistance level or a prior high, attracting buyers who interpret the break as a genuine breakout, and then immediately reverses and falls back below the level. The breakout was fake. Every buyer who chased the breakout is now trapped in a losing position. As they exit their longs, selling pressure builds and the stock often falls significantly below the original resistance level it briefly broke through.</p><h3>Identifying a Bull Trap</h3><p>The break above resistance happens on low volume or declining volume. Price closes back below the resistance level within 1-3 candles. The reversal is fast and decisive. The failure to attract volume on the break is the key signal - a genuine breakout has volume expanding on and after the break. A bull trap shows price moving but volume not following.</p><h3>The Bear Trap</h3><p>The mirror image. Price breaks below a key support level, attracting short sellers who interpret the break as a genuine breakdown. Price immediately reverses back above the support level. All the shorts are trapped. Their forced buying - covering their short positions - adds fuel to the rally and the stock often moves significantly above the original support level.</p><h3>Trading Traps</h3><p>The failed breakout short: when a stock breaks above resistance and immediately fails, sell short on the reversal back below the resistance level with a stop above the trap high. The failed breakdown long: when a stock breaks below support and immediately snaps back, buy on the reclaim of support with a stop below the trap low. These entries have outstanding risk-reward because your stop is the trap extreme which is well-defined, and your target is the move that the trapped traders must now chase in the opposite direction.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Bull traps and bear traps work because they exploit the most human of all trading behaviors - the fear of missing a breakout. Traders rush to participate the moment a level breaks, not waiting for confirmation. The trap setup specifically preys on that impatience. When you learn to wait for confirmation before acting on a break, you stop becoming the person who gets trapped and start becoming the person who trades against them.</p></div>`},
