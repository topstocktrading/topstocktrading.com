
<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="shortcut icon" href="/favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TST Academy – Members Area</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--green:#00d27a;--green-dark:#00a85f;--dark:#0a0c10;--card:#12151c;--card2:#161920;--border:#1e2330;--text:#e8eaf0;--muted:#6b7280;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{background:var(--dark);color:var(--text);font-family:'DM Sans',sans-serif;line-height:1.6;overflow-x:hidden;display:flex;flex-direction:column;min-height:100vh;}

  #login-screen{position:fixed;inset:0;background:var(--dark);z-index:1000;display:flex;align-items:center;justify-content:center;}
  .login-box{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:48px 40px;width:100%;max-width:420px;text-align:center;}
  .login-logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;color:#fff;margin-bottom:8px;}
  .login-logo span{color:var(--green);}
  .login-subtitle{font-size:14px;color:var(--muted);margin-bottom:32px;}
  .login-box h2{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:#fff;margin-bottom:24px;}
  .input-group{margin-bottom:16px;text-align:left;}
  .input-group label{font-size:12px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:6px;}
  .input-group input{width:100%;background:var(--dark);border:1px solid var(--border);border-radius:8px;padding:12px 16px;color:var(--text);font-size:15px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color 0.2s;}
  .input-group input:focus{border-color:var(--green);}
  .login-btn{width:100%;background:var(--green);color:#0a0c10;border:none;border-radius:8px;padding:14px;font-size:15px;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;margin-top:8px;transition:background 0.2s;}
  .login-btn:hover{background:#00e888;}
  .login-error{font-size:13px;color:#e05c5c;margin-top:12px;display:none;}

  .top-nav{background:rgba(10,12,16,0.95);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:14px 24px;position:sticky;top:0;z-index:100;}
  .nav-logo{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;color:#fff;}
  .nav-logo span{color:var(--green);}
  .nav-right{display:flex;align-items:center;gap:20px;}
  .nav-welcome{font-size:13px;color:var(--muted);}
  .nav-welcome span{color:var(--green);font-weight:500;}
  .logout-btn{font-size:13px;color:var(--muted);background:none;border:1px solid var(--border);border-radius:6px;padding:6px 12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:color 0.2s,border-color 0.2s;}
  .logout-btn:hover{color:#e05c5c;border-color:#e05c5c;}

  .app{display:flex;flex:1;}

  /* SIDEBAR — wider, larger fonts, all green */
  .sidebar{width:320px;min-width:320px;background:var(--card);border-right:1px solid var(--border);height:calc(100vh - 57px);position:sticky;top:57px;overflow-y:auto;padding:16px 0;}
  .sidebar::-webkit-scrollbar{width:4px;}
  .sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

  .progress-wrap{padding:14px 20px 18px;border-bottom:1px solid var(--border);margin-bottom:14px;}
  .progress-label{font-size:12px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;display:flex;justify-content:space-between;}
  .progress-label span{color:var(--green);}
  .progress-bar{height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--green);border-radius:3px;transition:width 0.4s;}

  .sec-group{margin-bottom:6px;}
  .sec-header{padding:11px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;transition:background 0.15s;border-radius:6px;margin:0 8px;}
  .sec-header:hover{background:rgba(255,255,255,0.03);}
  .sec-badge{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:3px 9px;border-radius:3px;flex-shrink:0;background:rgba(0,210,122,0.12);color:var(--green);}
  .sec-name{font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;color:#fff;flex:1;letter-spacing:0.5px;}
  .sec-arrow{color:var(--muted);font-size:11px;transition:transform 0.2s;}
  .sec-header.open .sec-arrow{transform:rotate(90deg);}
  .sec-lessons{display:none;padding:2px 0 8px;}
  .sec-lessons.open{display:block;}

  .mod-header{padding:8px 16px 8px 36px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;transition:background 0.15s;}
  .mod-header:hover{background:rgba(255,255,255,0.02);}
  .mod-name{font-size:13px;color:var(--muted);font-weight:500;}
  .mod-arrow{color:var(--muted);font-size:10px;transition:transform 0.2s;}
  .mod-header.open .mod-arrow{transform:rotate(90deg);}
  .mod-header.open .mod-name{color:var(--text);}
  .sub-list{display:none;}
  .sub-list.open{display:block;}

  .sub-item{padding:6px 16px 6px 52px;font-size:13px;color:var(--muted);cursor:pointer;transition:color 0.15s,background 0.15s;display:flex;align-items:center;gap:7px;}
  .sub-item:hover{color:var(--text);background:rgba(255,255,255,0.02);}
  .sub-item.active{color:var(--green);background:rgba(0,210,122,0.05);}
  .sub-item.done{color:#2e3545;}
  .sub-chk{font-size:11px;min-width:14px;color:var(--muted);}
  .sub-item.active .sub-chk{color:var(--green);}
  .sub-item.done .sub-chk{color:var(--green);}

  .dir-item{padding:7px 16px 7px 36px;font-size:13px;color:var(--muted);cursor:pointer;transition:color 0.15s,background 0.15s;display:flex;align-items:center;gap:7px;}
  .dir-item:hover{color:var(--text);background:rgba(255,255,255,0.02);}
  .dir-item.active{color:var(--green);background:rgba(0,210,122,0.05);}
  .dir-item.done{color:#2e3545;}
  .dir-chk{font-size:11px;min-width:14px;color:var(--muted);}
  .dir-item.active .dir-chk{color:var(--green);}
  .dir-item.done .dir-chk{color:var(--green);}

  .main{flex:1;padding:40px 48px;max-width:900px;}
  .lesson-tag{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--green);font-family:'Rajdhani',sans-serif;font-weight:700;margin-bottom:8px;}
  .lesson-title{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:2px;color:#fff;line-height:1.1;margin-bottom:12px;}
  .lesson-meta{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-bottom:28px;flex-wrap:wrap;}
  .video-wrap{background:#000;border-radius:12px;border:1px solid var(--border);aspect-ratio:16/9;margin-bottom:28px;display:flex;align-items:center;justify-content:center;}
  .vid-ph{text-align:center;}
  .vid-icon{font-size:48px;margin-bottom:10px;opacity:0.2;}
  .vid-ph p{font-size:13px;color:var(--muted);}
  .lc h3{font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:700;color:#fff;margin:28px 0 10px;letter-spacing:0.3px;}
  .lc h3:first-child{margin-top:0;}
  .lc p{font-size:15px;color:var(--muted);line-height:1.8;margin-bottom:12px;}
  .lc ul{margin:0 0 14px 20px;}
  .lc li{font-size:15px;color:var(--muted);line-height:1.8;margin-bottom:6px;}
  .lc li::marker{color:var(--green);}
  .callout{background:rgba(0,210,122,0.06);border-left:3px solid var(--green);border-radius:0 8px 8px 0;padding:14px 18px;margin:18px 0;}
  .callout p{margin:0;color:var(--text);font-size:14px;line-height:1.7;}
  .quote-block{text-align:center;padding:32px 24px;margin:28px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);}
  .quote-text{font-family:'Rajdhani',sans-serif;font-size:22px;font-weight:600;color:#fff;line-height:1.4;margin-bottom:8px;letter-spacing:0.3px;}
  .quote-author{font-size:13px;color:var(--green);}
  .sec-intro-card{background:var(--card2);border:1px solid var(--border);border-radius:16px;padding:32px;margin-bottom:32px;}
  .sic-badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:4px 10px;border-radius:4px;margin-bottom:14px;background:rgba(0,210,122,0.12);color:var(--green);}
  .sec-intro-card h2{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:#fff;margin-bottom:12px;}
  .sec-intro-card p{font-size:15px;color:var(--muted);line-height:1.8;margin-bottom:10px;}
  .topics-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
  .topic-pill{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:6px;padding:4px 12px;font-size:12px;color:var(--muted);}
  .cs-wrap{text-align:center;padding:60px 24px;}
  .cs-icon{font-size:48px;margin-bottom:16px;opacity:0.25;}
  .cs-wrap h3{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px;color:#fff;margin-bottom:8px;}
  .cs-wrap p{font-size:14px;color:var(--muted);}
  .lesson-nav{display:flex;justify-content:space-between;align-items:center;padding-top:28px;border-top:1px solid var(--border);margin-top:24px;}
  .nav-btn{background:transparent;border:1px solid var(--border);border-radius:8px;padding:10px 22px;font-size:14px;color:var(--text);cursor:pointer;font-family:'DM Sans',sans-serif;transition:border-color 0.2s,color 0.2s;}
  .nav-btn:hover{border-color:var(--green);color:var(--green);}
  .nav-btn.primary{background:var(--green);color:#0a0c10;border-color:var(--green);font-weight:700;}
  .nav-btn.primary:hover{background:#00e888;}
  .nav-btn:disabled{opacity:0.3;cursor:not-allowed;pointer-events:none;}

  /* NOTES SYSTEM */
  .notes-wrap{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:28px;}
  .notes-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .notes-title{font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;color:#fff;display:flex;align-items:center;gap:8px;}
  .notes-count{font-size:11px;background:rgba(0,210,122,0.12);color:var(--green);padding:2px 8px;border-radius:10px;font-family:'DM Sans',sans-serif;font-weight:400;}
  .note-input-row{display:flex;gap:8px;margin-bottom:14px;}
  .note-input{flex:1;background:var(--dark);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;outline:none;resize:none;min-height:40px;transition:border-color 0.2s;}
  .note-input:focus{border-color:var(--green);}
  .note-save-btn{background:var(--green);color:#0a0c10;border:none;border-radius:8px;padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;align-self:flex-start;}
  .note-save-btn:hover{background:#00e888;}
  .notes-list{display:flex;flex-direction:column;gap:8px;max-height:240px;overflow-y:auto;}
  .notes-list::-webkit-scrollbar{width:3px;}
  .notes-list::-webkit-scrollbar-thumb{background:var(--border);}
  .note-item{background:var(--dark);border:1px solid var(--border);border-radius:8px;padding:10px 14px;display:flex;align-items:flex-start;gap:10px;}
  .note-ts{font-size:11px;color:var(--green);font-weight:700;cursor:pointer;white-space:nowrap;padding:2px 8px;background:rgba(0,210,122,0.08);border-radius:4px;border:1px solid rgba(0,210,122,0.2);transition:background 0.15s;flex-shrink:0;}
  .note-ts:hover{background:rgba(0,210,122,0.16);}
  .note-text{font-size:13px;color:var(--text);line-height:1.6;flex:1;}
  .note-delete{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:0 2px;flex-shrink:0;}
  .note-delete:hover{color:#e05c5c;}
  .notes-empty{font-size:13px;color:var(--muted);text-align:center;padding:16px 0;}

  /* MY NOTES PAGE */
  .all-notes-lesson{margin-bottom:24px;}
  .all-notes-lesson-title{font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;color:#fff;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .all-notes-lesson-sec{font-size:11px;color:var(--muted);font-weight:400;}



  .ai-fab{position:fixed;bottom:28px;right:28px;background:var(--green);color:#0a0c10;border:none;border-radius:50px;padding:13px 20px;font-size:13px;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;display:flex;align-items:center;gap:7px;box-shadow:0 4px 20px rgba(0,210,122,0.25);transition:transform 0.2s;z-index:200;}
  .ai-fab:hover{transform:translateY(-2px);}
  .ai-panel{position:fixed;bottom:85px;right:28px;width:350px;background:var(--card);border:1px solid var(--border);border-radius:16px;display:none;flex-direction:column;z-index:200;overflow:hidden;}
  .ai-panel.open{display:flex;}
  .ai-ph{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .ai-pt{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;color:#fff;display:flex;align-items:center;gap:7px;}
  .ai-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
  .ai-x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;}
  .ai-msgs{height:260px;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}
  .ai-msgs::-webkit-scrollbar{width:3px;}
  .ai-msgs::-webkit-scrollbar-thumb{background:var(--border);}
  .ai-msg{max-width:85%;padding:9px 13px;border-radius:10px;font-size:13px;line-height:1.6;}
  .ai-msg.bot{background:var(--card2);color:var(--text);align-self:flex-start;}
  .ai-msg.user{background:var(--green);color:#0a0c10;align-self:flex-end;font-weight:500;}
  .ai-iw{padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:7px;}
  .ai-in{flex:1;background:var(--dark);border:1px solid var(--border);border-radius:7px;padding:9px 12px;color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;outline:none;}
  .ai-in:focus{border-color:var(--green);}
  .ai-send{background:var(--green);color:#0a0c10;border:none;border-radius:7px;padding:9px 13px;font-size:13px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;}
  @media(max-width:768px){.sidebar{display:none;}.main{padding:24px 16px;}.progress-ring{display:none;}}

  .quiz-container{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;margin-top:32px;}
  .quiz-header{margin-bottom:24px;}
  .quiz-title{font-family:'Rajdhani',sans-serif;font-size:24px;font-weight:700;color:var(--text);margin-bottom:8px;}
  .quiz-meta{font-size:13px;color:var(--muted);margin-bottom:12px;}
  .quiz-passed-badge{display:inline-block;background:#0d2e1a;color:var(--green);font-size:13px;font-weight:700;padding:6px 14px;border-radius:20px;border:1px solid var(--green);margin-bottom:12px;}
  .quiz-progress{height:4px;background:var(--border);border-radius:2px;margin-bottom:32px;overflow:hidden;}
  .quiz-progress-bar{height:100%;background:var(--green);border-radius:2px;transition:width 0.3s;}
  .quiz-q{padding:24px 0;border-bottom:1px solid var(--border);}
  .quiz-q:last-child{border-bottom:none;}
  .quiz-q-num{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;}
  .quiz-q-text{font-size:17px;font-weight:600;color:var(--text);line-height:1.5;margin-bottom:20px;}
  .quiz-choices{display:flex;flex-direction:column;gap:10px;}
  .quiz-choice{display:flex;align-items:center;gap:14px;padding:14px 18px;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;transition:all .15s;}
  .quiz-choice:hover{border-color:var(--green);background:rgba(34,197,94,.05);}
  .quiz-choice input{display:none;}
  .quiz-choice:has(input:checked){border-color:var(--green);background:rgba(34,197,94,.08);}
  .quiz-choice-letter{width:28px;height:28px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted);flex-shrink:0;transition:all .15s;}
  .quiz-choice:has(input:checked) .quiz-choice-letter{background:var(--green);color:#000;}
  .quiz-choice-text{font-size:15px;color:var(--text);line-height:1.4;}
  .quiz-choice-correct{border-color:#22c55e !important;background:rgba(34,197,94,.12) !important;}
  .quiz-choice-correct .quiz-choice-letter{background:#22c55e !important;color:#000 !important;}
  .quiz-choice-wrong{border-color:#ef4444 !important;background:rgba(239,68,68,.08) !important;}
  .quiz-choice-wrong .quiz-choice-letter{background:#ef4444 !important;color:#fff !important;}
  .quiz-actions{margin-top:32px;text-align:center;}
  .quiz-submit-btn{background:var(--green);color:#000;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:16px;letter-spacing:.05em;padding:16px 48px;border-radius:10px;border:none;cursor:pointer;transition:all .2s;}
  .quiz-submit-btn:hover{background:#1aaa50;transform:translateY(-1px);}
  .quiz-warning{color:#ef4444;font-size:13px;margin-top:12px;}
  .quiz-results{margin-top:32px;}
  .quiz-score-card{text-align:center;padding:32px;border-radius:14px;margin-bottom:32px;}
  .quiz-passed{background:rgba(34,197,94,.1);border:2px solid var(--green);}
  .quiz-failed{background:rgba(239,68,68,.08);border:2px solid rgba(239,68,68,.4);}
  .quiz-score-num{font-family:'Rajdhani',sans-serif;font-size:64px;font-weight:900;line-height:1;}
  .quiz-passed .quiz-score-num{color:var(--green);}
  .quiz-failed .quiz-score-num{color:#ef4444;}
  .quiz-score-label{font-size:18px;font-weight:700;margin:8px 0 4px;}
  .quiz-passed .quiz-score-label{color:var(--green);}
  .quiz-failed .quiz-score-label{color:#ef4444;}
  .quiz-score-sub{font-size:13px;color:var(--muted);}
  .quiz-review{margin-bottom:28px;}
  .quiz-review-title{font-family:'Rajdhani',sans-serif;font-size:18px;font-weight:700;color:var(--text);margin-bottom:16px;}
  .quiz-wrong-item{padding:16px;background:var(--bg);border:1px solid var(--border);border-radius:10px;margin-bottom:12px;}
  .quiz-wrong-q{font-size:14px;font-weight:600;color:var(--text);margin-bottom:8px;}
  .quiz-wrong-yours{font-size:13px;color:var(--muted);margin-bottom:4px;}
  .quiz-wrong-ans{color:#ef4444;font-weight:600;}
  .quiz-correct-ans{color:var(--green);font-weight:600;}
  .quiz-hint-text{font-size:13px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid var(--border);line-height:1.6;}
  .quiz-perfect{text-align:center;color:var(--green);font-size:16px;font-weight:600;padding:16px;}
  .quiz-retake-btn{display:block;margin:24px auto 0;background:transparent;border:1.5px solid var(--green);color:var(--green);font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;padding:12px 36px;border-radius:10px;cursor:pointer;transition:all .2s;}
  .quiz-retake-btn:hover{background:rgba(34,197,94,.1);}
  .quiz-congrats{text-align:center;color:var(--green);font-size:15px;padding:20px;border:1px solid var(--green);border-radius:10px;background:rgba(34,197,94,.05);}

  
  .quiz-page-wrap{max-width:800px;}
  .quiz-page-header{margin-bottom:32px;}
  .quiz-page-label{display:inline-block;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:4px 10px;border-radius:4px;margin-bottom:14px;background:rgba(0,210,122,0.12);color:var(--green);}
  .quiz-page-header h2{font-family:'Bebas Neue','Rajdhani',sans-serif;font-size:36px;letter-spacing:2px;color:#fff;margin-bottom:8px;}
  .quiz-page-header p{font-size:15px;color:var(--muted);line-height:1.7;}
  .sidebar-quiz-tab .mod-name{color:var(--green) !important;font-weight:700;}

  
  /* PROFILE SYSTEM */
  .profile-page{max-width:960px;margin:0 auto;}
  .profile-header{margin-bottom:28px;}
  .profile-header-label{font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--green);margin-bottom:8px;}
  .profile-header-title{font-family:'Rajdhani',sans-serif;font-size:32px;font-weight:700;letter-spacing:1px;color:var(--text);}

'00-01':{title:'Welcome & Course Framework',content:`<h3>What This Course Is</h3>
<p>TST Academy is not a course that teaches you to follow someone else's trades. It's a course that teaches you to <strong>think like a trader</strong> — to develop your own edge, build your own rules, and execute with consistency regardless of what the market throws at you.</p>
<p>The course is built in 17 sections. Each section builds on the last. You are not meant to skip around. The order matters because trading is a system — understanding price action means nothing if you don't understand volume, and understanding setups means nothing if you haven't built the psychological framework to execute them correctly.</p>
<h3>How the Course Is Structured</h3>
<p><strong>Sections 00-02</strong> are foundational. Course intro, trading fundamentals, and the mathematical framework that separates professional traders from everyone else. Do not skip Section 02. Most people never learn what expectancy and edge actually mean — this section changes how you see every trade you ever take.</p>
<p><strong>Sections 03-05</strong> are technical. Price action, volume, order flow, and indicators. This is where you learn to read the chart — not just see a picture, but understand what price is communicating at every level.</p>
<p><strong>Sections 06-08</strong> are operational. Psychology, risk management, and journaling. The mechanics of surviving and improving as a trader.</p>
<p><strong>Sections 09-12</strong> are contextual. Macro structure, intraday dynamics, small caps, and IPOs. How to understand the environment you're trading in.</p>
<p><strong>Sections 13-15</strong> are strategic. Options, swing trading, and long-term investing — expanding your toolkit beyond basic intraday trading.</p>
<p><strong>Sections 16-17</strong> are advanced. Your personal playbook, pattern recognition, and the psychological depth required to sustain performance long-term.</p>
<h3>How to Get the Most From This Material</h3>
<p>Read each lesson. Then go to a chart and look for what was described. Then come back and read it again. The material will mean something different the second time because you've seen it in the real world. That cycle — read, observe, return — is how this course is meant to be used.</p>
<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">Take notes as you go. Not summaries of what was said — write down how each concept connects to something you've seen on a chart or experienced in a trade. That's when the learning becomes permanent.</div></div>`},
'00-02':{title:'Learning How to Think About Trading',content:`<h3>The Biggest Mistake New Traders Make</h3>
<p>Most people who start trading approach it the same way they approach learning a skill in school — they study, they memorize, they feel ready. Then they place a trade and everything falls apart. Not because they didn't learn the material. Because they learned the wrong thing.</p>
<p>They studied <em>what</em> to do. They never learned <em>how to think</em>.</p>
<p>Trading is not a knowledge problem. Almost everything you need to know about technical analysis, risk management, and market structure is available for free online. The traders who fail don't fail because they lack information. They fail because under pressure — when money is on the line and the position is moving against them — their thinking breaks down.</p>
<h3>Trading Is a Probability Game</h3>
<p>The first mental shift required is understanding that trading is not about being right. It's about playing a game with probabilistic outcomes in a way that gives you a mathematical advantage over time.</p>
<p>A coin that lands heads 55% of the time is a profitable coin to bet on — not because every flip goes your way, but because over enough flips the edge compounds. Trading is identical. You don't need to win every trade. You need to win enough, with large enough wins relative to your losses, that the math works in your favor over time.</p>
<p>This means a single losing trade tells you nothing. A losing week might tell you nothing. Only patterns across many trades — 50, 100, 200 — reveal whether you have an edge or whether you're getting lucky.</p>
<h3>Process Over Outcome</h3>
<p>The second mental shift is separating process from outcome. A trade can be executed perfectly and still lose. A trade can be executed terribly and still win. In the short term, outcomes are noisy. Process is what you control.</p>
<p>Your job as a trader is not to make money on any given trade. Your job is to execute your process correctly on every trade. The money is a byproduct of process executed consistently over time.</p>
<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">Judge yourself on process, not outcome. Did you follow your rules? Did you take the setup correctly? Did you manage risk properly? If yes — that was a good trade, regardless of whether it made money.</div></div>
<h3>Why Most Traders Fail</h3>
<p>The failure rate in trading is high — estimates range from 70% to 90% of retail traders losing money. The reasons are almost never what people assume. It's not lack of information. It's not bad setups. It's three things repeated endlessly:</p>
<ul>
<li><strong>Overleveraging</strong> — sizing positions too large, making every trade feel like survival</li>
<li><strong>Emotional decision-making</strong> — letting fear and greed override the plan</li>
<li><strong>No defined edge</strong> — trading random setups with no statistical backing</li>
</ul>
<p>This course directly addresses all three. By the end you will have a defined edge, a risk framework that keeps you alive, and enough psychological understanding to recognize when your emotions are making decisions instead of your process.</p>`},
'00-03':{title:'Why There\'s No Single Right Path',content:`<h3>There Is No Single Right Way to Trade</h3>
<p>One of the most damaging beliefs a new trader can have is that there is one correct trading style — one set of setups, one timeframe, one approach — and that finding it is the goal. This belief leads traders to endlessly chase methods, jump from strategy to strategy, and conclude that trading doesn't work when the real problem is that they never committed to understanding themselves as a trader.</p>
<p>The truth is that trading has many valid paths. Day traders, swing traders, options traders, long-term investors — all of these can be profitable. What they have in common is not the method. It's the discipline of understanding their edge and executing it consistently.</p>
<h3>The Four Main Trading Styles</h3>
<p><strong>Day Trading</strong> — All positions opened and closed within the same trading day. No overnight risk. Requires significant time in front of screens, fast decision-making, and the ability to thrive in high-intensity environments. Works best for people who can dedicate 4+ hours to active trading and who process information quickly under pressure.</p>
<p><strong>Swing Trading</strong> — Positions held from two days to several weeks. Captures multi-day momentum moves. Requires less screen time than day trading but demands comfort with overnight risk and the patience to hold through short-term noise. Works for people with jobs or other obligations who can do pre-market and post-market analysis.</p>
<p><strong>Options Trading</strong> — Using derivatives to express directional or volatility views with defined risk. Can be used for income, speculation, or hedging. Requires understanding of the Greeks and how time decay affects position value. Not inherently riskier than stock trading — but requires a different framework.</p>
<p><strong>Long-Term Investing</strong> — Buying fundamentally sound companies or ETFs and holding for months or years. Least time-intensive. Most forgiving of imperfect entries. Requires patience and the ability to ignore short-term noise.</p>
<h3>Finding Your Style</h3>
<p>Your natural trading style is determined by several factors: how much time you have, your emotional response to uncertainty, your capital base, and honestly — your personality. Some people are built for the speed of day trading. Others find that kind of environment unbearable and perform far better with the slower cadence of swing trading.</p>
<p>Neither is better. What's better is the one where you can execute with consistency and without constant emotional friction.</p>
<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">As you go through this course, pay attention to which sections feel natural and which feel uncomfortable. That discomfort is often a signal about which approaches match your psychology and which don't.</div></div>
<h3>Capital Requirements by Style</h3>
<p>Day trading with a U.S. broker requires a minimum of $25,000 to avoid Pattern Day Trader restrictions. Swing trading can be done with significantly less. Options trading can be started with a few thousand dollars in a cash account. Long-term investing has no minimum. Know your capital constraints before deciding where to focus.</p>`},
'00-04':{title:'How to Get Maximum Value From This Course',content:`<h3>How to Use This Course Effectively</h3>
<p>Most people who buy trading courses read through them once, feel a surge of confidence, start trading, and then discover a gap between what they understood intellectually and what they can execute under pressure. That gap is not a failure of the course material. It's a failure of how the material was consumed.</p>
<p>This lesson tells you exactly how to use this course so that doesn't happen to you.</p>
<h3>Go in Order — At Least Once</h3>
<p>The 17 sections are sequenced deliberately. Price action is in Section 03, not Section 01, because understanding support, resistance, and chart structure requires you to first understand what trading is actually about (Section 00-01), how markets work mathematically (Section 02), and the foundational concepts that make chart reading meaningful (Section 01).</p>
<p>Go through the course in order the first time. After that, use it as a reference — return to specific sections when you encounter a concept in your trading that you want to deepen.</p>
<h3>Read, Then Chart, Then Return</h3>
<p>For every technical lesson — price action, volume, indicators, setups — follow this sequence:</p>
<ol>
<li><strong>Read the lesson</strong> and understand the concept as described</li>
<li><strong>Open a chart</strong> and look for that concept in real historical price action</li>
<li><strong>Return to the lesson</strong> and re-read it with fresh eyes after what you observed on the chart</li>
</ol>
<p>The second read will land differently. Concepts that seemed abstract become concrete when anchored to something you've seen. This is how technical knowledge converts into actual skill.</p>
<h3>Build Your Playbook as You Go</h3>
<p>Section 16 covers building a personal playbook — a written document of your specific setups, rules, and criteria. Don't wait until you get to Section 16 to start it. Start a simple document right now. Every time a setup or concept in this course resonates with you, write it down. By the time you reach Section 16, you'll have the raw material for a real playbook rather than starting from scratch.</p>
<h3>Journal From Day One</h3>
<p>Section 08 covers journaling in depth. But journaling should start before you get there. Even if you're only paper trading or just studying charts — record what you see, what you think would happen, and what actually happens. The habit of documentation is as important as any technical skill this course teaches.</p>
<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">Section 02 — The Mathematical Foundation of Trading — is the most important section in the course. Most traders skip straight to setups and patterns. The ones who genuinely understand expectancy and edge think about trading completely differently. Do not rush through Section 02.</div></div>
<h3>Revisit Regularly</h3>
<p>Trading is a skill that deepens with experience. A lesson that felt basic six months ago will reveal new layers after you've lived through a drawdown, blown a stop, or held a winner longer than you thought possible. Return to this course regularly. The material doesn't change — but you do.</p>`},
'01-01':{title:'The 3 Pillars of Trading',content:`<p>Before you ever look at a chart, open a brokerage account, or place a trade — you need to understand what separates consistently profitable traders from everyone else. It's not a secret indicator. It's not a special scanner. It's three things done consistently.</p><h3>Pillar 1 — Idea Generation</h3><p>Where does the trade come from? Every good trade starts with a reason. A catalyst. A setup. News, earnings, technical breakout, sector rotation — something that makes this stock worth paying attention to right now. Idea generation is your filter. It's how you go from 8,000 stocks to the 3-5 that actually deserve your attention today.</p><h3>Pillar 2 — The Setup</h3><p>Once you have an idea, you need a setup. The setup answers the question — where exactly do I get in, where am I wrong, and where am I taking profits? A setup is not "I think this stock is going up." A setup is specific — entry, stop, target. Specificity is everything.</p><h3>Pillar 3 — Risk Management</h3><p>This is the one most beginners skip and the reason most beginners fail. Risk management answers the question — how much of my account am I willing to lose on this single trade? The answer should never be more than 1-2%. Ever. One bad trade should never threaten your ability to come back tomorrow.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The order matters. Idea first. Setup second. Risk third. Most beginners do it backwards — they size up first, find a setup second, and never had an idea to begin with. That's why they lose.</p></div>`},
'01-02':{title:'Types of Traders',content:`<p>Not every trader is the same and not every trading style is right for every person. One of the biggest mistakes beginners make is trying to trade like someone else — copying a style that doesn't fit their personality, schedule, or risk tolerance.</p><h3>Scalper</h3><p>Holds trades for seconds to minutes. Extremely high frequency. Requires intense focus, lightning fast execution. Best for people who thrive under pressure and can detach emotionally from rapid wins and losses.</p><h3>Day Trader</h3><p>Holds trades for minutes to hours. Never holds overnight. Focused primarily on the open and power hour. Best for people who can dedicate their morning to the market.</p><h3>Swing Trader</h3><p>Holds trades for days to weeks. Requires less screen time — often just 30-60 minutes per day for analysis. Best for people with full time jobs who can't watch the market all day.</p><h3>Long Term Investor</h3><p>Holds positions for months to years. Focused on fundamentals, sector trends, and macro themes. Best for people building wealth over time who aren't interested in short term volatility.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Most successful traders end up being a combination of styles. The goal isn't to pick one box and live in it forever — it's to understand which style fits your life and your psychology and start there.</p></div>`},
'01-03':{title:'Reading Price, Volume & Time',content:`<h3>The Three Data Streams Every Chart Contains</h3>
<p>Every price chart you look at is displaying three distinct streams of information simultaneously: <strong>price</strong>, <strong>volume</strong>, and <strong>time</strong>. Most new traders see the price and vaguely notice the volume bars at the bottom. Learning to read all three — and more importantly, learning to see how they interact — is the foundation of chart literacy.</p>
<h3>Price: What the Market Is Saying</h3>
<p>Price is the most visible data stream and the one most traders focus on exclusively. Price tells you what buyers and sellers have agreed a stock is worth at every moment. But raw price alone tells you almost nothing useful — it's the <em>movement</em> and <em>context</em> of price that carries information.</p>
<p>Price moving up means buyers are more aggressive than sellers at that moment. Price moving down means sellers are more aggressive than buyers. Price moving sideways means neither side has a clear advantage — a state of balance that almost always precedes a directional move.</p>
<p>What price does at key levels — previous highs, previous lows, moving averages, round numbers — is especially informative. Does it slow down and reverse? Does it hesitate and then push through? Does it spike through a level and immediately come back? Each of these behaviors tells a different story about supply and demand.</p>
<h3>Volume: What the Market Is Confirming</h3>
<p>Volume is the number of shares (or contracts) traded in a given period. It is the <em>confirmation layer</em> — volume tells you whether to believe what price is doing.</p>
<p>High volume on a price move means many participants are actively trading in that direction. The move has broad participation and is more likely to be meaningful. Low volume on a price move means few participants are involved — the move may be temporary or easily reversed when larger players decide to act.</p>
<p>The most important volume signal to understand: <strong>volume should expand in the direction of the trend and contract during pullbacks.</strong> In an uptrend, up days should have higher volume than down days. If you start seeing heavy volume on down days and light volume on up days within an uptrend, the trend is weakening — sellers are more active than the price action alone would suggest.</p>
<h3>Time: The Dimension Most Traders Ignore</h3>
<p>Time is the most underappreciated of the three data streams. The same price move means completely different things depending on how long it took to happen.</p>
<p>A stock that moves from $20 to $25 in 30 minutes is exhibiting very different behavior than one that moves from $20 to $25 over three weeks. The first suggests explosive momentum and high short-term interest. The second suggests a gradual accumulation that may or may not continue.</p>
<p>Time also determines which patterns are relevant. A consolidation that forms over 2 hours on a 5-minute chart is significant for intraday traders. A consolidation that forms over 3 weeks on a daily chart is significant for swing traders. The same visual pattern carries different weight depending on the timeframe in which it forms.</p>
<h3>Reading All Three Together</h3>
<p>The real skill is reading all three data streams simultaneously and understanding what they're collectively saying. Examples:</p>
<ul>
<li><strong>Price up, volume high, time: first 30 minutes</strong> — Strong momentum move with broad participation during the highest-liquidity period of the day. Most likely to continue.</li>
<li><strong>Price up, volume low, time: midday</strong> — Weak, low-participation drift upward during the lowest-liquidity period. Less trustworthy, more likely to reverse.</li>
<li><strong>Price sideways, volume declining, time: multi-day</strong> — Classic compression before a breakout. The tighter the range and the lower the volume, the more explosive the eventual move tends to be.</li>
</ul>
<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">Take any stock chart and look at the last 10 significant price moves. For each one, identify: Was volume high or low relative to average? How long did the move take? What was happening at the time of day? Then ask: what story do all three data streams tell together about that move?</div></div>`},
'01-04':{title:'Anatomy of a Candlestick',content:`<h3>The Language of Candlesticks</h3>
<p>A candlestick is a single unit of price data that tells you four things: where the price opened, where it closed, how high it went, and how low it went during a specific period of time. Every candle on every chart you'll ever look at contains these four data points encoded in its shape. Learning to read that shape instantly — without thinking about it — is one of the most fundamental skills in technical trading.</p>
<h3>The Anatomy of a Candle</h3>
<p>Every candlestick has two components: the <strong>body</strong> and the <strong>wicks</strong> (also called shadows or tails).</p>
<p><strong>The Body</strong> represents the distance between the open and the close. A large body means price moved significantly from open to close. A small body means price ended up close to where it started — indecision, or a balance of buying and selling pressure.</p>
<p>The color of the body tells you the direction: a <strong>green (or white) body</strong> means the close was higher than the open — buyers won that period. A <strong>red (or black) body</strong> means the close was lower than the open — sellers won that period.</p>
<p><strong>The Upper Wick</strong> is the line above the body extending to the highest price reached during the period. A long upper wick means price rose significantly at some point but was rejected — sellers pushed it back down before the period closed. This is bearish pressure.</p>
<p><strong>The Lower Wick</strong> is the line below the body extending to the lowest price reached during the period. A long lower wick means price fell significantly at some point but recovered — buyers stepped in and pushed it back up. This is bullish pressure.</p>
<h3>What the Body-to-Wick Ratio Tells You</h3>
<p>The relationship between body size and wick size reveals the conviction of the winning side.</p>
<p>A candle with a large green body and tiny wicks means buyers were in control from open to close with almost no meaningful resistance. Strong conviction. A candle with a small green body and long wicks on both ends means the period was contested — neither side dominated for long. Low conviction.</p>
<p>The most significant candles are those where price moves decisively in one direction, closes near the extreme of its range, and leaves little or no opposing wick. These are called <strong>full-body candles</strong> or <strong>strong candles</strong> and they represent clear, one-directional pressure.</p>
<h3>Candles in Context</h3>
<p>The most important rule of candlestick reading: no candle has meaning in isolation. Every candle must be read in the context of the candles around it, the level it's forming at, and the volume behind it.</p>
<p>A long red candle forming after a 10-day uptrend at a key resistance level tells a very different story than the same red candle forming in the middle of a range with no obvious context. The shape is identical. The meaning is completely different.</p>
<ul>
<li>What was the trend before this candle?</li>
<li>What level or structure is this candle forming at?</li>
<li>Was the volume on this candle above or below average?</li>
<li>What did the next candle do?</li>
</ul>
<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">Every time you look at a candle, ask yourself: who won this period — buyers or sellers? How convincingly did they win? And what does that tell me about likely future price action? Answering these three questions for every significant candle on a chart is the foundation of candlestick literacy.</div></div>
<h3>Timeframes and Candle Size</h3>
<p>One candlestick on a 1-minute chart represents one minute of trading. On a 5-minute chart, five minutes. On a daily chart, one full trading day. The same stock will look completely different depending on which timeframe you choose — and all of those views are simultaneously true.</p>
<p>A single daily candle contains 390 one-minute candles inside it. The daily candle shows you the big picture — where the stock started and ended the day. The 1-minute candles show you the detail — how it got there. Learning to move between timeframes and understand what each one is telling you is a skill developed in Section 09 of this course.</p>`},
'01-05':{title:'Setting Up Your Broker',content:`<p>Before your first trade you need a brokerage account. We recommend Webull for beginners — it has everything you need to get started without the complexity or fees of other platforms.</p><h3>Why Webull</h3><ul><li><strong>Free Level 2 data</strong> — see the order book in real time, which is essential for reading market depth</li><li><strong>Paper trading built in</strong> — practice with fake money before risking real capital</li><li><strong>Commission-free</strong> — no per-trade fees on stocks and options</li><li><strong>Clean charting</strong> — technical analysis tools that work without a steep learning curve</li><li><strong>Mobile and desktop</strong> — trade from anywhere</li></ul><h3>How to get started</h3><ol><li>Download the Webull app or go to webull.com</li><li>Create an account and verify your identity</li><li>Fund your account (minimum varies — as little as $1 to start paper trading)</li><li>Explore the paper trading feature before using real money</li></ol><div class="callout"><div class="callout-label">TST Edge</div><p>Use Webull paper trading for at least 30 days before going live. Not because paper trading is perfect — it is not — but because it forces you to learn the platform, understand order types, and develop habits before real money is on the line.</p></div>`},
'01-06':{title:'Building Your Trading Setup',content:`<p>Your physical trading setup affects your performance more than most traders realize. Trying to day trade on a single laptop screen with a slow internet connection is like trying to drive a race car with one eye closed. Get the basics right before you trade serious size.</p><h3>Screens</h3><p>At minimum you need two monitors. One for your charts, one for your order entry and watchlist. Professional traders typically use three or four screens. If you are serious about active trading, a dual monitor setup is not a luxury - it is a necessity. You need to see multiple charts and your platform simultaneously without constantly switching windows.</p><h3>Internet Connection</h3><p>Your internet connection needs to be fast and reliable. Wired ethernet is always better than WiFi for trading - it is more stable and has lower latency. Have a backup plan for internet outages - a phone hotspot is the most practical backup option. Losing your connection during an open trade with no stop loss set is a serious risk.</p><h3>Computer Performance</h3><p>Trading platforms and multiple real-time charts consume significant computing resources. If your computer is slow, your charts will lag and your order entry will be delayed. At minimum you want a modern computer with 8GB of RAM. 16GB is better. Close all unnecessary programs while trading.</p><h3>The Trading Environment</h3><p>Trade in a quiet environment where you will not be interrupted during market hours. Distractions cause mistakes. Active trading requires full focus for the time you are watching the market - even a 30-second distraction at the wrong moment can be expensive.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Your trading setup is an investment in your performance. You would not try to do precision work with bad tools. Treat your trading infrastructure the same way. Spend what you need to spend to have a reliable, distraction-free setup before you risk significant capital.</p></div>`},
'01-07':{title:'Market Hours',content:`<p>The market doesn't treat all hours equally. Knowing when to trade is just as important as knowing what to trade.</p><h3>Pre-Market (4:00 AM — 9:30 AM ET)</h3><p>Lower volume, wider spreads, more volatile. News and earnings reports hit during this window. Best used for research and preparation.</p><h3>Market Open (9:30 AM — 10:30 AM ET)</h3><p>The highest volume, highest volatility window of the day. This is where the most opportunity exists — and also where the most damage is done to undisciplined traders. The open rewards preparation and punishes impulsiveness.</p><h3>Midday (10:30 AM — 2:00 PM ET)</h3><p>Volume drops significantly. Spreads widen. Price action gets choppy and unreliable. For most retail traders — especially beginners — this is the most dangerous time to trade.</p><h3>Power Hour (3:00 PM — 4:00 PM ET)</h3><p>Volume picks back up as institutions rebalance portfolios. The second best window of the day for active traders.</p><h3>After Hours (4:00 PM — 8:00 PM ET)</h3><p>Earnings reports frequently release here. Very low volume, very wide spreads. Not recommended for most beginners.</p><div class="callout"><div class="callout-label">TST Edge</div><p>If you only traded the open and power hour and did nothing in between, your results would probably improve immediately. Midday chop kills more accounts than bad setups ever will, especially if you trade options.</p></div>`},
'01-08':{title:'Pre-Market vs After Hours Trading',content:`<p>Not all trading hours are created equal. The regular session from 9:30 AM to 4:00 PM is where the majority of volume and price discovery happens. But the pre-market session (4:00 AM to 9:30 AM) and after hours session (4:00 PM to 8:00 PM) exist and are increasingly active - especially around news and earnings events. Understanding how these sessions behave differently from regular hours is critical before you attempt to trade them.</p><h3>Pre-Market Session</h3><p>Pre-market trading runs from 4:00 AM to 9:30 AM Eastern. Volume is significantly lower than the regular session - sometimes 90% lower on a quiet day. This means spreads are wider, price action is more erratic, and a single large order can move a stock significantly. The advantage of pre-market is that you can react to overnight news, earnings releases, and international market moves before the regular session opens. The disadvantage is that the price you see at 8:00 AM is often not where the stock opens at 9:30 AM after all participants weigh in.</p><h3>After Hours Session</h3><p>After hours trading runs from 4:00 PM to 8:00 PM Eastern. The most activity happens in the first 30-60 minutes after the close, particularly on earnings announcement days. The same rules apply as pre-market - wider spreads, lower volume, more volatile moves on less participation. A stock that moves 10% after hours on earnings will often gap to a different level when the regular session opens and full volume arrives.</p><h3>Key Differences From Regular Session</h3><p>Limit orders only - most brokerages do not allow market orders in extended hours. Lower liquidity means your order may not fill at all or may fill at a significantly different price than you intended. Not all stocks are tradeable in extended hours - some have very limited or zero pre-market and after hours activity. Stop losses often do not trigger in extended hours.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Pre-market and after hours prices are useful for reading sentiment and identifying potential gap levels for the next session. They are far less reliable for actual trading execution. Use extended hours to gather information, not to take significant positions unless you have a specific and well-understood reason to do so.</p></div>`},
'02-01':{title:'Expectancy: The Single Most Important Number',content:`<h3>The Number That Determines Everything</h3>
<p>Most traders obsess over win rate. They track how many trades they win, feel good when it's high, feel bad when it's low, and use it as their primary metric of success. This is a mistake — and understanding why is the first step toward thinking about trading mathematically.</p>
<p>Win rate alone tells you almost nothing about whether a trading strategy is profitable. A trader with a 70% win rate can lose money. A trader with a 35% win rate can be consistently profitable. The metric that actually determines profitability is <strong>expectancy</strong>.</p>
<h3>What Expectancy Is</h3>
<p>Expectancy is the average amount of money you make or lose per dollar risked, calculated across all your trades. It answers one question: <em>On average, what does each trade actually produce?</em></p>
<p>The formula is:</p>
<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text"><strong>Expectancy = (Win Rate × Average Win) − (Loss Rate × Average Loss)</strong><br><br>Where Loss Rate = 1 − Win Rate</div></div>
<h3>A Real Example</h3>
<p>Trader A wins 65% of their trades. Average win is $150. Average loss is $300. Their expectancy:</p>
<p>(0.65 × $150) − (0.35 × $300) = $97.50 − $105 = <strong>−$7.50 per trade</strong></p>
<p>Despite winning 65% of the time, Trader A is losing money on average. Every trade they take costs them $7.50 in expected value.</p>
<p>Trader B wins 40% of their trades. Average win is $400. Average loss is $150. Their expectancy:</p>
<p>(0.40 × $400) − (0.60 × $150) = $160 − $90 = <strong>+$70 per trade</strong></p>
<p>Trader B loses more often than they win. But every trade they take generates $70 in expected value. Over 100 trades, that's $7,000 in expected profit.</p>
<h3>Why Entry Price Alone Doesn't Matter</h3>
<p>A common obsession among new traders is finding the perfect entry — the exact bottom tick, the cleanest breakout candle, the ideal moment. While entry quality matters, it matters far less than most people believe.</p>
<p>What actually matters is the relationship between what you risk and what you stand to gain — and how consistently you capture that relationship across many trades. A slightly imperfect entry on a setup with positive expectancy is far more valuable than a perfect entry on a setup with no edge.</p>
<h3>Expectancy Is Not a Guarantee</h3>
<p>Expectancy is a long-run concept. On any individual trade, anything can happen. A setup with +$70 expectancy can lose on any given trade. Ten of them in a row can lose. This is normal variance — it does not mean the edge is gone.</p>
<p>The edge reveals itself over many trades. This is why sample size matters so much — a concept covered in lesson 02-03. And it's why emotional reactions to individual trade outcomes are almost always the wrong response.</p>
<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">Calculate your expectancy. If it's positive, you have a profitable strategy — protect it, scale it, don't mess with it. If it's negative or zero, no amount of optimism or conviction will save you. The math is the answer.</div></div>`},
'02-02':{title:'What Edge Actually Is',content:`<h3>What Edge Actually Is</h3>
<p>The word "edge" gets used constantly in trading. "I have an edge." "Find your edge." "Protect your edge." But most traders who use the word couldn't define it precisely — which means they almost certainly don't have one.</p>
<p>Edge is not a setup. It's not a pattern you've noticed. It's not a feeling about how a stock is behaving. Edge is a <strong>repeatable statistical advantage</strong> — a condition where, applied consistently over many occurrences, your results are better than random chance by a meaningful and measurable margin.</p>
<h3>What Edge Is Not</h3>
<p><strong>Edge is not gut feeling.</strong> Intuition can feel like edge. Experienced traders do develop pattern recognition that operates below conscious awareness. But until that intuition has been tested across a large sample of trades and shown to produce positive expectancy, it is not edge — it is a hypothesis.</p>
<p><strong>Edge is not recent luck.</strong> A string of winning trades feels like proof that you've found something. It is not. A coin flipped 10 times can come up heads 8 times. That doesn't make the coin special. Ten winning trades in a row is consistent with random noise. It is not evidence of edge.</p>
<p><strong>Edge is not someone else's setup.</strong> A setup that produces edge for one trader may produce no edge for another — because edge depends on execution, timing, position sizing, and market conditions, not just the pattern itself.</p>
<h3>Common Types of Real Edge</h3>
<p><strong>Momentum edge</strong> — The tendency for stocks that have moved strongly in a direction to continue moving in that direction over a short time horizon. This is one of the most documented phenomena in market research. Bull flags, gap and go plays, and breakout strategies exploit momentum edge.</p>
<p><strong>Mean reversion edge</strong> — The tendency for stocks that have moved to an extreme to return toward an average. Oversold bounces, VWAP reclaim plays, and washout longs exploit mean reversion edge.</p>
<p><strong>Time-based edge</strong> — Certain times of day produce more reliable setups than others. The first 90 minutes of trading and the last hour contain a disproportionate share of profitable setups. Trading during the lunch hour (11am-2pm) tends to produce lower quality results across many strategies.</p>
<p><strong>Volume-based edge</strong> — Setups with abnormally high relative volume tend to follow through more reliably than the same setup on average volume. RVOL is a filter that improves the quality of almost any momentum strategy.</p>
<h3>Why Most Traders Think They Have Edge When They Don't</h3>
<p>Three cognitive biases destroy accurate self-assessment in trading:</p>
<ul>
<li><strong>Recency bias</strong> — Recent results loom larger than older results. A good week makes you feel like you have edge. A bad week makes you feel like you've lost it. Neither is accurate without sufficient sample size.</li>
<li><strong>Selective memory</strong> — Humans remember wins more vividly than losses. The two trades you made $800 on are crystal clear. The four trades where you lost $200 each feel less significant, even though mathematically they cancelled the wins.</li>
<li><strong>Attribution error</strong> — When trades go well, we attribute it to skill. When they go poorly, we attribute it to bad luck, bad fills, or unusual market conditions. Honest self-assessment requires applying the same standard to both outcomes.</li>
</ul>
<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">Does your strategy produce positive expectancy over a statistically significant sample of trades, consistently across different market conditions? If yes — you have edge. If you can't answer that question with data, you don't know yet.</div></div>`},
'02-03':{title:'Proving Your Edge Exists',content:`<h3>How to Know If Your Edge Is Real</h3>
<p>Having a feeling that a setup works is not the same as knowing it works. Trading based on a feeling that hasn't been tested is gambling with extra steps. The only way to genuinely know whether you have edge is to apply the scientific method to your own trading — systematically collect data, analyze it honestly, and let the numbers tell you the truth.</p>
<h3>The Minimum Sample Size</h3>
<p>Thirty trades is the absolute minimum sample required to begin drawing conclusions about a setup. This is not an arbitrary number — it comes from statistical theory. Below 30 trades, the results are so dominated by variance that they reveal almost nothing about the underlying setup quality.</p>
<p>One hundred trades is better. Two hundred is better still. The more data you have, the more confident you can be that what you're seeing reflects the actual characteristics of the setup rather than a lucky or unlucky streak.</p>
<p>This means when you first start trading a new setup, you should have no strong opinion about whether it "works." You are collecting data. The first 30 trades are research, not performance. Treat them accordingly.</p>
<h3>What to Track</h3>
<p>For each trade in your sample, record:</p>
<ul>
<li>The setup type</li>
<li>Entry price and exit price</li>
<li>Planned stop and target at entry</li>
<li>Actual result in dollars and R multiple</li>
<li>Market conditions (trending, choppy, high volume, low volume)</li>
<li>Time of day</li>
</ul>
<p>After 50-100 trades, patterns will emerge. You'll see that certain setups perform well in trending markets and poorly in choppy ones. That certain times of day produce better results. That your win rate on one setup is 55% and on another it's 38%. This is the beginning of real self-knowledge as a trader.</p>
<h3>Win Rate vs Risk/Reward: The Tradeoff</h3>
<p>There is a fundamental tradeoff in trading strategy design: win rate and average R multiple move in opposite directions.</p>
<p>Strategies with tight targets and wide stops produce high win rates but low average R multiples. Strategies with wide targets and tight stops produce low win rates but high average R multiples. Neither is inherently superior — what matters is that the combination produces positive expectancy.</p>
<p>The danger zone is strategies with both low win rates AND low R multiples. This is negative expectancy by definition and no amount of refinement will save it.</p>
<h3>When You Have Enough Data to Claim Edge</h3>
<p>You can claim a setup has edge when:</p>
<ul>
<li>You have at least 50-100 trades in the sample</li>
<li>The trades span different market conditions — not just one trending month</li>
<li>The expectancy is positive and meaningful — not just barely above zero</li>
<li>The results have been consistent over multiple sub-periods within the sample</li>
</ul>
<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">One good month is not proof of edge. Six consistent months across bull and bear conditions is starting to look like evidence. Two years of consistent positive expectancy is edge. Most traders never collect enough data to know either way — which is why most traders never really know if what they're doing works.</div></div>`},
'02-04':{title:'Reading Your Own Scorecard',content:`<h3>Learning to Read Your Own Numbers</h3>
<p>Your trading journal is only useful if you know how to read what it's telling you. Most traders track their trades but don't analyze them — they record the data and never extract the insight. This lesson teaches you to look at your own scorecard and understand exactly what the numbers mean.</p>
<h3>Profit Factor</h3>
<p>Profit factor is the ratio of gross winning dollars to gross losing dollars across all trades in a period.</p>
<p><strong>Profit Factor = Total Winning Dollars ÷ Total Losing Dollars</strong></p>
<p>A profit factor of 1.0 means you broke even. Below 1.0 means you lost money overall. Above 1.0 means you made money. The higher the profit factor, the more robust the edge.</p>
<ul>
<li>1.0 — Breakeven</li>
<li>1.2-1.5 — Marginal edge, likely not enough to survive slippage and commissions long-term</li>
<li>1.5-2.0 — Solid edge</li>
<li>2.0+ — Strong edge</li>
</ul>
<p>Profit factor is more useful than win rate because it accounts for the size of wins and losses, not just the count. A 60% win rate with a profit factor of 0.9 is a losing strategy. A 40% win rate with a profit factor of 1.8 is a winning one.</p>
<h3>Win Rate in Context</h3>
<p>Your win rate only means something when viewed alongside your average win size and average loss size. Calculate your win rate and then ask: given my average win and average loss, is this win rate high enough to produce positive expectancy?</p>
<p>If your average win is $200 and your average loss is $150, you need a win rate above 43% to be profitable. If your average win is $100 and your average loss is $200, you need a win rate above 67% to be profitable. Know your breakeven win rate for your actual average win/loss ratio.</p>
<h3>Expectancy Per Trade</h3>
<p>Expectancy per trade (covered in depth in lesson 02-01) tells you the average dollar result of each trade you take. This is the single most useful number in your scorecard. If your expectancy is +$45 per trade and you take 200 trades in a year, your expected annual profit is $9,000 — before accounting for variance.</p>
<h3>Consecutive Losses and Psychological Impact</h3>
<p>Even a strategy with strong positive expectancy will produce losing streaks. Understanding the statistical probability of streaks helps remove the emotional charge from them.</p>
<p>With a 50% win rate, the probability of 5 consecutive losses is 3.1%. It sounds rare but across 200 trades, you'd expect it to happen roughly 6 times. With a 40% win rate, 5 consecutive losses happen with 7.8% probability — multiple times per year for an active trader.</p>
<p>Knowing this in advance prevents you from concluding that a strategy is broken after a normal losing streak. It also helps you identify when a streak is actually abnormal — when it's long enough that variance alone can't explain it and something may have genuinely changed.</p>
<h3>Identifying Which Setups Actually Work</h3>
<p>Break your journal data down by setup type. Calculate win rate, average win, average loss, and profit factor separately for each setup you trade. What you'll almost always find is that your edge is not uniform — two or three setups are responsible for most of your profit, and several others are neutral or slightly negative.</p>
<p>This is one of the most important discoveries a trader can make. Once you know which setups are carrying your results, you can allocate more attention and larger size to those setups and reduce or eliminate exposure to the ones that aren't contributing.</p>
<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">Pull your last 100 trades. Calculate profit factor, win rate, and expectancy for each setup type you trade. The results will almost certainly surprise you — and they will tell you exactly where to focus your energy.</div></div>`},
'02-05':{title:'Know What Changed',content:`<h3>When Results Change — What Does It Actually Mean?</h3>
<p>Every trader eventually experiences a period where results deteriorate. Win rate drops. Losing streaks extend. Setups that used to work stop working. The most important question you can ask in that moment is: <em>Is my edge gone, or am I executing poorly?</em></p>
<p>These are two completely different problems with two completely different solutions. Confusing them is one of the most costly mistakes a trader can make.</p>
<h3>Execution Problems vs Edge Problems</h3>
<p><strong>Execution problems</strong> look like: taking setups correctly defined but entering at worse prices than usual, moving stops prematurely, cutting winners too early, or increasing size at the wrong moments. The setups themselves are still valid — the execution is degrading.</p>
<p>Execution problems are usually psychological. They show up during periods of stress, after a big loss, or when a trader has been sitting in front of screens for too long without a break. The fix is not to change the strategy — it's to return to mechanical execution, reduce size, and address the psychological state causing the degradation.</p>
<p><strong>Edge problems</strong> look like: the underlying conditions that made a setup work have changed and no longer exist. The setup is being executed correctly but is producing different results than the historical baseline suggests it should.</p>
<p>Edge problems require strategy modification or abandonment of the setup entirely — a much more serious intervention.</p>
<h3>Market Conditions That Kill Edge</h3>
<p>Most setups are condition-dependent. A momentum breakout strategy that performs excellently in a trending, high-volume market may produce negative expectancy in a low-volume, range-bound market. This isn't edge loss — it's edge misapplication.</p>
<p>Before concluding your edge is gone, ask: have market conditions changed in a way that would systematically hurt this type of setup? Common condition shifts that affect edge:</p>
<ul>
<li><strong>Volatility contraction</strong> — Breakout strategies underperform when VIX is low and daily ranges compress</li>
<li><strong>Sector rotation</strong> — Momentum strategies work best when the same sectors are leading consistently; they struggle during rotation</li>
<li><strong>Liquidity changes</strong> — Small cap strategies can degrade when retail participation drops and volume dries up</li>
<li><strong>Fed policy shifts</strong> — Growth/momentum names are more sensitive to interest rate expectations than value names</li>
</ul>
<h3>Seasonal Patterns in Your Results</h3>
<p>Many traders have natural seasonal patterns in their results — periods of the year where their particular setups outperform or underperform historically. Summer months (June-August) tend to have lower volume and more choppy price action, which hurts momentum strategies. Q4 and early Q1 tend to be more directional and trend-following setups perform better.</p>
<p>Reviewing your results by month and quarter over multiple years will reveal whether your "bad periods" are actually seasonal — in which case the solution is reducing size during those periods, not abandoning the strategy.</p>
<h3>When to Abandon a Setup</h3>
<p>A setup should be reconsidered when:</p>
<ul>
<li>Results have degraded across at least 50+ trades over multiple months</li>
<li>The degradation persists across different market conditions</li>
<li>You cannot identify a mechanical execution reason for the underperformance</li>
<li>Profit factor has dropped from historically positive to below 1.0 and stayed there</li>
</ul>
<p>Even then, before abandoning, paper trade the setup for 30 more occurrences to confirm. Markets change, but they also cycle. A setup that underperforms for six months may return to profitability when conditions rotate.</p>
<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">Before changing anything, ask: "If I look at my last 30 trades and grade my execution honestly — did I follow my rules?" If the answer is no, fix execution first. If the answer is yes and results are still poor, then you have an edge question worth investigating.</div></div>`},
'02-06':{title:'Your Personal Playbook',content:`<h3>What a Playbook Is</h3>
<p>A trading playbook is a written document — not just a mental framework, an actual written document — that defines the specific setups you trade, the exact conditions required for each setup, your entry and exit criteria, your position sizing rules, and your risk parameters for each.</p>
<p>Every professional trader has one. Most retail traders don't. This is not a coincidence.</p>
<p>A playbook forces clarity. It's easy to think you know what you're doing when the criteria exist only in your head. When you try to write them down precisely — "I enter when price breaks above the high of the first 5-minute candle with RVOL above 1.5 and the stock is in the top 5 pre-market gainers" — vagueness becomes obvious immediately. Writing the setup forces you to define it.</p>
<h3>Why Playbooks Beat Random Discretion</h3>
<p>Random discretion means taking trades because they "look good" — some combination of pattern recognition, intuition, and in-the-moment judgment. For most traders, this produces inconsistent results because the criteria shift based on mood, recent results, and how much they slept the night before.</p>
<p>A playbook eliminates the need to make fundamental decisions in the moment. When a setup appears, the question isn't "should I take this?" — the question is "does this match the criteria in my playbook?" If yes, you take it. If no, you don't. This removes the emotional decision-making loop that kills most traders.</p>
<h3>Building the Playbook: 5-8 Setups Maximum</h3>
<p>A playbook should contain 5 to 8 setups — no more. More than 8 and you're not running a playbook, you're running a catch-all that includes every pattern you've ever seen. The goal is depth, not breadth: fewer setups, deeply understood and thoroughly tested, each with a clear statistical basis.</p>
<p>For each setup in your playbook, document:</p>
<ul>
<li><strong>Setup name</strong> — What you call it</li>
<li><strong>Required conditions</strong> — Exactly what must be true for the setup to be valid</li>
<li><strong>Entry trigger</strong> — The specific event that triggers your entry</li>
<li><strong>Stop placement</strong> — Where your stop goes and why</li>
<li><strong>Target(s)</strong> — Where you plan to take profits</li>
<li><strong>Position size</strong> — How you size this particular setup</li>
<li><strong>Historical stats</strong> — Win rate, avg win, avg loss, profit factor from your journal data</li>
</ul>
<h3>Testing Each Setup</h3>
<p>Before adding a setup to your playbook, it must have at least 50 documented occurrences — either from paper trading or live trading with small size. The statistics from those 50+ trades determine whether the setup earns a place in the playbook.</p>
<p>Setups that show positive expectancy across 50+ trades in different market conditions get added. Setups that show neutral or negative expectancy get removed or modified and retested. This is not a feeling — it's a data-driven process.</p>
<h3>The Trap of Setup Stacking</h3>
<p>Setup stacking is the tendency to keep adding requirements to a setup until it almost never triggers — and then feeling good about the results because the small sample of filtered trades looks great.</p>
<p>This is a trap. A setup that requires 7 specific conditions to align before entry might only appear twice a month. That's not an edge — that's a sample size too small to mean anything. The best setups are simple, clear, and appear frequently enough to generate statistical significance within a reasonable time frame.</p>
<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">Open a document right now and write down the 2-3 setups you trade most frequently. For each one, write the entry conditions as precisely as you can. Then look at your last 20 trades in that setup and see if the criteria you wrote down actually match what you traded. The gap between what you think you trade and what you actually trade is often significant — and closing that gap is one of the most valuable exercises in all of trading.</div></div>`},
'03-01':{title:'What Is Support & Resistance',content:`<p>Support is a price level where buying interest is strong enough to stop a decline and potentially reverse it. Think of support as a floor. When price approaches this level, buyers step in and defend it. The more times a level has held, the more significant it becomes.</p><p>Resistance is a price level where selling interest is strong enough to stop an advance and potentially reverse it. Think of resistance as a ceiling. When price approaches this level, sellers step in and defend it.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Support and resistance are not precise lines — they are zones. A level that was support at $49.80 might hold at $49.50 the next time. Think in terms of areas rather than exact prices. Give levels a little room and your entries will be far more consistent.</p></div>`},
'03-02':{title:'How Price Reacts to Levels',content:`<p>Understanding that a level exists is half the battle. Understanding how price typically behaves when it reaches that level is the other half.</p><h3>Clean holds</h3><p>Price approaches the level, pauses, and reverses cleanly. This is the strongest signal and produces the highest quality setups. Enter on the bounce with a stop just below the level.</p><h3>Level breaks and reclaims</h3><p>Price briefly breaks below a support level, shakes out weak holders, then reclaims it quickly. This is called a stop hunt or liquidity sweep. The reclaim of the level is actually a stronger signal than a clean hold because it has already flushed the weak hands.</p><h3>Multiple tests weakening the level</h3><p>The more times a level is tested the weaker it becomes. When a level finally gives way after multiple tests the move tends to be significant.</p><h3>Polarity</h3><p>One of the most powerful concepts in technical analysis. When support breaks it often becomes resistance, and when resistance breaks it often becomes support. There's a saying in trading: "old support becomes new resistance" and vice versa. If the stock couldn't break $10 and finally broke that resistance, $10 would now become the support instead of resistance.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The cleanest trade in all of technical analysis is the polarity play — waiting for a key level to break, watching price pull back to retest that level from the other side, and entering when price holds. The level has been tested, confirmed, and now has fresh buyers underneath it. Risk is well defined and the setup is clean.</p></div>`},
'03-03':{title:'Identifying Key Levels',content:`<p>Not all support and resistance levels are created equal. Learning to identify the most significant levels — the ones institutions are watching — is a skill that separates good traders from average ones.</p><ul><li><strong>Prior highs and lows</strong> — prior all-time highs, prior day highs and lows, prior week highs and lows.</li><li><strong>Whole numbers</strong> — $1, $10, $50, $100, $200. Round numbers attract large option strikes, institutional orders, and retail stop losses.</li><li><strong>Areas of high volume</strong> — where the most trading has occurred historically. That level has memory.</li><li><strong>Gap levels</strong> — the top and bottom of unfilled price gaps. Gaps frequently act as magnets.</li><li><strong>Moving averages</strong> — the 10, 20, 50, and 200 day moving averages act as dynamic support and resistance.</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>The best key levels are the ones you identified before price reached them. Start your pre-market prep by marking the most significant levels on your watchlist stocks before the market opens. Those are your decision points for the day. Examples: Previous day high, previous day low, previous day close, premarket low, premarket high, and once market opens the opening print. Always look for confluence — without multiple confluences it's simply just a line.</p></div>`},
'03-04':{title:'Drawing Trendlines',content:`<p>A trendline is a straight line drawn along a series of highs or lows that visually represents the direction and angle of a trend.</p><h3>How to draw a valid trendline</h3><p>An uptrend trendline connects a series of higher lows. You need at least two confirmed lows to draw the line — but the line only becomes significant after the third touch confirms it. Draw the line along the bottom of the wicks, not the bodies.</p><p>A downtrend trendline connects a series of lower highs. Two points to draw, three touches to confirm significance. Draw along the tops of the wicks.</p><h3>Common mistakes</h3><p><strong>Forcing a line</strong> — drawing a trendline that only works if you ignore obvious price action. If you're struggling to make it fit, it probably doesn't exist.</p><p><strong>Drawing too many lines</strong> — be selective. Only draw lines that are clean, well-tested, and at obvious angles.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The angle of the trendline matters. An extremely steep trendline is unsustainable and will break soon. The most reliable trendlines are at 30-45 degree angles. They represent sustainable momentum without being overextended.</p></div>`},
