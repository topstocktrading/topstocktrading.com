</svg></div><p>The Cup and Handle is a bullish continuation pattern made famous by William O'Neil. It forms over a longer time period — typically weeks to months — and signals a stock consolidating before a major breakout.</p><h3>The Cup</h3><p>A rounded, U-shaped consolidation. Price declines gradually, rounds out at the bottom without sharp moves, and gradually rises back to near the prior high. The key word is rounded — not a V-shape. The gradual rounding indicates orderly accumulation.</p><h3>The Handle</h3><p>After the cup forms, a small consolidation forms — typically a slight downward drift on low volume. The handle shakes out the last remaining weak holders before the breakout.</p><ul><li><strong>Entry:</strong> When price breaks above the handle's upper trendline with strong volume</li><li><strong>Stop:</strong> Below the handle's low</li><li><strong>Target:</strong> The depth of the cup added to the breakout point</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>The cup and handle is a longer term pattern — most effective on daily and weekly charts. The pattern derives its strength from the extended accumulation period. The longer the base, the bigger the potential move.</p></div>`},
'b7-0':{title:'What Is Consolidation',content:`<p>Most chart patterns you'll learn — flags, pennants, triangles, cups and handles — are simply consolidation taking a recognizable form. Understanding consolidation first is what makes those patterns make sense.</p><p>Consolidation is a period of sideways price action after a directional move. The market moves in phases — impulse moves followed by consolidation, then another impulse move. Learning to identify consolidation patterns and wait for the breakout is one of the most powerful skills in trading.</p><h3>Healthy consolidation characteristics</h3><ul><li>Tight price range — price is coiling, not swinging wildly</li><li>Decreasing volume — the battle is quieting down</li><li>Clean structure — clear upper and lower boundaries that price respects</li><li>Time — consolidation takes time to build. A one or two candle pause is not consolidation.</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>Not all tight ranges are healthy consolidation. A stock consolidating after a strong move is building energy for the next leg. A stock consolidating after a failed breakout with heavy selling is distributing — smart money is selling to retail buyers who think the consolidation is a gift. Always identify the context.</p></div>`},
'b7-1':{title:'Trading Inside Consolidation',content:`<p>Once you've identified a consolidation, you have two choices — trade within the range or wait for the breakout. Both are valid strategies but they have different risk profiles.</p><h3>Trading within the range</h3><p>Buy near the bottom of the consolidation with a stop just below it. Sell near the top. This requires the range to be wide enough to justify the trade — you need enough room between your entry and your target to achieve a minimum 2:1 reward to risk ratio.</p><h3>What not to do</h3><p>Don't buy in the middle of consolidation. You have no edge there — you're too far from support for a tight stop on a long, and too far from resistance for a tight stop on a short. The middle of a range is where you go to give money away.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The best consolidations to trade within are the wide, clean, well-defined ones with multiple touches on both boundaries. If you can't clearly see the top and the bottom, don't trade within it. Wait for the breakout instead.</p></div>`},
'b7-2':{title:'Breakouts From Consolidation',content:`<p>The breakout from consolidation is where the real opportunity lies. After price has coiled in a tight range and volume has dried up, the eventual expansion of volume and price is one of the most reliable setups in trading.</p><h3>What a quality breakout looks like</h3><ul><li>Price approaches the upper boundary that has held multiple times</li><li>Volume begins to increase as the level is tested</li><li>Price breaks through cleanly — not just a wick poke</li><li>Volume expands significantly on the break</li><li>The candle that breaks out has a strong close — not a close back inside the range</li></ul><h3>The failed breakout</h3><p>Price breaks above resistance, attracts buyers who chase the breakout, then immediately reverses back into the range. This is a bull trap. It's why volume confirmation is non-negotiable.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The best breakouts make you feel like you're chasing. By the time the candle closes above resistance on high volume and you're convinced it's real, the stock has already moved 1-2%. That's okay. The entry that feels safe and obvious is usually the entry that's actually late.</p></div>`},
'b8-0':{title:'Types of Gaps',content:`<p>A gap is an area on the chart where no trading occurred — price jumped from one level to another without any transactions in between. Gaps represent a significant imbalance between buyers and sellers.</p><h3>Common Gap</h3><p>A small gap with no particular significance. These gaps fill quickly and frequently. Low trading value.</p><h3>Breakaway Gap</h3><p>Occurs at the breakout of a significant pattern. High volume, significant news or catalyst. This type of gap signals the beginning of a new trend. Breakaway gaps rarely fill quickly — the move has conviction behind it.</p><h3>Runaway Gap (Continuation Gap)</h3><p>Occurs in the middle of a strong trend. Signals that momentum is accelerating and institutional participation is increasing.</p><h3>Exhaustion Gap</h3><p>Occurs near the end of a strong trend — often on very high volume after a prolonged move. The gap looks like the trend is accelerating but it's actually the final wave before exhaustion. These gaps fill relatively quickly.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The type of gap matters enormously. A gap up on earnings after a stock that's been building a solid base for months is a breakaway gap — don't fade it. A gap up after a stock has already run 40% in a week on massive volume is an exhaustion gap — don't chase it. Context, context, context.</p></div>`},
'b8-1':{title:'Gap Fills',content:`<p>A gap fill occurs when price returns to the level where the gap began — essentially closing the open space left on the chart.</p><h3>Gaps that fill quickly</h3><ul><li>Common gaps — no real catalyst, fill within a day or two</li><li>Exhaustion gaps — the trend is ending, price reverses to fill the gap</li><li>Gap downs on weak catalysts — buyers step in quickly</li></ul><h3>Gaps that take time or don't fill</h3><ul><li>Breakaway gaps on strong catalysts — strong earnings beat, major contract, FDA approval</li><li>Runaway gaps in strong sector trends — the gap is a symptom of something larger</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>Stop trying to fade every gap. A stock that gaps up 15% on a massive earnings beat is not necessarily going to fill that gap today, this week, or this month. Before you fade any gap ask yourself — is this catalyst strong enough to justify the gap? If yes, respect the move. If no, the fill trade has merit.</p></div>`},
'b8-2':{title:'Trading Gaps',content:`<p>Gaps create some of the most consistent and high probability trade setups available.</p><h3>Gap and Go</h3><p>A stock gaps up significantly on news or earnings. The setup is to buy the early consolidation after the initial gap move with a tight stop below the consolidation low. Target is measured by the pre-market high or prior resistance levels. Most applicable to: Strong earnings beats, major catalysts, stocks with high relative volume.</p><h3>Gap Fill Trade</h3><p>Buying a gap down or shorting a gap up expecting price to return to the prior close. Best applied to small gaps under 3% on weak or no catalysts.</p><h3>Gap as Support/Resistance</h3><p>After a gap up, the bottom of the gap frequently acts as support on any pullback. After a gap down, the top of the gap acts as resistance on any bounce. These levels are clean, obvious, and widely watched.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The gap and go requires discipline — you must wait for the early consolidation. Buying immediately at the open of a gapping stock without any consolidation is chasing, not trading.</p></div>`},
'b9-0':{title:'Reading Level 2',content:`<p>Level 2 is a display of all the current bids and offers for a stock — showing you not just the best price but the depth of the order book.</p><h3>The components of Level 2</h3><ul><li><strong>Bid side</strong> — all buyers, organized from highest price to lowest.</li><li><strong>Ask side</strong> — all sellers, organized from lowest price to highest.</li><li><strong>Size</strong> — the number of shares at each price level.</li></ul><h3>What Level 2 tells you</h3><p>Where the walls are — large blocks of shares at a specific price create temporary support or resistance. A seller with 50,000 shares at $50.00 is a wall — price will struggle to push through until that seller is absorbed or moves their order.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Level 2 is a tool for experienced traders — beginners often overthink it. The most important thing to watch is whether bids or asks are dominating. Are buyers aggressive and refreshing their bids? Or are sellers stepping in front of every uptick?</p></div>`},
'b9-1':{title:'Reading the Tape',content:`<p>The tape — also called time and sales — is a real time record of every transaction that occurs in a stock.</p><ul><li><strong>Green prints</strong> — trades that executed at the ask price. Buyers were aggressive.</li><li><strong>Red prints</strong> — trades that executed at the bid price. Sellers were aggressive.</li><li><strong>Large prints</strong> — big blocks of shares trading at once. Institutional activity.</li></ul><h3>Tape speed</h3><p>Fast tape with many prints — high activity, strong momentum. Slow tape with few prints — low interest, little conviction. The move may stall.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The tape tells the truth when the chart might lie. A chart can show a breakout that looks clean — but if the tape is showing nothing but red prints and sellers hitting bids on every uptick, that breakout is not what it appears. Learn to read it and you'll have an edge that most retail traders simply don't have.</p></div>`},
'b9-2':{title:'Spotting Buyers & Sellers',content:`<p>The ultimate goal of reading Level 2 and the tape is to identify who is in control — buyers or sellers — in real time.</p><h3>Signs of aggressive buying</h3><ul><li>Bids stacking up and refreshing quickly after being hit</li><li>Large green prints repeatedly lifting the ask</li><li>Price stepping up in an orderly staircase pattern</li><li>Ask side thinning out — sellers are being absorbed</li></ul><h3>Signs of aggressive selling</h3><ul><li>Asks refreshing quickly after being hit</li><li>Large red prints hitting bids repeatedly</li><li>Price stepping down in an orderly pattern</li><li>Bid side thinning out</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>The best trades are the ones where everything lines up — the chart pattern is clean, the tape shows buyers are aggressive, and Level 2 shows no significant walls above. When all three align it's not just a setup — it's a conviction trade. Those are the ones you size up on.</p></div>`},
'b10-0':{title:'How to Properly Use Indicators',content:`<p>Indicators are mathematical calculations derived from price and volume data. They are tools — not signals. This distinction is critical.</p><p>The biggest mistake beginners make is treating indicators as signals — "the RSI crossed above 30 so I buy." This approach ignores everything else happening in the market.</p><h3>Indicator lag</h3><p>All indicators are lagging — they're derived from past price data. They can never predict the future. They can only describe what has already happened and give you probabilistic insight into what might happen next.</p><h3>Too many indicators</h3><p>A chart covered in 10 different indicators is not a sophisticated chart — it's a confused one. Pick 2-3 indicators that complement each other and master them.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Price action is king. Indicators are servants. If a stock is clearly in an uptrend with strong volume and clean structure, an oversold RSI reading doesn't mean sell. Always start with price. Always.</p></div>`},
'b10-1':{title:'Moving Averages',content:`<p>A moving average smooths out price data over a specific period to show the average price over that time. It's the most widely used indicator in the world.</p><h3>The most important moving averages</h3><ul><li><strong>9 EMA</strong> — short term trend, used by active day and swing traders</li><li><strong>20 SMA</strong> — intermediate trend, acts as dynamic support in uptrending stocks</li><li><strong>50 SMA</strong> — medium term trend, watched by institutional traders</li><li><strong>200 SMA</strong> — long term trend, one of the most watched levels in all of finance</li></ul><h3>How to use them</h3><p>Moving averages act as dynamic support and resistance. In an uptrend, pullbacks to the 20 SMA that hold are buying opportunities. In a downtrend, bounces to the 20 SMA that fail are shorting opportunities.</p><p>Moving average crossovers — when a shorter term average crosses above a longer term average (golden cross) it signals potential bullish momentum. When it crosses below (death cross) it signals potential bearish momentum.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The 20 SMA and 50 SMA on the daily chart are your most important levels as a swing trader. When a stock that's been in a strong uptrend pulls back to its 20 SMA and holds — that's institutional buying. Those levels are watched by the biggest money in the market.</p></div>`},
'b10-2':{title:'RSI',content:`<p>The Relative Strength Index (RSI) is a momentum oscillator that measures the speed and magnitude of recent price changes. It ranges from 0 to 100.</p><ul><li><strong>RSI above 70</strong> — generally considered overbought.</li><li><strong>RSI below 30</strong> — generally considered oversold.</li><li><strong>RSI at 50</strong> — above 50 suggests bullish momentum, below 50 suggests bearish momentum.</li></ul><h3>The correct use of RSI</h3><p><strong>Divergence</strong> — the most powerful RSI signal. Bullish divergence occurs when price makes a lower low but RSI makes a higher low. This means the selling is losing momentum even though price is still declining.</p><p><strong>Trend confirmation</strong> — RSI staying above 50 in an uptrend confirms momentum. RSI breaking below 50 is an early warning sign.</p><div class="callout"><div class="callout-label">TST Edge</div><p>RSI divergence is worth understanding deeply. When a stock is making new lows but RSI is making higher lows — sellers are exhausted. They're pushing price down but doing it with less and less force each time. Price action at support plus RSI divergence is one of the most reliable reversal signals available.</p></div>`},
'b10-3':{title:'MACD',content:`<p>The MACD (Moving Average Convergence Divergence) is a trend-following momentum indicator that shows the relationship between two moving averages — typically the 12 and 26 period EMAs.</p><h3>The components</h3><ul><li><strong>MACD line</strong> — the difference between the 12 EMA and 26 EMA</li><li><strong>Signal line</strong> — a 9 period EMA of the MACD line</li><li><strong>Histogram</strong> — the difference between the MACD line and signal line</li></ul><h3>What MACD tells you</h3><ul><li>MACD line crosses above signal line — bullish signal</li><li>MACD line crosses below signal line — bearish signal</li><li>Both lines above zero — trend is bullish</li><li>Both lines below zero — trend is bearish</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>The MACD is most useful on daily charts for swing traders. On 1 and 5 minute charts it lags too much to be actionable for most setups. Use it to understand the broader momentum picture — is momentum building or fading?</p></div>`},
'b10-4':{title:'VWAP',content:`<p>VWAP — Volume Weighted Average Price — is the average price a stock has traded at throughout the day, weighted by volume. It is arguably the most important indicator for day traders.</p><h3>Why VWAP matters</h3><p>Institutions use VWAP as a benchmark. When they're buying a large position throughout the day they aim to buy near or below VWAP. This creates predictable behavior around the VWAP level.</p><ul><li><strong>Price above VWAP</strong> — buyers are in control. Bullish bias.</li><li><strong>Price below VWAP</strong> — sellers are in control. Bearish bias.</li></ul><h3>Reclaiming VWAP</h3><p>When a stock that's been below VWAP reclaims it and holds above — this is a significant shift. This is a high probability long setup with a stop below VWAP.</p><div class="callout"><div class="callout-label">TST Edge</div><p>VWAP is non-negotiable for day traders. If you don't have it on your chart you're trading blind. It resets every day at the open and represents the true fair value of the stock for that trading session.</p></div>`},
'b10-5':{title:'Volume Profile',content:`<p>Volume Profile displays the total volume traded at each price level over a specific time period — shown as horizontal bars on the chart. Unlike traditional volume indicators that show volume per time period, Volume Profile shows volume per price level.</p><h3>Key components</h3><ul><li><strong>Point of Control (POC)</strong> — the price level with the highest volume over the selected period. Price frequently returns to it and uses it as support or resistance.</li><li><strong>Value Area</strong> — the range of prices where approximately 70% of all volume traded.</li><li><strong>High Volume Nodes (HVN)</strong> — areas of high trading activity. Price tends to slow down and consolidate here.</li><li><strong>Low Volume Nodes (LVN)</strong> — areas of thin trading activity. Price tends to move through LVNs quickly.</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>Volume Profile takes time to master but it's worth the investment. When you combine Volume Profile with traditional support and resistance levels — and both align at the same price — you have institutional-grade confirmation.</p></div>`},
'b10-6':{title:'Fibonacci Retracement',content:`<p>Fibonacci retracement identifies potential support and resistance levels based on the Fibonacci sequence. The key ratios — 23.6%, 38.2%, 50%, 61.8%, and 78.6% — appear with remarkable consistency in financial markets.</p><h3>The key levels</h3><ul><li><strong>38.2%</strong> — shallow pullback. Strong trend. Buyers stepping in early.</li><li><strong>50%</strong> — the midpoint of the move. Very commonly watched.</li><li><strong>61.8%</strong> — the golden ratio. The most significant Fibonacci level. Strong reactions frequently occur here.</li><li><strong>78.6%</strong> — deeper pullback. Getting close to invalidating the trend.</li></ul><h3>Confluence</h3><p>Fibonacci levels become most powerful when they align with other forms of support and resistance — a prior high, a moving average, a VWAP level, or a high volume node.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The 61.8% Fibonacci retracement is the level worth memorizing. When a stock makes a strong move up, pulls back, and holds exactly at the 61.8% retracement — that's where buyers see value. Combine it with a volume dry up and a bullish candlestick pattern and you have one of the highest probability entry setups in all of technical analysis.</p></div>`},
'b11-0':{title:'Cash Account Rules',content:`<p>A cash account is the simplest type of brokerage account — you can only trade with money you actually have deposited. You cannot borrow from your broker.</p><h3>How a cash account works</h3><p>You deposit $10,000. You can trade up to $10,000 worth of stock. When you sell a position, the cash takes two business days to settle — T+2 settlement.</p><h3>Good Faith Violation</h3><p>If you buy a stock using unsettled funds and then sell that stock before the original funds settle — that's a Good Faith Violation. Three GFVs in a 12 month period will restrict your account to settled cash only for 90 days.</p><h3>Advantages</h3><ul><li>No PDT rule — you can day trade as many times as you want as long as you have settled cash</li><li>No margin calls — you can never lose more than you deposited</li><li>Simpler risk management — you're forced to trade within your means</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>Many beginners rush to open margin accounts because they want more buying power. The reality is that the best traders could trade with a cash account and still make exceptional returns. Mastering your craft in a cash account before adding leverage is the safer and smarter path.</p></div>`},
'b11-1':{title:'Margin Account Rules',content:`<p>A margin account allows you to borrow money from your broker to purchase securities — effectively giving you more buying power than your actual cash balance. This amplifies both gains and losses.</p><h3>Margin calls</h3><p>If your account value drops below the broker's minimum margin requirement (usually 25-30% of the position value), you receive a margin call — a demand to deposit additional funds or close positions immediately. Margin calls can force you to sell positions at the worst possible time.</p><h3>Overnight vs intraday margin</h3><p>Many brokers offer higher intraday margin — sometimes 4:1 — for day trades closed before market close. Overnight margin is typically 2:1. Holding a leveraged intraday position overnight triggers a margin call if you don't have enough equity.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Margin is the fastest way to both accelerate gains and blow up an account. Learn to trade profitably without leverage first. Add margin only when you have a proven track record and a real understanding of risk management.</p></div>`},
'b11-2':{title:'The PDT Rule Explained',content:`<p>The Pattern Day Trader (PDT) rule is one of the most discussed and most misunderstood regulations in retail trading.</p><h3>What is the PDT rule</h3><p>If you execute four or more day trades within a five business day rolling period in a margin account with less than $25,000, you are flagged as a Pattern Day Trader. Once flagged, you must maintain a minimum balance of $25,000 at all times to continue day trading.</p><h3>How to work around the PDT rule if you have under $25,000</h3><ul><li>Use a cash account — PDT does not apply to cash accounts</li><li>Focus on swing trades — hold positions overnight and avoid same-day closes</li><li>Be selective — you have 3 day trades per 5 days in a margin account under $25k, use them wisely</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>The $25,000 threshold is not arbitrary — it's the SEC's way of ensuring that people who are actively day trading have sufficient capital to absorb losses. If you're under $25,000, treat the PDT rule as a risk management tool, not just a legal restriction.</p></div>`},
'b12-0':{title:'Going Long',content:`<p>Going long means buying a security with the expectation that its price will rise. When you go long, you profit when the price goes up and lose when the price goes down.</p><h3>When to go long</h3><ul><li>Stock is in an uptrend — higher highs and higher lows on the relevant timeframe</li><li>Price is at or near a key support level with a defined stop below it</li><li>Volume is confirming the move — buyers are participating</li><li>The overall market is in your favor</li></ul><h3>Position sizing</h3><ul><li>Determine your stop level first — where are you wrong on this trade?</li><li>Calculate the dollar risk per share — entry price minus stop price</li><li>Divide your maximum dollar risk per trade (1-2% of account) by the dollar risk per share</li><li>That gives you your position size</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>Most beginners go long on everything — they only know how to make money when stocks go up. This is a significant limitation. Markets spend roughly 30% of their time in downtrends. Traders who can only go long are sitting on the sidelines during those periods. Expand your toolkit.</p></div>`},
'b12-1':{title:'Going Short',content:`<p>Going short means selling shares you don't own — borrowing them from your broker — with the expectation that the price will fall, allowing you to buy them back at a lower price and pocket the difference.</p><h3>The risks unique to shorting</h3><ul><li><strong>Unlimited loss potential</strong> — when you buy a stock it can only go to zero. When you short a stock it can theoretically go to infinity.</li><li><strong>Short squeezes</strong> — when a heavily shorted stock rises, short sellers are forced to buy to cover, which drives the price up further.</li><li><strong>Borrow fees</strong> — you pay to borrow the shares you're shorting. Hard to borrow stocks can carry extremely high borrow fees.</li></ul><h3>When to go short</h3><ul><li>Stock is in a clear downtrend — lower highs and lower lows</li><li>Price is at or near a key resistance level with a defined stop above it</li><li>Volume is confirming selling pressure</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>Short selling requires more discipline and faster execution than going long. The market falls faster than it rises. Your stops must be tight and your conviction must be high.</p></div>`},
'b12-2':{title:'Short Selling Mechanics',content:`<p>Understanding the mechanical process of short selling is essential before you place your first short trade.</p><h3>How to short sell</h3><p>In your brokerage platform, instead of clicking "Buy" you click "Sell Short." The broker locates shares to borrow from their inventory or from other clients' accounts and executes the short sale.</p><h3>Hard to borrow stocks</h3><p>When short interest is very high, available shares become scarce. Brokers mark these stocks as "HTB" — hard to borrow. They charge a daily borrow fee to maintain the short position. Check the borrow fee before shorting any stock with high short interest.</p><h3>Covering your short</h3><p>To close a short position you "buy to cover" — buying the shares you previously sold short and returning them to the lender. Your profit or loss is the difference between your short sale price and your cover price.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Before you short any stock, know your borrow fee and your broker's locate availability. Have a backup broker with better locate availability for active short selling. The setup means nothing if you can't execute.</p></div>`},
'b13-0':{title:'Market Orders',content:`<p>A market order is an instruction to buy or sell a security immediately at the best available current price. It guarantees execution but does not guarantee price.</p><h3>When market orders make sense</h3><ul><li>When you need to exit a position immediately — stop loss situations, unexpected news events</li><li>When you're trading highly liquid stocks with tight bid/ask spreads</li><li>When speed is more important than precision</li></ul><h3>When market orders are dangerous</h3><ul><li>In pre-market or after-hours trading — spreads can be extremely wide</li><li>In illiquid stocks — the bid/ask spread can be large and your market order can move the price significantly against you</li><li>During fast moving markets</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>Never use a market order on a thinly traded stock. The spread alone can be 2-5% of the stock's price, and your market order will immediately put you at a significant loss. Always use limit orders on small cap stocks.</p></div>`},
'b13-1':{title:'Limit Orders',content:`<p>A limit order is an instruction to buy or sell a security at a specific price or better. A limit order guarantees price but does not guarantee execution.</p><ul><li><strong>Buy limit order:</strong> Executes at your specified price or lower.</li><li><strong>Sell limit order:</strong> Executes at your specified price or higher.</li></ul><h3>Advantages</h3><ul><li>Price control — you know exactly what you'll pay or receive</li><li>No slippage — your fill is at your price or better</li><li>Forces discipline — you set your entry price before the trade, not in the heat of the moment</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>Get in the habit of using limit orders for entries. It forces you to identify your entry price before the trade is live — which means you've thought about it calmly rather than reacting emotionally.</p></div>`},
'b13-2':{title:'Stop Orders',content:`<p>A stop order is an instruction to buy or sell a security once it reaches a specified price. Once the stop price is reached, the stop order becomes a market order.</p><h3>Stop placement</h3><p>Stops should be placed at technically significant levels — below support for longs, above resistance for shorts. Place stops where the thesis is invalidated — where if price reaches that level, you're wrong.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The hardest part of using stop losses is not placing them — it's not moving them. The moment you move your stop further away because the stock is close to hitting it, you've abandoned your plan and are now hoping. Honor your stops every single time.</p></div>`},
'b13-3':{title:'Stop Limit Orders',content:`<p>A stop limit order combines features of both stop orders and limit orders. It has two prices — the stop price and the limit price. When the stop price is reached, instead of becoming a market order it becomes a limit order at the specified limit price.</p><h3>The risk of stop limit orders</h3><p>If the stock gaps down or moves rapidly through your limit price, your order may not execute. You wanted to exit at $47.50 but the stock opens at $45 the next day after bad news — your limit order never fills and you're still holding a losing position.</p><div class="callout"><div class="callout-label">TST Edge</div><p>For most active traders, a plain stop loss (stop market) is safer than a stop limit. The risk of not getting filled — of your stop limit sitting there while the stock crashes through it — is worse than the slippage risk of a market stop.</p></div>`},
'b13-4':{title:'Trailing Stops',content:`<p>A trailing stop is a dynamic stop loss that moves automatically as price moves in your favor — but never moves against you. It trails the price at a specified distance, locking in profits as the trade moves in your direction.</p><h3>How it works</h3><p>You buy a stock at $50 and set a trailing stop of $2. Your initial stop is at $48. The stock rises to $55 — your trailing stop automatically moves to $53. The stock continues to $60 — your stop is now at $58. If the stock then drops from $60 to $58, your stop triggers and you exit at $58 — locking in an $8 profit. You never had to manually adjust the stop.</p><h3>Types of trailing stops</h3><ul><li>Fixed dollar amount — trails by a specific dollar amount</li><li>Fixed percentage — trails by a percentage of current price</li><li>ATR-based — trails by a multiple of the Average True Range</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>Trailing stops are one of the most underused tools in retail trading. The hardest part of trading isn't getting in — it's knowing when to get out of a winner. A trailing stop removes the emotional decision of when to sell and replaces it with a mechanical rule.</p></div>`},
'b14-0':{title:'Why Journaling Matters',content:`<p>A trading journal is the single most important tool for long term improvement as a trader. Not a scanner. Not an indicator. Not a chat room. A journal.</p><p>Trading is a performance skill, like athletics or music. You get better through deliberate practice and honest feedback. A journal provides that feedback. Without it, you're making the same mistakes repeatedly without realizing it.</p><h3>What traders with journals look like</h3><ul><li>They know their win rate by setup type</li><li>They know what time of day they perform best</li><li>They know which market conditions suit their style</li><li>They know their average winner and average loser</li><li>They trade with confidence because they have data to back it up</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>The journal is where losing traders become winning traders. Not by finding a new strategy — by understanding the strategy they already have deeply enough to execute it consistently.</p></div>`},
'b14-1':{title:'What to Track',content:`<p>A good trading journal tracks both the quantitative data — the numbers — and the qualitative data — the psychology. Both are essential.</p><h3>Quantitative data to track</h3><ul><li>Date and time of entry and exit</li><li>Stock ticker</li><li>Entry price, exit price, stop price</li><li>Position size (shares or contracts)</li><li>Dollar P&amp;L and percentage P&amp;L</li><li>Setup type — what pattern or setup triggered the trade</li><li>Outcome — win or loss</li></ul><h3>Qualitative data to track</h3><ul><li>Why did you take this trade?</li><li>What was the market doing?</li><li>Did you follow your plan? — yes or no, and if no, why not</li><li>Emotional state — were you calm, anxious, overconfident, hesitant?</li><li>Grade the trade — A, B, C, D based on setup quality and execution regardless of outcome</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>Grade every trade independently of its outcome. An A+ trade that lost money is still an A+ trade. A D trade that made money is still a D trade — you got lucky and luck runs out. Focus on executing quality and the profits will follow.</p></div>`},
'b14-2':{title:'Reviewing Your Journal',content:`<p>Taking the time to record trades is only half the value of a trading journal. The other half — arguably the more important half — is the review process.</p><h3>Daily review</h3><p>At the end of each trading day — after the market closes — review every trade from that day. Did the trade play out how you expected? If you lost, was it because the setup failed or because you didn't execute the plan?</p><h3>Weekly review</h3><p>Every weekend, pull up the week's trades and look for patterns. Which setups worked? Which didn't? Did you trade better in the morning or afternoon?</p><h3>Monthly review</h3><p>Once a month, do a deeper analysis. Calculate your win rate, average winner, average loser, and profit factor. Identify the two or three setups that produced the majority of your profits. Identify the one or two behaviors that produced the majority of your losses.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The most common pattern you'll find in your journal after three months — a small number of setups account for the majority of your profits, and a small number of behavioral mistakes account for the majority of your losses. Your job is to do more of what already works and stop doing what doesn't.</p></div>`},
'n1':{title:'Stock Personalities & Behavior',content:`<p>Not all stocks trade the same way. A stock's personality is defined by how it moves - how fast, how far, how cleanly, and how predictably. Learning a stock's personality before trading it is just as important as the setup itself. A stock that gaps up 40% on news and fades all day requires a completely different approach than one that trends smoothly upward for weeks.</p><h3>Examples</h3><h3>The Slow Mover (Mega Cap)</h3><p>AAPL, MSFT - moves in small, orderly increments. Rarely makes explosive moves without a major catalyst. Great for swing trading, terrible for day trading if you want volatility.</p><h3>The Momentum Runner (Small Cap)</h3><p>Any low float small cap - can move 50-200% in a single day on news. Extremely volatile, wide spreads, unpredictable. High risk, high reward. Requires fast execution and tight stops.</p><h3>The Sector Follower</h3><p>XOM, CVX - moves with oil prices and sector news more than its own fundamentals. If you trade it, you need to watch the sector, not just the stock.</p><h3>The Earnings Mover</h3><p>NFLX, META - relatively calm between earnings, then makes massive moves on report days. Best traded around catalysts.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Before trading any stock, spend time watching it. How does it react to support and resistance? Does it respect trendlines? Does it gap and go or gap and fade? Does it move with the market or independently? That knowledge is your edge.</p></div>`},
'n2':{title:'Timeframes',content:`<p>The timeframe you trade on determines everything - your entry, your stop, your target, and how long you hold. The same stock can look completely different on a 1-minute chart versus a daily chart. Most beginners make the mistake of only looking at one timeframe and missing the bigger picture entirely.</p><h3>1-Minute and 2-Minute</h3><p>Used by day traders for precise entries and exits. Too noisy for anything other than execution. If you are making decisions based only on a 1-minute chart you are trading blind.</p><h3>5-Minute</h3><p>The most common day trading timeframe. Balances detail with clarity. Where most intraday setups are identified and traded.</p><h3>15-Minute</h3><p>Used to see the broader intraday trend. A stock may look like it is setting up on the 5-minute but the 15-minute shows it is still in a downtrend. Always check.</p><h3>1-Hour</h3><p>The bridge between day trading and swing trading. The 1-hour chart smooths out the intraday noise and shows you the bigger picture of where a stock is headed. Key support and resistance levels on the 1-hour chart carry more weight than those on lower timeframes. If you are swing trading the 1-hour is often your primary entry timeframe after getting direction from the daily.</p><h3>Daily</h3><p>The most important chart for swing traders. Shows the full picture of a stock's trend, key levels, and pattern development over weeks and months.</p><h3>Weekly</h3><p>Used by long term investors and position traders. Filters out all the noise. A stock that looks choppy on a daily chart often shows a clean uptrend on a weekly.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Always start with the higher timeframe to get your bias, then drop down to a lower timeframe for your entry. Daily chart tells you the direction. 5-minute tells you when to pull the trigger. Never trade against the higher timeframe trend.</p></div>`},
'n4':{title:'Pre-Market Prep & Watchlist',content:`<p>Most traders lose money not because they cannot read charts - but because they show up to the market with no plan. The traders who win consistently do the same thing every morning before the market opens. They know exactly what they are looking for, where they are getting in, and what would tell them they are wrong. This tab teaches you that entire process from start to finish.</p><h3>Step 1 - Know What Stocks You Trade</h3><p>Not every stock is worth your attention - but figuring out exactly which ones are is something only you can determine over time. As you trade and develop your style, you will naturally start to notice which types of stocks you read best, which price ranges suit your account size, and which volatility levels match your risk tolerance. That personal criteria becomes your filter. Write it down as you discover it. That list is the foundation of your pre-market process every single day.</p><h3>Step 2 - Scan for Your Stocks</h3><p>A scanner is one of the most important tools you will use as a trader. It does in seconds what would take hours manually - it filters thousands of stocks down to the handful that meet your criteria right now. Every morning before the open, run your pre-market scanner to find stocks that are moving with volume and have a reason to be watched. The specific settings you use will evolve as your trading style develops, but the habit of scanning every single morning before the bell is non-negotiable. If you are not scanning, you are reacting. Traders who react are always late.</p><h3>Step 3 - Build Your Watchlist</h3><p>Take your scanner results and cut them down to 2-3 names maximum. For each one, mark the key levels on the chart - prior day high and low, pre-market high and low, major support and resistance. Those are your decision points for the day.</p><h3>Step 4 - Write Your Game Plan</h3><p>For each stock on your watchlist, answer three questions before the market opens: What is my bias - long or short? What price triggers me to take the trade? Where am I wrong and where am I taking profits? If you cannot answer all three, the stock does not make the watchlist.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The best trade of the day is almost always on your watchlist before the market opens. Reactive trading - jumping into something you just noticed - is where most of your losses will come from. Do the work before the open and trade your plan, not the moment.</p></div>`},
'n9-0':{title:'Indexes and How to Use Them',content:`<p>Market indexes are baskets of stocks that represent the overall health and direction of the market or a specific sector. Understanding the major indexes is not optional for a serious trader - it is essential. The index tells you the environment you are trading in. A stock that is setting up perfectly in a crashing market is a much lower probability trade than the same setup in a strong trending market. Before you look at a single stock, look at the indexes. They set the tone for everything else.</p><div class="callout"><div class="callout-label">TST Edge</div><p>When the major indexes are in a confirmed downtrend, your win rate on long trades drops significantly. The market tide lifts or sinks most boats. Trade with the market, not against it.</p></div>`},
'n9-1':{title:'SPY',content:`<p>SPY is the SPDR S&P 500 ETF - the most widely traded ETF in the world. It tracks the S&P 500, which is a basket of the 500 largest publicly traded companies in the United States. When traders talk about "the market," they are almost always referring to the S&P 500. SPY is your primary market temperature gauge. If SPY is trending up cleanly with higher highs and higher lows, conditions favor long setups across the board. If SPY is breaking down, be extremely selective on longs and consider short setups instead. SPY also has extremely liquid options, making it a popular vehicle for hedging positions or trading the broader market directionally.</p>`},
'n9-2':{title:'QQQ',content:`<p>QQQ is the Invesco QQQ Trust, which tracks the NASDAQ-100 - the 100 largest non-financial companies listed on the NASDAQ exchange. It is heavily weighted toward technology and growth stocks. Apple, Microsoft, NVIDIA, Amazon, and Meta make up a significant portion of QQQ. If you trade tech stocks - which most active traders do - QQQ is arguably more important to watch than SPY. When QQQ is strong, tech names tend to run. When QQQ is weak, even the best tech setups struggle. Watch QQQ alongside SPY every morning before you look at individual names.</p>`},
'n9-3':{title:'NASDAQ',content:`<p>The NASDAQ Composite tracks all stocks listed on the NASDAQ stock exchange - over 3,000 companies in total. It skews heavily toward technology, biotech, and growth companies. The NASDAQ is more volatile than the S&P 500 because of its growth stock concentration. In bull markets it tends to outperform. In bear markets and risk-off environments it tends to sell off harder. Watching the NASDAQ composite gives you a broader read on growth stock sentiment than QQQ alone.</p>`},
'n9-4':{title:'DOW',content:`<p>The Dow Jones Industrial Average - commonly called the Dow - tracks 30 large blue chip companies considered representative of the broader US economy. Companies like Goldman Sachs, Boeing, Johnson & Johnson, and Walmart make up the Dow. Because it only contains 30 stocks and is price-weighted rather than market cap weighted, the Dow is a less precise market indicator than the S&P 500. However it remains the most widely reported index in financial media and serves as a general gauge of large cap industrial and financial sector health.</p>`},
'n9-5':{title:'IWM',content:`<p>IWM is the iShares Russell 2000 ETF, which tracks 2,000 small cap US companies. It is one of the most important indexes for active traders because small cap stocks are where much of the intraday action happens. When IWM is strong, small cap and mid cap momentum names tend to move well. When IWM is weak or lagging the large cap indexes, it signals that risk appetite is low and traders are rotating into safety. A divergence between IWM and SPY - where large caps are holding up but small caps are selling off - is often an early warning sign of broader market weakness ahead.</p>`},
'n9-6':{title:'VIX',content:`<p>The VIX - also called the Fear Index - measures the implied volatility of S&P 500 options over the next 30 days. In simple terms it tells you how much fear or uncertainty exists in the market right now. A low VIX - below 15 - indicates complacency and a calm, trending market. A high VIX - above 30 - indicates fear, uncertainty, and increased volatility across all stocks. When the VIX spikes, stocks tend to sell off hard and fast. When the VIX is low and falling, conditions favor steady uptrends. As an active trader, checking the VIX every morning gives you context for how aggressive or conservative to be with your positioning that day.</p><div class="callout"><div class="callout-label">TST Edge</div><p>VIX above 20 means widen your stops, reduce your size, and be more selective. The market is more volatile and setups are less reliable. VIX below 15 means conditions are calm - tighter stops and normal sizing are appropriate. Let the VIX guide your aggression level.</p></div>`},
'n5':{title:'Scanning for Stocks',content:`<p>Every morning before the open, run a pre-market scanner filtering for stocks up or down more than 2% pre-market on above average volume. This gives you your universe for the day. You are not trading all of them - you are identifying which ones deserve a closer look. Set your filters for minimum volume, price range, and percentage move. The scanner does not find your trade - it finds your candidates.</p>`},
'n9-0':{title:'Indexes and How to Use Them',content:`<p>An index is a collection of stocks grouped together to represent a segment of the market. Indexes are the single best tool for understanding overall market conditions before you trade a single stock. When the major indexes are in a strong uptrend, most stocks will be easier to trade long. When indexes are selling off, most long setups will fail regardless of how good they look. Always check the indexes before you trade. They set the tone for everything else.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Your individual stock setups do not exist in a vacuum. A perfect breakout in a crashing market is not a perfect breakout - it is a trap. Align your trades with what the indexes are doing and your win rate will improve immediately.</p></div>`},
'n9-1':{title:'SPY',content:`<p>SPY is the SPDR S&P 500 ETF - it tracks the S&P 500 index, which is made up of the 500 largest publicly traded companies in the United States. It is the single most watched index in the world and the best overall gauge of the US stock market's health. When traders say "the market is up" or "the market is down" they are almost always talking about the S&P 500. SPY is heavily weighted toward technology, healthcare, and financials. If SPY is trending up cleanly, conditions favor long setups across most sectors. If SPY is breaking down, be defensive.</p>`},
'n9-2':{title:'QQQ',content:`<p>QQQ is the Invesco Nasdaq-100 ETF - it tracks the 100 largest non-financial companies listed on the Nasdaq exchange. It is heavily concentrated in technology and growth stocks - Apple, Microsoft, Nvidia, Amazon, Meta, and Google make up a significant portion of its weight. QQQ is more volatile than SPY and tends to move more aggressively in both directions. If you trade tech stocks, QQQ is the most important index to watch. When QQQ is leading SPY to the upside, growth and tech names will generally trade well. When QQQ is lagging, avoid chasing tech breakouts.</p>`},
'n9-3':{title:'NASDAQ',content:`<p>The Nasdaq Composite is an index that tracks all stocks listed on the Nasdaq stock exchange - over 3,000 companies. It has a heavy technology and growth weighting, similar to QQQ but broader. The Nasdaq is the index most associated with innovation, high-growth, and speculative stocks. When the Nasdaq is in a bull trend, small and mid-cap growth stocks tend to perform exceptionally well. When the Nasdaq is in a bear trend or correction, high-multiple growth stocks tend to get hit the hardest. Knowing where the Nasdaq stands in its trend is essential for any trader focused on growth and momentum names.</p>`},
'n9-4':{title:'DOW',content:`<p>The Dow Jones Industrial Average tracks 30 of the largest and most established blue-chip companies in the United States - names like Boeing, Goldman Sachs, JPMorgan, Caterpillar, and Nike. It is one of the oldest and most widely recognized indexes in the world. The Dow is less relevant for active traders than SPY or QQQ because it only tracks 30 stocks and is price-weighted rather than market-cap weighted. However it is a useful gauge of how traditional industrial and financial companies are performing. When the Dow is diverging from the Nasdaq - one going up while the other goes down - it often signals a rotation between value and growth sectors.</p>`},
'n9-5':{title:'IWM',content:`<p>IWM is the iShares Russell 2000 ETF - it tracks the Russell 2000 index, which is made up of 2,000 small-cap US companies. IWM is the best gauge of small-cap market health and risk appetite. When IWM is leading the major indexes higher, it signals that investors are willing to take on risk - a bullish sign for the overall market. When IWM is lagging or breaking down while SPY holds up, it signals that investors are rotating to safety - a warning sign. For day traders focused on small-cap momentum stocks, IWM is an essential daily check. A strong IWM day means small-cap setups will generally work better.</p>`},
'n9-6':{title:'VIX',content:`<p>The VIX - also called the Fear Index - measures the market's expectation of volatility over the next 30 days based on S&P 500 options pricing. A low VIX means the market is calm and complacent. A high VIX means the market is fearful and expecting large moves. Generally a VIX below 15 indicates low volatility and stable conditions. VIX between 15 and 25 is elevated but manageable. VIX above 30 signals significant fear and market stress. For traders, a rising VIX typically means wider spreads, faster moves, and less predictable price action. A falling VIX typically means tighter, more orderly markets where technical setups work better.</p><div class="callout"><div class="callout-label">TST Edge</div><p>When the VIX spikes sharply - especially above 30 - that is not the time to be aggressive. That is the time to reduce size, widen stops, and be selective. The most expensive trades are the ones made in a panic market where the VIX is exploding higher and every setup looks like an opportunity but most are traps.</p></div>`},
'n10':{title:'Building a Watchlist & Daily Plan',content:`<p>Take your scanner results and cut them down to 2-3 names maximum. For each one, mark the key levels on the chart - prior day high and low, pre-market high and low, major support and resistance. Those are your decision points for the day. For each stock on your watchlist, answer three questions before the market opens: What is my bias - long or short? What price triggers me to take the trade? Where am I wrong and where am I taking profits? If you cannot answer all three, the stock does not make the watchlist.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The best trade of the day is almost always on your watchlist before the market opens. Reactive trading - jumping into something you just noticed - is where most of your losses will come from. Do the work before the open and trade your plan, not the moment.</p></div>`},
'a1-0':{title:'Sizing for Small Caps',content:`<p>Small cap trading is where the biggest intraday moves happen - but it is also where accounts get blown up the fastest. The same position sizing rules you would use on AAPL will get you destroyed on a low float small cap moving 30% in 10 minutes. Small caps require a completely different approach to size.</p><h3>Why Small Caps Are Different</h3><p>Small caps have low float, wide spreads, and thin liquidity. A stock with 2 million shares float can move 20% on 50,000 shares of volume. The volatility that creates the opportunity is the same volatility that creates the risk.</p><h3>The Rules</h3><p>Start smaller than you think you need to. If you normally trade 500 shares of a large cap, start with 100-200 shares on a small cap until you understand how it moves. Your stop needs to be wider on a small cap because the spread alone can be 10-20 cents. Account for that when sizing - your dollar risk per trade stays the same, your share count goes down.</p><h3>Never Size Up Into a Move</h3><p>The most dangerous thing you can do on a small cap is add to a position mid-move because it is working. Small caps reverse violently and without warning. Size your full position before entry and stick to it.</p><h3>The Float Matters</h3><p>The lower the float the more explosive the move - both up and down. Under 5 million shares is considered low float. Under 1 million is extremely volatile - trade it with your smallest size.</p><div class="callout"><div class="callout-label">TST Edge</div><p>On small caps, being right about direction is only half the battle. Being wrong about size is what ends accounts. Trade small, prove you can read it, then slowly increase size as your confidence and consistency build.</p></div>`},
'a1-2':{title:'Float & Why It Matters',content:`<p>Float is the number of shares available for trading in the open market. It is one of the most important factors determining how volatile a stock will be. A stock with 500 million shares float moves slowly - it takes enormous volume to move it. A stock with 2 million shares float can move 50% on relatively small volume because there simply are not enough shares to absorb aggressive buying. Low float stocks are the playground of day traders. High float stocks are the domain of swing traders and investors. Before you trade any stock, know its float. It tells you how explosive or stable the move is likely to be.</p>`},
'a2-1':{title:'Earnings Plays',content:`<p>Earnings are the single most powerful catalyst in trading. A company that beats expectations and raises guidance can move 20-40% overnight and continue higher for weeks. The setup is to identify stocks with strong fundamentals building a technical base before earnings, then position before the report. The risk is binary - it can go either way. Managing size is critical. Never risk more than you are willing to lose entirely on an earnings play because even strong beats can sell off on the news.</p>`},
'a2-4':{title:'News-Driven Swings',content:`<p>News driven swings are multi-day moves triggered by a significant catalyst that changes market perception. The stock gaps up on day one, consolidates or pulls back on day two, and continues higher on day three and beyond as more investors pile in. The opportunity is in identifying these on day one or two and holding for the continuation. The key filter - is the news strong enough to attract new buyers over multiple days, or is it a one-day wonder that fades?</p>`},
'a2-5':{title:'Momentum Names',content:`<p>Momentum names are stocks that are already moving - trending strongly with consistent higher highs and higher lows on the daily chart. You are not trying to buy the bottom or catch a reversal. You are buying strength and riding the trend. The entry is on pullbacks to the 20 or 50 day moving average that hold. The stop is below the moving average. The target is the next resistance level or a trailing stop as the move extends. Trade with the trend, not against it.</p>`},
'a3':{title:'Long Term Investing',content:`<p>Long term investing combines both technical and fundamental analysis to identify exceptional companies at the right price and hold them for months to years. Fundamental analysis evaluates the business - revenue growth, profit margins, debt levels, competitive advantages, and management quality. You want companies growing revenue consistently, expanding margins, and operating in industries with long runways. Technical analysis tells you when to buy - even a great company can be a bad trade if you buy it extended after a 50% run. Look for pullbacks to key moving averages, breakouts from long bases, or corrections in otherwise strong uptrends. The combination of a fundamentally strong company at a technically sound entry point is the highest conviction long term investment setup available.</p>`},
'a4':{title:'Pre-Market Prep',content:`<p>The hour before the market opens is the most important hour of your trading day. What you do in pre-market determines everything about how you trade when the bell rings. Check overnight news and earnings. Run your scanner for pre-market movers. Mark key levels on your top 2-3 watchlist names. Know your bias before the open - not after. Traders who show up unprepared react. Traders who prepare execute.</p>`},
'a5-0':{title:'Your Rules',content:`<p>Your rules are the non-negotiables. The lines you never cross regardless of how good a setup looks or how confident you feel. Maximum loss per trade. Maximum loss per day. No trading during the first 15 minutes if that is what your data shows. No holding through earnings. No adding to losers. Your rules are built from your own trading history - the patterns of when you make money and when you give it back. Write them down. Review them every morning. A trader without rules is just gambling.</p>`},
'a5-1':{title:'Your Setups',content:`<p>You do not need to trade every pattern in existence. You need 2-3 setups you know cold - setups you have seen hundreds of times, that you can identify instantly, and that you have data showing work consistently for you. Everything else is noise. Your setups are the specific entry triggers, the specific conditions that need to be present, and the specific risk parameters that define the trade. The goal is to get to a point where you see your setup and execute without hesitation, because you have done it enough times to trust it completely.</p>`},
'a5-2':{title:'Risk/Reward Framework',content:`<p>Every trade you take should have a minimum 2:1 reward to risk ratio - meaning for every $1 you risk, you should be targeting at least $2 in profit. This is non-negotiable. A 2:1 ratio means you only need to be right 40% of the time to be profitable. Most beginners flip this - they take small profits and let losses run, creating negative risk/reward without realizing it. Define your stop before your entry. Define your target before your entry. If the math does not work at 2:1 or better, the trade does not happen.</p>`},
'a5-3':{title:'Days to Trade & Not Trade',content:`<p>Not every day is a trading day. The best traders know when to step back as clearly as they know when to step in. Days to avoid - FOMC announcements, CPI prints, options expiration Fridays when volatility is unpredictable, and days when the overall market is in a confirmed downtrend with no clear setups. Days to trade aggressively - strong trending market, high relative volume, your setups are triggering cleanly, and your first trade of the day was a winner. Your best trading days will have a pattern. So will your worst. Find it in your journal and act accordingly.</p>`},
'a5-4':{title:'Sizing Up & Down',content:`<p>Position size should never be static. When you are in a drawdown or trading in a choppy uncertain market, size down - protect your capital and your confidence. When you are in a hot streak, your setups are working cleanly, and the market is trending, size up gradually. The key word is gradually - never double your size overnight. Increase by 25% increments as results confirm the conditions are right. Sizing is a performance tool. Use it like one.</p>`},
'a6-0':{title:'Kill Candles',content:`<p>A kill candle is a large, high volume candle that completely reverses the prior move in a single bar. It signals that the dominant side has been completely overwhelmed. A kill candle to the downside after an extended run up means sellers stepped in with enormous conviction. A kill candle to the upside after a downtrend means buyers absorbed all selling pressure in one decisive move. When you see a kill candle, respect it. The momentum has shifted. Do not fight it.</p>`},
'a6-1':{title:'Fake 2nd Higher Lows',content:`<p>A fake second higher low looks like a healthy uptrend continuation - price pulls back, holds above the prior low, and looks ready to make a new high. But instead of continuing up, it fails and breaks the prior low. This is one of the most common traps in trading. Beginners see the higher low and buy. Smart money sees the lack of volume, the weak bounce, and the overhead supply and fades it. The tell is in the volume and the quality of the bounce - a real higher low has strong buying on the recovery. A fake one drifts up weakly with no conviction.</p>`},
'a6-2':{title:'Stop Loss Hunts',content:`<p>Stop loss hunts occur when price briefly breaks a key level - triggering stop losses from retail traders - then immediately reverses and continues in the original direction. Market makers and institutions know exactly where retail stops are clustered - just below support or just above resistance. They push price into those zones, trigger the stops, collect the liquidity, and reverse. The move below support looks like a breakdown. It is not. The tell is the speed of the reversal and the volume - a stop hunt reverses quickly and sharply. A real breakdown continues with follow-through.</p>`},
'a6-3':{title:'Trapped Shorts',content:`<p>Trapped shorts occur when short sellers enter a position expecting a stock to fall, but price reverses sharply against them. As the stock rises, trapped shorts are forced to cover - buying the stock back - which accelerates the move upward. The more shorts that are trapped, the more violent the squeeze. You can identify trapped short setups by looking for stocks with high short interest that are holding key support levels. When those levels hold and price starts moving up, the trapped shorts become fuel for the rally.</p>`},
'a6-4':{title:'Weak Second Legs = Reversal',content:`<p>When a stock makes its first leg up strongly, then makes a second leg that is noticeably shorter and weaker, and a third leg that barely moves at all - the trend is exhausting. Each successive push is losing momentum. Sellers are stepping in earlier. Buyers are losing conviction. This pattern of diminishing legs is one of the most reliable signals that a reversal is coming. The trade is to wait for the third weak leg to fail and enter short when it breaks the prior higher low.</p>`},
'a6-5':{title:'Staircase Up Elevator Down',content:`<p>This pattern describes a stock that grinds slowly higher over days or weeks in small incremental moves - the staircase up. Then in a single session or overnight, it gives back the entire move in a violent fast selloff - the elevator down. The slow grind up is driven by weak retail buying with no institutional conviction behind it. When selling starts, there are no real buyers to absorb it and price collapses quickly. Slow grinds up on low volume are suspicious. They do not have the foundation to hold when real selling comes.</p>`},
'a6-6':{title:'Repeated vs Slow Resistance Attacks',content:`<p>Repeated resistance attacks happen when a stock hits a resistance level multiple times in quick succession with force - each attack is strong and fast. This signals buyers are aggressive and the level is about to break. Slow resistance attacks are the opposite - price drifts up to resistance lazily on low volume with no conviction. The slow attack almost always fails. The repeated aggressive attack almost always breaks through. Volume and speed of the approach tell you everything about whether a breakout is real before it happens.</p>`},
'a6-7':{title:'Slow Walk Downs on Options',content:`<p>This is institutional manipulation of options premium. When a stock slowly grinds in one direction day after day with no explosive moves, it kills the time value in options - theta decay bleeds option holders dry. A slow walk down makes puts worthless even as the stock drops, because it drops so slowly that theta destroys the premium faster than the move pays. A slow walk up does the same to calls. The play is to recognize when a stock is being walked and either avoid buying options entirely or switch to selling premium instead.</p>`},
'a6-8':{title:'Accumulation vs Distribution',content:`<p>Accumulation is when smart money is quietly buying a stock over time - price moves sideways or slightly up on increasing volume as institutions build their position without tipping their hand. Distribution is the opposite - smart money is quietly selling into strength while retail buyers chase the move. Accumulation looks like a tight range with occasional volume spikes on up days. Distribution looks like a stock making new highs on declining volume with increasingly large down days. One is a coiling spring. The other is a ticking clock.</p>`},
'a6-9':{title:'Gap Holds & Power Hour',content:`<p>When a stock gaps up at the open and holds its gap level through the morning - not filling it, not even testing it - that is a sign of extreme strength. The gap hold tells you buyers are absorbing every attempt to sell and defending the level with conviction. When power hour arrives and the stock is still holding, the move often accelerates as institutional buyers add to positions before the close. Gap hold into power hour is one of the cleanest continuation setups in day trading.</p>`},
'a6-10':{title:'Liquidity Sweeps',content:`<p>A liquidity sweep is when price briefly moves beyond a key level to collect the stop orders sitting there, then reverses sharply back in the other direction. It looks like a breakout or breakdown but it is not. The purpose is to trigger the stops of traders who positioned at that level, collect their liquidity, and then move price back in the original direction. When price sweeps a level and immediately snaps back with strong volume, that is your entry signal in the direction of the snap.</p>`},
'a7-0':{title:'Best Trades Rarely Full Size',content:`<p>The best setups almost never allow you to get full size at your ideal entry. A stock that is setting up perfectly gets there fast, gives you a one or two candle window, and moves before most people are positioned. If you are waiting to get your full 500 shares filled at the perfect price on a perfect setup - you are going to miss it or chase it. The solution is to take what the market gives you, get partially positioned, and add on confirmation rather than waiting for perfect fill before the move even starts.</p>`},
'a7-1':{title:'Pyramiding Winners',content:`<p>Pyramiding is adding to a winning position as the trade moves in your favor - but only in decreasing size increments. First add is your largest. Second add is smaller. Third add is smallest. Each add should be at a new area of confirmation - a new breakout level, a successful retest, a new high. Your stop moves up with each add to protect profits. Pyramiding done correctly turns a good trade into an exceptional one without adding significant risk. Done incorrectly it turns a winner into a disaster when the reversal comes.</p>`},
'a7-2':{title:'Mean Reversion',content:`<p>Mean reversion is the tendency for prices to return to their average after becoming extended in either direction. When a stock has moved too far too fast in one direction, the odds favor a return toward the mean. This can be measured using moving averages - when price is stretched far above the 20 or 50 day moving average it is extended. When it is far below it is oversold. The trade is to identify when a stock is at an extreme and position for the snap back. The risk is that extended can always get more extended - so mean reversion trades require tight stops and clear invalidation levels.</p>`},
'a7-3':{title:'Exhaustion Signals',content:`<p>Exhaustion signals appear at the end of extended moves when the trend is running out of fuel. The candles get smaller. Volume spikes but price does not move much - climax volume. The move makes a new high but closes weak. RSI divergence appears - price makes a new high but RSI makes a lower high. Each of these signals alone is a warning. Multiple signals appearing together is a high conviction reversal signal. When you see exhaustion, you do not chase. You prepare for the other side.</p>`},
'a7-4':{title:'Washout Longs',content:`<p>A washout long setup occurs after a stock has been in a severe downtrend and finally reaches a point of capitulation - a massive high volume selloff where every remaining holder gives up at once. The volume is the highest of the entire move down. The candle is large and red. And then it reverses - buyers step in at the exact moment maximum fear is present. The long entry comes when price stabilizes after the capitulation candle and begins to reclaim ground. The risk is tight - below the washout low. The reward is the entire snap-back move.</p>`},
'a6-11':{title:'V-Shape Recovery',content:`<p>A V-shape recovery is one of the most powerful and most misunderstood patterns in trading. It is characterized by a sharp, fast decline followed immediately by an equally sharp and fast reversal - forming a V shape on the chart. There is no base, no consolidation, no gradual bottoming process. Price drops hard and snaps right back up with the same velocity it fell with.</p><h3>Intraday V-Shape Recovery</h3><p>On an intraday timeframe - the 1, 2, or 5-minute chart - a V-shape recovery typically occurs after a sharp opening selloff or a sudden news-driven drop. Price breaks down hard on high volume, flushes out all the stops and weak hands in one fast move, and then immediately reverses as buyers step in at the low. The key identifier is the speed and symmetry - the recovery leg should be as fast and as strong as the selloff leg. Volume should be high on both legs. A V-shape that recovers slowly on low volume is not a true V-shape - it is a weak bounce that often fails. The intraday V-shape is most reliable when it occurs at a key support level, a prior day low, or a significant moving average. The entry is on the first signs of stabilization after the flush - often a small green candle or a doji at the bottom. Stop goes below the flush low. Target is the level where the selloff began.</p><h3>Daily Timeframe V-Shape Recovery</h3><p>On a daily chart, a V-shape recovery signals a broader trend reversal after a sharp multi-day or multi-week selloff. These are the most powerful V-shapes because they represent a complete shift in institutional sentiment. The market or stock sells off hard for days - often on fear, bad news, or a macro event - and then reverses with equal force as buyers step in aggressively. The daily V-shape is most significant when it occurs after a climactic selloff with extremely high volume on the down days followed by an equally high volume reversal candle. This tells you that sellers are exhausted and real buyers have stepped in. The recovery from a daily V-shape often retraces the entire selloff and then continues higher as the original downtrend participants are forced to cover and new buyers pile in.</p><h3>How to Trade Both</h3><p>Intraday - wait for the flush to complete, look for stabilization and a reclaim of a key level, enter with a tight stop below the low. Daily - wait for the reversal candle to close strong, enter on the next day's open or on a small pullback, stop below the V-shape low. In both cases the risk is defined and the reward can be significant - the entire length of the V.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The hardest part of trading a V-shape is buying into what still feels like a downtrend. When price is recovering from a sharp flush, most traders are still in panic mode. That discomfort is exactly why the setup works - the buyers who step in at the bottom are early, and everyone else chases them higher.</p></div>`},
'o1':{title:'Intro to Options',content:`<p>Options are contracts that give you the right - but not the obligation - to buy or sell a stock at a specific price before a specific date. A call option gives you the right to buy. A put option gives you the right to sell. Options allow you to control 100 shares of stock for a fraction of the cost of buying the shares outright. This leverage is what makes options both powerful and dangerous. A small move in the stock can result in a 50-200% gain or loss in the option. Before trading options, you must understand that you are not buying the stock - you are buying time and the right to act within that time.</p>`},
'o2':{title:'Strike Prices',content:`<p>The strike price is the price at which your option gives you the right to buy or sell the underlying stock. In the money options have intrinsic value - a call with a $50 strike is in the money if the stock is at $55. At the money options have a strike closest to the current stock price. Out of the money options have no intrinsic value yet - they are pure time value and probability. In the money options cost more but move more like the stock. Out of the money options are cheaper but have a lower probability of being profitable. Beginners often buy far out of the money options because they are cheap - this is one of the fastest ways to lose money in trading.</p>`},
'o4':{title:'Volatility (IV & HV)',content:`<p>Implied Volatility is the market expectation of how much a stock will move in the future - baked into the option price. High IV means options are expensive. Low IV means options are cheap. Historical Volatility is how much the stock has actually moved in the past. When IV is significantly higher than HV - such as before earnings - options are overpriced and selling premium has an edge. When IV is low relative to HV, buying options is cheaper and the risk/reward favors buyers. Always check IV before buying options. Buying high IV options is one of the most common and costly mistakes beginners make.</p>`},
'o5':{title:'LEAPs',content:`<p>LEAPs are Long-Term Equity Anticipation Securities - options with expiration dates more than one year away. They behave more like stock than short-term options because they have minimal theta decay relative to their total value. LEAPs are used by traders who want leveraged exposure to a stock long-term move without tying up the full capital required to buy shares. A LEAP call on a stock you are bullish on for the next 12-18 months gives you the upside of owning 100 shares at a fraction of the cost. The risk is still defined - you can only lose what you paid for the contract.</p>`},
'o6':{title:'Position Sizing for Options',content:`<p>Options position sizing is completely different from stock sizing. Because options can go to zero, you must size them as a percentage of your account - never more than 2-5% of your total account value in a single options position. The leverage that makes options attractive is the same leverage that makes oversizing catastrophic. A stock position down 10% hurts. An options position down 80% on the same move is account-ending if you were oversized. Treat each options trade as if it could go to zero - because it can. Size accordingly.</p>`},
'o7':{title:'Dates & Expiration',content:`<p>Every option has an expiration date - the date by which you must be right or the option expires worthless. Time is your enemy when buying options. Every day that passes, theta decay eats into your option value even if the stock does not move. The closer to expiration, the faster the decay. 0DTE options - expiring the same day - are the most volatile and the fastest to decay. For beginners, buying options with at least 30-45 days to expiration gives your thesis time to play out without theta destroying your position before the move happens. Never buy options with less than two weeks to expiration unless you are very experienced and very confident in the timing.</p>`},
'p1':{title:'Psychology & Overtrading',content:`<p>The biggest enemy in trading is not the market - it is yourself. Overtrading is the single most common reason beginners lose money. It comes from boredom, from trying to make back losses, from FOMO, and from the false belief that more trades equals more opportunity. It does not. More trades means more exposure to bad setups, more commissions, and more emotional decisions. The best traders are selective. They wait for their setup, execute with discipline, and sit on their hands the rest of the time. Doing nothing is a position.</p>`},
'p2':{title:'Base Hits Over Home Runs',content:`<p>Consistency in trading comes from base hits - small, repeatable wins that compound over time. Most beginners are swinging for home runs on every trade - oversized positions, lottery ticket options, all-in bets on a single catalyst. Home runs feel good when they work. But they destroy accounts when they do not. A trader who makes 1% per day consistently will outperform a trader swinging for 20% every week. Focus on the process, not the payout. Stack base hits and let compounding do the work.</p>`},
'p3':{title:'The Playbook Mindset',content:`<p>A playbook is a defined set of setups, rules, and conditions that you follow with consistency - regardless of emotion, regardless of what the market is doing, regardless of your last trade. Professional traders do not freestyle. They execute a playbook. They know exactly what they are looking for, exactly when the conditions are met, and exactly what they do when they are. The playbook mindset means you are not making decisions in the heat of the moment - you already made them. You are just executing.</p>`}
