'tax-0':{title:'Trader Tax Basics',content:`<p>Trading has specific tax implications that are different from regular investment income. Not understanding the basics can result in a significant unexpected tax bill at the end of the year. This is an overview of the key concepts - consult a CPA or tax professional for advice specific to your situation.</p><h3>Short-Term vs Long-Term Capital Gains</h3><p>When you sell a stock for a profit, the gain is taxed as short-term capital gains if you held the position for one year or less. Short-term capital gains are taxed as ordinary income - the same rate as your salary. If you held for more than one year, it qualifies for long-term capital gains rates which are significantly lower. For most active traders who hold positions for minutes to weeks, virtually all profits are taxed at short-term rates.</p><h3>The Wash Sale Rule</h3><p>The wash sale rule prevents you from claiming a tax loss if you buy the same or substantially identical security within 30 days before or after selling it at a loss. If you sell AAPL at a loss on Monday and buy it back on Wednesday, the loss is disallowed for tax purposes. This catches many traders off guard, particularly those who frequently trade the same names.</p><h3>Trader Tax Status</h3><p>The IRS recognizes a Trader Tax Status that allows active traders to deduct trading-related expenses such as platform fees, data subscriptions, education, and home office expenses. Qualifying for Trader Tax Status requires trading frequently, trading to profit from short-term price movements rather than long-term investment, and meeting certain activity thresholds. A tax professional who specializes in traders can help determine if you qualify.</p><h3>Quarterly Estimated Taxes</h3><p>If trading is generating significant profits, you may be required to pay quarterly estimated taxes to avoid penalties at year end. The IRS expects taxes to be paid as income is earned throughout the year, not just at tax time.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Keep detailed records of every trade throughout the year. Most brokerages provide year-end tax documents but having your own records allows you to catch errors. Consult a CPA who specializes in trading taxes - the cost of professional tax advice is significantly less than the cost of a tax surprise in April.</p></div>`},
'cs-intro':{title:'How to Use the Case Studies',content:`<h3>How to Use the Case Studies</h3>
<p>This section contains real chart case studies — specific stocks, specific time periods, specific market events — analyzed through the lens of everything you've learned in the course. These are not hypothetical examples. Every case study happened in real markets with real money on the line.</p>
<h3>How to Approach Each Case Study</h3>
<p>Before reading the analysis, pull up the chart yourself. Use TradingView, set the date range, and look at it with fresh eyes. Ask yourself: what do I see? What patterns do I recognize? Where would I have entered? Where would I have exited? What does the volume tell me?</p>
<p>Then read the analysis. Compare your observations to what's documented. The cases where your read matches the analysis build confidence. The cases where you see something different are the most valuable — they reveal gaps in your pattern recognition that you can specifically work on.</p>
<h3>What Each Case Study Covers</h3>
<ul>
<li><strong>The Setup</strong> — What conditions preceded the move</li>
<li><strong>The Catalyst</strong> — What triggered the actual move</li>
<li><strong>The Trade</strong> — Where the entry, stop, and target would have been</li>
<li><strong>The Outcome</strong> — What actually happened and why</li>
<li><strong>The Lesson</strong> — The specific trading concept this case study illustrates</li>
</ul>
<p>Charts for each case study will be uploaded to the corresponding lesson. Until then, pull the chart yourself — the exercise of finding and analyzing it independently is part of the learning process.</p>
<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">The best traders study other people's trades obsessively. Not to copy them — but to build a library of pattern recognition that fires automatically when you see similar conditions forming in real time. Every case study you internalize becomes a reference point your brain reaches for when the next similar setup appears.</div></div>`},
'cs-gld':{title:'GLD — Gold Mega Squeeze 2025-2026',content:`<h3>GLD — Gold Mega Squeeze 2025-2026</h3>
<p><strong>Date Range:</strong> September 2025 — February 2026</p>
<p><strong>Concept:</strong> Safe haven demand, macro-driven momentum, institutional accumulation at scale</p>
<h3>The Setup</h3>
<p>Gold entered Q4 2025 already in a multi-year uptrend, having broken above the $2,000 psychological level and established it as support. The macro environment — persistent geopolitical uncertainty, dollar weakness, and central bank buying at record pace — created the fuel. What followed was not a spike but a sustained institutional accumulation move that compressed any pullback and relentlessly pushed to new all-time highs.</p>
<p>GLD, the SPDR Gold Trust ETF, is the most liquid vehicle for trading gold price exposure without dealing with futures contracts or physical delivery. It tracks the price of gold directly, making it the cleanest chart for technical analysis of the gold move.</p>
<h3>The Catalyst Layers</h3>
<p>Unlike a stock squeeze driven by a single news event, this gold move was driven by multiple reinforcing catalysts that stacked over months. Central banks — particularly China, India, and Middle Eastern sovereign wealth funds — were buying gold at unprecedented rates as dollar reserve diversification accelerated. Simultaneously, retail and institutional ETF inflows surged as inflation fears rekindled. The combination of sovereign buying, ETF inflows, and speculative momentum created a self-reinforcing cycle.</p>
<h3>What Made This Different From a Normal Gold Rally</h3>
<p>Normal gold rallies see price rise quickly, then consolidate, then potentially reverse as the catalyst fades. The 2025-2026 move was characterized by something different: every pullback was bought aggressively. Dips to the 20 EMA on the daily chart — which would normally represent a reasonable entry — were sometimes only one or two candles before buyers returned. This "no dip" behavior is the signature of a genuine institutional accumulation phase where large buyers are using any weakness as an opportunity to add size.</p>
<h3>The Trade</h3>
<p>The cleanest entry in a sustained macro trend like this is the pullback to the rising 20 EMA on the daily chart following a new high. Stop below the 50 EMA. Target: next measured resistance level or continuation to new all-time highs. Position sizing should be smaller than a momentum stock trade because gold moves slowly — but the probability of the trend continuing is high and the R:R on a well-placed entry is excellent.</p>
<h3>The Lead-Lag Relationship: Gold First, Silver Follows</h3>
<p>One of the most important observations from this period: gold broke out first and led the move for months. Silver, represented by SLV, lagged significantly before experiencing its own explosive catch-up move. The gold/silver ratio compressing is a historically reliable signal that the precious metals complex is in a full bull market phase — and that silver's catch-up move, when it comes, tends to be more explosive than gold's sustained grind.</p>
<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">GLD is one of the cleanest trend-following vehicles available. Unlike individual stocks, it has no earnings risk, no CEO drama, no short seller reports, no halts. The only thing moving it is macro sentiment. When macro conditions align for gold — dollar weakness, geopolitical uncertainty, inflation fears, central bank buying — the trend can last months. Learn to identify the early-stage accumulation signatures and the first pullback entries. These are high probability, low stress trades when sized correctly.</div></div>`},
'cs-slv':{title:'SLV — Silver Mega Squeeze 2025-2026',content:`<h3>SLV — Silver Mega Squeeze 2025-2026</h3>
<p><strong>Date Range:</strong> September 2025 — February 2026</p>
<p><strong>Concept:</strong> Lead-lag commodity dynamics, explosive catch-up moves, gold/silver ratio compression</p>
<h3>Why Silver Moves Differently Than Gold</h3>
<p>Silver has a split personality that gold doesn't — it's simultaneously a precious metal (safe haven, inflation hedge, monetary store of value) and an industrial metal (used heavily in solar panels, electronics, electric vehicles, and industrial manufacturing). This dual nature means silver can be driven by both macro sentiment AND industrial demand simultaneously, creating the conditions for explosive moves when both forces align.</p>
<p>Silver is also a significantly smaller market than gold, with far less liquidity. This means when institutional money rotates from gold into silver — as it did during the 2025-2026 move — the impact on price is amplified. The same dollar amount of buying moves silver a larger percentage than it moves gold.</p>
<h3>The Lead-Lag Setup</h3>
<p>The classic sequence in precious metals bull markets: gold breaks out first and sustains its move for weeks or months. During this period, silver lags — the gold/silver ratio expands as gold outperforms. Then, in a compressed period, institutional and speculative money rotates into silver to "catch up," and silver's move is faster and more violent than gold's sustained grind.</p>
<p>During the 2025-2026 period, gold was in a sustained uptrend for months before silver began its explosive catch-up phase. Traders who identified the gold/silver ratio reaching historical extremes — and anticipated the ratio compression that historically follows — were positioned for one of the cleanest commodity momentum trades in years.</p>
<h3>SLV vs PSLV vs Physical Silver</h3>
<p>SLV is the iShares Silver Trust ETF — the most liquid silver trading vehicle. PSLV is the Sprott Physical Silver Trust which actually holds allocated physical silver. During squeeze conditions, PSLV sometimes trades at a premium to NAV as buyers specifically want physical-backed exposure. For active traders, SLV provides the most liquid and tightest-spread execution. For investors concerned about counterparty risk, PSLV's physical backing provides additional security.</p>
<h3>Industrial Demand as the Second Catalyst</h3>
<p>The solar panel boom of 2024-2026 created a structural increase in silver demand that didn't exist in prior precious metals cycles. Silver is a critical component in photovoltaic cells, and the acceleration of global solar installation was consuming silver supply in a way that wasn't fully reflected in price until the demand/supply mismatch became undeniable. This gave the 2025-2026 silver move a fundamental backing that purely speculative silver squeezes (like the 2021 WallStreetBets attempt) lacked.</p>
<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">The gold/silver ratio is one of the most useful macro trading indicators available. When the ratio reaches historically elevated levels — above 80 or 90 — it signals that silver is historically cheap relative to gold and that a catch-up move may be approaching. The ratio alone is not a timing tool, but combined with gold breaking to new highs and industrial demand signals, it creates a high-conviction setup for a silver trade that can produce double-digit or triple-digit percentage gains in a compressed timeframe.</div></div>`},
'cs-dfns':{title:'DFNS — Reverse Split Low Float Squeeze 2026',content:`<h3>DFNS — Reverse Split Low Float Squeeze 2026</h3>
<p><strong>Date Range:</strong> July 20-31, 2026</p>
<p><strong>Concept:</strong> Reverse split float mechanics, low float squeeze with overhead resistance, when fundamentals are irrelevant</p>
<h3>The Mechanics That Created This Move</h3>
<p>T3 Defense Inc. executed a 1-for-125 reverse stock split effective July 20, 2026, to satisfy Nasdaq listing compliance requirements. This single corporate action reduced the public share count from approximately 139.8 million shares down to just 1.12 million shares. That is the entire explanation for what followed.</p>
<p>With 1.12 million shares in the tradeable float, every trade represents a significant percentage of total available supply. A single buyer purchasing 50,000 shares is acquiring 4.5% of the entire float. When multiple buyers show up simultaneously — attracted by momentum, by the defense/AI narrative, by social media attention — the imbalance between buyers and sellers creates violent, rapid price appreciation.</p>
<h3>The Catalyst Layers</h3>
<p>The reverse split created the structural condition. The narrative made traders want to buy. T3 Defense had recently acquired a 60% stake in Project35, expanding into counter-drone and aerial interceptor technologies — positioning it as an AI-driven defense company at a time when both defense spending and AI interest were at maximum market attention. A Schedule 13D filing disclosing that a defense-focused institutional investor had acquired a 16.67% stake added credibility. Multiple subsidiary contract announcements provided a steady stream of news flow to keep momentum traders engaged.</p>
<h3>The Price Action: Low $3.70, High $91</h3>
<p>This is a 2,400% move from the post-split low of $3.70 to the high around $91. Unlike a true "no resistance" blue sky breakout, DFNS had significant overhead resistance from its prior trading history — the stock had traded at much higher levels in earlier years and had been in a sustained downtrend before the reverse split. This overhead resistance created natural speed bumps during the squeeze: price would run into a prior resistance level, consolidate briefly as sellers at that level took profits, then either continue higher or reverse depending on whether buyers had enough momentum to absorb the selling.</p>
<h3>The Fundamentals — Irrelevant but Important to Know</h3>
<p>T3 Defense posted approximately $3.7M in quarterly revenue against a net loss of roughly $27M. Free cash flow was deeply negative. The current ratio was near 0.3, meaning the company had severe near-term liquidity concerns. None of this mattered for the short-term trade — price moved based on float mechanics and momentum, not fundamentals. But the fundamentals tell you this is a trading vehicle, not an investment. The same mechanics that drove it up 2,400% will ultimately drive it back down when float expands through dilution, which is the inevitable outcome for companies in this financial condition.</p>
<h3>Entry, Stop, and Exit Strategy</h3>
<p>The correct approach to a move like DFNS: identify the float mechanics early (reverse split announcement is public information), size small due to extreme volatility, enter on the first confirmed breakout above a resistance level with volume, and take profits aggressively into strength. Holding for the top is almost always a mistake — these moves end without warning and the reversal is as violent as the rally. The traders who made money on DFNS were the ones who identified it early, took profits on the way up, and were not holding size when it reversed.</p>
<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">Reverse split squeezes are one of the most reliable categories of low float momentum trade — but they require understanding that the move is mechanical, not fundamental. Your edge is recognizing the float math early: a 1-for-125 reverse split creating 1.1 million shares is a setup, not a random event. Monitor the SEC corporate actions calendar for reverse split announcements in micro-cap names. The stocks with the most extreme split ratios (50:1, 100:1, 125:1) and a catalyst narrative attached are the highest probability setups.</div></div>`},
'cs-tdic':{title:'TDIC — Monster Move & Immediate Fade May 2026',content:`<h3>TDIC — Monster Move & Immediate Fade May 2026</h3>
<p><strong>Date Range:</strong> May 13-14, 2026</p>
<p><strong>Concept:</strong> Gap and trap, blow-off top, exhaustion signals, why chasing day-two gap ups destroys accounts</p>
<h3>The Setup</h3>
<p>TDIC made a massive single-day move on May 13, 2026 — a strong catalyst-driven gap up followed by sustained intraday momentum that carried the stock significantly higher through the session. Volume was extreme. The move was real. By the close of May 13, TDIC had produced one of the most significant single-day percentage moves in recent small/mid cap history.</p>
<h3>What Happened Day Two — May 14</h3>
<p>May 14 opened with a gap up or near the prior day's highs, attracting a second wave of buyers who had missed the May 13 move and were chasing continuation. The stock immediately began selling off. By the close of May 14, TDIC had given back a substantial portion of the prior day's gains, trapping every buyer who entered on the second day.</p>
<p>This is the classic "gap and trap" or "day two fade" pattern — one of the most consistent and most painful patterns in momentum trading.</p>
<h3>Why Day Two Fades Happen</h3>
<p>On day one of a major catalyst move, the buyers are genuine — institutions repositioning, short sellers covering, informed traders acting on the catalyst. These are real transactions with real intent behind them.</p>
<p>On day two, the buyer profile changes completely. The day one move has been covered in financial media, social media, and trading chat rooms overnight. Retail traders who missed the move pile in at the open hoping for continuation. But the day one buyers — who are now sitting on significant profits — use this second-day retail buying demand as liquidity to exit their positions. The supply from day one profit-taking overwhelms the demand from day two chasers, and the stock fades.</p>
<h3>The Exhaustion Signals That Were Visible</h3>
<p>In hindsight — and for experienced traders, in real time — the exhaustion signals on day one were present before day two even began. The volume on the day one close was declining relative to the morning session. The candles in the afternoon showed smaller bodies with longer upper wicks — rejection of higher prices. The stock was stretched significantly above its VWAP by end of day, a classic overextension signal. Each of these individually is a warning. Together they are a strong signal that the move is exhausted and that day two continuation probability is low.</p>
<h3>The Correct Trades in This Situation</h3>
<p><strong>Day one:</strong> Buy the catalyst early, take profits aggressively into the afternoon strength, do not hold full size overnight.</p>
<p><strong>Day two:</strong> If anything, the correct trade is the short — entering as the stock fails to hold the opening gap, with a stop above the overnight high. The day two fade is a repeatable, identifiable pattern. The traders who recognized TDIC as a probable day two fade and positioned accordingly made money while the chasers lost it.</p>
<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">Day two fades are one of the most reliable patterns in momentum trading because human psychology creates them with near mechanical consistency. Every significant day one move creates overnight FOMO. That FOMO creates day two buying demand. Day one holders use that demand to exit. The pattern repeats because the psychological dynamics never change. When you see a stock that made a massive single-day move, your default assumption for day two should be fade, not continuation — unless there is a specific additional catalyst that justifies new buying demand.</div></div>`},
'cs-tlry':{title:'TLRY — Cannabis Resurgence 2025-2026',content:`<h3>TLRY — Cannabis Resurgence 2025-2026</h3>
<p><strong>Date Range:</strong> July 2025 — October 2026</p>
<p><strong>Concept:</strong> Sector catalyst trading, regulatory-driven moves, same stock different era</p>
<h3>Why TLRY Is Already in the Course</h3>
<p>Tilray appears twice in the TST case study library — the 2018 cannabis mania parabolic move, and this 2025-2026 resurgence. The reason for including both is deliberate: it shows students how the same stock, driven by the same general catalyst (cannabis legalization momentum), can produce dramatically different trading dynamics in different market environments and at different stages of a company's development.</p>
<h3>The 2025-2026 Context</h3>
<p>Cannabis rescheduling and legalization momentum in the United States — after years of legislative near-misses — created renewed institutional and retail interest in cannabis names in 2025. TLRY, as one of the largest publicly traded cannabis companies with significant US operations, became the primary vehicle for this renewed interest. Unlike the 2018 mania which was pure speculative euphoria on a pre-revenue company, the 2025 move had more fundamental backing — TLRY had built actual revenue, actual distribution, and was positioned to benefit concretely from regulatory changes.</p>
<h3>What the Chart Teaches</h3>
<p>Comparing the 2018 TLRY chart to the 2025-2026 TLRY chart teaches several important lessons. The 2018 move was parabolic and immediate — straight up, then straight down, no base formation, no institutional accumulation signature. The 2025-2026 move had a different character — base formations, multiple consolidation periods, volume signatures consistent with institutional buying rather than pure retail speculation. The shape of a move tells you who is driving it. Parabolic with no base = retail driven, fragile. Stair-stepping with consolidations = institutional driven, more durable.</p>
<h3>Regulatory Catalyst Trading</h3>
<p>Cannabis stocks are uniquely sensitive to regulatory news — a single headline about rescheduling, state legalization votes, or federal legislation can move the entire sector 20-50% in a day. Trading regulatory catalysts requires understanding the calendar (when are votes scheduled, when do agency decisions come out) and the market's positioning going into those events. Pre-positioning ahead of a known catalyst date, then selling into the news, is a different skill than reacting to unexpected catalysts — and both skills are necessary for trading regulatory-driven sectors effectively.</p>
<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">Regulatory catalyst sectors — cannabis, psychedelics, biotech, crypto — follow a pattern: years of promise, occasional explosive moves on legislative progress, then retreats when progress stalls. The traders who consistently profit in these sectors are not the ones who pick the right stock. They're the ones who understand the catalyst calendar, position ahead of known decision dates with defined risk, and exit into the news regardless of whether they feel the move has more to go.</div></div>`},
'cs-be':{title:'BE — Bloom Energy Full Cycle 2024-2025',content:`<h3>BE — Bloom Energy Full Cycle 2024-2025</h3>
<p><strong>Date Range:</strong> July 2024 — July 2025</p>
<p><strong>Concept:</strong> Clean energy sector cycle, AI datacenter power demand as catalyst, full accumulation to distribution</p>
<h3>The Setup: AI Creates an Unexpected Clean Energy Catalyst</h3>
<p>Bloom Energy produces solid oxide fuel cell systems that generate electricity on-site, primarily for commercial and industrial customers. In prior years, it was categorized as a niche clean energy play with moderate institutional interest. The emergence of the AI datacenter buildout as a dominant investment theme in 2024-2025 created an unexpected and powerful new catalyst: massive datacenters need reliable, always-on power that traditional grid infrastructure cannot guarantee, and Bloom's on-site generation capability suddenly became strategically valuable in a way it hadn't been previously.</p>
<h3>The Accumulation Phase</h3>
<p>Before the main move, BE showed classic accumulation characteristics on the daily chart — range-bound price action over several weeks with periodic high-volume sessions that closed near the top of the daily range. This is the institutional buying signature: large buyers absorbing available shares without driving the price up, waiting until they've built their full position before the stock breaks out. The volume pattern told the story that the price chart didn't yet.</p>
<h3>The Catalyst Confirmation</h3>
<p>Earnings, contract announcements, or analyst upgrades that confirmed the AI datacenter demand thesis provided the breakout catalyst. Once the narrative became public and confirmed by company guidance, the stock broke out of its accumulation range on heavy volume — the institutional buyers who had been quietly accumulating allowed the price to move as retail and momentum money arrived.</p>
<h3>The Distribution and Fade</h3>
<p>The back half of the case study — the distribution and eventual fade — teaches equally important lessons. After the initial breakout run, BE began showing distribution characteristics: high volume on days the stock closed near its lows, failed attempts to break to new highs, and eventually a series of lower highs that signaled the institutional sellers had arrived. Recognizing the shift from accumulation to distribution — the same volume tools applied to opposite conclusions — is the skill that separates traders who capture full moves from those who give back gains by holding into the reversal.</p>
<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">Clean energy stocks are among the most volatile and most theme-driven in the market. They can double on a single regulatory tailwind or collapse 60% when sector sentiment shifts. The key to trading them profitably is identifying when a genuine new catalyst — not just sector enthusiasm — is creating real fundamental change in demand for a specific company's product. BE's AI datacenter angle was a real fundamental change. Recognizing that distinction between genuine fundamental improvement and sentiment-driven hype is the edge.</div></div>`},
'cs-sndk':{title:'SNDK — Post-Spinoff Re-Rating 2024-2025',content:`<h3>SNDK — Post-Spinoff Re-Rating 2024-2025</h3>
<p><strong>Date Range:</strong> September 2024 — July 2025</p>
<p><strong>Concept:</strong> Spinoff mechanics, post-spinoff price discovery, semiconductor storage re-rating</p>
<h3>What Is a Spinoff and Why They Trade Differently</h3>
<p>A spinoff occurs when a parent company separates a business unit into an independent publicly traded company. Western Digital spun off SanDisk as a standalone entity, creating SNDK as a pure-play NAND flash memory and storage solutions company. Spinoffs are systematically undervalued at the time of separation for structural reasons that create a repeatable trading opportunity.</p>
<p>When a spinoff occurs, the parent company distributes shares of the new entity to existing shareholders. Many of those shareholders — particularly institutional index funds — did not choose to own the spinoff company and will sell it indiscriminately in the weeks following the separation. This forced selling, unrelated to the fundamentals of the business, creates an artificially depressed price that doesn't reflect intrinsic value.</p>
<h3>The Re-Rating Thesis</h3>
<p>As a standalone company, SNDK could be valued by the market on its own merits rather than being buried inside a larger diversified hardware company. Pure-play companies typically receive higher valuation multiples than diversified conglomerates because investors can take a cleaner, more targeted position. The re-rating thesis: once the forced selling from index funds and WDC shareholders subsides, SNDK would be discovered by storage sector specialists and re-rated to a multiple more appropriate for its position in the NAND flash market.</p>
<h3>The AI Storage Connection</h3>
<p>The timing of the spinoff coincided with explosive growth in demand for NAND flash storage driven by AI infrastructure buildout. AI training requires enormous amounts of fast storage for datasets and model weights. SNDK, as a pure-play storage company, was directly positioned to benefit from this demand surge. The combination of spinoff re-rating mechanics and an AI tailwind created a multi-layered catalyst that drove sustained appreciation.</p>
<h3>The Trading Opportunity</h3>
<p>The optimal entry in a spinoff situation is typically 4-8 weeks after the separation, once the forced selling from index rebalancing and unwanted shareholders has exhausted itself. The stock often makes its low during this period of indiscriminate selling. A base formation following the initial selling pressure, with volume declining on the formation, signals that the forced sellers are done. The subsequent breakout from that base — often accompanied by the first positive analyst initiations on the standalone company — marks the beginning of the re-rating move.</p>
<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">Spinoffs are one of the most consistently profitable event-driven trading strategies available because they're driven by structural mechanics, not sentiment. The forced selling is predictable. The re-rating is predictable. The timing of the base formation is trackable. Monitor SEC Form 10-12B filings — these are the registration statements for spinoffs — and mark your calendar for 4-8 weeks post-separation as the optimal entry window. This is an edge that requires no forecasting ability, just knowledge of the mechanics.</div></div>`},

'b1-0':{name:'What Are Candlesticks?',html:`<p>Let's keep this simple. A candlestick is just a picture of what price did during a certain time. It could be 1 minute, 5 minutes, 1 hour, daily, weekly, etc. Each candle tells you 4 things: Open (where price started), Close (where price ended), High (highest price the candle went to), and Low (lowest price the candle went to).</p><ul><li><strong>Body</strong> — the thick part of the candle. Represents the range between the open and close.</li><li><strong>Wick</strong> — the thin lines above and below the body. Represent the highest and lowest price reached during that period.</li><li><strong>Green candle</strong> — close was higher than the open. Buyers were in control.</li><li><strong>Red candle</strong> — close was lower than the open. Sellers were in control.</li></ul><p>A candle with a large body and small wicks tells you one side was dominant. A candle with a small body and large wicks tells you there was a battle — price moved significantly in both directions but neither side won decisively.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Don't just look at the color of the candle. Look at the size of the body relative to the wicks. A small green candle with a massive upper wick is not a bullish candle — it's a candle that tried to go up, got rejected hard, and barely closed above the open. Context matters more than color.</p></div>`},
'b1-1':{name:'Bullish Patterns',html:`<p>Bullish candlestick patterns signal that buyers are taking control. They don't guarantee a move up — they indicate a shift in momentum or a potential reversal that deserves attention.</p><div class="pblock"><div class="pname bull">Hammer</div><div class="chart-box"><svg width="100%" viewBox="0 0 680 240" role="img"><title>Hammer</title><desc>Downtrend followed by hammer at support then reversal</desc><line x1="40" y1="200" x2="640" y2="200" stroke="#1e2330" stroke-width="1" stroke-dasharray="5 4"/><text font-family="DM Sans,sans-serif" font-size="11" fill="#3a4455" x="44" y="218">Key Support</text><line x1="100" y1="55" x2="100" y2="178" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="83" y="72" width="34" height="88" rx="3" fill="#e05c5c"/><line x1="200" y1="78" x2="200" y2="188" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="183" y="98" width="34" height="74" rx="3" fill="#e05c5c"/><line x1="300" y1="108" x2="300" y2="196" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="283" y="128" width="34" height="60" rx="3" fill="#e05c5c"/><line x1="400" y1="160" x2="400" y2="172" stroke="#00d27a" stroke-width="2.5" stroke-linecap="round"/><rect x="383" y="172" width="34" height="24" rx="3" fill="#00d27a" stroke="#009955" stroke-width="2"/><line x1="400" y1="196" x2="400" y2="238" stroke="#00d27a" stroke-width="2.5" stroke-linecap="round"/><rect x="375" y="150" width="50" height="100" rx="8" fill="none" stroke="rgba(0,210,122,0.35)" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="500" y1="95" x2="500" y2="188" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="483" y="106" width="34" height="72" rx="3" fill="#00d27a"/><text font-family="DM Sans,sans-serif" font-size="11" fill="#00d27a" x="378" y="144">Hammer</text><text font-family="DM Sans,sans-serif" font-size="11" fill="#6b7280" x="545" y="92">Reversal</text></svg></div><p>A small body near the top of the candle with a long lower wick. Signals that sellers pushed price down significantly but buyers stepped in and drove it back up. Strong sign of buying pressure when it appears at a key support level.</p></div><div class="pblock"><div class="pname bull">Bullish Engulfing</div><div class="chart-box"><svg width="100%" viewBox="0 0 680 240" role="img"><title>Bullish Engulfing</title><desc>Large green candle engulfs prior red candle</desc><line x1="40" y1="208" x2="640" y2="208" stroke="#1e2330" stroke-width="1" stroke-dasharray="5 4"/><line x1="80" y1="52" x2="80" y2="175" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="63" y="70" width="34" height="90" rx="3" fill="#e05c5c"/><line x1="180" y1="78" x2="180" y2="190" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="163" y="98" width="34" height="78" rx="3" fill="#e05c5c"/><line x1="300" y1="118" x2="300" y2="200" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="283" y="135" width="34" height="55" rx="3" fill="#e05c5c" stroke="#b84040" stroke-width="1.5"/><line x1="400" y1="88" x2="400" y2="208" stroke="#00d27a" stroke-width="2.5" stroke-linecap="round"/><rect x="383" y="100" width="34" height="100" rx="3" fill="#00d27a" stroke="#009955" stroke-width="2"/><rect x="274" y="84" width="169" height="134" rx="8" fill="none" stroke="rgba(0,210,122,0.35)" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="500" y1="68" x2="500" y2="175" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="483" y="80" width="34" height="82" rx="3" fill="#00d27a"/><line x1="590" y1="45" x2="590" y2="150" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="573" y="56" width="34" height="78" rx="3" fill="#00d27a"/><text font-family="DM Sans,sans-serif" font-size="11" fill="#e05c5c" x="278" y="118">Prior red candle</text><text font-family="DM Sans,sans-serif" font-size="11" fill="#00d27a" x="384" y="84">Engulfs it completely</text></svg></div><p>A large green candle that completely engulfs the prior red candle's body. Signals that buyers overwhelmed sellers and took complete control. More powerful when it occurs after a downtrend or at a key support zone.</p></div><div class="pblock"><div class="pname bull">Morning Star</div><div class="chart-box"><svg width="100%" viewBox="0 0 680 240" role="img"><title>Morning Star</title><desc>Three candle bullish reversal pattern</desc><line x1="40" y1="210" x2="640" y2="210" stroke="#1e2330" stroke-width="1" stroke-dasharray="5 4"/><text font-family="DM Sans,sans-serif" font-size="11" fill="#3a4455" x="44" y="228">Support</text><line x1="60" y1="52" x2="60" y2="168" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="44" y="68" width="32" height="88" rx="3" fill="#e05c5c"/><line x1="140" y1="78" x2="140" y2="188" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="124" y="95" width="32" height="78" rx="3" fill="#e05c5c"/><line x1="240" y1="65" x2="240" y2="185" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="224" y="82" width="32" height="92" rx="3" fill="#e05c5c" stroke="#b84040" stroke-width="2"/><line x1="330" y1="190" x2="330" y2="198" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/><rect x="316" y="198" width="28" height="12" rx="3" fill="#f59e0b"/><line x1="330" y1="210" x2="330" y2="218" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/><line x1="430" y1="58" x2="430" y2="185" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="414" y="72" width="32" height="104" rx="3" fill="#00d27a" stroke="#009955" stroke-width="2"/><rect x="214" y="54" width="242" height="172" rx="8" fill="none" stroke="rgba(0,210,122,0.35)" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="520" y1="40" x2="520" y2="148" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="504" y="50" width="32" height="86" rx="3" fill="#00d27a"/><text font-family="DM Sans,sans-serif" font-size="11" fill="#e05c5c" x="218" y="48">Large red</text><text font-family="DM Sans,sans-serif" font-size="11" fill="#f59e0b" x="306" y="182">Star</text><text font-family="DM Sans,sans-serif" font-size="11" fill="#00d27a" x="414" y="52">Large green</text></svg></div><p>A three candle pattern — large red candle, small indecision candle, large green candle. Signals a transition from seller control to buyer control. One of the more reliable reversal patterns when found at support.</p></div><div class="pblock"><div class="pname bull">Marubozu</div><div class="chart-box"><svg width="100%" viewBox="0 0 680 240" role="img"><title>Marubozu</title><desc>Full green body no wicks showing complete buyer control</desc><line x1="80" y1="118" x2="80" y2="205" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="63" y="130" width="34" height="62" rx="3" fill="#e05c5c"/><line x1="180" y1="98" x2="180" y2="200" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="163" y="112" width="34" height="75" rx="3" fill="#e05c5c"/><rect x="283" y="52" width="34" height="148" rx="3" fill="#00d27a" stroke="#009955" stroke-width="2.5"/><rect x="273" y="42" width="54" height="168" rx="8" fill="none" stroke="rgba(0,210,122,0.35)" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="420" y1="28" x2="420" y2="132" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="403" y="38" width="34" height="82" rx="3" fill="#00d27a"/><line x1="520" y1="12" x2="520" y2="105" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="503" y="22" width="34" height="72" rx="3" fill="#00d27a"/><text font-family="DM Sans,sans-serif" font-size="11" fill="#00d27a" x="338" y="36">No wicks at all</text><text font-family="DM Sans,sans-serif" font-size="11" fill="#6b7280" x="338" y="200">Open to close — pure body</text></svg></div><p>A candle with no wicks — pure body from open to close. Signals complete dominance by buyers. A green Marubozu means buyers controlled every second of that period. Extremely strong signal of momentum.</p></div><div class="callout"><div class="callout-label">TST Edge</div><p>Bullish candle patterns are meaningless without context. A hammer at a key support level with high volume behind it is a high quality signal. A hammer in the middle of a range with no volume is noise. Always ask — where is this pattern occurring and what is the volume doing?</p></div>`},
'b1-2':{name:'Bearish Patterns',html:`<p>Bearish candlestick patterns signal that sellers are taking control. Like bullish patterns they are most powerful when they appear at key resistance levels with volume confirmation.</p><div class="pblock"><div class="pname bear">Shooting Star</div><div class="chart-box"><svg width="100%" viewBox="0 0 680 240" role="img"><title>Shooting Star</title><desc>Uptrend to resistance then shooting star rejection</desc><line x1="40" y1="62" x2="640" y2="62" stroke="#1e2330" stroke-width="1" stroke-dasharray="5 4"/><text font-family="DM Sans,sans-serif" font-size="11" fill="#3a4455" x="44" y="54">Resistance</text><line x1="80" y1="162" x2="80" y2="225" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="63" y="172" width="34" height="42" rx="3" fill="#00d27a"/><line x1="180" y1="132" x2="180" y2="215" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="163" y="142" width="34" height="62" rx="3" fill="#00d27a"/><line x1="280" y1="105" x2="280" y2="192" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="263" y="115" width="34" height="66" rx="3" fill="#00d27a"/><line x1="390" y1="22" x2="390" y2="170" stroke="#e05c5c" stroke-width="2.5" stroke-linecap="round"/><rect x="373" y="170" width="34" height="22" rx="3" fill="#e05c5c" stroke="#b84040" stroke-width="2"/><line x1="390" y1="192" x2="390" y2="205" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="363" y="12" width="54" height="203" rx="8" fill="none" stroke="rgba(224,92,92,0.35)" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="490" y1="112" x2="490" y2="210" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="473" y="125" width="34" height="72" rx="3" fill="#e05c5c"/><line x1="590" y1="138" x2="590" y2="220" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="573" y="150" width="34" height="60" rx="3" fill="#e05c5c"/><text font-family="DM Sans,sans-serif" font-size="11" fill="#e05c5c" x="363" y="8">Shooting Star</text><text font-family="DM Sans,sans-serif" font-size="11" fill="#6b7280" x="428" y="40">Long upper wick = rejected</text></svg></div><p>The mirror image of the hammer — small body near the bottom of the candle with a long upper wick. Signals that buyers drove price up significantly but sellers stepped in and drove it back down. Strong rejection signal when it appears at resistance.</p></div><div class="pblock"><div class="pname bear">Bearish Engulfing</div><div class="chart-box"><svg width="100%" viewBox="0 0 680 240" role="img"><title>Bearish Engulfing</title><desc>Large red candle engulfs prior green candle at resistance</desc><line x1="40" y1="58" x2="640" y2="58" stroke="#1e2330" stroke-width="1" stroke-dasharray="5 4"/><text font-family="DM Sans,sans-serif" font-size="11" fill="#3a4455" x="44" y="50">Resistance</text><line x1="80" y1="155" x2="80" y2="225" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="63" y="165" width="34" height="50" rx="3" fill="#00d27a"/><line x1="180" y1="122" x2="180" y2="210" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="163" y="132" width="34" height="68" rx="3" fill="#00d27a"/><line x1="295" y1="100" x2="295" y2="190" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="278" y="112" width="34" height="66" rx="3" fill="#00d27a" stroke="#009955" stroke-width="1.5"/><line x1="400" y1="65" x2="400" y2="208" stroke="#e05c5c" stroke-width="2.5" stroke-linecap="round"/><rect x="383" y="75" width="34" height="124" rx="3" fill="#e05c5c" stroke="#b84040" stroke-width="2"/><rect x="268" y="62" width="179" height="156" rx="8" fill="none" stroke="rgba(224,92,92,0.35)" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="500" y1="118" x2="500" y2="215" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="483" y="130" width="34" height="72" rx="3" fill="#e05c5c"/><line x1="600" y1="145" x2="600" y2="225" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="583" y="155" width="34" height="60" rx="3" fill="#e05c5c"/><text font-family="DM Sans,sans-serif" font-size="11" fill="#00d27a" x="272" y="98">Prior green</text><text font-family="DM Sans,sans-serif" font-size="11" fill="#e05c5c" x="428" y="72">Engulfs it completely</text></svg></div><p>A large red candle that completely engulfs the prior green candle's body. Signals that sellers overwhelmed buyers entirely. Most powerful when occurring after an uptrend or at a key resistance zone.</p></div><div class="pblock"><div class="pname bear">Evening Star</div><div class="chart-box"><svg width="100%" viewBox="0 0 680 240" role="img"><title>Evening Star</title><desc>Three candle bearish reversal at resistance</desc><line x1="40" y1="58" x2="640" y2="58" stroke="#1e2330" stroke-width="1" stroke-dasharray="5 4"/><text font-family="DM Sans,sans-serif" font-size="11" fill="#3a4455" x="44" y="50">Resistance</text><line x1="60" y1="148" x2="60" y2="220" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="44" y="158" width="32" height="52" rx="3" fill="#00d27a"/><line x1="148" y1="115" x2="148" y2="208" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="132" y="126" width="32" height="72" rx="3" fill="#00d27a"/><line x1="255" y1="65" x2="255" y2="182" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="239" y="75" width="32" height="96" rx="3" fill="#00d27a" stroke="#009955" stroke-width="2"/><line x1="348" y1="46" x2="348" y2="58" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/><rect x="334" y="58" width="28" height="12" rx="3" fill="#f59e0b"/><line x1="348" y1="70" x2="348" y2="82" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/><line x1="448" y1="65" x2="448" y2="188" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="432" y="75" width="32" height="104" rx="3" fill="#e05c5c" stroke="#b84040" stroke-width="2"/><rect x="229" y="36" width="255" height="156" rx="8" fill="none" stroke="rgba(224,92,92,0.35)" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="545" y1="122" x2="545" y2="218" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="529" y="132" width="32" height="76" rx="3" fill="#e05c5c"/><text font-family="DM Sans,sans-serif" font-size="11" fill="#00d27a" x="233" y="58">Large green</text><text font-family="DM Sans,sans-serif" font-size="11" fill="#f59e0b" x="324" y="40">Star</text><text font-family="DM Sans,sans-serif" font-size="11" fill="#e05c5c" x="432" y="60">Large red</text></svg></div><p>The bearish version of the Morning Star — large green candle, small indecision candle, large red candle. Signals a transition from buyer control to seller control.</p></div><div class="callout"><div class="callout-label">TST Edge</div><p>The upper wick is one of the most important signals in all of technical analysis. When a stock repeatedly tests a level and produces long upper wicks — sellers are there. They're defending that level. Don't fight it. Either wait for a clean break with volume or use it as your target to sell into.</p></div>`},
'b1-3':{name:'Doji & Indecision Candles',html:`<p>A Doji is a candle where the open and close are virtually equal — producing a candle with a very small body or no body at all. Doji candles signal indecision in the market. Neither buyers nor sellers won that period.</p><div class="pblock"><div class="pname neut">Standard Doji</div><div class="chart-box"><svg width="100%" viewBox="0 0 680 240" role="img"><title>Standard Doji</title><desc>Uptrend followed by doji showing indecision</desc><line x1="80" y1="145" x2="80" y2="218" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="63" y="155" width="34" height="52" rx="3" fill="#00d27a"/><line x1="180" y1="112" x2="180" y2="202" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="163" y="122" width="34" height="68" rx="3" fill="#00d27a"/><line x1="280" y1="85" x2="280" y2="178" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="263" y="95" width="34" height="72" rx="3" fill="#00d27a"/><line x1="390" y1="48" x2="390" y2="125" stroke="#888780" stroke-width="2.5" stroke-linecap="round"/><rect x="373" y="125" width="34" height="5" rx="2" fill="#888780"/><line x1="390" y1="130" x2="390" y2="208" stroke="#888780" stroke-width="2.5" stroke-linecap="round"/><rect x="363" y="38" width="54" height="180" rx="8" fill="none" stroke="rgba(136,135,128,0.4)" stroke-width="1.5" stroke-dasharray="4 3"/><text font-family="DM Sans,sans-serif" font-size="11" fill="#888780" x="428" y="68">Equal wicks</text><text font-family="DM Sans,sans-serif" font-size="11" fill="#888780" x="428" y="132">Tiny body — indecision</text></svg></div><p>Equal wicks above and below a tiny body. Pure indecision. Neither side had conviction. Often signals a pause or potential reversal when found after a strong trend.</p></div><div class="pblock"><div class="pname neut">Long-Legged Doji</div><div class="chart-box"><svg width="100%" viewBox="0 0 680 240" role="img"><title>Long-Legged Doji</title><desc>Extremely long wicks showing violent price swings with no winner</desc><line x1="340" y1="14" x2="340" y2="118" stroke="#888780" stroke-width="2.5" stroke-linecap="round"/><rect x="323" y="118" width="34" height="5" rx="2" fill="#888780"/><line x1="340" y1="123" x2="340" y2="228" stroke="#888780" stroke-width="2.5" stroke-linecap="round"/><rect x="313" y="4" width="54" height="234" rx="8" fill="none" stroke="rgba(136,135,128,0.4)" stroke-width="1.5" stroke-dasharray="4 3"/><text font-family="DM Sans,sans-serif" font-size="11" fill="#888780" x="378" y="28">Buyers drove it way up</text><text font-family="DM Sans,sans-serif" font-size="11" fill="#888780" x="378" y="124">Back where it started</text><text font-family="DM Sans,sans-serif" font-size="11" fill="#888780" x="378" y="228">Sellers drove it way down</text></svg></div><p>Very long wicks above and below with a tiny body. Signals extreme indecision — price swung dramatically in both directions and ended up exactly where it started. High volatility, no winner.</p></div><div class="pblock"><div class="pname bear">Gravestone Doji</div><div class="chart-box"><svg width="100%" viewBox="0 0 680 240" role="img"><title>Gravestone Doji</title><desc>Long upper wick body at bottom bearish rejection at resistance</desc><line x1="40" y1="58" x2="640" y2="58" stroke="#1e2330" stroke-width="1" stroke-dasharray="5 4"/><text font-family="DM Sans,sans-serif" font-size="11" fill="#3a4455" x="44" y="50">Resistance</text><line x1="80" y1="152" x2="80" y2="220" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="63" y="162" width="34" height="48" rx="3" fill="#00d27a"/><line x1="180" y1="122" x2="180" y2="208" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="163" y="132" width="34" height="65" rx="3" fill="#00d27a"/><line x1="390" y1="22" x2="390" y2="200" stroke="#e05c5c" stroke-width="2.5" stroke-linecap="round"/><rect x="373" y="200" width="34" height="5" rx="2" fill="#e05c5c"/><rect x="363" y="12" width="54" height="202" rx="8" fill="none" stroke="rgba(224,92,92,0.35)" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="490" y1="112" x2="490" y2="210" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="473" y="124" width="34" height="72" rx="3" fill="#e05c5c"/><text font-family="DM Sans,sans-serif" font-size="11" fill="#e05c5c" x="363" y="8">Gravestone Doji</text><text font-family="DM Sans,sans-serif" font-size="11" fill="#6b7280" x="428" y="42">Buyers tried — sellers rejected</text><text font-family="DM Sans,sans-serif" font-size="11" fill="#6b7280" x="428" y="205">Body at the bottom</text></svg></div><p>Long upper wick, no lower wick, tiny body at the bottom. Price opened, buyers drove it up, sellers rejected it all the way back to the open. Bearish signal, especially at resistance.</p></div><div class="pblock"><div class="pname bull">Dragonfly Doji</div><div class="chart-box"><svg width="100%" viewBox="0 0 680 240" role="img"><title>Dragonfly Doji</title><desc>Long lower wick body at top bullish rejection at support</desc><line x1="40" y1="205" x2="640" y2="205" stroke="#1e2330" stroke-width="1" stroke-dasharray="5 4"/><text font-family="DM Sans,sans-serif" font-size="11" fill="#3a4455" x="44" y="223">Key Support</text><line x1="280" y1="108" x2="280" y2="198" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="263" y="120" width="34" height="68" rx="3" fill="#e05c5c"/><rect x="373" y="48" width="34" height="5" rx="2" fill="#00d27a"/><line x1="390" y1="53" x2="390" y2="228" stroke="#00d27a" stroke-width="2.5" stroke-linecap="round"/><rect x="363" y="38" width="54" height="200" rx="8" fill="none" stroke="rgba(0,210,122,0.35)" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="490" y1="28" x2="490" y2="138" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="473" y="38" width="34" height="88" rx="3" fill="#00d27a"/><text font-family="DM Sans,sans-serif" font-size="11" fill="#00d27a" x="363" y="32">Dragonfly Doji</text><text font-family="DM Sans,sans-serif" font-size="11" fill="#6b7280" x="428" y="52">Body at the top</text><text font-family="DM Sans,sans-serif" font-size="11" fill="#6b7280" x="428" y="228">Sellers tried — buyers rejected</text></svg></div><p>Long lower wick, no upper wick, tiny body at the top. Sellers drove price down, buyers rejected it all the way back to the open. Bullish signal, especially at support.</p></div><div class="pblock"><div class="pname neut">Spinning Top</div><div class="chart-box"><svg width="100%" viewBox="0 0 680 240" role="img"><title>Spinning Top</title><desc>Small body moderate wicks showing indecision after uptrend</desc><line x1="80" y1="138" x2="80" y2="215" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="63" y="148" width="34" height="56" rx="3" fill="#00d27a"/><line x1="180" y1="108" x2="180" y2="200" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="163" y="118" width="34" height="70" rx="3" fill="#00d27a"/><line x1="390" y1="55" x2="390" y2="98" stroke="#888780" stroke-width="2.5" stroke-linecap="round"/><rect x="373" y="98" width="34" height="44" rx="3" fill="#888780" stroke="#5f5e5a" stroke-width="2"/><line x1="390" y1="142" x2="390" y2="188" stroke="#888780" stroke-width="2.5" stroke-linecap="round"/><rect x="363" y="45" width="54" height="153" rx="8" fill="none" stroke="rgba(136,135,128,0.4)" stroke-width="1.5" stroke-dasharray="4 3"/><text font-family="DM Sans,sans-serif" font-size="11" fill="#888780" x="428" y="72">Small body</text><text font-family="DM Sans,sans-serif" font-size="11" fill="#888780" x="428" y="122">Moderate wicks both sides</text></svg></div><p>Small body with moderate wicks on both sides. Less extreme than a Doji but signals the same thing — indecision. Market is pausing and deciding which direction to go next.</p></div><div class="callout"><div class="callout-label">TST Edge</div><p>Indecision candles are most valuable as confirmation tools. A Doji after three strong green candles at resistance tells you momentum is stalling. A Doji at key support after a sharp selloff tells you sellers may be losing steam. Use them to confirm what the overall picture is already telling you — don't trade them in isolation.</p></div>`},

const LESSON_SIGNALS={'b6-1':'breakout','b6-2':'patience','b6-4':'patience','b6-5':'dip','b6-6':'patience','b3-0':'dip','b3-1':'dip','b2-0':'momentum','b2-1':'momentum','n7-0':'dip','n7-1':'breakout','n7-2':'patience','n8-0':'risk','n8-1':'risk','ac-0':'momentum','ac-3':'momentum','ac-4':'patience'};

function trackLessonStart(id){
  BEHAVIOR.lessonStartTime=Date.now();
  BEHAVIOR.lessonTimes[id]=BEHAVIOR.lessonTimes[id]||{starts:0,totalTime:0};
  BEHAVIOR.lessonTimes[id].starts++;
  if(BEHAVIOR.lessonTimes[id].starts>1){BEHAVIOR.retries[id]=(BEHAVIOR.retries[id]||0)+1;logFlag('revisit','Revisited: '+id);}
}
function trackLessonComplete(id){
  if(!BEHAVIOR.lessonStartTime)return;
  const elapsed=Math.round((Date.now()-BEHAVIOR.lessonStartTime)/1000);
  if(BEHAVIOR.lessonTimes[id])BEHAVIOR.lessonTimes[id].totalTime+=elapsed;
  if(elapsed<15)logFlag('speed','Fast lesson ('+elapsed+'s): '+id);
  if(elapsed>300)logFlag('thorough','Deep study ('+elapsed+'s): '+id);
  BEHAVIOR.lessonStartTime=null;
}
function trackQuizAnswer(lessonId,qIdx,selected,correct,isCorrect){
  const elapsed=BEHAVIOR.questionStartTime?Math.round((Date.now()-BEHAVIOR.questionStartTime)/1000):null;
  BEHAVIOR.questionStartTime=Date.now();
  const signal=LESSON_SIGNALS[lessonId]||null;
  BEHAVIOR.quizzes.push({lessonId,qIdx,isCorrect,responseTime:elapsed,signal,ts:Date.now()});
  if(signal){BEHAVIOR.scores[signal].push(isCorrect?1:0);}
  if(elapsed&&elapsed<4)logFlag('impulsive','Fast answer ('+elapsed+'s) q'+qIdx+' in '+lessonId);
  if(elapsed&&elapsed>25)logFlag('deliberate','Deliberate ('+elapsed+'s) q'+qIdx+' in '+lessonId);
}
function logFlag(type,note){BEHAVIOR.flags.push({type,note,ts:Date.now()});}

function computeProfile(){
  const s=BEHAVIOR.scores;
  const avg=arr=>arr.length?Math.round((arr.filter(x=>x===1).length/arr.length)*100):null;
  const breakoutAcc=avg(s.breakout),dipAcc=avg(s.dip),momentumAcc=avg(s.momentum),patienceAcc=avg(s.patience),riskAcc=avg(s.risk);
  const impulsive=BEHAVIOR.flags.filter(f=>f.type==='impulsive').length;
  const deliberate=BEHAVIOR.flags.filter(f=>f.type==='deliberate').length;
  let profile='Undetermined',traits=[],warnings=[];
  if(breakoutAcc!==null&&dipAcc!==null){
    if(breakoutAcc>dipAcc+15)profile='Momentum Chaser';
    else if(dipAcc>breakoutAcc+15)profile='Sniper';
    else if(patienceAcc&&patienceAcc>70)profile='Swing Specialist';
    else profile='Hybrid';
  }
  if(impulsive>deliberate*2){traits.push('Impulsive decision maker');warnings.push('High risk of chasing trades and overtrading');}
  if(deliberate>impulsive*2){traits.push('Methodical and analytical');traits.push('Natural swing trader tendencies');}
  if(Object.keys(BEHAVIOR.retries).length>5)traits.push('Highly coachable — revisits material');
  if(BEHAVIOR.flags.filter(f=>f.type==='speed').length>3)warnings.push('Rushes through lessons — may miss key concepts');
  if(BEHAVIOR.flags.filter(f=>f.type==='thorough').length>3)traits.push('Deep learner — takes time to absorb material');
  if(riskAcc!==null&&riskAcc<50)warnings.push('Struggles with risk management concepts — priority area');
  return{profile,traits,warnings,scores:{breakout:breakoutAcc,dip:dipAcc,momentum:momentumAcc,patience:patienceAcc,risk:riskAcc},totalQuizzes:BEHAVIOR.quizzes.length,impulsiveCount:impulsive,deliberateCount:deliberate};
}

  const al=allLessons();
  const idx=al.findIndex(l=>l.id===id);
  const lesson=al[idx],prev=al[idx-1],next=al[idx+1];
  let html='';

  if(id==='interactive-quiz'){
    html='<div class="lesson-content"><div style="font-family:Rajdhani,sans-serif;font-size:28px;font-weight:700;color:#f0f4f1;margin-bottom:6px;">Interactive Trade Quiz</div><div style="font-size:13px;color:#6b7c6e;margin-bottom:24px;line-height:1.6;">Real historical charts. Identify the setup, choose your answer, get instant feedback with real data behind it.</div><div id="interactiveQuizContainer"></div></div>';
    if(!lesson) { var al2 = allLessons(); lesson = al2.find(function(l){return l.id===id}); }
  } else if(id&&id.startsWith('quiz-')){
    const qSectionId=id.replace('quiz-','');
    const qSec=COURSE.find(function(s){return s.id===qSectionId;});
    const qLabel=qSec?qSec.label:qSectionId;
    if(window.TST_QUIZ&&window.TST_QUIZ.getQuiz(qSectionId)){
      html='<div class="quiz-page-wrap"><div class="quiz-page-header"><span class="quiz-page-label">'+qLabel+'</span><h2>Section Quiz</h2><p>Test your knowledge before moving on. Answer all questions and submit to see your results. You need 75% or higher to pass.</p></div>'+window.TST_QUIZ.render(qSectionId)+'</div>';
    } else {
      html='<div class="lesson-content"><p>No quiz available for this section yet.</p></div>';
    }
  } else if(INTROS[id]){
    const I=INTROS[id];
    const sec=COURSE.find(s=>s.id===id);
    html=`<div class="sec-intro-card"><span class="sic-badge">${sec?sec.label:id}</span><h2>${(sec?sec.label:id).toUpperCase()}</h2><p>${I.desc}</p><div class="topics-wrap">${I.topics.map(t=>`<span class="topic-pill">${t}</span>`).join('')}</div></div>`;
  } else if(typeof LESSONS!=='undefined'&&LESSONS[id]){
    const L=LESSONS[id];
    const secLabel=lesson?lesson.sec:'';
    const videoLessons=['b3-1','b5-0','b9-1','b10-0','a4'];
    const showVideo=videoLessons.includes(id);
    html=`<div class="lesson-tag">${secLabel}</div><div class="lesson-title">${L.title.toUpperCase()}</div><div class="lesson-meta"><span>📖 Written lesson</span>${showVideo?'<span>🎬 Video included</span>':''}</div>${showVideo?'<div class="video-wrap"><div class="vid-ph"><div class="vid-icon">▶</div><p>Video coming soon</p></div></div>':''}<div class="lc">${L.content}</div>${notesPanel(id)}`;
  } else if(typeof CANDLE_SECTIONS!=='undefined'&&CANDLE_SECTIONS[id]){
    const cs=CANDLE_SECTIONS[id];
    html=`<div class="lesson-tag">Beginner Fundamentals — Candlesticks</div><div class="lesson-title">${cs.name.toUpperCase()}</div><div class="lesson-meta"><span>📖 Written lesson</span></div><div class="lc">${cs.html}</div>${notesPanel(id)}`;
  } else {
    const title=lesson?lesson.title:id;
    const secLabel=lesson?lesson.sec:'';
    html=`<div class="lesson-tag">${secLabel}</div><div class="lesson-title">${title.toUpperCase()}</div><div class="lesson-meta"><span>📖 Written lesson</span><span>🎬 Video included</span></div><div class="lc"><div class="cs-wrap"><div class="cs-icon">📝</div><h3>COMING SOON</h3><p>This lesson is being prepared. Check back after launch!</p></div></div>${notesPanel(id)}`;
  }

  const isIntro=INTROS[id]!==undefined;
  html+=`<div class="lesson-nav"><button class="nav-btn" onclick="loadLesson('${prev?prev.id:''}')" ${!prev?'disabled':''}>← Previous</button><button class="nav-btn primary" onclick="completeNext('${id}','${next?next.id:''}',${ isIntro})">${next?(isIntro?'Start Section →':'Mark Complete & Next →'):'Complete Course ✓'}</button></div>`;

  document.getElementById('mc').innerHTML=html;
  if(id==='interactive-quiz' && window.TST_INTERACTIVE_QUIZ){ window.TST_INTERACTIVE_QUIZ.current=0;window.TST_INTERACTIVE_QUIZ.score=0;window.TST_INTERACTIVE_QUIZ.answered=[];setTimeout(function(){window.TST_INTERACTIVE_QUIZ.render('interactiveQuizContainer');},80); }
  loadLessonCharts(id).then(function(c){if(c){var lc=document.querySelector('.lc');if(lc)lc.insertAdjacentHTML('beforeend',c);}});
  window.scrollTo(0,0);
  buildSidebar();
}

function completeNext(id,nid,isIntro){
  if(!isIntro)done.add(id);
  if(nid)loadLesson(nid);
  else buildSidebar();
  updateProgress();
}

function toggleChat(){document.getElementById('aip').classList.toggle('open');}

async function sendAI(){
  const inp=document.getElementById('aiin'),msg=inp.value.trim();if(!msg)return;inp.value='';
  addMsg(msg,'user');addMsg('Thinking...','bot','thinking-msg');
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:'You are the TST Academy AI assistant for Top Stock Trading. Help students understand trading concepts clearly and concisely. Be educational, beginner-friendly, and direct. Never give specific buy/sell advice on real stocks.',messages:[{role:'user',content:msg}]})});
    const d=await r.json();
    document.getElementById('thinking-msg')?.remove();
    addMsg(d.content[0].text,'bot');
  }catch(e){document.getElementById('thinking-msg')?.remove();addMsg('Connection error. Try again.','bot');}
}

function addMsg(text,type,id){
  const msgs=document.getElementById('aimsg'),div=document.createElement('div');
  div.className=`ai-msg ${type}`;if(id)div.id=id;div.textContent=text;
  msgs.appendChild(div);msgs.scrollTop=msgs.scrollHeight;
}
var _notifData=[];
var _notifOpen=false;

function toggleNotifDropdown(){
  _notifOpen=!_notifOpen;
  var dd=document.getElementById('notifDropdown');
  if(dd) dd.className=_notifOpen?'notif-dropdown open':'notif-dropdown';
}

document.addEventListener('click',function(e){
  var wrap=document.getElementById('notifWrap');
  if(wrap&&!wrap.contains(e.target)){
    _notifOpen=false;
    var dd=document.getElementById('notifDropdown');
    if(dd) dd.className='notif-dropdown';
  }
});

async function loadNotifications(){
  try{
    var sb=window.getSupabaseClient?window.getSupabaseClient():null;
    if(!sb) return;
    var user=window._currentUser;
    if(!user) return;
    var r1=await sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(20);
    var notifs=r1.data||[];
    if(!notifs.length) return;
    var r2=await sb.from('notification_reads').select('notification_id').eq('user_id',user.id);
    var readSet=new Set((r2.data||[]).map(function(x){return x.notification_id;}));
    _notifData=notifs.map(function(n){return Object.assign({},n,{read:readSet.has(n.id)});});
    var unread=_notifData.filter(function(n){return !n.read;}).length;
    var dot=document.getElementById('notifDot');
    if(dot) dot.className=unread>0?'notif-dot show':'notif-dot';
    renderNotifList();
  }catch(e){}
}

function renderNotifList(){
  var list=document.getElementById('notifList');
  if(!list) return;
  if(!_notifData.length){
    list.innerHTML='<div class="notif-empty">No notifications</div>';
    return;
  }
  list.innerHTML='';
  _notifData.forEach(function(n){
    var dt=new Date(n.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric'});
    var div=document.createElement('div');
    div.className=n.read?'notif-item':'notif-item unread';
    var dot2=n.read?'':'<span style="color:#22c55e;margin-right:4px;">&#9679;</span>';
    div.innerHTML=dot2+'<div class="notif-item-title">'+n.title+'</div><div class="notif-item-date">'+dt+'</div>';
    (function(id){div.onclick=function(){markNotifRead(id);};})(n.id);
    list.appendChild(div);
  });
}

async function markNotifRead(nid){
  try{
    var sb=window.getSupabaseClient?window.getSupabaseClient():null;
    var user=window._currentUser;
    if(!sb||!user) return;
    await sb.from('notification_reads').upsert({user_id:user.id,notification_id:nid},{onConflict:'user_id,notification_id'});
    _notifData=_notifData.map(function(n){return n.id===nid?Object.assign({},n,{read:true}):n;});
    var unread=_notifData.filter(function(n){return !n.read;}).length;
    var dot=document.getElementById('notifDot');
    if(dot) dot.className=unread>0?'notif-dot show':'notif-dot';
    renderNotifList();
  }catch(e){}
}
