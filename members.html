</svg></div><p>The Cup and Handle is a bullish continuation pattern made famous by William O'Neil. It forms over a longer time period — typically weeks to months — and signals a stock consolidating before a major breakout.</p><h3>The Cup</h3><p>A rounded, U-shaped consolidation. Price declines gradually, rounds out at the bottom without sharp moves, and gradually rises back to near the prior high. The key word is rounded — not a V-shape. The gradual rounding indicates orderly accumulation.</p><h3>The Handle</h3><p>After the cup forms, a small consolidation forms — typically a slight downward drift on low volume. The handle shakes out the last remaining weak holders before the breakout.</p><ul><li><strong>Entry:</strong> When price breaks above the handle's upper trendline with strong volume</li><li><strong>Stop:</strong> Below the handle's low</li><li><strong>Target:</strong> The depth of the cup added to the breakout point</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>The cup and handle is a longer term pattern — most effective on daily and weekly charts. The pattern derives its strength from the extended accumulation period. The longer the base, the bigger the potential move.</p></div>`},
'b7-0':{title:'What Is Consolidation',content:`<p>Consolidation is a period of sideways price action after a directional move. The market moves in phases — impulse moves followed by consolidation, then another impulse move. Learning to identify consolidation patterns and wait for the breakout is one of the most powerful skills in trading.</p><h3>Healthy consolidation characteristics</h3><ul><li>Tight price range — price is coiling, not swinging wildly</li><li>Decreasing volume — the battle is quieting down</li><li>Clean structure — clear upper and lower boundaries that price respects</li><li>Time — consolidation takes time to build. A one or two candle pause is not consolidation.</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>Not all tight ranges are healthy consolidation. A stock consolidating after a strong move is building energy for the next leg. A stock consolidating after a failed breakout with heavy selling is distributing — smart money is selling to retail buyers who think the consolidation is a gift. Always identify the context.</p></div>`},
'b7-1':{title:'Trading Inside Consolidation',content:`<p>Once you've identified a consolidation, you have two choices — trade within the range or wait for the breakout. Both are valid strategies but they have different risk profiles.</p><h3>Trading within the range</h3><p>Buy near the bottom of the consolidation with a stop just below it. Sell near the top. This requires the range to be wide enough to justify the trade — you need enough room between your entry and your target to achieve a minimum 2:1 reward to risk ratio.</p><h3>What not to do</h3><p>Don't buy in the middle of consolidation. You have no edge there — you're too far from support for a tight stop on a long, and too far from resistance for a tight stop on a short. The middle of a range is where you go to give money away.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The best consolidations to trade within are the wide, clean, well-defined ones with multiple touches on both boundaries. If you can't clearly see the top and the bottom, don't trade within it. Wait for the breakout instead.</p></div>`},
'b7-2':{title:'Breakouts From Consolidation',content:`<p>The breakout from consolidation is where the real opportunity lies. After price has coiled in a tight range and volume has dried up, the eventual expansion of volume and price is one of the most reliable setups in trading.</p><h3>What a quality breakout looks like</h3><ul><li>Price approaches the upper boundary that has held multiple times</li><li>Volume begins to increase as the level is tested</li><li>Price breaks through cleanly — not just a wick poke</li><li>Volume expands significantly on the break</li><li>The candle that breaks out has a strong close — not a close back inside the range</li></ul><h3>The failed breakout</h3><p>Price breaks above resistance, attracts buyers who chase the breakout, then immediately reverses back into the range. This is a bull trap. It's why volume confirmation is non-negotiable.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The best breakouts make you feel like you're chasing. By the time the candle closes above resistance on high volume and you're convinced it's real, the stock has already moved 1-2%. That's okay. The entry that feels safe and obvious is usually the entry that's actually late.</p></div>`},
'b8-0':{title:'Types of Gaps',content:`<p>A gap is an area on the chart where no trading occurred — price jumped from one level to another without any transactions in between. Gaps represent a significant imbalance between buyers and sellers.</p><h3>Common Gap</h3><p>A small gap with no particular significance. These gaps fill quickly and frequently. Low trading value.</p><h3>Breakaway Gap</h3><p>Occurs at the breakout of a significant pattern. High volume, significant news or catalyst. This type of gap signals the beginning of a new trend. Breakaway gaps rarely fill quickly — the move has conviction behind it.</p><h3>Runaway Gap (Continuation Gap)</h3><p>Occurs in the middle of a strong trend. Signals that momentum is accelerating and institutional participation is increasing.</p><h3>Exhaustion Gap</h3><p>Occurs near the end of a strong trend — often on very high volume after a prolonged move. The gap looks like the trend is accelerating but it's actually the final wave before exhaustion. These gaps fill relatively quickly.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The type of gap matters enormously. A gap up on earnings after a stock that's been building a solid base for months is a breakaway gap — don't fade it. A gap up after a stock has already run 40% in a week on massive volume is an exhaustion gap — don't chase it. Context, context, context.</p></div>`},
'b8-1':{title:'Gap Fills',content:`<p>A gap fill occurs when price returns to the level where the gap began — essentially closing the open space left on the chart.</p><h3>Gaps that fill quickly</h3><ul><li>Common gaps — no real catalyst, fill within a day or two</li><li>Exhaustion gaps — the trend is ending, price reverses to fill the gap</li><li>Gap downs on weak catalysts — buyers step in quickly</li></ul><h3>Gaps that take time or don't fill</h3><ul><li>Breakaway gaps on strong catalysts — strong earnings beat, major contract, FDA approval</li><li>Runaway gaps in strong sector trends — the gap is a symptom of something larger</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>Stop trying to fade every gap. A stock that gaps up 15% on a massive earnings beat is not necessarily going to fill that gap today, this week, or this month. Before you fade any gap ask yourself — is this catalyst strong enough to justify the gap? If yes, respect the move. If no, the fill trade has merit.</p></div>`},
'b8-2':{title:'Trading Gaps',content:`<p>Gaps create some of the most consistent and high probability trade setups available.</p><h3>Gap and Go</h3><p>A stock gaps up significantly on news or earnings. The setup is to buy the early consolidation after the initial gap move with a tight stop below the consolidation low. Target is measured by the pre-market high or prior resistance levels. Most applicable to: Strong earnings beats, major catalysts, stocks with high relative volume.</p><h3>Gap Fill Trade</h3><p>Buying a gap down or shorting a gap up expecting price to return to the prior close. Best applied to small gaps under 3% on weak or no catalysts.</p><h3>Gap as Support/Resistance</h3><p>After a gap up, the bottom of the gap frequently acts as support on any pullback. After a gap down, the top of the gap acts as resistance on any bounce. These levels are clean, obvious, and widely watched.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The gap and go requires discipline — you must wait for the early consolidation. Buying immediately at the open of a gapping stock without any consolidation is chasing, not trading.</p></div>`},
'b9-0':{title:'Reading Level 2',content:`<p>Level 2 is a display of all the current bids and offers for a stock — showing you not just the best price but the depth of the order book.</p><h3>The components of Level 2</h3><ul><li><strong>Bid side</strong> — all buyers, organized from highest price to lowest.</li><li><strong>Ask side</strong> — all sellers, organized from lowest price to highest.</li><li><strong>Size</strong> — the number of shares at each price level.</li></ul><h3>What Level 2 tells you</h3><p>Where the walls are — large blocks of shares at a specific price create temporary support or resistance. A seller with 50,000 shares at $50.00 is a wall — price will struggle to push through until that seller is absorbed or moves their order.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Level 2 is a tool for experienced traders — beginners often overthink it. The most important thing to watch is whether bids or asks are dominating. Are buyers aggressive and refreshing their bids? Or are sellers stepping in front of every uptick?</p></div>`},
'b9-1':{title:'Reading the Tape',content:`<p>The tape — also called time and sales — is a real time record of every transaction that occurs in a stock.</p><ul><li><strong>Green prints</strong> — trades that executed at the ask price. Buyers were aggressive.</li><li><strong>Red prints</strong> — trades that executed at the bid price. Sellers were aggressive.</li><li><strong>Large prints</strong> — big blocks of shares trading at once. Institutional activity.</li></ul><h3>Tape speed</h3><p>Fast tape with many prints — high activity, strong momentum. Slow tape with few prints — low interest, little conviction. The move may stall.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The tape tells the truth when the chart might lie. A chart can show a breakout that looks clean — but if the tape is showing nothing but red prints and sellers hitting bids on every uptick, that breakout is not what it appears. Learn to read it and you'll have an edge that most retail traders simply don't have.</p></div>`},
'b9-2':{title:'Spotting Buyers & Sellers',content:`<p>The ultimate goal of reading Level 2 and the tape is to identify who is in control — buyers or sellers — in real time.</p><h3>Signs of aggressive buying</h3><ul><li>Bids stacking up and refreshing quickly after being hit</li><li>Large green prints repeatedly lifting the ask</li><li>Price stepping up in an orderly staircase pattern</li><li>Ask side thinning out — sellers are being absorbed</li></ul><h3>Signs of aggressive selling</h3><ul><li>Asks refreshing quickly after being hit</li><li>Large red prints hitting bids repeatedly</li><li>Price stepping down in an orderly pattern</li><li>Bid side thinning out</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>The best trades are the ones where everything lines up — the chart pattern is clean, the tape shows buyers are aggressive, and Level 2 shows no significant walls above. When all three align it's not just a setup — it's a conviction trade. Those are the ones you size up on.</p></div>`},
'b10-0':{title:'How to Properly Use Indicators',content:`<p>Indicators are mathematical calculations derived from price and volume data. They are tools — not signals. This distinction is critical.</p><p>The biggest mistake beginners make is treating indicators as signals — "the RSI crossed above 30 so I buy." This approach ignores everything else happening in the market.</p><h3>Indicator lag</h3><p>All indicators are lagging — they're derived from past price data. They can never predict the future. They can only describe what has already happened and give you probabilistic insight into what might happen next.</p><h3>Too many indicators</h3><p>A chart covered in 10 different indicators is not a sophisticated chart — it's a confused one. Pick 2-3 indicators that complement each other and master them.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Price action is king. Indicators are servants. If a stock is clearly in an uptrend with strong volume and clean structure, an oversold RSI reading doesn't mean sell. Always start with price. Always.</p></div>`},
'b10-1':{title:'Moving Averages',content:`<p>A moving average smooths out price data over a specific period to show the average price over that time. It's the most widely used indicator in the world.</p><h3>The most important moving averages</h3><ul><li><strong>9 EMA</strong> — short term trend, used by active day and swing traders</li><li><strong>20 SMA</strong> — intermediate trend, acts as dynamic support in uptrending stocks</li><li><strong>50 SMA</strong> — medium term trend, watched by institutional traders</li><li><strong>200 SMA</strong> — long term trend, one of the most watched levels in all of finance</li></ul><h3>How to use them</h3><p>Moving averages act as dynamic support and resistance. In an uptrend, pullbacks to the 20 SMA that hold are buying opportunities. In a downtrend, bounces to the 20 SMA that fail are shorting opportunities.</p><p>Moving average crossovers — when a shorter term average crosses above a longer term average (golden cross) it signals potential bullish momentum. When it crosses below (death cross) it signals potential bearish momentum.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The 20 SMA and 50 SMA on the daily chart are your most important levels as a swing trader. When a stock that's been in a strong uptrend pulls back to its 20 SMA and holds — that's institutional buying. Those levels are watched by the biggest money in the market.</p></div>`},
'b10-2':{title:'RSI',content:`<p>The Relative Strength Index (RSI) is a momentum oscillator that measures the speed and magnitude of recent price changes. It ranges from 0 to 100.</p><ul><li><strong>RSI above 70</strong> — generally considered overbought.</li><li><strong>RSI below 30</strong> — generally considered oversold.</li><li><strong>RSI at 50</strong> — above 50 suggests bullish momentum, below 50 suggests bearish momentum.</li></ul><h3>The correct use of RSI</h3><p><strong>Divergence</strong> — the most powerful RSI signal. Bullish divergence occurs when price makes a lower low but RSI makes a higher low. This means the selling is losing momentum even though price is still declining.</p><p><strong>Trend confirmation</strong> — RSI staying above 50 in an uptrend confirms momentum. RSI breaking below 50 is an early warning sign.</p><div class="callout"><div class="callout-label">TST Edge</div><p>RSI divergence is worth understanding deeply. When a stock is making new lows but RSI is making higher lows — sellers are exhausted. They're pushing price down but doing it with less and less force each time. Price action at support plus RSI divergence is one of the most reliable reversal signals available.</p></div>`},
'b10-3':{title:'MACD',content:`<p>The MACD (Moving Average Convergence Divergence) is a trend-following momentum indicator that shows the relationship between two moving averages — typically the 12 and 26 period EMAs.</p><h3>The components</h3><ul><li><strong>MACD line</strong> — the difference between the 12 EMA and 26 EMA</li><li><strong>Signal line</strong> — a 9 period EMA of the MACD line</li><li><strong>Histogram</strong> — the difference between the MACD line and signal line</li></ul><h3>What MACD tells you</h3><ul><li>MACD line crosses above signal line — bullish signal</li><li>MACD line crosses below signal line — bearish signal</li><li>Both lines above zero — trend is bullish</li><li>Both lines below zero — trend is bearish</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>The MACD is most useful on daily charts for swing traders. On 1 and 5 minute charts it lags too much to be actionable for most setups. Use it to understand the broader momentum picture — is momentum building or fading?</p></div>`},
'b10-4':{title:'VWAP',content:`<p>VWAP — Volume Weighted Average Price — is the average price a stock has traded at throughout the day, weighted by volume. It is arguably the most important indicator for day traders.</p><h3>Why VWAP matters</h3><p>Institutions use VWAP as a benchmark. When they're buying a large position throughout the day they aim to buy near or below VWAP. This creates predictable behavior around the VWAP level.</p><ul><li><strong>Price above VWAP</strong> — buyers are in control. Bullish bias.</li><li><strong>Price below VWAP</strong> — sellers are in control. Bearish bias.</li></ul><h3>Reclaiming VWAP</h3><p>When a stock that's been below VWAP reclaims it and holds above — this is a significant shift. This is a high probability long setup with a stop below VWAP.</p><div class="callout"><div class="callout-label">TST Edge</div><p>VWAP is non-negotiable for day traders. If you don't have it on your chart you're trading blind. It resets every day at the open and represents the true fair value of the stock for that trading session.</p></div>`},
'b10-5':{title:'Volume Profile',content:`<p>Volume Profile displays the total volume traded at each price level over a specific time period — shown as horizontal bars on the chart. Unlike traditional volume indicators that show volume per time period, Volume Profile shows volume per price level.</p><h3>Key components</h3><ul><li><strong>Point of Control (POC)</strong> — the price level with the highest volume over the selected period. Price frequently returns to it and uses it as support or resistance.</li><li><strong>Value Area</strong> — the range of prices where approximately 70% of all volume traded.</li><li><strong>High Volume Nodes (HVN)</strong> — areas of high trading activity. Price tends to slow down and consolidate here.</li><li><strong>Low Volume Nodes (LVN)</strong> — areas of thin trading activity. Price tends to move through LVNs quickly.</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>Volume Profile takes time to master but it's worth the investment. When you combine Volume Profile with traditional support and resistance levels — and both align at the same price — you have institutional-grade confirmation.</p></div>`},
'b10-6':{title:'Fibonacci Retracement',content:`<p>Fibonacci retracement identifies potential support and resistance levels based on the Fibonacci sequence. The key ratios — 23.6%, 38.2%, 50%, 61.8%, and 78.6% — appear with remarkable consistency in financial markets.</p><h3>The key levels</h3><ul><li><strong>38.2%</strong> — shallow pullback. Strong trend. Buyers stepping in early.</li><li><strong>50%</strong> — the midpoint of the move. Very commonly watched.</li><li><strong>61.8%</strong> — the golden ratio. The most significant Fibonacci level. Strong reactions frequently occur here.</li><li><strong>78.6%</strong> — deeper pullback. Getting close to invalidating the trend.</li></ul><h3>Confluence</h3><p>Fibonacci levels become most powerful when they align with other forms of support and resistance — a prior high, a moving average, a VWAP level, or a high volume node.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The 61.8% Fibonacci retracement is the level worth memorizing. When a stock makes a strong move up, pulls back, and holds exactly at the 61.8% retracement — that's where buyers see value. Combine it with a volume dry up and a bullish candlestick pattern and you have one of the highest probability entry setups in all of technical analysis.</p></div>`},
'b11-0':{title:'Cash Account Rules',content:`<p>A cash account is the simplest type of brokerage account — you can only trade with money you actually have deposited. You cannot borrow from your broker.</p><h3>How a cash account works</h3><p>You deposit $10,000. You can trade up to $10,000 worth of stock. When you sell a position, the cash takes two business days to settle — T+2 settlement.</p><h3>Good Faith Violation</h3><p>If you buy a stock using unsettled funds and then sell that stock before the original funds settle — that's a Good Faith Violation. Three GFVs in a 12 month period will restrict your account to settled cash only for 90 days.</p><h3>Advantages</h3><ul><li>No PDT rule — you can day trade as many times as you want as long as you have settled cash</li><li>No margin calls — you can never lose more than you deposited</li><li>Simpler risk management — you're forced to trade within your means</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>Many beginners rush to open margin accounts because they want more buying power. The reality is that the best traders could trade with a cash account and still make exceptional returns. Mastering your craft in a cash account before adding leverage is the safer and smarter path.</p></div>`},
'b11-1':{title:'Margin Account Rules',content:`<p>A margin account allows you to borrow money from your broker to purchase securities — effectively giving you more buying power than your actual cash balance. This amplifies both gains and losses.</p><h3>Margin calls</h3><p>If your account value drops below the broker's minimum margin requirement (usually 25-30% of the position value), you receive a margin call — a demand to deposit additional funds or close positions immediately. Margin calls can force you to sell positions at the worst possible time.</p><h3>Overnight vs intraday margin</h3><p>Many brokers offer higher intraday margin — sometimes 4:1 — for day trades closed before market close. Overnight margin is typically 2:1. Holding a leveraged intraday position overnight triggers a margin call if you don't have enough equity.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Margin is the fastest way to both accelerate gains and blow up an account. Learn to trade profitably without leverage first. Add margin only when you have a proven track record and a real understanding of risk management.</p></div>`},
'b11-2':{title:'The PDT Rule Explained',content:`<p>The Pattern Day Trader (PDT) rule is one of the most discussed and most misunderstood regulations in retail trading.</p><h3>What is the PDT rule</h3><p>If you execute four or more day trades within a five business day rolling period in a margin account with less than $25,000, you are flagged as a Pattern Day Trader. Once flagged, you must maintain a minimum balance of $25,000 at all times to continue day trading.</p><h3>How to work around the PDT rule if you have under $25,000</h3><ul><li>Use a cash account — PDT does not apply to cash accounts</li><li>Focus on swing trades — hold positions overnight and avoid same-day closes</li><li>Be selective — you have 3 day trades per 5 days in a margin account under $25k, use them wisely</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>The $25,000 threshold is not arbitrary — it's the SEC's way of ensuring that people who are actively day trading have sufficient capital to absorb losses. If you're under $25,000, treat the PDT rule as a risk management tool, not just a legal restriction.</p></div>`},
'b12-0':{title:'Going Long',content:`<p>Going long means buying a security with the expectation that its price will rise. When you go long, you profit when the price goes up and lose when the price goes down.</p><h3>When to go long</h3><ul><li>Stock is in an uptrend — higher highs and higher lows on the relevant timeframe</li><li>Price is at or near a key support level with a defined stop below it</li><li>Volume is confirming the move — buyers are participating</li><li>The overall market is in your favor</li></ul><h3>Position sizing</h3><ul><li>Determine your stop level first — where are you wrong on this trade?</li><li>Calculate the dollar risk per share — entry price minus stop price</li><li>Divide your maximum dollar risk per trade (1-2% of account) by the dollar risk per share</li><li>That gives you your position size</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>Most beginners go long on everything — they only know how to make money when stocks go up. This is a significant limitation. Markets spend roughly 30% of their time in downtrends. Traders who can only go long are sitting on the sidelines during those periods. Expand your toolkit.</p></div>`},
'b12-1':{title:'Going Short',content:`<p>Going short means selling shares you don't own — borrowing them from your broker — with the expectation that the price will fall, allowing you to buy them back at a lower price and pocket the difference.</p><h3>The risks unique to shorting</h3><ul><li><strong>Unlimited loss potential</strong> — when you buy a stock it can only go to zero. When you short a stock it can theoretically go to infinity.</li><li><strong>Short squeezes</strong> — when a heavily shorted stock rises, short sellers are forced to buy to cover, which drives the price up further.</li><li><strong>Borrow fees</strong> — you pay to borrow the shares you're shorting. Hard to borrow stocks can carry extremely high borrow fees.</li></ul><h3>When to go short</h3><ul><li>Stock is in a clear downtrend — lower highs and lower lows</li><li>Price is at or near a key resistance level with a defined stop above it</li><li>Volume is confirming selling pressure</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>Short selling requires more discipline and faster execution than going long. The market falls faster than it rises. Your stops must be tight and your conviction must be high.</p></div>`},
'b12-2':{title:'Short Selling Mechanics',content:`<p>Understanding the mechanical process of short selling is essential before you place your first short trade.</p><h3>How to short sell</h3><p>In your brokerage platform, instead of clicking "Buy" you click "Sell Short." The broker locates shares to borrow from their inventory or from other clients' accounts and executes the short sale.</p><h3>Hard to borrow stocks</h3><p>When short interest is very high, available shares become scarce. Brokers mark these stocks as "HTB" — hard to borrow. They charge a daily borrow fee to maintain the short position. Check the borrow fee before shorting any stock with high short interest.</p><h3>Covering your short</h3><p>To close a short position you "buy to cover" — buying the shares you previously sold short and returning them to the lender. Your profit or loss is the difference between your short sale price and your cover price.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Before you short any stock, know your borrow fee and your broker's locate availability. Have a backup broker with better locate availability for active short selling. The setup means nothing if you can't execute.</p></div>`},
'b13-0':{title:'Market Orders',content:`<p>A market order is an instruction to buy or sell a security immediately at the best available current price. It guarantees execution but does not guarantee price.</p><h3>When market orders make sense</h3><ul><li>When you need to exit a position immediately — stop loss situations, unexpected news events</li><li>When you're trading highly liquid stocks with tight bid/ask spreads</li><li>When speed is more important than precision</li></ul><h3>When market orders are dangerous</h3><ul><li>In pre-market or after-hours trading — spreads can be extremely wide</li><li>In illiquid stocks — the bid/ask spread can be large and your market order can move the price significantly against you</li><li>During fast moving markets</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>Never use a market order on a thinly traded stock. The spread alone can be 2-5% of the stock's price, and your market order will immediately put you at a significant loss. Always use limit orders on small cap stocks.</p></div>`},
'b13-1':{title:'Limit Orders',content:`<p>A limit order is an instruction to buy or sell a security at a specific price or better. A limit order guarantees price but does not guarantee execution.</p><ul><li><strong>Buy limit order:</strong> Executes at your specified price or lower.</li><li><strong>Sell limit order:</strong> Executes at your specified price or higher.</li></ul><h3>Advantages</h3><ul><li>Price control — you know exactly what you'll pay or receive</li><li>No slippage — your fill is at your price or better</li><li>Forces discipline — you set your entry price before the trade, not in the heat of the moment</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>Get in the habit of using limit orders for entries. It forces you to identify your entry price before the trade is live — which means you've thought about it calmly rather than reacting emotionally.</p></div>`},
'b13-2':{title:'Stop Orders',content:`<p>A stop order is an instruction to buy or sell a security once it reaches a specified price. Once the stop price is reached, the stop order becomes a market order.</p><h3>Stop placement</h3><p>Stops should be placed at technically significant levels — below support for longs, above resistance for shorts. Place stops where the thesis is invalidated — where if price reaches that level, you're wrong.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The hardest part of using stop losses is not placing them — it's not moving them. The moment you move your stop further away because the stock is close to hitting it, you've abandoned your plan and are now hoping. Honor your stops every single time.</p></div>`},
'b13-3':{title:'Stop Limit Orders',content:`<p>A stop limit order combines features of both stop orders and limit orders. It has two prices — the stop price and the limit price. When the stop price is reached, instead of becoming a market order it becomes a limit order at the specified limit price.</p><h3>The risk of stop limit orders</h3><p>If the stock gaps down or moves rapidly through your limit price, your order may not execute. You wanted to exit at $47.50 but the stock opens at $45 the next day after bad news — your limit order never fills and you're still holding a losing position.</p><div class="callout"><div class="callout-label">TST Edge</div><p>For most active traders, a plain stop loss (stop market) is safer than a stop limit. The risk of not getting filled — of your stop limit sitting there while the stock crashes through it — is worse than the slippage risk of a market stop.</p></div>`},
'b13-4':{title:'Trailing Stops',content:`<p>A trailing stop is a dynamic stop loss that moves automatically as price moves in your favor — but never moves against you. It trails the price at a specified distance, locking in profits as the trade moves in your direction.</p><h3>How it works</h3><p>You buy a stock at $50 and set a trailing stop of $2. Your initial stop is at $48. The stock rises to $55 — your trailing stop automatically moves to $53. The stock continues to $60 — your stop is now at $58. If the stock then drops from $60 to $58, your stop triggers and you exit at $58 — locking in an $8 profit. You never had to manually adjust the stop.</p><h3>Types of trailing stops</h3><ul><li>Fixed dollar amount — trails by a specific dollar amount</li><li>Fixed percentage — trails by a percentage of current price</li><li>ATR-based — trails by a multiple of the Average True Range</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>Trailing stops are one of the most underused tools in retail trading. The hardest part of trading isn't getting in — it's knowing when to get out of a winner. A trailing stop removes the emotional decision of when to sell and replaces it with a mechanical rule.</p></div>`},
'b14-0':{title:'Why Journaling Matters',content:`<p>A trading journal is the single most important tool for long term improvement as a trader. Not a scanner. Not an indicator. Not a chat room. A journal.</p><p>Trading is a performance skill, like athletics or music. You get better through deliberate practice and honest feedback. A journal provides that feedback. Without it, you're making the same mistakes repeatedly without realizing it.</p><h3>What traders with journals look like</h3><ul><li>They know their win rate by setup type</li><li>They know what time of day they perform best</li><li>They know which market conditions suit their style</li><li>They know their average winner and average loser</li><li>They trade with confidence because they have data to back it up</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>The journal is where losing traders become winning traders. Not by finding a new strategy — by understanding the strategy they already have deeply enough to execute it consistently.</p></div>`},
'b14-1':{title:'What to Track',content:`<p>A good trading journal tracks both the quantitative data — the numbers — and the qualitative data — the psychology. Both are essential.</p><h3>Quantitative data to track</h3><ul><li>Date and time of entry and exit</li><li>Stock ticker</li><li>Entry price, exit price, stop price</li><li>Position size (shares or contracts)</li><li>Dollar P&amp;L and percentage P&amp;L</li><li>Setup type — what pattern or setup triggered the trade</li><li>Outcome — win or loss</li></ul><h3>Qualitative data to track</h3><ul><li>Why did you take this trade?</li><li>What was the market doing?</li><li>Did you follow your plan? — yes or no, and if no, why not</li><li>Emotional state — were you calm, anxious, overconfident, hesitant?</li><li>Grade the trade — A, B, C, D based on setup quality and execution regardless of outcome</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>Grade every trade independently of its outcome. An A+ trade that lost money is still an A+ trade. A D trade that made money is still a D trade — you got lucky and luck runs out. Focus on executing quality and the profits will follow.</p></div>`},
'b14-2':{title:'Reviewing Your Journal',content:`<p>Taking the time to record trades is only half the value of a trading journal. The other half — arguably the more important half — is the review process.</p><h3>Daily review</h3><p>At the end of each trading day — after the market closes — review every trade from that day. Did the trade play out how you expected? If you lost, was it because the setup failed or because you didn't execute the plan?</p><h3>Weekly review</h3><p>Every weekend, pull up the week's trades and look for patterns. Which setups worked? Which didn't? Did you trade better in the morning or afternoon?</p><h3>Monthly review</h3><p>Once a month, do a deeper analysis. Calculate your win rate, average winner, average loser, and profit factor. Identify the two or three setups that produced the majority of your profits. Identify the one or two behaviors that produced the majority of your losses.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The most common pattern you'll find in your journal after three months — a small number of setups account for the majority of your profits, and a small number of behavioral mistakes account for the majority of your losses. Your job is to do more of what already works and stop doing what doesn't.</p></div>`}

'b1-0':{name:'What Are Candlesticks?',html:`<p>Let's keep this simple. A candlestick is just a picture of what price did during a certain time. It could be 1 minute, 5 minutes, 1 hour, daily, weekly, etc. Each candle tells you 4 things: Open (where price started), Close (where price ended), High (highest price the candle went to), and Low (lowest price the candle went to).</p><ul><li><strong>Body</strong> — the thick part of the candle. Represents the range between the open and close.</li><li><strong>Wick</strong> — the thin lines above and below the body. Represent the highest and lowest price reached during that period.</li><li><strong>Green candle</strong> — close was higher than the open. Buyers were in control.</li><li><strong>Red candle</strong> — close was lower than the open. Sellers were in control.</li></ul><p>A candle with a large body and small wicks tells you one side was dominant. A candle with a small body and large wicks tells you there was a battle — price moved significantly in both directions but neither side won decisively.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Don't just look at the color of the candle. Look at the size of the body relative to the wicks. A small green candle with a massive upper wick is not a bullish candle — it's a candle that tried to go up, got rejected hard, and barely closed above the open. Context matters more than color.</p></div>`},
'b1-1':{name:'Bullish Patterns',html:`<p>Bullish candlestick patterns signal that buyers are taking control. They don't guarantee a move up — they indicate a shift in momentum or a potential reversal that deserves attention.</p><div class="pblock"><div class="pname bull">Hammer</div><div class="chart-box"><svg width="100%" viewBox="0 0 680 240" role="img"><title>Hammer</title><desc>Downtrend followed by hammer at support then reversal</desc><line x1="40" y1="200" x2="640" y2="200" stroke="#1e2330" stroke-width="1" stroke-dasharray="5 4"/><text font-family="DM Sans,sans-serif" font-size="11" fill="#3a4455" x="44" y="218">Key Support</text><line x1="100" y1="55" x2="100" y2="178" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="83" y="72" width="34" height="88" rx="3" fill="#e05c5c"/><line x1="200" y1="78" x2="200" y2="188" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="183" y="98" width="34" height="74" rx="3" fill="#e05c5c"/><line x1="300" y1="108" x2="300" y2="196" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="283" y="128" width="34" height="60" rx="3" fill="#e05c5c"/><line x1="400" y1="160" x2="400" y2="172" stroke="#00d27a" stroke-width="2.5" stroke-linecap="round"/><rect x="383" y="172" width="34" height="24" rx="3" fill="#00d27a" stroke="#009955" stroke-width="2"/><line x1="400" y1="196" x2="400" y2="238" stroke="#00d27a" stroke-width="2.5" stroke-linecap="round"/><rect x="375" y="150" width="50" height="100" rx="8" fill="none" stroke="rgba(0,210,122,0.35)" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="500" y1="95" x2="500" y2="188" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="483" y="106" width="34" height="72" rx="3" fill="#00d27a"/><text font-family="DM Sans,sans-serif" font-size="11" fill="#00d27a" x="378" y="144">Hammer</text><text font-family="DM Sans,sans-serif" font-size="11" fill="#6b7280" x="545" y="92">Reversal</text></svg></div><p>A small body near the top of the candle with a long lower wick. Signals that sellers pushed price down significantly but buyers stepped in and drove it back up. Strong sign of buying pressure when it appears at a key support level.</p></div><div class="pblock"><div class="pname bull">Bullish Engulfing</div><div class="chart-box"><svg width="100%" viewBox="0 0 680 240" role="img"><title>Bullish Engulfing</title><desc>Large green candle engulfs prior red candle</desc><line x1="40" y1="208" x2="640" y2="208" stroke="#1e2330" stroke-width="1" stroke-dasharray="5 4"/><line x1="80" y1="52" x2="80" y2="175" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="63" y="70" width="34" height="90" rx="3" fill="#e05c5c"/><line x1="180" y1="78" x2="180" y2="190" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="163" y="98" width="34" height="78" rx="3" fill="#e05c5c"/><line x1="300" y1="118" x2="300" y2="200" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="283" y="135" width="34" height="55" rx="3" fill="#e05c5c" stroke="#b84040" stroke-width="1.5"/><line x1="400" y1="88" x2="400" y2="208" stroke="#00d27a" stroke-width="2.5" stroke-linecap="round"/><rect x="383" y="100" width="34" height="100" rx="3" fill="#00d27a" stroke="#009955" stroke-width="2"/><rect x="274" y="84" width="169" height="134" rx="8" fill="none" stroke="rgba(0,210,122,0.35)" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="500" y1="68" x2="500" y2="175" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="483" y="80" width="34" height="82" rx="3" fill="#00d27a"/><line x1="590" y1="45" x2="590" y2="150" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="573" y="56" width="34" height="78" rx="3" fill="#00d27a"/><text font-family="DM Sans,sans-serif" font-size="11" fill="#e05c5c" x="278" y="118">Prior red candle</text><text font-family="DM Sans,sans-serif" font-size="11" fill="#00d27a" x="384" y="84">Engulfs it completely</text></svg></div><p>A large green candle that completely engulfs the prior red candle's body. Signals that buyers overwhelmed sellers and took complete control. More powerful when it occurs after a downtrend or at a key support zone.</p></div><div class="pblock"><div class="pname bull">Morning Star</div><div class="chart-box"><svg width="100%" viewBox="0 0 680 240" role="img"><title>Morning Star</title><desc>Three candle bullish reversal pattern</desc><line x1="40" y1="210" x2="640" y2="210" stroke="#1e2330" stroke-width="1" stroke-dasharray="5 4"/><text font-family="DM Sans,sans-serif" font-size="11" fill="#3a4455" x="44" y="228">Support</text><line x1="60" y1="52" x2="60" y2="168" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="44" y="68" width="32" height="88" rx="3" fill="#e05c5c"/><line x1="140" y1="78" x2="140" y2="188" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="124" y="95" width="32" height="78" rx="3" fill="#e05c5c"/><line x1="240" y1="65" x2="240" y2="185" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="224" y="82" width="32" height="92" rx="3" fill="#e05c5c" stroke="#b84040" stroke-width="2"/><line x1="330" y1="190" x2="330" y2="198" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/><rect x="316" y="198" width="28" height="12" rx="3" fill="#f59e0b"/><line x1="330" y1="210" x2="330" y2="218" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/><line x1="430" y1="58" x2="430" y2="185" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="414" y="72" width="32" height="104" rx="3" fill="#00d27a" stroke="#009955" stroke-width="2"/><rect x="214" y="54" width="242" height="172" rx="8" fill="none" stroke="rgba(0,210,122,0.35)" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="520" y1="40" x2="520" y2="148" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="504" y="50" width="32" height="86" rx="3" fill="#00d27a"/><text font-family="DM Sans,sans-serif" font-size="11" fill="#e05c5c" x="218" y="48">Large red</text><text font-family="DM Sans,sans-serif" font-size="11" fill="#f59e0b" x="306" y="182">Star</text><text font-family="DM Sans,sans-serif" font-size="11" fill="#00d27a" x="414" y="52">Large green</text></svg></div><p>A three candle pattern — large red candle, small indecision candle, large green candle. Signals a transition from seller control to buyer control. One of the more reliable reversal patterns when found at support.</p></div><div class="pblock"><div class="pname bull">Marubozu</div><div class="chart-box"><svg width="100%" viewBox="0 0 680 240" role="img"><title>Marubozu</title><desc>Full green body no wicks showing complete buyer control</desc><line x1="80" y1="118" x2="80" y2="205" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="63" y="130" width="34" height="62" rx="3" fill="#e05c5c"/><line x1="180" y1="98" x2="180" y2="200" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="163" y="112" width="34" height="75" rx="3" fill="#e05c5c"/><rect x="283" y="52" width="34" height="148" rx="3" fill="#00d27a" stroke="#009955" stroke-width="2.5"/><rect x="273" y="42" width="54" height="168" rx="8" fill="none" stroke="rgba(0,210,122,0.35)" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="420" y1="28" x2="420" y2="132" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="403" y="38" width="34" height="82" rx="3" fill="#00d27a"/><line x1="520" y1="12" x2="520" y2="105" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="503" y="22" width="34" height="72" rx="3" fill="#00d27a"/><text font-family="DM Sans,sans-serif" font-size="11" fill="#00d27a" x="338" y="36">No wicks at all</text><text font-family="DM Sans,sans-serif" font-size="11" fill="#6b7280" x="338" y="200">Open to close — pure body</text></svg></div><p>A candle with no wicks — pure body from open to close. Signals complete dominance by buyers. A green Marubozu means buyers controlled every second of that period. Extremely strong signal of momentum.</p></div><div class="callout"><div class="callout-label">TST Edge</div><p>Bullish candle patterns are meaningless without context. A hammer at a key support level with high volume behind it is a high quality signal. A hammer in the middle of a range with no volume is noise. Always ask — where is this pattern occurring and what is the volume doing?</p></div>`},
'b1-2':{name:'Bearish Patterns',html:`<p>Bearish candlestick patterns signal that sellers are taking control. Like bullish patterns they are most powerful when they appear at key resistance levels with volume confirmation.</p><div class="pblock"><div class="pname bear">Shooting Star</div><div class="chart-box"><svg width="100%" viewBox="0 0 680 240" role="img"><title>Shooting Star</title><desc>Uptrend to resistance then shooting star rejection</desc><line x1="40" y1="62" x2="640" y2="62" stroke="#1e2330" stroke-width="1" stroke-dasharray="5 4"/><text font-family="DM Sans,sans-serif" font-size="11" fill="#3a4455" x="44" y="54">Resistance</text><line x1="80" y1="162" x2="80" y2="225" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="63" y="172" width="34" height="42" rx="3" fill="#00d27a"/><line x1="180" y1="132" x2="180" y2="215" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="163" y="142" width="34" height="62" rx="3" fill="#00d27a"/><line x1="280" y1="105" x2="280" y2="192" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="263" y="115" width="34" height="66" rx="3" fill="#00d27a"/><line x1="390" y1="22" x2="390" y2="170" stroke="#e05c5c" stroke-width="2.5" stroke-linecap="round"/><rect x="373" y="170" width="34" height="22" rx="3" fill="#e05c5c" stroke="#b84040" stroke-width="2"/><line x1="390" y1="192" x2="390" y2="205" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="363" y="12" width="54" height="203" rx="8" fill="none" stroke="rgba(224,92,92,0.35)" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="490" y1="112" x2="490" y2="210" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="473" y="125" width="34" height="72" rx="3" fill="#e05c5c"/><line x1="590" y1="138" x2="590" y2="220" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="573" y="150" width="34" height="60" rx="3" fill="#e05c5c"/><text font-family="DM Sans,sans-serif" font-size="11" fill="#e05c5c" x="363" y="8">Shooting Star</text><text font-family="DM Sans,sans-serif" font-size="11" fill="#6b7280" x="428" y="40">Long upper wick = rejected</text></svg></div><p>The mirror image of the hammer — small body near the bottom of the candle with a long upper wick. Signals that buyers drove price up significantly but sellers stepped in and drove it back down. Strong rejection signal when it appears at resistance.</p></div><div class="pblock"><div class="pname bear">Bearish Engulfing</div><div class="chart-box"><svg width="100%" viewBox="0 0 680 240" role="img"><title>Bearish Engulfing</title><desc>Large red candle engulfs prior green candle at resistance</desc><line x1="40" y1="58" x2="640" y2="58" stroke="#1e2330" stroke-width="1" stroke-dasharray="5 4"/><text font-family="DM Sans,sans-serif" font-size="11" fill="#3a4455" x="44" y="50">Resistance</text><line x1="80" y1="155" x2="80" y2="225" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="63" y="165" width="34" height="50" rx="3" fill="#00d27a"/><line x1="180" y1="122" x2="180" y2="210" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="163" y="132" width="34" height="68" rx="3" fill="#00d27a"/><line x1="295" y1="100" x2="295" y2="190" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="278" y="112" width="34" height="66" rx="3" fill="#00d27a" stroke="#009955" stroke-width="1.5"/><line x1="400" y1="65" x2="400" y2="208" stroke="#e05c5c" stroke-width="2.5" stroke-linecap="round"/><rect x="383" y="75" width="34" height="124" rx="3" fill="#e05c5c" stroke="#b84040" stroke-width="2"/><rect x="268" y="62" width="179" height="156" rx="8" fill="none" stroke="rgba(224,92,92,0.35)" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="500" y1="118" x2="500" y2="215" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="483" y="130" width="34" height="72" rx="3" fill="#e05c5c"/><line x1="600" y1="145" x2="600" y2="225" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="583" y="155" width="34" height="60" rx="3" fill="#e05c5c"/><text font-family="DM Sans,sans-serif" font-size="11" fill="#00d27a" x="272" y="98">Prior green</text><text font-family="DM Sans,sans-serif" font-size="11" fill="#e05c5c" x="428" y="72">Engulfs it completely</text></svg></div><p>A large red candle that completely engulfs the prior green candle's body. Signals that sellers overwhelmed buyers entirely. Most powerful when occurring after an uptrend or at a key resistance zone.</p></div><div class="pblock"><div class="pname bear">Evening Star</div><div class="chart-box"><svg width="100%" viewBox="0 0 680 240" role="img"><title>Evening Star</title><desc>Three candle bearish reversal at resistance</desc><line x1="40" y1="58" x2="640" y2="58" stroke="#1e2330" stroke-width="1" stroke-dasharray="5 4"/><text font-family="DM Sans,sans-serif" font-size="11" fill="#3a4455" x="44" y="50">Resistance</text><line x1="60" y1="148" x2="60" y2="220" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="44" y="158" width="32" height="52" rx="3" fill="#00d27a"/><line x1="148" y1="115" x2="148" y2="208" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="132" y="126" width="32" height="72" rx="3" fill="#00d27a"/><line x1="255" y1="65" x2="255" y2="182" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="239" y="75" width="32" height="96" rx="3" fill="#00d27a" stroke="#009955" stroke-width="2"/><line x1="348" y1="46" x2="348" y2="58" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/><rect x="334" y="58" width="28" height="12" rx="3" fill="#f59e0b"/><line x1="348" y1="70" x2="348" y2="82" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/><line x1="448" y1="65" x2="448" y2="188" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="432" y="75" width="32" height="104" rx="3" fill="#e05c5c" stroke="#b84040" stroke-width="2"/><rect x="229" y="36" width="255" height="156" rx="8" fill="none" stroke="rgba(224,92,92,0.35)" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="545" y1="122" x2="545" y2="218" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="529" y="132" width="32" height="76" rx="3" fill="#e05c5c"/><text font-family="DM Sans,sans-serif" font-size="11" fill="#00d27a" x="233" y="58">Large green</text><text font-family="DM Sans,sans-serif" font-size="11" fill="#f59e0b" x="324" y="40">Star</text><text font-family="DM Sans,sans-serif" font-size="11" fill="#e05c5c" x="432" y="60">Large red</text></svg></div><p>The bearish version of the Morning Star — large green candle, small indecision candle, large red candle. Signals a transition from buyer control to seller control.</p></div><div class="callout"><div class="callout-label">TST Edge</div><p>The upper wick is one of the most important signals in all of technical analysis. When a stock repeatedly tests a level and produces long upper wicks — sellers are there. They're defending that level. Don't fight it. Either wait for a clean break with volume or use it as your target to sell into.</p></div>`},
'b1-3':{name:'Doji & Indecision Candles',html:`<p>A Doji is a candle where the open and close are virtually equal — producing a candle with a very small body or no body at all. Doji candles signal indecision in the market. Neither buyers nor sellers won that period.</p><div class="pblock"><div class="pname neut">Standard Doji</div><div class="chart-box"><svg width="100%" viewBox="0 0 680 240" role="img"><title>Standard Doji</title><desc>Uptrend followed by doji showing indecision</desc><line x1="80" y1="145" x2="80" y2="218" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="63" y="155" width="34" height="52" rx="3" fill="#00d27a"/><line x1="180" y1="112" x2="180" y2="202" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="163" y="122" width="34" height="68" rx="3" fill="#00d27a"/><line x1="280" y1="85" x2="280" y2="178" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="263" y="95" width="34" height="72" rx="3" fill="#00d27a"/><line x1="390" y1="48" x2="390" y2="125" stroke="#888780" stroke-width="2.5" stroke-linecap="round"/><rect x="373" y="125" width="34" height="5" rx="2" fill="#888780"/><line x1="390" y1="130" x2="390" y2="208" stroke="#888780" stroke-width="2.5" stroke-linecap="round"/><rect x="363" y="38" width="54" height="180" rx="8" fill="none" stroke="rgba(136,135,128,0.4)" stroke-width="1.5" stroke-dasharray="4 3"/><text font-family="DM Sans,sans-serif" font-size="11" fill="#888780" x="428" y="68">Equal wicks</text><text font-family="DM Sans,sans-serif" font-size="11" fill="#888780" x="428" y="132">Tiny body — indecision</text></svg></div><p>Equal wicks above and below a tiny body. Pure indecision. Neither side had conviction. Often signals a pause or potential reversal when found after a strong trend.</p></div><div class="pblock"><div class="pname neut">Long-Legged Doji</div><div class="chart-box"><svg width="100%" viewBox="0 0 680 240" role="img"><title>Long-Legged Doji</title><desc>Extremely long wicks showing violent price swings with no winner</desc><line x1="340" y1="14" x2="340" y2="118" stroke="#888780" stroke-width="2.5" stroke-linecap="round"/><rect x="323" y="118" width="34" height="5" rx="2" fill="#888780"/><line x1="340" y1="123" x2="340" y2="228" stroke="#888780" stroke-width="2.5" stroke-linecap="round"/><rect x="313" y="4" width="54" height="234" rx="8" fill="none" stroke="rgba(136,135,128,0.4)" stroke-width="1.5" stroke-dasharray="4 3"/><text font-family="DM Sans,sans-serif" font-size="11" fill="#888780" x="378" y="28">Buyers drove it way up</text><text font-family="DM Sans,sans-serif" font-size="11" fill="#888780" x="378" y="124">Back where it started</text><text font-family="DM Sans,sans-serif" font-size="11" fill="#888780" x="378" y="228">Sellers drove it way down</text></svg></div><p>Very long wicks above and below with a tiny body. Signals extreme indecision — price swung dramatically in both directions and ended up exactly where it started. High volatility, no winner.</p></div><div class="pblock"><div class="pname bear">Gravestone Doji</div><div class="chart-box"><svg width="100%" viewBox="0 0 680 240" role="img"><title>Gravestone Doji</title><desc>Long upper wick body at bottom bearish rejection at resistance</desc><line x1="40" y1="58" x2="640" y2="58" stroke="#1e2330" stroke-width="1" stroke-dasharray="5 4"/><text font-family="DM Sans,sans-serif" font-size="11" fill="#3a4455" x="44" y="50">Resistance</text><line x1="80" y1="152" x2="80" y2="220" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="63" y="162" width="34" height="48" rx="3" fill="#00d27a"/><line x1="180" y1="122" x2="180" y2="208" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="163" y="132" width="34" height="65" rx="3" fill="#00d27a"/><line x1="390" y1="22" x2="390" y2="200" stroke="#e05c5c" stroke-width="2.5" stroke-linecap="round"/><rect x="373" y="200" width="34" height="5" rx="2" fill="#e05c5c"/><rect x="363" y="12" width="54" height="202" rx="8" fill="none" stroke="rgba(224,92,92,0.35)" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="490" y1="112" x2="490" y2="210" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="473" y="124" width="34" height="72" rx="3" fill="#e05c5c"/><text font-family="DM Sans,sans-serif" font-size="11" fill="#e05c5c" x="363" y="8">Gravestone Doji</text><text font-family="DM Sans,sans-serif" font-size="11" fill="#6b7280" x="428" y="42">Buyers tried — sellers rejected</text><text font-family="DM Sans,sans-serif" font-size="11" fill="#6b7280" x="428" y="205">Body at the bottom</text></svg></div><p>Long upper wick, no lower wick, tiny body at the bottom. Price opened, buyers drove it up, sellers rejected it all the way back to the open. Bearish signal, especially at resistance.</p></div><div class="pblock"><div class="pname bull">Dragonfly Doji</div><div class="chart-box"><svg width="100%" viewBox="0 0 680 240" role="img"><title>Dragonfly Doji</title><desc>Long lower wick body at top bullish rejection at support</desc><line x1="40" y1="205" x2="640" y2="205" stroke="#1e2330" stroke-width="1" stroke-dasharray="5 4"/><text font-family="DM Sans,sans-serif" font-size="11" fill="#3a4455" x="44" y="223">Key Support</text><line x1="280" y1="108" x2="280" y2="198" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="263" y="120" width="34" height="68" rx="3" fill="#e05c5c"/><rect x="373" y="48" width="34" height="5" rx="2" fill="#00d27a"/><line x1="390" y1="53" x2="390" y2="228" stroke="#00d27a" stroke-width="2.5" stroke-linecap="round"/><rect x="363" y="38" width="54" height="200" rx="8" fill="none" stroke="rgba(0,210,122,0.35)" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="490" y1="28" x2="490" y2="138" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="473" y="38" width="34" height="88" rx="3" fill="#00d27a"/><text font-family="DM Sans,sans-serif" font-size="11" fill="#00d27a" x="363" y="32">Dragonfly Doji</text><text font-family="DM Sans,sans-serif" font-size="11" fill="#6b7280" x="428" y="52">Body at the top</text><text font-family="DM Sans,sans-serif" font-size="11" fill="#6b7280" x="428" y="228">Sellers tried — buyers rejected</text></svg></div><p>Long lower wick, no upper wick, tiny body at the top. Sellers drove price down, buyers rejected it all the way back to the open. Bullish signal, especially at support.</p></div><div class="pblock"><div class="pname neut">Spinning Top</div><div class="chart-box"><svg width="100%" viewBox="0 0 680 240" role="img"><title>Spinning Top</title><desc>Small body moderate wicks showing indecision after uptrend</desc><line x1="80" y1="138" x2="80" y2="215" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="63" y="148" width="34" height="56" rx="3" fill="#00d27a"/><line x1="180" y1="108" x2="180" y2="200" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="163" y="118" width="34" height="70" rx="3" fill="#00d27a"/><line x1="390" y1="55" x2="390" y2="98" stroke="#888780" stroke-width="2.5" stroke-linecap="round"/><rect x="373" y="98" width="34" height="44" rx="3" fill="#888780" stroke="#5f5e5a" stroke-width="2"/><line x1="390" y1="142" x2="390" y2="188" stroke="#888780" stroke-width="2.5" stroke-linecap="round"/><rect x="363" y="45" width="54" height="153" rx="8" fill="none" stroke="rgba(136,135,128,0.4)" stroke-width="1.5" stroke-dasharray="4 3"/><text font-family="DM Sans,sans-serif" font-size="11" fill="#888780" x="428" y="72">Small body</text><text font-family="DM Sans,sans-serif" font-size="11" fill="#888780" x="428" y="122">Moderate wicks both sides</text></svg></div><p>Small body with moderate wicks on both sides. Less extreme than a Doji but signals the same thing — indecision. Market is pausing and deciding which direction to go next.</p></div><div class="callout"><div class="callout-label">TST Edge</div><p>Indecision candles are most valuable as confirmation tools. A Doji after three strong green candles at resistance tells you momentum is stalling. A Doji at key support after a sharp selloff tells you sellers may be losing steam. Use them to confirm what the overall picture is already telling you — don't trade them in isolation.</p></div>`}
};

function saveNote(lessonId){
  const input=document.getElementById('note-input-'+lessonId);
  const text=input?input.value.trim():'';if(!text)return;

const LESSON_SIGNALS={'b6-0':'breakout','b6-1':'patience','b6-2':'patience','b6-3':'dip','b6-4':'patience','b3-0':'dip','b3-1':'dip','b2-0':'momentum','b2-1':'momentum','n7-0':'dip','n7-1':'breakout','n7-2':'patience','n8-0':'risk','n8-1':'risk','a6-0':'momentum','a6-3':'momentum','a6-4':'patience'};

function trackLessonStart(id){
  BEHAVIOR.lessonStartTime=Date.now();
  BEHAVIOR.lessonTimes[id]=BEHAVIOR.lessonTimes[id]||{starts:0,totalTime:0};
  BEHAVIOR.lessonTimes[id].starts++;
  if(BEHAVIOR.lessonTimes[id].starts>1){BEHAVIOR.retries[id]=(BEHAVIOR.retries[id]||0)+1;logFlag('revisit','Revisited: '+id);}
}
function trackLessonComplete(id){
  if(!BEHAVIOR.lessonStartTime)return;
  const elapsed=Math.round((Date.now()-BEHAVIOR.lessonStartTime)/1000);
  if(BEHAVIOR.lessonTimes[id])BEHAVIOR.lessonTimes[id].totalTime+=elapsed;
  if(elapsed<15)logFlag('speed','Fast lesson ('+elapsed+'s): '+id);
  if(elapsed>300)logFlag('thorough','Deep study ('+elapsed+'s): '+id);
  BEHAVIOR.lessonStartTime=null;
}
function trackQuizAnswer(lessonId,qIdx,selected,correct,isCorrect){
  const elapsed=BEHAVIOR.questionStartTime?Math.round((Date.now()-BEHAVIOR.questionStartTime)/1000):null;
  BEHAVIOR.questionStartTime=Date.now();
  const signal=LESSON_SIGNALS[lessonId]||null;
  BEHAVIOR.quizzes.push({lessonId,qIdx,isCorrect,responseTime:elapsed,signal,ts:Date.now()});
  if(signal){BEHAVIOR.scores[signal].push(isCorrect?1:0);}
  if(elapsed&&elapsed<4)logFlag('impulsive','Fast answer ('+elapsed+'s) q'+qIdx+' in '+lessonId);
  if(elapsed&&elapsed>25)logFlag('deliberate','Deliberate ('+elapsed+'s) q'+qIdx+' in '+lessonId);
}
function logFlag(type,note){BEHAVIOR.flags.push({type,note,ts:Date.now()});}

function computeProfile(){
  const s=BEHAVIOR.scores;
  const avg=arr=>arr.length?Math.round((arr.filter(x=>x===1).length/arr.length)*100):null;
  const breakoutAcc=avg(s.breakout),dipAcc=avg(s.dip),momentumAcc=avg(s.momentum),patienceAcc=avg(s.patience),riskAcc=avg(s.risk);
  const impulsive=BEHAVIOR.flags.filter(f=>f.type==='impulsive').length;
  const deliberate=BEHAVIOR.flags.filter(f=>f.type==='deliberate').length;
  let profile='Undetermined',traits=[],warnings=[];
  if(breakoutAcc!==null&&dipAcc!==null){
    if(breakoutAcc>dipAcc+15)profile='Momentum Chaser';
    else if(dipAcc>breakoutAcc+15)profile='Sniper';
    else if(patienceAcc&&patienceAcc>70)profile='Swing Specialist';
    else profile='Hybrid';
  }
  if(impulsive>deliberate*2){traits.push('Impulsive decision maker');warnings.push('High risk of chasing trades and overtrading');}
  if(deliberate>impulsive*2){traits.push('Methodical and analytical');traits.push('Natural swing trader tendencies');}
  if(Object.keys(BEHAVIOR.retries).length>5)traits.push('Highly coachable — revisits material');
  if(BEHAVIOR.flags.filter(f=>f.type==='speed').length>3)warnings.push('Rushes through lessons — may miss key concepts');
  if(BEHAVIOR.flags.filter(f=>f.type==='thorough').length>3)traits.push('Deep learner — takes time to absorb material');
  if(riskAcc!==null&&riskAcc<50)warnings.push('Struggles with risk management concepts — priority area');
  return{profile,traits,warnings,scores:{breakout:breakoutAcc,dip:dipAcc,momentum:momentumAcc,patience:patienceAcc,risk:riskAcc},totalQuizzes:BEHAVIOR.quizzes.length,impulsiveCount:impulsive,deliberateCount:deliberate};
}

function toggleChat(){document.getElementById('aip').classList.toggle('open');}

async function sendAI(){
  const inp=document.getElementById('aiin'),msg=inp.value.trim();if(!msg)return;inp.value='';
  addMsg(msg,'user');addMsg('Thinking...','bot','thinking-msg');
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:'You are the TST Academy AI assistant for Top Stock Trading. Help students understand trading concepts clearly and concisely. Be educational, beginner-friendly, and direct. Never give specific buy/sell advice on real stocks.',messages:[{role:'user',content:msg}]})});
    const d=await r.json();
    document.getElementById('thinking-msg')?.remove();
    addMsg(d.content[0].text,'bot');
  }catch(e){document.getElementById('thinking-msg')?.remove();addMsg('Connection error. Try again.','bot');}
}

function addMsg(text,type,id){
  const msgs=document.getElementById('aimsg'),div=document.createElement('div');
  div.className=`ai-msg ${type}`;if(id)div.id=id;div.textContent=text;
  msgs.appendChild(div);msgs.scrollTop=msgs.scrollHeight;
}
</script>
