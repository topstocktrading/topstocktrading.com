<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">Build your heuristics deliberately. After every trade, ask: what was the one thing that most predicted whether this trade worked? Over time, patterns emerge. The signals that repeatedly show up in your best trades become your primary focus. The signals that show up in your worst trades become filters to avoid. This is how elite mental frameworks are built — through systematic observation of your own results, not from reading about someone else's approach.</div></div>`},
'06-03':{title:'Media-Driven Market Signals',content:`<p>This lesson covers the essential concepts of <strong>Media-Driven Market Signals</strong>. Full content coming soon.</p>
<ul><li>When mainstream mentions mean exit, not entry</li><li>Retail vs institutional timing — they are opposite</li><li>Using news as a contrarian signal</li><li>The magazine cover indicator</li></ul>
<h3>Media-Driven Market Signals</h3>
<p>Mainstream financial media is one of the most useful contrarian indicators available to traders — not because journalists are wrong about facts, but because by the time a financial story reaches mainstream coverage, the market has almost always already priced it in. Understanding the timing relationship between media attention and price action is a genuine edge.</p>

<h3>When Mainstream Mentions Mean Exit, Not Entry</h3>
<p>The lifecycle of a tradeable market move typically looks like this: informed participants (institutions, analysts, early adopters) begin positioning months before any story reaches mainstream coverage. Price begins rising. As the move develops, financial media picks it up. As it becomes undeniable, mainstream outlets cover it. By the time it's on the front page of major newspapers or trending on social media, retail traders pile in.</p>
<p>This is precisely when informed participants are exiting — selling to the retail buyers who are just learning about the opportunity. The mainstream media moment is not the entry signal. It's frequently the exit signal for those who got in early.</p>
<p>Classic examples: every major cryptocurrency bubble has followed this exact pattern. Every meme stock mania. Every sector rotation that eventually gets covered in mainstream press as "the next big thing." By the time it's mainstream, the easy money has been made by those who identified it earlier.</p>

<h3>Retail vs Institutional Timing</h3>
<p>Retail traders react to news. Institutional traders position for news — often months in advance based on research, earnings models, industry contacts, and macro analysis that retail participants don't have access to.</p>
<p>When a major piece of news drops — an earnings beat, a Fed decision, a geopolitical development — the price reaction often seems counterintuitive. A company beats earnings by 20% and the stock drops. The Fed cuts rates and the market sells off. A terrible jobs report and stocks rally. These reactions confuse retail traders because they're thinking about the news. Institutions are thinking about what was already priced in.</p>
<p>"Buy the rumor, sell the news" is a cliché because it describes a real phenomenon. Institutional positioning ahead of widely anticipated events means the actual event, however dramatic, is often already reflected in price. The retail trader who buys on the news is buying what smart money already owns and is starting to sell.</p>

<h3>Using News as a Contrarian Signal</h3>
<p>Extreme media coverage — the kind where a financial topic dominates non-financial media, where taxi drivers and barbers are discussing a particular stock or asset — is historically a reliable late-stage indicator. Not a precise one, and not one you can trade mechanically, but a meaningful signal that a move is in its final stages rather than its early ones.</p>
<p>Similarly, extreme negative coverage — "the market is crashing," "this sector is dead," "no one will ever own this again" — often precedes recoveries. When pessimism is universal enough to be reported in mainstream outlets, the selling has often been exhausted. The people who were going to sell have sold. The path of least resistance shifts.</p>
<p>This doesn't mean buying every crash or selling every bubble. It means adding media sentiment as one data point in your market analysis — a confirming or cautioning signal rather than a primary driver.</p>

<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">Before acting on a financial news story, ask: is this information new, or is it mainstream confirmation of something the market has known for months? If it's the latter — and it usually is — the trade opportunity is likely behind you, not in front of you. The best trades are in front of the news cycle, not behind it.</div></div>`},
'06-04':{title:'Trader vs Analyst Mindset',content:`<p>This lesson covers the essential concepts of <strong>Trader vs Analyst Mindset</strong>. Full content coming soon.</p>
<ul><li>Traders react; analysts forecast</li><li>You do not need to predict — just profit from moves</li><li>Rules vs opinions</li><li>Why being right and making money are different things</li></ul>
<h3>Trader vs Analyst Mindset</h3>
<p>One of the most damaging mental frameworks a trader can carry is the analyst mindset — the belief that your job is to forecast what the market will do, that being right matters, and that a strong analytical case for a trade is a reason to hold it through adverse price action. The analyst mindset produces terrible trading results even when the analysis is correct, because markets don't reward being right — they reward being positioned correctly when price moves.</p>

<h3>Analysts Forecast. Traders React.</h3>
<p>An analyst's job is to build a case for a price target based on fundamentals, models, and projections. They might conclude that a stock is worth $85 based on earnings analysis and will publish a report saying so. They then wait to be proven right. Their value is in the quality of their forecast.</p>
<p>A trader's job is to identify price levels where the risk/reward favors entering or exiting a position, execute at those levels, and manage the trade according to what price actually does — not according to what they think it should do. A trader might agree with the analyst's $85 target but still exit the trade at $72 if price action tells them the move has lost momentum. Being right about the ultimate destination doesn't help you if you held through a 30% drawdown to get there.</p>

<h3>You Don't Need to Predict. You Need to Profit.</h3>
<p>This distinction sounds obvious but is routinely violated by traders who become emotionally attached to their market views. "I know this stock is going to $100" becomes a reason to ignore a clear sell signal at $75. "I'm confident the market is topping" becomes a reason to short into a parabolic uptrend.</p>
<p>You do not need to know where price is going. You need to position yourself in situations where the risk is defined, the potential reward is favorable, and price action confirms your thesis quickly. If price confirms — great, manage the trade according to your plan. If price contradicts — exit, take the small loss, move on. The market's actual behavior tells you more than any analysis.</p>

<h3>Rules vs Opinions</h3>
<p>The analyst mindset is opinion-driven: "I think this will happen." The trader mindset is rule-driven: "If X happens, I do Y. If Z happens, I do W." Rules remove the need for in-the-moment judgment about whether your opinion is still correct. The rule handles the decision.</p>
<p>Opinion-driven trading is exhausting and inconsistent because every trade requires you to re-evaluate your thesis in real time under emotional pressure. Rule-driven trading is mechanical: conditions trigger actions. You're not making complex analytical judgments while money is moving — you're executing predetermined responses to defined conditions.</p>
<p>The development of rules — and the discipline to follow them — is what separates the trader mindset from the analyst mindset at the operational level. Rules are not a limitation on your intelligence. They are the mechanism by which your intelligence, applied in calm deliberate moments, governs your behavior in high-pressure ones.</p>

<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">If you find yourself saying 'but the fundamentals support this trade' while holding a position that has broken every technical support level, you're operating with an analyst mindset. The market doesn't care about your analysis. Price is the verdict. When price tells you you're wrong — believe it, exit, and reassess from neutral.</div></div>`},
'06-05':{title:'The Psychology of Position Sizing',content:`<p>This lesson covers the essential concepts of <strong>The Psychology of Position Sizing</strong>. Full content coming soon.</p>
<ul><li>How size affects execution quality</li><li>Decision paralysis at larger positions</li><li>Finding your sweet spot: the size where you execute best</li><li>Confidence trap — the feeling right before a blowup</li></ul>
<h3>The Psychology of Position Sizing</h3>
<p>Most trading education treats position sizing as a mathematical problem — a formula that determines how many shares to buy based on account size and risk percentage. This is accurate and necessary. But it misses the psychological dimension of position sizing, which is equally important and far less discussed: the size of your position directly affects the quality of your decision-making while you're in the trade.</p>

<h3>How Size Affects Execution Quality</h3>
<p>Trade 100 shares of a $50 stock with a $200 stop and you'll find the trade easy to manage. You'll hold through normal fluctuations. You'll follow your plan. The $200 at risk doesn't trigger meaningful stress responses.</p>
<p>Trade 1,000 shares of the same stock with a $2,000 stop and something shifts. Every tick feels significant. Pullbacks that you would have held through at smaller size become genuinely alarming. Your risk management rules that seemed perfectly rational at 100 shares begin to feel arbitrary and overly rigid when real money is moving. You're more likely to move stops, cut early, or add impulsively.</p>
<p>The position itself hasn't changed. The setup is identical. But your psychology has changed dramatically — because the dollar amount at risk has crossed a threshold where your brain's threat-detection system becomes active in a way it wasn't before.</p>

<h3>Decision Paralysis at Larger Positions</h3>
<p>Oversized positions don't just affect your ability to hold — they affect your ability to enter. Traders who have moved to larger size often report hesitation that didn't exist at smaller size: second-guessing valid setups, finding reasons not to take trades that clearly meet their criteria, freezing at the entry point while the setup develops.</p>
<p>This paralysis is the brain's risk-aversion response. The potential loss at larger size triggers a protective mechanism that demands more certainty before acting — certainty that trading, by its nature, cannot provide. The result is that the trader misses entries, waits for "more confirmation" that never comes the way they want it to, and ends up watching valid setups from the sideline.</p>

<h3>Finding Your Execution Sweet Spot</h3>
<p>Every trader has a size at which they execute their process optimally — following their rules, holding through normal noise, exiting when they should exit, entering when they should enter. This is your psychological sweet spot, and it's not the same for every trader or even the same for any one trader across their career.</p>
<p>Finding your sweet spot requires experimentation: gradually increase size until you notice your execution quality deteriorating. The size just below that threshold is your current optimal. As you gain experience and the emotional impact of that size diminishes through repeated exposure, you can step up again.</p>
<p>Scaling size should be gradual and deliberate — not driven by a string of winning trades creating overconfidence, and not driven by a need to "make back" losses faster. Size should increase as a function of demonstrated consistency at the current level, nothing else.</p>

<h3>The Confidence Trap</h3>
<p>One of the most dangerous moments in a trader's career is a sustained winning streak. After five or ten consecutive profitable trades, confidence is at its peak — and peak confidence is where the most catastrophic sizing mistakes happen. The trader sizes up significantly, takes a trade with slightly less discipline than usual, and experiences a loss at a size they're not emotionally prepared for. The large loss then triggers revenge trading at continued oversized positions, and a winning streak can unravel into a significant drawdown in a matter of days.</p>
<p>Professional traders are most vigilant about risk management during winning streaks — not despite their confidence, but because of it. They know that high confidence is correlated with reduced caution, and reduced caution at large size is how careers get damaged.</p>

<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">If you take a trade and immediately feel stressed — checking it constantly, unable to focus on anything else, hoping rather than observing — your size is too large. Reduce it until you can watch price move against you by your full stop amount without it feeling like an emergency. That's your correct size. Trade there consistently until it no longer produces stress, then consider stepping up.</div></div>`},
'06-06':{title:'Surviving Losing Streaks',content:`<p>This lesson covers the essential concepts of <strong>Surviving Losing Streaks</strong>. Full content coming soon.</p>
<ul><li>Variance vs lost edge: how to tell them apart</li><li>Psychological limits vs mathematical drawdowns</li><li>When to stop trading: signals you have lost edge</li><li>Recovery timelines and returning to markets</li></ul>
<h3>Surviving Losing Streaks</h3>
<p>Every trader — regardless of skill level, experience, or track record — experiences losing streaks. It is not a question of if but when, and when they arrive, they are psychologically one of the most challenging experiences in trading. Understanding what losing streaks actually are, how to distinguish between normal variance and a genuine problem, and how to manage yourself through them is critical knowledge for any serious trader.</p>

<h3>Variance vs Lost Edge: How to Tell Them Apart</h3>
<p>This is the most important question during any losing streak: am I experiencing normal statistical variance, or has something fundamentally changed about my edge?</p>
<p><strong>Normal variance</strong> looks like: a string of losses where each trade was taken correctly according to your rules, each stop was honored, each entry matched your criteria — and the trades simply didn't work. This happens. A strategy with a 55% win rate will produce 5-loss streaks with meaningful statistical probability. A 40% win rate strategy makes 7-loss streaks genuinely common. These streaks are painful but they are not evidence that anything is wrong. They are expected outcomes of a probabilistic process.</p>
<p><strong>Lost edge</strong> looks like: losses that persist across different market conditions, over a sample large enough to be statistically meaningful (50+ trades), where honest review of execution shows that the trades were taken correctly but the setups are no longer producing the historical results they once did. This is a different situation requiring strategy review — but it should not be concluded until the evidence is genuinely overwhelming.</p>
<p>The critical insight: most traders draw the conclusion that their edge is gone far too early — after 5 or 10 losses rather than 50 or 100. They change strategies, abandon setups, or stop trading entirely based on what is statistically normal variance. This is one of the primary reasons most traders never develop consistent edge — they don't give strategies enough time to prove themselves.</p>

<h3>Psychological Limits vs Mathematical Drawdowns</h3>
<p>Your mathematical drawdown capacity is determined by your account size and risk management rules. If you risk 1% per trade, you can lose 20 trades in a row and still have 82% of your account intact. Mathematically survivable.</p>
<p>Your psychological drawdown capacity is different and usually more limiting. Most traders reach a breaking point — where the emotional weight of accumulated losses causes them to abandon their process — well before their mathematical limit. This breaking point is your real risk limit, and it's worth knowing where it is before you encounter it.</p>
<p>Signs you're approaching your psychological limit: you start checking positions compulsively, you're unable to think about anything else during the trading day, you're irritable or distracted outside market hours, you're beginning to question everything including your rules and your ability to trade at all.</p>

<h3>When to Stop Trading</h3>
<p>Stop trading — temporarily, with a defined review period — when: you have broken your rules more than twice in a week, you are unable to observe a position without emotional activation, you are taking trades outside your defined setups, or you are increasing size to recover losses faster. None of these behaviors are profitable. All of them will make the drawdown worse.</p>
<p>Taking a structured break — 2 days to a week of no trading — during a losing streak is not weakness. It is one of the most professional decisions you can make. Use the time to review your trades honestly, assess whether the losses reflect execution failures or genuine edge deterioration, and return with a smaller size as you rebuild confidence.</p>

<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">During a losing streak, reduce your size by 50% immediately. You cannot think clearly about strategy when you are stressed about dollar amounts. Smaller size gives you breathing room to evaluate honestly — are these losses happening because the market is in a condition that doesn't suit your setups, because your execution has degraded, or because your edge is genuinely compromised? You cannot answer that question accurately while trading full size through a drawdown.</div></div>`},
'06-07':{title:'Psychology & Overtrading',content:`<p>The biggest enemy in trading is not the market - it is yourself. Overtrading is the single most common reason beginners lose money. It comes from boredom, from trying to make back losses, from FOMO, and from the false belief that more trades equals more opportunity. It does not. More trades means more exposure to bad setups, more commissions, and more emotional decisions. The best traders are selective. They wait for their setup, execute with discipline, and sit on their hands the rest of the time. Doing nothing is a position.</p>
<h3>Overtrading and Decision Fatigue</h3>
<p>Overtrading is one of the most common and most costly patterns in retail trading. It manifests differently for different traders — some take too many trades in a single session, others trade too many different setups or instruments, others continue trading past the point where their focus and judgment have deteriorated — but the underlying cause is almost always the same: a failure to recognize the difference between productive trading activity and the emotional need to be doing something.</p>

<h3>Why More Trades Equals Less Money</h3>
<p>The mathematical reality of overtrading: every additional trade beyond your genuine setup criteria is a trade with worse expected value than your best setups. Your best 3 setups per day might have an average expectancy of +$150 per trade. Your 4th through 8th "trades" — the ones that don't quite meet your criteria, the ones taken out of boredom or FOMO — might have an average expectancy of -$50. Trading more reduces your overall expectancy per trade because the quality of the additional trades is lower than your core setups.</p>
<p>Add to this the commissions and slippage on additional trades, the cognitive cost of managing more open positions, and the decision fatigue that comes from processing more information — and overtrading is demonstrably unprofitable even before you account for the emotional decisions it triggers.</p>

<h3>The Drivers of Overtrading</h3>
<p><strong>FOMO (Fear of Missing Out)</strong> — A stock you're watching moves significantly without you. Rather than accepting the missed opportunity and waiting for a better entry or a different setup, you chase. The entry is poor, the risk/reward is poor, and the outcome is predictably poor. FOMO-driven trades are among the worst trades most traders make.</p>
<p><strong>Boredom</strong> — Markets are slow. Nothing is setting up. You're sitting in front of screens watching nothing happen. The discomfort of inactivity triggers the urge to create activity. A boredom trade is not a setup trade — it's a trade taken to relieve psychological discomfort. The market does not reward boredom relief.</p>
<p><strong>The need to "be active"</strong> — Some traders feel that not trading is lazy or wasteful. They confuse activity with productivity. In trading, doing nothing when nothing is setting up is optimal behavior — but it doesn't feel that way psychologically. The best traders are comfortable with inactivity. They understand that waiting for the right setup IS the work.</p>
<p><strong>Recovery mode</strong> — After a losing trade, the urge to "make it back" drives immediate re-entry into positions that don't meet criteria. The emotional state following a loss is one of the worst states to make trading decisions from — but it's when many traders trade most aggressively.</p>

<h3>Decision Fatigue</h3>
<p>The brain's decision-making capacity is finite and depletes throughout the day. Early in the trading session, your judgment is sharp, your risk management is disciplined, your pattern recognition is accurate. After hours of active trading — monitoring multiple positions, managing entries and exits, processing constant price information — your decision quality degrades. You become more susceptible to emotional decisions, more likely to rationalize rule-breaking, more likely to take marginal trades.</p>
<p>This is why many experienced traders do most of their trading in the first 90 minutes of the session and become significantly more selective or stop entirely during midday. It's not that setups disappear — it's that their ability to evaluate and execute them cleanly has deteriorated.</p>

<h3>Daily Trade Limits</h3>
<p>A daily trade limit is a hard cap on the number of trades you take per session. Choose a number that represents your legitimate high-quality setups in a typical day — for most strategies, this is 2 to 5 trades. Once you reach that number, you're done for the day regardless of what appears to be setting up.</p>
<p>A daily trade limit forces selectivity. When you know you only have 3 trades to use, you don't waste them on marginal setups. You wait for the clearest, highest-quality opportunities and execute those. The discipline of a limit often improves both selectivity and per-trade quality significantly.</p>

<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">Track your trades by time of day and by sequence within the session. Most traders will find that their first 2-3 trades of the day are their best, and performance deteriorates significantly after trade 4 or 5. The data from your own journal will show you exactly when to stop — not a generic rule, but your personal pattern. Use that data to set your daily trade limit.</div></div>`},
'06-08':{title:'Adaptive vs Reactive Responses to Losses',content:`<p>This lesson covers the essential concepts of <strong>Adaptive vs Reactive Responses to Losses</strong>. Full content coming soon.</p>
<ul><li>Maladaptive: revenge trading, averaging down, ignoring rules</li><li>Adaptive: reviewing, adjusting, accepting variance</li><li>Which traders improve vs which blow up</li><li>Building adaptive habits into your routine</li></ul>
<h3>Adaptive vs Reactive Responses to Losses</h3>
<p>How you respond to a losing trade or a losing period is one of the most important determinants of your long-term trading outcome. Two traders can experience identical losses and emerge in completely different states — one having learned from the experience and positioned themselves better for future trades, the other having compounded the original loss with a series of even worse decisions. The difference is not skill or intelligence. It is the quality of their response.</p>

<h3>Maladaptive Responses</h3>
<p><strong>Revenge trading</strong> is the most common and most destructive maladaptive response. After a loss — especially a significant one — the emotional brain generates a powerful drive to immediately recover what was lost. The trader takes the next available trade aggressively, often at larger than normal size, often without waiting for a proper setup. The trade is not based on opportunity — it's based on the need to erase the emotional sting of the prior loss. These trades lose at a higher rate than planned setups because they're taken from an emotionally dysregulated state without the patience to wait for real opportunity.</p>
<p><strong>Averaging down</strong> is adding to a losing position in the hope that the price will recover. The original trade was wrong — the trade criteria were met but the market moved against the thesis. Rather than accepting the original stop loss and exiting, the trader buys more at the lower price to reduce the average cost. This transforms a defined-risk trade with a clear stop into an open-ended commitment with no clear exit. Many accounts have been significantly damaged or destroyed by averaging down on positions that continued to fall far beyond where any rational stop would have been.</p>
<p><strong>Ignoring rules</strong> — moving stops, removing stop losses entirely, holding far past defined exits because "it has to come back" — is the most dangerous form of maladaptive response because it abandons the entire risk management framework that protects the account. Rules exist precisely for moments of emotional distress. Ignoring them during those moments is when the most permanent damage occurs.</p>

<h3>Adaptive Responses</h3>
<p><strong>Reviewing the trade</strong> — After taking a loss, before doing anything else, review the trade objectively. Was it taken correctly according to your rules? Was the entry valid, the stop correctly placed, the position properly sized? If yes, the loss is an expected statistical outcome of your process — nothing to change. If no, identify specifically where the deviation occurred and what triggered it.</p>
<p><strong>Adjusting, not abandoning</strong> — If a pattern of losses reveals a genuine issue — entries consistently slightly too early, stops consistently too tight, a particular setup underperforming in current conditions — make a specific, small adjustment to address the identified issue. This is different from abandoning the strategy entirely because of emotional discomfort. Adjustment is systematic. Abandonment is emotional.</p>
<p><strong>Accepting variance</strong> — Some losses are simply statistical reality. A strategy with 55% win rate produces losing trades 45% of the time. On any given day or week, many of those losses can cluster. Accepting that losing trades are a permanent, expected, and mathematically necessary feature of profitable trading — not evidence of failure — is one of the most psychologically mature things a trader can develop.</p>

<h3>Which Traders Improve, Which Blow Up</h3>
<p>Traders who improve treat each loss as data — a piece of information about their execution, their setup criteria, or market conditions. They review systematically, adjust thoughtfully, and return to markets with better information than they had before the loss.</p>
<p>Traders who blow up treat losses as threats requiring immediate retaliation. They respond to pain with aggression — bigger size, more trades, lower standards for entry. They confuse activity with recovery. They violate every risk management principle at precisely the moments when those principles are most necessary.</p>

<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">After every losing trade, before you take another trade, ask three questions: Was this trade taken according to my rules? If not, what specifically caused the deviation? What will I do differently next time? Writing the answers — even briefly — forces the kind of deliberate processing that converts losses from painful experiences into useful information. The traders who improve fastest are the ones who review most honestly.</div></div>`},
'07-01':{title:'Cash Account Rules',content:`<h3>Cash Account Rules & Limitations</h3>
<p>A cash account is the most basic brokerage account structure — you can only trade with money that has already settled in your account. No borrowing, no leverage, no trading with funds that haven't cleared. For beginners, cash accounts are the safest starting point because they impose natural discipline: you cannot lose more than you deposit.</p>

<h3>How Settlement Works</h3>
<p>When you buy or sell a stock, the trade doesn't settle instantly. Under the current T+1 settlement rule (Trade date plus 1 business day), funds from a stock sale don't become available until the following business day. Options settle the same day (T+0). This settlement timeline is the defining constraint of a cash account.</p>
<p>Example: You have $5,000 in your cash account. Monday morning you buy $5,000 of NVDA. Monday afternoon you sell it for $5,200. Your $5,200 does not settle until Tuesday. If you try to use that $5,200 to buy another stock on Monday afternoon, you are using unsettled funds — which triggers a violation.</p>

<h3>Good Faith Violation</h3>
<p>A good faith violation occurs when you buy a security using proceeds from a sale that hasn't settled yet, and then sell that security before the original sale settles. This is a serious violation. Three good faith violations within a 12-month period results in your account being restricted to purchasing securities only with fully settled cash for 90 days.</p>
<p>How to avoid it: track your settled cash separately from your total account value. Most brokers display both figures. Only trade with your settled cash balance. If you sold a position today, assume those funds don't exist until tomorrow.</p>

<h3>Free Riding Violation</h3>
<p>A free riding violation is even more serious. It occurs when you buy a security, sell it at a profit before paying for it in full, and use the sale proceeds to cover the purchase. Example: You have $0 settled cash. You buy $5,000 of stock on Monday (your broker extends intraday credit for the purchase). You sell it Monday for $5,500 and try to use the $5,500 as if it covers your original $5,000 buy. This is free riding. It results in an immediate 90-day restriction to cash-only purchases with fully settled funds.</p>

<h3>Pattern Day Trader Rule in Cash Accounts</h3>
<p>The PDT rule technically applies only to margin accounts. In a cash account, you can make unlimited day trades — buying and selling the same security in the same session — as long as you're using settled funds for each trade. This makes cash accounts with settled capital an effective way to day trade without the $25,000 minimum requirement, provided you manage settlement carefully.</p>

<h3>Advantages of Cash Accounts</h3>
<ul>
<li>No margin interest charges</li>
<li>Cannot lose more than deposited — no margin calls</li>
<li>No PDT rule restriction on number of day trades</li>
<li>Forces discipline around capital allocation</li>
<li>Available to traders of any account size</li>
</ul>

<h3>Limitations of Cash Accounts</h3>
<ul>
<li>Settlement delays restrict how quickly you can recycle capital</li>
<li>Cannot short stocks (short selling requires a margin account)</li>
<li>Cannot trade certain options strategies that require margin</li>
<li>Must track settled vs unsettled funds carefully to avoid violations</li>
</ul>

<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">Start in a cash account while you're learning. The settlement constraint forces you to be selective about trades — you can't just cycle through positions all day without thinking. That forced selectivity is actually valuable discipline. Once you have a proven process and consistent profitability, upgrading to a margin account for additional flexibility makes sense.</div></div>`},
'07-02':{title:'Margin Account Rules',content:`<h3>Margin Account Rules & Requirements</h3>
<p>A margin account allows you to borrow money from your broker to purchase securities, using your existing holdings as collateral. This borrowing capability introduces leverage — the ability to control more capital than you actually own — which amplifies both gains and losses. Understanding margin is not optional for serious traders; misusing it is one of the fastest ways to destroy an account.</p>

<h3>How Margin Works</h3>
<p>When you open a margin account and deposit $10,000, your broker may allow you to purchase up to $20,000 in securities — your $10,000 plus $10,000 borrowed from the broker. The borrowed portion is called your margin loan, and it accrues daily interest at the broker's margin rate (typically 5-12% annualized, varies by broker and loan size).</p>
<p>Your <strong>equity</strong> is the current value of your positions minus any margin loan outstanding. If your $20,000 position drops to $15,000, your equity is $15,000 - $10,000 (loan) = $5,000. You've lost 50% of your actual capital despite the position only declining 25%.</p>

<h3>Margin Requirements</h3>
<p><strong>Initial margin requirement</strong> — The minimum percentage of a purchase you must fund with your own capital. For most stocks, FINRA requires 50% initial margin — meaning you can borrow up to 50% of a purchase price. To buy $10,000 of stock, you need at least $5,000 of your own funds.</p>
<p><strong>Maintenance margin requirement</strong> — The minimum equity percentage you must maintain relative to your total position value. FINRA requires a minimum of 25% maintenance margin, though most brokers set their own higher requirements (30-40% is common). If your equity falls below the maintenance requirement, you receive a margin call.</p>
<p><strong>Minimum account equity</strong> — To open a margin account, you typically need a minimum of $2,000. For Pattern Day Trader status, the minimum is $25,000.</p>

<h3>Margin Calls</h3>
<p>A margin call is a demand from your broker to deposit additional funds or liquidate positions to bring your account back to the minimum maintenance requirement. Margin calls can be triggered quickly in volatile markets — a 20% drop in a 2x leveraged position can trigger a call.</p>
<p>If you don't meet a margin call within the required timeframe (typically 2-5 business days, sometimes faster in extreme circumstances), your broker has the right to liquidate your positions without your permission — at whatever price is available. They don't need your consent. They can sell your holdings to satisfy the call even if the position is temporarily down and would have recovered.</p>

<h3>Margin Interest</h3>
<p>Margin interest is charged on the daily outstanding balance of your margin loan. On an annualized rate of 8%, borrowing $10,000 for 30 days costs approximately $66. For day traders who open and close positions within a session, margin interest is negligible because the loan doesn't carry overnight. For swing traders or position holders who maintain margin balances for weeks or months, interest costs become a meaningful drag on returns.</p>

<h3>Buying Power</h3>
<p>Margin accounts show two figures: your cash balance and your buying power. Buying power is your available capital including the margin your broker extends. Day trading buying power (for PDT accounts) is typically 4x your overnight buying power — a $25,000 account has $100,000 in intraday buying power. This 4:1 intraday leverage resets to 2:1 at the end of the day for any overnight positions.</p>

<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">Margin is a tool, not a strategy. Used correctly — for temporary leverage on high-conviction setups, not for routinely operating at maximum leverage — it enhances flexibility without dramatically increasing risk. Used incorrectly — trading at or near maximum margin consistently — it transforms normal market volatility into an existential threat to your account. Start with a fraction of your available margin until you have a proven track record. The margin is there when you need it, not as a standing invitation to use all of it.</div></div>`},
'07-03':{title:'The PDT Rule Explained',content:`<h3>The Pattern Day Trader Rule — Full Explanation</h3>
<p>The Pattern Day Trader (PDT) rule is one of the most consequential regulations for retail traders in the United States. Established by FINRA, it defines a pattern day trader as anyone who executes four or more day trades within five rolling business days in a margin account, where those day trades represent more than 6% of total trading activity in the account during that period.</p>
<p>Once classified as a PDT, you are required to maintain a minimum of $25,000 in equity in your margin account at all times. Falling below this threshold restricts your account — you can no longer make day trades until you restore the balance above $25,000.</p>

<h3>What Counts as a Day Trade</h3>
<p>A day trade is the purchase and sale (or short sale and cover) of the same security on the same trading day. Each round trip counts as one day trade.</p>
<p>Important nuances:</p>
<ul>
<li>Buying 100 shares of AAPL in the morning and selling all 100 in the afternoon = 1 day trade</li>
<li>Buying 100 shares of AAPL in the morning and selling 50 in the afternoon = 1 day trade (the 50 sold same day)</li>
<li>Buying 100 shares of AAPL and holding overnight, then selling the next day = NOT a day trade</li>
<li>Options count the same way — buying and selling the same options contract same day = 1 day trade</li>
</ul>

<h3>The 5-Day Rolling Window</h3>
<p>The PDT rule looks at a rolling 5-business-day window, not a calendar week. Day 1 through Day 5 — if you've executed 4 or more day trades in that window and they represent more than 6% of your total trades, you're flagged as a PDT. On Day 6, Day 1 drops off. The window continuously rolls.</p>
<p>Example: Monday you do 1 day trade. Tuesday 1. Wednesday 1. Thursday 1. That's 4 day trades in 4 days — you're now a PDT. If your account is below $25,000, you'll receive a margin call or restriction.</p>

<h3>What Happens When You're Flagged</h3>
<p>Your broker issues a PDT warning or restriction. If your account equity is below $25,000, you cannot make day trades until you either deposit funds to bring the account above $25,000 or wait out a 90-day restriction period depending on broker policies. Some brokers will give you one courtesy removal of the PDT flag if you request it — but typically only once.</p>

<h3>Strategies to Work Within or Around the PDT Rule</h3>
<p><strong>Keep a $25,000+ account</strong> — The simplest solution. If you have the capital, maintain the minimum and trade without restriction.</p>
<p><strong>Use a cash account</strong> — PDT rules apply only to margin accounts. In a cash account, you can make unlimited day trades using settled funds. Settlement timing requires careful management but eliminates the PDT constraint entirely.</p>
<p><strong>Trade with a futures or forex account</strong> — PDT rules don't apply to futures or forex. Futures traders can day trade freely regardless of account size.</p>
<p><strong>Use offshore brokers</strong> — Some traders use brokers domiciled outside the US that don't impose PDT restrictions. These carry additional risks including less regulatory protection and potential tax complications.</p>
<p><strong>Be selective — use your day trades wisely</strong> — If you have limited day trades available, reserve them for your highest-conviction setups. Don't waste a day trade on a marginal setup when you might want it for a better opportunity later in the week.</p>

<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">The PDT rule forces prioritization. When you only have 3 day trades per rolling 5-day period, you become extremely selective. Many traders find that working within the PDT constraint improves their trading by forcing them to wait for their absolute best setups rather than churning through positions. If you're under $25,000, treat the PDT limit as a discipline tool rather than an obstacle.</div></div>`},
'07-04':{title:'Going Long',content:`<h3>Long Entry Mechanics</h3>
<p>Going long means buying a security with the expectation that its price will rise, allowing you to sell later at a higher price for a profit. The mechanics of how you enter a long position — the order type, the timing, the size, and the price level — have a significant impact on the quality of your trade from the moment it opens.</p>

<h3>Identifying the Entry Point</h3>
<p>Before placing any order, you need three things defined: your entry price, your stop loss, and at least one target. These three levels define the trade's risk/reward and should be established before you touch the order ticket — not while the position is open and price is moving.</p>
<p><strong>Entry price</strong> — The specific price or price zone where you plan to buy. This should be tied to a technical reason: the breakout of a resistance level, a bounce off support, a pullback to a moving average, a specific candlestick pattern at a key level. "It looks like it's going up" is not an entry criterion.</p>
<p><strong>Stop loss</strong> — The price at which you're wrong. Where does price need to go for your thesis to be invalidated? Place your stop below the technical level that, if broken, means your setup has failed. Not below your entry by an arbitrary dollar amount — below a meaningful technical level.</p>
<p><strong>Target</strong> — Where do you plan to take profits? Identify at least a first target before entry. Common targets: the next resistance level, a measured move based on pattern height, or a multiple of your risk (if your stop is $0.50 away, a 2R target is $1.00 above entry).</p>

<h3>Order Types for Long Entries</h3>
<p><strong>Limit order at the entry price</strong> — The cleanest entry method. You set the maximum price you're willing to pay and your order only executes at that price or better. The risk: if price moves quickly past your limit, you don't get filled and miss the trade. Acceptable trade-off for the price certainty.</p>
<p><strong>Stop limit order at the entry</strong> — Used for breakout entries. You set a trigger price (the breakout level) and a limit price (the maximum you'll pay). When price reaches the trigger, a limit order is placed. Prevents you from chasing if price breaks out and immediately gaps higher.</p>
<p><strong>Market order</strong> — Executes immediately at the current best available price. Used when speed matters more than exact price — during high-conviction breakouts where missing the entry costs more than a slightly worse fill. Use sparingly and never on illiquid stocks where the spread is wide.</p>

<h3>Timing the Entry</h3>
<p>Even when a setup is valid, timing within the setup matters. The first 30 seconds after a breakout are often the most dangerous — price frequently overshoots, then pulls back, then continues. Waiting for the initial volatility to settle and entering on the first pullback after a breakout often produces a better fill and a more reliable continuation than buying the initial breakout candle.</p>
<p>On intraday charts, the opening minutes of a session (9:30-9:35 ET) have wide spreads and volatile, often directionally misleading price action. Many experienced traders wait until 9:45-10:00 before executing setups, allowing the opening volatility to resolve into a more tradeable structure.</p>

<h3>Position Sizing at Entry</h3>
<p>Determine your share count before entering. Use your defined risk amount divided by the distance to your stop: Shares = Risk Amount ÷ (Entry Price - Stop Price). Enter this share count on your order, not a round number you picked because it "feels right."</p>

<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">The quality of your long entries determines a significant portion of your results — not because perfect entries guarantee wins, but because poor entries (chasing, entering without a defined stop, buying at the worst possible price in the spread) start every trade from a disadvantaged position. Develop the habit of defining entry, stop, and target before touching the order ticket. No exceptions.</div></div>`},
'07-05':{title:'Going Short',content:`<h3>Short Entry Mechanics & Borrow Rates</h3>
<p>Short selling is the practice of selling shares you don't own — borrowing them from your broker, selling them at the current price, and hoping to buy them back later at a lower price to return to the lender, profiting from the decline. Short selling requires a margin account and introduces mechanics and risks that don't exist in long trading.</p>

<h3>How Short Selling Works Step by Step</h3>
<ol>
<li>You identify a stock you believe will decline and want to short 500 shares at $50</li>
<li>Your broker locates 500 shares to borrow from another client's account (or from the broker's own inventory)</li>
<li>Those 500 shares are sold in the market — you receive $25,000 in proceeds, held as collateral</li>
<li>The stock drops to $40. You buy 500 shares at $40 ($20,000) to "cover" your short</li>
<li>You return the 500 borrowed shares to the lender</li>
<li>Your profit is $25,000 - $20,000 = $5,000, minus any borrow fees paid while holding the short</li>
</ol>

<h3>Borrow Rates and Hard-to-Borrow Stocks</h3>
<p>Short selling isn't free. When you borrow shares to short, your broker charges a daily borrow fee — the cost of locating and lending those shares. For liquid, widely-held stocks (AAPL, MSFT, SPY), borrow rates are minimal — often less than 1% annualized, sometimes effectively zero.</p>
<p>For stocks that are heavily shorted or have low float, borrow becomes scarce and expensive. These are called "hard-to-borrow" (HTB) stocks. Borrow rates on HTB names can be extreme — 50%, 100%, 200%, or even higher annualized rates. At 100% annualized, holding a $10,000 short position for one week costs approximately $192 in borrow fees alone. Factor this into your risk/reward calculation before shorting high-rate stocks.</p>
<p>Some stocks become "no borrow" entirely — your broker has no shares available to lend and you simply cannot short them regardless of how compelling the setup looks.</p>

<h3>Short Sale Price Restrictions — The Uptick Rule</h3>
<p>Since 2010, the SEC's Alternative Uptick Rule (Rule 201) imposes a restriction on short selling when a stock declines more than 10% from the prior day's close. When triggered, short sales can only be executed at a price above the current national best bid for the remainder of that day and the following trading day. This restriction can make entering short positions difficult during the most volatile moments — often exactly when short opportunities appear most compelling.</p>

<h3>Unlimited Loss Potential</h3>
<p>The single most important difference between long and short positions: long positions have a maximum loss of 100% (the stock goes to zero). Short positions have theoretically unlimited loss potential — a stock can rise 100%, 200%, 500% or more, and your loss grows proportionally with each increase.</p>
<p>Short squeezes — where heavily shorted stocks rise sharply as short sellers are forced to buy to cover their losses, driving price higher and forcing more covering — are one of the most violent price events in markets. Stocks with high short interest and low float are particularly vulnerable to squeezes that can produce 50-200% moves in hours or days.</p>

<h3>Short Entry Mechanics</h3>
<p>Short entries work opposite to long entries. Your stop loss is above your entry price (the level at which you're wrong) and your target is below (where you expect price to reach). Position sizing uses the same formula: Shares = Risk Amount ÷ (Stop Price - Entry Price).</p>
<p>Timing matters significantly in short selling. The best short setups tend to occur: after failed breakouts (where a stock breaks resistance but immediately reverses), at key resistance levels where prior sellers returned, and during afternoon fade patterns in stocks that have run hard in the morning and are losing momentum as retail interest wanes.</p>

<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">Short selling is harder than it looks and harder than going long. The natural bias of markets is upward — you're fighting that bias every time you short. Borrow costs eat into your gains. Squeezes can be catastrophic. Start with small size when learning to short. Focus on the clearest, most liquid setups with manageable borrow rates. Never short a stock without knowing what your maximum loss is and being fully prepared to accept it.</div></div>`},
'07-06':{title:'Order Types Overview',content:`<h3>Order Types Overview</h3>
<p>Every trade you place is communicated to the market through an order. The type of order you choose determines how your trade executes — whether you get filled immediately or wait, whether you control price or speed, and what happens if the market moves against you before your order fills. Choosing the wrong order type can mean the difference between a clean entry and a catastrophic fill.</p>

<h3>The Core Trade-Off in All Orders</h3>
<p>Every order type is navigating one fundamental trade-off: <strong>price certainty vs execution certainty</strong>. You can control the price you pay (limit order) but risk not getting filled at all. Or you can guarantee execution (market order) but sacrifice control over the exact price. Every order type is a different point on this spectrum.</p>
<p>Understanding where your priority lies for a specific trade determines which order type is correct. In a fast-moving breakout where missing the entry costs more than a few cents of slippage, you want execution certainty — market or stop order. In a patient setup where you want a specific price or nothing, you want price certainty — limit order.</p>

<h3>The Five Core Order Types</h3>
<p><strong>Market Orders</strong> — Execute immediately at the best available price. Fastest execution, zero price control. Best for liquid stocks where the spread is tight and speed is critical.</p>
<p><strong>Limit Orders</strong> — Execute only at your specified price or better. Full price control, no execution guarantee. Best for patient entries at specific technical levels.</p>
<p><strong>Stop Orders</strong> — Become market orders when a trigger price is reached. Used for breakout entries and stop losses. No price control once triggered.</p>
<p><strong>Stop Limit Orders</strong> — Become limit orders when a trigger price is reached. Combines stop and limit — triggers at one price, executes at another. Offers price protection but can fail to fill in fast markets.</p>
<p><strong>Trailing Stop Orders</strong> — Stop loss that moves with price as the trade goes in your favor. Locks in profits automatically as price rises. Covered in detail in lesson 07-11.</p>

<h3>Choosing the Right Order for the Situation</h3>
<p><strong>Entering a breakout:</strong> Stop order (triggers when price breaks the level) or market order (if you're already watching and ready to act). Limit orders frequently miss fast breakouts.</p>
<p><strong>Entering a pullback:</strong> Limit order (you want a specific price, you can afford to wait). Patience rewards you here — no reason to pay up.</p>
<p><strong>Exiting a winner at a target:</strong> Limit order (you want a specific price and you're in no rush — the position is profitable). Set it and let it work.</p>
<p><strong>Exiting a loser at a stop:</strong> Stop order or stop limit. The stop must execute — don't use a limit order for your stop loss on a fast-moving stock where you might not get filled.</p>
<p><strong>Exiting in a fast-moving market:</strong> Market order. When a stock is collapsing rapidly, a limit order that doesn't fill while price drops past your limit becomes a catastrophe. In genuine emergencies, market orders for exits are appropriate.</p>

<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">Most beginners default to market orders for everything because they're simple. This is a mistake on entries. Market orders on illiquid stocks during volatile moments can result in fills 5-10% away from the last price — what the industry calls slippage. Develop the discipline of using limit orders for entries on all but the most time-critical setups. Slippage compounds over hundreds of trades into a meaningful cost.</div></div>`},
'07-07':{title:'Market Orders',content:`<h3>Market Orders</h3>
<p>A market order is an instruction to your broker to buy or sell a security immediately at the best available current price. It is the simplest, fastest order type and the one most closely associated with instant execution. It is also the order type most commonly misused by retail traders in situations where it costs them significantly.</p>

<h3>How Market Orders Execute</h3>
<p>When you place a market buy order, your broker routes it to the exchange where it executes against the current best ask (the lowest price any seller is offering). When you place a market sell order, it executes against the current best bid (the highest price any buyer is willing to pay).</p>
<p>In a liquid market with a tight spread — AAPL trading with a bid of $175.50 and an ask of $175.51 — a market order costs you at most $0.01 per share in slippage. In an illiquid market — a thinly traded small-cap with a bid of $2.45 and an ask of $2.65 — a market order costs you $0.20 per share in slippage before the trade even begins. On 1,000 shares that's a $200 immediate loss from order type selection alone.</p>

<h3>When Market Orders Are Appropriate</h3>
<p><strong>Exiting a position in an emergency</strong> — If a stock is in freefall and you need out immediately, a market order guarantees execution. A limit order that doesn't fill while the stock drops another 5% is far worse than the slippage on a market order. When you need out, get out.</p>
<p><strong>Buying highly liquid large-cap stocks</strong> — On stocks like AAPL, MSFT, GOOGL, or major ETFs like SPY and QQQ, spreads are so tight (often $0.01) that the cost of a market order is negligible and the execution certainty is valuable.</p>
<p><strong>High-conviction breakouts where speed is critical</strong> — If a stock breaks a key level and you want in immediately before the momentum move develops, a market order ensures you're filled. Missing a 5% move because you were trying to save $0.05 on the entry with a limit order is a poor trade-off.</p>

<h3>When Market Orders Are Dangerous</h3>
<p><strong>Thinly traded or low-float stocks</strong> — Wide spreads mean market orders have immediate, significant slippage. Always use limit orders on these names.</p>
<p><strong>Pre-market and after-hours trading</strong> — Liquidity is dramatically lower outside regular hours. Spreads widen significantly and market orders can result in fills far from where you expect.</p>
<p><strong>During market open (9:30-9:35 ET)</strong> — The first few minutes of trading have the widest spreads and most volatile price action of the day. Market orders during this window can result in extremely poor fills.</p>
<p><strong>During news events</strong> — When major news drops and a stock is moving rapidly, market orders can fill far from the price at the time of order placement. In a stock dropping 15% on news, a market sell order might fill 2-3% below where you clicked.</p>

<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">The professional habit: use limit orders for entries and exits in all but genuine emergencies. When you do use market orders, always check the spread first. If the spread is wider than 0.1% of the stock price, use a limit order instead. The discipline of checking spreads before placing market orders takes 3 seconds and can save you meaningful money over hundreds of trades.</div></div>`},
'07-08':{title:'Limit Orders',content:`<h3>Limit Orders</h3>
<p>A limit order specifies the exact price at which you're willing to buy or sell. A limit buy order executes only at or below your specified price. A limit sell order executes only at or above your specified price. If the market never reaches your limit price, the order doesn't fill — you either miss the trade or wait for a better opportunity.</p>
<p>Limit orders are the professional standard for entries on any stock where you have a specific price in mind and the trade setup can accommodate patience. They give you complete control over your execution price and eliminate the slippage risk that market orders carry on less liquid names.</p>

<h3>How Limit Orders Work</h3>
<p><strong>Limit buy example:</strong> NVDA is trading at $120. You want to buy on a pullback to $118.50, which is near the 20 EMA. You place a limit buy at $118.50. If price pulls back to $118.50 or below, your order fills. If price never pulls back and continues higher, your order doesn't fill — you've missed the trade but you haven't overpaid.</p>
<p><strong>Limit sell example:</strong> You're long AAPL from $170 and your target is $175. You place a limit sell at $175. Your order executes automatically when AAPL reaches $175, without you needing to monitor the position. If AAPL reverses before reaching $175, your limit sell doesn't trigger and you remain in the position (managed by your stop loss).</p>

<h3>Day Orders vs GTC Orders</h3>
<p>When placing a limit order, you specify the duration:</p>
<p><strong>Day order</strong> — The order is active only for the current trading session. If it doesn't fill by market close, it's automatically cancelled. Default for most active traders — you reassess conditions each day rather than carrying stale orders.</p>
<p><strong>Good Till Cancelled (GTC)</strong> — The order remains active until it fills or you manually cancel it (brokers typically cap GTC orders at 60-90 days). Useful for swing traders or investors setting limit orders at specific levels they want to monitor over days or weeks.</p>

<h3>Partial Fills</h3>
<p>If your limit order is for more shares than are available at your limit price at the time it triggers, you may receive a partial fill — some shares execute, the rest remain as an open order. This is common in thinly traded stocks. Partial fills require you to decide whether to let the remainder work at the original limit, adjust the price, or cancel the remaining quantity.</p>

<h3>Limit Orders for Entries vs Exits</h3>
<p>Limit orders are more appropriate for exits (targets) than entries in fast-moving situations. If a stock is breaking out and you want to buy, a limit order placed at the breakout level may never fill if price immediately moves through it. For exits at your target, a limit order sitting at the target price works perfectly — your broker executes automatically when price reaches your level, without you needing to monitor it in real time.</p>

<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">Set your exit limit orders as soon as you enter a trade. The moment you're filled on an entry, place your stop loss and your first target limit sell simultaneously. Having your exit orders in the market removes the emotional decision of when to exit while you're holding a position — the order executes mechanically when price reaches your predetermined level. Traders who manage exits manually while in a position make far more emotional decisions than those who pre-set exit orders.</div></div>`},
'07-09':{title:'Stop Orders',content:`<h3>Stop Orders</h3>
<p>A stop order (also called a stop-loss order or stop-market order) is designed to limit losses or protect profits by triggering a market order when price reaches a specified level. Stop orders are the mechanism by which traders enforce their risk management rules — they convert a predetermined decision about maximum acceptable loss into an automatic execution that doesn't require willpower or in-the-moment judgment.</p>

<h3>How Stop Orders Work</h3>
<p>You buy 100 shares of TSLA at $200 and place a stop order at $195. While price remains above $195, your stop is dormant. If price drops to $195, the stop is triggered and a market order to sell 100 shares executes immediately at the best available price.</p>
<p>Critical nuance: the stop price is the <em>trigger</em> price, not the execution price. Once triggered, the order becomes a market order — meaning in fast-moving markets, your actual fill may be below the stop trigger. If TSLA gaps down from $200 to $191 on bad news, your stop at $195 triggers but executes at $191 — the first available price after the gap. This is called gap risk or slippage through the stop.</p>

<h3>Stop Placement Principles</h3>
<p>Stop placement is one of the most important decisions in every trade. Stops that are too tight get triggered by normal price noise before the trade has time to develop. Stops that are too wide allow losses to grow larger than the risk/reward of the setup warrants.</p>
<p><strong>Technical stop placement</strong> — Place stops below the technical level that invalidates your thesis: below the support level you bought at, below the moving average you expected to hold, below the low of the consolidation you bought the breakout from. The stop is at the price where "I was wrong about this setup."</p>
<p><strong>ATR-based stop placement</strong> — Use the stock's Average True Range to calibrate stop distance. If ATR is $1.50, a stop $0.50 away will be triggered by normal daily noise. A stop 1-1.5x ATR away (at $1.50-$2.25) gives the trade room to breathe within normal volatility.</p>
<p><strong>Never move stops wider</strong> — Moving a stop away from your entry to give a trade "more room" is one of the most dangerous habits in trading. The stop was placed at a technical level based on your analysis before the trade. The emotional desire to avoid taking a loss by widening the stop is not a technical reason — it's an emotional one. Honor the original stop.</p>

<h3>Mental Stops vs Hard Stops</h3>
<p>Some traders use "mental stops" — tracking their stop level manually and intending to exit when price reaches it, rather than placing an actual order. This is generally a mistake for anyone who hasn't mastered their psychological response to drawdowns. In practice, mental stops get moved when price approaches them, held when they should be triggered, and forgotten during fast-moving markets. Hard stops — actual orders placed in the market — execute without requiring you to make a decision under emotional pressure.</p>

<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">Place your stop order the moment your entry fills. Do not enter a trade without an immediate stop in the market. The 30 seconds between entry and stop placement is the most dangerous period of any trade — an unexpected news event or halt in those 30 seconds with no stop order in place can result in losses far beyond your planned risk. Make it a reflex: entry fills, stop placed, then manage the trade.</div></div>`},
'07-10':{title:'Stop Limit Orders',content:`<h3>Stop-Limit Orders</h3>
<p>A stop-limit order combines the features of a stop order and a limit order. It has two prices: a stop price (the trigger) and a limit price (the worst acceptable fill price). When the stop price is reached, the order activates — but instead of becoming a market order, it becomes a limit order at the specified limit price. You only fill if the market comes back to your limit price after the stop triggers.</p>

<h3>How Stop-Limit Orders Work</h3>
<p>You're long 200 shares of ROKU at $60, with a stop-limit order placed with a stop price of $58 and a limit price of $57.50. When ROKU reaches $58, the stop triggers and a limit sell order at $57.50 is placed. If the stock can be sold at $57.50 or higher, the order fills. If ROKU is falling rapidly and the next available price is $55 — below your $57.50 limit — your order does not fill. You remain in the position while price continues to fall.</p>

<h3>The Critical Risk of Stop-Limit Orders for Stop Losses</h3>
<p>This is the fundamental problem with using stop-limit orders as stop losses: in a fast-moving market or on a gap down, your limit price may never be reached after the stop triggers. The order that was supposed to get you out of a losing trade fails to execute, and your loss continues to grow beyond your intended maximum.</p>
<p>This happens most commonly during:</p>
<ul>
<li>Earnings releases where a stock gaps significantly past your stop trigger</li>
<li>Halts followed by reopening at a dramatically different price</li>
<li>News events that cause instantaneous, large price moves</li>
<li>Thinly traded stocks where there may simply be no buyers at your limit price during a decline</li>
</ul>

<h3>When Stop-Limit Orders Are Appropriate</h3>
<p>Stop-limit orders make more sense for <strong>entries</strong> than exits. For a breakout entry: you set the stop trigger at the breakout level (the price that confirms the setup is valid) and the limit price slightly above (the maximum you're willing to pay for the breakout). This ensures you don't chase a stock that gaps explosively past your intended entry and immediately pulls back.</p>
<p>For exits, stop-limit orders are most defensible in liquid, non-volatile stocks where the bid/ask spread is tight and fast execution gaps are unlikely. In thin stocks or during news-sensitive periods, stick with stop (market) orders for exits.</p>

<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">Use stop orders (market), not stop-limit orders, for your stop losses on existing positions. The execution guarantee of a stop-market order is more valuable than the price protection of a stop-limit when managing risk. The scenario where a stop-limit order fails to execute — because price gaps past your limit — is precisely the scenario where a simple stop order would have saved you from a much larger loss.</div></div>`},
'07-11':{title:'Trailing Stops',content:`<h3>Trailing Stops</h3>
<p>A trailing stop is a dynamic stop loss that automatically adjusts upward (for long positions) as price moves in your favor, locking in profits while still allowing the trade room to run. Unlike a fixed stop loss that stays at a specific price, a trailing stop follows price at a defined distance — either a fixed dollar amount, a percentage, or an ATR multiple — and only moves in one direction: with the trend.</p>

<h3>How Trailing Stops Work</h3>
<p>You buy AMZN at $180 and place a $5 trailing stop. Your initial stop is at $175. AMZN rises to $188. Your trailing stop has moved up to $183. AMZN rises further to $195. Your trailing stop is now at $190. AMZN then reverses and drops to $190 — your trailing stop triggers and you exit at $190, locking in a $10 gain per share. If AMZN had never reversed and continued to $220, your trailing stop would have followed it all the way up, exiting only when the first meaningful reversal occurred.</p>
<p>The key property: the trailing stop can only move up (for longs). If AMZN drops from $195 to $192 before recovering to $198, the trailing stop doesn't move down with the pullback — it stays at $190 (set when price was $195) and moves up further to $193 when price reaches $198.</p>

<h3>Trailing Stop Methods</h3>
<p><strong>Fixed dollar trailing stop</strong> — The stop trails price by a specific dollar amount. Simple to calculate and implement. Best for stocks with relatively stable daily ranges. The risk: a fixed dollar amount that's appropriate when the stock was at $50 may be too tight or too wide when it reaches $100.</p>
<p><strong>Percentage trailing stop</strong> — The stop trails price by a percentage of current price. Automatically adjusts for the stock's absolute price level. A 5% trailing stop on a $50 stock gives $2.50 of room; on a $200 stock it gives $10. More appropriate than fixed dollar for stocks that move significantly in price.</p>
<p><strong>ATR-based trailing stop</strong> — The stop trails at a multiple of ATR. Most sophisticated and most calibrated to the stock's actual volatility. A 2x ATR trailing stop gives the stock exactly 2 times its average daily range before stopping out — appropriate breathing room regardless of the stock's price or volatility level.</p>

<h3>When Trailing Stops Are Most Valuable</h3>
<p>Trailing stops are particularly valuable for trend-following positions where the goal is to let a winner run as long as possible without giving back all gains. Rather than picking an arbitrary exit price, you let price action determine when the trend is over — the trailing stop triggers when price has reversed by a meaningful amount from its peak.</p>
<p>They are less valuable for short-term intraday trades where you have specific targets in mind. For a scalp or a defined setup with a clear target, a fixed limit order at the target is more appropriate than a trailing stop that might exit before you reach it.</p>

<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">The biggest psychological benefit of a trailing stop is that it removes the exit decision from your hands during a winning trade. Traders consistently take profits too early — cutting winners short because they're afraid of giving back gains. A trailing stop handles this mechanically: it lets the trade run and only exits when price actually reverses by your defined amount. You cannot second-guess a trailing stop while it's working. Set it and let it do its job.</div></div>`},
'07-12':{title:'Position Sizing Formula',content:`<h3>Position Sizing Formula & Bankroll Management</h3>
<p>Position sizing is the single most important mechanical element of trading risk management. It determines how many shares you buy on each trade based on your account size, your risk tolerance, and the specific stop level of the setup. Done correctly, position sizing ensures that no single trade can significantly damage your account. Done incorrectly — or ignored entirely — it guarantees that eventually a string of losses or a single disaster will end your trading career.</p>

<h3>The Core Principle: Risk a Fixed Percentage Per Trade</h3>
<p>The foundation of all position sizing frameworks: never risk more than a defined percentage of your trading account on any single trade. Professional traders typically risk between 0.5% and 2% per trade. Beginners should start at 0.5-1%. Higher risk percentages are used only by experienced traders with proven positive expectancy across large samples.</p>
<p>Why 1-2%? At 1% risk per trade, you can lose 20 consecutive trades and still retain approximately 82% of your account. That's survivable — you can learn, adjust, and recover. At 10% risk per trade, 10 consecutive losses eliminates your account. Even at 5%, 14 losses in a row ends you. Given that losing streaks of 5-10 trades are statistically normal for any strategy, 1-2% risk keeps you in the game long enough to let your edge play out.</p>

<h3>The Position Sizing Formula</h3>
<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text"><strong>Shares = (Account Size × Risk %) ÷ (Entry Price − Stop Price)</strong><br><br>Example: $50,000 account, 1% risk, entry at $45, stop at $43:<br>Shares = ($50,000 × 0.01) ÷ ($45 − $43) = $500 ÷ $2 = 250 shares<br><br>Maximum loss if stopped out: 250 × $2 = $500 = exactly 1% of account.</div></div>
<p>This formula calculates the exact number of shares that limits your loss to your defined risk amount if your stop is hit. The inputs that control the output: tighter stops allow more shares (more upside potential on the same risk). Wider stops require fewer shares (protecting the same dollar risk). Higher account size allows more dollar risk at the same percentage.</p>

<h3>Dollar Risk vs Percentage Risk</h3>
<p>Express your risk in both dollar terms and percentage terms. $500 risk means different things at different account sizes — it's 1% of a $50,000 account but 5% of a $10,000 account. Always work in percentages first, then convert to dollars to understand the real-world magnitude of the risk.</p>
<p>As your account grows, your dollar risk per trade grows proportionally (1% of $100,000 is $1,000 vs 1% of $50,000 being $500), but the percentage exposure stays constant. This natural scaling means that successful trading automatically increases position sizes without requiring you to manually adjust your risk framework.</p>

<h3>Maximum Loss Per Day</h3>
<p>Beyond per-trade risk, establish a maximum daily loss — the point at which you stop trading for the day regardless of what setups appear. A common rule: stop trading when you've lost 2-3% of your account in a single day (equivalent to 2-3 average-sized losing trades). This prevents the pattern where a bad morning leads to emotional trading in the afternoon that compounds losses dramatically.</p>

<h3>Scaling Size as Equity Grows</h3>
<p>Recalculate your position sizing formula periodically — weekly or monthly for active traders. As your account grows from consistent profitability, your dollar risk per trade increases automatically because the percentage stays constant applied to a larger base. This compound effect is why consistent small edges, properly sized, can produce significant account growth over time.</p>
<p>Conversely, during drawdowns, the formula automatically reduces your dollar risk as account equity decreases — a built-in risk reduction mechanism that most position sizing formulas provide automatically.</p>

<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">Calculate the correct number of shares using the formula before every single trade. Do not round to the nearest hundred shares for simplicity, do not use a fixed lot size for all trades, do not skip the calculation because the math feels tedious. The 30 seconds it takes to run this formula is the most important 30 seconds in your trading workflow. Skipping it is how traders end up with oversized positions they can't manage psychologically.</div></div>`},
'07-13':{title:'Max Loss Per Trade',content:`<p>Your maximum loss per trade is the most money you are willing to lose on any single trade before exiting. This is not your stop loss level - it is the dollar amount that represents your limit. Setting this number in advance and honoring it removes the most dangerous decision in trading from the heat of the moment.</p><h3>Setting Your Number</h3><p>For a beginner with a $10,000 account, a reasonable max loss per trade is 1% of account value, which is $100. For a $25,000 account, 1% is $250. This number should feel uncomfortable to lose but not catastrophic. If losing your max loss per trade would cause you significant financial stress, it is too high.</p><h3>The Stop Loss Is Not Optional</h3><p>Your max loss per trade is enforced by your stop loss. If your stop loss is set correctly using the position sizing formula, hitting your stop will never exceed your max loss per trade. The danger is when traders move their stops or trade without stops at all - at that point there is no limit to the loss on a single trade.</p><h3>When to Reduce Your Max Loss</h3><p>During a losing streak, reduce your max loss per trade. If you have lost three trades in a row, cut your size in half. If you have lost five in a row, stop trading and review your trades before continuing. Losses come in streaks and protecting your capital during those streaks is what allows you to still be trading when conditions improve.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The worst trading days are the ones where a trader takes one large loss, feels the need to make it back immediately, takes another large loss, and spirals. A hard limit on loss per trade prevents this. Honor your max loss number as if it is a law, not a suggestion.</p></div>`},
'07-14':{title:'Max Loss Per Day',content:`<p>Your daily max loss is the total amount you are willing to lose in a single trading day before stopping completely. This is one of the most important rules you will ever set for yourself and one of the hardest to follow when you are in the middle of a bad day.</p><h3>Setting Your Daily Max Loss</h3><p>A common framework is to set your daily max loss at 3x your max loss per trade. If your max loss per trade is $100, your daily max loss is $300. Once you hit $300 in losses for the day, your trading day is over. You close any open positions, you close your platform, and you do not trade again until tomorrow.</p><h3>Why This Rule Exists</h3><p>Bad trading days rarely stop at one loss. A trader who has one bad trade and does not have a daily max loss rule will often take a second trade immediately to try to recover - and lose again. Then a third trade, larger this time. By the end of the day what started as a $100 loss has become a $1,000 loss. The daily max loss rule prevents the avalanche. One bad day stays a bad day instead of becoming a catastrophic day.</p><h3>The Discipline Required</h3><p>The daily max loss rule only works if you honor it without exceptions. The moment you say this one time I will make an exception is the moment it stops being a rule. Write it down. Post it near your monitor. Stop trading the moment you hit it regardless of what you think is setting up next.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Your best trading days and your worst trading days are both equally important to your development. On your worst days, the max loss rule is what keeps a bad day from becoming a week-long setback. The traders who develop longevity in this business are not the ones who never have bad days - they are the ones who contain their bad days.</p></div>`},
'07-15':{title:'Scaling Winners Without Destroying Edge',content:`<h3>Scaling Winners Without Destroying Edge</h3>
<p>Adding to winning positions — commonly called pyramiding or scaling in — is one of the most powerful techniques in professional trading. When executed correctly, it allows you to increase exposure to your strongest setups after the market has confirmed your thesis, producing significantly larger returns than a fixed position would have achieved. When executed incorrectly, it transforms a winning trade into a position so large that normal price fluctuations trigger emotional decision-making and the entire trade falls apart.</p>

<h3>The Logic Behind Scaling Winners</h3>
