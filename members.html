'gs-0':{title:'How to Read a Chart',content:`<p>Before you learn a single pattern or indicator, you need to know what you are looking at when you open a chart. This is the foundation everything else builds on.</p><h3>The Axes</h3><p>The horizontal axis (X-axis) represents time. Moving left to right on a chart means moving forward in time. The vertical axis (Y-axis) represents price. Higher on the chart means a higher price. Lower on the chart means a lower price.</p><h3>The Candlesticks</h3><p>Each candle represents a specific time period - one minute, five minutes, one day, depending on your chart settings. A green candle means price closed higher than it opened during that period. A red candle means price closed lower than it opened. The body of the candle is the range between the open and close. The thin lines extending above and below are called wicks or shadows and represent the highest and lowest prices reached during that period.</p><h3>The Volume Panel</h3><p>At the bottom of most charts you will see vertical bars. This is the volume panel. Each bar shows how many shares traded during that time period. Taller bars mean more shares traded. Green volume bars correspond to green candles - more buyers. Red volume bars correspond to red candles - more sellers.</p><h3>The Price Scale</h3><p>On the right side of the chart you will see a price scale. This tells you exactly what price level each point on the chart represents. When you hover your cursor over a candle, your platform will typically show you the exact open, high, low, and close price for that candle.</p><h3>Timeframes</h3><p>You can change how much time each candle represents. A 1-minute chart shows one candle per minute. A daily chart shows one candle per day. The same stock will look completely different on different timeframes - this is not a mistake, it is information.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Spend one full week just looking at charts before you do anything else. No trading, no analysis - just observation. Watch how candles form, how volume behaves, how price moves. You will learn more from that week of watching than from reading any book.</p></div>`},
'gs-1':{title:'Setting Up Webull',content:`<p>Webull is one of the best platforms available for active traders - it is free, has Level 2 data, supports paper trading, and has robust charting tools. Here is how to get set up and oriented.</p><h3>Creating Your Account</h3><p>Download Webull from webull.com or your app store. Create an account, complete identity verification, and fund your account. If you are not ready to trade real money yet, you can use the paper trading feature to practice with simulated funds - which is exactly what you should do first.</p><h3>Navigating the Platform</h3><p>The main dashboard shows your portfolio, watchlist, and market overview. The search bar at the top lets you look up any stock by ticker symbol. Click on any stock to see its quote page, which shows the current price, daily change, volume, and quick chart.</p><h3>Setting Up Your Charts</h3><p>Click on a stock then select Charts. At the bottom of the chart you can change the timeframe - 1m, 2m, 5m, 15m, 1h, D, W are the most commonly used. Right-click on the chart to add indicators. The essential indicators to add are: EMA 9, EMA 20, EMA 50, and VWAP. Volume is shown by default at the bottom.</p><h3>Setting Up Your Watchlist</h3><p>On the left panel you can create and manage watchlists. Add the stocks you are monitoring to your watchlist so you can quickly jump between them. You can add columns to your watchlist view including last price, change percentage, volume, and relative volume.</p><h3>Paper Trading</h3><p>Click on the Paper Trading option in the menu. Webull gives you $1,000,000 in simulated funds by default. You can change this amount. Use paper trading to practice placing orders, setting stops, and managing positions before risking real money.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Take at least 30 days on paper trading before switching to real money. Your goal on paper is not to make money - it is to build the habit of following your plan every single time. If you cannot follow your plan with fake money you will not follow it with real money.</p></div>`},
'gs-2':{title:'Placing Your First Order',content:`<p>Understanding how to place an order correctly is critical. A mistake in order entry can cost you significantly - the wrong order type, the wrong quantity, or the wrong direction can all cause serious problems.</p><h3>The Basic Order Types</h3><p>To open a trade in Webull, find the stock, then click Trade or the buy/sell button. You will see options for order type - Limit, Market, Stop, and Stop Limit. For entries, always use a Limit order. Type in the price you want to buy or sell at, enter your share quantity, and confirm the order.</p><h3>Checking Before You Submit</h3><p>Before clicking confirm, verify three things: the ticker symbol is correct, the quantity is correct, and the order type is what you intended. Many costly mistakes happen because a trader was in a rush and submitted without checking. Slow down at this step every single time.</p><h3>Reading Your Open Orders</h3><p>After submitting, your order appears in the Open Orders section. If it fills immediately, it moves to Order History. If it does not fill, it stays as open. You can cancel an open order at any time before it fills.</p><h3>Setting a Stop Loss After Entry</h3><p>Once your order fills and you have a position, immediately place your stop loss. Go to your position, click to add a conditional order, select Stop, enter your stop price, and submit. Do this before doing anything else. Your stop loss protects you if the trade goes wrong while you are not watching.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Your stop loss should be placed the moment your entry fills - not after you watch the trade for a few minutes. Many traders lose discipline and skip the stop because the trade is going their way initially. Then it reverses. Set the stop immediately every time.</p></div>`},
'gs-3':{title:'Building Your Trading Setup',content:`<p>Your physical trading setup affects your performance more than most traders realize. Trying to day trade on a single laptop screen with a slow internet connection is like trying to drive a race car with one eye closed. Get the basics right before you trade serious size.</p><h3>Screens</h3><p>At minimum you need two monitors. One for your charts, one for your order entry and watchlist. Professional traders typically use three or four screens. If you are serious about active trading, a dual monitor setup is not a luxury - it is a necessity. You need to see multiple charts and your platform simultaneously without constantly switching windows.</p><h3>Internet Connection</h3><p>Your internet connection needs to be fast and reliable. Wired ethernet is always better than WiFi for trading - it is more stable and has lower latency. Have a backup plan for internet outages - a phone hotspot is the most practical backup option. Losing your connection during an open trade with no stop loss set is a serious risk.</p><h3>Computer Performance</h3><p>Trading platforms and multiple real-time charts consume significant computing resources. If your computer is slow, your charts will lag and your order entry will be delayed. At minimum you want a modern computer with 8GB of RAM. 16GB is better. Close all unnecessary programs while trading.</p><h3>The Trading Environment</h3><p>Trade in a quiet environment where you will not be interrupted during market hours. Distractions cause mistakes. Active trading requires full focus for the time you are watching the market - even a 30-second distraction at the wrong moment can be expensive.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Your trading setup is an investment in your performance. You would not try to do precision work with bad tools. Treat your trading infrastructure the same way. Spend what you need to spend to have a reliable, distraction-free setup before you risk significant capital.</p></div>`},
'b-rm-0':{title:'Position Sizing Formula',content:`<p>Position sizing is the single most important risk management skill you will ever develop. Most beginners decide how many shares to buy based on what feels right. Professional traders use math. The formula is simple and it should become automatic before every trade.</p><h3>The Formula</h3><p>Account Size x Risk Percentage divided by Dollar Risk Per Share equals your Share Size.</p><p>Example: You have a $10,000 account. You risk 1% per trade, which is $100. Your entry is $50.00 and your stop is $49.00, so your dollar risk per share is $1.00. $100 divided by $1.00 equals 100 shares. That is your position size.</p><h3>Why This Matters</h3><p>Without this formula, most traders size their positions emotionally - they buy more when they feel confident and less when they feel uncertain. Confidence has nothing to do with the correct position size. The math does. A trade you feel great about can lose. A trade you feel uncertain about can win. The formula keeps your risk consistent regardless of how you feel about any individual trade.</p><h3>The Risk Percentage</h3><p>Most professional traders risk between 0.5% and 2% of their account per trade. Beginners should start at 0.5% to 1%. At 1% risk on a $10,000 account, you can lose 100 trades in a row before losing your account. That is not going to happen if your setups are valid - but that buffer gives you room to learn without blowing up.</p><h3>Adjusting for Volatility</h3><p>On more volatile stocks with wider stops, your formula will give you a smaller position size. That is correct. A small cap stock with a $2.00 stop requires a smaller position than a large cap with a $0.50 stop even if your dollar risk is identical. The formula accounts for this automatically.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Calculate your position size before you place every single trade for the first six months. After that it becomes automatic. The traders who skip this step are the ones who eventually take one oversized loss that sets them back months. Do the math every time.</p></div>`},
'b-rm-1':{title:'Max Loss Per Trade',content:`<p>Your maximum loss per trade is the most money you are willing to lose on any single trade before exiting. This is not your stop loss level - it is the dollar amount that represents your limit. Setting this number in advance and honoring it removes the most dangerous decision in trading from the heat of the moment.</p><h3>Setting Your Number</h3><p>For a beginner with a $10,000 account, a reasonable max loss per trade is 1% of account value, which is $100. For a $25,000 account, 1% is $250. This number should feel uncomfortable to lose but not catastrophic. If losing your max loss per trade would cause you significant financial stress, it is too high.</p><h3>The Stop Loss Is Not Optional</h3><p>Your max loss per trade is enforced by your stop loss. If your stop loss is set correctly using the position sizing formula, hitting your stop will never exceed your max loss per trade. The danger is when traders move their stops or trade without stops at all - at that point there is no limit to the loss on a single trade.</p><h3>When to Reduce Your Max Loss</h3><p>During a losing streak, reduce your max loss per trade. If you have lost three trades in a row, cut your size in half. If you have lost five in a row, stop trading and review your trades before continuing. Losses come in streaks and protecting your capital during those streaks is what allows you to still be trading when conditions improve.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The worst trading days are the ones where a trader takes one large loss, feels the need to make it back immediately, takes another large loss, and spirals. A hard limit on loss per trade prevents this. Honor your max loss number as if it is a law, not a suggestion.</p></div>`},
'b-rm-2':{title:'Max Loss Per Day',content:`<p>Your daily max loss is the total amount you are willing to lose in a single trading day before stopping completely. This is one of the most important rules you will ever set for yourself and one of the hardest to follow when you are in the middle of a bad day.</p><h3>Setting Your Daily Max Loss</h3><p>A common framework is to set your daily max loss at 3x your max loss per trade. If your max loss per trade is $100, your daily max loss is $300. Once you hit $300 in losses for the day, your trading day is over. You close any open positions, you close your platform, and you do not trade again until tomorrow.</p><h3>Why This Rule Exists</h3><p>Bad trading days rarely stop at one loss. A trader who has one bad trade and does not have a daily max loss rule will often take a second trade immediately to try to recover - and lose again. Then a third trade, larger this time. By the end of the day what started as a $100 loss has become a $1,000 loss. The daily max loss rule prevents the avalanche. One bad day stays a bad day instead of becoming a catastrophic day.</p><h3>The Discipline Required</h3><p>The daily max loss rule only works if you honor it without exceptions. The moment you say this one time I will make an exception is the moment it stops being a rule. Write it down. Post it near your monitor. Stop trading the moment you hit it regardless of what you think is setting up next.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Your best trading days and your worst trading days are both equally important to your development. On your worst days, the max loss rule is what keeps a bad day from becoming a week-long setback. The traders who develop longevity in this business are not the ones who never have bad days - they are the ones who contain their bad days.</p></div>`},
'b-rm-3':{title:'Paper Trading Protocol',content:`<p>Paper trading is practicing with simulated money in real market conditions. Done correctly it is one of the most valuable tools available to a developing trader. Done incorrectly it teaches you nothing and creates bad habits.</p><h3>How to Paper Trade Correctly</h3><p>Trade your exact position sizes as if the money were real. If your real account would allow you 100 shares using the position sizing formula, paper trade 100 shares - not 1,000 because it does not matter. The habits you build in paper trading are the habits you bring to real trading. Practice the right behaviors from the start.</p><h3>Trade in Real Time</h3><p>Paper trade during actual market hours using live prices - not delayed data, not after the fact. The emotional pressure of watching a position in real time is different from reviewing it after you know the outcome. You need to experience making decisions in real time even if the money is not real.</p><h3>Track Everything</h3><p>Keep a paper trading journal identical to what you would keep for real money. Record every trade, your entry, your stop, your target, the result, and what you learned. Review it weekly. The traders who take paper trading seriously develop faster than those who treat it as a game.</p><h3>When to Go Live</h3><p>Consider transitioning to real money when you have been profitable on paper for at least 30 consecutive trading days, you can articulate a clear reason for every trade you take, and you are following your rules consistently. Profitability on paper does not guarantee profitability with real money but consistent rule-following on paper does translate.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Most traders rush from paper trading to real money too quickly. The urgency to trade real money is emotional, not rational. The market will be there when you are ready. Take the time you need in paper trading to build genuine confidence in your process.</p></div>`},
'b2-3':{title:'Relative Volume (RVOL)',content:`<p>Relative volume is one of the most important numbers in a trader's pre-market routine. It tells you how much volume a stock is trading compared to its average volume at the same time of day. A stock trading at 5x relative volume is exceptional. A stock trading at 0.3x relative volume is dead money.</p><h3>What RVOL Tells You</h3><p>When a stock has unusually high relative volume it means something is happening. News, earnings, unusual options activity, sector catalyst - something has attracted significant attention to this stock today. High RVOL is the first filter because it means the stock is alive and moving with real participation. Low RVOL means even if the chart looks perfect, there are not enough participants to push it where you need it to go.</p><h3>The RVOL Threshold</h3><p>As a general guideline, look for stocks with at least 1.5x to 2x relative volume as a baseline for day trading. Above 3x is strong. Above 5x is exceptional and often indicates a major catalyst. Below 1x means the stock is trading below its normal activity level and setups on that stock carry lower probability of follow-through.</p><h3>How to Use RVOL Pre-Market</h3><p>Before the market opens, sort your scanner by relative volume to see which stocks are already trading significantly above their normal pre-market volume. These are your candidates for the day. A stock at 10x relative volume pre-market with a clear catalyst is on every active trader's radar that morning.</p><h3>RVOL During the Day</h3><p>Watch how relative volume changes throughout the session. A stock that starts the day at 5x RVOL but falls to 1x RVOL by 10am is losing participation. A stock that starts moderate and climbs to 4x RVOL by midday is attracting increasing attention - something is building.</p><div class="callout"><div class="callout-label">TST Edge</div><p>No RVOL, no trade. This is a rule worth following strictly as a beginner. Every setup looks better with high relative volume behind it. Volume is conviction. Relative volume tells you how unusual that conviction is today.</p></div>`},
'b10-7':{title:'Average True Range (ATR)',content:`<p>Average True Range measures the average daily price range of a stock over a specific period - typically 14 days. It tells you how much a stock typically moves, which is essential for placing intelligent stops and setting realistic targets.</p><h3>What ATR Tells You</h3><p>A stock with an ATR of $2.00 typically moves $2.00 from its high to its low in a given day. A stock with an ATR of $0.30 typically moves only $0.30. This matters enormously for stop placement. A stop 20 cents below your entry on a stock with a $2.00 ATR will almost certainly get hit by normal price noise even if the trade is going exactly as planned.</p><h3>Using ATR for Stop Placement</h3><p>A common method is to place your stop at 0.5x to 1x ATR below your entry on a long position. If a stock has a $1.00 ATR, your stop might be $0.50 to $1.00 below your entry. This gives the trade room to breathe through normal volatility without being stopped out by noise. Stops tighter than 0.5x ATR on a volatile stock will produce a very high rate of being stopped out on valid setups.</p><h3>ATR for Position Sizing</h3><p>ATR plugs directly into the position sizing formula. If ATR tells you your stop needs to be $1.00 away and you have a $100 max loss per trade, you can take 100 shares. If ATR tells you your stop needs to be $2.00 away, you can only take 50 shares to maintain the same dollar risk. ATR keeps your risk consistent across different stocks with different volatility profiles.</p><h3>ATR for Target Setting</h3><p>Targets should also be set relative to ATR. Targeting a $0.25 move on a stock with a $2.00 ATR makes little sense - that is a 12% move relative to normal range. A target of 1x to 2x ATR from your entry is realistic and achievable on a good setup.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Add ATR to every chart you trade. Before you place any stop, check the ATR. A stop that feels tight and clean on a chart can be dangerously close when you factor in the stock's normal daily volatility. ATR grounds your stop placement in reality rather than chart aesthetics.</p></div>`},
'n3-0':{title:'The Opening Range',content:`<p>The opening range is the high and low of the first period of trading after the market opens. It is one of the most important reference points of every trading day and is used by professional traders as a key decision-making tool throughout the session.</p><h3>What Is the Opening Range</h3><p>Most traders define the opening range as the first 5 minutes, 15 minutes, or 30 minutes of trading. The high and low established during this period create two critical levels. These levels act as support and resistance for the rest of the day more consistently than almost any other intraday level.</p><h3>The Opening Range Breakout</h3><p>When price breaks above the opening range high with strong volume, it is a bullish signal suggesting the buyers who showed up at the open are in control. When price breaks below the opening range low with strong volume, it is a bearish signal. These breakouts are high probability setups precisely because so many professional traders are watching the same levels.</p><h3>The Opening Range as a Filter</h3><p>Use the opening range to set your directional bias for the morning. If price is above the opening range midpoint, your bias should be bullish and you should favor long setups. If price is below the midpoint, your bias should be bearish. Trading against the opening range bias is low probability and requires exceptional setup quality to justify.</p><h3>The Opening Range Hold</h3><p>Sometimes more valuable than the breakout is when a stock tests the opening range high or low and holds. A pullback to the opening range high that holds as new support is a continuation long setup. A bounce to the opening range low that fails as resistance is a continuation short setup.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Mark the opening range high and low on every stock you are watching every single morning. These two lines should be among the first things drawn on your chart. Everything that happens for the rest of the day has context relative to these levels.</p></div>`},
'n3-1':{title:'The First 5 Candles',content:`<p>The first five candles after the market opens are arguably the most information-dense five minutes of the trading day. They tell you whether the day will be trending or choppy, whether buyers or sellers are in control, and whether your pre-market thesis is playing out or failing.</p><h3>What to Look For</h3><p>Are the candles large or small? Large candles mean high volatility and directional conviction. Small candles mean indecision and potential chop. Is there a clear direction or is price whipping back and forth? Is volume expanding or contracting? Is the stock holding above its opening price or fading below it?</p><h3>The Character of the Day</h3><p>The first five candles establish the character of the day. A stock that opens with five consecutive large green candles on expanding volume is telling you it wants to go higher. A stock that opens with a gap up but immediately sells off with large red candles is telling you the gap may fill. Read what the market is giving you, not what you want to see.</p><h3>The No-Trade Zone</h3><p>Many experienced traders have a personal rule of not entering trades during the first five minutes of trading. The reasoning is sound - the open is the most volatile and unpredictable period of the day, spreads are wider, and the direction established in the first five minutes sometimes reverses completely by minute ten. Watching the first five candles gives you information without requiring you to risk capital during the most uncertain period.</p><h3>After the First Five</h3><p>Once the first five candles have formed, you have a much clearer picture. You know the opening range, you have seen how the stock reacted to its pre-market levels, and you have an initial read on direction. Now your setups have context. An entry at 9:40 AM is a very different proposition than an entry at 9:31 AM.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Train yourself to watch without touching during the first five minutes. This discipline alone will save you from some of your worst trades. The trades that hurt the most are often the ones taken in the first sixty seconds when everything feels urgent but nothing is actually clear yet.</p></div>`},
'n3-2':{title:'Time of Day Filters',content:`<p>Not all hours of the trading day are equal. Specific setups work dramatically better at specific times. Understanding when to use each setup is as important as the setup itself.</p><h3>The Open (9:30 - 10:30 AM)</h3><p>The highest volume, highest volatility period of the day. Breakout setups from pre-market levels work best here. Gap and go plays, opening range breakouts, and momentum entries all have their highest probability of success in this window. This is also where the most damage is done to undisciplined traders who act without a plan.</p><h3>Mid-Morning (10:30 AM - 12:00 PM)</h3><p>Volume begins to decline. Trend-following setups work well early in this period when morning momentum is still intact. By 11:00 AM, be more selective. By 11:30 AM, the best morning setups have already played out.</p><h3>Midday (12:00 PM - 2:00 PM)</h3><p>The lowest volume, lowest reliability period of the day. Spreads widen, price action becomes choppy, and false breakouts are common. Mean reversion setups have their best performance midday because stocks tend to range rather than trend. Most experienced day traders dramatically reduce activity or stop trading entirely during this window.</p><h3>Power Hour (3:00 - 4:00 PM)</h3><p>Volume returns as institutions rebalance portfolios and traders position for the next day. Continuation setups in stocks that trended strongly in the morning often resume. Breakout setups from afternoon consolidations work well with the afternoon volume surge providing confirmation.</p><div class="callout"><div class="callout-label">TST Edge</div><p>If you removed every trade you took between 11:30 AM and 2:30 PM from your history, most traders would find their results improve significantly. Midday chop is where disciplined traders sit on their hands and undisciplined ones give back their morning gains.</p></div>`},
'n-ec':{title:'The Economic Calendar',content:`<p>The economic calendar is a schedule of major government and institutional reports that move the market. Ignoring it is like driving without checking the weather forecast. Trading on a major economic announcement day without preparation is one of the most avoidable mistakes a trader can make.</p><h3>The Major Reports</h3><p><strong>CPI (Consumer Price Index)</strong> - Released monthly, measures inflation. High inflation prints cause the Fed to raise rates which typically sells off growth stocks and the broader market. Low inflation prints cause rallies. This is one of the most market-moving reports of the month.</p><p><strong>FOMC (Federal Reserve Meetings)</strong> - Eight times per year the Federal Reserve announces interest rate decisions. The hours leading up to and immediately following the announcement are characterized by extreme volatility and unpredictability. Most active traders dramatically reduce position size on FOMC days.</p><p><strong>Jobs Report (Non-Farm Payrolls)</strong> - Released the first Friday of each month. Strong jobs numbers can be interpreted as bullish or bearish depending on the inflation environment. This report consistently moves the market significantly in the first hour after release.</p><p><strong>GDP</strong> - Quarterly measure of economic output. Major beats or misses cause significant sector rotation.</p><p><strong>Earnings Reports</strong> - Individual company earnings seasons affect stocks directly but also create sector-wide moves when major companies report.</p><h3>How to Use the Calendar</h3><p>Check the economic calendar every morning before the market opens. Know what reports are releasing that day and at what time. Bookmarkinvesting.com/economic-calendar - it is the most comprehensive free calendar available. Any report marked as High Impact in red deserves your full attention.</p><h3>How to Adjust Your Trading</h3><p>On high-impact report days, reduce your position sizes by 50% until after the announcement. Widen your stops to account for the spike volatility that follows. Avoid holding positions through the announcement unless you have a specific thesis for doing so. After the report releases and price stabilizes, conditions often return to normal and your regular setups become valid again.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The economic calendar is free information that professional traders use every single day. Not knowing that a major Fed announcement is at 2:00 PM when you are holding a position at 1:58 PM is inexcusable preparation. Make checking the calendar as automatic as brushing your teeth in the morning.</p></div>`},
'n-halt':{title:'Halts and Circuit Breakers',content:`<p>Trading halts are temporary pauses in trading activity on a specific stock or across the entire market. They happen more frequently than most beginners realize and understanding them is essential - particularly if you trade small cap or volatile stocks.</p><h3>Individual Stock Halts</h3><p>Individual stocks can be halted for several reasons. News halts occur when a company has pending news material enough to affect the stock price - the exchange pauses trading until the news is released. Volatility halts, also called LULD (Limit Up Limit Down) halts, occur when a stock moves too far too fast in a short period. When a stock is halted, you cannot buy or sell your position until trading resumes.</p><h3>LULD Halts</h3><p>The LULD mechanism prevents stocks from moving more than a specified percentage in a five-minute window. For most stocks, if price moves 5% or more in five minutes it triggers a trading pause of five minutes. For more volatile small cap stocks, the threshold is wider. When a halt occurs, you will see your platform freeze on that stock. Orders cannot be placed or cancelled during the halt.</p><h3>Market-Wide Circuit Breakers</h3><p>If the S&P 500 falls 7% in a single day, all US markets halt for 15 minutes. A 13% decline triggers another 15-minute halt. A 20% decline closes the market for the rest of the day. These circuit breakers have only been triggered a handful of times in history but knowing they exist and what they mean is important.</p><h3>Trading Around Halts</h3><p>When a stock you own gets halted, remain calm. Halts are temporary. If it is a news halt, the stock will resume trading after the news is released - sometimes higher, sometimes lower. Do not panic about a halt. If it is a LULD halt on the upside on a small cap you own, the stock typically resumes and continues higher. If it is a halt on the downside, it often continues lower on resumption.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Small cap traders experience halts regularly. A stock that is running 50% on the day will halt multiple times as it triggers LULD thresholds. Learn to recognize halts quickly and understand they are part of the normal trading environment on volatile stocks.</p></div>`},
'a1-3':{title:'Short Interest and Days to Cover',content:`<p>Short interest is the number of shares that have been sold short and not yet covered. It is one of the most important data points for identifying squeeze potential and understanding the risk profile of a position.</p><h3>Short Interest Percentage</h3><p>Short interest is typically expressed as a percentage of the float. A stock with 5% short interest is lightly shorted. A stock with 30% short interest is heavily shorted. A stock with 50% or more short interest is extremely heavily shorted and is a potential squeeze candidate if positive catalysts emerge.</p><h3>Days to Cover</h3><p>Days to cover, also called short ratio, tells you how many days of average trading volume it would take for all short sellers to cover their positions. A days-to-cover ratio of 10 means it would take 10 average trading days of buying for all shorts to buy back their shares. High days to cover means short sellers are trapped - they cannot exit quickly without pushing the price up against themselves.</p><h3>How to Find Short Interest Data</h3><p>Finviz.com shows short interest percentage for any stock. Webull shows it in the stock fundamentals section. Short interest data is updated twice per month, so it is slightly delayed but still highly useful as a background indicator.</p><h3>Using Short Interest in Your Trading</h3><p>High short interest alone is not a reason to buy a stock. High short interest plus a positive catalyst plus a technical breakout is a powerful combination. The short sellers become forced buyers when the stock moves against them, adding buying pressure on top of the existing demand. This is the fuel for short squeezes.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The most explosive moves in the market often happen in heavily shorted stocks. When the narrative shifts from bearish to bullish on a stock with high short interest, short sellers must cover while new buyers are simultaneously buying. Supply shrinks and demand explodes. Understanding short interest gives you an edge in identifying these situations before they happen.</p></div>`},
'a1-4':{title:'Float Rotation',content:`<p>Float rotation is a concept specific to small cap trading that describes what happens when a stock's daily trading volume exceeds its total float. When more shares have traded than actually exist in the public float, it means every share has changed hands at least once that day - and some have changed hands multiple times.</p><h3>What Float Rotation Means</h3><p>A stock with a 2 million share float that has already traded 8 million shares by noon has done 4x float rotation. This is an extraordinarily active stock. The same shares are being bought and sold repeatedly by traders trying to capture intraday moves. This creates extremely volatile, fast-moving price action that can produce both massive gains and massive losses in very short time periods.</p><h3>How Float Rotation Affects Price Action</h3><p>As float rotation increases throughout the day, the stock's behavior changes. Early in the day on the first float rotation, price action is more orderly. By the third and fourth float rotation, the stock is often dominated by scalpers and momentum traders moving in and out rapidly. Support and resistance levels become less reliable. Moves become more exaggerated in both directions.</p><h3>When Float Rotation Signals a Top</h3><p>Extremely high float rotation combined with a climax volume candle that closes weak is often a sign that the move is exhausting. All the interested buyers have already bought. The float has passed through multiple sets of hands. There are no new buyers left - only holders who will sell on any strength.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Monitoring float rotation on small cap runners helps you understand where you are in the move. First float rotation often offers the best risk/reward. By the fifth or sixth float rotation, the risk of a violent reversal is extremely high and only the most experienced traders should be participating.</p></div>`},
'n-sect':{title:'Sector Rotation',content:`<p>Sector rotation is the movement of money from one sector of the market to another. It happens continuously as economic conditions change, interest rates shift, and investor sentiment evolves. Understanding sector rotation gives you a significant edge in knowing which stocks to be in and which to avoid.</p><h3>How Sector Rotation Works</h3><p>The market is not one thing - it is a collection of sectors, each responding differently to economic conditions. When interest rates rise, technology and growth stocks typically underperform while financials and energy often outperform. When the economy is slowing, defensive sectors like consumer staples and healthcare hold up better than cyclicals. Money flows out of one area and into another constantly.</p><h3>The Sector ETFs to Watch</h3><p>XLK is technology. XLE is energy. XLF is financials. XLV is healthcare. XLP is consumer staples. XLI is industrials. XLB is materials. XLU is utilities. Watching the relative performance of these ETFs against SPY tells you which sectors are in favor and which are not. When XLK is dramatically outperforming SPY, tech names will generally have better setups. When XLE is outperforming, energy names are the place to be.</p><h3>Using Sector Rotation in Your Trading</h3><p>Before scanning for individual stocks, check which sectors are strongest. Then look for your setups within those leading sectors. You want the wind at your back - buying a breakout in a sector that is leading the market is a much higher probability trade than buying a breakout in a sector that is lagging.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Many retail traders pick stocks without ever considering what sector those stocks are in or whether that sector is in or out of favor. Adding a simple step of checking sector performance before your daily scan will significantly improve the quality of your trade selection.</p></div>`},
'b-lev2-3':{title:'Bid-Ask Spread Mechanics',content:`<p>The bid-ask spread is the difference between the highest price a buyer will pay (the bid) and the lowest price a seller will accept (the ask). Every time you trade, you pay this spread. Understanding it is essential for calculating your actual trading costs and for knowing when a trade is even worth taking.</p><h3>The Cost of the Spread</h3><p>If a stock is bid $10.00 and ask $10.05, the spread is $0.05 per share. If you buy 1,000 shares at the ask and immediately sell at the bid, you lose $50 before the stock moves even one cent in your direction. On liquid large-cap stocks, spreads are typically $0.01 or less. On illiquid small-cap stocks, spreads can be $0.10, $0.25, or even $1.00 or more.</p><h3>How Spreads Affect Profitability</h3><p>A wide spread raises your break-even point on every trade. If you buy at the ask with a $0.10 spread, the stock needs to move at least $0.10 just for you to get back to flat. On a stock with a $0.50 ATR, a $0.10 spread means you are starting every trade needing a 20% move of the daily range just to break even. This is why illiquid stocks with wide spreads are difficult to trade profitably.</p><h3>Limit Orders vs Market Orders and Spreads</h3><p>When you use a market order, you automatically pay the spread. You buy at the ask and sell at the bid. When you use a limit order at or below the bid, you can sometimes capture the spread instead of paying it. This is called being a market maker rather than a market taker. Most active traders use limit orders specifically to control their spread cost.</p><h3>The Spread as a Liquidity Signal</h3><p>A tight spread signals high liquidity - many buyers and sellers are actively participating. A wide spread signals low liquidity - few participants, meaning your order can move the price against you and getting out of a bad trade may be costly. Always check the spread before entering any position.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Before entering any trade, check the bid-ask spread on Level 2. If the spread is more than 0.5% of the stock price, think carefully about whether the potential reward justifies the built-in cost. On small caps, the spread alone can be the difference between a profitable strategy and an unprofitable one.</p></div>`},
'n-ssvs':{title:'Setup vs Signal',content:`<p>One of the most important distinctions in trading is understanding the difference between a setup and a signal. Confusing the two leads to premature entries that consistently underperform. Mastering this distinction is what separates reactive traders from disciplined ones.</p><h3>What Is a Setup</h3><p>A setup is a set of conditions that indicate a trade opportunity may be forming. A stock pulling back to its 20-day moving average in an uptrend is a setup. A stock consolidating in a tight flag formation after a strong move up is a setup. A stock approaching a key support level on low volume is a setup. The setup tells you to pay attention - it does not tell you to act.</p><h3>What Is a Signal</h3><p>A signal is the specific price action that confirms the setup and triggers the entry. The signal for a pullback to the 20-day moving average is a strong green candle bouncing off that level with expanding volume. The signal for a flag breakout is a candle closing above the upper boundary of the flag on above-average volume. The signal turns the opportunity into a trade.</p><h3>Why This Distinction Matters</h3><p>Entering on the setup instead of waiting for the signal is one of the most common beginner mistakes. You see the stock approaching a key level and you buy - before the bounce has been confirmed. The stock then continues through the level, stops you out, and then reverses and goes where you expected. You were right about the setup but wrong about the timing because you entered on the setup rather than the signal.</p><h3>Building Your Signal Criteria</h3><p>For every setup in your playbook, define the specific signal that triggers your entry. What candle, what volume level, what price action constitutes your signal for this specific setup? Write it down. Without a defined signal, every trade becomes a judgment call in the moment - which is where discipline breaks down.</p><div class="callout"><div class="callout-label">TST Edge</div><p>When you feel the urge to enter a trade and you have not yet seen your signal, ask yourself one question: am I entering on the setup or the signal? If the answer is the setup, wait. The signal will come or it will not. Either way, waiting for it is always the right choice.</p></div>`},
'n-corr':{title:'Position Correlation',content:`<p>Correlation describes how similarly two assets move. When you hold multiple positions that are highly correlated, you are not diversified - you are taking the same trade multiple times. Understanding correlation prevents the mistake of thinking you are spread across different trades when you are actually concentrated in one directional bet.</p><h3>Common Correlation Traps</h3><p>You are long NVDA, long AMD, long SMCI, and long QQQ calls. These are four positions but they are all essentially the same trade - long semiconductor stocks and long tech. When the sector sells off, all four positions lose simultaneously. You have not spread your risk, you have multiplied it.</p><h3>How to Check Correlation</h3><p>Ask a simple question before adding any new position: how will this position perform if the market or sector I am already exposed to sells off sharply? If the answer is that it will also sell off, you are adding correlated risk. If the answer is that it might hold up or even gain, you are adding diversification.</p><h3>Sector Correlation</h3><p>Stocks within the same sector are almost always highly correlated. If you want to hold two tech positions, understand that both will tend to move in the same direction. This is acceptable if it is intentional. The problem arises when traders think they are diversified across multiple positions without realizing all those positions move together.</p><h3>Intentional Correlation vs Accidental Concentration</h3><p>If you have strong conviction in the tech sector today and want that exposure, holding multiple tech names is a reasonable choice. The key word is intentional. Accidental concentration - where you end up heavily exposed to one sector without realizing it - is what you need to avoid.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Before adding any new position, list your current open positions and ask if they are all correlated to the same macro outcome. If yes, you are already exposed to that outcome. Adding another correlated position does not diversify your risk - it compounds it.</p></div>`},
'n-paus':{title:'The 3-Second Rule',content:`<p>The three-second rule is simple: before clicking the buy or sell button on any trade, pause for three seconds and ask yourself one question. Am I entering because this is my setup or because I am reacting to something I see moving on my screen?</p><h3>Why Three Seconds</h3><p>Three seconds is enough time for your rational brain to override your emotional brain. In the middle of a fast-moving market, the emotional urge to act is powerful. Price is moving, you feel like you are missing something, you want in. That urgency is almost never justified and very often leads to trades that are outside your system.</p><h3>The Question to Ask</h3><p>Is this my setup? Specifically: is the trigger I am about to act on one of the 2-3 defined setups in my playbook? Does it have my required confirmation signals present? Is the risk/reward acceptable at this exact moment? If you cannot answer yes to all three in three seconds, do not take the trade.</p><h3>What the Pause Prevents</h3><p>The three-second pause prevents: FOMO entries on stocks you were not watching that suddenly appear in your feed, revenge trades after a loss, oversized entries because a stock is moving fast, and entries on setups that look similar to yours but are not actually yours. Most of the worst trades in any trader's history would have been prevented by three seconds of deliberate thought.</p><h3>Building the Habit</h3><p>Start practicing this in paper trading. Every single entry, pause three seconds and answer the question out loud. Yes, actually say it out loud. The verbalization forces your brain to engage with the question rather than bypassing it. After 30 days of deliberate practice, the pause becomes automatic.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The traders who make the most mistakes are the fastest. Speed in execution is valuable once you know exactly what you are doing. Speed in decision-making before you have defined setups and clear signals is just impulsiveness with a trading platform.</p></div>`},
'psy-4':{title:'Trading Through Drawdowns',content:`<p>A drawdown is a period of consecutive losses or a significant reduction in your account value from a previous peak. Every trader experiences drawdowns. How you respond to them determines whether you survive and grow or blow up your account trying to get even.</p><h3>The Psychology of a Drawdown</h3><p>When you are in a drawdown, your thinking changes in predictable ways that make it worse. You start taking trades you would not normally take because you feel the need to make the money back. You hold losers longer hoping they will recover. You cut winners too early because you are afraid of giving back gains. Each of these behaviors is emotional, not rational, and each makes the drawdown deeper.</p><h3>The Rules for Drawdowns</h3><p>First, cut your size immediately. If you have lost more than 5% of your account in a week, reduce position size by 50% until you return to profitability. If you have lost 10%, stop trading for at least two days and review every trade you have taken. Second, only take A-quality setups. No B-minus setups trying to scalp back losses. High quality only. Third, do not try to make the money back in one trade. It took multiple trades to create the drawdown and it will take multiple trades to recover from it.</p><h3>When to Stop Trading Completely</h3><p>If you have lost 15% or more of your account in a short period, stop trading completely. Review everything. Talk to someone you trust about what happened. The trades will still be there when you come back. The market is always open. Your capital is finite. Protect it first.</p><h3>The Recovery</h3><p>Recovering from a drawdown requires patience more than aggression. Return to your smallest position sizes. Take only your clearest setups. Focus entirely on execution quality rather than P&L. The money comes back when your process is right. Chasing the money directly almost always makes the drawdown worse.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The traders who survive long enough to become consistently profitable are not the ones who never had drawdowns. They are the ones who learned to contain their drawdowns before they became catastrophic. A 10% drawdown that you manage correctly is a learning experience. A 50% drawdown that you let spiral is potentially career-ending.</p></div>`},
'tax-0':{title:'Trader Tax Basics',content:`<p>Trading has specific tax implications that are different from regular investment income. Not understanding the basics can result in a significant unexpected tax bill at the end of the year. This is an overview of the key concepts - consult a CPA or tax professional for advice specific to your situation.</p><h3>Short-Term vs Long-Term Capital Gains</h3><p>When you sell a stock for a profit, the gain is taxed as short-term capital gains if you held the position for one year or less. Short-term capital gains are taxed as ordinary income - the same rate as your salary. If you held for more than one year, it qualifies for long-term capital gains rates which are significantly lower. For most active traders who hold positions for minutes to weeks, virtually all profits are taxed at short-term rates.</p><h3>The Wash Sale Rule</h3><p>The wash sale rule prevents you from claiming a tax loss if you buy the same or substantially identical security within 30 days before or after selling it at a loss. If you sell AAPL at a loss on Monday and buy it back on Wednesday, the loss is disallowed for tax purposes. This catches many traders off guard, particularly those who frequently trade the same names.</p><h3>Trader Tax Status</h3><p>The IRS recognizes a Trader Tax Status that allows active traders to deduct trading-related expenses such as platform fees, data subscriptions, education, and home office expenses. Qualifying for Trader Tax Status requires trading frequently, trading to profit from short-term price movements rather than long-term investment, and meeting certain activity thresholds. A tax professional who specializes in traders can help determine if you qualify.</p><h3>Quarterly Estimated Taxes</h3><p>If trading is generating significant profits, you may be required to pay quarterly estimated taxes to avoid penalties at year end. The IRS expects taxes to be paid as income is earned throughout the year, not just at tax time.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Keep detailed records of every trade throughout the year. Most brokerages provide year-end tax documents but having your own records allows you to catch errors. Consult a CPA who specializes in trading taxes - the cost of professional tax advice is significantly less than the cost of a tax surprise in April.</p></div>`},
'o-cc':{title:'Covered Calls',content:`<p>A covered call is an options strategy where you own 100 shares of a stock and sell a call option against those shares. You collect the option premium immediately and in exchange you cap your upside at the strike price of the call you sold. It is one of the most commonly used strategies by stock owners to generate additional income from their existing positions.</p><h3>How It Works</h3><p>You own 100 shares of AAPL at $190. You sell one call option with a $195 strike price expiring in 30 days and collect $2.00 in premium, which is $200 total. Two outcomes are possible. If AAPL stays below $195 at expiration, the call expires worthless, you keep the $200 premium, and you still own your shares. If AAPL rises above $195, your shares are called away at $195 and you miss any gain above that level - but you still made $5 on the shares plus the $2 premium for a total of $7 per share.</p><h3>When to Use Covered Calls</h3><p>Covered calls work best on stocks you are willing to sell at the strike price and when you expect the stock to move sideways or only slightly higher in the near term. They are a way to generate income from a stagnant position rather than waiting for a large move that may not come.</p><h3>The Risk</h3><p>The risk of a covered call is not losing money on the option - that is limited to the premium you collected. The risk is that you own the stock. If the stock falls significantly, the premium you collected is small consolation for the loss on the shares themselves. Covered calls reduce your cost basis but they do not protect you from large downside moves.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Covered calls are one of the few options strategies where time decay works in your favor. Every day that passes and the stock does not rise above your strike, the call you sold loses value and your position profits. Selling covered calls consistently on a portfolio of quality stocks you want to hold long term is a legitimate income strategy.</p></div>`},
'o-csp':{title:'Cash-Secured Puts',content:`<p>A cash-secured put is a strategy where you sell a put option on a stock you would be willing to own at the strike price, and you set aside the cash to buy those shares if necessary. You collect premium immediately. If the stock stays above the strike, you keep the premium. If it falls below the strike, you buy the shares at the strike price - which you already wanted to do.</p><h3>How It Works</h3><p>You want to own MSFT but you think it is slightly overvalued at $420. You sell a put option with a $400 strike price expiring in 30 days and collect $3.00 in premium, which is $300 total. You set aside $40,000 in cash to buy the shares if needed. If MSFT stays above $400, the put expires worthless and you keep the $300 - essentially getting paid to wait for a better entry. If MSFT falls below $400, you are assigned 100 shares at $400 - but your real cost basis is $397 because of the $3 premium you collected.</p><h3>When to Use Cash-Secured Puts</h3><p>Cash-secured puts work best on quality stocks you genuinely want to own at a lower price. They are a way to get paid while waiting for your entry point. If you were planning to place a limit buy order at $400 anyway, selling the put instead is almost always superior - you get paid to wait rather than just waiting.</p><h3>The Risk</h3><p>The risk is owning the stock at the strike price if it falls significantly below that level. If MSFT falls to $350, you are still obligated to buy at $400. The premium collected provides only minor cushion. Only sell puts on stocks you genuinely want to own and only at prices you are comfortable paying.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Cash-secured puts combined with covered calls form a complete wheel strategy. You sell puts to acquire stock at a discount. Once assigned, you sell covered calls to generate income and potentially exit at a higher price. Rinse and repeat. The wheel strategy is one of the most reliable income-generating options approaches for patient traders.</p></div>`},
'o-vs':{title:'Vertical Spreads',content:`<p>A vertical spread is an options strategy where you simultaneously buy one option and sell another option of the same type and expiration but at a different strike price. Spreads cap both your maximum gain and your maximum loss, making them more defined-risk than buying options outright. They are often more capital-efficient than buying single options.</p><h3>Bull Call Spread</h3><p>You buy a call at a lower strike and sell a call at a higher strike. Example: buy the $50 call and sell the $55 call on the same expiration. Your maximum gain is the difference between the strikes minus what you paid for the spread. Your maximum loss is what you paid for the spread. If you paid $2 for the spread and the stock goes above $55 at expiration, you make $3 on your $2 investment. If the stock stays below $50, you lose the full $2.</p><h3>Bear Put Spread</h3><p>You buy a put at a higher strike and sell a put at a lower strike. Example: buy the $50 put and sell the $45 put. Your maximum gain is the difference between the strikes minus what you paid. Your maximum loss is what you paid. This is your directional short trade with defined risk.</p><h3>Why Use Spreads Instead of Single Options</h3><p>Spreads cost less than single options because the option you sell offsets part of the cost of the option you buy. They also reduce the impact of implied volatility changes - the IV affects both legs. For traders who want directional exposure with defined and limited risk, spreads are often more appropriate than single options, particularly around high-volatility events like earnings.</p><div class="callout"><div class="callout-label">TST Edge</div><p>When you buy a single call or put, you need to be right about direction, magnitude, and timing to be profitable. When you buy a spread, the sold option partially funds the trade and reduces your breakeven - you need a smaller move to be profitable. For most directional options trades, a spread offers better risk-adjusted returns than a single long option.</p></div>`},
'n7-5':{title:'Morning Panic and Recovery',content:`<p>The morning panic and recovery is one of the most common and tradeable intraday patterns, particularly in small cap and momentum stocks. It occurs when a stock that opened strong or gapped up sells off sharply in the first 30-60 minutes, flushes out weak holders, and then recovers with equal or greater force.</p><h3>The Setup</h3><p>A stock opens with a gap up or a strong open on a catalyst. Early buyers who bought pre-market or at the open begin taking profits. The selling cascades as stop losses are triggered underneath key levels. Volume is massive during the selloff. Price drops fast and far - often 10-30% from the morning high on a small cap. Then it stops. Volume dries up briefly. A reversal candle forms. And then buyers step back in aggressively.</p><h3>Why It Works</h3><p>The panic flush clears out every weak holder in a short period of time. The shares move from weak hands to strong hands at a much lower price. The catalyst that drove the morning move has not changed - only the price has changed. When buyers recognize that the stock is now 20% cheaper than it was 30 minutes ago with the same fundamental story, they step in with conviction.</p><h3>The Entry</h3><p>The entry is after the flush and after stabilization - not during the panic. Wait for the selling to stop, wait for a base to form at the low, and enter when price reclaims a key level above the base with volume. The stop goes below the flush low. The target is a return toward the morning high.</p><h3>The Danger</h3><p>Not every morning panic recovers. Some stocks continue lower all day. The difference is usually the quality of the catalyst and the volume behavior at the low. A genuine recovery will show volume drying up at the base and then expanding on the reversal. A stock that just keeps selling on consistent volume is not bottoming - it is distributing.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The morning panic and recovery is emotionally difficult to trade because you are buying a stock that just fell 20% and everyone around you is panicking. That discomfort is the edge. By the time the recovery looks obvious, most of the move has already happened. Entry requires conviction that the catalyst is intact and the technical picture at the low supports a reversal.</p></div>`},
'n-multi':{title:'Multi-Timeframe Analysis',content:`<p>Multi-timeframe analysis is the practice of examining the same stock on multiple timeframes before making a trading decision. No single timeframe tells the complete story. Using multiple timeframes together gives you context, direction, and precise entry points simultaneously.</p><h3>The Top-Down Approach</h3><p>Always start with the higher timeframe and work down to the lower timeframe. The higher timeframe establishes the trend and the key levels. The lower timeframe provides the entry trigger. This order is non-negotiable. A setup on a 5-minute chart that conflicts with the direction on the daily chart is a low-probability trade. A setup that aligns with the daily trend is a high-probability trade.</p><h3>The Three-Timeframe System</h3><p>A common and effective approach uses three timeframes simultaneously. The daily chart tells you the macro trend and the important support and resistance levels. The 15-minute chart shows you the intraday structure and whether the morning trend is intact. The 5-minute chart shows you the specific setup and the entry trigger. Each timeframe has a specific job.</p><h3>What Alignment Means</h3><p>Timeframe alignment means all three timeframes are pointing in the same direction. The daily is in an uptrend. The 15-minute shows a healthy pullback within that uptrend. The 5-minute shows a base forming at support with volume drying up. That is three-timeframe alignment on a long setup - one of the highest probability entry conditions available.</p><h3>Conflict Between Timeframes</h3><p>When timeframes conflict - for example, the daily is in an uptrend but the 15-minute is showing a significant downtrend with lower highs and lower lows - wait for resolution before trading. Entering in a timeframe conflict situation means you are fighting one timeframe no matter which direction you choose.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The traders who consistently take high-probability entries are the ones who check multiple timeframes before every trade. The traders who are frequently surprised by reversals are the ones who traded a setup on one timeframe without checking if the higher timeframes agreed. Make multi-timeframe analysis automatic - check all three before every entry.</p></div>`},
'a5-5':{title:'Setup No-Trade Rules',content:`<p>Every setup in your playbook has conditions under which it should not be traded. These are your no-trade rules - specific circumstances where even a technically valid setup carries low enough probability that the trade is not worth taking. Building these rules is as important as building the setups themselves.</p><h3>Time-Based No-Trade Rules</h3><p>Do not take breakout setups in the last 30 minutes of the trading day unless volume is exceptional. End-of-day breakouts frequently fail because institutions are closing positions rather than opening new ones. Do not take any setup in the first two minutes after a major economic announcement - the volatility is too erratic to rely on technical signals. Do not trade your momentum setups during the midday lull between 11:30 AM and 2:00 PM.</p><h3>Market-Condition No-Trade Rules</h3><p>Do not take long breakout setups on a day when SPY is down more than 1.5% - the overall market is working against you. Do not take small cap momentum setups on a VIX above 30 - the volatility is too unpredictable to manage risk reliably. Do not trade any setup after you have already hit your daily max loss - you are done for the day regardless of what you see setting up.</p><h3>Setup-Specific No-Trade Rules</h3><p>Do not take a flag breakout if the flag has lasted more than 20 candles on your trading timeframe - the momentum is gone. Do not take a support bounce if price has tested that support more than four times in the past week - the level is weakening. Do not take any setup on a stock with relative volume below 0.5x - there is not enough participation to generate follow-through.</p><h3>Building Your Own No-Trade Rules</h3><p>Review your losing trades over the past three months. Look for patterns - what time of day did they occur, what was the market doing, what were the specific conditions that made those trades underperform? The conditions that consistently appear in your losing trades become your no-trade rules.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Your no-trade rules are just as important as your trade rules. A playbook without no-trade rules is incomplete. The setup that you do not take because the conditions are wrong is a win just as much as a profitable trade. Discipline means knowing when not to act.</p></div>`},
'a5-6':{title:'Building Your Stock Universe',content:`<p>Professional traders do not wake up every morning and scan thousands of stocks looking for anything that moves. They develop a personal stock universe - a specific group of 5-20 stocks they understand deeply and trade repeatedly. This approach creates edge through familiarity.</p><h3>Why a Defined Universe Works</h3><p>When you trade the same stocks repeatedly, you learn their personalities. You know how NVDA reacts to its 20-day moving average. You know that SPY tends to find support at its opening range low. You know that your small cap runner typically reverses at its first float rotation. This knowledge is not available to someone who just pulled the stock up for the first time today - it is earned through observation and experience with that specific stock.</p><h3>How to Build Your Universe</h3><p>Start with stocks that match your trading style. If you are a momentum day trader, your universe includes the highest-volume, most-liquid names in the current hot sectors. If you are a swing trader, your universe includes 10-15 stocks with clean technical patterns and strong fundamentals that you monitor daily. Spend 30 days watching each stock before adding it to your active universe.</p><h3>Rotating Your Universe</h3><p>Your stock universe should evolve with market conditions. A momentum stock that has lost its catalyst and volume should be replaced with a name that is currently in play. But resist the urge to constantly add new names - depth of knowledge about a few stocks beats surface knowledge about many.</p><h3>The 30-Day Rule</h3><p>Before trading any stock with real capital, watch it for 30 consecutive trading days. Watch how it reacts to news. Watch how it behaves near support and resistance. Watch its volume patterns. Watch how it trades relative to the broader market. After 30 days of observation you will have an edge over every trader who just pulled it up today.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Pick three stocks and trade only those for your first 90 days. Learn them cold. Know their ATR, their typical daily range, their key levels, and how they behave at those levels. That knowledge is more valuable than any scanner or indicator. Expertise in a few beats dilettantism in many every time.</p></div>`}
,
'sc-intro':{title:'What Is a Small Cap',content:`<p>A small cap stock is generally defined as a company with a market capitalization between $300 million and $2 billion. In trading terms, small cap refers to stocks with relatively few shares available for public trading and lower average daily volume than large cap names. This creates the volatility and opportunity that attract active traders - and the risk that destroys undisciplined ones.</p><h3>Market Cap vs Float</h3><p>Market cap is the total value of all shares outstanding. Float is the number of shares actually available for public trading. A company can have a market cap of $500 million but a float of only 5 million shares if insiders own the majority. Low float is what creates explosive moves. When demand hits a stock with only 2 million shares available, the price can move 50-100% in minutes because there simply are not enough shares to satisfy all the buyers.</p><h3>Why Small Caps Move Differently</h3><p>Small cap stocks do not follow the same rules as large caps. News that would cause AAPL to move 1% can cause a small cap to move 30%. A single large buyer can move the price significantly. Spreads are wider. Volume is thinner. And the risk of manipulation is higher. These characteristics create both the opportunity and the danger.</p><h3>Who Trades Small Caps</h3><p>Retail day traders dominate small cap trading. Institutional money largely avoids small caps because position sizes large enough to matter for an institution would move the stock against them when trying to enter or exit. This retail-dominated environment creates patterns that repeat consistently - patterns that a prepared trader can exploit.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Small cap trading has the highest ceiling and the lowest floor of any trading style. The gains available in a single session on a hot small cap exceed what most large cap traders make in a month. The losses available in a single session can exceed what most large cap traders lose in a year. Respect the power of this market before participating in it.</p></div>`},
'a1-5':{title:'News Catalysts for Small Caps',content:`<p>News is the fuel of small cap trading. Without a catalyst, a small cap stock sits dormant. With the right catalyst, it can move 50-200% in a single session. Learning to evaluate catalysts quickly and accurately is one of the most important skills in small cap trading.</p><h3>The Strongest Catalysts</h3><p><strong>FDA approvals or positive trial data</strong> - for biotech small caps, an FDA approval can be a 10x move. Even early-stage positive data can cause 100-300% moves. These are the most explosive small cap catalysts available.</p><p><strong>Earnings beats with raised guidance</strong> - a small cap that beats earnings expectations by a large margin and raises forward guidance will often gap up significantly. Unlike large caps where earnings moves are priced in, small cap earnings beats are often unexpected.</p><p><strong>Major contract wins or partnerships</strong> - a small cap announcing a contract with a Fortune 500 company or a major government contract can move significantly on the news as the market reprices the company's revenue potential.</p><p><strong>Buyout or merger announcements</strong> - acquisition offers for small caps typically come at a significant premium to the current price. These create immediate large gaps.</p><h3>Weak Catalysts to Avoid</h3><p>Not all news is equal. A small cap announcing a minor partnership, a non-binding letter of intent, or a generic press release about future plans often creates an initial spike that fades quickly. Learn to distinguish between material catalysts that change the fundamental story and marketing catalysts that are designed to generate attention without substance.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Read the actual press release before trading any small cap catalyst. Many traders react to the headline without reading the details. The details often reveal whether the catalyst is real and material or whether it is hype. The traders who read first and trade second consistently outperform those who trade the headline.</p></div>`},
'sc-l2':{title:'Reading L2 on Thin Stocks',content:`<p>Reading Level 2 on a small cap stock is fundamentally different from reading it on a large cap. The order book is thinner, individual orders have more impact, and the signals require different interpretation. Mastering L2 on small caps is one of the most valuable skills for anyone trading in this space.</p><h3>The Thin Order Book</h3><p>On a liquid large cap like AAPL, the Level 2 shows thousands of shares on both the bid and ask at multiple price levels. On a small cap with low float, you might see only a few hundred or a few thousand shares on each level. This means individual participants have more influence on price. A single buyer stepping in aggressively can move the price significantly. A single large seller on the ask can cap a move for extended periods.</p><h3>The Wall</h3><p>A large block of shares on the ask at a specific price is called a wall. On a small cap, a seller with 50,000 shares on the ask at $10.00 is a significant wall. The stock will struggle to push through that level until the wall is absorbed or the seller moves their order. Watch how the wall behaves - if it refreshes every time it gets hit, it is a genuine seller. If it disappears when price approaches, it was a fake wall designed to slow down buyers.</p><h3>Ax Recognition</h3><p>On small caps, certain market makers dominate the order flow. The market maker that is consistently on both sides of the market and moving the most shares is called the ax. Identifying the ax and watching which side they favor gives you important information about the immediate direction.</p><div class="callout"><div class="callout-label">TST Edge</div><p>On small caps, the tape and L2 together tell a story that the chart alone cannot. A chart might show consolidation but the tape might show a market maker aggressively refreshing the bid - that is accumulation that the chart has not yet reflected. Learning to read both simultaneously is what separates experienced small cap traders from beginners.</p></div>`},
'sc-spread':{title:'Managing Wide Spread Positions',content:`<p>Wide spreads are a defining characteristic of small cap trading and one of the most common sources of unexpected losses for new small cap traders. A spread of $0.10, $0.25, or even $1.00 between bid and ask fundamentally changes how you enter, manage, and exit positions.</p><h3>Calculating Your Real Cost</h3><p>Before entering any small cap trade, calculate the spread as a percentage of the stock price. A $0.25 spread on a $5 stock is 5% - meaning the stock needs to move 5% in your direction just for you to break even on the exit. This is not a small friction cost - it is a significant hurdle that must be factored into your target and position sizing from the start.</p><h3>Using Limit Orders Only</h3><p>On small cap stocks with wide spreads, market orders are dangerous. A market buy order fills at the ask - the worst price available. On a stock with a $0.50 spread, that is an immediate $0.50 per share disadvantage. Always use limit orders on small caps. Place your buy limit at or near the ask but never use market orders.</p><h3>Exiting With a Wide Spread</h3><p>The exit is where wide spreads hurt most. When you need to sell quickly, you must hit the bid - taking the worst available price. On a fast-moving small cap, the bid can drop significantly in seconds. If you hold a losing position on a small cap and panic sell, you may exit significantly below where the stock appears to be trading. Account for this when setting your stop loss - your actual exit may be worse than your stop price on a thin stock.</p><h3>Sizing Down for Wide Spreads</h3><p>On stocks with wide spreads, reduce your position size. The increased friction cost means your edge per trade is lower. Compensate by trading smaller and targeting larger moves. A 20% move target on a stock with a 2% spread still leaves an 18% net gain. A 5% move target on the same stock leaves only 3% net - much less margin for error.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The spread is a tax on every trade. On large caps it is negligible. On small caps it is material. Factor it in before every trade and let it influence your target selection. Only take small cap trades where the expected move is large enough to justify the spread cost and still deliver a 2:1 or better reward-to-risk ratio after accounting for the friction.</p></div>`},
'b6-c':{title:'Continuations',content:`<p>Continuation patterns form during a pause or consolidation within an existing trend and signal that the trend is likely to resume in the same direction after the pause ends. They are the most tradeable patterns in active trading because you have the existing trend working in your favor, a defined consolidation period to measure risk against, and a clear entry trigger on the breakout.</p><h3>The Key Continuation Patterns in This Course</h3><p><strong>Flags and Pennants</strong> - sharp move followed by a tight consolidation, then continuation. The most common and reliable continuation pattern for day traders.</p><p><strong>Triangles (Ascending and Descending)</strong> - price coils between converging trendlines within a trend. The directional bias of the triangle typically aligns with the prevailing trend. An ascending triangle in an uptrend is bullish. A descending triangle in a downtrend is bearish.</p><p><strong>Cups and Handles</strong> - longer-duration continuation pattern where a stock pulls back in a rounded U-shape, recovers to near the prior high, forms a small handle consolidation, then breaks out. More common on daily and weekly charts.</p><h3>What All Continuations Share</h3><p>Volume dries up during the consolidation and expands on the breakout. This is the defining characteristic. Without the volume signature, the pattern is not a high-conviction continuation - it is just price moving sideways. The consolidation must show declining participation before the breakout can be trusted.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Trading continuation patterns is trading with the trend. It is the highest probability approach available to a technical trader. When you combine a strong existing trend with a tight consolidation on declining volume and a breakout on expanding volume, you have three independent signals all pointing in the same direction. That is confluence. That is the trade.</p></div>`},
'b6-r':{title:'Reversals',content:`<p>Reversal patterns signal a potential change in the prevailing trend. Where continuation patterns tell you the trend is pausing before resuming, reversal patterns tell you the trend may be ending and the opposite direction may begin. They require more patience to develop and more confirmation before acting on them - but when they work, the moves can be substantial because you are catching a trend change early.</p><h3>The Key Reversal Patterns in This Course</h3><p><strong>Head and Shoulders</strong> - three peaks where the middle peak is the highest, forming at the end of an uptrend. The signal is a break below the neckline connecting the two pullback lows. Inverse head and shoulders is the bullish version appearing at the end of a downtrend.</p><p><strong>Double Tops and Double Bottoms</strong> - price tests a key level twice and fails both times. Double top is bearish - two failed attempts at resistance. Double bottom is bullish - two successful defenses of support. The signal is a break beyond the neckline between the two tests.</p><h3>What All Reversals Share</h3><p>Volume tells the story on reversals. The first move that creates the pattern should be on strong volume. The second attempt that fails should be on declining volume - confirming that momentum is weakening. The break that confirms the reversal should be on expanding volume. Without this volume progression, the reversal pattern carries significantly lower probability.</p><h3>Reversals vs Pullbacks</h3><p>Not every move against the trend is a reversal. Most are pullbacks within the prevailing trend. The difference is structure and volume. A pullback is orderly, on declining volume, and does not break major structural levels. A reversal breaks structural levels, often with high volume, and fails to make new highs or lows in the original direction.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Reversals are harder to trade than continuations. You
