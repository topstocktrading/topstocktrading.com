
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TST Academy – Members Area</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--green:#00d27a;--green-dark:#00a85f;--dark:#0a0c10;--card:#12151c;--card2:#161920;--border:#1e2330;--text:#e8eaf0;--muted:#6b7280;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{background:var(--dark);color:var(--text);font-family:'DM Sans',sans-serif;line-height:1.6;overflow-x:hidden;display:flex;flex-direction:column;min-height:100vh;}

  #login-screen{position:fixed;inset:0;background:var(--dark);z-index:1000;display:flex;align-items:center;justify-content:center;}
  .login-box{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:48px 40px;width:100%;max-width:420px;text-align:center;}
  .login-logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;color:#fff;margin-bottom:8px;}
  .login-logo span{color:var(--green);}
  .login-subtitle{font-size:14px;color:var(--muted);margin-bottom:32px;}
  .login-box h2{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:#fff;margin-bottom:24px;}
  .input-group{margin-bottom:16px;text-align:left;}
  .input-group label{font-size:12px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:6px;}
  .input-group input{width:100%;background:var(--dark);border:1px solid var(--border);border-radius:8px;padding:12px 16px;color:var(--text);font-size:15px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color 0.2s;}
  .input-group input:focus{border-color:var(--green);}
  .login-btn{width:100%;background:var(--green);color:#0a0c10;border:none;border-radius:8px;padding:14px;font-size:15px;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;margin-top:8px;transition:background 0.2s;}
  .login-btn:hover{background:#00e888;}
  .login-error{font-size:13px;color:#e05c5c;margin-top:12px;display:none;}

  .top-nav{background:rgba(10,12,16,0.95);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:14px 24px;position:sticky;top:0;z-index:100;}
  .nav-logo{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;color:#fff;}
  .nav-logo span{color:var(--green);}
  .nav-right{display:flex;align-items:center;gap:20px;}
  .nav-welcome{font-size:13px;color:var(--muted);}
  .nav-welcome span{color:var(--green);font-weight:500;}
  .logout-btn{font-size:13px;color:var(--muted);background:none;border:1px solid var(--border);border-radius:6px;padding:6px 12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:color 0.2s,border-color 0.2s;}
  .logout-btn:hover{color:#e05c5c;border-color:#e05c5c;}

  .app{display:flex;flex:1;}

  /* SIDEBAR — wider, larger fonts, all green */
  .sidebar{width:320px;min-width:320px;background:var(--card);border-right:1px solid var(--border);height:calc(100vh - 57px);position:sticky;top:57px;overflow-y:auto;padding:16px 0;}
  .sidebar::-webkit-scrollbar{width:4px;}
  .sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

  .progress-wrap{padding:14px 20px 18px;border-bottom:1px solid var(--border);margin-bottom:14px;}
  .progress-label{font-size:12px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;display:flex;justify-content:space-between;}
  .progress-label span{color:var(--green);}
  .progress-bar{height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--green);border-radius:3px;transition:width 0.4s;}

  .sec-group{margin-bottom:6px;}
  .sec-header{padding:11px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;transition:background 0.15s;border-radius:6px;margin:0 8px;}
  .sec-header:hover{background:rgba(255,255,255,0.03);}
  .sec-badge{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:3px 9px;border-radius:3px;flex-shrink:0;background:rgba(0,210,122,0.12);color:var(--green);}
  .sec-name{font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;color:#fff;flex:1;letter-spacing:0.5px;}
  .sec-arrow{color:var(--muted);font-size:11px;transition:transform 0.2s;}
  .sec-header.open .sec-arrow{transform:rotate(90deg);}
  .sec-lessons{display:none;padding:2px 0 8px;}
  .sec-lessons.open{display:block;}

  .mod-header{padding:8px 16px 8px 36px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;transition:background 0.15s;}
  .mod-header:hover{background:rgba(255,255,255,0.02);}
  .mod-name{font-size:13px;color:var(--muted);font-weight:500;}
  .mod-arrow{color:var(--muted);font-size:10px;transition:transform 0.2s;}
  .mod-header.open .mod-arrow{transform:rotate(90deg);}
  .mod-header.open .mod-name{color:var(--text);}
  .sub-list{display:none;}
  .sub-list.open{display:block;}

  .sub-item{padding:6px 16px 6px 52px;font-size:13px;color:var(--muted);cursor:pointer;transition:color 0.15s,background 0.15s;display:flex;align-items:center;gap:7px;}
  .sub-item:hover{color:var(--text);background:rgba(255,255,255,0.02);}
  .sub-item.active{color:var(--green);background:rgba(0,210,122,0.05);}
  .sub-item.done{color:#2e3545;}
  .sub-chk{font-size:11px;min-width:14px;color:var(--muted);}
  .sub-item.active .sub-chk{color:var(--green);}
  .sub-item.done .sub-chk{color:var(--green);}

  .dir-item{padding:7px 16px 7px 36px;font-size:13px;color:var(--muted);cursor:pointer;transition:color 0.15s,background 0.15s;display:flex;align-items:center;gap:7px;}
  .dir-item:hover{color:var(--text);background:rgba(255,255,255,0.02);}
  .dir-item.active{color:var(--green);background:rgba(0,210,122,0.05);}
  .dir-item.done{color:#2e3545;}
  .dir-chk{font-size:11px;min-width:14px;color:var(--muted);}
  .dir-item.active .dir-chk{color:var(--green);}
  .dir-item.done .dir-chk{color:var(--green);}

  .main{flex:1;padding:40px 48px;max-width:900px;}
  .lesson-tag{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--green);font-family:'Rajdhani',sans-serif;font-weight:700;margin-bottom:8px;}
  .lesson-title{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:2px;color:#fff;line-height:1.1;margin-bottom:12px;}
  .lesson-meta{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-bottom:28px;flex-wrap:wrap;}
  .video-wrap{background:#000;border-radius:12px;border:1px solid var(--border);aspect-ratio:16/9;margin-bottom:28px;display:flex;align-items:center;justify-content:center;}
  .vid-ph{text-align:center;}
  .vid-icon{font-size:48px;margin-bottom:10px;opacity:0.2;}
  .vid-ph p{font-size:13px;color:var(--muted);}
  .lc h3{font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:700;color:#fff;margin:28px 0 10px;letter-spacing:0.3px;}
  .lc h3:first-child{margin-top:0;}
  .lc p{font-size:15px;color:var(--muted);line-height:1.8;margin-bottom:12px;}
  .lc ul{margin:0 0 14px 20px;}
  .lc li{font-size:15px;color:var(--muted);line-height:1.8;margin-bottom:6px;}
  .lc li::marker{color:var(--green);}
  .callout{background:rgba(0,210,122,0.06);border-left:3px solid var(--green);border-radius:0 8px 8px 0;padding:14px 18px;margin:18px 0;}
  .callout p{margin:0;color:var(--text);font-size:14px;line-height:1.7;}
  .quote-block{text-align:center;padding:32px 24px;margin:28px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);}
  .quote-text{font-family:'Rajdhani',sans-serif;font-size:22px;font-weight:600;color:#fff;line-height:1.4;margin-bottom:8px;letter-spacing:0.3px;}
  .quote-author{font-size:13px;color:var(--green);}
  .sec-intro-card{background:var(--card2);border:1px solid var(--border);border-radius:16px;padding:32px;margin-bottom:32px;}
  .sic-badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:4px 10px;border-radius:4px;margin-bottom:14px;background:rgba(0,210,122,0.12);color:var(--green);}
  .sec-intro-card h2{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:#fff;margin-bottom:12px;}
  .sec-intro-card p{font-size:15px;color:var(--muted);line-height:1.8;margin-bottom:10px;}
  .topics-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
  .topic-pill{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:6px;padding:4px 12px;font-size:12px;color:var(--muted);}
  .cs-wrap{text-align:center;padding:60px 24px;}
  .cs-icon{font-size:48px;margin-bottom:16px;opacity:0.25;}
  .cs-wrap h3{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px;color:#fff;margin-bottom:8px;}
  .cs-wrap p{font-size:14px;color:var(--muted);}
  .lesson-nav{display:flex;justify-content:space-between;align-items:center;padding-top:28px;border-top:1px solid var(--border);margin-top:24px;}
  .nav-btn{background:transparent;border:1px solid var(--border);border-radius:8px;padding:10px 22px;font-size:14px;color:var(--text);cursor:pointer;font-family:'DM Sans',sans-serif;transition:border-color 0.2s,color 0.2s;}
  .nav-btn:hover{border-color:var(--green);color:var(--green);}
  .nav-btn.primary{background:var(--green);color:#0a0c10;border-color:var(--green);font-weight:700;}
  .nav-btn.primary:hover{background:#00e888;}
  .nav-btn:disabled{opacity:0.3;cursor:not-allowed;pointer-events:none;}

  /* NOTES SYSTEM */
  .notes-wrap{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:28px;}
  .notes-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .notes-title{font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;color:#fff;display:flex;align-items:center;gap:8px;}
  .notes-count{font-size:11px;background:rgba(0,210,122,0.12);color:var(--green);padding:2px 8px;border-radius:10px;font-family:'DM Sans',sans-serif;font-weight:400;}
  .note-input-row{display:flex;gap:8px;margin-bottom:14px;}
  .note-input{flex:1;background:var(--dark);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;outline:none;resize:none;min-height:40px;transition:border-color 0.2s;}
  .note-input:focus{border-color:var(--green);}
  .note-save-btn{background:var(--green);color:#0a0c10;border:none;border-radius:8px;padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;align-self:flex-start;}
  .note-save-btn:hover{background:#00e888;}
  .notes-list{display:flex;flex-direction:column;gap:8px;max-height:240px;overflow-y:auto;}
  .notes-list::-webkit-scrollbar{width:3px;}
  .notes-list::-webkit-scrollbar-thumb{background:var(--border);}
  .note-item{background:var(--dark);border:1px solid var(--border);border-radius:8px;padding:10px 14px;display:flex;align-items:flex-start;gap:10px;}
  .note-ts{font-size:11px;color:var(--green);font-weight:700;cursor:pointer;white-space:nowrap;padding:2px 8px;background:rgba(0,210,122,0.08);border-radius:4px;border:1px solid rgba(0,210,122,0.2);transition:background 0.15s;flex-shrink:0;}
  .note-ts:hover{background:rgba(0,210,122,0.16);}
  .note-text{font-size:13px;color:var(--text);line-height:1.6;flex:1;}
  .note-delete{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:0 2px;flex-shrink:0;}
  .note-delete:hover{color:#e05c5c;}
  .notes-empty{font-size:13px;color:var(--muted);text-align:center;padding:16px 0;}

  /* MY NOTES PAGE */
  .all-notes-lesson{margin-bottom:24px;}
  .all-notes-lesson-title{font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;color:#fff;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .all-notes-lesson-sec{font-size:11px;color:var(--muted);font-weight:400;}



  .ai-fab{position:fixed;bottom:28px;right:28px;background:var(--green);color:#0a0c10;border:none;border-radius:50px;padding:13px 20px;font-size:13px;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;display:flex;align-items:center;gap:7px;box-shadow:0 4px 20px rgba(0,210,122,0.25);transition:transform 0.2s;z-index:200;}
  .ai-fab:hover{transform:translateY(-2px);}
  .ai-panel{position:fixed;bottom:85px;right:28px;width:350px;background:var(--card);border:1px solid var(--border);border-radius:16px;display:none;flex-direction:column;z-index:200;overflow:hidden;}
  .ai-panel.open{display:flex;}
  .ai-ph{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .ai-pt{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;color:#fff;display:flex;align-items:center;gap:7px;}
  .ai-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
  .ai-x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;}
  .ai-msgs{height:260px;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}
  .ai-msgs::-webkit-scrollbar{width:3px;}
  .ai-msgs::-webkit-scrollbar-thumb{background:var(--border);}
  .ai-msg{max-width:85%;padding:9px 13px;border-radius:10px;font-size:13px;line-height:1.6;}
  .ai-msg.bot{background:var(--card2);color:var(--text);align-self:flex-start;}
  .ai-msg.user{background:var(--green);color:#0a0c10;align-self:flex-end;font-weight:500;}
  .ai-iw{padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:7px;}
  .ai-in{flex:1;background:var(--dark);border:1px solid var(--border);border-radius:7px;padding:9px 12px;color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;outline:none;}
  .ai-in:focus{border-color:var(--green);}
  .ai-send{background:var(--green);color:#0a0c10;border:none;border-radius:7px;padding:9px 13px;font-size:13px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;}
  @media(max-width:768px){.sidebar{display:none;}.main{padding:24px 16px;}.progress-ring{display:none;}}

  .quiz-container{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;margin-top:32px;}
  .quiz-header{margin-bottom:24px;}
  .quiz-title{font-family:'Rajdhani',sans-serif;font-size:24px;font-weight:700;color:var(--text);margin-bottom:8px;}
  .quiz-meta{font-size:13px;color:var(--muted);margin-bottom:12px;}
  .quiz-passed-badge{display:inline-block;background:#0d2e1a;color:var(--green);font-size:13px;font-weight:700;padding:6px 14px;border-radius:20px;border:1px solid var(--green);margin-bottom:12px;}
  .quiz-progress{height:4px;background:var(--border);border-radius:2px;margin-bottom:32px;overflow:hidden;}
  .quiz-progress-bar{height:100%;background:var(--green);border-radius:2px;transition:width 0.3s;}
  .quiz-q{padding:24px 0;border-bottom:1px solid var(--border);}
  .quiz-q:last-child{border-bottom:none;}
  .quiz-q-num{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;}
  .quiz-q-text{font-size:17px;font-weight:600;color:var(--text);line-height:1.5;margin-bottom:20px;}
  .quiz-choices{display:flex;flex-direction:column;gap:10px;}
  .quiz-choice{display:flex;align-items:center;gap:14px;padding:14px 18px;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;transition:all .15s;}
  .quiz-choice:hover{border-color:var(--green);background:rgba(34,197,94,.05);}
  .quiz-choice input{display:none;}
  .quiz-choice:has(input:checked){border-color:var(--green);background:rgba(34,197,94,.08);}
  .quiz-choice-letter{width:28px;height:28px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted);flex-shrink:0;transition:all .15s;}
  .quiz-choice:has(input:checked) .quiz-choice-letter{background:var(--green);color:#000;}
  .quiz-choice-text{font-size:15px;color:var(--text);line-height:1.4;}
  .quiz-choice-correct{border-color:#22c55e !important;background:rgba(34,197,94,.12) !important;}
  .quiz-choice-correct .quiz-choice-letter{background:#22c55e !important;color:#000 !important;}
  .quiz-choice-wrong{border-color:#ef4444 !important;background:rgba(239,68,68,.08) !important;}
  .quiz-choice-wrong .quiz-choice-letter{background:#ef4444 !important;color:#fff !important;}
  .quiz-actions{margin-top:32px;text-align:center;}
  .quiz-submit-btn{background:var(--green);color:#000;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:16px;letter-spacing:.05em;padding:16px 48px;border-radius:10px;border:none;cursor:pointer;transition:all .2s;}
  .quiz-submit-btn:hover{background:#1aaa50;transform:translateY(-1px);}
  .quiz-warning{color:#ef4444;font-size:13px;margin-top:12px;}
  .quiz-results{margin-top:32px;}
  .quiz-score-card{text-align:center;padding:32px;border-radius:14px;margin-bottom:32px;}
  .quiz-passed{background:rgba(34,197,94,.1);border:2px solid var(--green);}
  .quiz-failed{background:rgba(239,68,68,.08);border:2px solid rgba(239,68,68,.4);}
  .quiz-score-num{font-family:'Rajdhani',sans-serif;font-size:64px;font-weight:900;line-height:1;}
  .quiz-passed .quiz-score-num{color:var(--green);}
  .quiz-failed .quiz-score-num{color:#ef4444;}
  .quiz-score-label{font-size:18px;font-weight:700;margin:8px 0 4px;}
  .quiz-passed .quiz-score-label{color:var(--green);}
  .quiz-failed .quiz-score-label{color:#ef4444;}
  .quiz-score-sub{font-size:13px;color:var(--muted);}
  .quiz-review{margin-bottom:28px;}
  .quiz-review-title{font-family:'Rajdhani',sans-serif;font-size:18px;font-weight:700;color:var(--text);margin-bottom:16px;}
  .quiz-wrong-item{padding:16px;background:var(--bg);border:1px solid var(--border);border-radius:10px;margin-bottom:12px;}
  .quiz-wrong-q{font-size:14px;font-weight:600;color:var(--text);margin-bottom:8px;}
  .quiz-wrong-yours{font-size:13px;color:var(--muted);margin-bottom:4px;}
  .quiz-wrong-ans{color:#ef4444;font-weight:600;}
  .quiz-correct-ans{color:var(--green);font-weight:600;}
  .quiz-hint-text{font-size:13px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid var(--border);line-height:1.6;}
  .quiz-perfect{text-align:center;color:var(--green);font-size:16px;font-weight:600;padding:16px;}
  .quiz-retake-btn{display:block;margin:24px auto 0;background:transparent;border:1.5px solid var(--green);color:var(--green);font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;padding:12px 36px;border-radius:10px;cursor:pointer;transition:all .2s;}
  .quiz-retake-btn:hover{background:rgba(34,197,94,.1);}
  .quiz-congrats{text-align:center;color:var(--green);font-size:15px;padding:20px;border:1px solid var(--green);border-radius:10px;background:rgba(34,197,94,.05);}

  
  .quiz-page-wrap{max-width:800px;}
  .quiz-page-header{margin-bottom:32px;}
  .quiz-page-label{display:inline-block;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:4px 10px;border-radius:4px;margin-bottom:14px;background:rgba(0,210,122,0.12);color:var(--green);}
  .quiz-page-header h2{font-family:'Bebas Neue','Rajdhani',sans-serif;font-size:36px;letter-spacing:2px;color:#fff;margin-bottom:8px;}
  .quiz-page-header p{font-size:15px;color:var(--muted);line-height:1.7;}
  .sidebar-quiz-tab .mod-name{color:var(--green) !important;font-weight:700;}

  
  /* PROFILE SYSTEM */
  .profile-page{max-width:960px;margin:0 auto;}
  .profile-header{margin-bottom:28px;}
  .profile-header-label{font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--green);margin-bottom:8px;}
  .profile-header-title{font-family:'Rajdhani',sans-serif;font-size:32px;font-weight:700;letter-spacing:1px;color:var(--text);}
  .profile-tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:28px;flex-wrap:wrap;}

const LESSONS={
'b-pillars':{title:'The 3 Pillars of Trading',content:`<p>Before you ever look at a chart, open a brokerage account, or place a trade — you need to understand what separates consistently profitable traders from everyone else. It's not a secret indicator. It's not a special scanner. It's three things done consistently.</p><h3>Pillar 1 — Idea Generation</h3><p>Where does the trade come from? Every good trade starts with a reason. A catalyst. A setup. News, earnings, technical breakout, sector rotation — something that makes this stock worth paying attention to right now. Idea generation is your filter. It's how you go from 8,000 stocks to the 3-5 that actually deserve your attention today.</p><h3>Pillar 2 — The Setup</h3><p>Once you have an idea, you need a setup. The setup answers the question — where exactly do I get in, where am I wrong, and where am I taking profits? A setup is not "I think this stock is going up." A setup is specific — entry, stop, target. Specificity is everything.</p><h3>Pillar 3 — Risk Management</h3><p>This is the one most beginners skip and the reason most beginners fail. Risk management answers the question — how much of my account am I willing to lose on this single trade? The answer should never be more than 1-2%. Ever. One bad trade should never threaten your ability to come back tomorrow.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The order matters. Idea first. Setup second. Risk third. Most beginners do it backwards — they size up first, find a setup second, and never had an idea to begin with. That's why they lose.</p></div>`},
'b-types':{title:'Types of Traders',content:`<p>Not every trader is the same and not every trading style is right for every person. One of the biggest mistakes beginners make is trying to trade like someone else — copying a style that doesn't fit their personality, schedule, or risk tolerance.</p><h3>Scalper</h3><p>Holds trades for seconds to minutes. Extremely high frequency. Requires intense focus, lightning fast execution. Best for people who thrive under pressure and can detach emotionally from rapid wins and losses.</p><h3>Day Trader</h3><p>Holds trades for minutes to hours. Never holds overnight. Focused primarily on the open and power hour. Best for people who can dedicate their morning to the market.</p><h3>Swing Trader</h3><p>Holds trades for days to weeks. Requires less screen time — often just 30-60 minutes per day for analysis. Best for people with full time jobs who can't watch the market all day.</p><h3>Long Term Investor</h3><p>Holds positions for months to years. Focused on fundamentals, sector trends, and macro themes. Best for people building wealth over time who aren't interested in short term volatility.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Most successful traders end up being a combination of styles. The goal isn't to pick one box and live in it forever — it's to understand which style fits your life and your psychology and start there.</p></div>`},
'b-hours':{title:'Market Hours',content:`<p>The market doesn't treat all hours equally. Knowing when to trade is just as important as knowing what to trade.</p><h3>Pre-Market (4:00 AM — 9:30 AM ET)</h3><p>Lower volume, wider spreads, more volatile. News and earnings reports hit during this window. Best used for research and preparation.</p><h3>Market Open (9:30 AM — 10:30 AM ET)</h3><p>The highest volume, highest volatility window of the day. This is where the most opportunity exists — and also where the most damage is done to undisciplined traders. The open rewards preparation and punishes impulsiveness.</p><h3>Midday (10:30 AM — 2:00 PM ET)</h3><p>Volume drops significantly. Spreads widen. Price action gets choppy and unreliable. For most retail traders — especially beginners — this is the most dangerous time to trade.</p><h3>Power Hour (3:00 PM — 4:00 PM ET)</h3><p>Volume picks back up as institutions rebalance portfolios. The second best window of the day for active traders.</p><h3>After Hours (4:00 PM — 8:00 PM ET)</h3><p>Earnings reports frequently release here. Very low volume, very wide spreads. Not recommended for most beginners.</p><div class="callout"><div class="callout-label">TST Edge</div><p>If you only traded the open and power hour and did nothing in between, your results would probably improve immediately. Midday chop kills more accounts than bad setups ever will, especially if you trade options.</p></div>`},
'b2-0':{title:'Why Volume Matters',content:`<p>Volume is the number of shares traded during a specific time period. It is the single most important confirming indicator in all of technical analysis. Price tells you where the market went. Volume tells you how much conviction was behind the move.</p><p>Think of it this way — if a stock moves up 10% on 100,000 shares traded, that's a very different signal than moving up 10% on 1,000,000 shares traded. The first move has weak conviction. The second has institutional participation. The chart pattern looks the same but the story is completely different.</p><ul><li><strong>High volume on a move up</strong> — buyers are aggressive. Institutional money is participating.</li><li><strong>Low volume on a move up</strong> — retail participation, weak hands, easily reversed.</li><li><strong>High volume on a move down</strong> — sellers are aggressive. Distribution is occurring.</li><li><strong>Low volume on a move down</strong> — sellers aren't committed. Could be temporary profit taking.</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>Price without volume is just a suggestion. Volume gives you conviction. Always check what volume is doing before entering a position. If a stock breaks out of a pattern on low volume, wait. The breakout hasn't been confirmed yet.</p></div>`},
'b2-1':{title:'Volume Signals',content:`<p>Beyond simply high or low volume, there are specific volume signals that appear repeatedly and carry significant meaning.</p><h3>Volume Spike</h3><p>A sudden dramatic increase in volume — often 3x to 10x the average. Usually signals a major event — earnings, news, institutional accumulation or distribution. A volume spike with no news is often more significant than one with an obvious catalyst.</p><h3>Climax Volume</h3><p>Extremely high volume after an extended move in one direction — often signaling exhaustion. When a stock that's been running for days suddenly prints the highest volume day of the move with little price progress, that's climax volume. The move may be ending.</p><h3>Volume Dry Up</h3><p>Volume that progressively decreases over several candles while price consolidates in a tight range. This is actually a positive signal — it means sellers have been absorbed and the stock is resting before the next move.</p><h3>Below Average Volume</h3><p>Any move on below average volume should be treated with skepticism. It means the move lacks institutional participation and is more likely to reverse.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Volume dry up during a consolidation is one of the most reliable signals that a stock is about to make a significant move. Stocks don't move in straight lines — they move, they rest on low volume, and then they move again. The low volume rest period is where you want to be positioning.</p></div>`},
'b2-2':{title:'Volume & Price Action',content:`<p>The relationship between volume and price is the foundation of institutional analysis.</p><ul><li><strong>Price up, volume up</strong> — healthy bullish trend.</li><li><strong>Price up, volume down</strong> — weakening trend. Distribution may be occurring.</li><li><strong>Price down, volume up</strong> — aggressive selling. Real distribution.</li><li><strong>Price down, volume down</strong> — weak selling pressure. Could be a natural pullback.</li></ul><h3>The Breakout Volume Rule</h3><p>Any breakout from a pattern must be accompanied by above average volume to be considered valid. A breakout on below average volume is a false breakout candidate. Wait for volume confirmation before entering.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The most dangerous trade in markets is buying a breakout on low volume. It looks exactly like a real breakout — but without volume behind it, you're often the last buyer before a reversal. Volume confirms. Always.</p></div>`},
'b3-0':{title:'What Is Support & Resistance',content:`<p>Support is a price level where buying interest is strong enough to stop a decline and potentially reverse it. Think of support as a floor. When price approaches this level, buyers step in and defend it. The more times a level has held, the more significant it becomes.</p><p>Resistance is a price level where selling interest is strong enough to stop an advance and potentially reverse it. Think of resistance as a ceiling. When price approaches this level, sellers step in and defend it.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Support and resistance are not precise lines — they are zones. A level that was support at $49.80 might hold at $49.50 the next time. Think in terms of areas rather than exact prices. Give levels a little room and your entries will be far more consistent.</p></div>`},
'b3-1':{title:'Identifying Key Levels',content:`<p>Not all support and resistance levels are created equal. Learning to identify the most significant levels — the ones institutions are watching — is a skill that separates good traders from average ones.</p><ul><li><strong>Prior highs and lows</strong> — prior all-time highs, prior day highs and lows, prior week highs and lows.</li><li><strong>Whole numbers</strong> — $1, $10, $50, $100, $200. Round numbers attract large option strikes, institutional orders, and retail stop losses.</li><li><strong>Areas of high volume</strong> — where the most trading has occurred historically. That level has memory.</li><li><strong>Gap levels</strong> — the top and bottom of unfilled price gaps. Gaps frequently act as magnets.</li><li><strong>Moving averages</strong> — the 10, 20, 50, and 200 day moving averages act as dynamic support and resistance.</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>The best key levels are the ones you identified before price reached them. Start your pre-market prep by marking the most significant levels on your watchlist stocks before the market opens. Those are your decision points for the day. Examples: Previous day high, previous day low, previous day close, premarket low, premarket high, and once market opens the opening print. Always look for confluence — without multiple confluences it's simply just a line.</p></div>`},
'b3-2':{title:'How Price Reacts to Levels',content:`<p>Understanding that a level exists is half the battle. Understanding how price typically behaves when it reaches that level is the other half.</p><h3>Clean holds</h3><p>Price approaches the level, pauses, and reverses cleanly. This is the strongest signal and produces the highest quality setups. Enter on the bounce with a stop just below the level.</p><h3>Level breaks and reclaims</h3><p>Price briefly breaks below a support level, shakes out weak holders, then reclaims it quickly. This is called a stop hunt or liquidity sweep. The reclaim of the level is actually a stronger signal than a clean hold because it has already flushed the weak hands.</p><h3>Multiple tests weakening the level</h3><p>The more times a level is tested the weaker it becomes. When a level finally gives way after multiple tests the move tends to be significant.</p><h3>Polarity</h3><p>One of the most powerful concepts in technical analysis. When support breaks it often becomes resistance, and when resistance breaks it often becomes support. There's a saying in trading: "old support becomes new resistance" and vice versa. If the stock couldn't break $10 and finally broke that resistance, $10 would now become the support instead of resistance.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The cleanest trade in all of technical analysis is the polarity play — waiting for a key level to break, watching price pull back to retest that level from the other side, and entering when price holds. The level has been tested, confirmed, and now has fresh buyers underneath it. Risk is well defined and the setup is clean.</p></div>`},

</svg></div><p>Market structure is how price moves over time. Understanding structure is understanding trend — the single most important skill for knowing whether to be a buyer, a seller, or flat.</p><p>An uptrend is defined by higher highs and higher lows.</p><ul><li><strong>Higher high</strong> — each swing high is above the prior swing high. Buyers are pushing price to new levels on each wave up.</li><li><strong>Higher low</strong> — each pullback finds support at a higher level than the prior pullback. Sellers are getting weaker. Buyers are stepping in earlier on each dip.</li></ul><p>When you see this pattern the market is in a healthy uptrend. Your bias should be bullish. Look for opportunities to buy pullbacks — not opportunities to short into strength.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Most beginners try to short uptrending stocks because they feel "too high." This is one of the most expensive mistakes you can make. The trend is your edge. Trading against it is swimming upstream. In an uptrend your job is to find the best place to buy — not to predict the top.</p></div>`},

</svg></div><p><p style="font-size:13px;color:var(--muted);margin-top:10px;line-height:1.7;border-left:3px solid var(--green);padding-left:12px;">Notice the final sequence on the right side of this chart. The bounce attempts get shorter and shorter, and then price finally makes a lower high that fails to reach the prior bounce. That is the moment the trend shift becomes visible. When you see lower highs getting progressively weaker, the reversal is building.</p>The mirror image of an uptrend is a downtrend — defined by lower highs and lower lows.</p><ul><li><strong>Lower low</strong> — each swing low is below the prior swing low. Sellers are pushing price to new lows on each wave down.</li><li><strong>Lower high</strong> — each bounce finds resistance at a lower level than the prior bounce. Buyers are getting weaker. Sellers are stepping in earlier on each rally.</li></ul><h3>The structure break</h3><p>The most significant event in any trend is a structure break — when price finally breaks above a lower high in a downtrend or below a higher low in an uptrend. This signals a potential trend change. The first structure break is not necessarily the end of the trend — but it is always a warning sign.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Lower highs are one of the most reliable signals in trading. When a stock that's been uptrending starts making a lower high on the bounce, sellers are stepping in at lower and lower prices. The uptrend is losing steam. Start tightening stops and reducing position size.</p></div>`},
'b4-2':{title:'Range Bound Markets',content:`<p>Not every market is trending. In fact, markets spend roughly 70% of their time in a range — bouncing between a defined support and resistance level without making meaningful progress in either direction.</p><h3>What is a range?</h3><p>A range is a period where price oscillates between a clear ceiling and a clear floor. The highs are roughly equal. The lows are roughly equal. The market is in equilibrium.</p><h3>How to trade a range</h3><p>Buy near the bottom of the range when price shows signs of holding. Sell or short near the top when price shows signs of rejection. Take profits before the opposite side — don't hold for the full range width hoping for more.</p><h3>Range breakouts</h3><p>The most powerful moves come when a range finally resolves — when price breaks above the upper boundary or below the lower boundary with volume. The longer the range, the more powerful the eventual breakout.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Ranges are where patient traders make money and impatient traders lose it. If you can't clearly identify whether you're near support or resistance, you're in the middle of the range. Step away. Come back when price gives you a better location.</p></div>`},
'b5-0':{title:'Drawing Trendlines',content:`<p>A trendline is a straight line drawn along a series of highs or lows that visually represents the direction and angle of a trend.</p><h3>How to draw a valid trendline</h3><p>An uptrend trendline connects a series of higher lows. You need at least two confirmed lows to draw the line — but the line only becomes significant after the third touch confirms it. Draw the line along the bottom of the wicks, not the bodies.</p><p>A downtrend trendline connects a series of lower highs. Two points to draw, three touches to confirm significance. Draw along the tops of the wicks.</p><h3>Common mistakes</h3><p><strong>Forcing a line</strong> — drawing a trendline that only works if you ignore obvious price action. If you're struggling to make it fit, it probably doesn't exist.</p><p><strong>Drawing too many lines</strong> — be selective. Only draw lines that are clean, well-tested, and at obvious angles.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The angle of the trendline matters. An extremely steep trendline is unsustainable and will break soon. The most reliable trendlines are at 30-45 degree angles. They represent sustainable momentum without being overextended.</p></div>`},

if" font-size="11" x="404" y="185" text-anchor="middle" fill="#00d27a">New uptrend</text><text font-family="DM Sans,sans-serif" font-size="11" x="340" y="428" text-anchor="middle" fill="#6b7280">Polarity — old resistance becomes new support after the break.</text></svg></div><div class="chart-box" style="margin-top:20px"><svg width="100%" viewBox="0 0 680 430" role="img"><title>Uptrend break</title><desc>HL1 HL2 HL3 labeled with uptrend trendline, break candle closes below, retest as resistance, new downtrend</desc><text font-family="DM Sans,sans-serif" font-size="11" x="62" y="366" fill="#00d27a">Uptrend line (connects swing lows)</text><line x1="58" y1="295" x2="58" y2="320" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><rect x="50" y="268" width="16" height="27" rx="2" fill="#00d27a"/><line x1="58" y1="255" x2="58" y2="268" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><line x1="78" y1="272" x2="78" y2="300" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><rect x="70" y="242" width="16" height="30" rx="2" fill="#00d27a"/><line x1="78" y1="228" x2="78" y2="242" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><line x1="98" y1="248" x2="98" y2="278" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><rect x="90" y="216" width="16" height="32" rx="2" fill="#00d27a"/><line x1="98" y1="202" x2="98" y2="216" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><line x1="118" y1="220" x2="118" y2="245" stroke="#e05c5c" stroke-width="1.5" stroke-linecap="round"/><rect x="110" y="204" width="16" height="16" rx="2" fill="#e05c5c"/><line x1="138" y1="226" x2="138" y2="252" stroke="#e05c5c" stroke-width="1.5" stroke-linecap="round"/><rect x="130" y="210" width="16" height="16" rx="2" fill="#e05c5c"/><circle cx="138" cy="254" r="5" fill="rgba(0,210,122,0.2)" stroke="#00d27a" stroke-width="1.5"/><text font-family="DM Sans,sans-serif" font-size="11" x="138" y="270" text-anchor="middle" fill="#00d27a">HL1</text><line x1="158" y1="210" x2="158" y2="238" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><rect x="150" y="180" width="16" height="30" rx="2" fill="#00d27a"/><line x1="158" y1="166" x2="158" y2="180" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><line x1="178" y1="182" x2="178" y2="212" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><rect x="170" y="150" width="16" height="32" rx="2" fill="#00d27a"/><line x1="178" y1="136" x2="178" y2="150" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><line x1="198" y1="155" x2="198" y2="186" stroke="#e05c5c" stroke-width="1.5" stroke-linecap="round"/><rect x="190" y="140" width="16" height="15" rx="2" fill="#e05c5c"/><line x1="218" y1="162" x2="218" y2="188" stroke="#e05c5c" stroke-width="1.5" stroke-linecap="round"/><rect x="210" y="148" width="16" height="14" rx="2" fill="#e05c5c"/><circle cx="218" cy="190" r="5" fill="rgba(0,210,122,0.2)" stroke="#00d27a" stroke-width="1.5"/><text font-family="DM Sans,sans-serif" font-size="11" x="218" y="206" text-anchor="middle" fill="#00d27a">HL2</text><line x1="238" y1="148" x2="238" y2="178" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><rect x="230" y="116" width="16" height="32" rx="2" fill="#00d27a"/><line x1="238" y1="102" x2="238" y2="116" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><line x1="258" y1="120" x2="258" y2="152" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><rect x="250" y="86" width="16" height="34" rx="2" fill="#00d27a"/><line x1="258" y1="72" x2="258" y2="86" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><line x1="278" y1="95" x2="278" y2="125" stroke="#e05c5c" stroke-width="1.5" stroke-linecap="round"/><rect x="270" y="80" width="16" height="15" rx="2" fill="#e05c5c"/><line x1="298" y1="102" x2="298" y2="130" stroke="#e05c5c" stroke-width="1.5" stroke-linecap="round"/><rect x="290" y="88" width="16" height="14" rx="2" fill="#e05c5c"/><circle cx="298" cy="132" r="5" fill="rgba(0,210,122,0.2)" stroke="#00d27a" stroke-width="1.5"/><text font-family="DM Sans,sans-serif" font-size="11" x="298" y="148" text-anchor="middle" fill="#00d27a">HL3</text><line x1="58" y1="318" x2="360" y2="82" stroke="#00d27a" stroke-width="2" stroke-dasharray="7 4" opacity="0.85"/><line x1="320" y1="106" x2="320" y2="138" stroke="#e05c5c" stroke-width="2.5" stroke-linecap="round"/><rect x="311" y="138" width="18" height="56" rx="2" fill="#e05c5c" stroke="#b84040" stroke-width="2"/><line x1="320" y1="194" x2="320" y2="210" stroke="#e05c5c" stroke-width="2.5" stroke-linecap="round"/><text font-family="DM Sans,sans-serif" font-size="11" x="430" y="162" fill="#e05c5c">Close below = break</text><line x1="331" y1="165" x2="428" y2="165" stroke="#e05c5c" stroke-width="0.5" stroke-dasharray="3 2"/><line x1="342" y1="145" x2="342" y2="170" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><rect x="334" y="128" width="16" height="17" rx="2" fill="#00d27a"/><line x1="362" y1="138" x2="362" y2="162" stroke="#e05c5c" stroke-width="1.5" stroke-linecap="round"/><rect x="354" y="122" width="16" height="16" rx="2" fill="#e05c5c"/><rect x="326" y="108" width="64" height="16" rx="4" fill="rgba(245,158,11,0.12)" stroke="rgba(245,158,11,0.4)" stroke-width="0.8"/><text font-family="DM Sans,sans-serif" font-size="11" x="358" y="120" text-anchor="middle" fill="#f59e0b">Retest = short entry</text><line x1="382" y1="150" x2="382" y2="186" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="373" y="186" width="18" height="40" rx="2" fill="#e05c5c"/><line x1="382" y1="226" x2="382" y2="242" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><line x1="404" y1="158" x2="404" y2="196" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="395" y="196" width="18" height="42" rx="2" fill="#e05c5c"/><line x1="404" y1="238" x2="404" y2="256" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><line x1="426" y1="166" x2="426" y2="206" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="417" y="206" width="18" height="44" rx="2" fill="#e05c5c"/><line x1="426" y1="250" x2="426" y2="268" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><text font-family="DM Sans,sans-serif" font-size="11" x="404" y="295" text-anchor="middle" fill="#e05c5c">New downtrend</text><text font-family="DM Sans,sans-serif" font-size="11" x="340" y="406" text-anchor="middle" fill="#6b7280">Polarity — old support becomes new resistance after the break.</text></svg></div><p>A trendline break signals that the trend may be changing or at minimum taking a significant pause.</p><h3>What constitutes a valid break</h3><p>Price must close below an uptrend trendline or above a downtrend trendline — not just briefly pierce it intraday. What matters is where price closes. A trendline break on high volume is far more significant than one on low volume.</p><h3>The retest</h3><p>After a trendline break, price will frequently retest the broken trendline from the other side — polarity in action. The old uptrend line becomes resistance. This retest is often the highest probability entry for a short position.</p><h3>False breaks</h3><p>Not every trendline break is real. Price will sometimes briefly break a trendline, find buyers quickly, and reclaim it. These false breaks are actually bullish signals — they shook out weak longs and failed to attract sellers.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The best trendline break trades are the ones you see coming. When a trendline has been tested three or four times and is getting close to a significant support or resistance level, the break is becoming more likely. The break you anticipate is always better than the break you react to.</p></div>`},
'b5-2':{title:'Channel Trading',content:`<div class="chart-box"><svg width="100%" viewBox="0 0 680 560" role="img"><title>Ascending channel</title><desc>Two parallel rising trendlines, buy circles at lower line, sell circles at upper line</desc><text font-family="DM Sans,sans-serif" font-size="11" x="270" y="36" text-anchor="middle" fill="#a855f7">Ascending channel — buy at lower, sell at upper</text><line x1="80" y1="420" x2="80" y2="455" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><rect x="72" y="432" width="16" height="22" rx="2" fill="#00d27a"/><line x1="100" y1="405" x2="100" y2="450" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><rect x="92" y="416" width="16" height="28" rx="2" fill="#00d27a"/><line x1="120" y1="350" x2="120" y2="395" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><rect x="112" y="358" width="16" height="30" rx="2" fill="#00d27a"/><circle cx="80" cy="455" r="7" fill="rgba(0,210,122,0.18)" stroke="#00d27a" stroke-width="1.8"/><text font-family="DM Sans,sans-serif" font-size="11" x="80" y="480" text-anchor="middle" fill="#00d27a">Buy</text><line x1="140" y1="290" x2="140" y2="345" stroke="#e05c5c" stroke-width="1.5" stroke-linecap="round"/><rect x="132" y="305" width="16" height="30" rx="2" fill="#e05c5c"/><line x1="160" y1="285" x2="160" y2="340" stroke="#e05c5c" stroke-width="1.5" stroke-linecap="round"/><rect x="152" y="300" width="16" height="28" rx="2" fill="#e05c5c"/><circle cx="140" cy="290" r="7" fill="rgba(224,92,92,0.18)" stroke="#e05c5c" stroke-width="1.8"/><text font-family="DM Sans,sans-serif" font-size="11" x="140" y="275" text-anchor="middle" fill="#e05c5c">Sell</text><line x1="180" y1="320" x2="180" y2="372" stroke="#e05c5c" stroke-width="1.5" stroke-linecap="round"/><rect x="172" y="332" width="16" height="28" rx="2" fill="#e05c5c"/><line x1="200" y1="330" x2="200" y2="405" stroke="#e05c5c" stroke-width="1.5" stroke-linecap="round"/><rect x="192" y="342" width="16" height="50" rx="2" fill="#e05c5c"/><line x1="220" y1="380" x2="220" y2="420" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><rect x="212" y="392" width="16" height="26" rx="2" fill="#00d27a"/><line x1="240" y1="370" x2="240" y2="415" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><rect x="232" y="380" width="16" height="28" rx="2" fill="#00d27a"/><circle cx="220" cy="420" r="7" fill="rgba(0,210,122,0.18)" stroke="#00d27a" stroke-width="1.8"/><text font-family="DM Sans,sans-serif" font-size="11" x="220" y="445" text-anchor="middle" fill="#00d27a">Buy</text><line x1="260" y1="260" x2="260" y2="315" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><rect x="252" y="272" width="16" height="30" rx="2" fill="#00d27a"/><line x1="280" y1="255" x2="280" y2="318" stroke="#e05c5c" stroke-width="1.5" stroke-linecap="round"/><rect x="272" y="270" width="16" height="30" rx="2" fill="#e05c5c"/><circle cx="280" cy="255" r="7" fill="rgba(224,92,92,0.18)" stroke="#e05c5c" stroke-width="1.8"/><text font-family="DM Sans,sans-serif" font-size="11" x="280" y="240" text-anchor="middle" fill="#e05c5c">Sell</text><line x1="300" y1="285" x2="300" y2="360" stroke="#e05c5c" stroke-width="1.5" stroke-linecap="round"/><rect x="292" y="298" width="16" height="44" rx="2" fill="#e05c5c"/><line x1="320" y1="292" x2="320" y2="378" stroke="#e05c5c" stroke-width="1.5" stroke-linecap="round"/><rect x="312" y="305" width="16" height="50" rx="2" fill="#e05c5c"/><line x1="340" y1="350" x2="340" y2="390" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><rect x="332" y="360" width="16" height="26" rx="2" fill="#00d27a"/><line x1="360" y1="338" x2="360" y2="385" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><rect x="352" y="348" width="16" height="30" rx="2" fill="#00d27a"/><circle cx="340" cy="390" r="7" fill="rgba(0,210,122,0.18)" stroke="#00d27a" stroke-width="1.8"/><text font-family="DM Sans,sans-serif" font-size="11" x="340" y="415" text-anchor="middle" fill="#00d27a">Buy</text><line x1="380" y1="248" x2="380" y2="308" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><rect x="372" y="262" width="16" height="30" rx="2" fill="#00d27a"/><line x1="400" y1="225" x2="400" y2="292" stroke="#e05c5c" stroke-width="1.5" stroke-linecap="round"/><rect x="392" y="242" width="16" height="32" rx="2" fill="#e05c5c"/><circle cx="400" cy="225" r="7" fill="rgba(224,92,92,0.18)" stroke="#e05c5c" stroke-width="1.8"/><text font-family="DM Sans,sans-serif" font-size="11" x="400" y="210" text-anchor="middle" fill="#e05c5c">Sell</text><line x1="420" y1="248" x2="420" y2="312" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><rect x="412" y="260" width="16" height="38" rx="2" fill="#00d27a"/><line x1="440" y1="322" x2="440" y2="365" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><rect x="432" y="332" width="16" height="28" rx="2" fill="#00d27a"/><circle cx="440" cy="365" r="7" fill="rgba(0,210,122,0.18)" stroke="#00d27a" stroke-width="1.8"/><text font-family="DM Sans,sans-serif" font-size="11" x="440" y="390" text-anchor="middle" fill="#00d27a">Buy</text><line x1="55" y1="461" x2="490" y2="352" stroke="#00d27a" stroke-width="2.2" stroke-dasharray="8 4" opacity="0.9"/><line x1="55" y1="311" x2="490" y2="202" stroke="#e05c5c" stroke-width="2.2" stroke-dasharray="8 4" opacity="0.9"/><polygon points="55,311 490,202 490,352 55,461" fill="rgba(107,114,128,0.04)"/><text font-family="DM Sans,sans-serif" font-size="11" x="498" y="206" fill="#e05c5c">Upper — sell zone</text><text font-family="DM Sans,sans-serif" font-size="11" x="498" y="356" fill="#00d27a">Lower — buy zone</text><text font-family="DM Sans,sans-serif" font-size="11" x="270" y="510" text-anchor="middle" fill="#6b7280">Buy at lower trendline, target is upper trendline. Take profits there — do not hold hoping for a break.</text></svg></div><p>A channel is formed when price action moves between two parallel trendlines — one connecting the highs and one connecting the lows. Channels define both your entry and your target simultaneously.</p><h3>Types of channels</h3><p><strong>Ascending channel</strong> — both trendlines slope upward. Trade the bounces off the lower trendline toward the upper trendline.</p><p><strong>Descending channel</strong> — both trendlines slope downward. Trade the rejections off the upper trendline toward the lower trendline.</p><h3>How to trade a channel</h3><p>Enter near the lower trendline in an ascending channel with a stop just below it. Target the upper trendline. When price reaches the upper trendline, take profits — don't hold hoping for a break. Respect the target.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Channels are most useful when they're clean and well-established. A channel with four or more touches on both trendlines is the gold standard. Two touches on one side and one on the other is a potential channel — not a confirmed one. Wait for confirmation before trading it.</p></div>`},

 stroke="#e05c5c" stroke-width="1.5" stroke-linecap="round"/><rect x="316" y="160" width="16" height="20" rx="2" fill="#e05c5c"/><line x1="344" y1="167" x2="344" y2="192" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><rect x="336" y="173" width="16" height="11" rx="2" fill="#00d27a"/><line x1="364" y1="182" x2="364" y2="195" stroke="#888780" stroke-width="1.5" stroke-linecap="round"/><rect x="356" y="185" width="16" height="5" rx="2" fill="#888780"/><text font-family="DM Sans,sans-serif" font-size="11" x="310" y="225" text-anchor="middle" fill="#6b7280">Pennant — candles compress toward apex as vol dries up</text><line x1="404" y1="170" x2="404" y2="202" stroke="#00d27a" stroke-width="2.5" stroke-linecap="round"/><rect x="394" y="126" width="20" height="44" rx="2" fill="#00d27a" stroke="#009955" stroke-width="2"/><line x1="404" y1="112" x2="404" y2="126" stroke="#00d27a" stroke-width="2.5" stroke-linecap="round"/><line x1="428" y1="142" x2="428" y2="175" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="419" y="100" width="18" height="42" rx="2" fill="#00d27a"/><line x1="428" y1="86" x2="428" y2="100" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><line x1="450" y1="112" x2="450" y2="148" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="441" y="68" width="18" height="44" rx="2" fill="#00d27a"/><line x1="450" y1="54" x2="450" y2="68" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><text font-family="DM Sans,sans-serif" font-size="11" x="428" y="40" text-anchor="middle" fill="#00d27a">Breakout + volume surge</text><line x1="392" y1="200" x2="564" y2="200" stroke="#6b7280" stroke-width="0.5" stroke-dasharray="3 2" opacity="0.4"/><text font-family="DM Sans,sans-serif" font-size="11" x="568" y="204" fill="#6b7280">Entry</text><line x1="392" y1="228" x2="564" y2="228" stroke="#e05c5c" stroke-width="0.5" stroke-dasharray="3 2" opacity="0.4"/><text font-family="DM Sans,sans-serif" font-size="11" x="568" y="232" fill="#e05c5c">Stop (pennant low)</text><line x1="392" y1="80" x2="564" y2="80" stroke="#00d27a" stroke-width="0.5" stroke-dasharray="3 2" opacity="0.4"/><text font-family="DM Sans,sans-serif" font-size="11" x="568" y="84" fill="#00d27a">Target</text></svg></div><p>Flags and pennants are continuation patterns — they signal a temporary pause in a strong trend before the trend resumes. They are among the most reliable and most tradeable patterns in all of technical analysis.</p><h3>The Bull Flag</h3><p>Formed after a sharp, strong move up — the pole. Price then consolidates in a tight, slightly downward channel — the flag. Volume decreases during the flag as sellers take profits but buyers absorb the selling.</p><h3>The Bear Flag</h3><p>The mirror image of the bull flag. After a sharp drop the pole, price consolidates in a tight, slightly upward drift on low volume. This is not a recovery. It is a pause before the next leg down. When price breaks below the lower boundary of the flag with volume, the next selloff begins.</p><h3>The Pennant</h3><p>A pennant forms the same way as a flag, strong pole followed by a consolidation, but instead of a channel drifting in one direction, the consolidation forms a small symmetrical triangle. Price compresses into a tighter and tighter range as buyers and sellers battle it out. Volume dries up as the triangle narrows. The breakout from a pennant is often more explosive than a flag because the compression builds more energy before the release.</p><h3>Volume Signature</h3><p>High volume on the pole. Decreasing volume during the consolidation. Expanding volume on the breakout. This volume pattern is what makes both flags and pennants high conviction setups.</p><h3>What Is Happening Behind the Scenes</h3><p><strong>Flag</strong> - controlled profit-taking after a strong move. The trend is still intact. Buyers are resting, not retreating. Sellers are absorbing supply but cannot push price significantly lower. When the selling dries up and buyers step back in, the breakout follows. This is a healthier, more predictable trend continuation.</p><p><strong>Pennant</strong> - more indecision than a flag. Both buyers and sellers are uncertain. Price compresses as the two sides balance out. Volume disappears. When one side finally wins, the breakout tends to be sharper and more explosive because all that coiled energy releases at once. Fakeouts are more common with pennants so volume confirmation on the breakout is non-negotiable.</p><h3>Trading Difference</h3><p><strong>Flag</strong> - easier to read, smoother entries, more predictable movement. The channel gives you clear boundaries and a clear entry trigger. Lower risk of a fakeout if volume is declining properly.</p><p><strong>Pennant</strong> - trickier to trade. The converging trendlines can produce false breakouts on either side. Wait for a full candle close outside the triangle with above average volume before entering. When a real pennant breaks, it breaks hard.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The best flags and pennants are tight and short. A consolidation that lasts 2-5 candles on your trading timeframe is ideal. The longer it drags on, the more momentum the stock loses. Tight, clean, short duration - that is the setup you want.</p></div>`},
'b6-1':{title:'Triangles',content:`<p>Triangles are consolidation patterns formed by converging trendlines — price making lower highs and higher lows simultaneously, compressing into a point.</p><h3>Symmetrical Triangle</h3><p>Upper trendline slopes down, lower trendline slopes up. The pattern is neutral — it can break either direction. Wait for the break and trade in that direction. Don't predict direction.</p><h3>Ascending Triangle</h3><p>Flat upper trendline with a rising lower trendline. Bullish pattern — buyers are getting more aggressive. The flat upper resistance is under increasing pressure and will likely break to the upside.</p><h3>Descending Triangle</h3><p>Flat lower trendline with a declining upper trendline. Bearish pattern. Sellers are getting more aggressive while buyers defend a flat support level.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Ascending and descending triangles give you directional bias before the breakout — use it. An ascending triangle that's held its flat top three times with declining volume is a high probability long setup. You can enter near the lower trendline anticipating the break. Just keep your stop tight.</p></div>`},

</svg></div><p>The Head and Shoulders pattern signals a potential change from an uptrend to a downtrend. Most reliable when it forms after a prolonged advance.</p><h3>The anatomy</h3><ul><li>Left shoulder — a rally followed by a pullback</li><li>Head — a higher rally followed by a pullback to roughly the same level</li><li>Right shoulder — a rally that fails to reach the head, followed by a pullback</li></ul><p>The neckline connects the two pullback lows. When price breaks below the neckline, the pattern is confirmed.</p><h3>Inverse Head & Shoulders</h3><p>The bullish reversal version — same pattern upside down. Signals a transition from downtrend to uptrend.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The right shoulder is the most important part of this pattern. A right shoulder that forms with declining volume and fails to come close to the head tells you momentum has completely shifted to the sellers. The neckline break is coming. Start watching closely and prepare your entry.</p></div>`},

</svg></div><p>Double tops and double bottoms form when price tests a significant level twice, fails to break through, and reverses.</p><h3>Double Top</h3><p>Price rallies to a resistance level, pulls back, rallies again to roughly the same level, and fails again — creating an M shape on the chart. The pattern is confirmed when price breaks below the pullback low between the two tops.</p><h3>Double Bottom</h3><p>Mirror image — price tests support twice, holds both times, and breaks above the pullback high between the two bottoms. The W shape. Confirmed bullish reversal.</p><h3>The nuance</h3><p>The best double tops and bottoms have the second test on lower volume than the first — it signals the move is losing conviction.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Double tops are some of the most reliable short setups you'll find. When a stock makes a new high on huge volume, pulls back, attempts the high again on lower volume, and fails — you have a clear picture. Strong rejection, declining momentum, well-defined risk above the second top.</p></div>`},

<text font-family="DM Sans,sans-serif" font-size="10" x="42" y="122" text-anchor="middle" fill="#6b7280">Cup depth</text>
</svg></div><p>The Cup and Handle is a bullish continuation pattern made famous by William O'Neil. It forms over a longer time period — typically weeks to months — and signals a stock consolidating before a major breakout.</p><h3>The Cup</h3><p>A rounded, U-shaped consolidation. Price declines gradually, rounds out at the bottom without sharp moves, and gradually rises back to near the prior high. The key word is rounded — not a V-shape. The gradual rounding indicates orderly accumulation.</p><h3>The Handle</h3><p>After the cup forms, a small consolidation forms — typically a slight downward drift on low volume. The handle shakes out the last remaining weak holders before the breakout.</p><ul><li><strong>Entry:</strong> When price breaks above the handle's upper trendline with strong volume</li><li><strong>Stop:</strong> Below the handle's low</li><li><strong>Target:</strong> The depth of the cup added to the breakout point</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>The cup and handle is a longer term pattern — most effective on daily and weekly charts. The pattern derives its strength from the extended accumulation period. The longer the base, the bigger the potential move.</p></div>`},
'b7-0':{title:'What Is Consolidation',content:`<p>Most chart patterns you'll learn — flags, pennants, triangles, cups and handles — are simply consolidation taking a recognizable form. Understanding consolidation first is what makes those patterns make sense.</p><p>Consolidation is a period of sideways price action after a directional move. The market moves in phases — impulse moves followed by consolidation, then another impulse move. Learning to identify consolidation patterns and wait for the breakout is one of the most powerful skills in trading.</p><h3>Healthy consolidation characteristics</h3><ul><li>Tight price range — price is coiling, not swinging wildly</li><li>Decreasing volume — the battle is quieting down</li><li>Clean structure — clear upper and lower boundaries that price respects</li><li>Time — consolidation takes time to build. A one or two candle pause is not consolidation.</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>Not all tight ranges are healthy consolidation. A stock consolidating after a strong move is building energy for the next leg. A stock consolidating after a failed breakout with heavy selling is distributing — smart money is selling to retail buyers who think the consolidation is a gift. Always identify the context.</p></div>`},
'b7-1':{title:'Trading Inside Consolidation',content:`<p>Once you've identified a consolidation, you have two choices — trade within the range or wait for the breakout. Both are valid strategies but they have different risk profiles.</p><h3>Trading within the range</h3><p>Buy near the bottom of the consolidation with a stop just below it. Sell near the top. This requires the range to be wide enough to justify the trade — you need enough room between your entry and your target to achieve a minimum 2:1 reward to risk ratio.</p><h3>What not to do</h3><p>Don't buy in the middle of consolidation. You have no edge there — you're too far from support for a tight stop on a long, and too far from resistance for a tight stop on a short. The middle of a range is where you go to give money away.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The best consolidations to trade within are the wide, clean, well-defined ones with multiple touches on both boundaries. If you can't clearly see the top and the bottom, don't trade within it. Wait for the breakout instead.</p></div>`},
'b7-2':{title:'Breakouts From Consolidation',content:`<p>The breakout from consolidation is where the real opportunity lies. After price has coiled in a tight range and volume has dried up, the eventual expansion of volume and price is one of the most reliable setups in trading.</p><h3>What a quality breakout looks like</h3><ul><li>Price approaches the upper boundary that has held multiple times</li><li>Volume begins to increase as the level is tested</li><li>Price breaks through cleanly — not just a wick poke</li><li>Volume expands significantly on the break</li><li>The candle that breaks out has a strong close — not a close back inside the range</li></ul><h3>The failed breakout</h3><p>Price breaks above resistance, attracts buyers who chase the breakout, then immediately reverses back into the range. This is a bull trap. It's why volume confirmation is non-negotiable.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The best breakouts make you feel like you're chasing. By the time the candle closes above resistance on high volume and you're convinced it's real, the stock has already moved 1-2%. That's okay. The entry that feels safe and obvious is usually the entry that's actually late.</p></div>`},
'b8-0':{title:'Types of Gaps',content:`<p>A gap is an area on the chart where no trading occurred — price jumped from one level to another without any transactions in between. Gaps represent a significant imbalance between buyers and sellers.</p><h3>Common Gap</h3><p>A small gap with no particular significance. These gaps fill quickly and frequently. Low trading value.</p><h3>Breakaway Gap</h3><p>Occurs at the breakout of a significant pattern. High volume, significant news or catalyst. This type of gap signals the beginning of a new trend. Breakaway gaps rarely fill quickly — the move has conviction behind it.</p><h3>Runaway Gap (Continuation Gap)</h3><p>Occurs in the middle of a strong trend. Signals that momentum is accelerating and institutional participation is increasing.</p><h3>Exhaustion Gap</h3><p>Occurs near the end of a strong trend — often on very high volume after a prolonged move. The gap looks like the trend is accelerating but it's actually the final wave before exhaustion. These gaps fill relatively quickly.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The type of gap matters enormously. A gap up on earnings after a stock that's been building a solid base for months is a breakaway gap — don't fade it. A gap up after a stock has already run 40% in a week on massive volume is an exhaustion gap — don't chase it. Context, context, context.</p></div>`},
'b8-1':{title:'Gap Fills',content:`<p>A gap fill occurs when price returns to the level where the gap began — essentially closing the open space left on the chart.</p><h3>Gaps that fill quickly</h3><ul><li>Common gaps — no real catalyst, fill within a day or two</li><li>Exhaustion gaps — the trend is ending, price reverses to fill the gap</li><li>Gap downs on weak catalysts — buyers step in quickly</li></ul><h3>Gaps that take time or don't fill</h3><ul><li>Breakaway gaps on strong catalysts — strong earnings beat, major contract, FDA approval</li><li>Runaway gaps in strong sector trends — the gap is a symptom of something larger</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>Stop trying to fade every gap. A stock that gaps up 15% on a massive earnings beat is not necessarily going to fill that gap today, this week, or this month. Before you fade any gap ask yourself — is this catalyst strong enough to justify the gap? If yes, respect the move. If no, the fill trade has merit.</p></div>`},
'b8-2':{title:'Trading Gaps',content:`<p>Gaps create some of the most consistent and high probability trade setups available.</p><h3>Gap and Go</h3><p>A stock gaps up significantly on news or earnings. The setup is to buy the early consolidation after the initial gap move with a tight stop below the consolidation low. Target is measured by the pre-market high or prior resistance levels. Most applicable to: Strong earnings beats, major catalysts, stocks with high relative volume.</p><h3>Gap Fill Trade</h3><p>Buying a gap down or shorting a gap up expecting price to return to the prior close. Best applied to small gaps under 3% on weak or no catalysts.</p><h3>Gap as Support/Resistance</h3><p>After a gap up, the bottom of the gap frequently acts as support on any pullback. After a gap down, the top of the gap acts as resistance on any bounce. These levels are clean, obvious, and widely watched.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The gap and go requires discipline — you must wait for the early consolidation. Buying immediately at the open of a gapping stock without any consolidation is chasing, not trading.</p></div>`},
'b9-0':{title:'Reading Level 2',content:`<p>Level 2 is a display of all the current bids and offers for a stock — showing you not just the best price but the depth of the order book.</p><h3>The components of Level 2</h3><ul><li><strong>Bid side</strong> — all buyers, organized from highest price to lowest.</li><li><strong>Ask side</strong> — all sellers, organized from lowest price to highest.</li><li><strong>Size</strong> — the number of shares at each price level.</li></ul><h3>What Level 2 tells you</h3><p>Where the walls are — large blocks of shares at a specific price create temporary support or resistance. A seller with 50,000 shares at $50.00 is a wall — price will struggle to push through until that seller is absorbed or moves their order.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Level 2 is a tool for experienced traders — beginners often overthink it. The most important thing to watch is whether bids or asks are dominating. Are buyers aggressive and refreshing their bids? Or are sellers stepping in front of every uptick?</p></div>`},
'b9-1':{title:'Reading the Tape',content:`<p>The tape — also called time and sales — is a real time record of every transaction that occurs in a stock.</p><ul><li><strong>Green prints</strong> — trades that executed at the ask price. Buyers were aggressive.</li><li><strong>Red prints</strong> — trades that executed at the bid price. Sellers were aggressive.</li><li><strong>Large prints</strong> — big blocks of shares trading at once. Institutional activity.</li></ul><h3>Tape speed</h3><p>Fast tape with many prints — high activity, strong momentum. Slow tape with few prints — low interest, little conviction. The move may stall.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The tape tells the truth when the chart might lie. A chart can show a breakout that looks clean — but if the tape is showing nothing but red prints and sellers hitting bids on every uptick, that breakout is not what it appears. Learn to read it and you'll have an edge that most retail traders simply don't have.</p></div>`},
'b9-2':{title:'Spotting Buyers & Sellers',content:`<p>The ultimate goal of reading Level 2 and the tape is to identify who is in control — buyers or sellers — in real time.</p><h3>Signs of aggressive buying</h3><ul><li>Bids stacking up and refreshing quickly after being hit</li><li>Large green prints repeatedly lifting the ask</li><li>Price stepping up in an orderly staircase pattern</li><li>Ask side thinning out — sellers are being absorbed</li></ul><h3>Signs of aggressive selling</h3><ul><li>Asks refreshing quickly after being hit</li><li>Large red prints hitting bids repeatedly</li><li>Price stepping down in an orderly pattern</li><li>Bid side thinning out</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>The best trades are the ones where everything lines up — the chart pattern is clean, the tape shows buyers are aggressive, and Level 2 shows no significant walls above. When all three align it's not just a setup — it's a conviction trade. Those are the ones you size up on.</p></div>`},
'b10-0':{title:'How to Properly Use Indicators',content:`<p>Indicators are mathematical calculations derived from price and volume data. They are tools — not signals. This distinction is critical.</p><p>The biggest mistake beginners make is treating indicators as signals — "the RSI crossed above 30 so I buy." This approach ignores everything else happening in the market.</p><h3>Indicator lag</h3><p>All indicators are lagging — they're derived from past price data. They can never predict the future. They can only describe what has already happened and give you probabilistic insight into what might happen next.</p><h3>Too many indicators</h3><p>A chart covered in 10 different indicators is not a sophisticated chart — it's a confused one. Pick 2-3 indicators that complement each other and master them.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Price action is king. Indicators are servants. If a stock is clearly in an uptrend with strong volume and clean structure, an oversold RSI reading doesn't mean sell. Always start with price. Always.</p></div>`},
'b10-1':{title:'Moving Averages',content:`<p>A moving average smooths out price data over a specific period to show the average price over that time. It's the most widely used indicator in the world.</p><h3>The most important moving averages</h3><ul><li><strong>9 EMA</strong> — short term trend, used by active day and swing traders</li><li><strong>20 SMA</strong> — intermediate trend, acts as dynamic support in uptrending stocks</li><li><strong>50 SMA</strong> — medium term trend, watched by institutional traders</li><li><strong>200 SMA</strong> — long term trend, one of the most watched levels in all of finance</li></ul><h3>How to use them</h3><p>Moving averages act as dynamic support and resistance. In an uptrend, pullbacks to the 20 SMA that hold are buying opportunities. In a downtrend, bounces to the 20 SMA that fail are shorting opportunities.</p><p>Moving average crossovers — when a shorter term average crosses above a longer term average (golden cross) it signals potential bullish momentum. When it crosses below (death cross) it signals potential bearish momentum.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The 20 SMA and 50 SMA on the daily chart are your most important levels as a swing trader. When a stock that's been in a strong uptrend pulls back to its 20 SMA and holds — that's institutional buying. Those levels are watched by the biggest money in the market.</p></div>`},
'b10-2':{title:'RSI',content:`<p>The Relative Strength Index (RSI) is a momentum oscillator that measures the speed and magnitude of recent price changes. It ranges from 0 to 100.</p><ul><li><strong>RSI above 70</strong> — generally considered overbought.</li><li><strong>RSI below 30</strong> — generally considered oversold.</li><li><strong>RSI at 50</strong> — above 50 suggests bullish momentum, below 50 suggests bearish momentum.</li></ul><h3>The correct use of RSI</h3><p><strong>Divergence</strong> — the most powerful RSI signal. Bullish divergence occurs when price makes a lower low but RSI makes a higher low. This means the selling is losing momentum even though price is still declining.</p><p><strong>Trend confirmation</strong> — RSI staying above 50 in an uptrend confirms momentum. RSI breaking below 50 is an early warning sign.</p><div class="callout"><div class="callout-label">TST Edge</div><p>RSI divergence is worth understanding deeply. When a stock is making new lows but RSI is making higher lows — sellers are exhausted. They're pushing price down but doing it with less and less force each time. Price action at support plus RSI divergence is one of the most reliable reversal signals available.</p></div>`},
'b10-3':{title:'MACD',content:`<p>The MACD (Moving Average Convergence Divergence) is a trend-following momentum indicator that shows the relationship between two moving averages — typically the 12 and 26 period EMAs.</p><h3>The components</h3><ul><li><strong>MACD line</strong> — the difference between the 12 EMA and 26 EMA</li><li><strong>Signal line</strong> — a 9 period EMA of the MACD line</li><li><strong>Histogram</strong> — the difference between the MACD line and signal line</li></ul><h3>What MACD tells you</h3><ul><li>MACD line crosses above signal line — bullish signal</li><li>MACD line crosses below signal line — bearish signal</li><li>Both lines above zero — trend is bullish</li><li>Both lines below zero — trend is bearish</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>The MACD is most useful on daily charts for swing traders. On 1 and 5 minute charts it lags too much to be actionable for most setups. Use it to understand the broader momentum picture — is momentum building or fading?</p></div>`},
'b10-4':{title:'VWAP',content:`<p>VWAP — Volume Weighted Average Price — is the average price a stock has traded at throughout the day, weighted by volume. It is arguably the most important indicator for day traders.</p><h3>Why VWAP matters</h3><p>Institutions use VWAP as a benchmark. When they're buying a large position throughout the day they aim to buy near or below VWAP. This creates predictable behavior around the VWAP level.</p><ul><li><strong>Price above VWAP</strong> — buyers are in control. Bullish bias.</li><li><strong>Price below VWAP</strong> — sellers are in control. Bearish bias.</li></ul><h3>Reclaiming VWAP</h3><p>When a stock that's been below VWAP reclaims it and holds above — this is a significant shift. This is a high probability long setup with a stop below VWAP.</p><div class="callout"><div class="callout-label">TST Edge</div><p>VWAP is non-negotiable for day traders. If you don't have it on your chart you're trading blind. It resets every day at the open and represents the true fair value of the stock for that trading session.</p></div>`},
