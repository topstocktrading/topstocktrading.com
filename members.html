
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TST Academy – Members Area</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--green:#00d27a;--green-dark:#00a85f;--dark:#0a0c10;--card:#12151c;--card2:#161920;--border:#1e2330;--text:#e8eaf0;--muted:#6b7280;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{background:var(--dark);color:var(--text);font-family:'DM Sans',sans-serif;line-height:1.6;overflow-x:hidden;display:flex;flex-direction:column;min-height:100vh;}

  #login-screen{position:fixed;inset:0;background:var(--dark);z-index:1000;display:flex;align-items:center;justify-content:center;}
  .login-box{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:48px 40px;width:100%;max-width:420px;text-align:center;}
  .login-logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;color:#fff;margin-bottom:8px;}
  .login-logo span{color:var(--green);}
  .login-subtitle{font-size:14px;color:var(--muted);margin-bottom:32px;}
  .login-box h2{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:#fff;margin-bottom:24px;}
  .input-group{margin-bottom:16px;text-align:left;}
  .input-group label{font-size:12px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:6px;}
  .input-group input{width:100%;background:var(--dark);border:1px solid var(--border);border-radius:8px;padding:12px 16px;color:var(--text);font-size:15px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color 0.2s;}
  .input-group input:focus{border-color:var(--green);}
  .login-btn{width:100%;background:var(--green);color:#0a0c10;border:none;border-radius:8px;padding:14px;font-size:15px;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;margin-top:8px;transition:background 0.2s;}
  .login-btn:hover{background:#00e888;}
  .login-error{font-size:13px;color:#e05c5c;margin-top:12px;display:none;}

  .top-nav{background:rgba(10,12,16,0.95);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:14px 24px;position:sticky;top:0;z-index:100;}
  .nav-logo{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;color:#fff;}
  .nav-logo span{color:var(--green);}
  .nav-right{display:flex;align-items:center;gap:20px;}
  .nav-welcome{font-size:13px;color:var(--muted);}
  .nav-welcome span{color:var(--green);font-weight:500;}
  .logout-btn{font-size:13px;color:var(--muted);background:none;border:1px solid var(--border);border-radius:6px;padding:6px 12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:color 0.2s,border-color 0.2s;}
  .logout-btn:hover{color:#e05c5c;border-color:#e05c5c;}

  .app{display:flex;flex:1;}

  /* SIDEBAR — wider, larger fonts, all green */
  .sidebar{width:320px;min-width:320px;background:var(--card);border-right:1px solid var(--border);height:calc(100vh - 57px);position:sticky;top:57px;overflow-y:auto;padding:16px 0;}
  .sidebar::-webkit-scrollbar{width:4px;}
  .sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

  .progress-wrap{padding:14px 20px 18px;border-bottom:1px solid var(--border);margin-bottom:14px;}
  .progress-label{font-size:12px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;display:flex;justify-content:space-between;}
  .progress-label span{color:var(--green);}
  .progress-bar{height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--green);border-radius:3px;transition:width 0.4s;}

  .sec-group{margin-bottom:6px;}
  .sec-header{padding:11px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;transition:background 0.15s;border-radius:6px;margin:0 8px;}
  .sec-header:hover{background:rgba(255,255,255,0.03);}
  .sec-badge{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:3px 9px;border-radius:3px;flex-shrink:0;background:rgba(0,210,122,0.12);color:var(--green);}
  .sec-name{font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;color:#fff;flex:1;letter-spacing:0.5px;}
  .sec-arrow{color:var(--muted);font-size:11px;transition:transform 0.2s;}
  .sec-header.open .sec-arrow{transform:rotate(90deg);}
  .sec-lessons{display:none;padding:2px 0 8px;}
  .sec-lessons.open{display:block;}

  .mod-header{padding:8px 16px 8px 36px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;transition:background 0.15s;}
  .mod-header:hover{background:rgba(255,255,255,0.02);}
  .mod-name{font-size:13px;color:var(--muted);font-weight:500;}
  .mod-arrow{color:var(--muted);font-size:10px;transition:transform 0.2s;}
  .mod-header.open .mod-arrow{transform:rotate(90deg);}
  .mod-header.open .mod-name{color:var(--text);}
  .sub-list{display:none;}
  .sub-list.open{display:block;}

  .sub-item{padding:6px 16px 6px 52px;font-size:13px;color:var(--muted);cursor:pointer;transition:color 0.15s,background 0.15s;display:flex;align-items:center;gap:7px;}
  .sub-item:hover{color:var(--text);background:rgba(255,255,255,0.02);}
  .sub-item.active{color:var(--green);background:rgba(0,210,122,0.05);}
  .sub-item.done{color:#2e3545;}
  .sub-chk{font-size:11px;min-width:14px;color:var(--muted);}
  .sub-item.active .sub-chk{color:var(--green);}
  .sub-item.done .sub-chk{color:var(--green);}

  .dir-item{padding:7px 16px 7px 36px;font-size:13px;color:var(--muted);cursor:pointer;transition:color 0.15s,background 0.15s;display:flex;align-items:center;gap:7px;}
  .dir-item:hover{color:var(--text);background:rgba(255,255,255,0.02);}
  .dir-item.active{color:var(--green);background:rgba(0,210,122,0.05);}
  .dir-item.done{color:#2e3545;}
  .dir-chk{font-size:11px;min-width:14px;color:var(--muted);}
  .dir-item.active .dir-chk{color:var(--green);}
  .dir-item.done .dir-chk{color:var(--green);}

  .main{flex:1;padding:40px 48px;max-width:900px;}
  .lesson-tag{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--green);font-family:'Rajdhani',sans-serif;font-weight:700;margin-bottom:8px;}
  .lesson-title{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:2px;color:#fff;line-height:1.1;margin-bottom:12px;}
  .lesson-meta{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-bottom:28px;flex-wrap:wrap;}
  .video-wrap{background:#000;border-radius:12px;border:1px solid var(--border);aspect-ratio:16/9;margin-bottom:28px;display:flex;align-items:center;justify-content:center;}
  .vid-ph{text-align:center;}
  .vid-icon{font-size:48px;margin-bottom:10px;opacity:0.2;}
  .vid-ph p{font-size:13px;color:var(--muted);}
  .lc h3{font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:700;color:#fff;margin:28px 0 10px;letter-spacing:0.3px;}
  .lc h3:first-child{margin-top:0;}
  .lc p{font-size:15px;color:var(--muted);line-height:1.8;margin-bottom:12px;}
  .lc ul{margin:0 0 14px 20px;}
  .lc li{font-size:15px;color:var(--muted);line-height:1.8;margin-bottom:6px;}
  .lc li::marker{color:var(--green);}
  .callout{background:rgba(0,210,122,0.06);border-left:3px solid var(--green);border-radius:0 8px 8px 0;padding:14px 18px;margin:18px 0;}
  .callout p{margin:0;color:var(--text);font-size:14px;line-height:1.7;}
  .quote-block{text-align:center;padding:32px 24px;margin:28px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);}
  .quote-text{font-family:'Rajdhani',sans-serif;font-size:22px;font-weight:600;color:#fff;line-height:1.4;margin-bottom:8px;letter-spacing:0.3px;}
  .quote-author{font-size:13px;color:var(--green);}
  .sec-intro-card{background:var(--card2);border:1px solid var(--border);border-radius:16px;padding:32px;margin-bottom:32px;}
  .sic-badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:4px 10px;border-radius:4px;margin-bottom:14px;background:rgba(0,210,122,0.12);color:var(--green);}
  .sec-intro-card h2{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:#fff;margin-bottom:12px;}
  .sec-intro-card p{font-size:15px;color:var(--muted);line-height:1.8;margin-bottom:10px;}
  .topics-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
  .topic-pill{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:6px;padding:4px 12px;font-size:12px;color:var(--muted);}
  .cs-wrap{text-align:center;padding:60px 24px;}
  .cs-icon{font-size:48px;margin-bottom:16px;opacity:0.25;}
  .cs-wrap h3{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px;color:#fff;margin-bottom:8px;}
  .cs-wrap p{font-size:14px;color:var(--muted);}
  .lesson-nav{display:flex;justify-content:space-between;align-items:center;padding-top:28px;border-top:1px solid var(--border);margin-top:24px;}
  .nav-btn{background:transparent;border:1px solid var(--border);border-radius:8px;padding:10px 22px;font-size:14px;color:var(--text);cursor:pointer;font-family:'DM Sans',sans-serif;transition:border-color 0.2s,color 0.2s;}
  .nav-btn:hover{border-color:var(--green);color:var(--green);}
  .nav-btn.primary{background:var(--green);color:#0a0c10;border-color:var(--green);font-weight:700;}
  .nav-btn.primary:hover{background:#00e888;}
  .nav-btn:disabled{opacity:0.3;cursor:not-allowed;pointer-events:none;}

  /* NOTES SYSTEM */
  .notes-wrap{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:28px;}
  .notes-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .notes-title{font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;color:#fff;display:flex;align-items:center;gap:8px;}
  .notes-count{font-size:11px;background:rgba(0,210,122,0.12);color:var(--green);padding:2px 8px;border-radius:10px;font-family:'DM Sans',sans-serif;font-weight:400;}
  .note-input-row{display:flex;gap:8px;margin-bottom:14px;}
  .note-input{flex:1;background:var(--dark);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;outline:none;resize:none;min-height:40px;transition:border-color 0.2s;}
  .note-input:focus{border-color:var(--green);}
  .note-save-btn{background:var(--green);color:#0a0c10;border:none;border-radius:8px;padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;align-self:flex-start;}
  .note-save-btn:hover{background:#00e888;}
  .notes-list{display:flex;flex-direction:column;gap:8px;max-height:240px;overflow-y:auto;}
  .notes-list::-webkit-scrollbar{width:3px;}
  .notes-list::-webkit-scrollbar-thumb{background:var(--border);}
  .note-item{background:var(--dark);border:1px solid var(--border);border-radius:8px;padding:10px 14px;display:flex;align-items:flex-start;gap:10px;}
  .note-ts{font-size:11px;color:var(--green);font-weight:700;cursor:pointer;white-space:nowrap;padding:2px 8px;background:rgba(0,210,122,0.08);border-radius:4px;border:1px solid rgba(0,210,122,0.2);transition:background 0.15s;flex-shrink:0;}
  .note-ts:hover{background:rgba(0,210,122,0.16);}
  .note-text{font-size:13px;color:var(--text);line-height:1.6;flex:1;}
  .note-delete{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:0 2px;flex-shrink:0;}
  .note-delete:hover{color:#e05c5c;}
  .notes-empty{font-size:13px;color:var(--muted);text-align:center;padding:16px 0;}

  /* MY NOTES PAGE */
  .all-notes-lesson{margin-bottom:24px;}
  .all-notes-lesson-title{font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;color:#fff;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .all-notes-lesson-sec{font-size:11px;color:var(--muted);font-weight:400;}



  .ai-fab{position:fixed;bottom:28px;right:28px;background:var(--green);color:#0a0c10;border:none;border-radius:50px;padding:13px 20px;font-size:13px;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;display:flex;align-items:center;gap:7px;box-shadow:0 4px 20px rgba(0,210,122,0.25);transition:transform 0.2s;z-index:200;}
  .ai-fab:hover{transform:translateY(-2px);}
  .ai-panel{position:fixed;bottom:85px;right:28px;width:350px;background:var(--card);border:1px solid var(--border);border-radius:16px;display:none;flex-direction:column;z-index:200;overflow:hidden;}
  .ai-panel.open{display:flex;}
  .ai-ph{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .ai-pt{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;color:#fff;display:flex;align-items:center;gap:7px;}
  .ai-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
  .ai-x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;}
  .ai-msgs{height:260px;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}
  .ai-msgs::-webkit-scrollbar{width:3px;}
  .ai-msgs::-webkit-scrollbar-thumb{background:var(--border);}
  .ai-msg{max-width:85%;padding:9px 13px;border-radius:10px;font-size:13px;line-height:1.6;}
  .ai-msg.bot{background:var(--card2);color:var(--text);align-self:flex-start;}
  .ai-msg.user{background:var(--green);color:#0a0c10;align-self:flex-end;font-weight:500;}
  .ai-iw{padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:7px;}
  .ai-in{flex:1;background:var(--dark);border:1px solid var(--border);border-radius:7px;padding:9px 12px;color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;outline:none;}
  .ai-in:focus{border-color:var(--green);}
  .ai-send{background:var(--green);color:#0a0c10;border:none;border-radius:7px;padding:9px 13px;font-size:13px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;}
  @media(max-width:768px){.sidebar{display:none;}.main{padding:24px 16px;}.progress-ring{display:none;}}
</style>

</head>

<script>
const SUPABASE_URL='https://jjecwvcxbocogvwsjwmr.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpqZWN3dmN4Ym9jb2d2d3Nqd21yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0MzMxMjcsImV4cCI6MjA5NDAwOTEyN30.Eb2DuAqv1D9d4IoWpyXLSGZGUS4QLS116xEYUgDyYNY';
async function loadLessonCharts(lessonId){try{const r=await fetch(SUPABASE_URL+'/storage/v1/object/list/lesson-charts',{method:'POST',headers:{'Authorization':'Bearer '+SUPABASE_ANON,'Content-Type':'application/json'},body:JSON.stringify({prefix:lessonId+'-',limit:20})});const files=await r.json();if(!files||!files.length)return '';return files.map(function(f){var url=SUPABASE_URL+'/storage/v1/object/public/lesson-charts/'+f.name;return '<div class="chart-box" style="margin-top:20px"><img src="'+url+'" style="width:100%;border-radius:8px;border:1px solid var(--border);display:block;" loading="lazy"/></div>';}).join('');}catch(e){return '';}}
const LESSONS={
'b-pillars':{title:'The 3 Pillars of Trading',content:`<p>Before you ever look at a chart, open a brokerage account, or place a trade — you need to understand what separates consistently profitable traders from everyone else. It's not a secret indicator. It's not a special scanner. It's three things done consistently.</p><h3>Pillar 1 — Idea Generation</h3><p>Where does the trade come from? Every good trade starts with a reason. A catalyst. A setup. News, earnings, technical breakout, sector rotation — something that makes this stock worth paying attention to right now. Idea generation is your filter. It's how you go from 8,000 stocks to the 3-5 that actually deserve your attention today.</p><h3>Pillar 2 — The Setup</h3><p>Once you have an idea, you need a setup. The setup answers the question — where exactly do I get in, where am I wrong, and where am I taking profits? A setup is not "I think this stock is going up." A setup is specific — entry, stop, target. Specificity is everything.</p><h3>Pillar 3 — Risk Management</h3><p>This is the one most beginners skip and the reason most beginners fail. Risk management answers the question — how much of my account am I willing to lose on this single trade? The answer should never be more than 1-2%. Ever. One bad trade should never threaten your ability to come back tomorrow.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The order matters. Idea first. Setup second. Risk third. Most beginners do it backwards — they size up first, find a setup second, and never had an idea to begin with. That's why they lose.</p></div>`},
'b-types':{title:'Types of Traders',content:`<p>Not every trader is the same and not every trading style is right for every person. One of the biggest mistakes beginners make is trying to trade like someone else — copying a style that doesn't fit their personality, schedule, or risk tolerance.</p><h3>Scalper</h3><p>Holds trades for seconds to minutes. Extremely high frequency. Requires intense focus, lightning fast execution. Best for people who thrive under pressure and can detach emotionally from rapid wins and losses.</p><h3>Day Trader</h3><p>Holds trades for minutes to hours. Never holds overnight. Focused primarily on the open and power hour. Best for people who can dedicate their morning to the market.</p><h3>Swing Trader</h3><p>Holds trades for days to weeks. Requires less screen time — often just 30-60 minutes per day for analysis. Best for people with full time jobs who can't watch the market all day.</p><h3>Long Term Investor</h3><p>Holds positions for months to years. Focused on fundamentals, sector trends, and macro themes. Best for people building wealth over time who aren't interested in short term volatility.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Most successful traders end up being a combination of styles. The goal isn't to pick one box and live in it forever — it's to understand which style fits your life and your psychology and start there.</p></div>`},
'b-hours':{title:'Market Hours',content:`<p>The market doesn't treat all hours equally. Knowing when to trade is just as important as knowing what to trade.</p><h3>Pre-Market (4:00 AM — 9:30 AM ET)</h3><p>Lower volume, wider spreads, more volatile. News and earnings reports hit during this window. Best used for research and preparation.</p><h3>Market Open (9:30 AM — 10:30 AM ET)</h3><p>The highest volume, highest volatility window of the day. This is where the most opportunity exists — and also where the most damage is done to undisciplined traders. The open rewards preparation and punishes impulsiveness.</p><h3>Midday (10:30 AM — 2:00 PM ET)</h3><p>Volume drops significantly. Spreads widen. Price action gets choppy and unreliable. For most retail traders — especially beginners — this is the most dangerous time to trade.</p><h3>Power Hour (3:00 PM — 4:00 PM ET)</h3><p>Volume picks back up as institutions rebalance portfolios. The second best window of the day for active traders.</p><h3>After Hours (4:00 PM — 8:00 PM ET)</h3><p>Earnings reports frequently release here. Very low volume, very wide spreads. Not recommended for most beginners.</p><div class="callout"><div class="callout-label">TST Edge</div><p>If you only traded the open and power hour and did nothing in between, your results would probably improve immediately. Midday chop kills more accounts than bad setups ever will, especially if you trade options.</p></div>`},
'b2-0':{title:'Why Volume Matters',content:`<p>Volume is the number of shares traded during a specific time period. It is the single most important confirming indicator in all of technical analysis. Price tells you where the market went. Volume tells you how much conviction was behind the move.</p><p>Think of it this way — if a stock moves up 10% on 100,000 shares traded, that's a very different signal than moving up 10% on 1,000,000 shares traded. The first move has weak conviction. The second has institutional participation. The chart pattern looks the same but the story is completely different.</p><ul><li><strong>High volume on a move up</strong> — buyers are aggressive. Institutional money is participating.</li><li><strong>Low volume on a move up</strong> — retail participation, weak hands, easily reversed.</li><li><strong>High volume on a move down</strong> — sellers are aggressive. Distribution is occurring.</li><li><strong>Low volume on a move down</strong> — sellers aren't committed. Could be temporary profit taking.</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>Price without volume is just a suggestion. Volume gives you conviction. Always check what volume is doing before entering a position. If a stock breaks out of a pattern on low volume, wait. The breakout hasn't been confirmed yet.</p></div>`},
'b2-1':{title:'Volume Signals',content:`<p>Beyond simply high or low volume, there are specific volume signals that appear repeatedly and carry significant meaning.</p><h3>Volume Spike</h3><p>A sudden dramatic increase in volume — often 3x to 10x the average. Usually signals a major event — earnings, news, institutional accumulation or distribution. A volume spike with no news is often more significant than one with an obvious catalyst.</p><h3>Climax Volume</h3><p>Extremely high volume after an extended move in one direction — often signaling exhaustion. When a stock that's been running for days suddenly prints the highest volume day of the move with little price progress, that's climax volume. The move may be ending.</p><h3>Volume Dry Up</h3><p>Volume that progressively decreases over several candles while price consolidates in a tight range. This is actually a positive signal — it means sellers have been absorbed and the stock is resting before the next move.</p><h3>Below Average Volume</h3><p>Any move on below average volume should be treated with skepticism. It means the move lacks institutional participation and is more likely to reverse.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Volume dry up during a consolidation is one of the most reliable signals that a stock is about to make a significant move. Stocks don't move in straight lines — they move, they rest on low volume, and then they move again. The low volume rest period is where you want to be positioning.</p></div>`},
'b2-2':{title:'Volume & Price Action',content:`<p>The relationship between volume and price is the foundation of institutional analysis.</p><ul><li><strong>Price up, volume up</strong> — healthy bullish trend.</li><li><strong>Price up, volume down</strong> — weakening trend. Distribution may be occurring.</li><li><strong>Price down, volume up</strong> — aggressive selling. Real distribution.</li><li><strong>Price down, volume down</strong> — weak selling pressure. Could be a natural pullback.</li></ul><h3>The Breakout Volume Rule</h3><p>Any breakout from a pattern must be accompanied by above average volume to be considered valid. A breakout on below average volume is a false breakout candidate. Wait for volume confirmation before entering.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The most dangerous trade in markets is buying a breakout on low volume. It looks exactly like a real breakout — but without volume behind it, you're often the last buyer before a reversal. Volume confirms. Always.</p></div>`},
'b3-0':{title:'What Is Support & Resistance',content:`<p>Support is a price level where buying interest is strong enough to stop a decline and potentially reverse it. Think of support as a floor. When price approaches this level, buyers step in and defend it. The more times a level has held, the more significant it becomes.</p><p>Resistance is a price level where selling interest is strong enough to stop an advance and potentially reverse it. Think of resistance as a ceiling. When price approaches this level, sellers step in and defend it.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Support and resistance are not precise lines — they are zones. A level that was support at $49.80 might hold at $49.50 the next time. Think in terms of areas rather than exact prices. Give levels a little room and your entries will be far more consistent.</p></div>`},
'b3-1':{title:'Identifying Key Levels',content:`<p>Not all support and resistance levels are created equal. Learning to identify the most significant levels — the ones institutions are watching — is a skill that separates good traders from average ones.</p><ul><li><strong>Prior highs and lows</strong> — prior all-time highs, prior day highs and lows, prior week highs and lows.</li><li><strong>Whole numbers</strong> — $1, $10, $50, $100, $200. Round numbers attract large option strikes, institutional orders, and retail stop losses.</li><li><strong>Areas of high volume</strong> — where the most trading has occurred historically. That level has memory.</li><li><strong>Gap levels</strong> — the top and bottom of unfilled price gaps. Gaps frequently act as magnets.</li><li><strong>Moving averages</strong> — the 10, 20, 50, and 200 day moving averages act as dynamic support and resistance.</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>The best key levels are the ones you identified before price reached them. Start your pre-market prep by marking the most significant levels on your watchlist stocks before the market opens. Those are your decision points for the day. Examples: Previous day high, previous day low, previous day close, premarket low, premarket high, and once market opens the opening print. Always look for confluence — without multiple confluences it's simply just a line.</p></div>`},
'b3-2':{title:'How Price Reacts to Levels',content:`<p>Understanding that a level exists is half the battle. Understanding how price typically behaves when it reaches that level is the other half.</p><h3>Clean holds</h3><p>Price approaches the level, pauses, and reverses cleanly. This is the strongest signal and produces the highest quality setups. Enter on the bounce with a stop just below the level.</p><h3>Level breaks and reclaims</h3><p>Price briefly breaks below a support level, shakes out weak holders, then reclaims it quickly. This is called a stop hunt or liquidity sweep. The reclaim of the level is actually a stronger signal than a clean hold because it has already flushed the weak hands.</p><h3>Multiple tests weakening the level</h3><p>The more times a level is tested the weaker it becomes. When a level finally gives way after multiple tests the move tends to be significant.</p><h3>Polarity</h3><p>One of the most powerful concepts in technical analysis. When support breaks it often becomes resistance, and when resistance breaks it often becomes support. There's a saying in trading: "old support becomes new resistance" and vice versa. If the stock couldn't break $10 and finally broke that resistance, $10 would now become the support instead of resistance.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The cleanest trade in all of technical analysis is the polarity play — waiting for a key level to break, watching price pull back to retest that level from the other side, and entering when price holds. The level has been tested, confirmed, and now has fresh buyers underneath it. Risk is well defined and the setup is clean.</p></div>`},

</svg></div><p>Market structure is how price moves over time. Understanding structure is understanding trend — the single most important skill for knowing whether to be a buyer, a seller, or flat.</p><p>An uptrend is defined by higher highs and higher lows.</p><ul><li><strong>Higher high</strong> — each swing high is above the prior swing high. Buyers are pushing price to new levels on each wave up.</li><li><strong>Higher low</strong> — each pullback finds support at a higher level than the prior pullback. Sellers are getting weaker. Buyers are stepping in earlier on each dip.</li></ul><p>When you see this pattern the market is in a healthy uptrend. Your bias should be bullish. Look for opportunities to buy pullbacks — not opportunities to short into strength.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Most beginners try to short uptrending stocks because they feel "too high." This is one of the most expensive mistakes you can make. The trend is your edge. Trading against it is swimming upstream. In an uptrend your job is to find the best place to buy — not to predict the top.</p></div>`},

</svg></div><p>The mirror image of an uptrend is a downtrend — defined by lower highs and lower lows.</p><ul><li><strong>Lower low</strong> — each swing low is below the prior swing low. Sellers are pushing price to new lows on each wave down.</li><li><strong>Lower high</strong> — each bounce finds resistance at a lower level than the prior bounce. Buyers are getting weaker. Sellers are stepping in earlier on each rally.</li></ul><h3>The structure break</h3><p>The most significant event in any trend is a structure break — when price finally breaks above a lower high in a downtrend or below a higher low in an uptrend. This signals a potential trend change. The first structure break is not necessarily the end of the trend — but it is always a warning sign.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Lower highs are one of the most reliable signals in trading. When a stock that's been uptrending starts making a lower high on the bounce, sellers are stepping in at lower and lower prices. The uptrend is losing steam. Start tightening stops and reducing position size.</p></div>`},
'b4-2':{title:'Range Bound Markets',content:`<p>Not every market is trending. In fact, markets spend roughly 70% of their time in a range — bouncing between a defined support and resistance level without making meaningful progress in either direction.</p><h3>What is a range?</h3><p>A range is a period where price oscillates between a clear ceiling and a clear floor. The highs are roughly equal. The lows are roughly equal. The market is in equilibrium.</p><h3>How to trade a range</h3><p>Buy near the bottom of the range when price shows signs of holding. Sell or short near the top when price shows signs of rejection. Take profits before the opposite side — don't hold for the full range width hoping for more.</p><h3>Range breakouts</h3><p>The most powerful moves come when a range finally resolves — when price breaks above the upper boundary or below the lower boundary with volume. The longer the range, the more powerful the eventual breakout.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Ranges are where patient traders make money and impatient traders lose it. If you can't clearly identify whether you're near support or resistance, you're in the middle of the range. Step away. Come back when price gives you a better location.</p></div>`},
'b5-0':{title:'Drawing Trendlines',content:`<p>A trendline is a straight line drawn along a series of highs or lows that visually represents the direction and angle of a trend.</p><h3>How to draw a valid trendline</h3><p>An uptrend trendline connects a series of higher lows. You need at least two confirmed lows to draw the line — but the line only becomes significant after the third touch confirms it. Draw the line along the bottom of the wicks, not the bodies.</p><p>A downtrend trendline connects a series of lower highs. Two points to draw, three touches to confirm significance. Draw along the tops of the wicks.</p><h3>Common mistakes</h3><p><strong>Forcing a line</strong> — drawing a trendline that only works if you ignore obvious price action. If you're struggling to make it fit, it probably doesn't exist.</p><p><strong>Drawing too many lines</strong> — be selective. Only draw lines that are clean, well-tested, and at obvious angles.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The angle of the trendline matters. An extremely steep trendline is unsustainable and will break soon. The most reliable trendlines are at 30-45 degree angles. They represent sustainable momentum without being overextended.</p></div>`},

="5" fill="rgba(0,210,122,0.2)" stroke="#00d27a" stroke-width="1.5"/><text font-family="DM Sans,sans-serif" font-size="11" x="298" y="148" text-anchor="middle" fill="#00d27a">HL3</text><line x1="58" y1="318" x2="360" y2="82" stroke="#00d27a" stroke-width="2" stroke-dasharray="7 4" opacity="0.85"/><line x1="320" y1="106" x2="320" y2="138" stroke="#e05c5c" stroke-width="2.5" stroke-linecap="round"/><rect x="311" y="138" width="18" height="56" rx="2" fill="#e05c5c" stroke="#b84040" stroke-width="2"/><line x1="320" y1="194" x2="320" y2="210" stroke="#e05c5c" stroke-width="2.5" stroke-linecap="round"/><text font-family="DM Sans,sans-serif" font-size="11" x="430" y="162" fill="#e05c5c">Close below = break</text><line x1="331" y1="165" x2="428" y2="165" stroke="#e05c5c" stroke-width="0.5" stroke-dasharray="3 2"/><line x1="342" y1="145" x2="342" y2="170" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><rect x="334" y="128" width="16" height="17" rx="2" fill="#00d27a"/><line x1="362" y1="138" x2="362" y2="162" stroke="#e05c5c" stroke-width="1.5" stroke-linecap="round"/><rect x="354" y="122" width="16" height="16" rx="2" fill="#e05c5c"/><rect x="326" y="108" width="64" height="16" rx="4" fill="rgba(245,158,11,0.12)" stroke="rgba(245,158,11,0.4)" stroke-width="0.8"/><text font-family="DM Sans,sans-serif" font-size="11" x="358" y="120" text-anchor="middle" fill="#f59e0b">Retest = short entry</text><line x1="382" y1="150" x2="382" y2="186" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="373" y="186" width="18" height="40" rx="2" fill="#e05c5c"/><line x1="382" y1="226" x2="382" y2="242" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><line x1="404" y1="158" x2="404" y2="196" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="395" y="196" width="18" height="42" rx="2" fill="#e05c5c"/><line x1="404" y1="238" x2="404" y2="256" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><line x1="426" y1="166" x2="426" y2="206" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="417" y="206" width="18" height="44" rx="2" fill="#e05c5c"/><line x1="426" y1="250" x2="426" y2="268" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><text font-family="DM Sans,sans-serif" font-size="11" x="404" y="295" text-anchor="middle" fill="#e05c5c">New downtrend</text><text font-family="DM Sans,sans-serif" font-size="11" x="340" y="406" text-anchor="middle" fill="#6b7280">Polarity — old support becomes new resistance after the break.</text></svg></div><p>A trendline break signals that the trend may be changing or at minimum taking a significant pause.</p><h3>What constitutes a valid break</h3><p>Price must close below an uptrend trendline or above a downtrend trendline — not just briefly pierce it intraday. What matters is where price closes. A trendline break on high volume is far more significant than one on low volume.</p><h3>The retest</h3><p>After a trendline break, price will frequently retest the broken trendline from the other side — polarity in action. The old uptrend line becomes resistance. This retest is often the highest probability entry for a short position.</p><h3>False breaks</h3><p>Not every trendline break is real. Price will sometimes briefly break a trendline, find buyers quickly, and reclaim it. These false breaks are actually bullish signals — they shook out weak longs and failed to attract sellers.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The best trendline break trades are the ones you see coming. When a trendline has been tested three or four times and is getting close to a significant support or resistance level, the break is becoming more likely. The break you anticipate is always better than the break you react to.</p></div>`},
'b5-2':{title:'Channel Trading',content:`<div class="chart-box"><svg width="100%" viewBox="0 0 680 560" role="img"><title>Ascending channel</title><desc>Two parallel rising trendlines, buy circles at lower line, sell circles at upper line</desc><text font-family="DM Sans,sans-serif" font-size="11" x="270" y="36" text-anchor="middle" fill="#a855f7">Ascending channel — buy at lower, sell at upper</text><line x1="80" y1="420" x2="80" y2="455" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><rect x="72" y="432" width="16" height="22" rx="2" fill="#00d27a"/><line x1="100" y1="405" x2="100" y2="450" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><rect x="92" y="416" width="16" height="28" rx="2" fill="#00d27a"/><line x1="120" y1="350" x2="120" y2="395" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><rect x="112" y="358" width="16" height="30" rx="2" fill="#00d27a"/><circle cx="80" cy="455" r="7" fill="rgba(0,210,122,0.18)" stroke="#00d27a" stroke-width="1.8"/><text font-family="DM Sans,sans-serif" font-size="11" x="80" y="480" text-anchor="middle" fill="#00d27a">Buy</text><line x1="140" y1="290" x2="140" y2="345" stroke="#e05c5c" stroke-width="1.5" stroke-linecap="round"/><rect x="132" y="305" width="16" height="30" rx="2" fill="#e05c5c"/><line x1="160" y1="285" x2="160" y2="340" stroke="#e05c5c" stroke-width="1.5" stroke-linecap="round"/><rect x="152" y="300" width="16" height="28" rx="2" fill="#e05c5c"/><circle cx="140" cy="290" r="7" fill="rgba(224,92,92,0.18)" stroke="#e05c5c" stroke-width="1.8"/><text font-family="DM Sans,sans-serif" font-size="11" x="140" y="275" text-anchor="middle" fill="#e05c5c">Sell</text><line x1="180" y1="320" x2="180" y2="372" stroke="#e05c5c" stroke-width="1.5" stroke-linecap="round"/><rect x="172" y="332" width="16" height="28" rx="2" fill="#e05c5c"/><line x1="200" y1="330" x2="200" y2="405" stroke="#e05c5c" stroke-width="1.5" stroke-linecap="round"/><rect x="192" y="342" width="16" height="50" rx="2" fill="#e05c5c"/><line x1="220" y1="380" x2="220" y2="420" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><rect x="212" y="392" width="16" height="26" rx="2" fill="#00d27a"/><line x1="240" y1="370" x2="240" y2="415" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><rect x="232" y="380" width="16" height="28" rx="2" fill="#00d27a"/><circle cx="220" cy="420" r="7" fill="rgba(0,210,122,0.18)" stroke="#00d27a" stroke-width="1.8"/><text font-family="DM Sans,sans-serif" font-size="11" x="220" y="445" text-anchor="middle" fill="#00d27a">Buy</text><line x1="260" y1="260" x2="260" y2="315" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><rect x="252" y="272" width="16" height="30" rx="2" fill="#00d27a"/><line x1="280" y1="255" x2="280" y2="318" stroke="#e05c5c" stroke-width="1.5" stroke-linecap="round"/><rect x="272" y="270" width="16" height="30" rx="2" fill="#e05c5c"/><circle cx="280" cy="255" r="7" fill="rgba(224,92,92,0.18)" stroke="#e05c5c" stroke-width="1.8"/><text font-family="DM Sans,sans-serif" font-size="11" x="280" y="240" text-anchor="middle" fill="#e05c5c">Sell</text><line x1="300" y1="285" x2="300" y2="360" stroke="#e05c5c" stroke-width="1.5" stroke-linecap="round"/><rect x="292" y="298" width="16" height="44" rx="2" fill="#e05c5c"/><line x1="320" y1="292" x2="320" y2="378" stroke="#e05c5c" stroke-width="1.5" stroke-linecap="round"/><rect x="312" y="305" width="16" height="50" rx="2" fill="#e05c5c"/><line x1="340" y1="350" x2="340" y2="390" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><rect x="332" y="360" width="16" height="26" rx="2" fill="#00d27a"/><line x1="360" y1="338" x2="360" y2="385" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><rect x="352" y="348" width="16" height="30" rx="2" fill="#00d27a"/><circle cx="340" cy="390" r="7" fill="rgba(0,210,122,0.18)" stroke="#00d27a" stroke-width="1.8"/><text font-family="DM Sans,sans-serif" font-size="11" x="340" y="415" text-anchor="middle" fill="#00d27a">Buy</text><line x1="380" y1="248" x2="380" y2="308" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><rect x="372" y="262" width="16" height="30" rx="2" fill="#00d27a"/><line x1="400" y1="225" x2="400" y2="292" stroke="#e05c5c" stroke-width="1.5" stroke-linecap="round"/><rect x="392" y="242" width="16" height="32" rx="2" fill="#e05c5c"/><circle cx="400" cy="225" r="7" fill="rgba(224,92,92,0.18)" stroke="#e05c5c" stroke-width="1.8"/><text font-family="DM Sans,sans-serif" font-size="11" x="400" y="210" text-anchor="middle" fill="#e05c5c">Sell</text><line x1="420" y1="248" x2="420" y2="312" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><rect x="412" y="260" width="16" height="38" rx="2" fill="#00d27a"/><line x1="440" y1="322" x2="440" y2="365" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><rect x="432" y="332" width="16" height="28" rx="2" fill="#00d27a"/><circle cx="440" cy="365" r="7" fill="rgba(0,210,122,0.18)" stroke="#00d27a" stroke-width="1.8"/><text font-family="DM Sans,sans-serif" font-size="11" x="440" y="390" text-anchor="middle" fill="#00d27a">Buy</text><line x1="55" y1="461" x2="490" y2="352" stroke="#00d27a" stroke-width="2.2" stroke-dasharray="8 4" opacity="0.9"/><line x1="55" y1="311" x2="490" y2="202" stroke="#e05c5c" stroke-width="2.2" stroke-dasharray="8 4" opacity="0.9"/><polygon points="55,311 490,202 490,352 55,461" fill="rgba(107,114,128,0.04)"/><text font-family="DM Sans,sans-serif" font-size="11" x="498" y="206" fill="#e05c5c">Upper — sell zone</text><text font-family="DM Sans,sans-serif" font-size="11" x="498" y="356" fill="#00d27a">Lower — buy zone</text><text font-family="DM Sans,sans-serif" font-size="11" x="270" y="510" text-anchor="middle" fill="#6b7280">Buy at lower trendline, target is upper trendline. Take profits there — do not hold hoping for a break.</text></svg></div><p>A channel is formed when price action moves between two parallel trendlines — one connecting the highs and one connecting the lows. Channels define both your entry and your target simultaneously.</p><h3>Types of channels</h3><p><strong>Ascending channel</strong> — both trendlines slope upward. Trade the bounces off the lower trendline toward the upper trendline.</p><p><strong>Descending channel</strong> — both trendlines slope downward. Trade the rejections off the upper trendline toward the lower trendline.</p><h3>How to trade a channel</h3><p>Enter near the lower trendline in an ascending channel with a stop just below it. Target the upper trendline. When price reaches the upper trendline, take profits — don't hold hoping for a break. Respect the target.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Channels are most useful when they're clean and well-established. A channel with four or more touches on both trendlines is the gold standard. Two touches on one side and one on the other is a potential channel — not a confirmed one. Wait for confirmation before trading it.</p></div>`},

 stroke="#e05c5c" stroke-width="1.5" stroke-linecap="round"/><rect x="316" y="160" width="16" height="20" rx="2" fill="#e05c5c"/><line x1="344" y1="167" x2="344" y2="192" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><rect x="336" y="173" width="16" height="11" rx="2" fill="#00d27a"/><line x1="364" y1="182" x2="364" y2="195" stroke="#888780" stroke-width="1.5" stroke-linecap="round"/><rect x="356" y="185" width="16" height="5" rx="2" fill="#888780"/><text font-family="DM Sans,sans-serif" font-size="11" x="310" y="225" text-anchor="middle" fill="#6b7280">Pennant — candles compress toward apex as vol dries up</text><line x1="404" y1="170" x2="404" y2="202" stroke="#00d27a" stroke-width="2.5" stroke-linecap="round"/><rect x="394" y="126" width="20" height="44" rx="2" fill="#00d27a" stroke="#009955" stroke-width="2"/><line x1="404" y1="112" x2="404" y2="126" stroke="#00d27a" stroke-width="2.5" stroke-linecap="round"/><line x1="428" y1="142" x2="428" y2="175" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="419" y="100" width="18" height="42" rx="2" fill="#00d27a"/><line x1="428" y1="86" x2="428" y2="100" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><line x1="450" y1="112" x2="450" y2="148" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><rect x="441" y="68" width="18" height="44" rx="2" fill="#00d27a"/><line x1="450" y1="54" x2="450" y2="68" stroke="#00d27a" stroke-width="2" stroke-linecap="round"/><text font-family="DM Sans,sans-serif" font-size="11" x="428" y="40" text-anchor="middle" fill="#00d27a">Breakout + volume surge</text><line x1="392" y1="200" x2="564" y2="200" stroke="#6b7280" stroke-width="0.5" stroke-dasharray="3 2" opacity="0.4"/><text font-family="DM Sans,sans-serif" font-size="11" x="568" y="204" fill="#6b7280">Entry</text><line x1="392" y1="228" x2="564" y2="228" stroke="#e05c5c" stroke-width="0.5" stroke-dasharray="3 2" opacity="0.4"/><text font-family="DM Sans,sans-serif" font-size="11" x="568" y="232" fill="#e05c5c">Stop (pennant low)</text><line x1="392" y1="80" x2="564" y2="80" stroke="#00d27a" stroke-width="0.5" stroke-dasharray="3 2" opacity="0.4"/><text font-family="DM Sans,sans-serif" font-size="11" x="568" y="84" fill="#00d27a">Target</text></svg></div><p>Flags and pennants are continuation patterns — they signal a temporary pause in a strong trend before the trend resumes. They are among the most reliable and most tradeable patterns in all of technical analysis.</p><h3>The Bull Flag</h3><p>Formed after a sharp, strong move up — the pole. Price then consolidates in a tight, slightly downward channel — the flag. Volume decreases during the flag as sellers take profits but buyers absorb the selling.</p><ul><li><strong>Entry:</strong> Breakout above the upper boundary of the flag</li><li><strong>Stop:</strong> Below the low of the flag</li><li><strong>Target:</strong> The length of the pole added to the breakout point</li></ul><h3>Volume signature</h3><p>High volume on the pole. Decreasing volume during the consolidation. Expanding volume on the breakout. This volume pattern is what makes the flag a high conviction setup.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The best flags are tight and short. A flag that consolidates for 2-5 candles on the timeframe you're trading is ideal. A flag that drags on for 20 candles is losing momentum. Tight, clean, short duration. That's the flag you want.</p></div>`},
'b6-1':{title:'Triangles',content:`<p>Triangles are consolidation patterns formed by converging trendlines — price making lower highs and higher lows simultaneously, compressing into a point.</p><h3>Symmetrical Triangle</h3><p>Upper trendline slopes down, lower trendline slopes up. The pattern is neutral — it can break either direction. Wait for the break and trade in that direction. Don't predict direction.</p><h3>Ascending Triangle</h3><p>Flat upper trendline with a rising lower trendline. Bullish pattern — buyers are getting more aggressive. The flat upper resistance is under increasing pressure and will likely break to the upside.</p><h3>Descending Triangle</h3><p>Flat lower trendline with a declining upper trendline. Bearish pattern. Sellers are getting more aggressive while buyers defend a flat support level.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Ascending and descending triangles give you directional bias before the breakout — use it. An ascending triangle that's held its flat top three times with declining volume is a high probability long setup. You can enter near the lower trendline anticipating the break. Just keep your stop tight.</p></div>`},

<line x1="432" y1="235" x2="432" y2="255" stroke="#e05c5c" stroke-width="1.5" stroke-linecap="round"/><rect x="424" y="218" width="16" height="17" rx="2" fill="#e05c5c"/>

<text font-family="DM Sans,sans-serif" font-size="11" x="510" y="290" fill="#e05c5c">Break below neckline = entry</text>
</svg></div><p>The Head and Shoulders pattern signals a potential change from an uptrend to a downtrend. Most reliable when it forms after a prolonged advance.</p><h3>The anatomy</h3><ul><li>Left shoulder — a rally followed by a pullback</li><li>Head — a higher rally followed by a pullback to roughly the same level</li><li>Right shoulder — a rally that fails to reach the head, followed by a pullback</li></ul><p>The neckline connects the two pullback lows. When price breaks below the neckline, the pattern is confirmed.</p><ul><li><strong>Entry:</strong> Break below the neckline</li><li><strong>Stop:</strong> Above the right shoulder</li><li><strong>Target:</strong> The distance from the head to the neckline, projected down from the breakout point</li></ul><h3>Inverse Head & Shoulders</h3><p>The bullish reversal version — same pattern upside down. Signals a transition from downtrend to uptrend.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The right shoulder is the most important part of this pattern. A right shoulder that forms with declining volume and fails to come close to the head tells you momentum has completely shifted to the sellers. The neckline break is coming. Start watching closely and prepare your entry.</p></div>`},

<text font-family="DM Sans,sans-serif" font-size="10" x="470" y="124" fill="#f59e0b">Neckline break = entry</text>
</svg></div><p>Double tops and double bottoms form when price tests a significant level twice, fails to break through, and reverses.</p><h3>Double Top</h3><p>Price rallies to a resistance level, pulls back, rallies again to roughly the same level, and fails again — creating an M shape on the chart. The pattern is confirmed when price breaks below the pullback low between the two tops.</p><h3>Double Bottom</h3><p>Mirror image — price tests support twice, holds both times, and breaks above the pullback high between the two bottoms. The W shape. Confirmed bullish reversal.</p><h3>The nuance</h3><p>The best double tops and bottoms have the second test on lower volume than the first — it signals the move is losing conviction.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Double tops are some of the most reliable short setups you'll find. When a stock makes a new high on huge volume, pulls back, attempts the high again on lower volume, and fails — you have a clear picture. Strong rejection, declining momentum, well-defined risk above the second top.</p></div>`},
