<p><strong>Momentum and FOMO on gap ups:</strong> A stock gapping up 15% attracts attention from momentum traders and retail participants who don't want to miss what appears to be a strong move. This creates organic buying demand that sustains the momentum beyond the initial gap.</p>
<p><strong>Capitulation on gap downs:</strong> Stocks that gap down significantly often trigger panic selling from holders who couldn't exit before the gap. This capitulation selling creates a cascade where the supply from panicked sellers sustains the move lower even after the initial news impact would have exhausted itself. Gap downs on high volume that find no natural buyers create sustained downtrends.</p>

<h3>The First 30 Minute Gap Holder Rule</h3>
<p>The most important gap trading principle: the first 30 minutes after open determines whether the gap will hold or fill. A gap that holds — price stays above the opening range for gap ups, below it for gap downs — in the first 30 minutes is demonstrating that the sentiment driving the gap is sustained by real buyers (or sellers) and not just an opening imbalance that's quickly reversed.</p>
<p>The opening 30-minute range (the high and low of the first 30 minutes of trading) becomes a critical reference: a gap up stock that breaks above the 30-minute high with volume is confirming continuation. A gap up stock that loses the 30-minute low is signaling that the gap is failing — this is either a gap fill setup or an early exit signal for any gap longs held from open.</p>

<h3>Entry After Pullback — Not Immediately at Open</h3>
<p>Chasing a gap at the open is one of the most common and most costly retail trading mistakes. The opening minutes of a gapped stock are characterized by: maximum volatility, widest bid-ask spreads of the day, and erratic price action as the market discovers the true opening range. Buying the absolute open of a gap up stock means buying at maximum volatility with no defined technical level to base your entry on.</p>
<p>The correct approach: let the first 15-30 minutes establish the opening range. Then watch for either a) a breakout above the opening range high on strong volume (continuation setup) or b) a pullback to a logical support level — the pre-market high, the prior day's high, a round number, a VWAP test — that holds and begins recovering (pullback entry). Both entries give you a defined level to trade against with a clear stop.</p>

<h3>Targets for Gap Continuation Trades</h3>
<p>For gap up continuations: first target is the next significant resistance level above the gap opening — a prior weekly high, a round number, a major moving average on the daily chart. Second target for gap ups with short squeeze dynamics: the measured short squeeze target, calculated based on the float and short interest. For gap downs: next significant support, prior lows, or round numbers below the opening range.</p>

<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">The highest-quality gap continuation setups occur when the gap is accompanied by a fundamental catalyst (earnings beat, FDA approval, major contract announcement) AND the stock has significant short interest. The combination of a real fundamental reason for the move plus forced short covering creates the conditions for the most explosive sustained gap continuations. Know the short interest on any stock you're trading in a gap — it tells you how much forced buying fuel exists above the current price.</div></div>`},
'10-14':{title:'Scaling Into a Position',content:`<h3>Scaling Into Winners</h3>
<p>Most traders approach position sizing as a binary decision: you're either in or you're out, at full size or at zero. Scaling — adding to a position in stages as the trade proves itself — is a more sophisticated framework that allows you to participate in the early, higher-risk phase of a move with smaller exposure, then increase that exposure as the market validates your thesis. Done correctly, it produces significantly better risk-adjusted returns than all-in entries. Done incorrectly, it creates an oversized position built at unfavorable average prices that's vulnerable to any retracement.</p>

<h3>The Core Logic: Earn Your Size</h3>
<p>The principle behind scaling: your initial entry is always your highest-risk moment — you're entering before the market has confirmed whether you're right. As price moves in your favor and the thesis proves out, your risk is lower (you have a buffer of unrealized gains) and your conviction is higher (the market is agreeing with you). Adding size in this improved-risk environment makes mathematical sense. You're buying more when you're more right, not when you're guessing.</p>
<p>This is the opposite of averaging down — adding to losers because the price is lower. Scaling into winners is adding to a position because the price is higher and the thesis has been validated. The expected value of these two behaviors is profoundly different.</p>

<h3>The Three-Entry Scaling Method</h3>
<p>A practical scaling framework for intraday and swing trades:</p>
<p><strong>Entry 1 — Initial position (50% of intended size):</strong> Taken at the original setup entry. This is the highest-risk entry — you have the least confirmation and the most distance to your stop. Keeping it at half size limits your loss if the trade fails immediately.</p>
<p><strong>Entry 2 — First add (30% of intended size):</strong> Taken after the trade has moved meaningfully in your favor and shown its first confirmation — held the breakout on a pullback and resumed, broke a key intraday level, or simply moved through your first profit target. Your average cost is now higher than Entry 1, but you have buffer and confirmation. Move your stop to breakeven or above Entry 1 cost before adding.</p>
<p><strong>Entry 3 — Final add (20% of intended size):</strong> Taken only if the trade continues to demonstrate exceptional strength — continuation above the second confirmation point, volume expansion on further moves, or a technical structure (flag or pennant formation within the trend) that signals more upside. Smallest addition because you're now furthest from your original basis and most vulnerable to a reversal bringing the combined position back to breakeven.</p>

<h3>Managing the Combined Position Risk</h3>
<p>After each addition, recalculate the total dollar risk of your combined position. If your initial 50% position risked $200 at Entry 1, and your Entry 2 add at a higher price with a stop raised to breakeven risks an additional $150, your total risk is approximately $350. Before adding Entry 3, calculate whether the total combined risk if stopped out is within your acceptable per-trade risk limit. If the combined position has grown to a size where a full stop-out would violate your risk rules, do not add.</p>
<p>The stop management through scaling: raise your stop on the entire position after each entry add. After Entry 2, the stop should be at or above breakeven on Entry 1. After Entry 3, the stop should be at a level that protects at least your Entry 2 gains. You should never find yourself in a situation where the combined scaled position, if fully stopped out, costs you more than your original maximum risk per trade.</p>

<h3>When Not to Scale</h3>
<p>Scaling is inappropriate when: the initial trade is already at maximum size, the market is in a choppy/low-conviction environment where moves aren't following through, or the first entry hasn't yet proven itself. Do not scale into a position that hasn't moved in your favor yet. The confirmation must come before the addition.</p>

<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">Track your scaled trades separately in your journal from your single-entry trades. Calculate the average position size at exit for scaled trades versus the average exit size for single-entry trades, and compare the P&L per dollar risked. Most traders who begin scaling find that their best-performing trades — the ones that would have been their biggest winners — were precisely the trades where they had the most room to scale but didn't. The data motivates the discipline to add when the trade is working.</div></div>`},
'10-15':{title:'First Green Day Setup',content:`<p>The First Green Day is one of the most reliable momentum setups available - particularly in small and mid cap stocks. After a stock has experienced several consecutive red days of selling pressure, the first day it closes green signals a potential shift in sentiment and often the beginning of a multi-day recovery move.</p><h3>Why It Works</h3><p>After multiple red days, short sellers have accumulated positions expecting continued weakness. Trapped longs who bought earlier are in pain and have been waiting to sell into any strength. When the stock finally goes green, several things happen simultaneously: shorts begin covering to lock in profits or cut losses, trapped longs who wanted to sell breathe a sigh of relief and hold instead, and new buyers see the reversal and step in. This combination of short covering plus new buying plus reduced selling pressure creates the fuel for a significant move.</p><h3>The Setup Requirements</h3><p>Three or more consecutive red days on declining volume - the selling is exhausting itself. The first green day should open flat or slightly lower, then build momentum throughout the session. Volume should increase on the first green day compared to the recent red days - new participants are entering. The stock should have a catalyst or at minimum a clear reason why the selling was overdone. Best when the broader market is also supportive.</p><h3>Entry and Management</h3><p>Enter on a confirmed intraday breakout above the prior day high or above a key resistance level as the stock makes its first green day move. Stop below the open of the first green day or below a key intraday support level. Target the prior swing high or a measured move based on the depth of the prior selloff. Many first green days continue for 2-4 additional days as the recovery builds momentum.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The First Green Day is a setup most traders miss because they are still bearish from watching the stock go down for several days. The sentiment trap is the edge. When everyone is still negative and the stock turns green with volume, you are early on a move that will become obvious to everyone else by day two or three.</p></div>`},
'10-16':{title:'Confluence',content:`<p>Confluence is when multiple independent signals point to the same conclusion at the same time. A single signal is a reason to pay attention. Three signals pointing in the same direction is a reason to act with conviction. Confluence is the foundation of high probability trading.</p><h3>What Creates Confluence</h3><p>Any combination of independent signals that align at the same price level or at the same moment creates confluence. Examples: a stock at a prior support level that also happens to be the 50-day moving average, that also has RSI showing oversold, that also has volume drying up - that is four layers of confluence at one price. Any one of those alone is interesting. All four together is a high conviction long setup.</p><h3>Types of Confluence</h3><p><strong>Price confluence</strong> - prior support/resistance lining up with a moving average, a Fibonacci level, or a round number. When three different methods of identifying a level all point to $50.00, that is a significant level.</p><p><strong>Pattern confluence</strong> - a chart pattern forming at a key support level. A bull flag that is also sitting at the 20-day moving average on the daily chart. The pattern adds conviction to the level.</p><p><strong>Volume confluence</strong> - volume confirming the move. A breakout above resistance on 3x average volume is more powerful than the same breakout on light volume.</p><p><strong>Timeframe confluence</strong> - the same setup visible on multiple timeframes. A support level that holds on the 5-minute, the 15-minute, and the daily chart is significantly more powerful than one that only exists on one timeframe.</p><h3>How to Use Confluence</h3><p>Before entering any trade, count your confluences. One reason to enter is a setup. Two reasons is a trade. Three or more reasons is a high conviction trade worthy of larger size. Build the habit of listing your confluences before every entry. If you cannot find at least two independent signals pointing in your direction, the setup is not ready.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The highest conviction trades in your career will have so much confluence that the entry almost feels obvious. When a stock is at prior support, sitting on the 50-day moving average, volume has dried up for three days, and RSI is oversold - you should not need convincing to take that trade. Confluence removes doubt. Doubt is expensive.</p></div>`},
'11-01':{title:'What Is a Small Cap',content:`<p>A small cap stock is generally defined as a company with a market capitalization between $300 million and $2 billion. In trading terms, small cap refers to stocks with relatively few shares available for public trading and lower average daily volume than large cap names. This creates the volatility and opportunity that attract active traders - and the risk that destroys undisciplined ones.</p><h3>Market Cap vs Float</h3><p>Market cap is the total value of all shares outstanding. Float is the number of shares actually available for public trading. A company can have a market cap of $500 million but a float of only 5 million shares if insiders own the majority. Low float is what creates explosive moves. When demand hits a stock with only 2 million shares available, the price can move 50-100% in minutes because there simply are not enough shares to satisfy all the buyers.</p><h3>Why Small Caps Move Differently</h3><p>Small cap stocks do not follow the same rules as large caps. News that would cause AAPL to move 1% can cause a small cap to move 30%. A single large buyer can move the price significantly. Spreads are wider. Volume is thinner. And the risk of manipulation is higher. These characteristics create both the opportunity and the danger.</p><h3>Who Trades Small Caps</h3><p>Retail day traders dominate small cap trading. Institutional money largely avoids small caps because position sizes large enough to matter for an institution would move the stock against them when trying to enter or exit. This retail-dominated environment creates patterns that repeat consistently - patterns that a prepared trader can exploit.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Small cap trading has the highest ceiling and the lowest floor of any trading style. The gains available in a single session on a hot small cap exceed what most large cap traders make in a month. The losses available in a single session can exceed what most large cap traders lose in a year. Respect the power of this market before participating in it.</p></div>`},
'11-02':{title:'Float & Why It Matters',content:`<p>Float is the number of shares available for trading in the open market. It is one of the most important factors determining how volatile a stock will be. A stock with 500 million shares float moves slowly - it takes enormous volume to move it. A stock with 2 million shares float can move 50% on relatively small volume because there simply are not enough shares to absorb aggressive buying. Low float stocks are the playground of day traders. High float stocks are the domain of swing traders and investors. Before you trade any stock, know its float. It tells you how explosive or stable the move is likely to be.</p>`},
'11-03':{title:'Short Squeezes',content:`<p>A short squeeze occurs when a heavily shorted stock rises, forcing short sellers to buy back shares. That forced buying adds to upward momentum creating a rapid explosive move higher.</p><h3>What causes it</h3><ul><li><strong>High short interest</strong> — 20%+ of the float sold short</li><li><strong>Catalyst</strong> — positive news forces shorts to reconsider immediately</li><li><strong>Low float</strong> — fewer shares means covering has more price impact per share</li><li><strong>Rising price</strong> — as price rises losses mount forcing more covering — a feedback loop</li></ul><h3>How to trade it</h3><p>Identify high short interest stocks with a catalyst. Enter early before the squeeze is widely recognized. Stop below the catalyst level. Take profits aggressively — squeezes reverse just as fast as they start.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The most violent squeezes happen on small caps with high short interest, low float, and a genuine catalyst. When all three align, moves of 50-200% in a single session are possible. Risk is equally extreme — size accordingly.</p></div>`},
'11-04':{title:'Short Interest and Days to Cover',content:`<p>Short interest is the number of shares that have been sold short and not yet covered. It is one of the most important data points for identifying squeeze potential and understanding the risk profile of a position.</p><h3>Short Interest Percentage</h3><p>Short interest is typically expressed as a percentage of the float. A stock with 5% short interest is lightly shorted. A stock with 30% short interest is heavily shorted. A stock with 50% or more short interest is extremely heavily shorted and is a potential squeeze candidate if positive catalysts emerge.</p><h3>Days to Cover</h3><p>Days to cover, also called short ratio, tells you how many days of average trading volume it would take for all short sellers to cover their positions. A days-to-cover ratio of 10 means it would take 10 average trading days of buying for all shorts to buy back their shares. High days to cover means short sellers are trapped - they cannot exit quickly without pushing the price up against themselves.</p><h3>How to Find Short Interest Data</h3><p>Finviz.com shows short interest percentage for any stock. Webull shows it in the stock fundamentals section. Short interest data is updated twice per month, so it is slightly delayed but still highly useful as a background indicator.</p><h3>Using Short Interest in Your Trading</h3><p>High short interest alone is not a reason to buy a stock. High short interest plus a positive catalyst plus a technical breakout is a powerful combination. The short sellers become forced buyers when the stock moves against them, adding buying pressure on top of the existing demand. This is the fuel for short squeezes.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The most explosive moves in the market often happen in heavily shorted stocks. When the narrative shifts from bearish to bullish on a stock with high short interest, short sellers must cover while new buyers are simultaneously buying. Supply shrinks and demand explodes. Understanding short interest gives you an edge in identifying these situations before they happen.</p></div>`},
'11-05':{title:'Float Rotation',content:`<p>Float rotation is a concept specific to small cap trading that describes what happens when a stock's daily trading volume exceeds its total float. When more shares have traded than actually exist in the public float, it means every share has changed hands at least once that day - and some have changed hands multiple times.</p><h3>What Float Rotation Means</h3><p>A stock with a 2 million share float that has already traded 8 million shares by noon has done 4x float rotation. This is an extraordinarily active stock. The same shares are being bought and sold repeatedly by traders trying to capture intraday moves. This creates extremely volatile, fast-moving price action that can produce both massive gains and massive losses in very short time periods.</p><h3>How Float Rotation Affects Price Action</h3><p>As float rotation increases throughout the day, the stock's behavior changes. Early in the day on the first float rotation, price action is more orderly. By the third and fourth float rotation, the stock is often dominated by scalpers and momentum traders moving in and out rapidly. Support and resistance levels become less reliable. Moves become more exaggerated in both directions.</p><h3>When Float Rotation Signals a Top</h3><p>Extremely high float rotation combined with a climax volume candle that closes weak is often a sign that the move is exhausting. All the interested buyers have already bought. The float has passed through multiple sets of hands. There are no new buyers left - only holders who will sell on any strength.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Monitoring float rotation on small cap runners helps you understand where you are in the move. First float rotation often offers the best risk/reward. By the fifth or sixth float rotation, the risk of a violent reversal is extremely high and only the most experienced traders should be participating.</p></div>`},
'11-06':{title:'Halts and Circuit Breakers',content:`<p>Trading halts are temporary pauses in trading activity on a specific stock or across the entire market. They happen more frequently than most beginners realize and understanding them is essential - particularly if you trade small cap or volatile stocks.</p><h3>Individual Stock Halts</h3><p>Individual stocks can be halted for several reasons. News halts occur when a company has pending news material enough to affect the stock price - the exchange pauses trading until the news is released. Volatility halts, also called LULD (Limit Up Limit Down) halts, occur when a stock moves too far too fast in a short period. When a stock is halted, you cannot buy or sell your position until trading resumes.</p><h3>LULD Halts</h3><p>The LULD mechanism prevents stocks from moving more than a specified percentage in a five-minute window. For most stocks, if price moves 5% or more in five minutes it triggers a trading pause of five minutes. For more volatile small cap stocks, the threshold is wider. When a halt occurs, you will see your platform freeze on that stock. Orders cannot be placed or cancelled during the halt.</p><h3>Market-Wide Circuit Breakers</h3><p>If the S&P 500 falls 7% in a single day, all US markets halt for 15 minutes. A 13% decline triggers another 15-minute halt. A 20% decline closes the market for the rest of the day. These circuit breakers have only been triggered a handful of times in history but knowing they exist and what they mean is important.</p><h3>Trading Around Halts</h3><p>When a stock you own gets halted, remain calm. Halts are temporary. If it is a news halt, the stock will resume trading after the news is released - sometimes higher, sometimes lower. Do not panic about a halt. If it is a LULD halt on the upside on a small cap you own, the stock typically resumes and continues higher. If it is a halt on the downside, it often continues lower on resumption.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Small cap traders experience halts regularly. A stock that is running 50% on the day will halt multiple times as it triggers LULD thresholds. Learn to recognize halts quickly and understand they are part of the normal trading environment on volatile stocks.</p></div>`},
'11-07':{title:'Sizing for Small Caps',content:`<p>Small cap trading is where the biggest intraday moves happen - but it is also where accounts get blown up the fastest. The same position sizing rules you would use on AAPL will get you destroyed on a low float small cap moving 30% in 10 minutes. Small caps require a completely different approach to size.</p><h3>Why Small Caps Are Different</h3><p>Small caps have low float, wide spreads, and thin liquidity. A stock with 2 million shares float can move 20% on 50,000 shares of volume. The volatility that creates the opportunity is the same volatility that creates the risk.</p><h3>The Rules</h3><p>Start smaller than you think you need to. If you normally trade 500 shares of a large cap, start with 100-200 shares on a small cap until you understand how it moves. Your stop needs to be wider on a small cap because the spread alone can be 10-20 cents. Account for that when sizing - your dollar risk per trade stays the same, your share count goes down.</p><h3>Never Size Up Into a Move</h3><p>The most dangerous thing you can do on a small cap is add to a position mid-move because it is working. Small caps reverse violently and without warning. Size your full position before entry and stick to it.</p><h3>The Float Matters</h3><p>The lower the float the more explosive the move - both up and down. Under 5 million shares is considered low float. Under 1 million is extremely volatile - trade it with your smallest size.</p><div class="callout"><div class="callout-label">TST Edge</div><p>On small caps, being right about direction is only half the battle. Being wrong about size is what ends accounts. Trade small, prove you can read it, then slowly increase size as your confidence and consistency build.</p></div>`},
'11-08':{title:'News Catalysts for Small Caps',content:`<p>News is the fuel of small cap trading. Without a catalyst, a small cap stock sits dormant. With the right catalyst, it can move 50-200% in a single session. Learning to evaluate catalysts quickly and accurately is one of the most important skills in small cap trading.</p><h3>The Strongest Catalysts</h3><p><strong>FDA approvals or positive trial data</strong> - for biotech small caps, an FDA approval can be a 10x move. Even early-stage positive data can cause 100-300% moves. These are the most explosive small cap catalysts available.</p><p><strong>Earnings beats with raised guidance</strong> - a small cap that beats earnings expectations by a large margin and raises forward guidance will often gap up significantly. Unlike large caps where earnings moves are priced in, small cap earnings beats are often unexpected.</p><p><strong>Major contract wins or partnerships</strong> - a small cap announcing a contract with a Fortune 500 company or a major government contract can move significantly on the news as the market reprices the company's revenue potential.</p><p><strong>Buyout or merger announcements</strong> - acquisition offers for small caps typically come at a significant premium to the current price. These create immediate large gaps.</p><h3>Weak Catalysts to Avoid</h3><p>Not all news is equal. A small cap announcing a minor partnership, a non-binding letter of intent, or a generic press release about future plans often creates an initial spike that fades quickly. Learn to distinguish between material catalysts that change the fundamental story and marketing catalysts that are designed to generate attention without substance.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Read the actual press release before trading any small cap catalyst. Many traders react to the headline without reading the details. The details often reveal whether the catalyst is real and material or whether it is hype. The traders who read first and trade second consistently outperform those who trade the headline.</p></div>`},
'11-09':{title:'The Afternoon Fade',content:`<p>Almost every small cap stock that runs 50-100% or more in the morning will fade in the afternoon. This is not a coincidence - it is a predictable mechanical outcome of how small cap momentum trading works. Understanding the afternoon fade is as important as understanding the morning run.</p><h3>Why Small Caps Always Fade</h3><p>Morning runners attract retail momentum traders who buy at increasingly higher prices throughout the first two hours of trading. By 11:00-11:30 AM the easy money is made. The original catalyst buyers from pre-market and the open are now sitting on significant profits. They start selling into any further strength. New buyers who were watching from the sidelines are now chasing at elevated prices with all the risk and none of the reward the early buyers had. As soon as the buying slows the selling takes over and the stock begins its descent.</p><h3>Identifying the Fade Setup</h3><p>The stock has run significantly in the morning - minimum 30%, ideally 50% or more. Volume is declining on the morning run compared to the opening spike. The stock is making smaller and smaller new highs - the classic exhaustion pattern. A key level breaks to the downside after 11:00 AM - the prior support becomes resistance on any bounce. This is your short entry.</p><h3>Trading the Afternoon Fade</h3><p>Entry is on the break of a key intraday support level after the morning momentum has clearly stalled. Stop above the most recent bounce high. Target the VWAP level, the prior day close, or the opening price of the day - wherever the next major support sits below. The fade often continues for hours - this is not a scalp, it is a position that can be held through the full afternoon session.</p><h3>The Danger of Fighting the Fade</h3><p>Buying a morning runner in the afternoon hoping it has another leg up is one of the most reliable ways to lose money in small cap trading. By the afternoon the stock has already done its primary move. Every bounce is a lower high. Every dip is a lower low. Trade with the fade, not against it.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The afternoon fade short is emotionally difficult because you are shorting a stock that made an incredible move. It feels like you missed the real opportunity and are now trying to squeeze something out of the rubble. In reality the fade is often just as profitable as the morning run - it just requires patience and the willingness to be short something that was up 100% earlier in the day.</p></div>`},
'11-10':{title:'Managing Wide Spread Positions',content:`<p>Wide spreads are a defining characteristic of small cap trading and one of the most common sources of unexpected losses for new small cap traders. A spread of $0.10, $0.25, or even $1.00 between bid and ask fundamentally changes how you enter, manage, and exit positions.</p><h3>Calculating Your Real Cost</h3><p>Before entering any small cap trade, calculate the spread as a percentage of the stock price. A $0.25 spread on a $5 stock is 5% - meaning the stock needs to move 5% in your direction just for you to break even on the exit. This is not a small friction cost - it is a significant hurdle that must be factored into your target and position sizing from the start.</p><h3>Using Limit Orders Only</h3><p>On small cap stocks with wide spreads, market orders are dangerous. A market buy order fills at the ask - the worst price available. On a stock with a $0.50 spread, that is an immediate $0.50 per share disadvantage. Always use limit orders on small caps. Place your buy limit at or near the ask but never use market orders.</p><h3>Exiting With a Wide Spread</h3><p>The exit is where wide spreads hurt most. When you need to sell quickly, you must hit the bid - taking the worst available price. On a fast-moving small cap, the bid can drop significantly in seconds. If you hold a losing position on a small cap and panic sell, you may exit significantly below where the stock appears to be trading. Account for this when setting your stop loss - your actual exit may be worse than your stop price on a thin stock.</p><h3>Sizing Down for Wide Spreads</h3><p>On stocks with wide spreads, reduce your position size. The increased friction cost means your edge per trade is lower. Compensate by trading smaller and targeting larger moves. A 20% move target on a stock with a 2% spread still leaves an 18% net gain. A 5% move target on the same stock leaves only 3% net - much less margin for error.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The spread is a tax on every trade. On large caps it is negligible. On small caps it is material. Factor it in before every trade and let it influence your target selection. Only take small cap trades where the expected move is large enough to justify the spread cost and still deliver a 2:1 or better reward-to-risk ratio after accounting for the friction.</p></div>`},
'11-11':{title:'Dilution Risk',content:`<p>Dilution is the single greatest risk specific to small cap trading that does not exist in large cap trading. A stock can be making a perfect technical setup and then halt and resume down 40% because the company announced they are selling new shares. Understanding dilution and how to identify dilution risk before it destroys your position is essential for any small cap trader.</p><h3>What Dilution Is</h3><p>When a company needs to raise money they can sell new shares to investors. This is called a secondary offering or share offering. The new shares increase the total share count - diluting the ownership percentage of everyone who already owns shares. If a company has 10 million shares outstanding and sells 5 million new shares, existing shareholders now own a smaller percentage of the company and the stock typically drops significantly because the supply of shares just increased by 50%.</p><h3>Why Small Caps Are Especially Vulnerable</h3><p>Small cap companies are often running on limited cash. They need to raise money to survive and the easiest way is to sell shares. A stock that is running 50-100% on momentum is actually the perfect time for the company to sell shares - they get maximum value for the shares they issue. This is why small cap runners frequently halt and resume sharply lower even when the technical setup looked perfect.</p><h3>How to Identify Dilution Risk</h3><p>Check the company's SEC filings for shelf registrations - these are pre-approved ability to sell shares at any time. If a company has a shelf registration in place they can issue shares immediately without additional approval. Check the company's cash position - a company that is burning cash and has low cash reserves is a high dilution risk. Check the history - companies that have diluted in the past almost always dilute again.</p><h3>The At-The-Market Offering</h3><p>The most common and most feared dilution mechanism for small cap traders is the ATM offering - at-the-market. The company has a standing agreement with an investment bank to sell shares continuously into the open market at the current price. You will never see an announcement. The bank just quietly sells shares all day. When a stock cannot make new highs despite repeated attempts, an ATM offering is often the reason - there is a constant seller at every price level.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Before taking any significant small cap position, spend 2 minutes checking the company's SEC filings on sec.gov for shelf registrations and recent S-3 filings. If there is a shelf in place and the company has low cash, treat the position as higher risk and size down accordingly. The technical setup does not matter if the company decides to sell shares into your position.</p></div>`},
'12-01':{title:'What Makes IPOs Different',content:`<h3>What Makes IPOs Different</h3>
<p>Initial Public Offerings represent the first time a company's shares are available for trading on a public exchange. They are among the most volatile and most misunderstood trading events in the market. IPOs behave fundamentally differently from established stocks for reasons that go beyond simple newness — the structural mechanics of how IPOs are priced, allocated, and traded create a unique set of conditions that require a different analytical framework than standard chart-based trading.</p>

<h3>No Price History: The Fundamental Problem</h3>
<p>Every technical analysis tool — support, resistance, moving averages, prior highs and lows — depends on historical price data. An IPO has none. There is no established resistance overhead, no prior support levels to bounce from, no moving averages to act as dynamic support or resistance. The first day of trading is the first day of price discovery — the market is collectively figuring out what the company is worth in real time, and the range of opinions can be enormous.</p>
<p>This absence of price history makes standard chart analysis largely inapplicable on day one. Instead, IPO traders rely on: the reference price (set by underwriters), the opening price (determined by the opening auction), the opening range (the high and low of the first 15-30 minutes), and pre-IPO fundamental valuation relative to comparable companies.</p>

<h3>Retail Frenzy and Institutional Positioning</h3>
<p>Most high-profile IPOs generate intense retail excitement — headlines about the company's growth story, social media coverage, analysts on television discussing the offering. This retail excitement creates demand but not necessarily informed demand. Retail participants often buy IPOs based on brand recognition or excitement about the company's products without understanding the valuation at which they're buying.</p>
<p>Institutional positioning in IPOs is complex. Large institutional investors receive allocations at the IPO price through the underwriter — they are already long before the stock begins trading. Their average cost is below whatever the first-day opening price is. Whether they immediately sell their allocations into retail demand (distributing into IPO excitement) or hold for longer-term appreciation depends on their assessment of the company's value at the IPO price versus the opening price.</p>
<p>The dynamic this creates: on the first day, institutional sellers who received allocations and want to flip them are meeting retail buyers attracted by excitement. The first-day price action is fundamentally a tug of war between these two groups, with momentum traders on both sides amplifying the moves.</p>

<h3>Lockup Periods: The Hidden Time Bomb</h3>
<p>Company insiders — founders, early employees, early investors — cannot sell their shares immediately after an IPO. They are subject to a lockup period, typically 90-180 days, during which they are prohibited from selling. At lockup expiration, a massive new supply of shares potentially hits the market from people who received their equity at pre-IPO prices and are now sitting on enormous gains.</p>
<p>Lockup expirations are important calendar dates for any IPO stock you hold beyond the first day. The approach to lockup expiration — typically in the two to four weeks before the date — often creates selling pressure as the market anticipates the supply. After the lockup expires and the initial selling is absorbed, stocks sometimes recover if the business fundamentals are strong. But the lockup expiration date is a risk event that should be on your calendar for any IPO position held beyond the very short term.</p>

<h3>First-Day Volatility Expectations</h3>
<p>The first day of trading for a high-profile IPO routinely produces moves that would be extreme in any established stock — 20%, 30%, 50% swings from the opening price are not unusual. This volatility is a feature, not a bug: price discovery in a stock with no history requires a wide range of opinions to sort themselves out through actual transactions. The market's uncertainty about fair value is enormous on day one and narrows progressively as trading history accumulates.</p>
<p>This volatility cuts both ways. Stocks that open significantly above their IPO price (a "pop") have often already delivered most of their first-day return to institutional allocatees. Retail buyers who purchase in the open market after a 40% pop have paid a dramatically higher price than institutional investors and face a different risk/reward profile for any further upside.</p>

<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">Before trading any IPO, know three numbers: the reference price (what underwriters set the IPO at), the opening price (what the first trade in the open market was), and the float (how many shares are available for public trading). A stock that IPOs at $20, opens at $35, and has a small float of 10 million shares has very different dynamics than one that opens at $21 with a large float. Small float plus significant pop equals potential for dramatic moves in both directions as limited supply meets whatever demand or selling pressure develops.</div></div>`},
'12-02':{title:'IPO Opening Mechanics & Structure',content:`<h3>IPO Opening Mechanics and Structure</h3>
<p>The mechanics of how an IPO opens for trading are unlike any other market event. Understanding these mechanics — the role of the lead underwriter, the opening auction process, how the reference price differs from the opening price, and why early trading volume is unique — gives you a significant advantage over traders who simply see an IPO as a stock that starts trading on a given day.</p>

<h3>Reference Price vs Opening Price</h3>
<p>The reference price is set by the lead underwriter (the investment bank managing the IPO) typically the evening before trading begins. It's determined by a book-building process where institutional investors indicate demand at various price levels, and the underwriter sets a price that clears the offering while leaving enough demand to support early trading.</p>
<p>The reference price is the price at which institutional allocatees received their shares. It is not necessarily the price at which retail traders can first buy in the open market — that's the opening price, which is determined separately through the opening auction.</p>
<p>The opening price is discovered through a pre-market auction process. Buy and sell orders accumulate before the stock opens, and the exchange finds the price that maximizes the number of shares that can be traded. For heavily anticipated IPOs, this auction process can produce an opening price dramatically above the reference price — representing a gap up from the institutional allocation price that benefits allocatees and reflects the retail/institutional demand imbalance.</p>

<h3>The Opening Auction: First 30 Minutes</h3>
<p>The designated market maker (DMM) at the NYSE, or the opening cross algorithm at Nasdaq, manages the IPO's first trade. They can delay the opening if the order imbalance is too large — too many buyers relative to sellers — to find a fair opening price. This delay is important to understand: sometimes a stock that was supposed to open at 9:30 AM doesn't begin trading until 10:00 or 10:30 AM because the DMM is managing the imbalance. The delay itself is a signal — it means demand significantly exceeds supply at the reference price.</p>
<p>Once the stock opens, the first 30 minutes of trading are the most important of the entire IPO day. This period establishes the opening range — the initial high and low — that becomes the primary reference for the rest of the session. Traders who understand IPO mechanics watch the opening range formation carefully: is price consolidating above the opening tick (bullish), selling off immediately (bearish), or chopping in both directions (uncertain/dangerous)?</p>

<h3>Pop Dynamics: Why Some Gap Up Dramatically</h3>
<p>A "pop" — where the opening price is significantly above the reference price — occurs when demand in the opening auction far exceeds supply. Several factors create large pops:</p>
<ul>
<li><strong>Underpriced offerings:</strong> Sometimes underwriters set the reference price conservatively — either because demand was uncertain or to ensure a successful first day. When the offering is underpriced relative to institutional demand, the pop is the market correcting to fair value instantly.</li>
<li><strong>Small float:</strong> IPOs where only a small percentage of total shares are available for public trading (the float) produce larger pops because limited supply meets whatever demand exists. A 5-million share float for a company with a billion-dollar valuation has very little supply to absorb buying interest.</li>
<li><strong>Retail excitement:</strong> Consumer-facing companies — brands that retail traders know and love — generate disproportionate retail buying demand that can create pops beyond what institutional analysis would justify.</li>
</ul>

<h3>Volume and Order Flow Differences</h3>
<p>IPO first-day volume is not comparable to established stock volume. A company that will eventually trade 500,000 shares per day might trade 50 million shares on its first day as the market discovers price. This volume is driven by institutional flipping (allocatees selling their allocation into retail demand), retail buying, momentum traders piling in both directions, and algorithms exploiting the volatility.</p>
<p>The order flow on IPO day is also less informative than on established stocks. Level 2 is chaotic, tape reading is extremely difficult because the volume is so unprecedented, and the bid-ask spread is typically much wider than it will be once the stock settles into normal trading patterns over the following weeks.</p>

<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">The most useful number to watch in the IPO opening process is not the stock price — it's the ratio of buyer interest to seller interest in the opening auction. Many brokers and financial data platforms display the imbalance as the opening approaches. A massive buy imbalance means the stock will open significantly above the indicated price and pop aggressively on open. A balanced or sell-heavy imbalance means the opening will be more orderly and the first-day pop will be moderate or nonexistent.</div></div>`},
'12-03':{title:'Trading IPO First Day',content:`<h3>Trading IPO First Day</h3>
<p>Trading an IPO on its first day of public trading is genuinely different from trading any other stock. The volatility is higher, the patterns are less reliable, the order flow is noisier, and the risk of being on the wrong side of a violent reversal is significantly elevated. Most experienced traders approach IPO first-day trading with one of two strategies: highly selective participation with strict risk management, or deliberate avoidance until the stock has established several weeks of price history and a tradeable technical structure.</p>

<h3>First Hour Volatility: Highest of the Day</h3>
<p>The first 60 minutes of IPO trading produces the most extreme price swings of any period during the first trading day. This is the period when: institutional flippers are selling their allocations into retail demand, momentum traders are piling in both directions, algorithms are exploiting the wide spreads and extreme order flow, and the market is simultaneously discovering fair value while processing enormous volume. Price can move 10-15% within the first 30 minutes in either direction.</p>
<p>For most traders, the first 15-30 minutes of IPO trading should be observation only. You are watching to understand the opening range structure — where are buyers showing up, where are sellers, what does the tape tell you about who's winning? Do not enter in the first 15 minutes of a high-profile IPO. The spreads are widest, the volatility is most chaotic, and the signal-to-noise ratio is at its worst.</p>

<h3>Gap Open Strategies</h3>
<p>For IPOs that open significantly above the reference price (a large pop), there are two primary approaches:</p>
<p><strong>Fade the gap (bearish):</strong> Large first-day pops are frequently followed by significant first-day reversals as institutional sellers use the retail buying demand to exit their allocations. If a stock pops 50% on open but begins showing immediate weakness — selling into every rally, declining volume on upticks, failed attempts to hold the opening high — shorting the reversal after the opening range establishes can produce quick gains. Risk management is critical here: your stop is above the opening high, which may be significantly above your entry.</p>
<p><strong>Buy the opening range breakout:</strong> For IPOs that open moderately, establish a clear opening range in the first 30 minutes, and then break above that range with volume expansion, the breakout above the opening range high is a legitimate long setup. Your entry is on the breakout, stop is below the opening range low, and your target is measured from the range height added to the breakout point.</p>

<h3>Pullback Plays: Not Chasing the Open</h3>
<p>The cleanest IPO first-day long setups often occur not on the initial open but on the first meaningful pullback after the opening range establishes. A stock that opens, runs 20% in the first 30 minutes, then pulls back to the opening range high (now acting as support) before resuming higher is giving you a defined technical entry with clear risk. You know your stop (below the opening range high), you know your entry (the bounce at the opening range high), and you're buying with the benefit of the morning's price discovery already having occurred.</p>
<p>This pullback approach sacrifices some potential upside versus buying the open but significantly improves both the quality of the entry and the clarity of the risk/reward. Many of the best IPO first-day trades are the second-move setups, not the opening-minute chases.</p>

<h3>Exit Into Strength: Don't Hold Overnight Day One</h3>
<p>First-day IPO positions should be closed before the end of the trading session in nearly all cases. The reasons: overnight risk in an IPO is substantially higher than in established stocks (no price history, no established support levels, uncertain institutional intentions for the second day), the second day of IPO trading is often the reversal day (institutional flippers who held the first day sell into second-day retail buying), and the volatility that creates first-day opportunity also creates overnight gap risk in either direction.</p>
<p>Take your profits on first-day IPO trades before the close. If the stock continues higher on day two, three, and four — and it sometimes does — you can re-enter on the pullback with a much better technical structure than day one provides.</p>

<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">The highest-probability IPO first-day trades are those where the stock: opens moderately (10-25% above reference, not 50%+), establishes a clear opening range in the first 30 minutes, holds above VWAP throughout the morning, and breaks the opening range high with volume in the first 90 minutes. This combination — moderate pop, clear structure, VWAP support, breakout with confirmation — produces the most reliable IPO continuation setups. When the pop is 50%+ and the stock is chopping violently, step back and let the volatility settle.</div></div>`},
'12-04':{title:'Identifying IPO Opportunities',content:`<h3>Identifying IPO Opportunities</h3>
<p>Not all IPOs are worth trading. The number of companies that go public in any given year ranges from dozens to hundreds depending on market conditions, and the vast majority of them have limited trading interest, small IPO pops or drops, and thin liquidity that makes them difficult to trade profitably. Developing a screening process that identifies the high-potential IPO opportunities from the noise is the prerequisite to consistent IPO trading performance.</p>

<h3>IPO Calendars: Where to Find Upcoming Offerings</h3>
<p>Several resources publish upcoming IPO calendars with scheduled offering dates, reference price ranges, and offering details:</p>
<ul>
<li><strong>IPO Monitor (ipomonitor.com)</strong> — Comprehensive calendar with pricing details and historical performance data</li>
<li><strong>Renaissance Capital (renaissancecapital.com)</strong> — IPO research with institutional-quality analysis</li>
<li><strong>Nasdaq and NYSE websites</strong> — Official upcoming IPO listings for their respective exchanges</li>
<li><strong>Seeking Alpha IPO section</strong> — Calendar plus community analysis</li>
<li><strong>Your broker's IPO center</strong> — Most major brokers publish upcoming IPOs and allow participation in the offering at the reference price for qualified clients</li>
</ul>
<p>Check these resources weekly as part of your Sunday market reconnaissance. Knowing what IPOs are coming in the next two weeks allows you to research them in advance rather than reacting on the day of the offering.</p>

<h3>Pre-Screening for Momentum Potential</h3>
<p>The factors that predict strong first-day IPO trading:</p>
<p><strong>Market conditions:</strong> IPOs perform best in bull markets with strong risk appetite. In bear markets or periods of high uncertainty, even good IPOs often struggle. If the overall market is in a confirmed downtrend, reduce your IPO trading activity significantly — the headwind is too strong.</p>
<p><strong>Sector momentum:</strong> IPOs in sectors that are currently in favor — where investors are actively seeking exposure and valuations are expanding — pop more aggressively and trade with more momentum than IPOs in sectors that are out of favor. An AI company going public during a period of intense AI investment enthusiasm will trade differently than the same company going public during a tech selloff.</p>
<p><strong>Demand indicators:</strong> Watch for reports of the IPO being "oversubscribed" — where demand from institutional investors exceeded the number of shares available. Heavy oversubscription (10x, 20x, or more) suggests strong institutional interest that may support first-day performance. If an IPO is "struggling to find buyers" or priced below its indicated range, that's a warning sign for first-day performance.</p>
<p><strong>Consumer brand recognition:</strong> Companies with household name brands generate retail buying interest that pushes first-day performance beyond what institutional analysis alone would support. This retail demand is not necessarily rational — it's emotional — but it's real and tradeable.</p>
<p><strong>Revenue growth and profitability:</strong> High-growth companies with strong revenue expansion but pre-profitability (the "growth at all costs" model) perform very differently depending on the interest rate environment. When rates are low and risk appetite is high, these companies get bid up aggressively. When rates are high and risk appetite is low, they struggle even on IPO day.</p>

<h3>Position Sizing for IPO Trades</h3>
<p>IPO trades should be sized at 50-75% of your normal position size for equivalent setups in established stocks. The additional risks — no price history for stops, extreme first-day volatility, potential for large gaps and halts — warrant reduced exposure. Even with a clear setup and strong conviction, the unknowns inherent in first-day IPO trading justify treating it as a higher-risk category that receives less capital than your standard setups.</p>
<p>If you're new to IPO trading, start at 25% of your normal size for the first several IPO trades, regardless of how compelling the opportunity looks. Build up gradually as you develop a feel for the specific rhythms and patterns of IPO first-day trading.</p>

<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">The best IPO opportunities typically share one characteristic that's visible in the pre-market: the stock's indicated opening price keeps climbing throughout the morning before the open. A stock indicated to open at $30 at 8:00 AM that's indicated at $38 by 9:00 AM and $44 by 9:20 AM is showing you real-time demand acceleration. This escalating indication is one of the clearest pre-market signals of a strong IPO open. Stocks that open flat or drift lower in pre-market indications are signaling weaker demand and are much lower probability on the long side.</div></div>`},
'13-01':{title:'Intro to Options',content:`<p>Options are contracts that give you the right - but not the obligation - to buy or sell a stock at a specific price before a specific date. A call option gives you the right to buy. A put option gives you the right to sell. Options allow you to control 100 shares of stock for a fraction of the cost of buying the shares outright. This leverage is what makes options both powerful and dangerous. A small move in the stock can result in a 50-200% gain or loss in the option. Before trading options, you must understand that you are not buying the stock - you are buying time and the right to act within that time.</p>`},
'13-02':{title:'Dates & Expiration',content:`<p>Every option has an expiration date - the date by which you must be right or the option expires worthless. Time is your enemy when buying options. Every day that passes, theta decay eats into your option value even if the stock does not move. The closer to expiration, the faster the decay. 0DTE options - expiring the same day - are the most volatile and the fastest to decay. For beginners, buying options with at least 30-45 days to expiration gives your thesis time to play out without theta destroying your position before the move happens. Never buy options with less than two weeks to expiration unless you are very experienced and very confident in the timing.</p>`},
'13-03':{title:'Strike Prices',content:`<p>The strike price is the price at which your option gives you the right to buy or sell the underlying stock. In the money options have intrinsic value - a call with a $50 strike is in the money if the stock is at $55. At the money options have a strike closest to the current stock price. Out of the money options have no intrinsic value yet - they are pure time value and probability. In the money options cost more but move more like the stock. Out of the money options are cheaper but have a lower probability of being profitable. Beginners often buy far out of the money options because they are cheap - this is one of the fastest ways to lose money in trading.</p>`},
'13-04':{title:'Delta',content:`<p>Delta measures how much an option's price will move for every $1 move in the underlying stock. A delta of 0.50 means the option will gain or lose $0.50 for every $1 move in the stock. Delta ranges from 0 to 1 for calls and 0 to -1 for puts.</p><h3>What Delta Tells You</h3><p>An at the money option typically has a delta around 0.50. Deep in the money options have deltas approaching 1.00 - they move almost dollar for dollar with the stock. Far out of the money options have deltas near zero - they barely move even when the stock moves significantly.</p><h3>Delta as Probability</h3><p>Delta is also a rough approximation of the probability that an option will expire in the money. A 0.30 delta call has approximately a 30% chance of expiring in the money. This is useful for evaluating whether an options trade has favorable odds.</p><h3>Directional Exposure</h3><p>Delta tells you your directional exposure at any given moment. A portfolio of options with a total delta of 500 behaves like owning 500 shares of stock in terms of directional movement. Understanding your total delta exposure helps you manage risk across multiple positions.</p><div class="callout"><div class="callout-label">TST Edge</div><p>When buying options, higher delta means more stock-like behavior and higher cost. Lower delta means cheaper but lower probability of profitability. Match your delta to your conviction level - high conviction setups warrant higher delta options.</p></div>`},
'13-05':{title:'Gamma',content:`<p>Gamma measures the rate of change in delta. It tells you how much your delta will change for every $1 move in the underlying stock. Gamma is highest for at the money options and increases significantly as expiration approaches.</p><h3>Why Gamma Matters</h3><p>A high gamma option is one where your exposure changes rapidly as the stock moves. This can work powerfully in your favor on a big move - your delta increases as the stock goes your way, accelerating your gains. But it can also destroy a position quickly if the stock moves against you.</p><h3>Gamma Risk Near Expiration</h3><p>In the final days before expiration, gamma spikes dramatically for at the money options. A small move in the stock can cause massive swings in the option price. This is why 0DTE options can go from worthless to extremely valuable - or the reverse - in minutes. Gamma is the engine driving that volatility.</p><h3>Gamma Squeeze</h3><p>When a heavily shorted stock rises and market makers who sold calls are forced to buy stock to hedge their increasing delta exposure, it creates a feedback loop - the buying pushes the stock higher, increasing delta further, requiring more buying. This is a gamma squeeze and it can cause explosive moves in heavily optioned stocks.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Gamma is your friend when you are long options and the stock moves in your favor. It accelerates your gains. But gamma is your enemy when time is running out and the stock is not moving. Understand your gamma exposure before holding options into expiration week.</p></div>`},
'13-06':{title:'Theta',content:`<p>Theta measures how much an option loses in value each day due to the passage of time, all else being equal. This is called time decay. Theta is always negative for option buyers and positive for option sellers.</p><h3>The Reality of Time Decay</h3><p>Every day that passes, your option is worth a little less - even if the stock does not move at all. The closer to expiration, the faster theta erodes the option's value. An option with 30 days to expiration might lose $5 in time value per day. The same option with 5 days to expiration might lose $20 per day.</p><h3>Theta Accelerates Near Expiration</h3><p>Theta decay is not linear. It accelerates exponentially in the final two weeks before expiration. This is why buying cheap options with one week to expiration is a losing strategy for most traders - you need an immediate large move just to overcome the daily theta erosion.</p><h3>Theta for Sellers</h3><p>Option sellers collect theta. Every day that passes and the stock stays range-bound, sellers profit. This is why selling premium - covered calls, cash secured puts, credit spreads - is a common strategy for traders who want to be on the right side of time decay.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Theta is the silent killer of long options positions. You can be right about direction but wrong about timing and still lose money. Buy options with enough time for your thesis to play out. Never buy less than 30 days to expiration unless you are very confident in the timing of your move.</p></div>`},
'13-07':{title:'Vega',content:`<p>Vega measures how much an option's price will change for every 1% change in implied volatility. High vega means the option is very sensitive to changes in implied volatility. Low vega means it is less sensitive.</p><h3>Implied Volatility and Option Price</h3><p>When implied volatility rises, option prices increase - both calls and puts. When implied volatility falls, option prices decrease. This happens regardless of the direction the stock moves. You can be right about direction and still lose money if implied volatility collapses after you buy the option.</p><h3>The IV Crush</h3><p>The most common and painful example of vega in action is the post-earnings IV crush. Before earnings, implied volatility is elevated because the market is pricing in uncertainty about the outcome. After earnings are announced, the uncertainty is resolved and implied volatility collapses immediately. Even if the stock moves in your direction, the collapse in IV can wipe out your gains or turn a winning directional trade into a losing one.</p><h3>Using Vega to Your Advantage</h3><p>Buy options when implied volatility is low relative to historical volatility - you are buying cheap premium that could expand. Sell options when implied volatility is high - you are collecting expensive premium that is likely to contract. Checking IV rank before any options trade is non-negotiable.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The IV crush after earnings destroys more beginner options trades than almost anything else. If you are buying options into earnings expecting a big move, the stock needs to move significantly more than the market has priced in just to break even. Know the expected move before buying earnings options.</p></div>`},
'13-08':{title:'Volatility (IV & HV)',content:`<p>Implied Volatility is the market expectation of how much a stock will move in the future - baked into the option price. High IV means options are expensive. Low IV means options are cheap. Historical Volatility is how much the stock has actually moved in the past. When IV is significantly higher than HV - such as before earnings - options are overpriced and selling premium has an edge. When IV is low relative to HV, buying options is cheaper and the risk/reward favors buyers. Always check IV before buying options. Buying high IV options is one of the most common and costly mistakes beginners make.</p>`},
'13-09':{title:'Position Sizing for Options',content:`<p>Options position sizing is completely different from stock sizing. Because options can go to zero, you must size them as a percentage of your account - never more than 2-5% of your total account value in a single options position. The leverage that makes options attractive is the same leverage that makes oversizing catastrophic. A stock position down 10% hurts. An options position down 80% on the same move is account-ending if you were oversized. Treat each options trade as if it could go to zero - because it can. Size accordingly.</p>`},
'13-10':{title:'Covered Calls',content:`<p>A covered call is an options strategy where you own 100 shares of a stock and sell a call option against those shares. You collect the option premium immediately and in exchange you cap your upside at the strike price of the call you sold. It is one of the most commonly used strategies by stock owners to generate additional income from their existing positions.</p><h3>How It Works</h3><p>You own 100 shares of AAPL at $190. You sell one call option with a $195 strike price expiring in 30 days and collect $2.00 in premium, which is $200 total. Two outcomes are possible. If AAPL stays below $195 at expiration, the call expires worthless, you keep the $200 premium, and you still own your shares. If AAPL rises above $195, your shares are called away at $195 and you miss any gain above that level - but you still made $5 on the shares plus the $2 premium for a total of $7 per share.</p><h3>When to Use Covered Calls</h3><p>Covered calls work best on stocks you are willing to sell at the strike price and when you expect the stock to move sideways or only slightly higher in the near term. They are a way to generate income from a stagnant position rather than waiting for a large move that may not come.</p><h3>The Risk</h3><p>The risk of a covered call is not losing money on the option - that is limited to the premium you collected. The risk is that you own the stock. If the stock falls significantly, the premium you collected is small consolation for the loss on the shares themselves. Covered calls reduce your cost basis but they do not protect you from large downside moves.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Covered calls are one of the few options strategies where time decay works in your favor. Every day that passes and the stock does not rise above your strike, the call you sold loses value and your position profits. Selling covered calls consistently on a portfolio of quality stocks you want to hold long term is a legitimate income strategy.</p></div>`},
'13-11':{title:'Cash-Secured Puts',content:`<p>A cash-secured put is a strategy where you sell a put option on a stock you would be willing to own at the strike price, and you set aside the cash to buy those shares if necessary. You collect premium immediately. If the stock stays above the strike, you keep the premium. If it falls below the strike, you buy the shares at the strike price - which you already wanted to do.</p><h3>How It Works</h3><p>You want to own MSFT but you think it is slightly overvalued at $420. You sell a put option with a $400 strike price expiring in 30 days and collect $3.00 in premium, which is $300 total. You set aside $40,000 in cash to buy the shares if needed. If MSFT stays above $400, the put expires worthless and you keep the $300 - essentially getting paid to wait for a better entry. If MSFT falls below $400, you are assigned 100 shares at $400 - but your real cost basis is $397 because of the $3 premium you collected.</p><h3>When to Use Cash-Secured Puts</h3><p>Cash-secured puts work best on quality stocks you genuinely want to own at a lower price. They are a way to get paid while waiting for your entry point. If you were planning to place a limit buy order at $400 anyway, selling the put instead is almost always superior - you get paid to wait rather than just waiting.</p><h3>The Risk</h3><p>The risk is owning the stock at the strike price if it falls significantly below that level. If MSFT falls to $350, you are still obligated to buy at $400. The premium collected provides only minor cushion. Only sell puts on stocks you genuinely want to own and only at prices you are comfortable paying.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Cash-secured puts combined with covered calls form a complete wheel strategy. You sell puts to acquire stock at a discount. Once assigned, you sell covered calls to generate income and potentially exit at a higher price. Rinse and repeat. The wheel strategy is one of the most reliable income-generating options approaches for patient traders.</p></div>`},
'13-12':{title:'Vertical Spreads',content:`<p>A vertical spread is an options strategy where you simultaneously buy one option and sell another option of the same type and expiration but at a different strike price. Spreads cap both your maximum gain and your maximum loss, making them more defined-risk than buying options outright. They are often more capital-efficient than buying single options.</p><h3>Bull Call Spread</h3><p>You buy a call at a lower strike and sell a call at a higher strike. Example: buy the $50 call and sell the $55 call on the same expiration. Your maximum gain is the difference between the strikes minus what you paid for the spread. Your maximum loss is what you paid for the spread. If you paid $2 for the spread and the stock goes above $55 at expiration, you make $3 on your $2 investment. If the stock stays below $50, you lose the full $2.</p><h3>Bear Put Spread</h3><p>You buy a put at a higher strike and sell a put at a lower strike. Example: buy the $50 put and sell the $45 put. Your maximum gain is the difference between the strikes minus what you paid. Your maximum loss is what you paid. This is your directional short trade with defined risk.</p><h3>Why Use Spreads Instead of Single Options</h3><p>Spreads cost less than single options because the option you sell offsets part of the cost of the option you buy. They also reduce the impact of implied volatility changes - the IV affects both legs. For traders who want directional exposure with defined and limited risk, spreads are often more appropriate than single options, particularly around high-volatility events like earnings.</p><div class="callout"><div class="callout-label">TST Edge</div><p>When you buy a single call or put, you need to be right about direction, magnitude, and timing to be profitable. When you buy a spread, the sold option partially funds the trade and reduces your breakeven - you need a smaller move to be profitable. For most directional options trades, a spread offers better risk-adjusted returns than a single long option.</p></div>`},
'13-13':{title:'Credit Spreads',content:`<p>A credit spread is when you sell one option and buy another option of the same type at a different strike - and you collect premium rather than paying it. You are on the selling side of the trade. Time decay works in your favor. The maximum profit is the premium you collect upfront. The maximum loss is capped by the option you buy as protection.</p><h3>The Bull Put Spread</h3><p>You sell a put at a higher strike and buy a put at a lower strike. You collect the difference in premium. If the stock stays above your short put strike at expiration you keep the entire premium. This is a bullish trade - you are betting the stock does not fall below your short strike. Best used when you are moderately bullish or neutral on a stock and implied volatility is elevated making the premium you collect higher.</p><h3>The Bear Call Spread</h3><p>You sell a call at a lower strike and buy a call at a higher strike. You collect premium. If the stock stays below your short call strike at expiration you keep the entire premium. This is a bearish trade - you are betting the stock does not rise above your short strike. Best used when you are moderately bearish or neutral and IV is elevated.</p><h3>Why Credit Spreads Are Often Better Than Buying Options</h3><p>When you buy options, time decay is your enemy every single day. When you sell credit spreads, time decay is your friend - every day that passes without the stock moving against you adds to your profit. In markets where stocks are choppy or moving sideways, buyers of options consistently lose money while sellers consistently profit. Credit spreads let you capture that premium with defined and limited risk.</p><h3>The Math</h3><p>If you sell a bull put spread with a $5 wide spread and collect $1.50 in premium, your max profit is $150 per contract. Your max loss is $350 per contract. Your breakeven is your short put strike minus the premium collected. You do not need the stock to move in your direction - you just need it not to move too far against you.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Credit spreads are the professional options trader's bread and butter precisely because they do not require perfect directional calls. You can be wrong about direction by a small amount and still profit. The premium you collect provides a buffer. This is why most institutional options traders sell more premium than they buy.</p></div>`},
'13-14':{title:'Expected Move Calculation',content:`<p>Before any options trade - especially around earnings - you need to know what move the market is implying for the stock. The expected move is the market's consensus on how much a stock will move by expiration, based on the options pricing. It is one of the most useful pieces of information available before an earnings trade and almost no retail traders calculate it.</p><h3>How to Calculate the Expected Move</h3><p>Find the at-the-money straddle for the expiration you are trading - the price of the at-the-money call plus the price of the at-the-money put. This sum is approximately equal to the expected move in dollar terms. If the ATM straddle costs $5.00, the market is implying the stock will move approximately $5 in either direction by expiration.</p><h3>What the Expected Move Tells You</h3><p>If a stock is at $100 and the expected move is $8, the market is pricing in a move to either $108 or $92 by expiration. If you think the actual move will be larger than $8 you should buy options. If you think the actual move will be smaller than $8 you should sell options. The expected move is the break-even point for options buyers. If the stock moves less than the expected move, options buyers lose. If it moves more, they win.</p><h3>Expected Move Around Earnings</h3><p>Earnings events inflate the expected move dramatically because implied volatility spikes before the announcement. A stock that normally has a $2 weekly expected move might show a $10 expected move into earnings. After earnings are announced the IV crushes back to normal and the expected move collapses. This is why buying expensive options before earnings is so often unprofitable - you need a massive move to overcome the premium you paid.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Calculate the expected move before every options trade. If you are buying a call because you think the stock goes up, check whether the stock needs to move more than the expected move for your option to be profitable. If it does, the market has already priced that move in and you need to be right about direction AND magnitude - a much harder task.</p></div>`},
'13-15':{title:'Rolling Options Positions',content:`<p>Rolling an options position means closing your current contract and opening a new one at a different expiration or strike price. It is one of the most important risk management tools in options trading and one that most beginners do not know exists until they watch a position go to zero when they could have rolled and recovered.</p><h3>Why You Roll</h3><p>You bought a call with 2 weeks to expiration. The stock is moving in your direction but slower than expected. With 5 days to expiration theta is crushing your position even as the stock gradually moves higher. Instead of watching the remaining time value evaporate you roll - sell your current contract and buy the same strike or a slightly different strike with an additional 2-4 weeks of time. You reset the clock on your trade.</p><h3>Rolling a Losing Position</h3><p>If a position is going against you, rolling out in time reduces your delta exposure to the near-term move while giving the trade more time to recover. Sell your current losing contract and buy a later expiration at the same or better strike. Your cost basis increases but you have more time for the thesis to play out. This is not always the right move - sometimes cutting the loss and moving on is better. But when your fundamental thesis is intact and only the timing was wrong, rolling preserves the trade.</p><h3>The Roll-Down</h3><p>If you sold a covered call and the stock has risen above your short strike, you can roll up and out - buy back your current short call and sell a higher strike call with a later expiration. This extends your upside participation while collecting additional premium. Most covered call strategies use this technique to manage positions when the stock is called away.</p><h3>When Not to Roll</h3><p>Do not roll a position just to avoid taking a loss. Rolling a losing position only makes sense if the thesis is still valid and time was the primary problem. Rolling because you cannot accept being wrong just increases your total capital at risk and often leads to a larger ultimate loss.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Before your option expires worthless, always ask one question: is my thesis still intact? If yes and only the timing was wrong, rolling is worth considering. If the thesis has changed - the stock broke a key level, the catalyst failed to materialize, the market condition changed - take the loss. Rolling a bad trade is just a more expensive way to be wrong.</p></div>`},
