r="5" fill="rgba(0,210,122,0.2)" stroke="#00d27a" stroke-width="1.5"/><text font-family="DM Sans,sans-serif" font-size="11" x="298" y="148" text-anchor="middle" fill="#00d27a">HL3</text><line x1="58" y1="318" x2="360" y2="82" stroke="#00d27a" stroke-width="2" stroke-dasharray="7 4" opacity="0.85"/><line x1="320" y1="106" x2="320" y2="138" stroke="#e05c5c" stroke-width="2.5" stroke-linecap="round"/><rect x="311" y="138" width="18" height="56" rx="2" fill="#e05c5c" stroke="#b84040" stroke-width="2"/><line x1="320" y1="194" x2="320" y2="210" stroke="#e05c5c" stroke-width="2.5" stroke-linecap="round"/><text font-family="DM Sans,sans-serif" font-size="11" x="430" y="162" fill="#e05c5c">Close below = break</text><line x1="331" y1="165" x2="428" y2="165" stroke="#e05c5c" stroke-width="0.5" stroke-dasharray="3 2"/><line x1="342" y1="145" x2="342" y2="170" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><rect x="334" y="128" width="16" height="17" rx="2" fill="#00d27a"/><line x1="362" y1="138" x2="362" y2="162" stroke="#e05c5c" stroke-width="1.5" stroke-linecap="round"/><rect x="354" y="122" width="16" height="16" rx="2" fill="#e05c5c"/><rect x="326" y="108" width="64" height="16" rx="4" fill="rgba(245,158,11,0.12)" stroke="rgba(245,158,11,0.4)" stroke-width="0.8"/><text font-family="DM Sans,sans-serif" font-size="11" x="358" y="120" text-anchor="middle" fill="#f59e0b">Retest = short entry</text><line x1="382" y1="150" x2="382" y2="186" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="373" y="186" width="18" height="40" rx="2" fill="#e05c5c"/><line x1="382" y1="226" x2="382" y2="242" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><line x1="404" y1="158" x2="404" y2="196" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="395" y="196" width="18" height="42" rx="2" fill="#e05c5c"/><line x1="404" y1="238" x2="404" y2="256" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><line x1="426" y1="166" x2="426" y2="206" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><rect x="417" y="206" width="18" height="44" rx="2" fill="#e05c5c"/><line x1="426" y1="250" x2="426" y2="268" stroke="#e05c5c" stroke-width="2" stroke-linecap="round"/><text font-family="DM Sans,sans-serif" font-size="11" x="404" y="295" text-anchor="middle" fill="#e05c5c">New downtrend</text><text font-family="DM Sans,sans-serif" font-size="11" x="340" y="406" text-anchor="middle" fill="#6b7280">Polarity — old support becomes new resistance after the break.</text></svg></div><p>A trendline break signals that the trend may be changing or at minimum taking a significant pause.</p><h3>What constitutes a valid break</h3><p>Price must close below an uptrend trendline or above a downtrend trendline — not just briefly pierce it intraday. What matters is where price closes. A trendline break on high volume is far more significant than one on low volume.</p><h3>The retest</h3><p>After a trendline break, price will frequently retest the broken trendline from the other side — polarity in action. The old uptrend line becomes resistance. This retest is often the highest probability entry for a short position.</p><h3>False breaks</h3><p>Not every trendline break is real. Price will sometimes briefly break a trendline, find buyers quickly, and reclaim it. These false breaks are actually bullish signals — they shook out weak longs and failed to attract sellers.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The best trendline break trades are the ones you see coming. When a trendline has been tested three or four times and is getting close to a significant support or resistance level, the break is becoming more likely. The break you anticipate is always better than the break you react to.</p></div>`},

d27a">Buy</text><line x1="380" y1="248" x2="380" y2="308" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><rect x="372" y="262" width="16" height="30" rx="2" fill="#00d27a"/><line x1="400" y1="225" x2="400" y2="292" stroke="#e05c5c" stroke-width="1.5" stroke-linecap="round"/><rect x="392" y="242" width="16" height="32" rx="2" fill="#e05c5c"/><circle cx="400" cy="225" r="7" fill="rgba(224,92,92,0.18)" stroke="#e05c5c" stroke-width="1.8"/><text font-family="DM Sans,sans-serif" font-size="11" x="400" y="210" text-anchor="middle" fill="#e05c5c">Sell</text><line x1="420" y1="248" x2="420" y2="312" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><rect x="412" y="260" width="16" height="38" rx="2" fill="#00d27a"/><line x1="440" y1="322" x2="440" y2="365" stroke="#00d27a" stroke-width="1.5" stroke-linecap="round"/><rect x="432" y="332" width="16" height="28" rx="2" fill="#00d27a"/><circle cx="440" cy="365" r="7" fill="rgba(0,210,122,0.18)" stroke="#00d27a" stroke-width="1.8"/><text font-family="DM Sans,sans-serif" font-size="11" x="440" y="390" text-anchor="middle" fill="#00d27a">Buy</text><line x1="55" y1="461" x2="490" y2="352" stroke="#00d27a" stroke-width="2.2" stroke-dasharray="8 4" opacity="0.9"/><line x1="55" y1="311" x2="490" y2="202" stroke="#e05c5c" stroke-width="2.2" stroke-dasharray="8 4" opacity="0.9"/><polygon points="55,311 490,202 490,352 55,461" fill="rgba(107,114,128,0.04)"/><text font-family="DM Sans,sans-serif" font-size="11" x="498" y="206" fill="#e05c5c">Upper — sell zone</text><text font-family="DM Sans,sans-serif" font-size="11" x="498" y="356" fill="#00d27a">Lower — buy zone</text><text font-family="DM Sans,sans-serif" font-size="11" x="270" y="510" text-anchor="middle" fill="#6b7280">Buy at lower trendline, target is upper trendline. Take profits there — do not hold hoping for a break.</text></svg></div><p>A channel is formed when price action moves between two parallel trendlines — one connecting the highs and one connecting the lows. Channels define both your entry and your target simultaneously.</p><h3>Types of channels</h3><p><strong>Ascending channel</strong> — both trendlines slope upward. Trade the bounces off the lower trendline toward the upper trendline.</p><p><strong>Descending channel</strong> — both trendlines slope downward. Trade the rejections off the upper trendline toward the lower trendline.</p><h3>How to trade a channel</h3><p>Enter near the lower trendline in an ascending channel with a stop just below it. Target the upper trendline. When price reaches the upper trendline, take profits — don't hold hoping for a break. Respect the target.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Channels are most useful when they're clean and well-established. A channel with four or more touches on both trendlines is the gold standard. Two touches on one side and one on the other is a potential channel — not a confirmed one. Wait for confirmation before trading it.</p></div>`},

</svg></div><p>Market structure is how price moves over time. Understanding structure is understanding trend — the single most important skill for knowing whether to be a buyer, a seller, or flat.</p><p>An uptrend is defined by higher highs and higher lows.</p><ul><li><strong>Higher high</strong> — each swing high is above the prior swing high. Buyers are pushing price to new levels on each wave up.</li><li><strong>Higher low</strong> — each pullback finds support at a higher level than the prior pullback. Sellers are getting weaker. Buyers are stepping in earlier on each dip.</li></ul><p>When you see this pattern the market is in a healthy uptrend. Your bias should be bullish. Look for opportunities to buy pullbacks — not opportunities to short into strength.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Most beginners try to short uptrending stocks because they feel "too high." This is one of the most expensive mistakes you can make. The trend is your edge. Trading against it is swimming upstream. In an uptrend your job is to find the best place to buy — not to predict the top.</p></div>`},

</svg></div><p><p style="font-size:13px;color:var(--muted);margin-top:10px;line-height:1.7;border-left:3px solid var(--green);padding-left:12px;">Notice the final sequence on the right side of this chart. The bounce attempts get shorter and shorter, and then price finally makes a lower high that fails to reach the prior bounce. That is the moment the trend shift becomes visible. When you see lower highs getting progressively weaker, the reversal is building.</p>The mirror image of an uptrend is a downtrend — defined by lower highs and lower lows.</p><ul><li><strong>Lower low</strong> — each swing low is below the prior swing low. Sellers are pushing price to new lows on each wave down.</li><li><strong>Lower high</strong> — each bounce finds resistance at a lower level than the prior bounce. Buyers are getting weaker. Sellers are stepping in earlier on each rally.</li></ul><h3>The structure break</h3><p>The most significant event in any trend is a structure break — when price finally breaks above a lower high in a downtrend or below a higher low in an uptrend. This signals a potential trend change. The first structure break is not necessarily the end of the trend — but it is always a warning sign.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Lower highs are one of the most reliable signals in trading. When a stock that's been uptrending starts making a lower high on the bounce, sellers are stepping in at lower and lower prices. The uptrend is losing steam. Start tightening stops and reducing position size.</p></div>`},
'03-09':{title:'Bullish Candlestick Patterns',content:`<p>This lesson covers the essential concepts of <strong>Bullish Candlestick Patterns</strong>. Full content coming soon.</p>
<ul><li>Hammer and inverted hammer</li><li>Bullish engulfing</li><li>Morning star</li><li>Piercing line</li><li>How to use these in context</li></ul>
<h3>Bullish Candlestick Patterns</h3>
<p>Bullish candlestick patterns signal that buyers are gaining control — either reversing a downtrend or confirming continued upward momentum. No single candle is a buy signal on its own. Every pattern below must be read in context: where is the stock in its trend, what level is it at, and what is the volume doing?</p>
<h3>The Hammer</h3>
<p>A hammer forms when price opens, sells off aggressively to create a long lower wick, then recovers to close near the open. The body is small, the lower wick is at least twice the length of the body, and there is little or no upper wick.</p>
<p>What it means: sellers tried to push price down hard and failed. Buyers absorbed every share being sold and drove price back up by the close. The longer the lower wick relative to the body, the more aggressively buyers rejected the lower price.</p>
<p>Where it matters: hammers at key support levels — previous lows, moving averages, whole numbers — are meaningful. A hammer in the middle of a range with no obvious level beneath it is noise.</p>
<h3>The Bullish Engulfing</h3>
<p>A bullish engulfing is a two-candle pattern. The first candle is red (bearish). The second candle is green and its body fully engulfs — opens below the prior close and closes above the prior open — the entire body of the first candle.</p>
<p>What it means: after a bearish period, buyers came in with enough force to completely reverse the prior session's losses and then some. The engulfing candle shows decisive directional shift. The larger the engulfing candle relative to the prior red candle, the more significant the signal.</p>
<p>This pattern is most powerful after a multi-day selloff at a known support level, especially when accompanied by above-average volume on the engulfing candle.</p>
<h3>The Morning Star</h3>
<p>A three-candle pattern: a large red candle, followed by a small-bodied candle that gaps lower (the star), followed by a large green candle that closes well into the body of the first red candle.</p>
<p>The middle candle — the star — represents indecision. Neither buyers nor sellers controlled that session. The large green candle on day three confirms that buyers have taken over. Morning stars are most significant at the bottom of downtrends and are one of the more reliable multi-day reversal signals.</p>
<h3>The Inverted Hammer</h3>
<p>Similar to the hammer but inverted — small body at the bottom, long upper wick, little or no lower wick. Price tried to rally significantly but was pushed back down, yet the candle still closed off its lows.</p>
<p>Less immediately bullish than a hammer, but when followed by a confirming green candle the next session, it signals that buyers are beginning to test higher prices. Always wait for confirmation before acting on an inverted hammer.</p>
<h3>The Piercing Line</h3>
<p>A two-candle pattern. The first is a large red candle. The second opens below the prior close (gaps down) but then rallies to close above the midpoint of the first red candle's body. Buyers came in during the perceived weakness of the gap down and drove price back up decisively. Requires the second candle to close above the 50% mark of the first candle — if it doesn't reach halfway, the pattern is not valid.</p>
<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">A bullish candle pattern is a hypothesis, not a trade. The hypothesis is: buyers are gaining control here. Your job is to find confirming evidence — the next candle following through, volume supporting the move, the pattern forming at a meaningful level — before acting on it.</div></div>`},
'03-10':{title:'Bearish Candlestick Patterns',content:`<p>This lesson covers the essential concepts of <strong>Bearish Candlestick Patterns</strong>. Full content coming soon.</p>
<ul><li>Shooting star and hanging man</li><li>Bearish engulfing</li><li>Evening star</li><li>Dark cloud cover</li><li>Context is everything</li></ul>
<h3>Bearish Candlestick Patterns</h3>
<p>Bearish candlestick patterns signal that sellers are gaining control — either reversing an uptrend or confirming continued downward pressure. The same rules apply as with bullish patterns: context, level, and volume determine whether a pattern is meaningful or irrelevant noise.</p>
<h3>The Shooting Star</h3>
<p>The mirror image of a hammer. Price opens, rallies aggressively to create a long upper wick, then sells off to close near the open. Small body, long upper wick (at least twice the body), little or no lower wick.</p>
<p>What it means: buyers tried to push price significantly higher and failed. Sellers absorbed every share bought and drove price back down by close. This is a rejection of higher prices — particularly meaningful when it forms at a known resistance level, previous high, or after an extended run.</p>
<p>A shooting star at a level that has acted as resistance multiple times is a high-conviction signal. A shooting star in the middle of an uptrend with no obvious resistance overhead is far less significant.</p>
<h3>The Hanging Man</h3>
<p>Visually identical to a hammer — small body at the top, long lower wick — but it forms at the top of an uptrend rather than the bottom of a downtrend. The long lower wick shows that sellers made a serious attempt to push price lower during the session. While buyers recovered by the close, the fact that selling pressure appeared at all after a sustained uptrend is a warning.</p>
<p>The hanging man alone is not a sell signal. Confirmation from the next candle — a red close below the hanging man's body — is required before treating it as a reversal signal.</p>
<h3>The Bearish Engulfing</h3>
<p>The bearish counterpart to the bullish engulfing. A green candle is followed by a red candle whose body completely engulfs the prior green candle's body — opening above the prior close and closing below the prior open.</p>
<p>This is one of the strongest single two-candle reversal patterns. Sellers overwhelmed buyers so completely that they erased all of the prior session's gains and pushed further. Most powerful at the top of a rally, at resistance levels, or after an extended uptrend when accompanied by above-average volume on the red engulfing candle.</p>
<h3>The Evening Star</h3>
<p>The bearish version of the morning star. Three candles: a large green candle, a small-bodied candle that gaps higher (the star), then a large red candle that closes well into the body of the first green candle.</p>
<p>The star represents the moment when buying momentum ran out — buyers pushed price up but couldn't sustain it. The large red candle confirms that sellers have taken control. Evening stars at the top of extended uptrends, especially at known resistance, are high-quality reversal signals.</p>
<h3>The Dark Cloud Cover</h3>
<p>Two candles: first a large green candle, then a red candle that opens above the prior close but sells off to close below the midpoint of the green candle's body. Similar to a bearish engulfing but the selling doesn't fully overwhelm — it penetrates more than halfway but doesn't engulf. Still a meaningful reversal signal, just slightly less powerful than a full engulfing. Requires the second candle to close below the 50% level of the first candle to be valid.</p>
<h3>The Bearish Harami</h3>
<p>A large green candle followed by a small red candle whose entire body is contained within the prior green candle's body. The small red candle shows that after a strong bullish session, the next session's range contracted dramatically — momentum is stalling. The harami alone is a warning, not a signal. Look for confirmation in the following candles.</p>
<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">Bearish patterns at resistance mean something. Bearish patterns in the middle of a range mean very little. Always identify the nearest significant resistance level before interpreting a bearish candle pattern — if there is no obvious overhead supply, the pattern loses much of its significance.</div></div>`},
'03-11':{title:'Doji & Indecision Signals',content:`<p>This lesson covers the essential concepts of <strong>Doji & Indecision Signals</strong>. Full content coming soon.</p>
<ul><li>What a doji represents</li><li>Types of doji candles</li><li>Gravestone and dragonfly doji</li><li>Why indecision matters at key levels</li></ul>
<h3>Doji & Indecision Signals</h3>
<p>A doji is a candle where the open and close are at or near the same price, creating a very small or nonexistent body with wicks extending above and below. The defining feature is that neither buyers nor sellers won — by the close, price returned to almost exactly where it opened.</p>
<p>Doji candles represent a moment of balance between supply and demand. They are most significant not in isolation, but at turning points — at the end of a trend, at key support or resistance levels, or after a sustained run in one direction. A doji in the middle of a range on an ordinary trading day is mostly meaningless. A doji after a 10-day rally at a major resistance level is a significant warning that buying momentum is exhausting.</p>
<h3>The Standard Doji</h3>
<p>Open and close are at or near the same price, with upper and lower wicks of roughly equal length. Perfect balance between buyers and sellers. On its own, inconclusive. After a strong trend, it signals that the trend's momentum is pausing — the next candle determines whether the pause becomes a reversal.</p>
<h3>The Gravestone Doji</h3>
<p>Open, low, and close are all at or near the same price with a long upper wick and no lower wick. Price rallied significantly during the session but was rejected completely — sellers pushed price all the way back to the open by the close.</p>
<p>This is a bearish signal, particularly powerful at resistance levels or the top of a rally. The long upper wick represents buyers who tried and failed. The close at the low of the session means sellers won decisively by the end. When a gravestone doji forms at a level that has previously acted as resistance, take note — it is one of the cleaner bearish candlestick signals available.</p>
<h3>The Dragonfly Doji</h3>
<p>The mirror image of the gravestone. Open, high, and close are all at or near the same price with a long lower wick and no upper wick. Price sold off significantly during the session but buyers rejected the lower price completely — buying pressure drove price all the way back to the open by the close.</p>
<p>Bullish signal, especially at support levels or the bottom of a downtrend. The long lower wick shows sellers who failed. The recovery back to the high means buyers absorbed everything thrown at them and closed at the best price of the session. At a meaningful support level — a prior low, a moving average, a whole number — the dragonfly doji is a high-quality reversal warning.</p>
<h3>The Long-Legged Doji</h3>
<p>Open and close near the same price with long wicks on both sides. Price moved significantly in both directions before returning to the open. This represents maximum uncertainty — both buyers and sellers were active, neither gained the upper hand. Most common during periods of high volatility or during major news events. Often precedes a directional move once the uncertainty resolves.</p>
<h3>The Spinning Top</h3>
<p>Similar to a doji but with a slightly larger body — still small relative to the wicks, but not as extreme as a pure doji. The signal is the same: indecision, balance between buyers and sellers, potential turning point. Spinning tops at trend extremes or key levels carry the same warning value as doji candles.</p>
<h3>What to Do With Indecision Signals</h3>
<p>Indecision signals do not tell you which direction price will go — they tell you that the prior trend's momentum is stalling and a decision is coming. The correct response is to wait for the next candle to confirm direction before acting.</p>
<ul>
<li>Doji after an uptrend → wait for the next candle to close red before considering a short or exit</li>
<li>Doji after a downtrend → wait for the next candle to close green before considering a long</li>
<li>Doji at key resistance → heightened alert for reversal, confirmation required</li>
<li>Doji in a range → lower significance, may just be normal back-and-forth</li>
</ul>
<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">Doji candles are questions, not answers. They ask: is the trend about to change? The candle that follows answers that question. Trade the answer, not the question.</div></div>`},
'03-12':{title:'What Is Consolidation',content:`<p>Most chart patterns you'll learn — flags, pennants, triangles, cups and handles — are simply consolidation taking a recognizable form. Understanding consolidation first is what makes those patterns make sense.</p><p>Consolidation is a period of sideways price action after a directional move. The market moves in phases — impulse moves followed by consolidation, then another impulse move. Learning to identify consolidation patterns and wait for the breakout is one of the most powerful skills in trading.</p><h3>Healthy consolidation characteristics</h3><ul><li>Tight price range — price is coiling, not swinging wildly</li><li>Decreasing volume — the battle is quieting down</li><li>Clean structure — clear upper and lower boundaries that price respects</li><li>Time — consolidation takes time to build. A one or two candle pause is not consolidation.</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>Not all tight ranges are healthy consolidation. A stock consolidating after a strong move is building energy for the next leg. A stock consolidating after a failed breakout with heavy selling is distributing — smart money is selling to retail buyers who think the consolidation is a gift. Always identify the context.</p></div>`},
'03-13':{title:'Trading Inside Consolidation',content:`<p>Once you've identified a consolidation, you have two choices — trade within the range or wait for the breakout. Both are valid strategies but they have different risk profiles.</p><h3>Trading within the range</h3><p>Buy near the bottom of the consolidation with a stop just below it. Sell near the top. This requires the range to be wide enough to justify the trade — you need enough room between your entry and your target to achieve a minimum 2:1 reward to risk ratio.</p><h3>What not to do</h3><p>Don't buy in the middle of consolidation. You have no edge there — you're too far from support for a tight stop on a long, and too far from resistance for a tight stop on a short. The middle of a range is where you go to give money away.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The best consolidations to trade within are the wide, clean, well-defined ones with multiple touches on both boundaries. If you can't clearly see the top and the bottom, don't trade within it. Wait for the breakout instead.</p></div>`},
'03-14':{title:'Breakouts From Consolidation',content:`<p>The breakout from consolidation is where the real opportunity lies. After price has coiled in a tight range and volume has dried up, the eventual expansion of volume and price is one of the most reliable setups in trading.</p><h3>What a quality breakout looks like</h3><ul><li>Price approaches the upper boundary that has held multiple times</li><li>Volume begins to increase as the level is tested</li><li>Price breaks through cleanly — not just a wick poke</li><li>Volume expands significantly on the break</li><li>The candle that breaks out has a strong close — not a close back inside the range</li></ul><h3>The failed breakout</h3><p>Price breaks above resistance, attracts buyers who chase the breakout, then immediately reverses back into the range. This is a bull trap. It's why volume confirmation is non-negotiable.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The best breakouts make you feel like you're chasing. By the time the candle closes above resistance on high volume and you're convinced it's real, the stock has already moved 1-2%. That's okay. The entry that feels safe and obvious is usually the entry that's actually late.</p></div>`},

ol</text><text font-family="DM Sans,sans-serif" font-size="11" x="260" y="500" text-anchor="middle" fill="#6b7280">Low vol (flag)</text><text font-family="DM Sans,sans-serif" font-size="11" x="362" y="500" text-anchor="middle" fill="#00d27a">Vol surges on break</text></svg></div><p>Continuation patterns form when a stock pauses mid-trend before resuming in the same direction. They represent a temporary equilibrium — buyers and sellers balancing out before the dominant side takes control again.</p>
<p>The key distinction between a continuation and a reversal is context. A continuation pattern inside an uptrend is a buying opportunity. The same pattern after an extended move at resistance is a warning sign.</p>
<h3>What makes a valid continuation</h3>
<ul>
<li><strong>Prior trend</strong> — there must be a clear directional move before the pattern. No trend, no continuation.</li>
<li><strong>Tight consolidation</strong> — price should compress, not chop wildly. Tight = controlled = institutional involvement.</li>
<li><strong>Volume contraction</strong> — volume should dry up during the consolidation. Sellers are not aggressive.</li>
<li><strong>Volume expansion on breakout</strong> — the breakout candle should have significantly higher volume than the consolidation candles.</li>
</ul>
<h3>Common continuation patterns</h3>
<p>The most reliable continuation patterns are flags, pennants, and ascending triangles. Each represents the same underlying concept — a pause before continuation — with slightly different shapes. You will learn each in the following lessons.</p>
<div class="callout"><div class="callout-label">TST Edge</div><p>The best continuation trades come from tight, low-volume consolidations after strong moves. When a stock that ran 20% consolidates in a 3% range for several days on declining volume, that is accumulation — not distribution. That is your setup.</p></div>
<h3 style="margin-top:32px;margin-bottom:8px;">Reversals</h3>
<p style="margin-bottom:12px;">Reversal patterns signal that the current trend is ending and price is likely to move in the opposite direction. The two most reliable reversal patterns are the <strong>Head &amp; Shoulders</strong> (bearish) and the <strong>Double Bottom</strong> (bullish).</p><div class="chart-box" style="margin-top:20px"><svg width="100%" viewBox="0 0 680 540" role="img"><title>Reversal Patterns</title><desc>Head and Shoulders top reversal and Double Bottom reversal shown with candlesticks</desc>

'03-16':{title:'Flags & Pennants',content:`<p>Flags and pennants are continuation patterns — they signal a temporary pause in a strong trend before the trend resumes. They are among the most reliable and most tradeable patterns in all of technical analysis.</p><h3>The Bull Flag</h3><p>Formed after a sharp, strong move up — the pole. Price then consolidates in a tight, slightly downward channel — the flag. Volume decreases during the flag as sellers take profits but buyers absorb the selling.</p><h3>The Bear Flag</h3><p>The mirror image of the bull flag. After a sharp drop the pole, price consolidates in a tight, slightly upward drift on low volume. This is not a recovery. It is a pause before the next leg down. When price breaks below the lower boundary of the flag with volume, the next selloff begins.</p><h3>The Pennant</h3><p>A pennant forms the same way as a flag, strong pole followed by a consolidation, but instead of a channel drifting in one direction, the consolidation forms a small symmetrical triangle. Price compresses into a tighter and tighter range as buyers and sellers battle it out. Volume dries up as the triangle narrows. The breakout from a pennant is often more explosive than a flag because the compression builds more energy before the release.</p><h3>Volume Signature</h3><p>High volume on the pole. Decreasing volume during the consolidation. Expanding volume on the breakout. This volume pattern is what makes both flags and pennants high conviction setups.</p><h3>What Is Happening Behind the Scenes</h3><p><strong>Flag</strong> - controlled profit-taking after a strong move. The trend is still intact. Buyers are resting, not retreating. Sellers are absorbing supply but cannot push price significantly lower. When the selling dries up and buyers step back in, the breakout follows. This is a healthier, more predictable trend continuation.</p><p><strong>Pennant</strong> - more indecision than a flag. Both buyers and sellers are uncertain. Price compresses as the two sides balance out. Volume disappears. When one side finally wins, the breakout tends to be sharper and more explosive because all that coiled energy releases at once. Fakeouts are more common with pennants so volume confirmation on the breakout is non-negotiable.</p><h3>Trading Difference</h3><p><strong>Flag</strong> - easier to read, smoother entries, more predictable movement. The channel gives you clear boundaries and a clear entry trigger. Lower risk of a fakeout if volume is declining properly.</p><p><strong>Pennant</strong> - trickier to trade. The converging trendlines can produce false breakouts on either side. Wait for a full candle close outside the triangle with above average volume before entering. When a real pennant breaks, it breaks hard.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The best flags and pennants are tight and short. A consolidation that lasts 2-5 candles on your trading timeframe is ideal. The longer it drags on, the more momentum the stock loses. Tight, clean, short duration - that is the setup you want.</p></div>`},
'03-17':{title:'Triangles',content:`<p>Triangles are consolidation patterns formed by converging trendlines — price making lower highs and higher lows simultaneously, compressing into a point.</p><h3>Symmetrical Triangle</h3><p>Upper trendline slopes down, lower trendline slopes up. The pattern is neutral — it can break either direction. Wait for the break and trade in that direction. Don't predict direction.</p><h3>Ascending Triangle</h3><p>Flat upper trendline with a rising lower trendline. Bullish pattern — buyers are getting more aggressive. The flat upper resistance is under increasing pressure and will likely break to the upside.</p><h3>Descending Triangle</h3><p>Flat lower trendline with a declining upper trendline. Bearish pattern. Sellers are getting more aggressive while buyers defend a flat support level.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Ascending and descending triangles give you directional bias before the breakout — use it. An ascending triangle that's held its flat top three times with declining volume is a high probability long setup. You can enter near the lower trendline anticipating the break. Just keep your stop tight.</p></div>
<h3>Triangle Formations</h3>
<p>Triangles are one of the most common and reliable chart patterns in technical analysis — but they work differently than most other patterns, and understanding why makes you a significantly better trader.</p>
<p>Most chart patterns — flags, head and shoulders, double tops — form as a result of a specific supply/demand dynamic at a specific moment. Triangles are different. They form as a result of <strong>converging supply and demand</strong> over time — a process of compression where the range of price movement narrows progressively until the pressure builds to the point where a breakout becomes inevitable.</p>
<h3>Why Triangles Are Fundamentally Different</h3>
<p>A bull flag forms in minutes or hours. A triangle can take days, weeks, or months to form. The longer a triangle takes to form, the more significant the eventual breakout tends to be — because more participants have been accumulating positions inside the range, more stops have been placed just outside the boundaries, and the pressure release when price finally breaks is proportionally larger.</p>
<p>Triangles also have a measurable price target: the height of the triangle at its widest point, projected from the breakout level. This gives you a quantifiable expectation for the move — something few other patterns provide as cleanly.</p>
<h3>The Ascending Triangle</h3>
<p>An ascending triangle has a flat resistance line at the top and a rising support line at the bottom. Price makes higher lows each time it pulls back but keeps running into the same ceiling. This pattern shows buyers getting more aggressive — willing to buy at progressively higher prices — while sellers remain fixed at the same resistance level.</p>
<p>The psychology: every time price pulls back and buyers step in at a higher low, sellers at the top become more isolated. Eventually the buying pressure overwhelms the fixed supply at resistance and the stock breaks above. Ascending triangles are <strong>bullish bias patterns</strong> — statistically they break upward more often than downward, though downward breaks do occur and should be respected if they happen.</p>
<p>Trade: wait for a confirmed close above the flat resistance line on above-average volume. Entry on the breakout candle or on a retest of the breakout level as support.</p>
<h3>The Descending Triangle</h3>
<p>The mirror image of the ascending triangle. Flat support at the bottom, descending resistance line at the top. Price makes lower highs each time it rallies but keeps finding support at the same floor level. Sellers are getting more aggressive, buyers are defending a fixed level.</p>
<p>Eventually the selling pressure overwhelms the fixed demand at support. Descending triangles have a <strong>bearish bias</strong> — they break downward more often than upward. The breakdown tends to be swift and decisive because all the stops placed just below the support line get triggered simultaneously, accelerating the move.</p>
<p>Trade: wait for a confirmed close below the flat support line. Short entry on the breakdown candle or on a retest of the broken support as resistance.</p>
<h3>The Symmetrical Triangle</h3>
<p>Both the support line and the resistance line are converging — lower highs and higher lows simultaneously. Neither buyers nor sellers have an obvious advantage. The pattern represents pure compression with no directional bias.</p>
<p>Symmetrical triangles typically break in the direction of the prior trend — if price was trending up before forming the triangle, expect an upward breakout. But because there is no inherent directional bias, you must wait for the breakout before committing to a direction. Trading the breakout rather than anticipating it is essential with symmetrical triangles.</p>
<h3>Volume Behavior Inside a Triangle</h3>
<p>During the formation of any triangle, volume should generally decline as the pattern develops. Fewer participants are trading as the range compresses and the market reaches equilibrium. When the breakout occurs, volume should expand sharply — this confirms that the breakout is real and has broad participation. A breakout on low volume is suspect and has a much higher probability of being a false break.</p>
<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">Trading triangles too early — entering before the breakout occurs because the pattern "looks ready." Triangles can compress further than expected and the breakout timing is genuinely unpredictable. Wait for the candle to close outside the boundary on above-average volume before entering. Patience is the edge with triangle patterns.</div></div>`},
'03-18':{title:'Reversals',content:`<p>Reversal patterns signal that the current trend is ending and price is likely to move in the opposite direction. Unlike continuation patterns, reversals require confirmation — do not trade them until the pattern is complete.</p>
<h3>What makes a reversal valid</h3>
<ul>
<li><strong>Prior trend</strong> — a reversal can only exist if there was a trend first. No trend, no reversal.</li>
<li><strong>Pattern completion</strong> — the pattern must fully form. A head and shoulders that hasn't broken the neckline is not a signal yet.</li>
<li><strong>Volume confirmation</strong> — volume should expand on the breakdown/breakout that completes the pattern.</li>
<li><strong>Failed retests</strong> — after a neckline break, if price retests and fails, that is high-conviction confirmation.</li>
</ul>
<h3>The most important reversal concept</h3>
<p>Most traders lose money trying to pick tops and bottoms. The edge in reversal trading comes from waiting for the structure to break — not anticipating it. Let the pattern complete, let the neckline break, and enter on confirmation. The first sign of a reversal is a warning. The confirmed break is the signal.</p>
<div class="callout"><div class="callout-label">TST Edge</div><p>Reversal patterns at key levels on high timeframes are the most powerful setups in trading. A head and shoulders at all-time highs with volume divergence on the right shoulder is one of the highest-conviction shorts you will ever see. But patience is required — wait for the neckline break.</p></div>`},

</svg></div><p>The Head and Shoulders pattern signals a potential change from an uptrend to a downtrend. Most reliable when it forms after a prolonged advance.</p><h3>The anatomy</h3><ul><li>Left shoulder — a rally followed by a pullback</li><li>Head — a higher rally followed by a pullback to roughly the same level</li><li>Right shoulder — a rally that fails to reach the head, followed by a pullback</li></ul><p>The neckline connects the two pullback lows. When price breaks below the neckline, the pattern is confirmed.</p><h3>Inverse Head & Shoulders</h3><p>The bullish reversal version — same pattern upside down. Signals a transition from downtrend to uptrend.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The right shoulder is the most important part of this pattern. A right shoulder that forms with declining volume and fails to come close to the head tells you momentum has completely shifted to the sellers. The neckline break is coming. Start watching closely and prepare your entry.</p></div>`},

</svg></div><p>Double tops and double bottoms form when price tests a significant level twice, fails to break through, and reverses.</p><h3>Double Top</h3><p>Price rallies to a resistance level, pulls back, rallies again to roughly the same level, and fails again — creating an M shape on the chart. The pattern is confirmed when price breaks below the pullback low between the two tops.</p><h3>Double Bottom</h3><p>Mirror image — price tests support twice, holds both times, and breaks above the pullback high between the two bottoms. The W shape. Confirmed bullish reversal.</p><h3>The nuance</h3><p>The best double tops and bottoms have the second test on lower volume than the first — it signals the move is losing conviction.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Double tops are some of the most reliable short setups you'll find. When a stock makes a new high on huge volume, pulls back, attempts the high again on lower volume, and fails — you have a clear picture. Strong rejection, declining momentum, well-defined risk above the second top.</p></div>`},

</svg></div><p>The Cup and Handle is a bullish continuation pattern made famous by William O'Neil. It forms over a longer time period — typically weeks to months — and signals a stock consolidating before a major breakout.</p><h3>The Cup</h3><p>A rounded, U-shaped consolidation. Price declines gradually, rounds out at the bottom without sharp moves, and gradually rises back to near the prior high. The key word is rounded — not a V-shape. The gradual rounding indicates orderly accumulation.</p><h3>The Handle</h3><p>After the cup forms, a small consolidation forms — typically a slight downward drift on low volume. The handle shakes out the last remaining weak holders before the breakout.</p><ul><li><strong>Entry:</strong> When price breaks above the handle's upper trendline with strong volume</li><li><strong>Stop:</strong> Below the handle's low</li><li><strong>Target:</strong> The depth of the cup added to the breakout point</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>The cup and handle is a longer term pattern — most effective on daily and weekly charts. The pattern derives its strength from the extended accumulation period. The longer the base, the bigger the potential move.</p></div>`},
'03-22':{title:'Fakeouts & False Breaks',content:`<p>A fakeout is when price appears to break through a key level — support, resistance, a pattern boundary — but immediately reverses back. Fakeouts are not random. They are engineered moves that trigger retail stops and orders before reversing.</p>
<h3>Why fakeouts happen</h3>
<p>Retail traders cluster their stops and entries at obvious levels — just above resistance, just below support. Institutions and algorithms know this. A push through a level to trigger those orders, absorb the liquidity, and then reverse is a repeatable pattern. The fakeout is the trap.</p>
<h3>How to identify a fakeout</h3>
<ul>
<li><strong>Wick through the level</strong> — price closes back on the other side of the level in the same session. The wick is the tell.</li>
<li><strong>Volume spike then dry up</strong> — high volume on the break, immediate contraction. The breakout had no follow-through.</li>
<li><strong>Immediate reversal candle</strong> — a strong opposing candle within 1-3 bars of the break is a fakeout signal.</li>
<li><strong>No retest holds</strong> — a real breakout retests the broken level and holds. A fakeout never comes back.</li>
</ul>
<h3>Trading fakeouts</h3>
<p>The best fakeout trades are faded — you trade against the fake move. If a stock breaks above resistance on low volume and immediately puts in a bearish engulfing candle, that is a short setup. Your stop is above the fakeout high. Your target is the other side of the range.</p>
<div class="callout"><div class="callout-label">TST Edge</div><p>Stop loss hunts are the most common fakeout in small caps. The stock dips just below obvious support, triggers every stop, then rips higher. If you see a wick below key support followed by an immediate strong recovery candle on volume, that is a washout long setup — not a breakdown.</p></div>`},
'04-01':{title:'Why Volume Matters',content:`<p>Volume is the number of shares traded during a specific time period. It is the single most important confirming indicator in all of technical analysis. Price tells you where the market went. Volume tells you how much conviction was behind the move.</p><p>Think of it this way — if a stock moves up 10% on 100,000 shares traded, that's a very different signal than moving up 10% on 1,000,000 shares traded. The first move has weak conviction. The second has institutional participation. The chart pattern looks the same but the story is completely different.</p><ul><li><strong>High volume on a move up</strong> — buyers are aggressive. Institutional money is participating.</li><li><strong>Low volume on a move up</strong> — retail participation, weak hands, easily reversed.</li><li><strong>High volume on a move down</strong> — sellers are aggressive. Distribution is occurring.</li><li><strong>Low volume on a move down</strong> — sellers aren't committed. Could be temporary profit taking.</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>Price without volume is just a suggestion. Volume gives you conviction. Always check what volume is doing before entering a position. If a stock breaks out of a pattern on low volume, wait. The breakout hasn't been confirmed yet.</p></div>
<h3>Why Volume Is the Most Important Confirmation Tool in Trading</h3>
<p>Price tells you what happened. Volume tells you whether to believe it.</p>
<p>This is the fundamental reason volume matters — not because high volume is inherently good or low volume is inherently bad, but because volume reveals the <em>conviction</em> behind any price move. A stock that rises 5% on 10 million shares is telling you a completely different story than a stock that rises 5% on 500,000 shares, even though the price change looks identical on a chart without volume data.</p>
<h3>Volume as Participation</h3>
<p>Every share traded requires a buyer and a seller. High volume means many buyers and sellers agreed to transact at the current price level — the move has broad participation. Low volume means very few participants were involved — the move may be driven by one or two large orders and is more vulnerable to reversal when those participants step back.</p>
<p>Think of it this way: a stock that gaps up 8% on 50x its average volume has the entire market's attention. Institutions are buying, retail traders are piling in, short sellers are covering. That kind of participation creates self-reinforcing momentum. A stock that drifts up 8% over three days on below-average volume has no such momentum — it's floating, not flying, and it can reverse just as quietly as it rose.</p>
<h3>The Core Principle: Volume Confirms Price</h3>
<p>For any price move to be trustworthy — to be worth trading, to be likely to continue — volume should support it. The rules are simple:</p>
<ul>
<li><strong>Strong moves on high volume = confirmation</strong> — the move has real backing and is more likely to continue</li>
<li><strong>Strong moves on low volume = suspicion</strong> — the move lacks conviction and is more likely to reverse</li>
<li><strong>Pullbacks on low volume = healthy</strong> — the trend is pausing but participation in the pullback is weak, suggesting the original move will resume</li>
<li><strong>Pullbacks on high volume = warning</strong> — sellers are becoming aggressive; the trend may be reversing</li>
</ul>
<h3>Volume at Key Levels</h3>
<p>Volume becomes especially meaningful when price interacts with significant levels — previous highs, previous lows, moving averages, consolidation zones, round numbers. When price approaches a key level:</p>
<p><strong>Breakout through resistance on high volume</strong> — buyers overwhelmed sellers at that level. The break is likely real and may lead to a sustained move. The high volume shows that the resistance level has been genuinely cleared, not just temporarily breached.</p>
<p><strong>Breakout through resistance on low volume</strong> — few sellers were actually overcome. The price may have pushed through temporarily, but there wasn't enough buying pressure to sustain it. These moves frequently reverse and are called false breakouts or fakeouts. They are one of the most common traps for retail traders.</p>
<p><strong>Bounce off support on high volume</strong> — buyers showed up in force at that level. The support is strong and the bounce is likely to have follow-through.</p>
<p><strong>Bounce off support on low volume</strong> — weak buying at support. The support may not hold on the next test.</p>
<h3>Volume and Trend Health</h3>
<p>In a healthy uptrend, up days should have higher volume than down days. This shows that buyers are more aggressive than sellers — more participants are interested in owning the stock than selling it. When this relationship flips — when you start seeing heavy volume on down days and light volume on up days within an uptrend — the trend is losing health. Sellers are becoming more active than buyers, and a reversal or correction is increasingly likely.</p>
<p>In a healthy downtrend, the opposite applies: down days should show higher volume than up days. When rallies within a downtrend start appearing on higher volume than the down moves, the selling pressure is weakening and a reversal may be forming.</p>
<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">Before acting on any price move — breakout, breakdown, bounce — look at the volume bar below it. Ask: is this volume above average, below average, or average? If it's below average, reduce your conviction in the move by half. If it's significantly above average, increase your conviction. Make this automatic. It will save you from more bad trades than almost any other habit.</div></div>`},
'04-02':{title:'Volume Signals',content:`<p>Beyond simply high or low volume, there are specific volume signals that appear repeatedly and carry significant meaning.</p><h3>Volume Spike</h3><p>A sudden dramatic increase in volume — often 3x to 10x the average. Usually signals a major event — earnings, news, institutional accumulation or distribution. A volume spike with no news is often more significant than one with an obvious catalyst.</p><h3>Climax Volume</h3><p>Extremely high volume after an extended move in one direction — often signaling exhaustion. When a stock that's been running for days suddenly prints the highest volume day of the move with little price progress, that's climax volume. The move may be ending.</p><h3>Volume Dry Up</h3><p>Volume that progressively decreases over several candles while price consolidates in a tight range. This is actually a positive signal — it means sellers have been absorbed and the stock is resting before the next move.</p><h3>Below Average Volume</h3><p>Any move on below average volume should be treated with skepticism. It means the move lacks institutional participation and is more likely to reverse.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Volume dry up during a consolidation is one of the most reliable signals that a stock is about to make a significant move. Stocks don't move in straight lines — they move, they rest on low volume, and then they move again. The low volume rest period is where you want to be positioning.</p></div>
<h3>Volume Signals Across Different Contexts</h3>
<p>Volume doesn't have one meaning — it has different meanings depending on where price is, what the trend is, and what the overall market is doing. Learning to read volume in context is what separates traders who understand charts from those who just see price patterns.</p>
<h3>Signal 1: Volume Climax (Climactic Volume)</h3>
<p>A volume climax occurs when volume spikes dramatically — often 5x to 10x the average daily volume — accompanied by a sharp, extended price move. This signal appears at the extremes of trends and represents the final exhaustion of the dominant side.</p>
<p><strong>Example:</strong> A stock has been in a downtrend for three weeks. On a Tuesday it gaps down and falls another 15% on 8 million shares — compared to its 200,000 share daily average. This is a selling climax. Every seller who wanted out has now sold. The volume spike represents the final flush of weak holders. The stock often stabilizes or reverses sharply after this kind of event because there are simply no more sellers left at those prices.</p>
<p>Similarly, a buying climax happens at the top of a rally — enormous volume, big move up, then price stalls. All the buyers who wanted in have now bought. Demand has been exhausted.</p>
<h3>Signal 2: Volume Dry-Up (No-Demand / No-Supply)</h3>
<p>A volume dry-up occurs when price moves in one direction on exceptionally low volume — often less than 50% of average. This is one of the most overlooked but important signals in trading.</p>
<p><strong>Example in a downtrend:</strong> A stock has been falling. After several red days on high volume, you see a day or two where price drifts slightly lower on very thin volume — barely any sellers, barely any buyers. This is "no supply" behavior — sellers have exhausted themselves, and the lack of follow-through selling despite the downtrend means the move may be running out of energy. Often precedes a reversal.</p>
<p><strong>Example in an uptrend:</strong> A stock pulls back slightly over two days on very low volume. No one is aggressively selling — the pullback is just a lack of buyers rather than active selling. This is healthy consolidation within an uptrend. The next push higher on increasing volume confirms the trend is intact.</p>
<h3>Signal 3: Volume Divergence</h3>
<p>Volume divergence occurs when price and volume are moving in opposite directions to what you'd expect given the trend.</p>
<p><strong>Example:</strong> A stock is making new highs day after day, but each successive high comes on lower and lower volume. Price looks strong — the chart shows an uptrend. But volume is declining as new highs are made. This divergence signals that fewer and fewer participants are supporting the rally. The buyers who remain are less committed. The uptrend is thinning out and is increasingly vulnerable to a reversal on the first sign of selling pressure.</p>
<p>Volume divergence doesn't give you a precise reversal date — but it tells you to reduce position size, tighten stops, and not add aggressively to longs at these levels.</p>
<h3>Signal 4: Accumulation Volume</h3>
<p>Accumulation is the process of institutional buyers building large positions over time without moving the price dramatically — they buy in size but absorb shares patiently to avoid driving up their own cost basis.</p>
<p><strong>Example:</strong> A stock trades in a range between $45 and $50 for six weeks. On most days volume is average. But on specific days — particularly days when the stock is near the low of its range — volume spikes to 3x or 4x average even though price barely moves. This is accumulation: a large buyer is absorbing every share offered near $45 and not letting price go below that level. The range-bound price with periodic high-volume support days is a classic accumulation signature.</p>
<h3>Signal 5: Distribution Volume</h3>
<p>The opposite of accumulation. Institutional sellers quietly liquidating large positions over time.</p>
<p><strong>Example:</strong> A stock is near its all-time high after a long uptrend. It's been trading in a range between $95 and $105 for several weeks. On up days, volume is average. But on down days or days when the stock fails to hold near the top of its range, volume spikes to 3x or 4x average. A large seller is absorbing every buyer who tries to push price higher and using those buyers as liquidity to exit their own large position. When the seller finishes distributing, the support disappears and the stock drops sharply.</p>
<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">Volume signals compound. A volume climax followed by a volume dry-up followed by a surge in the opposite direction is one of the highest-conviction reversal sequences in trading. Each signal alone is a data point. Multiple signals in sequence are a story — and that story is usually worth following.</div></div>`},
'04-03':{title:'Volume & Price Action',content:`<p>The relationship between volume and price is the foundation of institutional analysis.</p><ul><li><strong>Price up, volume up</strong> — healthy bullish trend.</li><li><strong>Price up, volume down</strong> — weakening trend. Distribution may be occurring.</li><li><strong>Price down, volume up</strong> — aggressive selling. Real distribution.</li><li><strong>Price down, volume down</strong> — weak selling pressure. Could be a natural pullback.</li></ul><h3>The Breakout Volume Rule</h3><p>Any breakout from a pattern must be accompanied by above average volume to be considered valid. A breakout on below average volume is a false breakout candidate. Wait for volume confirmation before entering.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The most dangerous trade in markets is buying a breakout on low volume. It looks exactly like a real breakout — but without volume behind it, you're often the last buyer before a reversal. Volume confirms. Always.</p></div>
<h3>Integrating Volume With Price Action</h3>
<p>Price action and volume are most powerful when used together — not as separate indicators but as a single integrated picture of what the market is doing. Traders who look at price and volume separately are reading two halves of one message. This lesson teaches you to read the whole message at once.</p>
<h3>The Four Price-Volume Combinations</h3>
<p>Every price-volume interaction falls into one of four combinations, each with a clear interpretation:</p>
<p><strong>1. Price Up + Volume Up = Bullish Confirmation</strong><br>
The classic healthy rally signature. Price rising on expanding volume means buyers are becoming more aggressive and more numerous. The move has broad participation and is likely to continue. This is what you want to see on breakouts, on the first day of a new uptrend, and on gap-up days you're considering buying.</p>
<p><strong>2. Price Up + Volume Down = Bullish Warning</strong><br>
Price rising but on declining volume. The rally is happening with decreasing participation. Fewer buyers are coming in at each successive higher price. This is how uptrends end — not always with a dramatic crash, but with a slow thinning of buyers until there are no more left to push price higher. Do not chase price action that shows this combination. Look for a volume expansion to confirm before adding to longs.</p>
<p><strong>3. Price Down + Volume Up = Bearish Confirmation</strong><br>
Declining price on expanding volume means sellers are becoming more aggressive and more numerous. The move down has real conviction. This is what distribution looks like in its active phase — institutions and informed money are selling aggressively. Respect this signal. Do not try to buy falling stocks that are declining on high volume.</p>
<p><strong>4. Price Down + Volume Down = Bearish Warning (Healthy Pullback)</strong><br>
Price declining but on low volume. Sellers are not aggressive — the pullback is happening through a lack of buyers rather than active selling pressure. This is the signature of a healthy pullback within an uptrend. When you see a stock pulling back for 2-3 days on declining volume after an uptrend, it's often setting up the next buying opportunity. The low volume says: no one important is selling here.</p>
<h3>Applying This at Specific Pattern Points</h3>
<p>The four combinations become especially powerful at specific technical points:</p>
<p><strong>At a breakout:</strong> You want to see Price Up + Volume Up. A breakout on low volume (combination 2) is one of the most reliable fakeout signals in trading. The stock pushes above resistance, triggers stops of short sellers, but doesn't attract new buying. Price quickly reverses back below the breakout level. Wait for volume confirmation before trusting a breakout.</p>
<p><strong>At a pullback within an uptrend:</strong> You want to see combination 4 — price pulling back on low volume. This tells you the sellers aren't serious. The buyers who drove the initial rally haven't exited. When volume expands again on the next upward move, the trend is resuming. If the pullback shows combination 3 — price falling on high volume — the trend may be breaking down, not just resting.</p>
<p><strong>At a potential reversal:</strong> Look for the combination to shift. An uptrend that has been showing combinations 1 and 4 alternating (up on high volume, pullbacks on low volume) begins showing combination 2 (up moves on declining volume). That shift in the volume pattern is often the first warning that the trend is deteriorating — before price itself shows any obvious sign of trouble.</p>
<h3>Volume Moving Averages</h3>
<p>Most charting platforms allow you to add a volume moving average — typically a 20-day average of daily volume. This line tells you what "normal" looks like for that stock. When current volume is above the line, participation is elevated. When it's below, participation is muted.</p>
<p>Always compare volume relative to the average rather than in absolute terms. 2 million shares traded means very different things for a stock that normally trades 500,000 shares (4x average = very significant) versus a stock that normally trades 10 million shares (0.2x average = extremely quiet).</p>
<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">Every time you see a price move worth noting, immediately look at the volume bar beneath it and classify the combination: up/up, up/down, down/up, or down/down. Do this for every significant candle on the chart before you draw any conclusion about what the chart is telling you. Within a few weeks this becomes automatic — and your read of charts will improve dramatically.</div></div>`},
'04-04':{title:'Relative Volume (RVOL)',content:`<p>Relative volume is one of the most important numbers in a trader's pre-market routine. It tells you how much volume a stock is trading compared to its average volume at the same time of day. A stock trading at 5x relative volume is exceptional. A stock trading at 0.3x relative volume is dead money.</p><h3>What RVOL Tells You</h3><p>When a stock has unusually high relative volume it means something is happening. News, earnings, unusual options activity, sector catalyst - something has attracted significant attention to this stock today. High RVOL is the first filter because it means the stock is alive and moving with real participation. Low RVOL means even if the chart looks perfect, there are not enough participants to push it where you need it to go.</p><h3>The RVOL Threshold</h3><p>As a general guideline, look for stocks with at least 1.5x to 2x relative volume as a baseline for day trading. Above 3x is strong. Above 5x is exceptional and often indicates a major catalyst. Below 1x means the stock is trading below its normal activity level and setups on that stock carry lower probability of follow-through.</p><h3>How to Use RVOL Pre-Market</h3><p>Before the market opens, sort your scanner by relative volume to see which stocks are already trading significantly above their normal pre-market volume. These are your candidates for the day. A stock at 10x relative volume pre-market with a clear catalyst is on every active trader's radar that morning.</p><h3>RVOL During the Day</h3><p>Watch how relative volume changes throughout the session. A stock that starts the day at 5x RVOL but falls to 1x RVOL by 10am is losing participation. A stock that starts moderate and climbs to 4x RVOL by midday is attracting increasing attention - something is building.</p><div class="callout"><div class="callout-label">TST Edge</div><p>No RVOL, no trade. This is a rule worth following strictly as a beginner. Every setup looks better with high relative volume behind it. Volume is conviction. Relative volume tells you how unusual that conviction is today.</p></div>`},
'04-05':{title:'Stock Screeners for Beginners',content:`<p>A stock screener is a tool that filters thousands of stocks down to a handful that meet criteria you define. Without a screener you would need to manually look through thousands of charts every day. With a screener you can surface the 3-5 stocks that actually deserve your attention in minutes. Learning to use a screener is one of the first practical skills you need to develop as a trader.</p><h3>What a Screener Does</h3><p>You set filters - minimum volume, price range, percentage move, relative volume - and the screener returns every stock that meets all of your criteria simultaneously. Instead of looking for a needle in a haystack you are telling the screener exactly what the needle looks like and letting it search for you.</p><h3>How to Use Webull Scanner</h3><p>In Webull open the Markets tab and select Screener. You will see a list of filters on the left side. The most useful filters for beginners are: Price (set a range you can afford to trade), Volume (minimum shares traded today), Change Percentage (stocks moving more than a certain percent), and Market Cap (large cap vs small cap). Set your filters, hit Apply, and Webull returns a list of stocks meeting your criteria sorted by whichever column you choose.</p><h3>The Most Important Filters</h3><p>Relative Volume - stocks trading at 2x or more of their average volume are doing something unusual. This is your primary filter for finding stocks worth watching. Price Change - filtering for stocks moving more than 3-5% pre-market gives you your catalyst candidates for the day. Average Volume - setting a minimum of 500,000 shares average daily volume ensures the stocks you find are liquid enough to trade without significant slippage.</p><h3>Free Scanner Options</h3><p>Webull has a built-in scanner. Finviz.com has a powerful free web-based screener. Both are sufficient for beginners. As you develop more specific criteria you may consider a paid scanner like Trade Ideas, but start with the free options and learn what you are looking for before spending money on tools.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Your scanner is only as good as your filters. The goal is not to find everything - it is to find the 2-3 stocks that deserve your full attention today. Start with simple filters, learn which ones surface the types of moves you want to trade, and refine from there. A beginner with 3 clear filters will outperform one with 20 confusing ones.</p></div>`},
'04-06':{title:'Reading Level 2',content:`<p>Level 2 is a display of all the current bids and offers for a stock — showing you not just the best price but the depth of the order book.</p><h3>The components of Level 2</h3><ul><li><strong>Bid side</strong> — all buyers, organized from highest price to lowest.</li><li><strong>Ask side</strong> — all sellers, organized from lowest price to highest.</li><li><strong>Size</strong> — the number of shares at each price level.</li></ul><h3>What Level 2 tells you</h3><p>Where the walls are — large blocks of shares at a specific price create temporary support or resistance. A seller with 50,000 shares at $50.00 is a wall — price will struggle to push through until that seller is absorbed or moves their order.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Level 2 is a tool for experienced traders — beginners often overthink it. The most important thing to watch is whether bids or asks are dominating. Are buyers aggressive and refreshing their bids? Or are sellers stepping in front of every uptick?</p></div>
<h3>Level 2 Order Book Basics</h3>
<p>Level 2 is a real-time display of the bids and asks for a stock — not just the current best bid and best ask (that's Level 1), but a window into the entire depth of the market: every buy order and every sell order that exists at every price level above and below the current price.</p>
<p>Understanding Level 2 separates traders who see the current price from traders who see the supply and demand structure behind the current price. When used correctly, it gives you information about where buyers and sellers are positioned that price action alone doesn't reveal.</p>
<h3>The Structure of Level 2</h3>
<p>Level 2 displays two columns: the <strong>bid side</strong> (buyers) on the left and the <strong>ask side</strong> (sellers) on the right. Each row shows a price level and the number of shares available at that price.</p>
<p>The <strong>best bid</strong> is the highest price any buyer is currently willing to pay. The <strong>best ask</strong> is the lowest price any seller is currently willing to accept. The difference between these two prices is the <strong>spread</strong>. Market orders to buy execute at the ask. Market orders to sell execute at the bid.</p>
<p>Below the best bid, you'll see additional bids at progressively lower prices — these are buyers who want the stock but aren't willing to pay the current price. Above the best ask, you'll see additional asks at progressively higher prices — sellers who want more than the current price to part with their shares.</p>
<h3>What You're Looking For</h3>
<p><strong>Large bids (buyers)</strong> — A large block of shares on the bid side at a specific price creates a visible support level. Sellers who try to push price below that level have to get through all those shares first. Traders watch for large bids to hold as support. When a large bid absorbs a significant amount of selling without moving, it signals a strong buyer is defending that level.</p>
<p><strong>Large asks (sellers)</strong> — A large block of shares on the ask side at a specific price creates a visible resistance level. Buyers trying to push price above that level have to absorb all those shares. When price approaches a large ask and can't break through, it signals a significant seller is present.</p>
<p><strong>Bid stacking</strong> — Multiple large bid orders appearing at the same price or in close proximity. Suggests strong buying interest below current price and often acts as a floor in the near term.</p>
<p><strong>Ask stacking</strong> — Multiple large ask orders clustered together. Suggests strong selling interest above current price and often acts as a ceiling.</p>
<h3>Market Makers and Their Role</h3>
<p>Market makers are firms required to maintain two-sided markets — they must post both bids and asks at all times for the stocks they make markets in. They profit from the spread (buying at bid, selling at ask repeatedly). Understanding that market makers are always present on both sides explains why Level 2 always shows activity even in thinly traded stocks.</p>
<p>On high-volume liquid stocks, the Level 2 window refreshes so rapidly that individual orders are nearly impossible to track. On thinner stocks — small caps, low-float names — Level 2 moves more slowly and individual orders become more meaningful and trackable.</p>
<h3>The Limitations of Level 2</h3>
<p>Level 2 shows the visible order book — the orders that have been placed and are sitting at various price levels. It does not show hidden orders, dark pool activity, or the intentions of large institutions who route orders off-exchange. This means the Level 2 you see is always an incomplete picture of the actual supply and demand.</p>
<p>Additionally, orders on Level 2 can be canceled instantly. A large bid that disappears the moment price approaches it was likely a fake order placed to create the appearance of support — a practice called spoofing, covered in detail in lesson 04-11.</p>
<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">Level 2 is most useful for intraday traders on small and mid-cap stocks where individual large orders are visible and meaningful. On large-cap liquid names like AAPL or TSLA, the order book refreshes thousands of times per second and individual orders are impossible to track meaningfully. Adjust your reliance on Level 2 based on what type of stock you're trading.</div></div>`},
'04-07':{title:'Reading the Tape',content:`<p>The tape — also called time and sales — is a real time record of every transaction that occurs in a stock.</p><ul><li><strong>Green prints</strong> — trades that executed at the ask price. Buyers were aggressive.</li><li><strong>Red prints</strong> — trades that executed at the bid price. Sellers were aggressive.</li><li><strong>Large prints</strong> — big blocks of shares trading at once. Institutional activity.</li></ul><h3>Tape speed</h3><p>Fast tape with many prints — high activity, strong momentum. Slow tape with few prints — low interest, little conviction. The move may stall.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The tape tells the truth when the chart might lie. A chart can show a breakout that looks clean — but if the tape is showing nothing but red prints and sellers hitting bids on every uptick, that breakout is not what it appears. Learn to read it and you'll have an edge that most retail traders simply don't have.</p></div>
<h3>Reading the Tape</h3>
<p>The tape — also called the time and sales window — is a real-time feed of every transaction that occurs in a stock: the price, the size of the trade, and whether it executed at the bid or the ask. While Level 2 shows you where orders are sitting, the tape shows you what's actually happening — the transactions being executed right now.</p>
<p>Reading the tape is one of the older skills in trading, dating back to the original ticker tape machines of the early 20th century. The technology has changed dramatically but the core skill — reading the flow of buying and selling through actual transactions — remains as relevant as ever.</p>
<h3>What the Tape Shows You</h3>
<p>Each print on the tape contains three pieces of information:</p>
<ul>
<li><strong>Price</strong> — The price at which the trade executed</li>
<li><strong>Size</strong> — The number of shares in the transaction</li>
<li><strong>Side</strong> — Whether the trade executed at the bid (seller-initiated) or the ask (buyer-initiated)</li>
</ul>
<p>Color coding makes this readable at speed: green prints typically indicate trades at the ask (buyers being aggressive, willing to pay up), red prints indicate trades at the bid (sellers being aggressive, willing to sell down), and yellow or white prints indicate trades at or between the bid and ask.</p>
<h3>What You're Looking For</h3>
<p><strong>Large prints at the ask</strong> — A large block of shares (relative to the stock's typical trade size) executing at the ask means a buyer paid up — they hit the asking price to get filled immediately rather than waiting. This signals urgency on the buy side. A series of large prints at the ask in quick succession is a sign of aggressive buying pressure.</p>
<p><strong>Large prints at the bid</strong> — A large block executing at the bid means a seller took the current bid rather than waiting for buyers to come up. Aggressive selling. Multiple large prints at the bid suggest sellers are in control and willing to push price lower to get out.</p>
<p><strong>Pace of the tape</strong> — A tape that's moving extremely fast with many transactions per second shows high interest and activity. A tape that's barely moving, with only a few small prints, shows low interest. The pace of the tape is often the first indication of whether a move is real or manufactured.</p>
<p><strong>Prints at specific price levels</strong> — Watch how the tape behaves at your key technical levels. If price is approaching resistance and you see the tape slow down dramatically — fewer prints, smaller sizes — sellers aren't absorbing the move. If the tape accelerates with large prints at the ask as price breaks through resistance, the breakout has real conviction.</p>
<h3>Tape Reading in Practice</h3>
<p>Tape reading is most effective on stocks where individual transactions are large enough to be meaningful — typically small and mid-cap stocks with moderate volume. On a stock trading 100 million shares a day, individual tape prints happen too fast to process and are too small individually to matter.</p>
<p>A practical use case: you're watching a stock that's consolidating just below resistance. The tape shows a steady stream of moderate-sized prints at the ask — buyers are consistently willing to pay the asking price. Then the pace accelerates, prints get larger, and price breaks above resistance. The tape confirmed the breakout before it was obvious on the price chart alone.</p>
<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">Tape reading is a skill that takes months of consistent observation to develop. You cannot learn it from a lesson — you have to sit and watch it, over and over, until the patterns become intuitive. Pull up the time and sales window for every stock you watch and start noticing the rhythm of prints before you try to interpret them.</div></div>`},
'04-08':{title:'When Order Flow Actually Matters',content:`<p>This lesson covers the essential concepts of <strong>When Order Flow Actually Matters</strong>. Full content coming soon.</p>
<ul><li>Order flow utility on thin vs thick stocks</li><li>Spoofing and fake orders — common manipulation</li><li>When to trust L2 vs when it is noise</li><li>Tape reading on large caps vs small caps</li><li>When NOT to trade based on tape</li></ul>
<h3>When Order Flow Actually Matters — And When It Doesn't</h3>
<p>Order flow analysis — reading Level 2 and the tape — is a powerful tool that many traders either over-rely on or completely ignore. The truth is that its usefulness varies enormously depending on what you're trading, when you're trading it, and what you're trying to learn from it. This lesson teaches you when to pay close attention to order flow and when to ignore it entirely.</p>
<h3>Thin Stocks vs Thick Stocks</h3>
<p>The most important factor determining how useful order flow is: the liquidity of the stock you're trading.</p>
<p><strong>Thin stocks</strong> (small caps, low float, average daily volume under 1 million shares) — Order flow is highly useful here. Individual large orders are visible and meaningful. A single 50,000-share bid at a key level on a stock that normally trades 300,000 shares per day is a significant data point. The tape moves slowly enough to track. Level 2 changes are deliberate enough to interpret. This is where tape reading and Level 2 analysis earn their keep.</p>
<p><strong>Thick stocks</strong> (large caps, high liquidity, average daily volume over 10 million shares) — Order flow is nearly useless for short-term prediction on these names. Apple trades 50-100 million shares per day. Individual prints are microseconds apart. The Level 2 refreshes thousands of times per second. No human can process this data fast enough to extract actionable information. On liquid large-cap stocks, price action and volume are far more useful tools than tape reading.</p>
<h3>When to Trust Level 2 vs When It's Noise</h3>
<p>Level 2 is trustworthy when:</p>
<ul>
<li>The stock is thin enough that individual orders are visible and stable</li>
<li>A large bid or ask has been sitting at a specific level for at least several minutes</li>
<li>Price repeatedly tests that level and is rejected — the order is actually absorbing flow</li>
