'lt-0':{title:'Live Trades - How to Use This Section',content:`<p>This section contains real recorded trades from real market sessions. Every trade shown here was taken with real capital under real market conditions. Nothing has been cherry-picked or edited to remove the uncomfortable moments - the uncertainty, the near-stops, the decisions that had to be made without knowing the outcome.</p><h3>Watch Actively</h3><p>The most common and least effective way to watch trading videos is passively - just watching what happens. The most effective way is actively pausing before each decision point and asking yourself what you would do, then comparing your answer to what is actually executed. The gap between what you would do and what a more experienced trader does is where your learning lives.</p><h3>What Each Trade Will Cover</h3><p>Pre-trade setup analysis, the specific entry trigger, position sizing rationale, how the trade was managed in real time, the exit and why, and a brief post-trade review covering what went well and what could have been done better. The post-trade review is as valuable as the trade itself - even profitable trades have things that could be improved.</p><div class="callout"><div class="callout-label">TST Edge</div><p>You will learn more from watching 10 trades executed in real time than from reading 100 lessons. The lessons give you the vocabulary. The live trades show you the language in use. Both are necessary. Neither is sufficient alone.</p></div>`},
'19-02':{title:'Market Observations',content:`<p>Real-time pattern recognition and market observations. Updated regularly with current market analysis and lessons from live trading sessions.</p>`},
'19-03':{title:'Continuing Education',content:`<p>Resources for ongoing learning — recommended books, tools, communities, and frameworks for continuing to develop as a trader after completing the course.</p>`},
'a4':{title:'Pre-Market Prep',content:`<p>The hour before the market opens is the most important hour of your trading day. What you do in pre-market determines everything about how you trade when the bell rings. Check overnight news and earnings. Run your scanner for pre-market movers. Mark key levels on your top 2-3 watchlist names. Know your bias before the open - not after. Traders who show up unprepared react. Traders who prepare execute.</p>`},
'a5-0':{title:'Your Rules',content:`<p>Your rules are the non-negotiables. The lines you never cross regardless of how good a setup looks or how confident you feel. Maximum loss per trade. Maximum loss per day. No trading during the first 15 minutes if that is what your data shows. No holding through earnings. No adding to losers. Your rules are built from your own trading history - the patterns of when you make money and when you give it back. Write them down. Review them every morning. A trader without rules is just gambling.</p>`},
'a5-4':{title:'Sizing Up & Down',content:`<p>Position size should never be static. When you are in a drawdown or trading in a choppy uncertain market, size down - protect your capital and your confidence. When you are in a hot streak, your setups are working cleanly, and the market is trending, size up gradually. The key word is gradually - never double your size overnight. Increase by 25% increments as results confirm the conditions are right. Sizing is a performance tool. Use it like one.</p>`},
'a5-5':{title:'Setup No-Trade Rules',content:`<p>Every setup in your playbook has conditions under which it should not be traded. These are your no-trade rules - specific circumstances where even a technically valid setup carries low enough probability that the trade is not worth taking. Building these rules is as important as building the setups themselves.</p><h3>Time-Based No-Trade Rules</h3><p>Do not take breakout setups in the last 30 minutes of the trading day unless volume is exceptional. End-of-day breakouts frequently fail because institutions are closing positions rather than opening new ones. Do not take any setup in the first two minutes after a major economic announcement - the volatility is too erratic to rely on technical signals. Do not trade your momentum setups during the midday lull between 11:30 AM and 2:00 PM.</p><h3>Market-Condition No-Trade Rules</h3><p>Do not take long breakout setups on a day when SPY is down more than 1.5% - the overall market is working against you. Do not take small cap momentum setups on a VIX above 30 - the volatility is too unpredictable to manage risk reliably. Do not trade any setup after you have already hit your daily max loss - you are done for the day regardless of what you see setting up.</p><h3>Setup-Specific No-Trade Rules</h3><p>Do not take a flag breakout if the flag has lasted more than 20 candles on your trading timeframe - the momentum is gone. Do not take a support bounce if price has tested that support more than four times in the past week - the level is weakening. Do not take any setup on a stock with relative volume below 0.5x - there is not enough participation to generate follow-through.</p><h3>Building Your Own No-Trade Rules</h3><p>Review your losing trades over the past three months. Look for patterns - what time of day did they occur, what was the market doing, what were the specific conditions that made those trades underperform? The conditions that consistently appear in your losing trades become your no-trade rules.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Your no-trade rules are just as important as your trade rules. A playbook without no-trade rules is incomplete. The setup that you do not take because the conditions are wrong is a win just as much as a profitable trade. Discipline means knowing when not to act.</p></div>`},
'a5-6':{title:'Building Your Stock Universe',content:`<p>Professional traders do not wake up every morning and scan thousands of stocks looking for anything that moves. They develop a personal stock universe - a specific group of 5-20 stocks they understand deeply and trade repeatedly. This approach creates edge through familiarity.</p><h3>Why a Defined Universe Works</h3><p>When you trade the same stocks repeatedly, you learn their personalities. You know how NVDA reacts to its 20-day moving average. You know that SPY tends to find support at its opening range low. You know that your small cap runner typically reverses at its first float rotation. This knowledge is not available to someone who just pulled the stock up for the first time today - it is earned through observation and experience with that specific stock.</p><h3>How to Build Your Universe</h3><p>Start with stocks that match your trading style. If you are a momentum day trader, your universe includes the highest-volume, most-liquid names in the current hot sectors. If you are a swing trader, your universe includes 10-15 stocks with clean technical patterns and strong fundamentals that you monitor daily. Spend 30 days watching each stock before adding it to your active universe.</p><h3>Rotating Your Universe</h3><p>Your stock universe should evolve with market conditions. A momentum stock that has lost its catalyst and volume should be replaced with a name that is currently in play. But resist the urge to constantly add new names - depth of knowledge about a few stocks beats surface knowledge about many.</p><h3>The 30-Day Rule</h3><p>Before trading any stock with real capital, watch it for 30 consecutive trading days. Watch how it reacts to news. Watch how it behaves near support and resistance. Watch its volume patterns. Watch how it trades relative to the broader market. After 30 days of observation you will have an edge over every trader who just pulled it up today.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Pick three stocks and trade only those for your first 90 days. Learn them cold. Know their ATR, their typical daily range, their key levels, and how they behave at those levels. That knowledge is more valuable than any scanner or indicator. Expertise in a few beats dilettantism in many every time.</p></div>`},
'a6-9':{title:'Liquidity Sweeps',content:`<p>A liquidity sweep is when price moves to a level where a large number of orders are sitting — stop losses, limit orders — triggers those orders, then reverses. It is similar to a stop hunt but on a larger scale.</p>
<h3>Where liquidity clusters</h3>
<ul>
<li>Below obvious support levels (retail long stops)</li>
<li>Above obvious resistance levels (retail short stops)</li>
<li>At round numbers ($50, $100, $200)</li>
<li>At prior highs and lows</li>
<li>At opening range high/low</li>
</ul>
<h3>Trading the sweep</h3>
<p>After a liquidity sweep, price typically reverses sharply. The entry is on the reclaim of the swept level. This is a counter-trend entry with a well-defined stop (below the sweep low) and a clear target (the other side of the range).</p>
<div class="callout"><div class="callout-label">TST Edge</div><p>Liquidity sweeps at key levels on low timeframes at the open are extremely common. The market opens, sweeps the overnight low, triggers all the overnight longs' stops, absorbs that selling, then reverses higher. Recognizing this pattern at the open is a significant edge.</p></div>`},
'a6-10':{title:'Gap Down Bear Flags',content:`<p>A gap down bear flag forms when a stock gaps down significantly at the open, has a weak bounce (the flag), and then breaks down below the gap low to continue lower. It is one of the highest-conviction short setups in the playbook.</p>
<h3>Structure</h3>
<ul>
<li>Stock gaps down 5%+ at the open on a catalyst</li>
<li>Weak, low-volume bounce over 15-30 minutes — this is the flag</li>
<li>The bounce does not reclaim VWAP or any significant level</li>
<li>Break below the gap low on volume is the entry signal</li>
</ul>
<h3>Why it works</h3>
<p>The initial gap down creates sellers. The bounce traps any buyers who thought it was overdone. When the bounce fails and price breaks the gap low, those trapped buyers become forced sellers — adding to the decline.</p>
<div class="callout"><div class="callout-label">TST Edge</div><p>The best gap down bear flags have a very tight, weak bounce. If the bounce is vigorous and reclaims VWAP, that is not a bear flag — that is a potential reversal. You want a sluggish bounce that goes nowhere on low volume.</p></div>`},
'a6-12':{title:'ER Day 2',content:`<p>ER Day 2 refers to the trading session immediately following an earnings release. While Day 1 (earnings day itself) is often volatile and unpredictable, Day 2 frequently provides cleaner, more tradeable setups as the market digests the news.</p>
<h3>What to watch on Day 2</h3>
<ul>
<li><strong>Gap hold</strong> — if the stock gapped up on earnings and holds the gap on Day 2, that is bullish continuation</li>
<li><strong>Consolidation breakout</strong> — Day 1 often creates a range. A Day 2 breakout above that range is a high-conviction entry</li>
<li><strong>Failed gap fill</strong> — if the stock tries to fill the gap and fails, buyers are defending — long entry on the failed fill</li>
</ul>
<h3>Why Day 2 is cleaner</h3>
<p>Day 1 has the most uncertainty and emotional trading. By Day 2, the weak hands have shaken out and the real trend is establishing itself. The setup is cleaner and the move is more sustained.</p>
<div class="callout"><div class="callout-label">TST Edge</div><p>The best ER Day 2 trades come from stocks that had orderly Day 1 price action — a gap up, a tight consolidation, and a close near the highs. That tight Day 1 action sets up a clean Day 2 breakout above the Day 1 consolidation.</p></div>`},
'a6-13':{title:'The Morning Flush',content:`<p>The morning flush is a sharp sell-off that occurs in the first 30-60 minutes of trading, often on a stock with a positive catalyst. The stock opens strong, then gets flushed lower as early buyers take profits and weak hands panic out.</p>
<h3>Why the flush happens</h3>
<p>Pre-market buyers take profits at the open. Retail FOMO buyers from the open panic when the stock drops. This forced selling creates the flush — a sharp, fast move lower that looks like the setup is failing.</p>
<h3>Trading the flush</h3>
<ul>
<li>Wait for the flush to exhaust — a hammer candle, a doji, or a bullish engulfing at support</li>
<li>The flush low becomes your stop level</li>
<li>Entry is on the reclaim of VWAP or the pre-market support level</li>
<li>If the catalyst is still intact, the stock often recovers the entire flush and makes new highs</li>
</ul>
<div class="callout"><div class="callout-label">TST Edge</div><p>Do not buy into the flush — wait for it to complete. Buying a flushing stock is catching a falling knife. The edge is in buying the reclaim after the flush is done. Let the flush happen, identify the low, then buy the first sign of recovery.</p></div>`},
'a6-21':{title:'Washout Longs',content:`<p>A washout long is a setup where a stock has been sold aggressively — often on forced selling, panic, or a stop hunt — and the selling exhausts itself at a key level, creating a high-risk/reward long entry.</p>
<h3>What creates a washout</h3>
<ul>
<li>Stop loss cascade — one stop triggers another, creating a flush</li>
<li>Margin calls — forced liquidation at any price</li>
<li>Panic selling on news that is worse than expected</li>
<li>Algorithms triggering below a key support level</li>
</ul>
<h3>Identifying the washout low</h3>
<ul>
<li>Volume spike — the highest volume of the day on the flush candle</li>
<li>Long lower wick — price reaches extreme lows but recovers within the candle</li>
<li>Immediate recovery — the next candle reverses aggressively</li>
<li>Price reclaims a key level (VWAP, support) quickly</li>
</ul>
<div class="callout"><div class="callout-label">TST Edge</div><p>Washout longs are high risk. The stop is below the washout low which can be far from the entry. Size accordingly — smaller than your normal position. The reward potential is significant but so is the volatility. Half size, tight stop, big target.</p></div>`},
'a6-23':{title:'First Green Day Move',content:`<p>The First Green Day is one of the most reliable momentum setups in small cap trading. After a stock has been declining or consolidating, the first day it closes green — especially on a catalyst — signals a potential shift in ownership and momentum.</p>
<h3>What makes a valid First Green Day</h3>
<ul>
<li><strong>Prior downtrend or consolidation</strong> — the stock must have been weak or flat before this move</li>
<li><strong>Catalyst</strong> — news, earnings, FDA approval, or any genuine reason for the change in direction</li>
<li><strong>Volume expansion</strong> — significantly higher volume than recent sessions confirms new buyers are entering</li>
<li><strong>Strong close</strong> — the stock should close near the high of the day, not give back most of the gains</li>
</ul>
<h3>The trade</h3>
<p>Entry is either on the day itself (if the setup is clean) or on Day 2 if the stock consolidates near the First Green Day high. Stop is below the First Green Day low. Target is 2-3x the risk.</p>
<div class="callout"><div class="callout-label">TST Edge</div><p>The First Green Day works because it marks the moment when a stock transitions from being owned by sellers (who drove it down) to being owned by new buyers with higher cost bases. Those new buyers will defend their position and add on dips, creating the sustained momentum that defines the best small cap runs.</p></div>`},
'a7-0':{title:'Best Trades Rarely Full Size',content:`<p>The best setups almost never allow you to get full size at your ideal entry. A stock that is setting up perfectly gets there fast, gives you a one or two candle window, and moves before most people are positioned. If you are waiting to get your full 500 shares filled at the perfect price on a perfect setup - you are going to miss it or chase it. The solution is to take what the market gives you, get partially positioned, and add on confirmation rather than waiting for perfect fill before the move even starts.</p>`},
'a7-1':{title:'Pyramiding Winners',content:`<p>Pyramiding is the practice of adding to a winning position as the trade continues to move in your favor. Done correctly it is one of the most powerful tools available to a trader. Done incorrectly it turns a winner into a disaster.</p><h3>The Rules</h3><p>Every add must be smaller than the previous one. Your first entry is your largest position. Your second add is half that size. Your third add is half again. This ensures that if the trade reverses, your average cost stays manageable and your overall risk stays controlled.</p><h3>When to Add</h3><p>Only add at points of new confirmation - a new breakout above a resistance level, a successful retest of a prior breakout, or a new high on expanding volume. Never add just because the trade is going your way. Wait for the market to confirm the continuation before putting more capital at risk.</p><h3>Stop Management</h3><p>Every time you add to the position, your stop moves up. You are locking in profits on the earlier entries while risking only a small amount on the new add. The position as a whole should always be profitable if your stop triggers. You are never adding to a position that could turn into a loss.</p><h3>The Mistake</h3><p>The most common pyramiding mistake is adding in equal or increasing size. Equal adds means your average cost is too high and a normal pullback wipes out your gains. Increasing adds is even more dangerous. Pyramid up in decreasing size only.</p>`},
'a7-2':{title:'Mean Reversion',content:`<p>Mean reversion is the tendency for prices to return toward their historical average after becoming extended in one direction. Markets do not move in straight lines. They stretch, they snap back, they stretch again.</p><h3>How to Identify Extension</h3><p>The most practical way to identify extension is through moving averages. When a stock is trading significantly above its 20-day moving average after a multi-day run with no pullback, it is extended to the upside. When it is trading significantly below its 20-day moving average after a sharp selloff, it is extended to the downside. The further price is from its mean, the higher the probability of at least a partial reversion.</p><h3>RSI as a Confirming Tool</h3><p>RSI above 80 on a daily chart after a strong move indicates extension. RSI below 20 after a sharp selloff indicates oversold conditions. Neither alone is a trade signal but combined with other signals they increase the probability of a reversion trade working.</p><h3>The Trade</h3><p>Mean reversion trades work best when combined with a clear catalyst for the reversion - a key resistance level, a prior high, or a major moving average. The entry is when price shows the first signs of stalling at the extreme. The stop is above the extension high. The target is a return to the mean - typically the 20-day moving average.</p>`},
'a7-3':{title:'Exhaustion Signals',content:`<p>Exhaustion signals appear at the end of extended moves when the trend is running out of fuel. Learning to recognize them keeps you from chasing tops and bottoms and positions you for the reversal before everyone else sees it.</p><h3>The Signals</h3><p><strong>Shrinking candles</strong> - after a series of large decisive candles in the trend direction, the candles start getting smaller. The move is losing momentum. Each push takes more effort and achieves less distance.</p><p><strong>Climax volume</strong> - a massive volume spike, often the highest volume day of the entire move, where price barely moves. All that volume and the stock can only gain a fraction of what it was gaining on similar volume earlier in the move. That is sellers winning the war.</p><p><strong>Weak closes</strong> - the stock makes a new high intraday but closes well below it. The upper wick is long. Buyers got there but could not hold it.</p><p><strong>RSI divergence</strong> - price makes a new high but RSI makes a lower high. The momentum behind the move is weakening even as price reaches new levels. One of the most reliable reversal signals when it appears at a key resistance level after an extended run.</p><h3>How to Use Them</h3><p>No single exhaustion signal is enough to trade against a trend. Wait for multiple signals to appear simultaneously - climax volume plus a weak close plus RSI divergence at a key resistance level. When all of those stack up, the probability of at least a meaningful pullback is high.</p>`},
'a7-4':{title:'Washout Longs',content:`<p>A washout long is one of the highest conviction reversal setups available. It occurs after a prolonged downtrend reaches a point of complete capitulation - where every remaining holder gives up at once. The fear is maximum. The selling is violent. And then suddenly it stops.</p><h3>What a Washout Looks Like</h3><p>The washout candle is the largest most aggressive red candle of the entire down move - often with volume that dwarfs everything before it. Price opens sharply lower, sells off hard with no real bounce attempts, and then suddenly reverses and closes well above the low. The key is the volume and the reversal within the same candle - that tells you buyers stepped in aggressively at the exact low.</p><h3>Why It Works</h3><p>A washout represents the final flush of weak holders. Every person who was going to sell has now sold. The sellers are exhausted. The buyers who step in at the washout low are doing so with conviction. Once the sellers are gone and buyers control price, the snap-back can be violent.</p><h3>The Trade</h3><p>Do not enter during the washout candle itself. Wait for stabilization. The next candle needs to show that buyers are holding the low - a small green candle, a doji, or at minimum a candle that does not make a new low. That stabilization is your entry signal. Stop goes below the washout low. The target is the snap-back toward the prior range - often a 50-100% retracement of the washout move.</p>`},
'ac-7':{title:'Slow Walk Downs on Options',content:`<p>A slow walk down occurs when a stock gradually and persistently declines over days or weeks, systematically destroying call option value through price decline and theta decay simultaneously.</p><h3>Why it is deadly for call buyers</h3><ul><li><strong>Price moves against you</strong> — intrinsic value erodes as the stock falls</li><li><strong>Time decay accelerates</strong> — theta burns faster as expiration approaches</li><li><strong>IV contracts</strong> — as stock drifts lower without volatility, implied volatility decreases further reducing option value</li></ul><p>All three forces work against you simultaneously. A stock does not need to collapse to destroy your calls — a slow 10% decline over 3 weeks can wipe 80% of option value.</p><h3>The 0DTE trap</h3><p>This is especially brutal on 0DTE options. Even if the stock is slowly drifting in your direction, theta is destroying your option faster than delta is building it. A call that needs a $5 move by end of day will lose value every single minute that move is delayed — even if the stock eventually gets there. On 0DTE, slow is the same as wrong. The move has to happen fast or the option expires worthless regardless of direction. This is why a slow grinding move on 0DTE is not a win — it is a slow loss.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The slow walk down is more dangerous than a sharp drop for options buyers because it gives false hope. A sharp drop feels like capitulation. A slow walk down just grinds, eating your premium every day until expiration. Use puts or put spreads instead of fighting it with calls.</p></div>`},
'b-wash':{title:'The Wash Sale Rule',content:`<p>The wash sale rule is an IRS regulation that prevents traders from claiming a tax loss on a security if they buy the same or substantially identical security within 30 days before or after the sale. It is one of the most commonly violated tax rules in active trading - not through intentional evasion but through simple unawareness that it exists.</p><h3>How It Works</h3><p>You buy 100 shares of NVDA at $900. It drops to $850 and you sell at a loss of $5,000. You immediately buy NVDA back at $850 because you still like the setup. The IRS disallows your $5,000 loss. The disallowed loss is instead added to the cost basis of the new shares you purchased, deferring the loss to when you eventually sell those shares. If you never sell within the same tax year, you cannot claim the loss that year.</p><h3>The 30-Day Window</h3><p>The window is 30 days before and 30 days after the sale. If you sold NVDA on December 15 at a loss and bought it back on January 5, that is still a wash sale even though it crosses tax years. Active traders who trade the same names repeatedly almost always trigger wash sales without realizing it.</p><h3>What Counts as Substantially Identical</h3><p>Selling NVDA stock and buying NVDA calls within 30 days is a wash sale. Selling SPY and buying QQQ is not - they are different securities even though they are correlated. Selling NVDA and buying AMD is not a wash sale. The rule applies to the exact same security and options on that security.</p><h3>How to Manage It</h3><p>If you want to maintain market exposure after selling at a loss, wait 31 days before buying back the same security. Or buy a correlated but different security in the interim - selling NVDA and buying AMD gives you continued semiconductor exposure without triggering the rule. Track every loss sale and the subsequent 30-day window.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Wash sales are most dangerous in December. Traders who are harvesting losses for tax purposes at year end frequently buy back their positions in January and unknowingly trigger wash sales. Consult a tax professional who understands active trading before making year-end tax decisions.</p></div>`},
'b10-5':{title:'Volume Profile',content:`<p>Volume Profile displays the total volume traded at each price level over a specific time period — shown as horizontal bars on the chart. Unlike traditional volume indicators that show volume per time period, Volume Profile shows volume per price level.</p><h3>Key components</h3><ul><li><strong>Point of Control (POC)</strong> — the price level with the highest volume over the selected period. Price frequently returns to it and uses it as support or resistance.</li><li><strong>Value Area</strong> — the range of prices where approximately 70% of all volume traded.</li><li><strong>High Volume Nodes (HVN)</strong> — areas of high trading activity. Price tends to slow down and consolidate here.</li><li><strong>Low Volume Nodes (LVN)</strong> — areas of thin trading activity. Price tends to move through LVNs quickly.</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>Volume Profile takes time to master but it's worth the investment. When you combine Volume Profile with traditional support and resistance levels — and both align at the same price — you have institutional-grade confirmation.</p></div>`},
'b12-2':{title:'Short Selling Mechanics',content:`<p>Understanding the mechanical process of short selling is essential before you place your first short trade.</p><h3>How to short sell</h3><p>In your brokerage platform, instead of clicking "Buy" you click "Sell Short." The broker locates shares to borrow from their inventory or from other clients' accounts and executes the short sale.</p><h3>Hard to borrow stocks</h3><p>When short interest is very high, available shares become scarce. Brokers mark these stocks as "HTB" — hard to borrow. They charge a daily borrow fee to maintain the short position. Check the borrow fee before shorting any stock with high short interest.</p><h3>Covering your short</h3><p>To close a short position you "buy to cover" — buying the shares you previously sold short and returning them to the lender. Your profit or loss is the difference between your short sale price and your cover price.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Before you short any stock, know your borrow fee and your broker's locate availability. Have a backup broker with better locate availability for active short selling. The setup means nothing if you can't execute.</p></div>`},
'b12-ls':{title:'Long vs Short Execution',content:`<p>Going long and going short are the two fundamental directions of any trade. Long means you are buying with the expectation that price will rise. Short means you are selling borrowed shares with the expectation that price will fall. Every trade you ever take will be one of these two directions. Understanding the mechanics of both, and the specific risks unique to each, is foundational.</p><h3>Going Long</h3><p>A long trade is the most intuitive direction. You buy shares at one price and sell them at a higher price. Your maximum loss on a long trade is limited to your entire investment - the stock can only go to zero. Your maximum gain is theoretically unlimited - the stock can rise indefinitely. Entry is when you identify a setup that suggests price is likely to move higher. Stop loss is placed below a key support level. Target is the next significant resistance level above.</p><h3>Going Short</h3><p>A short trade is the less intuitive direction. You borrow shares from your broker and sell them immediately at the current price. You are now short - you owe those shares back. If the stock drops you buy them back cheaper, return them to the broker, and keep the difference as profit. If the stock rises you must still buy them back - now at a higher price - and absorb the loss.</p><h3>The Unique Risk of Short Selling</h3><p>The most important difference between long and short is the asymmetry of risk. When you are long, your maximum loss is 100% - the stock goes to zero. When you are short, your maximum loss is theoretically unlimited - a stock can rise 100%, 200%, 500% or more. This is why short selling requires strict stop losses and why trading without a stop on a short position can be catastrophic. Short squeezes - when a heavily shorted stock rises rapidly and forces shorts to cover - can destroy short positions in minutes.</p><h3>Locating Shares to Short</h3><p>To short a stock your broker must be able to locate shares to lend you. On liquid large cap stocks this is never an issue. On small cap stocks with low float and high short interest, shares may be unavailable to borrow or available only at high borrow fees that eat into your profitability. Always check share availability and borrow rate before planning a short trade.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Most beginners are more comfortable going long because it feels natural to make money when things go up. Short selling is an equally valid strategy but it requires a different mental framework. You are profiting from decline and you are working against the long-term upward bias of markets. Use short selling as a tool for specific setups - not as a default because you feel bearish.</p></div>`},
'b4-2':{title:'Range Bound Markets',content:`<p>Not every market is trending. In fact, markets spend roughly 70% of their time in a range — bouncing between a defined support and resistance level without making meaningful progress in either direction.</p><h3>What is a range?</h3><p>A range is a period where price oscillates between a clear ceiling and a clear floor. The highs are roughly equal. The lows are roughly equal. The market is in equilibrium.</p><h3>How to trade a range</h3><p>Buy near the bottom of the range when price shows signs of holding. Sell or short near the top when price shows signs of rejection. Take profits before the opposite side — don't hold for the full range width hoping for more.</p><h3>Range breakouts</h3><p>The most powerful moves come when a range finally resolves — when price breaks above the upper boundary or below the lower boundary with volume. The longer the range, the more powerful the eventual breakout.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Ranges are where patient traders make money and impatient traders lose it. If you can't clearly identify whether you're near support or resistance, you're in the middle of the range. Step away. Come back when price gives you a better location.</p></div>`},
'b6-c':{title:'Continuations',content:`<p>Continuation patterns form during a pause or consolidation within an existing trend and signal that the trend is likely to resume in the same direction after the pause ends. They are the most tradeable patterns in active trading because you have the existing trend working in your favor, a defined consolidation period to measure risk against, and a clear entry trigger on the breakout.</p><h3>The Key Continuation Patterns in This Course</h3><p><strong>Flags and Pennants</strong> - sharp move followed by a tight consolidation, then continuation. The most common and reliable continuation pattern for day traders.</p><p><strong>Triangles (Ascending and Descending)</strong> - price coils between converging trendlines within a trend. The directional bias of the triangle typically aligns with the prevailing trend. An ascending triangle in an uptrend is bullish. A descending triangle in a downtrend is bearish.</p><p><strong>Cups and Handles</strong> - longer-duration continuation pattern where a stock pulls back in a rounded U-shape, recovers to near the prior high, forms a small handle consolidation, then breaks out. More common on daily and weekly charts.</p><h3>What All Continuations Share</h3><p>Volume dries up during the consolidation and expands on the breakout. This is the defining characteristic. Without the volume signature, the pattern is not a high-conviction continuation - it is just price moving sideways. The consolidation must show declining participation before the breakout can be trusted.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Trading continuation patterns is trading with the trend. It is the highest probability approach available to a technical trader. When you combine a strong existing trend with a tight consolidation on declining volume and a breakout on expanding volume, you have three independent signals all pointing in the same direction. That is confluence. That is the trade.</p></div>`},
'b6-f':{title:'Fakeouts & False Breaks',content:`<p>A fakeout is when price appears to break through a key level — a support, resistance, trendline, or pattern boundary — but immediately reverses back in the opposite direction. Fakeouts are among the most frustrating experiences for beginners and among the most profitable setups for experienced traders. The difference between the two is knowing what to look for before the trade, not after.</p><h3>Why Fakeouts Happen</h3><p>Fakeouts are not random. They happen for a mechanical reason. Every significant price level has stop losses clustered just beyond it. Buyers who are long have stops below support. Sellers who are short have stops above resistance. Market makers and institutional players know where these clusters are. A brief push beyond the level triggers those stops, collects the liquidity, and then price reverses when the genuine buying or selling pressure is not there to sustain the move. You have been stop-hunted. Understanding this makes fakeouts less frustrating — they are not accidents, they are mechanics.</p><h3>How to Spot a Fakeout Before It Happens</h3><p><strong>Volume is the primary tell.</strong> A real breakout has volume expanding as price clears the level. A fakeout breaks the level on thin volume — there are not enough participants behind the move to sustain it. If you see price break a key level and the volume bar is smaller than the recent average, treat it as a potential fakeout until proven otherwise.</p><p><strong>The candle close matters more than the wick.</strong> A candle that wicks below support but closes back above it has not broken support — it has tested it and been rejected. Many beginners see a wick below support and panic. The experienced trader sees a rejection and looks for a long entry.</p><p><strong>The speed of the reversal.</strong> Real breakdowns tend to accelerate after the level breaks. Fakeouts reverse quickly — often within one to three candles of the false break. If price breaks a level and immediately snaps back with urgency, you are likely watching a fakeout in real time.</p><h3>The Most Common Fakeout Setups</h3><p><strong>False breakout above resistance</strong> — price pushes above resistance briefly, fails to attract buying volume, and reverses back below. All the traders who bought the breakout are now trapped longs. Their stop losses add selling pressure as price falls, accelerating the move back down. The short entry is on the reversal back below the resistance level.</p><p><strong>False breakdown below support</strong> — price pushes below a key support level, flushes out the stops, then immediately reverses back above. This is the stop hunt. The long entry is on the reclaim of the support level with the stop below the flush low. This is one of the cleanest long setups available when it occurs at a genuinely significant support level.</p><p><strong>Failed pattern breakout</strong> — a flag, pennant, or triangle appears to break out but immediately reverses back into the pattern. The reversal back into the pattern is the tell. Real breakouts do not immediately re-enter the pattern they just broke out of. A failed breakout that reverses and then breaks the opposite boundary is often a higher-velocity move than the original setup would have been.</p><h3>Trading the Fakeout as a Setup</h3><p>The failed breakout short is one of the most reliable setups in trading. A stock breaks above resistance on low volume, attracts buying from breakout traders, then reverses sharply below the resistance level. The entry is on the break back below resistance. The stop is above the fakeout high. Every trapped buyer becomes a forced seller as their stops trigger, adding fuel to the move. The cleaner the original level and the more obvious the breakout appeared, the more traders are trapped and the more powerful the reversal tends to be.</p><h3>Fakeouts vs Stop Loss Hunts</h3><p>A fakeout is the general term for any false break that reverses. A stop loss hunt — covered in the TST Advanced Concepts section — is the institutional version. Stop loss hunts are more deliberate, tend to occur at extremely well-known levels, and are characterized by the speed and precision of the reversal. Both create the same trading opportunity — the key difference is the size and intentionality of the move beyond the level. See the Stop Loss Hunts tab in TST Advanced Concepts for the more advanced version of this concept.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The failed breakout is not a consolation prize for missing the real breakout. It is often a better trade than the real breakout would have been. You have a defined entry, a clear stop above the fakeout high, and a built-in pool of trapped buyers whose stop losses will fuel the move in your direction. Learn to recognize fakeouts and you will stop seeing them as the enemy and start seeing them as opportunity.</p></div>`},
'b6-r':{title:'Reversals',content:`<p>Reversal patterns signal a potential change in the prevailing trend. Where continuation patterns tell you the trend is pausing before resuming, reversal patterns tell you the trend may be ending and the opposite direction may begin. They require more patience to develop and more confirmation before acting on them - but when they work, the moves can be substantial because you are catching a trend change early.</p><h3>The Key Reversal Patterns in This Course</h3><p><strong>Head and Shoulders</strong> - three peaks where the middle peak is the highest, forming at the end of an uptrend. The signal is a break below the neckline connecting the two pullback lows. Inverse head and shoulders is the bullish version appearing at the end of a downtrend.</p><p><strong>Double Tops and Double Bottoms</strong> - price tests a key level twice and fails both times. Double top is bearish - two failed attempts at resistance. Double bottom is bullish - two successful defenses of support. The signal is a break beyond the neckline between the two tests.</p><h3>What All Reversals Share</h3><p>Volume tells the story on reversals. The first move that creates the pattern should be on strong volume. The second attempt that fails should be on declining volume - confirming that momentum is weakening. The break that confirms the reversal should be on expanding volume. Without this volume progression, the reversal pattern carries significantly lower probability.</p><h3>Reversals vs Pullbacks</h3><p>Not every move against the trend is a reversal. Most are pullbacks within the prevailing trend. The difference is structure and volume. A pullback is orderly, on declining volume, and does not break major structural levels. A reversal breaks structural levels, often with high volume, and fails to make new highs or lows in the original direction.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Reversals are harder to trade than continuations. You are betting against the existing momentum which requires evidence that the momentum has genuinely shifted. Wait for the full pattern to develop and the confirmation candle before committing. The trader who enters on the first hint of a reversal is often wrong. The trader who waits for confirmation may miss the first 10% of the move but gets the remaining 90% with evidence behind them.</p></div>`},
'b8-0':{title:'Types of Gaps',content:`<p>A gap is an area on the chart where no trading occurred — price jumped from one level to another without any transactions in between. Gaps represent a significant imbalance between buyers and sellers.</p><h3>Common Gap</h3><p>A small gap with no particular significance. These gaps fill quickly and frequently. Low trading value.</p><h3>Breakaway Gap</h3><p>Occurs at the breakout of a significant pattern. High volume, significant news or catalyst. This type of gap signals the beginning of a new trend. Breakaway gaps rarely fill quickly — the move has conviction behind it.</p><h3>Runaway Gap (Continuation Gap)</h3><p>Occurs in the middle of a strong trend. Signals that momentum is accelerating and institutional participation is increasing.</p><h3>Exhaustion Gap</h3><p>Occurs near the end of a strong trend — often on very high volume after a prolonged move. The gap looks like the trend is accelerating but it's actually the final wave before exhaustion. These gaps fill relatively quickly.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The type of gap matters enormously. A gap up on earnings after a stock that's been building a solid base for months is a breakaway gap — don't fade it. A gap up after a stock has already run 40% in a week on massive volume is an exhaustion gap — don't chase it. Context, context, context.</p></div>`},
'b8-1':{title:'Gap Fills',content:`<p>A gap fill occurs when price returns to the level where the gap began — essentially closing the open space left on the chart.</p><h3>Gaps that fill quickly</h3><ul><li>Common gaps — no real catalyst, fill within a day or two</li><li>Exhaustion gaps — the trend is ending, price reverses to fill the gap</li><li>Gap downs on weak catalysts — buyers step in quickly</li></ul><h3>Gaps that take time or don't fill</h3><ul><li>Breakaway gaps on strong catalysts — strong earnings beat, major contract, FDA approval</li><li>Runaway gaps in strong sector trends — the gap is a symptom of something larger</li></ul><div class="callout"><div class="callout-label">TST Edge</div><p>Stop trying to fade every gap. A stock that gaps up 15% on a massive earnings beat is not necessarily going to fill that gap today, this week, or this month. Before you fade any gap ask yourself — is this catalyst strong enough to justify the gap? If yes, respect the move. If no, the fill trade has merit.</p></div>`},
'b8-2':{title:'Trading Gaps',content:`<p>Gaps create some of the most consistent and high probability trade setups available.</p><h3>Gap and Go</h3><p>A stock gaps up significantly on news or earnings. The setup is to buy the early consolidation after the initial gap move with a tight stop below the consolidation low. Target is measured by the pre-market high or prior resistance levels. Most applicable to: Strong earnings beats, major catalysts, stocks with high relative volume.</p><h3>Gap Fill Trade</h3><p>Buying a gap down or shorting a gap up expecting price to return to the prior close. Best applied to small gaps under 3% on weak or no catalysts.</p><h3>Gap as Support/Resistance</h3><p>After a gap up, the bottom of the gap frequently acts as support on any pullback. After a gap down, the top of the gap acts as resistance on any bounce. These levels are clean, obvious, and widely watched.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The gap and go requires discipline — you must wait for the early consolidation. Buying immediately at the open of a gapping stock without any consolidation is chasing, not trading.</p></div>`},
'gs-0':{title:'How to Read a Chart',content:`<p>Before you learn a single pattern or indicator, you need to know what you are looking at when you open a chart. This is the foundation everything else builds on.</p><div style="margin:20px 0;border-radius:8px;overflow:hidden;border:1px solid #1e2820;"><svg width="100%" viewBox="0 0 680 620" role="img"><title>Annotated candlestick chart</title><desc>A fully labeled candlestick chart</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="620" fill="#0a0f0a"/><rect x="110" y="30" width="420" height="300" fill="#111712" stroke="#1e2820" stroke-width="0.5"/><rect x="110" y="340" width="420" height="80" fill="#0d140d" stroke="#1e2820" stroke-width="0.5"/><line x1="110" y1="68" x2="530" y2="68" stroke="#1a221a" stroke-width="0.5"/><line x1="110" y1="106" x2="530" y2="106" stroke="#1a221a" stroke-width="0.5"/><line x1="110" y1="144" x2="530" y2="144" stroke="#1a221a" stroke-width="0.5"/><line x1="110" y1="182" x2="530" y2="182" stroke="#1a221a" stroke-width="0.5"/><line x1="110" y1="220" x2="530" y2="220" stroke="#1a221a" stroke-width="0.5"/><line x1="110" y1="258" x2="530" y2="258" stroke="#1a221a" stroke-width="0.5"/><line x1="110" y1="296" x2="530" y2="296" stroke="#1a221a" stroke-width="0.5"/><text x="105" y="71" font-size="11" text-anchor="end" fill="#6b8f6b" font-family="monospace">$185</text><text x="105" y="109" font-size="11" text-anchor="end" fill="#6b8f6b" font-family="monospace">$180</text><text x="105" y="147" font-size="11" text-anchor="end" fill="#6b8f6b" font-family="monospace">$175</text><text x="105" y="185" font-size="11" text-anchor="end" fill="#6b8f6b" font-family="monospace">$170</text><text x="105" y="223" font-size="11" text-anchor="end" fill="#6b8f6b" font-family="mon middle" fill="#fbbf24" font-family="sans-serif">Wick</text><line x1="594" y1="147" x2="586" y2="147" stroke="#fbbf24" stroke-width="0.5"/><line x1="586" y1="147" x2="586" y2="161" stroke="#fbbf24" stroke-width="0.5"/><line x1="586" y1="161" x2="594" y2="161" stroke="#fbbf24" stroke-width="0.5"/><text x="575" y="156" font-size="11" text-anchor="middle" fill="#fbbf24" font-family="sans-serif">Wick</text><rect x="554" y="174" width="110" height="36" fill="#0a1a0a" rx="4" stroke="#22c55e" stroke-width="0.5"/><text x="609" y="188" font-size="11" text-anchor="middle" fill="#22c55e" font-family="sans-serif">Green = bullish</text><text x="609" y="203" font-size="11" text-anchor="middle" fill="#6b8f6b" font-family="sans-serif">Close &gt; open</text><rect x="548" y="268" width="122" height="70" fill="#0d1a0d" rx="6" stroke="#2a3a2a" stroke-width="0.5"/><text x="609" y="283" font-size="11" text-anchor="middle" fill="#6b8f6b" font-family="sans-serif">Red = bearish</text><line x1="590" y1="294" x2="590" y2="326" stroke="#ef4444" stroke-width="2"/><rect x="582" y="297" width="16" height="20" fill="#ef4444" rx="2"/><text x="614" y="304" font-size="11" fill="#ef4444" font-family="sans-serif">Open</text><text x="614" y="322" font-size="11" fill="#ef4444" font-family="sans-serif">Close</text><text x="609" y="333" font-size="11" text-anchor="middle" fill="#6b8f6b" font-family="sans-serif">Close &lt; open</text><text x="22" y="185" font-size="11" text-anchor="middle" fill="#c8d4c8" font-family="sans-serif" transform="rotate(-90 22 185)">Y-axis — price</text><line x1="32" y1="30" x2="32" y2="330" stroke="#c8d4c8" stroke-width="0.5" marker-end="url(#a)"/><text x="320" y="510" font-size="11" text-anchor="middle" fill="#c8d4c8" font-family="sans-serif">X-axis — time (each candle = one time period)</text><line x1="110" y1="498" x2="530" y2="498" stroke="#c8d4c8" stroke-width="0.5" marker-end="url(#a)"/><rect x="548" y="358" width="122" height="50" fill="#0d1a0d" rx="4" stroke="#2a3a2a" stroke-width="0.5"/><text x="609" y="374" font-size="11" text-anchor="middle" fill="#c8d4c8" font-family="sans-serif">Volume panel</text><text x="609" y="388" font-size="11" text-anchor="middle" fill="#6b8f6b" font-family="sans-serif">Taller = more shares</text><text x="609" y="400" font-size="11" text-anchor="middle" fill="#6b8f6b" font-family="sans-serif">traded that period</text><line x1="530" y1="375" x2="548" y2="378" stroke="#c8d4c8" stroke-width="0.5" marker-end="url(#a)"/><rect x="548" y="418" width="122" height="40" fill="#0d1a0d" rx="4" stroke="#2a3a2a" stroke-width="0.5"/><text x="609" y="433" font-size="11" text-anchor="middle" fill="#c8d4c8" font-family="sans-serif">Price scale</text><text x="609" y="448" font-size="11" text-anchor="middle" fill="#6b8f6b" font-family="sans-serif">Right side — exact price</text><rect x="130" y="520" width="330" height="32" fill="#0d1a0d" rx="4" stroke="#2a3a2a" stroke-width="0.5"/><text x="295" y="533" font-size="11" text-anchor="middle" fill="#c8d4c8" font-family="sans-serif">Timeframe</text><text x="295" y="546" font-size="11" text-anchor="middle" fill="#6b8f6b" font-family="sans-serif">1-min, 5-min, daily — same stock looks different on each</text><text x="320" y="18" font-size="13" font-weight="500" text-anchor="middle" fill="#e8f0e8" font-family="sans-serif">How to read a candlestick chart</text></svg></div><h3>The Axes</h3><p>The horizontal axis (X-axis) represents time. Moving left to right on a chart means moving forward in time. The vertical axis (Y-axis) represents price. Higher on the chart means a higher price. Lower on the chart means a lower price.</p><h3>The Candlesticks</h3><p>Each candle represents a specific time period - one minute, five minutes, one day, depending on your chart settings. A green candle means price closed higher than it opened during that period. A red candle means price closed lower than it opened. The body of the candle is the range between the open and close. The thin lines extending above and below are called wicks or shadows and represent the highest and lowest prices reached during that period.</p><h3>The Volume Panel</h3><p>At the bottom of most charts you will see vertical bars. This is the volume panel. Each bar shows how many shares traded during that time period. Taller bars mean more shares traded. Green volume bars correspond to green candles - more buyers. Red volume bars correspond to red candles - more sellers.</p><h3>The Price Scale</h3><p>On the right side of the chart you will see a price scale. This tells you exactly what price level each point on the chart represents. When you hover your cursor over a candle, your platform will typically show you the exact open, high, low, and close price for that candle.</p><h3>Timeframes</h3><p>You can change how much time each candle represents. A 1-minute chart shows one candle per minute. A daily chart shows one candle per day. The same stock will look completely different on different timeframes - this is not a mistake, it is information.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Spend one full week just looking at charts before you do anything else. No trading, no analysis - just observation. Watch how candles form, how volume behaves, how price moves. You will learn more from that week of watching than from reading any book.</p></div>`},
'n-gapgo':{title:'Gap and Go Strategy',content:`<p>The Gap and Go is one of the most consistent and cleanest intraday setups available. A stock gaps up significantly at the open on a strong catalyst, holds the gap level in the first few minutes, and then continues higher with momentum. You are not fading the gap - you are trading the continuation of the move that the pre-market already started.</p><h3>The Setup Requirements</h3><p>The stock must have a clear catalyst - news, earnings beat, FDA approval, analyst upgrade. Not all gaps are equal. A stock that gaps up 5% on no news is suspicious and likely to fill. A stock that gaps up 8% on a strong earnings beat with raised guidance has a reason to continue. The catalyst quality is the first filter. Second, the stock must hold above the gap level in the first 5-10 minutes of trading. If it immediately starts filling the gap after the open, the setup is failing. Third, volume must be significantly above average - at least 2-3x normal volume in the first 15 minutes.</p><h3>Entry, Stop, Target</h3><p>Entry is after the stock demonstrates it is holding - typically on the first pullback or consolidation above the opening price or above the pre-market high. Not on the very first candle. Stop goes below the low of the opening 5-minute candle or below the pre-market support level, whichever is more significant. Target is the next major resistance level or a measured move based on the size of the overnight gap.</p><h3>Gap and Go vs Gap and Fade</h3><p>Not every gap continues. A gap that forms on weak volume pre-market, on questionable news, or in a stock with no prior trend, will often reverse and fill the gap. The gap and go setup specifically filters for gaps with genuine institutional buying behind them. The volume is your truth detector - if volume is not showing up to support the move in the first 15 minutes, the gap is likely to fade.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The best Gap and Go setups are obvious before the market opens. If you are not excited about a gap during your pre-market routine, do not force the trade at the open. The setups that feel uncertain in pre-market are the ones that fade. The ones that feel inevitable because the catalyst is so strong - those are your Gap and Go candidates.</p></div>`},
'n-multi':{title:'Multi-Timeframe Analysis',content:`<p>Multi-timeframe analysis is the practice of examining the same stock on multiple timeframes before making a trading decision. No single timeframe tells the complete story. Using multiple timeframes together gives you context, direction, and precise entry points simultaneously.</p><h3>The Top-Down Approach</h3><p>Always start with the higher timeframe and work down to the lower timeframe. The higher timeframe establishes the trend and the key levels. The lower timeframe provides the entry trigger. This order is non-negotiable. A setup on a 5-minute chart that conflicts with the direction on the daily chart is a low-probability trade. A setup that aligns with the daily trend is a high-probability trade.</p><h3>The Three-Timeframe System</h3><p>A common and effective approach uses three timeframes simultaneously. The daily chart tells you the macro trend and the important support and resistance levels. The 15-minute chart shows you the intraday structure and whether the morning trend is intact. The 5-minute chart shows you the specific setup and the entry trigger. Each timeframe has a specific job.</p><h3>What Alignment Means</h3><p>Timeframe alignment means all three timeframes are pointing in the same direction. The daily is in an uptrend. The 15-minute shows a healthy pullback within that uptrend. The 5-minute shows a base forming at support with volume drying up. That is three-timeframe alignment on a long setup - one of the highest probability entry conditions available.</p><h3>Conflict Between Timeframes</h3><p>When timeframes conflict - for example, the daily is in an uptrend but the 15-minute is showing a significant downtrend with lower highs and lower lows - wait for resolution before trading. Entering in a timeframe conflict situation means you are fighting one timeframe no matter which direction you choose.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The traders who consistently take high-probability entries are the ones who check multiple timeframes before every trade. The traders who are frequently surprised by reversals are the ones who traded a setup on one timeframe without checking if the higher timeframes agreed. Make multi-timeframe analysis automatic - check all three before every entry.</p></div>`},
'n-paus':{title:'The 3-Second Rule',content:`<p>The three-second rule is simple: before clicking the buy or sell button on any trade, pause for three seconds and ask yourself one question. Am I entering because this is my setup or because I am reacting to something I see moving on my screen?</p><h3>Why Three Seconds</h3><p>Three seconds is enough time for your rational brain to override your emotional brain. In the middle of a fast-moving market, the emotional urge to act is powerful. Price is moving, you feel like you are missing something, you want in. That urgency is almost never justified and very often leads to trades that are outside your system.</p><h3>The Question to Ask</h3><p>Is this my setup? Specifically: is the trigger I am about to act on one of the 2-3 defined setups in my playbook? Does it have my required confirmation signals present? Is the risk/reward acceptable at this exact moment? If you cannot answer yes to all three in three seconds, do not take the trade.</p><h3>What the Pause Prevents</h3><p>The three-second pause prevents: FOMO entries on stocks you were not watching that suddenly appear in your feed, revenge trades after a loss, oversized entries because a stock is moving fast, and entries on setups that look similar to yours but are not actually yours. Most of the worst trades in any trader's history would have been prevented by three seconds of deliberate thought.</p><h3>Building the Habit</h3><p>Start practicing this in paper trading. Every single entry, pause three seconds and answer the question out loud. Yes, actually say it out loud. The verbalization forces your brain to engage with the question rather than bypassing it. After 30 days of deliberate practice, the pause becomes automatic.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The traders who make the most mistakes are the fastest. Speed in execution is valuable once you know exactly what you are doing. Speed in decision-making before you have defined setups and clear signals is just impulsiveness with a trading platform.</p></div>`},
'n-vwapst':{title:'VWAP Strategies',content:`<p>VWAP - Volume Weighted Average Price - is more than just an indicator. It is the single most important intraday reference level used by institutional traders. Understanding how to actually trade VWAP rather than just display it on your chart is what separates traders who use it effectively from those who just have it there because someone told them to.</p><h3>VWAP as Directional Bias</h3><p>The simplest and most powerful use of VWAP is as a directional filter. Price above VWAP means buyers are in control on an average basis for the day. Price below VWAP means sellers are in control. Use this as your first bias check every morning. If SPY is trading above VWAP, favor long setups on individual stocks. If SPY is below VWAP, be more cautious on longs and look for short setups.</p><h3>The VWAP Reclaim Entry</h3><p>One of the cleanest intraday setups. A stock sells off below VWAP in the morning, then buyers step in and push it back above. The reclaim of VWAP on expanding volume is a long entry. Stop goes below the VWAP level or below the low of the reclaim candle. Target is the pre-market high or the next resistance level above. This works because institutional algorithms are programmed to buy when price is below VWAP - when price reclaims it, you are going with the institutional flow.</p><h3>The VWAP Rejection Short</h3><p>The mirror image. A stock is below VWAP and rallies up to test it from below. If it fails to reclaim VWAP and gets rejected, that rejection is a short entry. Institutions selling at VWAP are defending the level. Stop above VWAP. Target the low of the day or the next support below.</p><h3>VWAP as a Target</h3><p>If you are long from a morning dip and VWAP is above you, VWAP becomes your first target. Many intraday moves from oversold levels target a return to VWAP before finding sellers again. Scale out at VWAP and let the remainder run if the stock shows strength there.</p><div class="callout"><div class="callout-label">TST Edge</div><p>VWAP resets every day at the open. The first hour of trading establishes where VWAP sits relative to price for the rest of the session. A stock that opens above VWAP and holds it all morning is showing institutional strength. A stock that cannot reclaim VWAP after the open has institutional sellers overhead. That distinction should shape your entire approach to that stock for the day.</p></div>`},
'n10':{title:'Building a Watchlist & Daily Plan',content:`<p>Take your scanner results and cut them down to 2-3 names maximum. For each one, mark the key levels on the chart - prior day high and low, pre-market high and low, major support and resistance. Those are your decision points for the day. For each stock on your watchlist, answer three questions before the market opens: What is my bias - long or short? What price triggers me to take the trade? Where am I wrong and where am I taking profits? If you cannot answer all three, the stock does not make the watchlist.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The best trade of the day is almost always on your watchlist before the market opens. Reactive trading - jumping into something you just noticed - is where most of your losses will come from. Do the work before the open and trade your plan, not the moment.</p></div>`},
'n2':{title:'Timeframes',content:`<p>The timeframe you trade on determines everything - your entry, your stop, your target, and how long you hold. The same stock can look completely different on a 1-minute chart versus a daily chart. Most beginners make the mistake of only looking at one timeframe and missing the bigger picture entirely.</p><h3>1-Minute and 2-Minute</h3><p>Used by day traders for precise entries and exits. Too noisy for anything other than execution. If you are making decisions based only on a 1-minute chart you are trading blind.</p><h3>5-Minute</h3><p>The most common day trading timeframe. Balances detail with clarity. Where most intraday setups are identified and traded.</p><h3>15-Minute</h3><p>Used to see the broader intraday trend. A stock may look like it is setting up on the 5-minute but the 15-minute shows it is still in a downtrend. Always check.</p><h3>1-Hour</h3><p>The bridge between day trading and swing trading. The 1-hour chart smooths out the intraday noise and shows you the bigger picture of where a stock is headed. Key support and resistance levels on the 1-hour chart carry more weight than those on lower timeframes. If you are swing trading the 1-hour is often your primary entry timeframe after getting direction from the daily.</p><h3>Daily</h3><p>The most important chart for swing traders. Shows the full picture of a stock's trend, key levels, and pattern development over weeks and months.</p><h3>Weekly</h3><p>Used by long term investors and position traders. Filters out all the noise. A stock that looks choppy on a daily chart often shows a clean uptrend on a weekly.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Always start with the higher timeframe to get your bias, then drop down to a lower timeframe for your entry. Daily chart tells you the direction. 5-minute tells you when to pull the trigger. Never trade against the higher timeframe trend.</p></div>`},
'n5':{title:'Scanning for Stocks',content:`<p>Every morning before the open, run a pre-market scanner filtering for stocks up or down more than 2% pre-market on above average volume. This gives you your universe for the day. You are not trading all of them - you are identifying which ones deserve a closer look. Set your filters for minimum volume, price range, and percentage move. The scanner does not find your trade - it finds your candidates.</p>`},
'n7-4':{title:'Confirmation',content:`<p>Confirmation is the difference between a setup and a trade. A setup is what you see forming. Confirmation is the signal that tells you the market has validated your thesis and it is time to act. Without confirmation you are guessing. With confirmation you are executing a plan with evidence behind it.</p><h3>What Counts as Confirmation When Buying</h3><p>Confirmation when entering a long position means the market has given you a signal that buyers are in control at the level you are watching. This is not about perfect timing - it is about evidence. Examples of confirmation: a strong green candle closing above a resistance level on above average volume, price reclaiming a key moving average after a pullback, a breakout candle that closes in the upper half of its range with expanding volume, or a doji or hammer at support followed immediately by a strong reversal candle. One of these alone is sometimes enough. Two or more stacked together is a high confidence entry signal.</p><h3>What Is Not Confirmation</h3><p>Price touching a level is not confirmation. Price approaching a level is not confirmation. A stock being in a general uptrend is not confirmation of a specific entry. Confirmation requires action - a candle closing, volume expanding, a level being reclaimed. Without a clear signal from price and volume together, you are entering on anticipation rather than evidence. Anticipation loses. Evidence wins.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The hardest part of waiting for confirmation is that you sometimes miss the first move. The stock breaks out and you waited for the candle to close and now you are chasing. Accept that. Missing the first 1-2% of a move in exchange for evidence that the move is real is a trade you should make every time. The entries you take without confirmation will teach you why this matters.</p></div>`},
'n8-3':{title:'Confirmation',content:`<p>Just as confirmation matters when entering a position, it matters equally when exiting. Premature exits cost you the bulk of your winners. Holding too long after confirmation of a reversal turns winners into losers. Confirmation on the exit side is about reading the signs that the move is ending or reversing before you have given back significant profits.</p><h3>Confirmation to Exit a Long Position</h3><p>You are in a winning long trade. What tells you it is time to sell? Look for: a large red candle closing below a key support level on high volume, your trailing stop being hit, price reaching a pre-identified target level like a prior high or resistance zone, RSI divergence showing momentum fading, or a climax volume candle where the stock makes a new high but closes well below the high. Any of these alone can justify an exit. The best exits come when multiple signals appear simultaneously.</p><h3>The Partial Exit Strategy</h3><p>Confirmation does not have to mean exit everything at once. When you see the first signs of a potential reversal but the trend is still intact, sell a portion of your position. This locks in some gains while leaving exposure if the trend continues. If the reversal signals increase in strength, sell more. This approach prevents the emotional mistake of either holding too long or exiting too early.</p><h3>What Confirmation Is Not</h3><p>Fear is not confirmation. A stock pulling back 1% intraday is not confirmation of a reversal. Your stop being close is not confirmation to exit. Base your exits on what the chart is telling you, not what your emotions are telling you.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Most traders have good entry rules and terrible exit rules. They exit when they feel uncomfortable rather than when the chart tells them to. Build your exit confirmation criteria the same way you build your entry criteria - specific, objective, based on price and volume action rather than emotion.</p></div>`},
'n8-4':{title:'How to Hold Runners',content:`<p>The biggest missed opportunity in trading is not the trades you do not take - it is the winning trades you exit too early. Learning to hold a runner - a trade that is working significantly in your favor - is one of the most valuable and most difficult skills to develop. Most traders have a systematic bias toward early exits because small wins feel safe and giving back open profits feels like losing.</p><h3>The Psychology of Holding</h3><p>When a trade is up 5% and moving in your favor, every instinct tells you to lock it in. The market could reverse at any moment. You already have a profit. Take it. This instinct is understandable but it is also why most traders consistently underperform their potential. A trader who consistently exits winners at 5% when the setup has 20% potential is leaving 75% of their edge on the table.</p><h3>The Mechanical Approach</h3><p>The solution to the psychological problem is a mechanical exit system. Decide before you enter how you will exit a winner. Options: a trailing stop that follows price up by a fixed amount, a time-based rule where you hold until a specific level is reached, or a structure-based rule where you hold until price breaks below a key moving average or support level. The specific method matters less than the consistency of following it.</p><h3>Scaling Out vs Full Exit</h3><p>One of the most practical approaches to holding runners is scaling out. Sell half your position at your first target. Move your stop to break-even on the remainder. Now you have locked in a guaranteed profit on half the position and you are riding the rest with zero risk. This removes the psychological pressure of holding a full position through normal volatility while still capturing the larger move if it continues.</p><h3>What Justifies a Full Hold</h3><p>The cases where holding your full position the longest makes sense: the trend is extremely strong with no signs of exhaustion, volume is expanding on each leg up, the broader market is supporting the move, and there are no significant resistance levels nearby. When all of these align, aggressive holding is justified. When any of them are absent, scaling out is the smarter approach.</p><div class="callout"><div class="callout-label">TST Edge</div><p>Your biggest winning trades will feel uncomfortable to hold. When a stock is up 15% and you are sitting on a significant open profit, the fear of giving it back becomes intense. That discomfort is normal. The traders who learn to manage that discomfort through mechanical rules rather than emotional exits are the ones who turn good trading into exceptional trading.</p></div>`},
'sc-l2':{title:'Reading L2 on Thin Stocks',content:`<p>Reading Level 2 on a small cap stock is fundamentally different from reading it on a large cap. The order book is thinner, individual orders have more impact, and the signals require different interpretation. Mastering L2 on small caps is one of the most valuable skills for anyone trading in this space.</p><h3>The Thin Order Book</h3><p>On a liquid large cap like AAPL, the Level 2 shows thousands of shares on both the bid and ask at multiple price levels. On a small cap with low float, you might see only a few hundred or a few thousand shares on each level. This means individual participants have more influence on price. A single buyer stepping in aggressively can move the price significantly. A single large seller on the ask can cap a move for extended periods.</p><h3>The Wall</h3><p>A large block of shares on the ask at a specific price is called a wall. On a small cap, a seller with 50,000 shares on the ask at $10.00 is a significant wall. The stock will struggle to push through that level until the wall is absorbed or the seller moves their order. Watch how the wall behaves - if it refreshes every time it gets hit, it is a genuine seller. If it disappears when price approaches, it was a fake wall designed to slow down buyers.</p><h3>Ax Recognition</h3><p>On small caps, certain market makers dominate the order flow. The market maker that is consistently on both sides of the market and moving the most shares is called the ax. Identifying the ax and watching which side they favor gives you important information about the immediate direction.</p><div class="callout"><div class="callout-label">TST Edge</div><p>On small caps, the tape and L2 together tell a story that the chart alone cannot. A chart might show consolidation but the tape might show a market maker aggressively refreshing the bid - that is accumulation that the chart has not yet reflected. Learning to read both simultaneously is what separates experienced small cap traders from beginners.</p></div>`},
'sc-para':{title:'The Parabolic Move',content:`<p>A parabolic move is when a stock goes nearly vertical - making new highs every few minutes with multiple trading halts along the way. These are the most exciting and most dangerous situations in small cap trading. The gains available in a parabolic move are enormous. The losses available if you are on the wrong side or wrong timing are equally enormous.</p><h3>What Creates a Parabolic Move</h3><p>A perfect storm of conditions. Extremely low float - often under 2 million shares. A major unexpected catalyst. High short interest from traders who shorted it earlier. Retail momentum buyers piling in through social media. Each of these factors amplifies the others. Shorts covering creates buying. Buying creates new highs. New highs attract more buyers. More buyers force more short covering. The loop continues until it breaks.</p><h3>How to Trade a Parabolic Move</h3><p>There are only two ways to trade a parabolic correctly - you are either in it early from the pre-market or opening range, or you are waiting for the fade after it exhausts. There is no correct way to chase a parabolic move in progress. Entering a stock that is already up 200% because it is going up is one of the highest-risk actions in trading. You are buying from the people who bought at 50% gains and are now selling to you.</p><h3>Halts in a Parabolic</h3><p>A stock going parabolic will halt repeatedly as it triggers the LULD circuit breakers. Each halt is a 5-minute pause. When trading resumes the stock either continues higher - if there are still more buyers than sellers - or reverses violently as everyone tries to sell at once. You cannot place orders during a halt. If you are long and the stock halts, you wait. If it resumes lower you may gap through your stop with no ability to exit at your intended price.</p><h3>The Blow-Off Top</h3><p>Every parabolic move ends the same way. A climax candle - a massive green candle, often with a long upper wick, on the highest volume of the entire move. This is the blow-off top. The final buyers are in. The sellers are overwhelming the buyers. The stock reverses violently and begins its fade. The blow-off top is identifiable in hindsight. In real time it looks exactly like every other candle in the move until it does not.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The most money made in parabolic moves is made by the people who were in before the move became parabolic. The most money lost is lost by the people who chased in during the vertical phase. If you missed the early entry, wait for the fade. There will always be another parabolic. There may not be another chance to recover from chasing one at the top.</p></div>`},
