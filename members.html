'16-02':{title:'Your Setups',content:`<h3>Your Playbook — The 5-8 Setups You Will Trade</h3>
<p>A trading playbook is the document that defines your entire trading operation. It is the distillation of everything you've learned about the market, yourself, and the specific setups where you have demonstrable edge — compressed into a precise, actionable reference that governs every trade you take. Without a playbook, you're improvising every day. With a playbook, you're executing a defined system.</p>
<p>The 5-8 number is not arbitrary. Fewer than 5 setups and you won't have enough opportunities to stay active in different market conditions. More than 8 and you can't develop the deep familiarity with each setup that produces real edge — you're spreading your attention too thin to execute any of them at a high level. The goal is a small number of setups that you know intimately, that have been tested across many occurrences, and that you execute with mechanical consistency.</p>

<h3>What Each Playbook Entry Contains</h3>
<p>For each setup in your playbook, document the following completely:</p>
<p><strong>Setup name:</strong> A short, memorable name that you'll use to quickly identify the setup when you see it forming. "20 EMA Bounce," "Opening Range Breakout," "Gap and Hold," "Earnings Gap Continuation."</p>
<p><strong>Market conditions where it works:</strong> Every setup has a context where it performs well and conditions where it fails. "This setup works best in trending markets with SPY above its 20-day MA and RVOL above 1.5 on the sector." "This setup fails in low-volume choppy conditions and should not be traded when VIX is below 15."</p>
<p><strong>Required entry conditions (the setup):</strong> The specific pre-conditions that must be true for the setup to be valid. These should be precise enough that any other trader could read your criteria and identify the same setups you identify. Vague criteria ("the stock looks good") are not playbook criteria.</p>
<p><strong>Entry trigger (the signal):</strong> The specific event that triggers your entry once the setup conditions are met. "Enter on a limit order as price crosses above the 5-minute opening range high with volume on the trigger candle above 2x the average 5-minute volume." Specific, unambiguous.</p>
<p><strong>Stop placement:</strong> Where does your stop go and exactly why. "Stop is placed $0.10 below the low of the entry trigger candle" or "Stop is placed below the 20 EMA on a daily closing basis."</p>
<p><strong>Target levels:</strong> First, second, and potentially third target with the specific criteria for each. "First target: next resistance level. Second target: measured move from pattern height."</p>
<p><strong>Position sizing rules for this setup:</strong> Some setups warrant larger size (higher historical win rate, better R:R) and others warrant smaller size (more variable outcomes, wider stops). Document the size allocation for each setup.</p>
<p><strong>Historical statistics:</strong> Win rate, average win, average loss, profit factor across your documented occurrences of this setup. This is the validation that the setup belongs in your playbook.</p>

<h3>Building the Playbook Over Time</h3>
<p>A playbook is built through experience and data, not through reading about other traders' setups. Start with 2-3 setups you're already trading. Document them precisely. Track every occurrence in your journal. After 50 occurrences, calculate the statistics. If the statistics show positive expectancy — add the setup to your playbook officially. If they don't — either refine the criteria and retest, or abandon the setup.</p>
<p>Add new setups only when you've developed a hypothesis through market observation, tested it in paper trading, and validated it in live trading with small size. The playbook grows deliberately, not through enthusiasm about a new setup you just discovered.</p>

<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">Your playbook is a living document that reflects your accumulated market knowledge. Review it quarterly and ask for each setup: does the historical data still support including this? Has market structure changed in ways that affect this setup's reliability? Are there conditions I've identified that improve the quality of this setup that I haven't yet written into the criteria? A playbook that's six months old without any updates is probably not being reviewed honestly.</div></div>`},
'16-03':{title:'Risk/Reward Framework',content:`<h3>Risk/Reward Framework — Minimum Acceptable Ratio</h3>
<p>Every trade you take should have a defined risk/reward ratio calculated before entry. This is not an optional step — it is the fundamental evaluation of whether a trade is worth taking at all. A trade might have a valid setup and a clear entry signal, but if the distance to the stop is large relative to the potential gain at the target, the math doesn't justify the trade even if the direction is correct.</p>

<h3>Understanding Risk/Reward Ratios</h3>
<p>The risk/reward ratio expresses how much you stand to gain for every dollar you risk. A 2:1 risk/reward means for every $1 you risk (the distance from entry to stop), you're targeting $2 in profit (the distance from entry to target).</p>
<p>Example: You want to buy a stock at $50, place your stop at $48 (risking $2 per share), and your target is $56 (potential gain of $6 per share). Your risk/reward ratio is $6/$2 = 3:1. For every $2 you risk, you stand to make $6.</p>
<p>At a 3:1 risk/reward, you only need a 25% win rate to break even (each win of $6 covers three losses of $2 each). At a 2:1 ratio, you need a 33% win rate to break even. At 1:1, you need 50%. These breakeven win rates tell you the minimum performance your strategy needs to achieve for the risk/reward to produce profitability.</p>

<h3>Setting Your Minimum Acceptable Ratio</h3>
<p>Most professional traders require a minimum of 2:1 risk/reward before taking any trade. Some require 3:1 or higher. The minimum you set should be based on your actual historical win rate:</p>
<p>If your documented win rate is 45%, you need a risk/reward of at least 1.22:1 to break even mathematically. But for meaningful profitability (not just breakeven), you'd want 2:1 or better. If your win rate is 55%, you could be profitable at 1:1, though most traders require better than that to account for commissions, slippage, and variance.</p>
<p>Calculate your breakeven risk/reward using your actual win rate: Minimum R:R = (1 - Win Rate) / Win Rate. At 40% win rate: (0.60/0.40) = 1.5:1 minimum to break even. Set your actual minimum somewhat above this to build in margin for real-world costs.</p>

<h3>When the Math Doesn't Work</h3>
<p>A setup that doesn't meet your minimum risk/reward should not be traded — even if the direction looks compelling, even if the setup pattern is perfect. The risk/reward is a mathematical constraint on trade selection, not a guideline. When the stop is too wide relative to the realistic target, or when the target is at a level that makes the reward insufficient relative to the stop distance, the trade doesn't pass the filter.</p>
<p>The most common situation where this comes up: you see a setup you like, but you're late to it — the stock has already moved significantly from the ideal entry, the stop is now further away, and the target hasn't changed. The risk/reward that was 3:1 at the ideal entry is now 1:1. Don't take it. Wait for a better entry or a different setup.</p>

<h3>Asymmetric Payoffs: The Goal</h3>
<p>The goal of your risk/reward framework is to create asymmetric payoffs — situations where you're wrong and lose a small amount, or right and gain a much larger amount. Over many trades, this asymmetry compounds powerfully: even if you're right only 40% of the time, a consistent 3:1 risk/reward produces positive expectancy of +$0.80 per dollar risked (0.40 × $3 - 0.60 × $1).</p>
<p>Asymmetric payoffs also provide psychological benefits: when you know each win is significantly larger than each loss, losing trades don't feel catastrophic. The occasional winning trade more than covers multiple losses, making the psychological experience of trading more sustainable.</p>

<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">Before entering any trade, write down three numbers: entry price, stop price, target price, and the resulting risk/reward ratio. If you can't calculate a minimum 2:1 risk/reward at your intended entry and stop, don't take the trade. This 30-second calculation, done consistently before every trade, will eliminate a significant portion of your worst trades — the ones taken impulsively when the setup looks interesting but the math doesn't support it.</div></div>`},
'16-04':{title:'Days to Trade & Not Trade',content:`<h3>Trading Days vs Non-Trading Days</h3>
<p>Professional traders don't trade every day the market is open. This is one of the most important mindset shifts for developing traders to make: trading is not a job where you clock in every morning and must produce output for eight hours. Trading is a job where you work when conditions favor your edge and rest when they don't. Forcing activity on days when the market isn't providing your setups is one of the primary sources of unnecessary losses.</p>

<h3>Defining Your Trading Calendar</h3>
<p>A trading calendar defines in advance which types of days you will trade and which you will observe only. This is not about predicting specific market moves — it's about identifying structural conditions that favor or disfavor your particular setups.</p>
<p><strong>Days most traders should consider sitting out:</strong></p>
<ul>
<li><strong>Days before and after major holidays:</strong> Volume dries up dramatically in the days surrounding Thanksgiving, Christmas, New Year's, and the 4th of July. Low-volume environments produce choppy, untrustworthy price action with false signals and poor follow-through. Not worth trading.</li>
<li><strong>Major FOMC meeting days (during the decision window):</strong> Markets often move erratically immediately before and after Fed rate decisions. Unless you have a specific event-driven strategy, the unpredictability around these windows makes standard technical setups unreliable.</li>
<li><strong>Options expiration Fridays (particularly monthly and quarterly):</strong> Pin risk and expiration-related flows create unusual price behavior that can make normal setups behave abnormally. More experienced traders can exploit these dynamics; beginners should treat them cautiously.</li>
<li><strong>Days when you're not mentally sharp:</strong> Sick, sleep-deprived, emotionally disrupted, distracted by personal issues. Trading requires full cognitive capacity. Half-focus trading is negative-EV trading.</li>
<li><strong>After your daily loss limit has been hit:</strong> This is a rule, not a preference. When you've hit your daily maximum loss, the session is over regardless of what setups appear.</li>
</ul>

<h3>Pre-Market Conditions That Signal a Non-Trading Day</h3>
<p>Some mornings, the pre-market conditions tell you before the open that this is likely a low-quality day for your setups. Red flags that warrant extreme selectivity or sitting out:</p>
<ul>
<li>Pre-market volume is significantly below average with no major catalyst</li>
<li>SPY and QQQ are both down significantly in pre-market with no clear fundamental catalyst — suggests risk-off environment where setups may not follow through</li>
<li>Your watchlist has no stocks showing the kind of relative strength or catalyst that your setups require</li>
<li>VIX is extremely low (below 12) — suggests complacency and low volatility that tends to produce choppy, low-momentum trading sessions that hurt momentum and breakout strategies</li>
</ul>

<h3>The Discipline of Doing Nothing</h3>
<p>The hardest trading decision is often not what to buy or sell — it's the decision to do nothing. Markets reward patience. The best setups appear with a frequency that varies — sometimes multiple per day, sometimes not for a week. If you fill the days with no setups by taking suboptimal trades, you're converting capital and mental energy into losses that didn't have to happen.</p>
<p>Professional traders describe sitting out unproductive days not as missed opportunity but as capital preservation. Every day you don't lose money in a low-quality environment is a day you have full capital available for the next high-quality environment. Protecting your capital on low-probability days is as important as deploying it on high-probability ones.</p>

<div class="callout"><div class="callout-label">TST Edge</div><div class="callout-text">Keep a simple log of your 'sit-out' days — the days you observed the market and chose not to trade. After 30 days, review what those days looked like. Were there setups you would have taken that turned out to be losers? This exercise often reveals that the days you chose not to trade were genuinely lower-quality days — and that your instinct to sit out was correct. Building confidence in your own judgment about market quality is as important as building confidence in your setup identification.</div></div>`},
'16-05a':{title:'Kill Candles',content:`<p>A kill candle is a large, decisive candle that reverses a move and traps traders on the wrong side. It is one of the most important concepts in short-term trading — when you see one, something significant has shifted.</p>
<h3>What it looks like</h3>
<p>A kill candle is typically 2-3x the size of the surrounding candles. It closes near its extreme — a bearish kill candle closes near its low, a bullish kill candle closes near its high. The body is large relative to the wicks.</p>
<h3>Why it matters</h3>
<p>Every trader who bought the move into the kill candle is now underwater. That trapped positioning creates selling pressure — they become forced sellers as the stock continues against them. The kill candle is not just a candle, it is the beginning of a cascade.</p>
<div class="callout"><div class="callout-label">TST Edge</div><p>When a stock breaks out and immediately puts in a kill candle, that breakout is a failed breakout. The buyers are trapped. Do not buy the next bounce — that is the short entry.</p></div>`},
'16-05b':{title:'Fake 2nd Higher Lows',content:`<p>A fake second higher low is a pattern where a stock appears to be building a valid higher low — setting up for continuation — but the "higher low" fails and price breaks down through the first low.</p>
<h3>The setup</h3>
<p>Stock makes a low, bounces, pulls back to what looks like a higher low, then instead of continuing higher it breaks below the first low. Every buyer at the "higher low" is now trapped and becomes a forced seller.</p>
<h3>How to avoid being trapped</h3>
<ul>
<li>Wait for the higher low to hold and show a bounce candle before entering</li>
<li>Volume should contract at the higher low — if volume is expanding on the pullback, sellers are still aggressive</li>
<li>A break below the midpoint of the prior bounce is a warning sign the higher low is failing</li>
</ul>
<div class="callout"><div class="callout-label">TST Edge</div><p>The fake second higher low is most common after a weak initial bounce. If the first bounce off the low was sluggish and low-volume, the second low is likely to fail. Strong bounces create valid higher lows. Weak bounces create fakes.</p></div>`},
'16-05c':{title:'Stop Loss Hunts',content:`<p>A stop loss hunt is a deliberate move by algorithms or institutions to push price through a level where retail stops are clustered, trigger those stops, and then reverse. It is engineered volatility designed to take money from retail traders.</p>
<h3>How to recognize it</h3>
<ul>
<li>Price spikes briefly through a key level (support, round number, prior low) then immediately reverses</li>
<li>The move is fast — 1-3 candles max</li>
<li>Volume spikes on the hunt then immediately dries up on the recovery</li>
<li>The candle has a long wick through the level with a close back on the other side</li>
</ul>
<h3>How to trade it</h3>
<p>After a confirmed stop hunt (price reclaims the level on the next candle), that reclaim is a long entry. Your stop is below the hunt low. The target is the other side of the range.</p>
<div class="callout"><div class="callout-label">TST Edge</div><p>Never place your stop at the obvious level. If support is at $50.00, your stop should not be at $49.95. Put it at $49.70 or lower — below where the hunt would reach. This keeps you in the trade when the hunt happens.</p></div>`},
'16-05d':{title:'Trapped Shorts',content:`<p>Trapped shorts occur when short sellers enter a position expecting a stock to fall, but the stock reverses and rips higher. As the stock moves against them, they are forced to cover (buy back shares), which adds fuel to the move higher.</p>
<h3>What creates trapped shorts</h3>
<ul>
<li>A stock that breaks below support, then immediately reclaims it</li>
<li>A news catalyst after a heavily shorted stock has been declining</li>
<li>A failed breakdown that reverses on high volume</li>
</ul>
<h3>How to trade it</h3>
<p>When you identify trapped shorts, the move higher can be explosive and fast. The short covering (forced buying) adds to genuine buying pressure. Entry is on the reclaim of the level where shorts entered. Stop is below the reclaim candle.</p>
<div class="callout"><div class="callout-label">TST Edge</div><p>Check short interest before trading a reversal. A stock with 20%+ short interest that breaks a key level to the upside has enormous short covering fuel. That fuel can push prices far beyond what fundamentals justify.</p></div>`},
'16-05e':{title:'Weak Second Legs = Reversal',content:`<p>In a trending move, price typically advances in legs. The first leg is strong. If the second leg is significantly weaker — smaller in magnitude, lower volume, slower momentum — that weakness signals the trend is exhausting.</p>
<h3>What to look for</h3>
<ul>
<li>Second leg gains less ground than the first</li>
<li>Volume is lower on the second leg than the first</li>
<li>The move takes longer to develop — momentum is slowing</li>
<li>The pullback between legs was deeper than expected</li>
</ul>
<h3>The trade</h3>
<p>A weak second leg followed by a break of the low between the two legs is a reversal signal. The pattern is complete when the stock takes out the pullback low between leg 1 and leg 2.</p>
<div class="callout"><div class="callout-label">TST Edge</div><p>Three pushes with diminishing size is the most reliable version of this pattern. If you see a stock make three attempts at a level with each push weaker than the last, that level is likely to hold and the reversal will be sharp.</p></div>`},
'16-06':{title:'Staircase Up Elevator Down',content:`<p>Stocks often go up slowly and come down fast. This asymmetry is one of the most important concepts in trading — it defines how you size, where you take profits, and how aggressively you cut losses.</p>
<h3>Why it happens</h3>
<p>Going up, buyers are in control and the move is orderly — institutions accumulate gradually. When sellers take control, the move is disorderly — stops trigger, margin calls force selling, fear accelerates the decline. Supply overwhelms demand instantly.</p>
<h3>Trading implications</h3>
<ul>
<li>Take profits into strength on the way up — do not wait for the top</li>
<li>Cut losses immediately — the down move is faster than you expect</li>
<li>Do not average down into falling stocks expecting them to recover slowly</li>
<li>Shorts work faster than longs — account for speed in your targets</li>
</ul>
<div class="callout"><div class="callout-label">TST Edge</div><p>Parabolic moves are the extreme version of this. A stock that goes up 200% over 3 weeks can give it all back in 3 days. The staircase up, elevator down principle is why you never hold a parabolic move hoping for more.</p></div>`},
'16-07':{title:'Repeated vs Slow Resistance Attacks',content:`<p>How a stock attacks resistance tells you whether it is likely to break through or fail. Multiple rapid attacks on a level indicate urgency and buying pressure. A slow, grinding approach indicates weakening momentum.</p>
<h3>Repeated attacks (bullish)</h3>
<p>The stock hits resistance, pulls back slightly, immediately attacks again. Each pullback is shallow. This pattern indicates aggressive buyers who are not giving up. A break through is likely.</p>
<h3>Slow attacks (bearish signal)</h3>
<p>The stock takes a long time to get back to resistance. Each approach is slower than the last. Volume is declining. This indicates buyers are losing interest — the level is likely to hold.</p>
<div class="callout"><div class="callout-label">TST Edge</div><p>Watch the character of the approach to resistance in real time. A stock that gets rejected and immediately snaps back is different from one that drifts back over 30 minutes. The speed of the recovery tells you how eager buyers are.</p></div>`},
'16-08':{title:'Accumulation vs Distribution',content:`<p>Accumulation is when smart money is quietly buying a stock without pushing the price up significantly. Distribution is when smart money is quietly selling into retail buying. Both happen before the major move — up for accumulation, down for distribution.</p>
<h3>Signs of accumulation</h3>
<ul>
<li>Tight price range with above-average volume — price not falling despite selling pressure</li>
<li>Higher lows forming within a flat or slightly rising range</li>
<li>Volume spikes on up days, contraction on down days</li>
</ul>
<h3>Signs of distribution</h3>
<ul>
<li>Tight price range near highs with above-average volume — price not rising despite buying</li>
<li>Lower highs forming within a flat or slightly declining range</li>
<li>Volume spikes on down days, contraction on up days</li>
</ul>
<div class="callout"><div class="callout-label">TST Edge</div><p>The key insight: when price doesn't move on high volume, someone large is absorbing the opposite side. In accumulation, a large buyer is absorbing all sellers. In distribution, a large seller is absorbing all buyers. Follow the smart money.</p></div>`},
'16-09':{title:'Gap Holds & Power Hour',content:`<p>A gap hold is when a stock that opens with a gap (up or down) refuses to fill that gap during the trading session. It signals strong directional conviction — the market does not want to revisit those prices.</p>
<h3>Gap holds (bullish)</h3>
<p>Stock gaps up and never trades back to the prior close. Every dip is bought. This is a strong signal that buyers are in complete control. The gap becomes support.</p>
<h3>Power Hour (3:00-4:00 PM EST)</h3>
<p>The last hour of trading often sees increased volume and directional moves as institutional orders are filled before close. Stocks that have been strong all day frequently push higher in power hour. Stocks that have been weak often accelerate lower.</p>
<div class="callout"><div class="callout-label">TST Edge</div><p>If a stock holds its gap all day and enters power hour still above the gap level, that is a high-conviction long for the power hour push. The gap hold + power hour combination produces some of the most reliable end-of-day momentum trades.</p></div>`},
'16-10':{title:'Blue Sky Setup',content:`<p>A blue sky setup occurs when a stock breaks to an all-time high or multi-year high with no overhead resistance. There are no previous sellers sitting at a loss waiting to break even — the path of least resistance is higher.</p>
<h3>Why blue sky is powerful</h3>
<p>Most breakouts fail because there is supply overhead — sellers who bought at higher prices and are now breaking even, eager to exit. In a blue sky breakout, those sellers do not exist. Every holder is profitable and has no urgency to sell.</p>
<h3>How to trade it</h3>
<ul>
<li>Entry on the breakout above the all-time high on volume</li>
<li>Stop below the breakout candle or the prior consolidation</li>
<li>Targets are estimated using measured moves (the height of the prior base added to the breakout point)</li>
<li>Trail your stop aggressively as price moves — there is no technical target above</li>
</ul>
<div class="callout"><div class="callout-label">TST Edge</div><p>Blue sky breakouts on strong fundamental catalysts — earnings beats, FDA approvals, major contracts — are the highest-conviction version of this setup. The catalyst removes the "why is it going up?" uncertainty and creates genuine urgency to own the stock.</p></div>`},
'16-11':{title:'V-Shape Recovery',content:`<p>A V-shape recovery is a sharp decline followed by an equally sharp recovery, forming a V pattern on the chart. The stock crashes to a low and then immediately reverses without any base or consolidation.</p>
<h3>Why V-shapes are tricky</h3>
<p>V-shapes look like obvious buy opportunities at the bottom. But many apparent V-shapes become W-shapes — the initial recovery fails, the stock retests the low (sometimes breaking it), then makes the real recovery. Buyers at the V bottom often get shaken out at the W low.</p>
<h3>Trading V-shapes correctly</h3>
<ul>
<li>Do not buy the initial V recovery aggressively</li>
<li>Wait for the recovery to stall and consolidate</li>
<li>Buy the breakout above the consolidation after the initial bounce</li>
<li>If a W forms, the second low (with a reversal candle) is the higher-conviction entry</li>
</ul>
<div class="callout"><div class="callout-label">TST Edge</div><p>V-shapes work best when the initial decline was a stop hunt or liquidity sweep — a fast, engineered move that immediately reverses. When the V is caused by genuine selling (bad news, technical breakdown), it usually becomes a W or worse.</p></div>`},
'16-12':{title:'Bull Trap & Bear Trap',content:`<p>A bull trap is when price breaks above resistance, luring in buyers, then immediately reverses back below. Buyers are trapped with losses. A bear trap is the inverse — price breaks below support, luring in shorts, then reverses above. Shorts are trapped.</p>
<h3>Bull trap characteristics</h3>
<ul>
<li>Brief break above a well-known resistance level</li>
<li>Low volume on the break — no real conviction</li>
<li>Immediate reversal with a large bearish candle (often a kill candle)</li>
<li>Price closes back below resistance within 1-3 candles</li>
</ul>
<h3>Bear trap characteristics</h3>
<ul>
<li>Brief break below a well-known support level</li>
<li>Immediate reversal and reclaim of support on volume</li>
<li>Often accompanied by a stop loss hunt (the break triggers retail stops)</li>
</ul>
<div class="callout"><div class="callout-label">TST Edge</div><p>The best trade after a bull trap is the short — not the recovery. After a confirmed bull trap (failed breakout with a kill candle closing back below resistance), that resistance is now confirmed strong. Short the first bounce back to it.</p></div>`},
'16-13':{title:'Green to Red & Vice Versa',content:`<p>Green to red (G2R) is when a stock opens above the prior close (in the green) and then sells off below it (into the red). It is a powerful bearish signal. Red to green (R2G) is the inverse — opens below prior close and rallies above it — a powerful bullish signal.</p>
<h3>Green to Red (bearish)</h3>
<p>Every buyer from the open is now underwater. The disappointment and forced selling from trapped longs accelerates the decline. G2R moves often continue significantly lower once the prior close breaks.</p>
<h3>Red to Green (bullish)</h3>
<p>Every short from the open is now losing money. Short covering (forced buying) adds fuel to the move. R2G moves often continue significantly higher once the prior close reclaims.</p>
<div class="callout"><div class="callout-label">TST Edge</div><p>The R2G setup on a stock with news is one of the cleanest momentum setups in the playbook. Stock opens down on misunderstood news, buyers come in, stock reclaims prior close — that reclaim triggers short covering and creates a fast, clean move higher.</p></div>`},
'16-14':{title:'Mean Reversion',content:`<p>Mean reversion is the tendency of prices to return to their average after moving significantly away from it. Stocks that have moved far from their moving averages, VWAP, or historical ranges tend to revert back to those levels.</p>
<h3>Key mean reversion levels</h3>
<ul>
<li><strong>VWAP</strong> — intraday mean. Stocks extended far from VWAP tend to revert to it</li>
<li><strong>8 EMA / 20 EMA</strong> — short-term mean on daily charts</li>
<li><strong>50 SMA</strong> — medium-term mean</li>
<li><strong>200 SMA</strong> — long-term mean</li>
</ul>
<h3>Trading mean reversion</h3>
<p>The setup: stock is significantly extended from its mean, shows signs of exhaustion (small candles, volume divergence, topping pattern), and begins to reverse. Entry is on the first reversal signal. Target is the mean itself.</p>
<div class="callout"><div class="callout-label">TST Edge</div><p>Mean reversion trades have a defined target — the average. This makes them easier to manage than momentum trades where the target is less clear. When you enter a mean reversion trade, you know where you are going.</p></div>`},
'16-15':{title:'Exhaustion Signals',content:`<p>Exhaustion signals are technical indications that a move is running out of energy — that the dominant side (buyers or sellers) is losing conviction and a reversal or significant pause is imminent.</p>
<h3>Key exhaustion signals</h3>
<ul>
<li><strong>Volume divergence</strong> — price makes new highs/lows but volume is declining</li>
<li><strong>Diminishing candle size</strong> — each candle in the move is smaller than the last</li>
<li><strong>Long wicks</strong> — price reaches new extremes but closes back in the middle</li>
<li><strong>Three pushes</strong> — three legs in the same direction, each smaller than the last</li>
<li><strong>Gap exhaustion</strong> — the stock gaps in the direction of the trend but immediately fails to follow through</li>
</ul>
<div class="callout"><div class="callout-label">TST Edge</div><p>No single exhaustion signal is reliable in isolation. Look for confluence — two or three signals occurring simultaneously at a key level. A stock making a third push to resistance with declining volume and a shooting star candle is a high-conviction reversal setup.</p></div>`},
'16-16':{title:'Capitulation Longs & Shorts',content:`<p>This lesson covers the essential concepts of <strong>Capitulation Longs & Shorts</strong>. Full content coming soon.</p>
<ul><li>Setup: extreme move down with high volume, then reversal candle</li><li>Psychology: weak hands shaken out, strong hands step in</li><li>Entry: on the reversal bar after the washout — not on the washout itself</li><li>Not on the washout candle itself</li></ul>`},
'16-17':{title:'Best Trades Rarely Full Size',content:`<p>The best setups in trading are often the ones that feel too risky to take full size on. They are uncomfortable — the stock has already moved significantly, the entry feels "late," or the pattern is less textbook than you would like.</p>
<h3>Why this happens</h3>
<p>The setups that feel safest — the ones where everything is perfect and you are confident — are often the ones that have already priced in the move. The market does not reward comfort. It rewards patience and the ability to act when others are afraid.</p>
<h3>The solution</h3>
<p>Define your risk before every trade. If the risk per share is acceptable and the setup is valid, take the trade at your normal size. Do not let discomfort shrink your size on your best setups. Do not let comfort expand your size on mediocre ones.</p>
<div class="callout"><div class="callout-label">TST Edge</div><p>Review your trade journal for this pattern. Many traders find their best P&amp;L trades were taken at smaller size because they felt uncomfortable. Your edge is in taking your process-driven trades at consistent size — not in varying size based on how confident you feel.</p></div>`},
'16-18':{title:'Pyramiding Winners',content:`<p>Pyramiding is adding to a winning position as it moves in your favor. Done correctly, it is one of the most powerful profit-maximizing strategies. Done incorrectly, it turns a winning trade into a disaster when the stock reverses.</p>
<h3>The right way to pyramid</h3>
<ul>
<li>First entry: largest size (50% of planned total)</li>
<li>Second add: after price confirms the move (25% of planned total), stop moves to breakeven on first entry</li>
<li>Third add: after another confirmation (25% of planned total), stop trails the move</li>
<li>Each add is smaller than the last — you are never adding more than you already have</li>
</ul>
<h3>The wrong way</h3>
<p>Adding equal or larger size at each level. If the stock reverses after your third add, you lose on all three entries simultaneously — often wiping out the profit from the first two.</p>
<div class="callout"><div class="callout-label">TST Edge</div><p>Move your stop to breakeven on your first entry before adding the second. This ensures that even if the second add loses, your first entry cannot lose. Never risk your initial profit to make more profit.</p></div>`},
'16-19':{title:'The Opening Drive',content:`<p>The first 15-30 minutes of the trading session is called the opening drive. This is when institutional players establish their positions for the day and the market's true directional bias is revealed.</p>
<h3>Reading the opening drive</h3>
<ul>
<li><strong>Strong upside open</strong> — buyers are in control, momentum is likely to continue intraday</li>
<li><strong>Weak open with immediate selling</strong> — sellers are in control, look for short setups and failed bounces</li>
<li><strong>Choppy open</strong> — no clear directional bias, wait for a range to establish and trade the breakout</li>
</ul>
<h3>The opening drive and your watchlist</h3>
<p>During the opening drive, your watchlist stocks show their character for the day. A stock on your long watchlist that immediately gaps up and holds is showing you that buyers are already there. A stock that gaps up and immediately fails is telling you the setup is not ready.</p>
<div class="callout"><div class="callout-label">TST Edge</div><p>The opening drive is the most important 30 minutes of the trading day for setting your directional bias. If the market opens strong and your long setups are working immediately, lean long for the session. If everything is failing at the open, stay small and defensive.</p></div>`},
'17-01':{title:'The Reality of Trading',content:`<p>This lesson covers the essential concepts of <strong>The Reality of Trading</strong>. Full content coming soon.</p>
<ul><li>Fear and greed are constant — prepare for this</li><li>Winning trades feel boring; losing trades feel exciting and teach more</li><li>The gap between knowing the plan and executing the plan</li><li>Mental preparation before the market opens</li></ul>`},
'17-02':{title:'Base Hits Over Home Runs',content:`<p>Consistency in trading comes from base hits - small, repeatable wins that compound over time. Most beginners are swinging for home runs on every trade - oversized positions, lottery ticket options, all-in bets on a single catalyst. Home runs feel good when they work. But they destroy accounts when they do not. A trader who makes 1% per day consistently will outperform a trader swinging for 20% every week. Focus on the process, not the payout. Stack base hits and let compounding do the work.</p>`},
'17-03':{title:'The Effect of Larger Position Sizes',content:`<p>This lesson covers the essential concepts of <strong>The Effect of Larger Position Sizes</strong>. Full content coming soon.</p>
<ul><li>Psychological impact of trading larger size</li><li>Decision quality deteriorates at the wrong size</li><li>Finding your execution sweet spot</li><li>The confidence trap: feeling right before a blowup</li></ul>`},
'17-04':{title:'Trading Through Drawdowns',content:`<p>A drawdown is a period of consecutive losses or a significant reduction in your account value from a previous peak. Every trader experiences drawdowns. How you respond to them determines whether you survive and grow or blow up your account trying to get even.</p><h3>The Psychology of a Drawdown</h3><p>When you are in a drawdown, your thinking changes in predictable ways that make it worse. You start taking trades you would not normally take because you feel the need to make the money back. You hold losers longer hoping they will recover. You cut winners too early because you are afraid of giving back gains. Each of these behaviors is emotional, not rational, and each makes the drawdown deeper.</p><h3>The Rules for Drawdowns</h3><p>First, cut your size immediately. If you have lost more than 5% of your account in a week, reduce position size by 50% until you return to profitability. If you have lost 10%, stop trading for at least two days and review every trade you have taken. Second, only take A-quality setups. No B-minus setups trying to scalp back losses. High quality only. Third, do not try to make the money back in one trade. It took multiple trades to create the drawdown and it will take multiple trades to recover from it.</p><h3>When to Stop Trading Completely</h3><p>If you have lost 15% or more of your account in a short period, stop trading completely. Review everything. Talk to someone you trust about what happened. The trades will still be there when you come back. The market is always open. Your capital is finite. Protect it first.</p><h3>The Recovery</h3><p>Recovering from a drawdown requires patience more than aggression. Return to your smallest position sizes. Take only your clearest setups. Focus entirely on execution quality rather than P&L. The money comes back when your process is right. Chasing the money directly almost always makes the drawdown worse.</p><div class="callout"><div class="callout-label">TST Edge</div><p>The traders who survive long enough to become consistently profitable are not the ones who never had drawdowns. They are the ones who learned to contain their drawdowns before they became catastrophic. A 10% drawdown that you manage correctly is a learning experience. A 50% drawdown that you let spiral is potentially career-ending.</p></div>`},
'17-05':{title:'Overtrading Warning Signs & Prevention',content:`<p>This lesson covers the essential concepts of <strong>Overtrading Warning Signs & Prevention</strong>. Full content coming soon.</p>
<ul><li>Why more trades equals less money for most traders</li><li>Causes: FOMO, boredom, the need to feel active</li><li>Daily trade limits and how to enforce them</li><li>Cost of overtrading: slippage, commissions, mental energy</li></ul>`},
'17-06':{title:'Maladaptive Responses to Losses',content:`<p>This lesson covers the essential concepts of <strong>Maladaptive Responses to Losses</strong>. Full content coming soon.</p>
<ul><li>Revenge trading: doubling down after a loss</li><li>Averaging down: adding to losers</li><li>Ignoring rules during panic</li><li>vs Adaptive responses: reviewing, adjusting, accepting variance</li></ul>`},
'17-07':{title:'The Playbook Mindset',content:`<p>A playbook is a defined set of setups, rules, and conditions that you follow with consistency - regardless of emotion, regardless of what the market is doing, regardless of your last trade. Professional traders do not freestyle. They execute a playbook. They know exactly what they are looking for, exactly when the conditions are met, and exactly what they do when they are. The playbook mindset means you are not making decisions in the heat of the moment - you already made them. You are just executing.</p>`},
'17-08':{title:'Burnout Recognition & Prevention',content:`<p>This lesson covers the essential concepts of <strong>Burnout Recognition & Prevention</strong>. Full content coming soon.</p>
